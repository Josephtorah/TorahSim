<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Georgia,serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e5417"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a33b1f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#fbf8f0"/>
<text x="480.0" y="28.0" text-anchor="middle" font-size="14" fill="#1e1b14" font-weight="bold">The Hebrew slave's clock, and the interrupt that crosses books (Exodus 21:2-6 with Leviticus 25:10)</text>
<rect x="40" y="80" width="200" height="90" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="140.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">ACQUIRED</text>
<text x="140.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">ink 21:2: 'when you acquire'</text>
<text x="140.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">term_clock set: six years</text>
<rect x="330" y="80" width="220" height="90" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="440.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">SERVING</text>
<text x="440.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">timer runs; deduction of money</text>
<text x="440.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">is a computed early exit [Kiddushin 16a]</text>
<rect x="660" y="80" width="240" height="90" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="780.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d8a">FREE  (year seven)</text>
<text x="780.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">ink 21:2: 'in the seventh he goes out free'</text>
<text x="780.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">effect goes_free, timer fires</text>
<line x1="240.0" y1="125.0" x2="330.0" y2="125.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<line x1="550.0" y1="125.0" x2="660.0" y2="125.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="605.0" y="119.0" text-anchor="middle" font-size="10.5" fill="#2f5d8a">timer fires at year 6</text>
<rect x="330" y="240" width="220" height="100" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="440.0" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b1f">PIERCED  'forever'</text>
<text x="440.0" y="278" text-anchor="middle" font-size="11" fill="#57503f">ink 21:5-6: the slave's own declaration</text>
<text x="440.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">the six-year timer is CANCELLED</text>
<text x="440.0" y="308" text-anchor="middle" font-size="11" fill="#57503f">engine: cancel_timers()</text>
<line x1="440.0" y1="170.0" x2="440.0" y2="240.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="440.0" y="201.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">declares 'I love my master'</text>
<rect x="660" y="240" width="240" height="100" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="780.0" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b1f">JUBILEE RELEASE</text>
<text x="780.0" y="278" text-anchor="middle" font-size="11" fill="#57503f">Leviticus 25:10 'you shall return every man'</text>
<text x="780.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">Kiddushin 15a: written for the pierced one</text>
<text x="780.0" y="308" text-anchor="middle" font-size="11" fill="#57503f">effect jubilee_release, a 50-year timer</text>
<line x1="550.0" y1="290.0" x2="660.0" y2="290.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="605.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">IMPORT from another book</text>
<text x="480.0" y="385.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">'Forever' is a scoped constant; its scope is set in Leviticus. Daemon: world_engine.law_slave_term.</text>
</svg>
