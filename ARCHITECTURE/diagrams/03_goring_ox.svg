<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Georgia,serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e5417"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a33b1f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker></defs>
<rect x="0" y="0" width="900" height="380" fill="#fbf8f0"/>
<text x="450.0" y="28.0" text-anchor="middle" font-size="14" fill="#1e1b14" font-weight="bold">The goring ox: a two-state machine with a counted transition (Exodus 21:28-36)</text>
<rect x="60" y="90" width="260" height="110" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="190.0" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">INNOCUOUS  (tam)</text>
<text x="190.0" y="128" text-anchor="middle" font-size="11" fill="#57503f">damage to an ox: pays HALF,</text>
<text x="190.0" y="143" text-anchor="middle" font-size="11" fill="#57503f">out of the ox's own body</text>
<text x="190.0" y="158" text-anchor="middle" font-size="11" fill="#57503f">ink 21:35: 'they divide'</text>
<rect x="580" y="90" width="260" height="110" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="710.0" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b1f">FOREWARNED  (muad)</text>
<text x="710.0" y="128" text-anchor="middle" font-size="11" fill="#57503f">damage to an ox: pays FULL</text>
<text x="710.0" y="143" text-anchor="middle" font-size="11" fill="#57503f">ink 21:36: 'ox for ox'</text>
<text x="710.0" y="158" text-anchor="middle" font-size="11" fill="#57503f">human victim: ransom may be imposed (21:30)</text>
<line x1="320.0" y1="130.0" x2="580.0" y2="130.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="450.0" y="122.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">third goring -&gt; flips  [Bava Kamma 23b: yesterday + day-before = three]</text>
<line x1="580.0" y1="170.0" x2="320.0" y2="170.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<text x="450.0" y="186.0" text-anchor="middle" font-size="10" fill="#6e5417">reverts: three days restrained, or children handle it and it does not gore  [Mishnah Bava Kamma 2:4]</text>
<rect x="330" y="250" width="240" height="90" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="450.0" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d8a">either state, human victim</text>
<text x="450.0" y="288" text-anchor="middle" font-size="11" fill="#57503f">the ox is STONED (21:28-29)</text>
<text x="450.0" y="303" text-anchor="middle" font-size="11" fill="#57503f">slave victim: thirty shekels fixed (21:32)</text>
<line x1="190.0" y1="200.0" x2="370.0" y2="250.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<line x1="710.0" y1="200.0" x2="530.0" y2="250.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="450.0" y="365.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">Effects written: pays (half or full), forewarned (status), stoned, ransom_imposed, gives_fixed_sum. Daemon: world_engine.law_goring_ox.</text>
</svg>
