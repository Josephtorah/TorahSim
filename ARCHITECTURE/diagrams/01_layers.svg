<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Georgia,serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e5417"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a33b1f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#fbf8f0"/>
<text x="490.0" y="30.0" text-anchor="middle" font-size="14" fill="#1e1b14" font-weight="bold">The six layers of the compiled code, and how data moves between them (counts of 2026-09-13)</text>
<rect x="30" y="60" width="260" height="120" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="160.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">0  INK</text>
<text x="160.0" y="98" text-anchor="middle" font-size="11" fill="#57503f">tanakh.sqlite: words, lemmas,</text>
<text x="160.0" y="113" text-anchor="middle" font-size="11" fill="#57503f">cantillation marks, scribal dots</text>
<text x="160.0" y="128" text-anchor="middle" font-size="11" fill="#57503f">the whole Hebrew Bible, read-only</text>
<rect x="360" y="60" width="260" height="120" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="490.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">1  SPEC  (frozen units)</text>
<text x="490.0" y="98" text-anchor="middle" font-size="11" fill="#57503f">logic/units/*.yaml, one claim set per span</text>
<text x="490.0" y="113" text-anchor="middle" font-size="11" fill="#57503f">210 frozen: Genesis 73, Exodus 41, Leviticus 49, Numbers 47</text>
<text x="490.0" y="128" text-anchor="middle" font-size="11" fill="#57503f">rendered as assert-backed logic/py_units/*.py</text>
<rect x="690" y="60" width="260" height="120" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="820.0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e5417">2  WORLD  (the fold)</text>
<text x="820.0" y="98" text-anchor="middle" font-size="11" fill="#57503f">corpus_world.py + entity_registry.yaml</text>
<text x="820.0" y="113" text-anchor="middle" font-size="11" fill="#57503f">210 units -&gt; 1,809 facts,</text>
<text x="820.0" y="128" text-anchor="middle" font-size="11" fill="#57503f">341 demands (191 open), standing 2,163</text>
<text x="820.0" y="143" text-anchor="middle" font-size="11" fill="#57503f">hash 8b8fff1fa28953af</text>
<rect x="30" y="300" width="260" height="130" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="160.0" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b1f">3  CODE  (cold runs)</text>
<text x="160.0" y="338" text-anchor="middle" font-size="11" fill="#57503f">World/step9/cold_run_*.py</text>
<text x="160.0" y="353" text-anchor="middle" font-size="11" fill="#57503f">57 runners, 427 compiled functions</text>
<text x="160.0" y="368" text-anchor="middle" font-size="11" fill="#57503f">6,378 graded cells, 57/57 on the sweep</text>
<text x="160.0" y="383" text-anchor="middle" font-size="11" fill="#57503f">every verdict carries registry effects</text>
<rect x="360" y="300" width="260" height="130" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="490.0" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d8a">4  TEST  (the exam)</text>
<text x="490.0" y="338" text-anchor="middle" font-size="11" fill="#57503f">*_rules.py + cases_*.yaml + vocabulary.yaml</text>
<text x="490.0" y="353" text-anchor="middle" font-size="11" fill="#57503f">47 rounds, 1,595/1,595; the union-rule dockets</text>
<text x="490.0" y="368" text-anchor="middle" font-size="11" fill="#57503f">43 rules modules, 47 case files</text>
<text x="490.0" y="383" text-anchor="middle" font-size="11" fill="#57503f">158 dimensions, 1,501 values</text>
<rect x="690" y="300" width="260" height="130" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="820.0" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d8a">5  RUNTIME  (the engine)</text>
<text x="820.0" y="338" text-anchor="middle" font-size="11" fill="#57503f">World/step9/world_engine.py</text>
<text x="820.0" y="353" text-anchor="middle" font-size="11" fill="#57503f">entities with ledgers, laws as daemons,</text>
<text x="820.0" y="368" text-anchor="middle" font-size="11" fill="#57503f">timers, the calendar, the journal, the diff engine</text>
<text x="820.0" y="383" text-anchor="middle" font-size="11" fill="#57503f">62 daemons; one tape, 1,279 events, 157 dates</text>
<rect x="30" y="480" width="920" height="60" rx="9" fill="#fffdf6" stroke="#57503f" stroke-width="2"/>
<text x="490.0" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#57503f">cross-cutting registries</text>
<text x="490.0" y="518" text-anchor="middle" font-size="11" fill="#57503f">effect_vocabulary.yaml (1,012 effects, 8 ledger ops)  ·  MOVE_CATALOG.md (M-01..M-30)  ·  MIDDOT.md  ·  findings F-001..  ·  entity_registry.yaml</text>
<line x1="290.0" y1="120.0" x2="360.0" y2="120.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="325.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#6e5417">derive (Step 2-3)</text>
<line x1="620.0" y1="120.0" x2="690.0" y2="120.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="655.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#6e5417">fold, in canonical order</text>
<line x1="160.0" y1="180.0" x2="160.0" y2="300.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="160.0" y="236.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">compile from the ink alone (motion 1)</text>
<line x1="360.0" y1="350.0" x2="290.0" y2="350.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="325.0" y="342.0" text-anchor="middle" font-size="10.5" fill="#2f5d8a">grade (motions 3-5)</text>
<line x1="290.0" y1="390.0" x2="360.0" y2="390.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="325.0" y="404.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">misses -&gt; Talmud -&gt; labeled move</text>
<line x1="620.0" y1="365.0" x2="690.0" y2="365.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="655.0" y="359.0" text-anchor="middle" font-size="10.5" fill="#2f5d8a">declared checkpoints</text>
<path d="M 290.0 320.0 Q 490.0 280.0 690.0 320.0" fill="none" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="490.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">wrapped as daemons</text>
<line x1="820.0" y1="180.0" x2="820.0" y2="300.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="820.0" y="236.0" text-anchor="middle" font-size="10.5" fill="#6e5417">population: entities, events, closers</text>
<path d="M 440.0 180.0 Q 324.6 214.3 240.0 300.0" fill="none" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<text x="332.3" y="253.1" text-anchor="middle" font-size="10.5" fill="#a33b1f">findings auto-seat back into the units</text>
<line x1="490.0" y1="480.0" x2="490.0" y2="430.0" stroke="#57503f" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<line x1="160.0" y1="480.0" x2="160.0" y2="430.0" stroke="#57503f" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<text x="490.0" y="555.0" text-anchor="middle" font-size="11" fill="#57503f" font-style="italic">Layers 1 and 2 are the proof machine (one execution, replayed to the hash). Layers 3 to 5 are the simulation machine.</text>
</svg>
