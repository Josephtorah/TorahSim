<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Georgia,serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e5417"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a33b1f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" fill="#fbf8f0"/>
<text x="500.0" y="28.0" text-anchor="middle" font-size="14" fill="#1e1b14" font-weight="bold">The affliction machine (Leviticus 13-14): three tracks, shared-day weeks, and the ten houses</text>
<text x="60.0" y="70.0" text-anchor="start" font-size="12" fill="#6e5417" font-weight="bold">PERSON  (skin, boil, burn, scall, bald)</text>
<rect x="40" y="85" width="170" height="70" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="125.0" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">examined</text>
<text x="125.0" y="123" text-anchor="middle" font-size="11" fill="#57503f">ink 13:3: the priest sees</text>
<rect x="260" y="85" width="170" height="70" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="345.0" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT-IN week 1</text>
<text x="345.0" y="123" text-anchor="middle" font-size="11" fill="#57503f">ink 13:4 'and he shall shut'</text>
<rect x="480" y="85" width="170" height="70" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="565.0" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT-IN week 2</text>
<text x="565.0" y="123" text-anchor="middle" font-size="11" fill="#57503f">skin, scall, bald only;</text>
<text x="565.0" y="138" text-anchor="middle" font-size="11" fill="#57503f">boil and burn: one week (ink's silence)</text>
<rect x="720" y="60" width="240" height="60" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="840.0" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b1f">DECREED IMPURE</text>
<text x="840.0" y="98" text-anchor="middle" font-size="11" fill="#57503f">isolated_outside_camp (13:45-46)</text>
<rect x="720" y="140" width="240" height="60" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="840.0" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">RELEASED</text>
<text x="840.0" y="178" text-anchor="middle" font-size="11" fill="#57503f">ink 13:6: washed and pure</text>
<line x1="210.0" y1="120.0" x2="260.0" y2="120.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="235.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#6e5417">no sign yet</text>
<line x1="430.0" y1="120.0" x2="480.0" y2="120.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="455.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#6e5417">stood</text>
<line x1="650.0" y1="105.0" x2="720.0" y2="90.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="685.0" y="87.5" text-anchor="middle" font-size="10" fill="#a33b1f">a decreeing sign</text>
<line x1="650.0" y1="135.0" x2="720.0" y2="165.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="685.0" y="164.0" text-anchor="middle" font-size="10" fill="#2f5d8a">dim or gone</text>
<path d="M 430.0 100.0 Q 572.4 57.6 720.0 75.0" fill="none" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="573.7" y="64.6" text-anchor="middle" font-size="10" fill="#a33b1f">sign in week 1</text>
<text x="500.0" y="190.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">two weeks = THIRTEEN days: day seven closes week one and opens week two [Sifra; Mishnah Negaim 3:3]</text>
<text x="60.0" y="240.0" text-anchor="start" font-size="12" fill="#6e5417" font-weight="bold">GARMENT</text>
<rect x="40" y="255" width="170" height="60" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="125.0" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT-IN week 1</text>
<text x="125.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">ink 13:50</text>
<rect x="260" y="255" width="170" height="60" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="345.0" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT-IN week 2</text>
<text x="345.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">washed first (13:54)</text>
<rect x="480" y="255" width="170" height="60" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="565.0" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b1f">BURNED</text>
<text x="565.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">ink 13:55; effect burned_in_fire</text>
<rect x="720" y="255" width="240" height="60" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="840.0" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">washed, PURE</text>
<text x="840.0" y="293" text-anchor="middle" font-size="11" fill="#57503f">13:58; the asymmetry with the person</text>
<line x1="210.0" y1="285.0" x2="260.0" y2="285.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="235.0" y="279.0" text-anchor="middle" font-size="10.5" fill="#6e5417">stood</text>
<line x1="430.0" y1="285.0" x2="480.0" y2="285.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="455.0" y="279.0" text-anchor="middle" font-size="10.5" fill="#a33b1f">spread or stood</text>
<path d="M 430.0 300.0 Q 575.0 330.0 720.0 300.0" fill="none" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="575.0" y="333.0" text-anchor="middle" font-size="10" fill="#2f5d8a">gone after washing</text>
<text x="60.0" y="360.0" text-anchor="start" font-size="12" fill="#6e5417" font-weight="bold">HOUSE  (three weeks = NINETEEN days)</text>
<rect x="40" y="375" width="170" height="60" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="125.0" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT week 1</text>
<text x="125.0" y="413" text-anchor="middle" font-size="11" fill="#57503f">ink 14:38</text>
<rect x="260" y="375" width="170" height="60" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="345.0" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">SHUT week 2</text>
<text x="345.0" y="413" text-anchor="middle" font-size="11" fill="#57503f">after 'stood'</text>
<rect x="480" y="375" width="190" height="70" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="575.0" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#6e5417">PULL, SCRAPE, PLASTER</text>
<text x="575.0" y="413" text-anchor="middle" font-size="11" fill="#57503f">ink 14:40-42; one more week</text>
<rect x="720" y="360" width="240" height="50" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="840.0" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">PEEL, PURE</text>
<text x="840.0" y="398" text-anchor="middle" font-size="11" fill="#57503f">dim or gone in week 1</text>
<rect x="720" y="425" width="240" height="50" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="840.0" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">PEEL + BIRDS</text>
<text x="840.0" y="463" text-anchor="middle" font-size="11" fill="#57503f">stood then dim or gone; 14:49-53</text>
<rect x="480" y="490" width="190" height="60" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="575.0" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b1f">DEMOLISHED</text>
<text x="575.0" y="528" text-anchor="middle" font-size="11" fill="#57503f">ink 14:45 'and he shall tear down'</text>
<text x="575.0" y="543" text-anchor="middle" font-size="11" fill="#57503f">effect demolished</text>
<rect x="720" y="490" width="240" height="60" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="840.0" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">BIRDS  (quiet after plaster)</text>
<text x="840.0" y="528" text-anchor="middle" font-size="11" fill="#57503f">the returning fork's other arm</text>
<line x1="210.0" y1="405.0" x2="260.0" y2="405.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="235.0" y="399.0" text-anchor="middle" font-size="10.5" fill="#6e5417">stood</text>
<path d="M 210.0 390.0 Q 464.6 347.5 720.0 385.0" fill="none" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="464.8" y="361.5" text-anchor="middle" font-size="10" fill="#2f5d8a">dim / gone in week 1</text>
<path d="M 430.0 405.0 Q 571.9 447.3 720.0 450.0" fill="none" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="646.3" y="440.2" text-anchor="middle" font-size="10" fill="#2f5d8a">dim / gone in week 2</text>
<line x1="430.0" y1="420.0" x2="480.0" y2="420.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="455.0" y="436.0" text-anchor="middle" font-size="10" fill="#a33b1f">spread, or stood-stood</text>
<path d="M 125.0 435.0 Q 301.1 490.0 480.0 445.0" fill="none" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="301.8" y="485.0" text-anchor="middle" font-size="10" fill="#a33b1f">spread in week 1</text>
<line x1="575.0" y1="445.0" x2="575.0" y2="490.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="575.0" y="463.5" text-anchor="middle" font-size="10" fill="#a33b1f">RETURNED</text>
<line x1="670.0" y1="430.0" x2="720.0" y2="510.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<text x="695.0" y="482.0" text-anchor="middle" font-size="10" fill="#2f5d8a">quiet</text>
<text x="500.0" y="600.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">The ten-houses table (Sifra, Metzora, Section 7) is the teacher's own enumeration of this tree; the compiled house machine reproduces all ten rows.</text>
<text x="500.0" y="622.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">Source: cold_run_negaim.py (16/16 cells + 10/10 houses).</text>
</svg>
