<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Georgia,serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e5417"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a33b1f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#fbf8f0"/>
<text x="480.0" y="28.0" text-anchor="middle" font-size="14" fill="#1e1b14" font-weight="bold">The installation transaction (Leviticus 8): atomic components, a seven-day timer, a commit point</text>
<rect x="30" y="80" width="210" height="100" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="135.0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">COMMANDED</text>
<text x="135.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">components checked: bullock,</text>
<text x="135.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">ram (olah), ram (milluim), basket</text>
<text x="135.0" y="148" text-anchor="middle" font-size="11" fill="#57503f">missing any -&gt; ATOMIC-BLOCK, nothing happens</text>
<rect x="300" y="80" width="200" height="100" rx="9" fill="#fffdf6" stroke="#6e5417" stroke-width="2"/>
<text x="400.0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e5417">CONFINED  7 days</text>
<text x="400.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">ink 8:33 'you shall not go out'</text>
<text x="400.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">effect confined_seven_days</text>
<text x="400.0" y="148" text-anchor="middle" font-size="11" fill="#57503f">timer: released at day seven</text>
<rect x="560" y="80" width="190" height="100" rx="9" fill="#fffdf6" stroke="#a33b1f" stroke-width="2"/>
<text x="655.0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b1f">INVESTED</text>
<text x="655.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">commit at the blood sprinkling</text>
<text x="655.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">[Sifra, Mekhilta DeMiluim I 34]</text>
<text x="655.0" y="148" text-anchor="middle" font-size="11" fill="#57503f">effect invested_office</text>
<rect x="790" y="80" width="150" height="100" rx="9" fill="#fffdf6" stroke="#2f5d8a" stroke-width="2"/>
<text x="865.0" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d8a">RELEASED</text>
<text x="865.0" y="118" text-anchor="middle" font-size="11" fill="#57503f">day seven; the timer fires</text>
<text x="865.0" y="133" text-anchor="middle" font-size="11" fill="#57503f">effect released</text>
<line x1="240.0" y1="130.0" x2="300.0" y2="130.0" stroke="#6e5417" stroke-width="2" marker-end="url(#ar)"/>
<text x="270.0" y="124.0" text-anchor="middle" font-size="10.5" fill="#6e5417">all four present</text>
<line x1="500.0" y1="130.0" x2="560.0" y2="130.0" stroke="#a33b1f" stroke-width="2" marker-end="url(#arr)"/>
<text x="530.0" y="124.0" text-anchor="middle" font-size="10" fill="#a33b1f">milluim blood sprinkled</text>
<line x1="750.0" y1="130.0" x2="790.0" y2="130.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#arb)"/>
<rect x="300" y="220" width="200" height="70" rx="9" fill="#fffdf6" stroke="#57503f" stroke-width="2"/>
<text x="400.0" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#57503f">LEFTOVER</text>
<text x="400.0" y="258" text-anchor="middle" font-size="11" fill="#57503f">ink 8:32: 'what remains you shall burn'</text>
<text x="400.0" y="273" text-anchor="middle" font-size="11" fill="#57503f">effect burn_remainder</text>
<line x1="400.0" y1="180.0" x2="400.0" y2="220.0" stroke="#57503f" stroke-width="2" marker-end="url(#ar)"/>
<text x="400.0" y="196.0" text-anchor="middle" font-size="10" fill="#57503f">any remainder</text>
<text x="480.0" y="315.0" text-anchor="middle" font-size="10" fill="#57503f" font-style="italic">Daemon: world_engine.law_installation, compiled from cold_run_tzav.py F7. Scene 6 of the engine replays Leviticus 8 itself as the tape.</text>
</svg>
