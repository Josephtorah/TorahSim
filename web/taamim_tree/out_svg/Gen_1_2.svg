  <text font-family="system-ui,Segoe UI,sans-serif"><tspan x="120" y="18" text-anchor="middle" font-size="12" fill="#e6b84d">ROOT Gen.1.2</tspan><tspan x="120" y="34" text-anchor="middle" font-size="15" fill="#f0e6d3">ו/ה/ארץ היתה תהו ו/בהו ו/חשך על פני תהום ו/רוח אלהים מרחפת על פני ה/מים</tspan><tspan x="120" y="54" text-anchor="middle" font-size="12" fill="#9ecbff">ו-ה-ארץ היתה תהו ו-בהו ו-חשך</tspan><tspan x="120" y="70" text-anchor="middle" font-size="12" fill="#b8f0c8">על פני תהום ו-רוח אלהים</tspan><tspan x="120" y="86" text-anchor="middle" font-size="12" fill="#b8f0c8">מרחפת על פני ה-מים</tspan><tspan x="120" y="102" text-anchor="middle" font-size="12" fill="#8b9bb4">&quot;And the earth was formless</tspan><tspan x="120" y="118" text-anchor="middle" font-size="12" fill="#ccc">and void… spirit of God</tspan><tspan x="120" y="134" text-anchor="middle" font-size="12" fill="#ccc">hovering on the waters.&quot;</tspan></text>
</g>
