<!DOCTYPE html>

<title>The Inheritance — how Genesis feeds the law of Exodus 21</title>
<style>
:root{--bg:#12100d;--panel:#1c1915;--ink:#e8e0d0;--dim:#9a8f7a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 Georgia,serif}
header{padding:16px 24px 8px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;color:var(--gold);font-weight:normal}
h1 small{color:var(--dim);font-size:12.5px;margin-left:10px}
.stepper{display:flex;align-items:center;gap:14px;padding:10px 24px;
border-bottom:1px solid var(--line);font-size:14px}
.stepper button{background:var(--panel);color:var(--gold);
border:1px solid var(--line);border-radius:4px;padding:6px 16px;
font:inherit;cursor:pointer}
.stepper button:hover{border-color:var(--gold)}
.stepper .pos{color:var(--dim)}
.legend{margin-left:auto;font-size:11.5px;color:var(--dim)}
.legend b{font-weight:normal;padding:1px 8px;border-radius:8px;
color:#141210;margin-left:6px}
#stage{position:relative;display:flex;gap:0;padding:14px 24px}
.col{width:300px;display:flex;flex-direction:column;gap:6px}
#mid{flex:1;position:relative;min-width:200px}
#wires{position:absolute;inset:0;width:100%;height:100%;
pointer-events:none}
.blk{background:var(--panel);border:1px solid var(--line);
border-left:4px solid var(--dim);border-radius:5px;padding:6px 10px;
cursor:pointer;font-size:12.5px;position:relative}
.blk .u{color:var(--dim);font-size:10.5px;
font-family:UI-Monospace,Menlo,monospace}
.blk.gen{border-left-color:var(--gen)}
.blk.exo{border-left-color:var(--exo)}
.blk.lev{border-left-color:var(--lev)}
.blk.on{background:#2a251c;border-color:var(--gold)}
.blk.dimmed{opacity:.32}
.open-chip{position:absolute;right:8px;top:50%;transform:translateY(-50%);
font-size:10px;color:#141210;background:var(--dim);border-radius:8px;
padding:1px 7px;font-family:sans-serif}
.blk:hover .open-chip,.law:hover .open-chip{background:var(--gold)}
.law{background:var(--panel);border:1px solid var(--line);
border-radius:5px;padding:5px 10px;font-size:12.5px;cursor:pointer;
position:relative}
.law .v{color:var(--gold);font-family:UI-Monospace,Menlo,monospace;
font-size:11px}
.law.lit{border-color:var(--gold);background:#2a251c}
.law.dimmed{opacity:.32}
#detail{padding:6px 24px 26px}
.card{background:var(--panel);border:1px solid var(--line);
border-radius:6px;padding:14px 16px;margin:10px 0;max-width:980px}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.12em;
text-transform:uppercase;color:var(--dim);font-weight:normal}
.he{font-size:20px;direction:rtl;text-align:right}
.gl{color:var(--dim);font-size:12.5px;margin-bottom:8px}
.gives{padding:8px 0;font-size:14px}
.mech{font-size:11px;color:#141210;background:var(--dim);
display:Inline-Block;border-radius:8px;padding:1px 9px;
font-family:sans-serif;margin-right:8px}
.claim{font-family:UI-Monospace,Menlo,monospace;font-size:11px;
color:var(--dim)}
.arrow{color:var(--gold);font-size:18px;padding:0 6px}
.note{color:var(--dim);font-size:12.5px;max-width:980px}
.link{color:var(--gold);cursor:pointer;text-decoration:underline;
text-decoration-color:#5a4d33}
/* modal */
#veil{position:fixed;inset:0;background:rgba(6,5,3,.72);display:none;
align-items:flex-start;justify-content:center;overflow-y:auto;
padding:40px 16px;z-index:9}
#veil.show{display:flex}
#modal{background:#181510;border:1px solid var(--gold);border-radius:8px;
max-width:860px;width:100%;padding:20px 24px;position:relative}
#modal h2{margin:0 0 2px;font-size:17px;color:var(--gold);
font-weight:normal}
#modal .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
#modal .x{position:absolute;top:10px;right:14px;color:var(--dim);
cursor:pointer;font-size:20px}
.sect{margin:14px 0}
.sect h4{margin:0 0 6px;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim);font-weight:normal}
.vrow{display:flex;justify-content:space-between;gap:16px;
border-bottom:1px dotted var(--line);padding:5px 0;align-items:baseline}
.vrow .he{font-size:19px}
.vrow .gl{font-size:12px;margin:0;text-align:left;max-width:46%}
pre.code{background:#0d0b08;border:1px solid var(--line);
border-radius:6px;padding:12px;font:12px/1.55 UI-Monospace,Menlo,
monospace;white-space:pre-wrap;word-break:break-word;color:#cfc4ab;
margin:0}
pre.code .cm{color:#6e6350}
.runline{font:12px UI-Monospace,Menlo,monospace;color:var(--gen);
padding:6px 2px 0}
</style></head><body>

let SEL=-1,LSEL=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function donorFeeds(bk,id){return bk.e.some(e=>e.to===id)}
function draw(){
 let dh='';
 BLOCKS.forEach((bk,i)=>{
  let cls='';
  if(SEL>=0)cls=i===SEL?'on':'dimmed';
  else if(LSEL)cls=donorFeeds(bk,LSEL)?'on':'dimmed';
  dh+='<div class="blk '+bk.b+' '+cls+'" id="d'+i+'" '+
  'onclick="SEL=(SEL==='+i+'?-1:'+i+');LSEL=null;draw()">'+
  '<div class="u">'+(i+1)+' · '+esc(bk.u)+'</div>'+esc(bk.n)+
  ' <span style="color:var(--dim)">('+bk.e.length+
  (bk.e.length>1?' gifts':' gift')+')</span>'+
  '<span class="open-chip" onclick="event.stopPropagation();'+
  'openDonor('+i+')">verse + code</span></div>';});
 $('donors').innerHTML=dh;
 const lit=new Set(SEL>=0?BLOCKS[SEL].e.map(e=>e.to):
                   LSEL?[LSEL]:LAWS.map(l=>l.id));
 let lh='';
 LAWS.forEach(l=>{
  const cls=(SEL<0&&!LSEL)?'':(lit.has(l.id)?'lit':'dimmed');
  lh+='<div class="law '+cls+'" id="w'+l.id+'" '+
  'onclick="LSEL=(LSEL===\''+l.id+'\'?null:\''+l.id+'\');SEL=-1;draw()">'+
  '<span class="v">'+l.v+'</span> '+esc(l.t)+
  '<span class="open-chip" style="position:static;float:right" '+
  'onclick="event.stopPropagation();openLaw(\''+l.id+'\')">'+
  'verse + code</span></div>';});
 $('laws').innerHTML=lh;
 wires();detail();
 $('pos').textContent=SEL>=0?('block '+(SEL+1)+' of 20'):
  LSEL?('law '+LSEL.replace('L','21:')+' — its donors'):
  'all 20 donor blocks · 31 edges';
}
function wires(){
 const svg=$('wires'),mid=$('mid'),mr=mid.getBoundingClientRect();
 svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
 let paths='';
 const focus=SEL>=0||LSEL;
 BLOCKS.forEach((bk,i)=>{
  if(SEL>=0&&i!==SEL)return;
  const d=$('d'+i).getBoundingClientRect();
  bk.e.forEach(e=>{
   if(LSEL&&e.to!==LSEL)return;
   const w=$('w'+e.to).getBoundingClientRect();
   const y1=d.top+d.height/2-mr.top,y2=w.top+w.height/2-mr.top;
   const col=bk.b==='gen'?'#7fae7a':bk.b==='lev'?'#9a7fb8':'#c9a45c';
   paths+='<path d="M0 '+y1+' C '+(mr.width*.45)+' '+y1+', '+
   (mr.width*.55)+' '+y2+', '+mr.width+' '+y2+'" fill="none" stroke="'+
   col+'" stroke-width="'+(focus?2.2:1.1)+'" opacity="'+
   (focus?'0.95':'0.4')+'"/>';});});
 svg.innerHTML=paths;
}

 'block (left) or a law (right) to LIGHT ITS LINKS — the ribbons and '+

 'the full popup (the verse in Hebrew with English, and the machine '+
 'code). Underlined names in the cards open popups too.</p>';
 return;}
