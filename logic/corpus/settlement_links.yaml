# settlement_links.yaml — authored cross-unit demand settlements
# (corpus world config).
#
# WHY THIS FILE EXISTS: inside a unit, a RESULT operator pops its demand
# by EXACT string match — the interpreter proves those. ACROSS units the
# settling verse almost never repeats the demand's wording, so every
# cross-unit settlement is an authored judgment citing both verses. The
# fold applies these links after all units are folded; each link carries
# its basis and an uncertain flag where the judgment is arguable.
#
# link form:
#   - demand:     the demand string as the declaring unit wrote it
#     from_unit:  unit that declared it
#     settled_by: {unit: ..., ref: Book.Ch.Vs}
#     basis_en:   one sentence: why this verse settles that demand
#     uncertain:  true|false (+ comment when true)
#
# AWAITING (hooks armed at units outside the current corpus):
# Pharaoh's chase-binding (Exod 14:6, the bindings file); the BONES
# OATH (gen_73's ve-haalitem, 50:25) vs Exod 13:19 (the taking) and
# Josh 24:32 (the resting at Shechem); the refused right-hand demand
# (gen_71's sim-yeminkha, 48:18) stays open by the dead-by-refusal
# law — no settlement will be authored for it.

links:
  - demand: "va_amartem_anshe_miqne"
    from_unit: gen_69_descent_seventy
    settled_by: {unit: gen_70_goshen_and_the_fifth, ref: Gen.47.3}
    basis_en: >
      Joseph's scripted answer ("you shall say: men of livestock,"
      46:34) is PERFORMED when Pharaoh asks the predicted question
      verbatim (47:3, "what is your work?") and the brothers answer
      with their occupation — the say-demand is discharged by the
      saying, though the delivery deviates (they say the
      shepherd-word the script softened, and the letter marks the
      verse with the Torah's only full-of-full "our fathers"): asked
      and answered.
    uncertain: false

  - demand: "al_na_tiqbreni_be_mitzrayim"
    from_unit: gen_70_goshen_and_the_fifth
    settled_by: {unit: gen_73_coffin_in_egypt, ref: Gen.50.13}
    basis_en: >
      "Do not, pray, bury me in Egypt" (47:29) is honored literally:
      the sons CARRY him to the land of Canaan and bury him there
      (50:13) — he does not lie in Egypt; the ban's honoring is the
      performed carrying-out (50:4-13, Pharaoh's leave obtained by
      the recorded oath itself).
    uncertain: false

  - demand: "u_qevartani_bi_qvuratam"
    from_unit: gen_70_goshen_and_the_fifth
    settled_by: {unit: gen_73_coffin_in_egypt, ref: Gen.50.13}
    basis_en: >
      "Carry me from Egypt and bury me in THEIR burying-place"
      (47:30) is performed to the letter at 50:13: carried from
      Egypt (va-yisu), buried in the cave of the field of Machpelah
      — the burying-place of Abraham, Sarah, Isaac, Rebekah, and
      Leah (49:31's register): the oath Joseph swore (47:31)
      discharged by the deed.
    uncertain: false

  - demand: "qivru_oti_el_avotai"
    from_unit: gen_72_testament_twelve
    settled_by: {unit: gen_73_coffin_in_egypt, ref: Gen.50.13}
    basis_en: >
      The testament's charge to the twelve ("bury me with my
      fathers, in the cave...", 49:29) receives the Torah's own
      receipt-formula one verse before the deed: "and his sons did
      for him SO, exactly as he charged them" (50:12 — with the
      charged-them word's one Torah token inside it), and the deed
      follows at 50:13 (the cave, the field, the purchase recited):
      charged, done-so, and buried.
    uncertain: false
  - demand: "et_achikhem_ha_qaton_taviu_elai"
    from_unit: gen_65_first_descent
    settled_by: {unit: gen_66_second_descent, ref: Gen.43.26}
    basis_en: >
      "Your youngest brother you shall bring TO ME" (Gen 42:20) is
      satisfied when Benjamin stands in Joseph's own house and bows
      with the gift (Gen 43:26; the descent with Benjamin at 43:15,
      the seeing at 43:16): brought, and brought to him.
    uncertain: false

  - demand: "alu_le_shalom_el_avikhem"
    from_unit: gen_67_cup_and_surety
    settled_by: {unit: gen_68_i_am_yosef, ref: Gen.45.25}
    basis_en: >
      "Go up in peace to your father" (Gen 44:17) — refused in the
      moment (Judah steps closer instead) — finally happens at "and
      they went UP from Egypt... to Jacob their father" (Gen 45:25),
      with Benjamin free, Simeon out, and peace actual.
    uncertain: false

  - demand: "yeshev_na_avdekha_tachat_ha_naar"
    from_unit: gen_67_cup_and_surety
    settled_by: {unit: gen_68_i_am_yosef, ref: Gen.45.3}
    basis_en: >
      Judah's substitution offer ("let your servant stay instead of
      the lad", Gen 44:33) receives no grant and no refusal — the
      unmasking (Gen 45:3-4) dissolves the trial that demanded a
      slave: no one stays, everyone goes up.
    uncertain: true
    # UNCERTAIN — the demand was TRANSCENDED, not granted: reading
    # the unmasking as its settlement is a judgment about what
    # answers a demand; the queue's alternative (leave it open
    # forever) reads the offer as never answered. Owner may re-rule.

  - demand: "el_shaday_yiten_lakhem_rachamim"
    from_unit: gen_66_second_descent
    settled_by: {unit: gen_68_i_am_yosef, ref: Gen.45.25}
    basis_en: >
      Jacob's prayer (Gen 43:14) asked mercy before the man, the
      release of "your other brother," and Benjamin. Simeon walked at
      43:23 (the partial); by the ascent of 45:25 every son is alive,
      free, and going up together: the prayer's full basket.
    uncertain: false

  - demand: "u_qchu_et_avikhem_u_vou_elai"
    from_unit: gen_68_i_am_yosef
    settled_by: {unit: gen_69_descent_seventy, ref: Gen.46.6}
    basis_en: >
      Pharaoh's summons "take your father and your households and
      come TO ME" (Gen 45:18) meets its arrival-verse: "and they came
      to Egypt — Jacob, and all his seed with him" (Gen 46:6-7).
    uncertain: false
  - demand: "zekhartani_ve_hizkartani_el_paro"
    from_unit: gen_63_two_dreams_prison
    settled_by: {unit: gen_64_pharaoh_dreams_rise, ref: Gen.41.9}
    basis_en: >
      Joseph's "remember me and mention me to Pharaoh" (Gen 40:14, the
      hizkir root) is delivered at Gen 41:9-13 — the chief cupbearer's
      "my offenses I MENTION (mazkir) today," the same verb, followed by
      the full retelling that brings Joseph up from the pit. The text
      itself marks the two-year delay (40:23 "did not remember... and
      forgot him" — narrated non-satisfaction — then 41:1 "at the end of
      two years").
    uncertain: false

  - demand: "machah(ha_adam, me_al_pnei_ha_adamah)"
    from_unit: gen_15_flood_prologue
    settled_by: {unit: gen_18_the_rise, ref: Gen.7.23}
    basis_en: >
      "I will wipe out (emcheh) the human from the face of the ground"
      (Gen 6:7) is executed at Gen 7:23 "and He wiped out (va-yimach)
      every living thing... from man to beast to creeping thing to fowl"
      — the same verb machah ("wipe"), the same face-of-the-ground scope,
      narrated done.
    uncertain: false

  - demand: "hatzileni(YHWH, mi_yad_esav)"
    from_unit: gen_55_two_camps_wrestled_name
    settled_by: {unit: gen_56_blessing_returned_first_altar, ref: Gen.33.4}
    basis_en: >
      Jacob's prayer "deliver me from the hand of Esau" (Gen 32:12) is
      answered in the event: "Esau ran to meet him and embraced him...
      and they wept" (Gen 33:4) — no hand raised.
    uncertain: true
    # UNCERTAIN — the deliverance is narrated in outcome, not in receipt:
    # no verse says "God delivered." Reading the embrace as the answer is
    # a judgment (a strong one, but authored, not textual-exact).
