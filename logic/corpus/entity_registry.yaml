# entity_registry.yaml — WHO IS WHO across units (corpus world config).
#
# Owner ruling 2026-08-09: identity decisions authored by the machine's
# operator, best-effort; every uncertain identification MARKED in comments.
# Linked, NOT merged: every fact in the world keeps its original unit-local
# token with provenance; this table only says which tokens point at the
# same corpus entity. One world, one registry (no variant configs).
#
# DEFAULT RULE: any token NOT listed here is its own singleton entity.
# Only multi-token identities, splits (same token, different referents,
# scoped by unit), and flagged questions appear below.
#
# member forms:  {token: X}            — the token everywhere
#                {token: X, units: []} — the token only in those units

entities:

  # ---- the divine names -------------------------------------------------
  - id: god
    en: "God (the LORD)"
    kind: divine
    members:
      - {token: Elohim}        # "God"
      - {token: elohim}        # lower-case variant token, later units
      - {token: YHWH}          # the four-letter Name
      - {token: YHWH_Elohim}   # "the LORD God" (garden narrative)
      - {token: el_shaday}     # "God Almighty" (Gen 35:11)
      - {token: el_elyon}      # "God Most High" (Gen 14) — Abram's own oath
                               # joins the names: "YHWH, God Most High" 14:22
      - {token: yhwh_elohei_shem}  # "the LORD, the God of Shem" (Gen 9:26)
    note: >
      One entity, the names LINKED not merged — the token distinction
      survives on every fact (readings that split by name stay nameable,
      per the triage law). Authored identification per the text's own
      equations (Gen 14:22 joins YHWH to El Elyon; Gen 2:4 joins the
      names in one breath).

  - id: angel_of_the_lord
    en: "the angel of the LORD"
    kind: divine
    members:
      - {token: malakh_YHWH}     # Hagar (Gen 16), the binding (Gen 22)
      - {token: malakh_elohim}   # Hagar at the well of the lad (Gen 21)
    note: >
      UNCERTAIN on two axes: (1) whether every appearance is one figure;
      (2) the angel sometimes speaks in God's own first person (Gen 16:10,
      22:12) — the angel/God boundary is a named open question, so this
      entity is kept SEPARATE from `god` with the link recorded here only.

  - id: bnei_ha_elohim
    en: "the sons of God (Gen 6:2,4)"
    kind: collective
    members: [{token: bnei_ha_elohim}]
    note: >
      UNCERTAIN — contested for two millennia (divine beings / judges /
      Sethite line). Registered as its own collective; no identification
      made.

  - id: ha_ish_peniel
    en: "the man who wrestled at Peniel (Gen 32:25)"
    kind: person
    members: [{token: ha_ish}]
    note: >
      UNCERTAIN — the text says "a man"; Jacob says "I have seen God face
      to face" (32:31); Hosea 12:4-5 calls him an angel. All three readings
      named; no identification made — own entity.

  # ---- the first family -------------------------------------------------
  - id: the_human
    en: "Adam (the human)"
    kind: person
    members:
      - {token: ha_adam}       # installed Gen 1 account (gen_06)
      - {token: adam}          # installed Gen 2 account (gen_08)
      - {token: adam_species}  # the Gen 5:1-2 ledger head, named "Adam"
    note: >
      The double install (1:27 and 2:7) is the text's own double account —
      identified as one entity per the ledger's own equation (Gen 5:1-2
      names the created pair "Adam"). UNCERTAIN only at adam_species: 5:2
      names male-and-female together, so the ledger token leans species
      rather than individual; kept in this entity with that caveat.

  - id: eve
    en: "Eve (the woman)"
    kind: person
    members:
      - {token: ishah}        # built and named (gen_09, gen_11)
      - {token: chavah}       # the name Eve in use (gen_12)
      - {token: eshet_adam}   # "the wife of Adam" bearing Seth (gen_13)
    note: eshet_adam = Eve is certain by context (Gen 4:25).

  - id: adam_and_eve
    en: "the two of them (Adam and Eve together)"
    kind: collective
    members: [{token: shneihem}]

  # ---- Noah era ---------------------------------------------------------
  - id: noach
    en: "Noah"
    kind: person
    members: [{token: noach}]

  - id: noah_and_sons
    en: "Noah and his sons"
    kind: collective
    members: [{token: noach_u_vanav}, {token: banav}]

  # ---- Abraham cycle ----------------------------------------------------
  - id: abraham
    en: "Abraham"
    kind: person
    members:
      - {token: avram}     # before Gen 17:5
      - {token: avraham}   # after the renaming (NAME operator, gen_33)

  - id: sarah
    en: "Sarah"
    kind: person
    members:
      - {token: saray}     # before Gen 17:15
      - {token: sarah}     # after the renaming

  - id: lot
    en: "Lot"
    kind: person
    members: [{token: lot}]

  - id: hagar
    en: "Hagar"
    kind: person
    members: [{token: hagar}]

  - id: ishmael
    en: "Ishmael"
    kind: person
    members:
      - {token: yishmael}
      - {token: ha_naar, units: [gen_37_laughter_wilderness_oath]}
        # "the lad" under the bush (Gen 21) = Ishmael — certain by context.
        # NOTE the same token in gen_34 is a DIFFERENT person (below).

  - id: abrahams_serving_lad
    en: "Abraham's serving lad (Gen 18:7)"
    kind: person
    members:
      - {token: ha_naar, units: [gen_34_mamre_laugh_plea]}
    note: the token split ha_naar is scoped by unit — two referents.

  - id: servant_of_abraham
    en: "Abraham's servant (the wooing of Rebekah)"
    kind: person
    members:
      - {token: ha_eved}
    note: >
      The text never names him in Gen 24. Tradition reads him as Eliezer
      of Damascus (Gen 15:2) — that identification is NAMED here but NOT
      made (midrashic, not textual). UNCERTAIN.

  - id: servant_and_men
    en: "the servant and his men"
    kind: collective
    members: [{token: ha_eved_u_anashim}, {token: house_voice}]
    note: >
      house_voice (gen_40 speaker) — UNCERTAIN which voice the unit meant
      (the household of the master, or the servant party's collective
      speech). Filed with the servant party as best reading; revisit if
      the unit's derivation log says otherwise.

  - id: three_visitors
    en: "the three men at Mamre (Gen 18)"
    kind: collective
    members: [{token: shelosha_anashim}]
    note: >
      UNCERTAIN relation to `god` and to the two angels: Gen 18 slides
      between "three men," "the LORD," and the two who go on to Sodom
      (19:1). The overlap is recorded here as a named reading only —
      no merge.

  - id: two_angels_sodom
    en: "the two angels at Sodom (Gen 19)"
    kind: collective
    members: [{token: shnei_ha_malakhim}, {token: ha_malakhim}]

  - id: melchizedek
    en: "Melchizedek king of Salem"
    kind: person
    members: [{token: malki_tzedeq}]

  # ---- Gerar: the two eras (split, both UNCERTAIN) ----------------------
  - id: avimelekh_abraham_era
    en: "Avimelech of Gerar (Abraham's era, Gen 20-21)"
    kind: person
    members:
      - {token: avimelekh, units: [gen_36_gerar_dream_prophet, gen_37_laughter_wilderness_oath]}

  - id: avimelekh_isaac_era
    en: "Avimelech of Gerar (Isaac's era, Gen 26)"
    kind: person
    members:
      - {token: avimelekh, units: [gen_44_isaac_gerar_sister_expel, gen_45_wells_covenant_esau_wives]}
      - {token: avimelekh_party, units: [gen_45_wells_covenant_esau_wives]}
    note: >
      UNCERTAIN SPLIT — the corpus installs Avimelech twice (gen_36 and
      gen_44), and ~75 textual years separate the eras, so two entities is
      the safer default; "Avimelech" may be a dynastic title (as "Pharaoh"
      is), in which case the split is right for the men and the title is
      the shared thing. Same question applies to Pikhol below. If the
      owner rules one long-lived king, merge the two ids.

  - id: fikhol_abraham_era
    en: "Pikhol, captain of the host (Abraham's era)"
    kind: person
    members:
      - {token: fikhol, units: [gen_37_laughter_wilderness_oath]}

  - id: fikhol_isaac_era
    en: "Pikhol, captain of the host (Isaac's era)"
    kind: person
    members:
      - {token: fikhol, units: [gen_45_wells_covenant_esau_wives]}
    note: UNCERTAIN — same split and same reasoning as Avimelech above.

  # ---- Pharaohs (split, CERTAIN) ----------------------------------------
  - id: paro_abram_era
    en: "Pharaoh (Abram's descent, Gen 12)"
    kind: person
    members:
      - {token: paro, units: [gen_28_egypt_descent]}
      - {token: sarei_faro, units: [gen_28_egypt_descent]}

  - id: paro_yosef_era
    en: "Pharaoh (Joseph's era, Gen 39-41)"
    kind: person
    members:
      - {token: paro, units: [gen_62_potifar_house, gen_63_two_dreams_prison, gen_64_pharaoh_dreams_rise]}
    note: >
      Split is CERTAIN (centuries apart); "Pharaoh" is a title. sarei_faro
      ("Pharaoh's officers") filed under the Abram-era court as a court
      collective rather than the king himself — minor modeling choice.

  # ---- Isaac cycle ------------------------------------------------------
  - id: isaac
    en: "Isaac"
    kind: person
    members: [{token: yitzchaq}]

  - id: rebekah
    en: "Rebekah"
    kind: person
    members: [{token: rivqah}]

  - id: esau
