  # ---- THE TENT's four cases (World/step9/THE_TENT.md, opened 2026-09-09): the persons the run halts on
  - id: the_blasphemer
    en: "the blasphemer — the son of Shelomith daughter of Dibri of the tribe of Dan, the son of an Egyptian man, who pronounced the Name and cursed in the camp (Lev 24:10-23); held in the guard until it be declared, stoned as commanded"
    kind: person
    members:
      - {token: the-son-of-shelomith, units: [step9-scenes]}   # cold_run_lev24.py's own case token (the exam scene and the narrative scene); the frozen unit's token a later join
  - id: the_unclean_men
    en: "the unclean men at the Passover — the men unclean by a human corpse who could not keep the Passover of the second year on its day and came near before Moses and Aaron (Num 9:6-7); who they were is a THREE-ARM DISPUTE the shelf leaves open (Sifrei Bamidbar 68:1 — R. Yishmael: the bearers of Joseph's coffin; R. Akiva: Mishael and Eltzafan, unclean by Nadab and Abihu; R. Yitzchak: men unclean by a met mitzvah whose seventh day fell on the eve), recorded here UNASSIGNED"
    kind: people
    members:
      - {token: the-unclean-men, units: [step9-scenes]}   # cold_run_pesach_sheni.py's narrative scene (THE TENT sitting 2, 2026-09-09); the frozen unit's token a later join
  - id: the_wood_gatherer
    en: "the wood-gatherer — the man found gathering wood on the Sabbath day in the wilderness, brought to Moses and Aaron and all the congregation, held in the guard because it had not been declared what should be done to him, stoned with stones outside the camp as the LORD commanded (Num 15:32-36); WHO HE WAS is a TWO-ARM DISPUTE the shelf leaves open (Sifrei Bamidbar 113:1; Shabbat 96b:19-20): ZELOPHEHAD — R. Akiva, by the verbal analogy 'wilderness' here and at 27:3 ('our father died in the wilderness... in his own sin'), on which arm this person is the daughters' father (sitting 4's decedent); ONE OF THE BOLD ONES of 14:44 — R. Yehuda b. Beteira, who rebukes the naming ('the Torah concealed him and you reveal him'); UNASSIGNED here, sitting 4 reads 27:3 against it"
    kind: person
    members:
      - {token: the-wood-gatherer, units: [step9-scenes]}   # cold_run_mekoshesh.py's narrative scene (THE TENT sitting 3, 2026-09-09); the Exodus engine's bench token 'the-gatherer' is NOT joined (the registry map is global at submit; that bench is its own world); the frozen unit's token a later join
  - id: the_daughters_of_zelophehad
    en: "the daughters of Zelophehad — Mahlah, Noah, Hoglah, Milcah and Tirzah (Num 27:1, the order by WISDOM — Bava Batra 120a:4; 36:11 Mahlah, Tirzah, Hoglah, Milcah, Noah, by AGE; the school of R. Yishmael and Sifrei Bamidbar 133:2: all equal): the daughters of Zelophehad son of Hepher of Manasseh who drew near before Moses at the tent's door and asked a holding among their father's brothers (27:1-4), whose judgment Moses brought near before the LORD (27:5), answered 'rightly' with the statute of inheritances (27:6-11); the tribes' plea and the relayed command on the same case (36:1-9); married the sons of their uncles, the inheritance remaining on the tribe (36:10-12); the giving in the sixth book by the mouth of the LORD (Josh 17:3-6, the ten parts); WISE, INTERPRETERS OF VERSES, RIGHTEOUS (Bava Batra 119b:9-13: the levirate dilemma; the son's daughter; not under forty at marriage, the miracle as Jochebed's); all firstborn (Sifrei 133:1)"
    kind: people
    members:
      - {token: the-daughters-of-zelophehad, units: [step9-scenes]}   # cold_run_zelophehad.py's narrative scene (THE TENT sitting 4, 2026-09-09); the frozen units' tokens a later join
  - id: zelophehad
    en: "Zelophehad son of Hepher son of Gilead son of Machir son of Manasseh — the decedent: 'our father died in the wilderness, and he was not among the congregation that gathered against the LORD in Korach's congregation, but in his own sin he died, and he had no sons' (Num 27:3; Onkelos: in his DEBT); a firstborn (Sifrei Bamidbar 133:1; Mishnah Bava Batra 8:3 — the double); died without entering the land (26:33, 26:65); WHO HE WAS is the TWO-ARM DISPUTE recorded on the_wood_gatherer's entry (Sifrei 113:1 / 133:3: R. Akiva's verbal analogy on 'wilderness' makes him the man stoned at 15:32-36; R. Yehuda b. Beteira rebukes the naming) — UNASSIGNED at both entries; no act of his is on the tape and no ledger entry stands on him: the registry's row for the case's decedent"
    kind: person
    members:
      - {token: zelophehad, units: [step9-scenes]}   # the decedent named in the scene's fields (THE TENT sitting 4); never a subject
  - id: the_heads_of_gilead
    en: "the heads of the fathers of the family of the sons of Gilead son of Machir son of Manasseh — the tribe's chiefs who drew near and spoke before Moses and the princes against the daughters' grant: the lot, the first ruling cited as standing law, the diminution, the jubilee (Num 36:1-4); answered 'rightly' in Moses' relayed command (36:5)"
    kind: people
    members:
