    en: "Balak son of Zippor, king of Moab — 'Balak son of Zippor saw all that Israel had done to the Amorite' (Num 22:2); sent the two embassies to Balaam (22:5-6, 22:15-17), met him at the Arnon (22:36), built the seven altars at the three stands (23:1-2, 23:14, 23:29-30), clapped his hands and revoked the honor (24:10-11), received the counsel (24:14); the full name at 22:2, 22:10, 22:16 and Josh 24:9; thirty-nine seats, Josh 24:9 and Micah 6:5 outside Numbers; Sanhedrin 105b:12: Ruth descended from him"
