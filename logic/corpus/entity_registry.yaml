  - id: the_levites
    en: "the tribe of Levi — the Levites as a tribe and a class (NOT Levi the person, Jacob's son — the registry's `levi`): exempt from the count (Num 1:47-49), appointed over the tabernacle (1:50-53), brought near and GIVEN to Aaron (3:6-9), taken instead of the firstborn (3:12, 3:41, 3:45), counted from a month old by their three houses — Gershon 7,500, Kohath 8,600, Merari 6,200; the total as written 22,000 (3:39; the three hundred firstborn Levites, Bekhorot 5a:9) — the charges by house (3:25-37), the Kohathites' burden (4:1-20); fit for the work from thirty to fifty, unfit by years not by blemish (Chullin 24a); the stranger at 3:38 a Levite in another's service (Arakhin 11b)"
