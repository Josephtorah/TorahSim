    note: >
      UNCERTAIN on two axes: (1) whether every appearance is one figure;
      (2) the angel sometimes speaks in God's own first person (Gen 16:10,
      22:12) — the angel/God boundary is a named open question, so this
      entity is kept SEPARATE from `god` with the link recorded here only.

