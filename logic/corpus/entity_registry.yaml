  # ---- token splits: person vs place ------------------------------------
  - id: shechem_town
    en: "Shechem (the town)"
    kind: place
    members: [{token: shekhem, units: [gen_27_the_call]}]

  - id: shechem_son_of_chamor
    en: "Shechem son of Hamor"
    kind: person
    members:
      - {token: shekhem, units: [gen_57_deceit_at_the_gate]}
      - {token: chamor_u_shekhem, units: [gen_57_deceit_at_the_gate]}
    note: chamor_u_shekhem is the father-and-son pair speaking together;
      filed here AND implicitly with Hamor — collective of two.

  - id: mitzrayim_son_of_ham
    en: "Mitzrayim (son of Ham, the nations table)"
    kind: person
    members: [{token: mitzrayim, units: [gen_24_nations_table]}]
    note: >
      TOKEN SPLIT — everywhere else the token mitzrayim is Egypt the
      place/nation (default singleton). The nations table is the one unit
      where it is the eponymous ancestor.

  # ---- places with two naming stories / spelling variants ---------------
  - id: beer_sheva_place
    en: "Beersheba"
    kind: place
    members: [{token: beer_sheva}, {token: beer_shiva}]
    note: >
      One place, two naming stories (Gen 21:31 with Abraham, Gen 26:33
      with Isaac) and two spellings. Identified as one place — the text
      itself returns Isaac to "Beersheba" (26:23) before the re-naming.

  - id: damascus
    en: "Damascus"
    kind: place
    members: [{token: damaseq}, {token: dameseq}]
    note: spelling variants across gen_30/gen_31 — one place, certain.

  # ---- Leviticus voices -------------------------------------------------
  - id: moses
    en: "Moses"
    kind: person
    members: [{token: moshe}]

  - id: aaron
    en: "Aaron"
    kind: person
    members: [{token: aharon}]

  # ---- Exodus opening (run FWD-4, 2026-08-09) ---------------------------
  - id: paro_oppression_era
    en: "Pharaoh (the oppression king, Exod 1:8-2:23)"
    kind: person
    members:
      - {token: melekh_chadash, units: [exo_01_names_and_midwives]}
      - {token: melekh_mitzrayim, units: [exo_01_names_and_midwives, exo_02_drawn_from_the_water]}
      - {token: paro, units: [exo_01_names_and_midwives, exo_02_drawn_from_the_water]}
    note: >
      The arisen king (1:8), the midwife-decree king (1:15), and the
      Nile-decree Pharaoh (1:22) identified as ONE person by narrative
      continuity; he DIES at Exod 2:23 (the machine event). The readings'
      two-houses split on "new" (actually new / new-decreed) carried
      named in exo_01, not resolved here.

  - id: paro_exodus_era
    en: "Pharaoh (the refuser, Exod 5:1+)"
    kind: person
    members:
      - {token: paro, units: [exo_05_bricks_without_straw]}
      - {token: melekh_mitzrayim, units: [exo_05_bricks_without_straw]}
    note: >
      UNCERTAIN — registered SEPARATE from the oppression king on the
      letter's own death-notice (2:23). The readings split: a literal
      successor refuses at 5:1; or "died" = struck/deposed and the same
      king stands (the leprosy-hearing, named in exo_02). The split is
      carried named; the two entities stay linked-not-merged here.

  - id: reuel_yitro
    en: "Reuel/Jethro, priest of Midian, Moses' father-in-law"
    kind: person
    members:
      - {token: reuel, units: [exo_02_drawn_from_the_water]}
      - {token: yitro, units: [exo_03_bush_and_name, exo_04_signs_and_firstborn]}
      - {token: yeter, units: [exo_04_signs_and_firstborn]}
    note: >
      One father-in-law under three tokens (Reuel 2:18; Jethro 3:1,
      4:18; Jether 4:18 — the shortened form in the same verse as the
      full one). Identified by the text's own apposition ("Jethro his
      father-in-law," 3:1). The readings' seven-names file carried
      named, never merged (armed at 18:1).

  - id: moshe_ve_aharon_compound
    en: "Moses-and-Aaron (compound speaker, Exod 5:1)"
    kind: compound
    members: [{token: moshe_ve_aharon}]
    note: >
      The two-man compound speaker of the send-demand (the class of
      lavan_betuel and rachel_ve_leah). Members are the moses and aaron
      entities; the compound token kept distinct so the demand's
      provenance stays two-mouthed.

  - id: achot_moshe
    en: "the sister of Moses (Exod 2:4-8, unnamed)"
    kind: person
    members: [{token: achoto, units: [exo_02_drawn_from_the_water]}]
    note: >
      UNCERTAIN-FORWARD — the readings identify her as MIRIAM (named
      first at Exod 15:20, not yet derived). Registered as the unnamed
      sister; the identification deferred until the corpus meets Miriam
      in the letter (the ha-elekh prophecy-file named in exo_02).

  - id: amram
    en: "Amram, son of Kohath, father of Aaron and Moses (Exod 6:18-20)"
    kind: person
    members: [{token: amram, units: [exo_06_i_am_the_lord]}]
    note: >
      The registry's own signing of 2:1's withheld "man of the house
      of Levi" (exo_02's restraint PAID at 6:20 — the letter itself
      names the parents four chapters late). Life-total 137 recorded.

  - id: yokheved
    en: "Yokheved, Amram's wife, mother of Aaron and Moses (Exod 6:20)"
    kind: person
    members: [{token: yokheved, units: [exo_06_i_am_the_lord]}]
    note: >
      The "daughter of Levi" of 2:1 signed by name at 6:20 (dodato —
      "his father's sister": the aunt-marriage recorded plainly; the
      readings' hearings named at the unit, unclaimed). The world
      links her to the mother-entity of exo_02 on the registry's own
      authority; 26:59's fuller record armed.

  - id: elisheva
    en: "Elisheva, daughter of Amminadav, sister of Nachshon, Aaron's wife (Exod 6:23)"
    kind: person
    members: [{token: elisheva, units: [exo_06_i_am_the_lord]}]
    note: >
      The priestly line's mother — the marriage binding Levi's house
      to Judah's princely house (Nachshon, the roster's first prince,
      Num 1:7 armed). Her four sons (Nadav, Avihu, Elazar, Itamar)
      recorded at the same verse.

  - id: pinchas
    en: "Pinchas, son of Elazar, son of Aaron (Exod 6:25)"
    kind: person
    members: [{token: pinchas, units: [exo_06_i_am_the_lord]}]
    note: >
      The registry bracket's LAST entry — born at its closing verse,
      written FULL at all four Torah stations (the Ramah's rule,
      EX06-12). The therefore-say pair (EX06-04) binds his covenant
      of peace (Num 25:12, armed) to the redemption-speech of the
      chapter that records his birth.

  - id: miryam
    en: "Miriam the prophetess, sister of Aaron (Exod 15:20)"
    kind: person
    members: [{token: miryam, units: [exo_15_the_song_and_marah]}]
    note: >
      The watching sister of 2:4 SIGNED at 15:20 — exo_02's
      withheld-name restraint pays its third installment (the parents
      at 6:20, the sister at the Song). She arrives already titled:
      the corpus's first woman called prophetess, and sister-of-AARON
      (the one-brother title's readings named at the unit, unclaimed).
      Num 26:59's full family record armed; her five-word prayer
      (Num 12:13) standing since exo_14's prayer-calendar.

  - id: yehoshua
    en: "Joshua (Exod 17:9)"
    kind: person
    members: [{token: yehoshua, units: [exo_17_massah_and_amalek]}]
    note: >
      The successor's DEBUT — unintroduced, unpatronymed, no office:
      commissioned mid-battle-order (17:9) and first narrated doing
      exactly as told (17:10 — the full obedience-formula). The
      write-command is set in HIS ears (17:14: the erasure-notice
      briefed to the man who will fight Amalek's remnant). Exod 24:13
      (the minister on the mountain), 33:11 (the tent), Num 13:16 (the
      name expanded), Deut 31 (the charge) armed.

  - id: chur
    en: "Hur (Exod 17:10)"
    kind: person
    members: [{token: chur, units: [exo_17_massah_and_amalek]}]
    note: >
      The corpus's most economical officer: his whole Torah career is
      three tokens (asserted at exo_17's build) — the hands at 17:10,
      the hands at 17:12, the regency at 24:14. He exists to hold
      things up. The readings' identifications (Miriam's line; Bezalel's
      grandfather, Exod 31:2 armed) carried named-only.

  - id: eliezer_ben_moshe
    en: "Eliezer, Moses' second son (Exod 18:4)"
    kind: person
    members: [{token: eliezer, units: [exo_18_jethro_and_the_judges]}]
    note: >
      The registry's longest-deferred name: born in the 2:22 window,
      carried unnamed in 4:20's "sons," SURFACED at 18:4 report-class
      (no naming-verb — the corpus learns the name eighteen chapters
      after the birth; exo_02's restraint-doctrine pays its fourth
      installment). His etymology carries the second lean rescue
      (va-yatzileni me-cherev paro — the Ramah's thin trio, EX18-02).
      1 Chr 23:15-17 (his line) outside-Torah, named.

  - id: amaleq
    en: "Amalek (Exod 17:8)"
    kind: people
    members: [{token: amaleq, units: [exo_17_massah_and_amalek]}]
    note: >
      The corpus's first battlefield enemy (the first war Israel must
      fight itself — 14:14's the-LORD-will-fight suspended at 17:8).
      Esau's grandson by Gen 36:12 (the go-out pair's edge, EX17-07).
      Subject of the corpus's first write-command and the standing
      erasure-oath (17:14-16, the card OPEN): Deut 25:17-19, 1 Sam 15,
      Esther (the Agagite) armed, named.
