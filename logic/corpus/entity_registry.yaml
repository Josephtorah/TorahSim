# entity_registry.yaml — WHO IS WHO across units (corpus world config).
#
# Owner ruling 2026-08-09: identity decisions authored by the machine's
# operator, best-effort; every uncertain identification MARKED in comments.
# Linked, NOT merged: every fact in the world keeps its original unit-local
# token with provenance; this table only says which tokens point at the
# same corpus entity. One world, one registry (no variant configs).
#
# DEFAULT RULE: any token NOT listed here is its own singleton entity.
# Only multi-token identities, splits (same token, different referents,
# scoped by unit), and flagged questions appear below.
#
# member forms:  {token: X}            — the token everywhere
#                {token: X, units: []} — the token only in those units
#
# CHANGELOG (the RE-era constitution: a model edit carries its line; gates green)
#   2026-09-08 O10 THE PEOPLE-TOKENS IN THE ONE REGISTRY (the fold's sitting; THE_WORLD.md idea log of the date): nine
#   frozen-unit tokens joined to seven standing entities, every member SCOPED to its units — ha_am (3 Exodus units) and
#   shivte_yisrael_shenem_asar (UNCERTAIN) to israel_people; shotre_bene_yisrael to the_officers; bene_yaaqov and ha_achim
#   to josephs_brothers; ha_mitzrim and mitzrayim (gen_70's speakers) to egypt_people; mitzrayim (the presupposed land,
#   three units) to the_land_of_egypt; pelishtim to the_philistines. yisrael stays jacob (the person). The dry run before
#   the edit: seventeen mentions re-homed, the state hash UNMOVED (its basis is facts, open demands and names).
#   2026-09-10 THE NUMBERS WALK 2b (World/step9/NUMBERS_WALK.md "Sitting 2b"): the_princes_of_israel (people), the twelve princes in the camp's order (person), the_unclean_of_the_camp (people); each with one step9-scenes member
#   2026-09-09 THE NUMBERS WALK 1b (World/step9/NUMBERS_WALK.md "Sitting 1b"): the_levites (kind people — the tribe, not Levi the person), the_firstborn_of_israel (kind people — the 22,273 as a class); each with one step9-scenes member
#   2026-09-09 THE TENT sitting 4 (World/step9/THE_TENT.md section 4): the_daughters_of_zelophehad (kind people), zelophehad (kind person — the decedent, the identity arm cross-noted, unassigned), the_heads_of_gilead (kind people)
#   2026-09-09 THE TENT sitting 3 (World/step9/THE_TENT.md section 3): the_wood_gatherer (kind person) — the identity dispute recorded unassigned (Zelophehad / one of the bold ones)
#   2026-09-09 THE TENT sitting 2 (World/step9/THE_TENT.md section 2): the_unclean_men (kind people) — the second Passover's case persons, the identity dispute recorded unassigned
#   2026-09-09 THE LOOP step 3 INSTALLATION (decision D4; World/step9/THE_LOOP.md "Step 3 INSTALLATION — the design"): FOUR
#   INSTITUTION ENTITIES (a new `kind: institution`), each with one step9-scenes member so the tent daemon's in_force and the
#   runners' existing writes land on one ledger — the_tent_of_meeting (the-tabernacle), the_priesthood (the-priesthood, the OFFICE;
#   the persons aaron-and-sons keep invested_office), the_covenant_at_sinai (the-covenant), the_court (the-court). THE LAND is the
#   standing place entity the_land_of_canaan (the-land-of-canaan); the runners' generic 'the-land' is NOT re-homed (O8 S3's lesson).
#   No frozen-unit token joins here (ohel_moed, ha_mishkan and the like are a later join at the merge sitting, D7).

