binary_trees:
  display_policy_en: >
    Always he + he_translit + en. Full tree_ascii per verse.
  method_note_en: >
    taamim_tree_parse.py v1; STEPs derived from top splits (tree_derived_v1).
  data_source: "Data/Exod.xml"
  parser: "taamim_tree_parse.py"
  rule_set_version: "v1"
  tags: ["[HE-STRUCT]"]
  verse_trees:
    Exod_2_1:
      verse: "2:1"
      osis_id: "Exod.2.1"
      parser_status: unique
      pure_binary: false
      word_count: 8
      linear:
        he: וילך איש מבית לוי ויקח את בת לוי
        he_translit: "vylk 'ysh mbyt lvy vyqch 't bt lvy"
        en: "Free gloss [EN-AID] — structure from Hebrew tree. Exod 2:1."
      top_binary_split:
        comment: >
          Top split ta'amim v1; maps_to ['STEP_Ex_2_1'].
        left_half:
          side_en: "Left of top split"
          head:
            he: לוי
            he_translit: "lvy"
            en: "left-end leaf 3"
            mark_en: etnachta (major mid-verse rest)
          phrase:
            he: וילך איש מבית לוי
            he_translit: "vylk 'ysh mbyt lvy"
            en: "left phrase arm (see tree_ascii)"
        right_half:
          side_en: "Right of top split"
          phrase:
            he: ויקח את בת לוי
            he_translit: "vyqch 't bt lvy"
            en: "right phrase arm (see tree_ascii)"
      tree_ascii: |
        PHRASE (binary 8w) וַ/יֵּ֥לֶךְ אִ֖ישׁ מִ/בֵּ֣ית לֵוִ֑י וַ/יִּקַּ֖ח…
        ├── PHRASE (binary 4w) וַ/יֵּ֥לֶךְ אִ֖ישׁ מִ/בֵּ֣ית לֵוִ֑י
        │   ├── PHRASE (binary 2w) וַ/יֵּ֥לֶךְ אִ֖ישׁ
        │   │   ├── [0] וַ/יֵּ֥לֶךְ (mercha (conjunctive), rank=9)
        │   │   └── [1] אִ֖ישׁ (tifcha, rank=2)
        │   └── PHRASE (binary 2w) מִ/בֵּ֣ית לֵוִ֑י
        │       ├── [2] מִ/בֵּ֣ית (munach (conjunctive), rank=9)
