    (the place formerly Luz); named_before_any_presence flag expected
    (gen_45 wells precedent — place never installed as entity).
    (11) 28:20 THE FIRST VOW. nadar 5087 tok1/15 + neder 5088 tok1/34 —
    verb + noun COGNATE-ACCUSATIVE DOUBLE DEBUT: the vow-institution is
    born here (noun career → Lev 27, Num 30 vow-law); conditions open: im
    yihye Elohim imadi; u-shemarani 8104 tok10 — keep-verb toks 9→10
    CONSECUTIVE: God's promise-word quoted straight back as the vow's
    condition; ve-natan 5414 tok61; THE BREAD-AND-GARMENT PAIR: lechem
    3899 tok7 — toks 5-6-7 = 25:34 the birthright-sale bread → 27:17 the
    deception bread → the vow's bread; beged 899 tok4 — toks 1-2-3 = 24:53
    bride-gifts → 27:15 the deception garments → 27:27 the smelled
    garments → the vow's garment. BOTH vow-objects arrive with the
    deception as their immediately previous career token.
    (12) 28:21 conditions close: ve-shavti 7725 tok32 + ve-shalom 7965
    tok4 (toks 1-3: 15:15 grave-peace to Abraham, 26:29/31 the Gerar
    oath-peace) el bet avi; then-clause: ve-haya YHWH li le-Elohim.
    (13) 28:22 THE HANDLER. even 68 tok5 (stone toks 3-4-5 in-unit; toks
    6+ = 29:2-3 the WELL stone — the career bridges into the next unit);
    samti 7760 tok19; matzeva 4676 tok2; titen 5414 tok62; aser aasrenu
    6237 toks 1-2/5 — tithe-VERB double debut, infinitive-absolute pair
    ("I will surely tithe"); the noun maaser 4643 tok1 = 14:20, Abram's
    tithe to Malkitzedek: the grandfather tithed a priest, the grandson
    vows the tithe to God directly. Vow installed as standing HANDLER
    (lev_13 weqatal-chain class) — a WORLD fact, never a SPECS push.
    UNIT END: SPECS 0 throughout · REGISTRY 1 write (beit_el) · TESTS 0.

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_48_2026-08-08.md; manifest verified
    17/17 checkable, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified). THE THREE PLACE-WORDS
    [G48-01/02, Kitzur Baal HaTurim; Chullin 91b named]: the
    place-word stands THREE times in the arrival verse (28:11 — "he
    ENCOUNTERED the place... the stones OF THE PLACE... he lay down
    IN THE PLACE") = the three pilgrimage ascents of his children,
    counted whole on SNAPSHOT. THE QUENCHED SUN [G48-03, Kitzur]:
    כי בא השמש ("for the sun had come") — the initials spell כבה
    ("EXTINGUISHED"): the early sunset in the first letters. THE
    ESCORT-ANGELS' TWO STATIONS [G48-04, Kitzur]: מלאכי אלהים
    ("angels of God") exactly TWICE in the Torah — the ladder (28:12)
    and the camp that MEETS him at Machanaim (32:2): those who
    ascended at the exile's first night come down to meet him at its
    end — the escort-exchange reading on a two-token census. THE ONE
    STATIONED-WORD [G48-05, Kitzur]: the passive stationed-form
    ("a ladder STATIONED toward the ground") has ONE Torah token;
    the Masorah's other two — Shechem's oak (Judg 9:6) and the
    siege-post (Isa 29:3) — are Prophets-side: entry and exile in the
    word's own later career. THE TORAH'S ONE "AND BEHOLD — YHWH"
    [G48-06, Kitzur]: the four-letter Name directly after "and
    behold" stands once in the Torah, stationed over the ladder
    (28:13); the Masorah's other three (the plumb-wall, the
    sky-windows, the passing at Horeb) are all Prophets
    chariot-visions, named. ACCENTS AS RULED [G48-07/12/14/17,
    Minchat Shai]: השמימה ("heavenward") with no pashta (the
    forward-leaning accent) — the verse's rest sits on it; זה
    ("THIS is none other") under revia (the resting dot); לחם ("the
    vow's bread") under tevir (the broken descending accent); שבע
    of Beer-sheva with the shin in pausal qamatz (the long a) — the
    printed patach and the segol book rejected in Minchat Shai's own
    words, "the wind shall carry them all." THE SEED-WORD'S BARE VAV
    [G48-08]: ובזרעך ("and in your seed") — no meteg (the lengthening
    stroke) on the vav, as ruled. AGAINST THE ANOMALY [G48-09]:
    אעזבך ("I will not LEAVE you") in hataf segol (the compound
    short e), not the Jerusalem manuscript's hataf qamatz that
    Minchat Shai calls "a great anomaly" — SNAPSHOT sides with him
    (the twin, "I will serve you" of the wage, banked for the next
    unit). THE FULL WAKING [G48-10]: וייקץ ("and Jacob AWOKE") with
    TWO yods per all the precise books and the Ramah's Noah-verse
    precedent; the Masorah's three lean wake-tokens — Samson's,
    Solomon's, the sleeper-psalm's — all outside the Torah: the
    Torah wakes its sleepers full. THE CONGREGATION IN THE FINALS
    [G48-11, Kitzur]: the four words "and Jacob AWOKE from his sleep
    and SAID" end in the letters of צבור ("congregation"), in order —
    prayer heard only in community, read off the last letters at the
    house of God. THE SECOND SPLIT-ATTESTED STATION [G48-13]: ויצק
    ("and he POURED oil") — the books divided on the tzadi: Or Torah
    soft, the custom dagesh (the doubling dot); SNAPSHOT reads it
    SOFT, joining Or Torah's camp (the note's own cross-reference to
    the pillar's second anointing at 35:14 banked). THE FIRST VOWER
    [G48-15, Kitzur]: וידר ("and he VOWED") exactly twice in the
    Torah — Bethel (28:20) and Israel's vow at Hormah (Num 21:2);
    Jephthah's is Prophets-side: the vow-psalm's "Mighty One of
    JACOB" because he opened the vows — the census puts him first on
    the letter. THE HIGH PRIEST IN THE VOW'S GARMENT [G48-16,
    Kitzur; Bereshit Rabbah's Michael exchange]: ללבש ("to WEAR") —
    two Torah tokens: the vow's garment (28:20) and the HIGH-PRIEST
    investiture clause (Lev 21:10, "on whose head the anointing oil
    was poured... to WEAR the garments"): the Jacob-as-high-priest
    teaching rides the pair — beside the oil this unit pours on a
    head-stone. INSTRUMENT GAP [G48-18, manual]: whether a CLOSED
    paragraph-break precedes "and Jacob went out" (28:10) — Sefer
    Tagi against the Spanish codices; the Kitzur reads the closedness
    as the flight's own secrecy; paragraph layer uninstrumented.
    READINGS (named-only, unclaimed): the Kitzur's ladder cluster —
    the ladder as Sinai, as the exiles' ends, as prayer's voice, as
    the Temple ramp with its priests, as the throne-vision; the
    ascending-descending counted as the four kingdoms; "from his
    sleep" read "from his study"; dawn as the gate-opening hour of
    prayer; the tithe capped at a fifth; "and you shall spread out"
    as the splitting of the sea.
