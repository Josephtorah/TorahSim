  draft_note_en: >
    DRAFT 2026-08-06 · SOLO ERA unit #1 (Claude coordinator+deriver; external
    fresh-context review before freeze per standing law). Span: 28:10–22, the
    natural Bethel boundary (29:1 opens the Haran arrival). 13 verses · 191
    tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C. Conventions:
    step he: = plain (no accents/meteg; maqqef ־ per snapshot); tree halves =
    accents kept, morpheme slashes stripped; split at etnachta. Onkelos
    BUFFER PENDING. Instruments asleep (tov/shaah/tzaddik/nichoach 0 hits).

    UNIT SHAPE (the machine's quietest ledger since the primeval units):
    ZERO volitives in the whole span (morph scan verified — no imperative,
    jussive, or cohortative anywhere). SPECS stays EMPTY all 13 steps: God
    speaks only 1cs commitments (promise-FACTS; the gen_32 demand-on-God
    fence never triggers because nothing is volitive), and Jacob answers
    with the Torah's FIRST VOW — a conditional self-obligation installed as
    a standing HANDLER (lev_13 class: nothing demanded of the narrative
    present, no receipt owed). The unit's one register motion is the NAME
    WRITE at 28:19 (first REGISTRY write since gen_45's four wells).

    CARE-POINTS (filed before derivation; every ordinal below DB-verified):
    (1) 28:10 DEPARTURE. yatza 3318 tok50 va-yetze; Beer-sheva 884 tok9;
    charan 2771 toks 5→6 CONSECUTIVE — 27:43 mother's "flee to Haran" →
    28:10 his road (gen_47 landing-note pays).
    (2) 28:11 THE PLACE ×3. maqom 4725 toks 25-26-27 (six in-span, 25–30 —
    place-word saturation); paga 6293 tok2 (tok1=23:8 Machpelah "entreat");
    SUN FRAME: shemesh 8121 tok4 SETS here — toks 1-2 = 15:12/15:17 the
    covenant-between-the-pieces sunset; tok5 = 32:32 the sun RISES at Peniel
    on his return: the exile is framed sunset→sunrise; even 68 tok3 (stones
    plural); meraashot 4763 tok1/2 — BOTH Torah tokens inside this unit
    (28:11, 28:18); shakhav 7901 tok10.
    (3) 28:12 THE DREAM DEBUT. chalam VERB 2492 tok1/18 DEBUT (the dream
    noun 2472 debuted at 20:3 with Avimelech; the verb is born HERE and then
    SLEEPS UNTIL JOSEPH: tok2 = 37:5 — the 31:10-11 Laban-cycle dreams use
    the NOUN, 2472 toks 3-4); sulam 5551 tok1/1 TORAH HAPAX
    (the ladder); mutzav 5324 tok6 hophal "stationed."
    (4) 28:13 THE STATIONED LORD. nitzav 5324 tok7 — root toks 6→7
    BACK-TO-BACK: the ladder is stationed, YHWH is stationed (prior career:
    18:2 three men, 21:28-29 set-apart ewes, 24:13/43 servant at the well);
    ani YHWH elohe Avraham avikha ve-lohe Yitzchaq (self-identification
    FACT); shokhev 7901 tok11 — God names Jacob's lying-place as the grant;
    etnena 5414 tok60 — give-verb toks 60-61-62 all IN-UNIT (28:13 grant /
    28:20 vow-condition / 28:22 tithe-condition), extending gen_47's 56-59:
    SEVEN give-tokens walk 27:28→28:22 (56=27:28, 57=27:37, 58-59=28:4,
    60-61-62 here) blessing→sustenance→grant→promise→vow→tithe. All 1cs divine speech = COMMITMENT-FACT class, no push.
    (5) 28:14 THE DUST FORMULA. afar 6083 tok9 (toks 5-6 = 13:16 Abraham's
    dust-promise ×2); paratz 6555 tok1/7 DEBUT (spread abroad); four
    directions; ve-nivrakhu 1288 tok55 — bless-verb toks 50–55: SIX
    consecutive career tokens inside the gen_47+48 spans; the all-families
    formula RETURNS TO ITS 12:3 NIPHAL FORM (12:3 tok10 niphal → 18:18
    tok17 niphal → 22:18/26:4 toks 20/30 hitpael → 28:14 tok55 niphal, now
    to Jacob).
    (6) 28:15 THE FIVE-FOLD PROMISE (1cs commitment-FACTS): anokhi imakh;
    u-shemartikha 8104 tok9 (keep); va-hashivotikha 7725 tok31 — return
    toks 31-32 IN-UNIT continue gen_47's 29-30: the mother's wrath-return
    wait-pair → God's return-promise → the vow's return-condition; lo
    eezavkha 5800 tok3 — leave-verb toks 1-2-3: 2:24 a man LEAVES father
    and mother → 24:27 God has not left covenant-kindness → "I will not
    leave YOU," said to the man who has just left father and mother; ad
    asher im-asiti (performance horizon, God's own).
    (7) 28:16 THE WAKING. yaqatz 3364 tok2 — tok1 = 9:24 NOAH, the only
    prior waker in the Torah (wine→curse vs dream→awe); shena 8142 tok1/2
    DEBUT (sleep-noun); akhen 403 tok1/2 DEBUT ("surely"); yesh YHWH
    ba-maqom (maqom tok28); ve-anokhi lo yadati.
    (8) 28:17 THE FEAR DOUBLET. yare 3372 toks 9-10 — SAME ROOT twice in
    one verse (va-yira narrative + nora niphal participle "awesome"); bet
    Elohim (bayit 1004 tok34); shaar 8179 tok6 — gate career: 19:1 Sodom's
    gate → 22:17 enemies' gate → 23:10/18 Machpelah witnesses → 24:60
    seed-gate blessing → the GATE OF HEAVEN.
    (9) 28:18 THE PILLAR AND THE OIL. hishkim 7925 tok7 (full prior career
    toks 1-6: 19:2 Lot's guests, 19:27 Abraham to the smoke, 20:8
    Avimelech, 21:14 Hagar's bread, 22:3 the Aqedah, 26:31 the Gerar oath); laqach 3947 tok85 (THE stone); sim 7760 toks 17-18 in-verse
    (sam placed → va-yasem set as pillar; tok19 = 28:22 samti vow-recall);
    matzeva 4676 tok1/16 DEBUT (pillar); yatzaq 3332 tok1/19 DEBUT (pour;
    career → Exodus casting and anointing); shemen 8081 tok1/106 — OIL
    ITSELF DEBUTS on this stone (career → anointing oil, menorah, the
    offerings).
    (10) 28:19 THE NAME WRITE. va-yiqra et-shem formula → REGISTRY write
    #1: name(ha_maqom_luz) := beit_el. Beit-El 1008 tok5 — toks 1-4 are ALL
    narrator-proleptic (12:8 ×2, 13:3 ×2 — Abraham's altar site): the
    letter used the name four times before the naming; ulam 199 tok1/4
    DEBUT ("however") + luz 3870 tok1/3 (toks 2-3 = 35:6, 48:3 — Jacob
