    comment_en: >
      Written trees first. Prefer Sifrei Bamidbar on law densification; MH possible; never silent-merge.
    source: "[PROJECT]"
  - id: ORAL_sample_1
    status: dual_track
    work_en: Sifrei Bamidbar
    locus_en: "Sifrei Bamidbar: sifrei_bamidbar_he"
    he_sample: "וידבר ה' אל משה לאמר צו את בני ישראל וישלחו מן המחנה למה נאמרה פרשה זו. לפי שהוא אומר ואיש אשר יטמא ולא יתחטא (במדבר יט) עונש שמענו אזהרה לא שמענו, תלמוד לומר צו את בני ישראל וגו' [ולא יטמאו את מחניהם] הרי זו אזהרה לטמאים שלא יכנסו למקדש בט"
    he_translit: "see Hebrew sample in local Data dump"
    en_sample: "[EN-AID] Sample only; not derivation source; dual-track."
    comment_en: >
      Dual-track sample — does not rewrite Written tree-derived STEPs.
    source: "[ORAL][SIFREI]"
    confidence: hypothesis
  - id: ORAL_sample_2
    status: dual_track
    work_en: Sifrei Bamidbar
    locus_en: "Sifrei Bamidbar: sifrei_bamidbar_he"
    he_sample: "צו הצווי מיד בשעת מעשה ולדורות. אתה אומר הצווי מיד בשעת מעשה ולדורות, או אינו אלא לאחר זמן. תלמוד לומר צו את בני ישראל ויעשו כן בני ישראל וישלחו אותם. הא למדת שהצווי מיד בשעת מעשה. לדורות מנין, תלמוד לומר צו את בני ישראל ויקחו אליך שמן זית "
    he_translit: "see Hebrew sample in local Data dump"
    en_sample: "[EN-AID] Sample only; not derivation source; dual-track."
    comment_en: >
      Dual-track sample — does not rewrite Written tree-derived STEPs.
    source: "[ORAL][SIFREI]"
    confidence: hypothesis
  - id: ORAL_sample_3
    status: dual_track
    work_en: Sifrei Bamidbar
    locus_en: "Sifrei Bamidbar: sifrei_bamidbar_he"
    he_sample: "וישלחו מן המחנה מחנה שכינה. שומע אני ממחנה לויה תלמוד לומר אל מחוץ למחנה תשלחום. הא עד שלא יאמר יש לי בדין אם נדחו טמאים ממחנה ארון הקל, קל וחומר ממחנה שכינה החמור. אלא אם אמרת כן ענשת מן הדין, לכך נאמר וישלחו מן המחנה ללמדך שאין עונשין מן "
