    about what a man will NOT keep. The letter holds the king-word
    back through Babel and Egypt and spends it twenty-seven times
    here; then it sets three kings around one man: the king of
    Elam (defeated, offstage), the king of Salem (bread, wine, and
    the corpus's first priest), and the king of Sodom (two
    imperatives and no thanks) — and Abram answers the last with
    the corpus's first oath: not a thread, not a thong.
