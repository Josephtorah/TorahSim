      the doomed vale), the tribute clock, the four-vs-five + the
      bitumen pits (Babel's mortar-word), Lot's address (the slide
      across the frozen wall complete), the ally-covenant (brit
      token 9 — the first human-human), the 318 (chanikh hapax),
      the priest-fact (kohen's debut on a Canaanite king; el tokens
      1-4 all El Elyon), the two barukh formulas (the first
      human-blesses-human; the qoneh epithet — Chavah's verb on the
      cosmos), the miggen deliverance-clause (the war's only
      theology, a guest's), the oath-gesture (the corpus's first
      human oath, before the swear-verb exists; Abram's first
      spoken YHWH, the priest's epithet YHWH-prefixed), the
      thread-and-thong + motive pair (three hapaxes spent on
      refusing), the eaten-exception. The AGENTLESS TENTH stands
      as an event with hidden hands [flag 3 — held OPEN, the
      buffer declines to vote too]. TESTS: EMPTY (a war judged by
      no one in the letter). LEDGER: EMPTY. FLAGS:
      read_before_install x23. THE SHAPE IS THE STATE: eleven
      verses of voiceless annal, then every speech in the chapter
      is about giving and taking — a priest gives bread and
      blessing and (someone) gives a tenth; a king demands give
      and take; and the man who could keep everything raises a
      hand, says the Name for the first time, and keeps nothing
      but other men's portions.

exports:
  - id: EXPORT_refused_demands_and_the_first_oath
    he: תֶּן־לִי הַנֶּפֶשׁ וְהָרְכֻשׁ קַח־לָךְ … הֲרִימֹתִי יָדִי אֶל־יְהוָה
    he_translit: "ten-li ha-nefesh ve-ha-rekhush qach-lakh … harimoti yadi el-YHWH"
    en: "THE REFUSAL RULING [flag 1, boldest]: the king of Sodom's imperative pair pushes two human LET demands (gen_13's class; qach-lakh VERSE-FINAL — gen_28's demand-on-the-silluq class, quoted and landed) and Abram REFUSES ALOUD with the corpus's FIRST HUMAN OATH — harimoti yadi ('I have raised my hand', rum token 2 after the ark-lifting waters; the im-formula self-curse whose only Gen-1-14 instance is 14:23; the swear-verb debuts seven chapters later) — and THE QUEUE DOES NOT MOVE: no RESULT fires because nothing is executed (the goods stay untaken — the oath negates the demand in its own verb, eqach answering qach; the persons were already BROUGHT BACK at 14:16 before the king asked, and no transfer is ever narrated); a refusal is a FACT about a demand, not an operation on it — frozen gen_28's arithmetic quoted, zero interpreter extensions; the third demand is Abram's own jussive for his allies (yiqchu — gen_23's jussive-LET class, his second issuing ever after the corpus's only settled human demand, frozen gen_29's hipared); queue ends 3 OPEN, all human, two refused aloud, one issued in another's favor"
  - id: EXPORT_malki_tzedeq_field
    he: וְהוּא כֹהֵן לְאֵל עֶלְיוֹן … וַיִּתֶּן־לוֹ מַעֲשֵׂר מִכֹּל
    he_translit: "ve-hu khohen le-el elyon … va-yiten-lo maaser mi-kol"
    en: "the Salem field: KOHEN ('priest') debuts on a Canaanite king (tokens 2-5 all Egypt's priests — one Salem, four Egypt, before Aaron's law); EL — the divine name's debut, tokens 1-4 all EL ELYON in-span, the El-title ladder following (El Roi 16:13, El Shaddai 17:1, El Olam 21:33); the FIRST HUMAN-BLESSES-HUMAN (barakh token 11; gen_23's 9:26 inversion quoted — the triangle completes: God blessed humans, a human blessed God, now a human blesses a human, and he is the man of gen_27's 12:3 blessers-guard [prose, nothing pops]); QONEH shamayim va-aretz — Chavah's acquire-verb (4:1 qaniti) become the cosmos's title-deed; the AGENTLESS TENTH [flag 3]: va-yiten-LO maaser mi-kol — giver and receiver both bare pronouns, held OPEN (Onkelos keeps both pronouns bare — the buffer declines to vote); maaser's tokens 2-4 are Lev 27:30-32, THE TITHE LAW: the law-word born three books early in a gift with hidden hands (the nega bridge-class); Abram's oath ADOPTS the epithet YHWH-PREFIXED (el-YHWH el elyon qoneh...) — his first spoken YHWH, fused to a foreign priest's liturgy [letter fact; chain files named-only]"
  - id: EXPORT_the_annal_and_the_king_word
    he: וַיְהִי בִּימֵי אַמְרָפֶל … אַרְבָּעָה מְלָכִים אֶת־הַחֲמִשָּׁה
    he_translit: "va-yehi bi-ymei amrafel … arbaah melakhim et-ha-chamishah"
    en: "the corpus's first WAR ANNAL — eleven verses, ZERO speech (the longest voiceless narrative stretch): MELEKH ('king') born x27 exact (the letter never crowned Nimrod, Babel, or Pharaoh; tokens 28-29 are the covenant's 'kings shall come out of you', 17:6/17:16); MILCHAMAH ('war') debuts MADE (asu — the six days' make-verb); the tribute clock (avad token 6 — the garden's work-verb turned vassalage; marad 'rebel' debut); the four-vs-five; beerot beerot chemar — the WELL-word debuts doubled as tar-pits and the bitumen is Babel's mortar-word (11:3, token 2); yam ha-MELACH: the salt-word debuts naming the doomed vale's sea and its token 2 is 19:26 — Lot's wife, the pillar; En-mishpat — the JUDGMENT-skeleton's first surface, a place-name before the concept (18:19/25 next); the proleptic names held named-only (ha-Amaleqi before Amalek's birth at 36:12; Dan before 30:6); the giant-peoples file; and the hybrid encoding itself — gen_24's grouped-row device on the letter's own annal-paragraphs, ratified by the owner"
  - id: EXPORT_rescue_arc_take_and_restore
    he: וַיִּקְחוּ אֶת־לוֹט … וַיָּשֶׁב אֵת כָּל־הָרְכֻשׁ … הֵשִׁיב
    he_translit: "va-yiqchu et-lot … va-yashev et kol-ha-rekhush … heshiv"
    en: "the take/restore arc across three units: LAQACH tokens 24-28 in-span (plunder taken, LOT taken — one verb for goods and kin; the king's qach!; Abram's ve-im-eqach; the allies' yiqchu) after gen_28's passive/confession/imperative triad (tokens 21-23), and token 29 is 15:9 — GOD says take next, across the seam; SHUV IN HIPHIL debuts DOUBLED (va-yashev... heshiv, 14:16 — the restore-voice born on persons and goods, everything returned BEFORE any demand was spoken); AVRAM HA-IVRI — the Hebrew-gentilic's debut (gen_27's crosser-note lands; tokens 2-6 all Yosef-in-Egypt); BRIT token 9 = baalei verit-avram, the covenant-word's first human-human token (tokens 1-8 all divine — census); the 318 chanikhav (Torah hapax) mustered by va-yareq (the sword-unsheathing verb on men); Lot's slide complete across the frozen wall (gen_29's va-yeehal ad-sedom -> yoshev bi-Sedom, both verse-final on Sodom); and the seam-pun staged, not encoded: 14:20's miggen ('delivered', piel hapax) awaits 15:1's magen ('shield') — same skeleton, verb then noun, wall between them"

oral_notes:
  - id: ORAL_gen30_queue
    status: observation
    work_en: "Bereshit Rabbah 42-43 (the span; Amraphel-is-Nimrod class; the 318-as-Eliezer gematria class); Rashi at 14:7, 14:13, 14:14, 14:18, 14:22; Ramban at 14:1 (the four-kingdoms typology); Bavli Nedarim 32b (Malki-Tzedek and the priesthood-transfer class); Chullin 89a (the thread-and-thong reward class — the tzitzit thread, the tefillin strap); the maaser giver-identity dispute — gen_30 Tier-A queue"
    he: וּמַלְכִּי־צֶדֶק מֶלֶךְ שָׁלֵם
    he_translit: "(queue — named only)"
    en: >
      Named, not read. The cache middot scan is the MAIN LOOP'S gate
      and is not claimed by this draft [flagged]. Predicted classes:
      the IDENTIFICATION class (Amraphel/Nimrod, Malki-Tzedek/Shem,
      Salem/Jerusalem — and the buffer itself performs the last one,
      see Tier-A); the GEMATRIA class (318/Eliezer — named-only, no
      numerology in the machine); the FOUR-KINGDOMS typology class
      (Ramban's program on the four kings); the PRIESTHOOD-TRANSFER
      class (Nedarim 32b on kohen's debut); the REFUSAL-REWARD class
      (Chullin 89a: the thread and the thong repaid as commandments);
      the TITHE-DIRECTION dispute (who gave to whom — the letter's
      hidden pronouns).
    comment_en: "Queue entry — no claim made beyond the naming."
    source: "[ORAL][NAMED-ONLY]"
  - id: ORAL_onkelos_tier_a
    status: verified
    work_en: "Onkelos Genesis 14:1-24 — read Tier-A at derive time (24 sequential fetches, 0.5s spacing, Data/FETCHLOG.md 2026-08-03)"
    he: מַלְכָּא דִירוּשְׁלֶם … מְשַׁמֵּשׁ קֳדָם אֵל עִלָּאָה
    he_translit: "malka di-yerushlem … meshamesh kodam el ilaah"
    en: >
      The span's translation witness — headline: 14:18's DOUBLE
      MOVE. Salem is IDENTIFIED — malka di-YERUSHLEM ('king of
      JERUSALEM'): the buffer names the city the letter conceals;
      and in the same verse the priest-word is WITHHELD — kohen's
      Torah-debut token is rendered MESHAMESH KODAM ('one who
      SERVES BEFORE') El Elyon: the buffer un-priests the man the
      letter ordains [find-class: identification + title-dodge in
      one verse; dual-track, flagged]. SECOND: the oath gains
      PRAYER — harimoti yadi -> areimit yedai BI-TZLO kodam YHWH
      ('I have raised my hands IN PRAYER before the LORD'): the
      raw hand-gesture liturgized, the tzali-family policy a third
      consecutive unit (gen_27's call-as-prayer, gen_29's ve-tzali,
      now the oath) [repeat-policy, landed]. THIRD: the QINYAN
      convergence — qoneh shamayim va-aretz -> di-QINYANEH ('whose
      POSSESSION'), and qinyana is the buffer's word for the war's
      rekhush ('property') all span long (14:11, 12, 16, 21): in
      Aramaic the plunder kings die for and the cosmos God owns
      share one noun [cross-buffer observation]. FOURTH: the
      compass policy CONFIRMED as repeat buffer — mi-semol
      le-damaseq ('on the LEFT of Damascus') -> MI-TZIPUNA ('on
      the NORTH'): the same body-relative-to-compass conversion
      that erased frozen gen_29's two hapax direction-verbs at
      13:9 [repeat-buffer, landed]. FIFTH: the take-verb hardened
      — va-yiqchu x2 (14:11-12) -> U-SHVO ('they took CAPTIVE'),
      and the king's qach (14:21) -> DVAR ('LEAD away'; variant
      sav): the lead-for-take buffer (gen_26's 11:31, gen_28's
      triad) now criminalizes plunder and buffers even a demand's
      imperative [repeat-policy]. Watch-points answered: the
      MAASER pronouns stay bare (vi-hav leh — the buffer DECLINES
      TO VOTE on the tithe's direction); the im-oath formula KEPT
      (im... ve-im essav — contrast 13:16's dare, which the buffer
      resolved). Also: the giant-peoples translated to epithets
      (Refaim -> gibbaraya 'the mighty', Zuzim -> takifaya 'the
      strong', Emim -> eimtanei 'the terrible'); En-mishpat ->
      meishar pillug dina ('the plain of the DIVISION OF
      JUDGMENT') with Kadesh -> Reqam and Chatzetzon-tamar -> EIN
      GEDI [identifications]; emeq shaveh -> beit reisa de-malka
      ('the king's racecourse' — a hippodrome inserted); Shinar ->
      BAVEL x2; Goyim -> ammei ('peoples'); baalei brit -> enashei
      qeyameh; chanikhav -> uleimohi ('his young men' — the hapax
      flattened); va-yareq -> ve-zareiz ('he armed').
    comment_en: "Read from Data/sefaria_texts/ (local; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

  - id: ORAL_reading_pass_2026_08_25
    status: verified
    work_en: "RE-era reading pass 2026-08-25 (parashat Lech Lecha sweep, block 4 of 7; ledger logic/oral_triage/gen_30_war_of_kings_2026-08-25.md)"
    he: נקרא כולו
    he_translit: "nikra kulo (read in full)"
    en: >
      The v1 queue above is DISCHARGED: the declared core shelf was read
      end to end this sitting. HEADLINES: the THREE-SCROLLS MAJORITY
      PROCEDURE — the Temple court's two-against-one text criticism —
      with our 14:3's hee ('she/it' written with yod) inside the
      ELEVEN-CENSUS of minority spellings; the KEDOR-LAOMER TWO-WORD
      scribal rule (one name, divisible, never split across a line);
      the hu/hi KADESH ketiv (written form); the PRIESTHOOD TRANSFER
      read off the BLESSING ORDER of 14:18-20 (Malki-Tzedek blessing
      Abraham before God — the priesthood passing to Abraham's line),
      with Tamar's death-law corollary and the JERUSALEM NAME
      compromise (Shalem + Yireh); the FOUR-KINGDOMS TYPE stamped on
      14:9 (four kings against five); the DIVIDED-NIGHT gezerah shavah
      (verbal analogy) joining our 14:15 to Egypt's midnight at both
      seats, with the Laila-angel/stars machloket (recorded dispute);
      the OG DOSSIER with its provenance variance (the escapee's
      identity and motive); 318 = ELIEZER by letter-count at four
      seats; the IVRI gezerah shavah — our 14:13's 'Abram the Hebrew'
      carried into Exodus 21:2's Hebrew-slave opening; the
      THREAD-AND-SHOELACE reward — two commandments repaid for 14:23's
      renunciation, with the SEAT VARIANCE recorded (tzitzit-fringes +
      chalitzah-sandal vs tzitzit + tefillin-straps); the DAVID SPOILS
      STATUTE sourced to 14:24 (equal shares, the ones who sat with
      the gear); the TITHE/TERUMAH institution census on 14:20; the
      PARTNER-IN-CREATION claim on 14:19's koneh ('possessor/maker of
      heaven and earth') with the kinyan (acquisition) censuses'
      4-vs-5 count variance; the DAN proleptic vision (14:14 — the
      idolatry that will stand there weakening the pursuit); the
      twelve/thirteen years machloket of 14:4; and the SODOM
      TRANQUILITY arithmetic. MIDDOT on the record: gezerah shavah
      twice named; the middot-transmission question itself surfacing
      at the blessing seat. Findings in the ledger; dual-track
      throughout; no reading merged into the machine.
    comment_en: "Reading-pass record; the stamp and ritual remain the owner's word (batch, per parashah)."
    source: "[ORAL][READ-THROUGH]"

