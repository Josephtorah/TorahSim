  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #9 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    32:1-33, from Laban's morning kiss to the sinew rule. 33 verses · 453
    tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C. Conventions:
    step he: = plain (no accents/meteg; maqqef ־ per snapshot); tree halves
    = accents kept, slashes stripped; split at etnachta — ALL 33 verses
    carry one (token-map scan; second all-etnachta unit in a row). Onkelos
    BUFFER PENDING.

    UNIT SHAPE — SEVEN pushes, ZERO pops, SEVEN OPEN at the wall: the
    THIRD all-open seven in the corpus (gen_34's Mamre, gen_54's Gilead,
    now Peniel — final-scenario scan 2026-08-07; still exceeded only by
    gen_35's 13 and gen_46's 12). The seven, in queue order: (1) 32:5
    LET?(tomrun) — the messengers' say-instruction, coded imperfect in a
    command frame (HVqi2mp + paragogic nun): TIR-028's mandatory ?-guard
    (gen_21's device, gen_33's 17:9 tishmor precedent); the delivery to
    Esau is NEVER narrated — the messengers return saying only banu ("we
    came") — an in-speech report, no narrated delivery anywhere in-span
    (a homograph-echo of gen_25's 11:5 banu ruling — build-verb there,
    come-verb here — background clause, not receipt; the operative
    letter-fact is that no say-performance to Esau is ever narrated); (2) 32:12 LET(hatzileni(YHWH, mi_yad_esav)) — the
    rescue-imperative pushed ON GOD (gen_40's haqreh-na imperative-on-YHWH
    precedent; gen_32's mood law) — and the rescue-verb natzal 5337 walks
    demand tok3/25 → performance tok4/25 = 32:31 va-tinatzel nafshi:
    delivered FROM THE WRONG DANGER — Jacob asks rescue from his
    brother's HAND, the career's next token rescues him from God's FACE
    (panim el panim), consecutive tokens, object mismatch (gen_50 class):
    card OPEN — the Esau-hand horizon is 33:4's embrace, outside the
    span; (3-4) 32:17 LET(ivru(avadav, le_fanai)) + LET?(tasimu(revach))
    — pass-before-me demanded of the SERVANTS; the pass-verb returns at
    32:22 with the GIFT as its subject (va-taavor HA-MINCHA, avar toks
    13→14 consecutive; 3fs morph HC/Vqw3fs): same root, wrong performer
    (gen_51 class) — the spacing-order (revach 7305 1/1 HAPAX) is never
    narrated at all; (5) 32:20 LET?(tedabrun) — the second say-imperfect
    (HVpi2mp + nun), never narrated; the say-chain alternates moods and
    only the imperfects push: tomrun (LET?) → ve-amarta (weqatal
    duty-content, gen_40 class, no push) → tedabrun (LET?) → va-amartem
    (weqatal, no push); (6) 32:27 LET(shalcheni(yaaqov)) — THE WRESTLER'S
    SEND-ME: the exact piel imperative-with-1cs-suffix form occurs TWICE
    in the Torah [VERIFIED: full 7971 morph census] — 30:25 Jacob to
    Laban (gen_52's never-performed headline) and 32:27 the ish to Jacob:
    the send-me demand fails in BOTH directions across the corpus; here
    it is REFUSED with a condition (gen_35's refused-demand class): lo
    ashalechakha ki im berakhtani — and the refusal quotes the demand's
    own verb back (toks 37→38 consecutive); the blessing then COMES
    (32:30 va-yevarekh oto sham — the stated condition met on the
    letter), yet no sending is ever narrated — the ish simply is not
    there at sunrise: card OPEN; (7) 32:30 LET(hagida(ha_ish,
    et_shimkha)) — tell-me-your-name, REFUSED BY A QUESTION (la-ma ze
    tishal li-shemi — the ask-verb shaal answers its own token, 5/29 →
    6/29 consecutive) and answered with a BLESSING instead of the name:
    wrong-response landing, card OPEN. FENCED, NO PUSH: 32:10's shuv +
    ve-etiva (RETELLING fence, gen_41 — see CROWN); 32:21's akhapra
    (1cs cohortative inside quoted inner speech, ki amar — gen_47's
    27:41 no-addressee class); 32:9's contingency plan (self-addressed
    conditional, fact); 32:33's yokhlu (the law's imperfect rides the
    PATTERN op, not the queue). REGISTRY 2 writes (machanayim, peniel —
    both va-yiqra formula); the ISRAEL decree writes NOTHING (see
    care 13). TESTS 0 [VERIFIED: zero tov-adjective (2896) tokens in
    Gen 32 — the do-good VERB yatav 3190 ×3 is not the instrument].

    CROWN — THE REQUOTE LADDER (32:10-13): Jacob's prayer re-speaks
    YHWH's 31:3 command and escalates it in three DB-anchored steps.
    (a) 31:3 shuv el-eretz AVOTEKHA ("to the land of your FATHERS") →
    32:10 shuv LE-ARTZEKHA ("to YOUR land") — the letter-delta gen_53
    filed for this unit, now landed; (b) 31:3 ve-EHYE imakh ("I will BE
    with you") → 32:10 ve-ETIVA imakh ("I will DO-GOOD with you") — the
    presence-promise upgraded to a benefit-promise in the requote;
    (c) 32:13 ve-ata amarta HETEV ETIV imakh ("You said: doing-good I
    will do you good") — an infinitive-absolute doublet CITED AS QUOTE
    with no source utterance anywhere in the corpus: the do-good verb
    (3190) has exactly four tokens before this unit — God's conditional
    warning to CAIN (4:7 ×2), Abram to Sarai (12:13), Pharaoh's court
    (12:16) — none a promise, none to Jacob [VERIFIED: career census];
    and (d) the seed-simile: 32:13 ke-chol ha-yam ("as the SAND of the
    sea") — God's recorded word to Jacob was ka-afar ha-aretz ("as the
    DUST of the earth", 28:14 [VERIFIED: SNAPSHOT idx2-3]); the
    sand-simile belongs to the ABRAHAM promise (22:17), and chol 2344's
    career runs tok1 = 22:17 → tok2 = this requote, consecutive: Jacob
    quotes his grandfather's simile into his own promise. Four deltas,
    one prayer, every rung machine-checkable.

    CARE-POINTS (ordinals from debut_map via prestage unless tagged):
    (1) 32:1 THE KISS LANDS: va-yenasheq (5401 tok6/13) — gen_54's
    watch: the farewell kiss denied at 31:28 performs one verse past
    gen_54's wall — Laban kisses his grandsons and daughters and
    returns li-meqomo; va-yevarekh et-hem (1288 tok58/137) — the
    bless-verb walk this unit: Laban's farewell blessing (tok58) → the
    demanded blessing (berakhtani, tok59, 32:27) → the granted blessing
    (va-yevarekh oto sham, tok60, 32:30) — three tokens, farewell to
    wrestled.
    (2) 32:2 THE ENCOUNTER: va-yifgu vo malakhe Elohim (6293 tok3/8) —
    paga's Jacob-brackets: tok2 = 28:11 va-yifga ba-maqom (the
    Bethel-place ENCOUNTERED going out), tok3 = the angels encounter
    him coming back — the Laban years framed by two encounters; career
    → Exod 5:20 (meeting Moses and Aaron), Num 35's avenger-meets.
    (3) 32:3-4 THE UNMARKED WORD: machane Elohim ze (4264 tok1/104
    DEBUT — the CAMP-noun born; toks 1-6 ALL in-span: the camp-word's
    whole opening run is this unit's) → NAME write #1: machanayim
    (4266 tok1/1 HAPAX place-name, dual form — "TWO CAMPS") — and five
    verses later Jacob SPLITS into shene machanot (32:8): the dual
    name precedes its own enactment. Then malakhe Elohim (4397 tok14)
    → va-yishlach yaaqov MALAKHIM (tok15) — GOD'S MESSENGERS and
    JACOB'S MESSENGERS are consecutive tokens of one noun, the word
    unmarked between angel and envoy.
    (4) 32:5-6 THE MESSAGE: garti (1481 tok7/37 — the sojourn-verb:
    gen_44/45's Gerar career word in Jacob's self-description);
    va-echar (309 tok2/6 — the tarry-verb); shor (7794 tok1/52 DEBUT —
    the OX-noun born in a gift-list; career → 49:6 Levi's ox-hamstring,
    Exod 21-23's ox-laws: the goring-ox statutes' noun debuts here);
    li-metzo chen be-enekha (2580 tok5/27 — the grace-formula: career
    runs to Exod 33-34's find-grace cluster, toks 18-23).
    (5) 32:7 THE UNDELIVERED REPORT: banu el achikha el esav — gen_25's
    11:5 banu ruling, quoted at step 32:7 (a homograph-echo: build-verb
    there, come-verb here — background clause, not receipt); ve-arba meot
    ish — the 400 men (3967 tok54/194).
    (6) 32:8-9 THE SPLIT: va-yira yaaqov meod (3372 tok12/81 — the
    fear-pair: yareti 31:31 → va-yira 32:8, Laban-fear then Esau-fear);
    va-yetzer (3334 tok1/1 HAPAX — DISTRESS, spoken once ever);
    va-yachatz (2673 tok1/6 DEBUT — the DIVIDE-verb: tok2 = 33:1
    dividing the children; career → Exod 21:35's split-the-ox,
    Num 31's spoil-division: the divide-verb debuts dividing a family);
    li-feleta (6413 tok1/3 DEBUT — the REMNANT-noun born in Jacob's
    escape-arithmetic; tok2 = 45:7 Joseph's "great remnant", tok3 =
    Exod 10:5 the locusts eat the peleta — the survival-word's whole
    career is remnant-math).
    (7) 32:10-13 THE PRAYER (see CROWN): qatonti (6994 tok1/1 HAPAX —
    "I am too small": the humility-verb spoken once in the Torah);
    mi-kol ha-chasadim u-mi-kal ha-emet (2617 tok8/21; 571 tok4/11) —
    the kindness-and-truth pair: chesed toks 6-7 = the SERVANT's
    journey-thanks (24:27,49), tok8 = Jacob's prayer; careers meet
    again at Exod 34:6-7 (chesed toks 14-15, emet tok8 — the
    Attributes formula: rav-chesed ve-emet); ki ve-maqli avarti et
    ha-yarden (4731 tok7/9 — the ROD-noun: toks 1-6 = gen_52's peeled
    rods; tok7 = the crossing-staff — the rod-word's whole Genesis
    career is Jacob's; ha-yarden 3383 tok3/52 — the Jordan's third
    token, first CROSSED); em al banim (517 tok23/63) — the
    mother-upon-children fear; Deut 22:6's nest-law forbids taking
    ha-em al ha-banim [VERIFIED: 517 tokens at Deut 22:6] — the
    phrase Jacob dreads becomes the phrase the law protects.
    (8) 32:14-16 THE GIFT-LIST'S CAREERS: mincha (4503 toks 4-7/113 —
    toks 1-3 are CAIN AND ABEL's offerings, 4:3-5: the gift-noun's
    first family story ended in a brother's rage; its second deployment
    is engineered to APPEASE a brother's rage — the mincha returns
    between brothers, purpose inverted); izim 200 (5795 tok8/56);
    teyashim 20 (8495 tok2/2 CLOSES — the he-goat noun: 30:35 the
    deal's he-goats, 32:15 the gift's — born in the wage, spent in the
    appeasement); rechelim 200 (7353 tok2/2 CLOSES — gen_54's ewe-noun
    pair completes: the audit's ewes and the gift's); elim 20 (352
    tok5/117); gemalim meniqot (3243 tok3/11 — nursing); parot 40
    (6510 tok1/17 DEBUT — the COW-noun born in the gift: toks 2-12 =
    PHARAOH'S DREAM-COWS (41:2-27), toks 13-17 = the RED HEIFER
    (Num 19): Jacob's cows → the dream's cows → the ash-heifer);
    parim 10 (6499 tok1/92 DEBUT — the BULL of the cult: career = the
    covenant bulls of Exod 24:5, then the consecration and
    sin-offering cluster, Exod 29 onward); atonot 20 (860
    tok2/18 — toks 5-18 = BALAAM'S SHE-DONKEY, Num 22: fourteen of the
    noun's eighteen tokens are one talking donkey); eyarim 10 (5895
    tok1/3 DEBUT — toks 2-3 = 49:11, Judah's colt bound to the vine).
    The appeasement-herd's nouns keep walking into dream, oracle, and
    cult.
    (9) 32:17-22 THE WAVES: eder (5739 toks 6-10/10 — FIVE
    drove-tokens close the career IN-SPAN: four in 32:17 alone, the
    fifth at 32:20 — the drove-noun is born at the well (29:2-8, toks
    1-4), passes through the wage-flocks (30:40), and ENDS in the
    appeasement column); revach (7305 tok1/1 HAPAX — SPACE: the gap
    between droves is a word the Torah says once); yifgashkha (6298
    tok1/4 DEBUT — the MEET-verb: tok2 = 33:8 Esau's own "all this
    camp I MET", tok3-4 = Exod 4:24,27 — YHWH meets Moses to kill him,
    Aaron meets Moses to kiss him: the meet-verb's four tokens are all
    loaded encounters); ha-rishon / ha-sheni / ha-shelishi — the
    ordinal chain (7223 tok6/55; 8145 tok10/62; 7992 tok6/31);
    akhapra fanav (3722 tok2/79 — THE ATONEMENT-VERB'S SECOND TOKEN:
    tok1 = 6:14, PITCHING the ark with pitch (kofer); tok2 = Jacob
    COVERING his brother's face with a gift; toks 3+ = the altar and
    Yom Kippur cluster (Exod 29:33-37 onward) — the kipper-career:
    hull-sealing → face-appeasing → sin-covering); ulay yisa fanay
    (5375 tok23/168 — lift-my-face, the pardon idiom); panim ×10
    in-span [VERIFIED: 6440 count in Gen 32 = 10] — the FACE-WALK:
    messengers before-his-face → gift before-my-face → cover-his-face
    → lift-my-face → the gift passes al-panav → PANIM EL PANIM
    (32:31) — ten faces climbing to the Face.
    (10) 32:23-25 THE FORD AND THE ALONE: maavar yaboq (4569 tok1/1
    HAPAX — the FORD-noun, once ever; 2999 yaboq tok1/4 — career =
    border-clauses, Num 21:24, Deut 2:37, 3:16: the wrestling-river
    becomes a boundary-marker); achad asar yeladav — ELEVEN children
    cross (the letter's count); va-yivater yaaqov LEVADO (905 tok7/90
    — the ALONE-word: tok1 = 2:18 "it is NOT GOOD for the human to be
    ALONE" — the corpus's only failed TEST verdict (gen_09's 2:18
    lo-tov [VERIFIED: corpus grep — FAIL verdicts exist in gen_09
    alone]) sits on this word's debut; its seventh token strands
    Jacob alone at the ford, and there the name-changing struggle
    finds him);
    va-yeaveq (79 toks 1-2/2 — THE WRESTLE-VERB'S WHOLE TORAH CAREER
    lives in 32:25-26: two tokens, one night); ad alot ha-shachar
    (7837 tok2/3 — DAWN: tok1 = 19:15, the dawn that rushed Lot out
    of Sodom; toks 2-3 = the wrestling's dawn ×2 — the dawn-noun's
    Torah career CLOSES at 32:27: Sodom's escape-light and Peniel's
    release-light are all its mornings).
    (11) 32:26 THE TOUCH: va-yiga be-khaf yerekho (5060 tok7/54) —
    THE LADDER-ADJACENCY: naga's tok6 = 28:12 magia ha-shamayma — the
    LADDER TOUCHING heaven; tok7 = the ish touching Jacob's
    hip-socket: Bethel's touch and Peniel's touch are CONSECUTIVE
    career tokens — the two contacts between Jacob's world and God's
    sit side by side in the concordance; tok8 = 32:33 (the law's
    retell of this touch). va-teqa (3363 tok1/2 — WRENCHED; its only
    sibling is Num 25:4's grim hoqa); kaf yerekh (3409 toks 3-7/23 —
    the THIGH: toks 1-2 = the oath-thigh of 24:2,9 (gen_40's
    under-the-thigh oath): the thigh sworn upon and the thigh struck
    are adjacent in the career; toks 8-9 = 46:26/47:29 — the
    loins-of-descent and the NEXT thigh-oath).
    (12) 32:27-28 THE DEMAND AND THE NAME ASKED: shalcheni [UNIT
    SHAPE (6)]; ma shemekha → va-yomer yaaqov — Jacob hands over the
    name 25:26 wrote (gen_43's registry label spoken by its bearer);
    shaal (7592 toks 4-6/29 — vi-sheelkha 32:18 (the anticipated
    question), va-yishal 32:30, tishal 32:30 — the ask-verb clusters
    at the two name-askings).
    (13) 32:29 THE DECREE THAT WRITES NOTHING [gen_33's law]: lo
    yaaqov yeamer od shimkha ki im yisrael — negated imperfect
    (yeamer, HVNi3ms) + nominal clause: the DECREE-FACT class frozen
    at 17:5/17:15 (gen_33: "DECREES... NOT the va-yiqra narrative
    formula... the REGISTRY takes nothing"). The registry sleeps —
    AND THE COUNTERSIGN INVERTS: gen_33's letter-proof was that AVRAM
    dies in its own retirement verse (token 59/59 sits at 17:5) and
    the narrator obeys instantly; here the narrator writes YAAQOV
    three more times INSIDE THIS UNIT after the decree (32:30 idx1,
    32:31 idx1, 32:33 idx20 [VERIFIED: SNAPSHOT]) and 106 more times
    in the Torah (3290 total 212, this decree at tok103): the
    Abram-decree retired its name, the Jacob-decree does not — same
    decree grammar, opposite letter-behavior, and the machine reads
    the difference straight off the census. yisrael (3478 tok1/587
    DEBUT); ki sarita (8280 tok1/1 HAPAX — the STRIVE-verb lives only
    inside the name's own etiology) im Elohim ve-im anashim va-tukhal
    (3201 toks 10-11/64 — lo yakhol ("he could not prevail", 32:26)
    → va-tukhal ("and you PREVAILED") — the could-not and the
    prevailed are consecutive career tokens with opposite subjects:
    the loser of tok10 declares the winner of tok11).
    (14) 32:30 THE NAME REFUSED [UNIT SHAPE (7)]: hagida-na shemekha
    (5046 tok20/55 — gen_54's tell-chain: toks 16-18 were the
    flight's, tok19 = 32:6 the messengers' le-hagid, tok20 = the
    name-demand); la-ma ze tishal li-shemi — the question that
    answers a question; va-yevarekh oto sham — the blessing in the
    name's place (and 32:27's condition thereby met on the letter,
    with the send still unperformed).
    (15) 32:31-32 THE FACE AND THE LIMP: NAME write #2 peniel (6439
    toks 1-2/2 — WHOLE CAREER: peniEl at 32:31, penuEl at 32:32 — the
    place-name's two tokens SHIFT SPELLING one verse apart, i to u,
    DB-visible in translit and he); ki raiti Elohim panim el panim
    (7200 tok81/396) va-tinatzel nafshi [UNIT SHAPE (2) — the
    wrong-danger rescue]; va-yizrach lo ha-shemesh (2224 tok1/3
    DEBUT — the SUNRISE-verb: tok2 = Exod 22:2 "if the sun has RISEN
    on him" (the thief-law's daylight clause), tok3 = Deut 33:2 "YHWH
    came from Sinai... he SHONE from Seir" — the rise-verb's three
    tokens: Peniel's healing light, the law's daylight, Sinai's
    theophany); ve-hu tzolea al yerekho (6760 tok1/1 HAPAX — LIMPING,
    once ever); ha-shemesh (8121 tok5/23 — the sun that SET at 28:11
    (tok4, Bethel) RISES at 32:32 (tok5): consecutive sun-tokens
    bracket the twenty years — set at the ladder, risen at the
    wrestling).
    (16) 32:33 THE FIRST NARRATOR LAW [PATTERN op, gen_09's 2:24
    class]: al ken lo yokhlu vene yisrael et gid ha-nashe ad ha-yom
    ha-ze — the al-ken standing generalization (imperfect yokhlu, no
    trigger clause, narrator voice). The corpus's eight prior PATTERN
    ops [VERIFIED: corpus grep] are five name-etiologies (Babel,
    Tzoar, Beer-sheva, Beer-lachai-roi, the Moriah saying), one
    proverb (Nimrod), and two relation-generalizations (2:24
    leave-and-cleave, 3:15 enmity): this is the FIRST whose subject
    is a named PEOPLE and whose content is a PRACTICE they keep —
    narrator law proper. And its subject is BENE YISRAEL:
    the nation-name's SECOND token ever (3478 tok2/587), four verses
    after the name was born — the name debuts at 32:29 and LEGISLATES
    at 32:33: init→law inside one unit, the thesis's cleanest specimen.
    gid (1517 toks 1-2/2) + ha-nashe (5384 toks 1-2/2) — the sinew-law's
    whole vocabulary lives in its own verse (four tokens, one verse,
    both careers complete); ki naga (5060 tok8/54) — the law cites the
    touch; ad ha-yom ha-ze — the narrator's own now.

    WATCHLIST ARMS (prospective, filed): 33:4's embrace (the
    hatzileni-card's Esau-hand horizon; nashaq tok7/13); 33:8's "all
    this machane I MET" (pagash tok2 + machane tok7); 33:10's "I have
    seen your face like seeing the face of God" (the face-walk's coda);
    35:10's formula-backed Israel re-issue (va-yiqra — the write the
    decree withheld; gen_33's NAME-triage neighborhood stays OPEN);
    Exod 4:24's meet-to-kill (pagash tok3); Exod 22:2's sunrise clause
    (zarach tok2); Num 22's donkey (atonot toks 5-18); Num 19's heifer
    (parot toks 13-17); Deut 22:6's nest-law (em-al-banim); Deut 33:2's
    Sinai sunrise (zarach tok3); Exod 34:6's chesed-ve-emet Attributes
    (2617 toks 14-15, 571 tok8).

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_55_2026-08-08.md; manifest 12/12
    checkable VERIFIED, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified). THE FACE-NAME'S CHANGED LETTER
    [G55-01, Minchat Shai; the Masorah's ordered rule]: Jacob names
    the place פניאל ("the FACE OF GOD," 32:31) with a YOD at its
    heart; one verse later, as the sun rises on his limp, the Torah
    writes פנואל with a VAV (32:32) — the naming and the morning one
    letter apart, first yod then vav as ruled. THE GIFT-VERSE OF
    EIGHT MEMS [G55-02, Kitzur Baal HaTurim]: every word of "two
    hundred she-goats and twenty he-goats, two hundred ewes and
    twenty rams" (32:15) ends in the letter mem — eight closing mems
    (DB-checked), set by the Kitzur against the EIGHT KINGS who
    reigned in Edom before any king in Israel. THE TWO LEAN WHO-SAIDs
    [G55-03]: האמר ("YHWH, WHO SAID to me: return to your land,"
    32:10) stands exactly twice in the Torah, both lean — the
    prayer's quoted promise here, and Levi's "WHO SAID of his father
    and mother, I have not seen them" (Deut 33:9). THE ONE FULL CAN
    [G55-04]: the wrestler's "he saw that he COULD not prevail"
    (32:26) runs lean, as at Joseph's breakdown (45:1) and the
    cloud-barred Tabernacle (Exod 40:35, builder-checked); the
    Torah's ONE full יכול ("can") is Caleb's "we surely CAN go up"
    (Num 13:30) — every could-not lean, the one whole CAN a
    faith-cry. THE PROMISE WRITTEN OVERFULL [G55-05]: ואיטיבה ("and I
    WILL SURELY DO GOOD with you," 32:10) — full with BOTH yods, the
    Masorah's none-like-it, Hilleli and the Ramah against the
    Yerushalmi; the Kitzur reads Abraham's ten trials in the
    ten-letter yod. THE SENT-GIFT FULL, THE SENT-HIND LEAN [G55-06]:
    שלוחה ("a gift SENT to my lord," 32:19) full with its vav;
    Naphtali's hind SENT forth (49:21) lean (builder-checked);
    Ezekiel's outstretched hand named third — the Masorah's
    two-lean-one-full landing with the gift whole. THE ENEMY IN THE
    INITIALS [G55-07, Kitzur]: הצילני נא מיד ("DELIVER me, please,
    from the hand of my brother," 32:12) — the three initials carry
    the letters of המן (Haman, DB-checked), the striker of "mother
    with children" read inside Jacob's fear of exactly that fate.
    STRAW AT THE WRESTLING'S END [G55-08, Kitzur]: ויאבק איש עמו
    ("and a man WRESTLED with him," 32:25) — the final letters spell
    קשו ("straw"): Obadiah's "the house of Esau shall be straw"
    sealed at the clause's ends; and איש עמו sums to 427, the count
    of עשו אדום (builder-checked). THE BARE NIGHT, MEMBER THREE
    [G55-09]: הוא of "he rose THAT night" (32:23) — the sense expects
    the the-prefixed form, the letter writes it bare: the Masorah's
    four-list gains its third in-corpus member (after Lot's elder
    daughter's night, 19:33, and the mandrake night, 30:16). THE
    BREATHING-SPACE AND THE RELIEF [G55-10, Kitzur]: ורוח ("a SPACE
    you shall set between herd and herd," 32:17) — alone of the four
    Torah tokens of these letters the space-noun (the other three are
    winds: creation, locusts, quails — builder-checked); the Masorah
    pairs it with Esther's RELIEF (4:14): Jacob's space before Esau
    read on every later rescue. THE AYIN HOLDS THE LINE [G55-11]:
    ועירם ("and ten FOALS," 32:16) — plain sheva (the silent
    half-vowel) on the ayin per all the precise books: the half-vowel
    law's guttural boundary confirmed a second time (after 26:22),
    while resh, tzadi, lamed, and qof keep splitting. AS RULED
    [G55-12]: במקלי ("with MY STAFF") bet soft against Rav Pealim,
    its letters summing to 182 = יעקב (the Kitzur's "with my body
    alone"); אשלחך ("I will not LET YOU GO") carrying Ben Asher's
    meteg on the shin in the stream. INSTRUMENT GAPS: the camp's holy
    Name and the wrestler's disputed one [G55-13, manual] — Soferim
    rules "this is God's CAMP" (32:3) holy; at "you have striven WITH
    GOD" (32:29) the sages divide (Bereshit Rabbah; Chullin) — the
    classification layer's stations nine and ten, unsettled. READINGS
    (named-only): גרתי ("I sojourned") as the 613; the wrestle-dust to the Throne;
    the thigh-touch as priesthood-disqualification; the four kingdoms
    in the four object-words of 32:18; והכני with Goliath's; the
    split Jabbok (SNAPSHOT writes ויעברם lean against the Kitzur's
    cited full form, noted); the open paragraph at וישלח (paragraph
    layer gap).
derivation_log:
  - step: A
    name_en: "Reconstruction notice (2026-08-08)"
    comment: >
      This unit was frozen in the lean era (meta + scenarios + boot
      steps; no step table was written at freeze). The steps below were
      reconstructed on 2026-08-08 from the freeze-era draft note
      (meta.draft_note_en, displayed on the unit page), the era's
