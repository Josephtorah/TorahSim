  - step: B
    name_en: "Source + span + structure"
    comment: >
      Genesis 32:1-33, from Laban's morning kiss to the sinew rule:
      33 verses, 453 tokens, source-verified; every verse carries the
      mid-verse rest — the second all-rest unit in a row. Evidence:
      the SNAPSHOT database plus the debut-map attachment.
    confidence: reconstructed
  - step: C
    name_en: "Draft path + review"
    comment: >
      Solo-era unit #9: Claude as coordinator and deriver, with an
      external fresh-context adversarial review before freeze per the
      standing law. Frozen 2026-08-07.
    confidence: reconstructed
  - step: D
    name_en: "Care-point ledger (distilled)"
    comment: >
      The crown: THE REQUOTE LADDER (32:10-13). Jacob's prayer
      re-speaks the return-command with four machine-checkable
      deltas: "the land of your FATHERS" becomes "YOUR land"; "I
      will BE with you" becomes "I will DO-GOOD with you"; a doubled
      do-good is CITED AS QUOTE with no source utterance anywhere in
      the corpus (the do-good verb's four prior tokens censused —
      none a promise, none to Jacob); and the seed-simile swaps his
      own dust-of-the-earth for his grandfather's sand-of-the-sea —
      the sand-word's first two tokens are the Abraham promise and
      this requote, consecutive. Among sixteen care-points: the
      camp-noun is born and the dual place-name "two camps" precedes
      its own enactment by five verses; one noun holds God's
      messengers and Jacob's messengers in consecutive tokens; the
      gift-nouns keep walking into dream, oracle, and cult (the cow
      to Pharaoh's dream and the red heifer, the bull to the
      covenant and consecration offerings, the she-donkey to
      Balaam); the atonement-verb's second token ever is Jacob
      covering his brother's face — hull-sealing, face-appeasing,
      sin-covering; ten face-tokens climb to face-to-face; the
      ladder's heaven-touch and the wrestler's hip-touch are
      CONSECUTIVE tokens of the touch-verb; the sun that set at
      Bethel rises at Peniel — consecutive sun-tokens bracketing the
      twenty years; the alone-word that carried the corpus's only
      failed test verdict strands Jacob at the ford; the
      wrestle-verb's whole Torah career is two tokens, one night.
    confidence: reconstructed
  - step: E
    name_en: "Machine design"
    comment: >
      SEVEN pushes, ZERO pops — the third all-open seven (Mamre,
      Gilead, now Peniel). The queue: the messengers' two
      say-instructions (imperfects in command frames, the delivery
      to Esau NEVER narrated); rescue-me pushed ON GOD — and
      delivered from the WRONG DANGER: Jacob asks rescue from his
      brother's HAND, the career's next token rescues him from God's
      FACE, consecutive tokens, object mismatch; pass-before-me
      demanded of the servants — the pass-verb returns with the GIFT
      as its subject, wrong performer, and the spacing-order (a
      one-time word) is never narrated at all; the wrestler's
      SEND-ME — the exact suffixed imperative occurs TWICE in the
      Torah, Jacob to Laban and the wrestler to Jacob: the send-me
      demand fails in BOTH directions across the corpus; here it is
      refused with a condition, the condition is met on the letter
      (the blessing comes), and the sending is still never narrated;
      and tell-me-your-name, refused by a question and answered with
      a blessing in the name's place. Registry two writes (the
      two-camps name and the face-of-God name, whose own two tokens
      shift spelling one verse apart). The ISRAEL decree writes
      NOTHING per the frozen decree-fact class — and the countersign
      INVERTS: the Abram-decree retired its name in its own verse,
      while the narrator writes JACOB three more times inside this
      unit and a hundred more in the Torah — same decree grammar,
      opposite letter-behavior, read straight off the census. Then
      the name that debuts at 32:29 LEGISLATES at 32:33: the first
      narrator law whose subject is a named PEOPLE — birth to law
      inside one unit, the thesis's cleanest specimen. Zero tests.
    confidence: reconstructed
  - step: F
    name_en: "Freeze + later history"
    comment: >
      Frozen at commit d6b6572 (2026-08-07, "Freeze gen_55: two
      camps, the gift, and the wrestled name"). Oral audit 2026-08-08
      folded same day (run 7 block 4): 12 VERIFIED, 0 FAILED,
      1 UNCHECKABLE; headline: the face-name's yod-to-vav shift, the
      eight-mem gift-verse, and the one full CAN at Caleb.
    confidence: reconstructed
