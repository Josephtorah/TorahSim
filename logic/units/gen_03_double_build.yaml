  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_03_2026-08-08.md; manifest 11/11
    VERIFIED, zero FAILED). CROWNS (chain-attested + DB-verified).
    THE SPROUT-COMMAND'S METEG [G03-01, Shivrei Luchot via Minchat
    Shai]: תדשא ("let the earth sprout," 1:11) carries the meteg (the
    small stress-stroke) exactly as the Masorah note requires — the
    precise books' reading, in-stream. THE DIVIDED SPROUT-WORD
    [G03-02, Minchat Shai + Radak's Et Sofer; split-attested accent
    station]: on דשא ("sprout") the books DIVIDE — some read zaqef
    qatan (the small two-dot pause), the Sephardic books and the
    early print read revia (the single high dot), and Et Sofer rules
    for revia; SNAPSHOT carries the ZAQEF QATAN, joining the camp MS
    argues against (accent-convention split class). THE MICHLOL'S
    DAGESH PAIR [G03-03/04/05, the Michlol via Minchat Shai]: the pe
    of פרי ("fruit") after עשה ("making") takes the hardening dot at
    BOTH stations by two different rules — the command (1:11) by the
    approaching-from-afar rule with the words unjoined, the delivery
    (1:12) by the crowded-word rule "for it stands with a maqqef (the
    joining stroke)" — and the stream splits exactly so: 1:11
    unjoined, 1:12 עשה־פרי ("making-fruit") joined. THE SEED-IN-IT
    PAIR [G03-06/07,
    manuscripts + early print + Et Sofer via MS]: both זרעו־בו ("its
    seed in it") stations joined by maqqef without meteg, matched.
    THE CONSTELLATION ACROSTIC [G03-08, Kitzur Baal HaTurim]: מזריע
    זרע למינהו ("yielding seed after its kind," 1:12) — the three
    initials spell מזל ("constellation"): no blade of grass without a
    constellation above it. THE FRUIT-TREE PHRASE STANDS ONCE
    [G03-09, Rashi via Bereshit Rabbah 5:9]: עץ פרי ("fruit-tree" —
    the tree whose taste is its fruit) as an adjacent bare pair is
    UNIQUE in the Torah, here in the command; the delivery answers
    עץ עשה־פרי ("tree MAKING fruit") and the commanded phrase never
    returns — the tradition's own attestation of this unit's
    spec/delivery delta (the earth cursed for it when Adam fell).
    THE GRASSES' A-FORTIORI [G03-10/11, Rashi via Chullin 60a]: the
    kind-word stands ONCE in the command (למינו "after its kind" —
    on the tree only; the grasses were never commanded it) and TWICE
    in the delivery (למינהו on grass and tree): the grasses heard the
    trees' order, reasoned it to themselves, and the token counts
    carry their addition. DISCREPANCY/GAP: G03-02 files to the
    accent-convention split class (SNAPSHOT with the two-dot-pause camp
    against MS + Et Sofer's revia). READINGS (named-only): Bereshit
    Rabbah 5:2 (the waters gathered to the one Ocean); BR 5:8 (why
    "seas" in the plural — the taste of the fish differs from shore
    to shore); Rashi on 1:11 (דשא "sprout" = the earth's covering
    garment, עשב "herb" = the single species — why the command could
    not say "let the earth herb").
