boot_steps:
  - id: STEP_Gn_1_9
    order: 1
    ref: "Gen.1.9"
    op: DECLARE_AGENTLESS_RESULT
    he: וַיֹּאמֶר אֱלֹהִים יִקָּווּ הַמַּיִם מִתַּחַת הַשָּׁמַיִם אֶל־מָקוֹם אֶחָד וְתֵרָאֶה הַיַּבָּשָׁה וַיְהִי־כֵן
    he_translit: "va-yomer Elohim yiqqavu ha-mayim mi-tachat ha-shamayim el-maqom echad ve-tera'e ha-yabasha va-yehi khen"
    en: "[EN-AID/JPS] And God said: 'Let the waters under the heaven be gathered together unto one place, and let the dry land appear.' And it was so."
    tree_left:
      he: ויאמר אלהים יקוו המים מתחת השמים אל מקום אחד ותראה היבשה
      he_translit: "va-yomer … ve-tera'e ha-yabasha"
      en: "speech act + two agentless directives (etnachta arm)"
    tree_right:
      he: ויהי כן
      he_translit: "va-yehi khen"
      en: "generic RESULT"
    operators:
      - op: ORAL_UTTERANCE
        expr_en: "UTTERANCE(4, fiat) — ma'amar census (Avot 5:1)"
        en: >
          va-yomer Elohim yiqqavu — the fourth utterance of the ten by the
          STANDARD census (bereshit + each va-yomer; the census primary
          Bereshit Rabbah 17:1, standing canon rule from gen_01). ORDINALS
          ARE DISPUTE-RELATIVE: under the recorded census dissent carried
          at day one (R. Yaakov ben Kurshai counts the ruach of 1:2), this
          verse is the FIFTH — the machloket renumbers every later
          position without touching this verse's membership. Standalone
          machine keeps the standard count; the dispute-relative numbering
          rides as note (the dispute itself lives in gen_01's
          UTTERANCES_DISPUTED, its home span).
        cites: ["Bereshit Rabbah 17:1"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(gathered(mayim, to=maqom-echad)))"
        he: יִקָּווּ הַמַּיִם
        he_translit: "yiqqavu ha-mayim"
        en: >
          NIPHAL JUSSIVE (VNj3mp): 'let the waters BE gathered' — a clean
          directive whose doer slot is deliberately empty (sein-sollen);
          destination maqom echad ('one place' — echad here is plain
          arithmetic, not a day-count). AMENDMENT 2026-08-23 — the chain's
          readings recorded dual-track: the verb carries a DOUBLE READING —
          yiqqavu from KAV ('plumb line,' Zech 1:16): 'let a SET MEASURE be
          established for the water' (the gathering as a measured bound),
          and YEKAVU 'let them AWAIT Me, for what I will do with them in
          the future' (the flood future-hook; the mute-palace parable —
          the waters' praise, Ps 93:4). Onkelos renders yitkanshun ('be
          assembled') — both wordplays live only in the Hebrew ink.
          Standing practice note: the TUESDAY FAST of the watches hangs on
          this very verse — 'on Tuesday they fast for ROAD TRAVELLERS —
          God commanded, the waters under the sky shall congregate'
          (Jerusalem Talmud Taanit 4:3:3, re-verdicted material for this
          span): the dry land's standing peril for those who walk it,
          acknowledged weekly (exact parallel of day 2's Monday fast and
          day 4's Wednesday fast).
        cites: ["TIR-026", "TIR-032", "Bereshit Rabbah 5:1", "Jerusalem Talmud Taanit 4:3:3"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET?(exists(yabasha)))"
        he: וְתֵרָאֶה הַיַּבָּשָׁה
        he_translit: "ve-tera'e ha-yabasha"
        en: "NIPHAL IMPERFECT (VNi3fs): 'and let the dry land BE SEEN' — appearance, not creation: exists() in machine notation = enters the visible WORLD; the ? is mandatory (imperfect) and stays"
        cites: ["TIR-028", "TIR-032"]
        confidence: "tested as flag; resolution per-unit only"
      - op: NOTE_PRESUPPOSED
        expr_en: "mayim, shamayim are READ without prior install (standalone machine; installed in gen_01/gen_02 — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(gathered(mayim, to=maqom-echad), t1) — va-yehi khen pops the gathering demand"
        he: וַיְהִי־כֵן
        he_translit: "va-yehi khen"
        en: >
          generic summary receipt, same verse — latency 0. AMENDMENT
          2026-08-23: the chain names the geometry problem itself — 'the
          way of the world is that one empties a full vessel into an empty
          vessel; a full vessel into a full vessel?!' — and answers with
          the recorded world-rule THE LESSER CONTAINED THE GREATER, our
          verse standing first in the chain's own instance list (the rock,
          Moshe's handful, the courtyard, the Ark's staves, the future
          Jerusalem). The rule is carried as recorded reading, not
          mechanism — the machine's receipt stays a receipt.
        cites: ["Bereshit Rabbah 5:7", "Bereshit Rabbah 5:2"]
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(exists(yabasha), t1) — the dry land is now visible"
        he: הַיַּבָּשָׁה
        he_translit: "ha-yabasha"
        en: "revealed rather than made: no build verb anywhere in cycle 3a — WORLD gains yabasha by visibility; mood of the demand stays LET? on the log"
        cites: []
        confidence: tested
    comment: >
      Cycle 3a is entirely agentless: two niphal directives, no agent named,
      no build event narrated — states rearrange and something becomes
      visible. Sharp contrast with 3b, where an agent is named and it is not
      Elohim.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_10
    order: 2
    ref: "Gen.1.10"
    op: NAME_NAME_TEST
    he: וַיִּקְרָא אֱלֹהִים לַיַּבָּשָׁה אֶרֶץ וּלְמִקְוֵה הַמַּיִם קָרָא יַמִּים וַיַּרְא אֱלֹהִים כִּי־טוֹב
    he_translit: "va-yiqra Elohim la-yabasha eretz u-le-miqveh ha-mayim qara yamim va-yar Elohim ki-tov"
    en: "[EN-AID/JPS] And God called the dry land Earth, and the gathering together of the waters called He Seas; and God saw that it was good."
    tree_left:
      he: ויקרא אלהים ליבשה ארץ ולמקוה המים קרא ימים
      he_translit: "va-yiqra … qara yamim"
      en: "two registry writes via the naming formula (etnachta arm)"
    tree_right:
      he: וירא אלהים כי טוב
      he_translit: "va-yar Elohim ki-tov"
      en: "test #1 of the day"
    operators:
      - op: NAME
        expr_en: "REGISTRY: name(yabasha) := eretz; name(miqveh-ha-mayim) := yamim"
        he: לַיַּבָּשָׁה אֶרֶץ … קָרָא יַמִּים
        he_translit: "la-yabasha eretz … qara yamim"
        en: >
          dative la-/le- marks the receivers. COLLISION #2 (cross-unit):
          eretz already denotes the 1:1 narration-entity — resolved on the
          Oral track only (BR 5:8: the name was EARNED, 'she wished to do
          her Owner's will'; same passage treats the plural yamim).
          AMENDMENT 2026-08-23, the full naming dossier: the same passage
          reads Shaddai as SHE-DAI — 'I am the One who said to heavens and
          earth: ENOUGH' — the expansion HALTED at this era's bound (the
          named world is a stopped world); and the plural yamim resolved —
          R. Yosei b. Chalafta: one gathering, many regimes ('the taste of
          a fish that comes up in Akko is not like Sidon or Spain') — the
          [OPEN] stands machine-side, the chain's answer rides the oral
          track. THE LAW FROM THE NAMING: the verse's own word miqveh
          becomes the legal category 'ritual bath' — 'ALL SEAS ARE
          EQUIVALENT TO A MIKVEH, for it is said u-le-MIKVEH ha-mayim kara
          yamim' (R. Meir; R. Yehudah: only the Great Sea; R. Yosei:
          running-water middle — Mishnah Mikvaot 5:4, a Mishnah case-row
          generated by this REGISTRY write, its three-way dispute
          recorded; applied at Shabbat 109a; echoed Sifrei Devarim 39:5).
        cites: ["TIR-022", "Bereshit Rabbah 5:8", "Mishnah Mikvaot 5:4"]
        confidence: tested
      - op: WITNESS_STATE
        expr_en: "WITNESS(yamim, condition_to_split_installed) — the sea gathered under a stipulation"
        en: >
          R. Yochanan: the Holy One STIPULATED A CONDITION with the sea at
          its creation that it split before Israel — 'the sea returned
          le-eitano, to its strength' (Exod 14:27) read as LI-TNA'O, 'to
          its CONDITION.' R. Yirmeya b. Elazar extends the mechanism to a
          whole stipulations registry over the six days' works (the sea /
          the heavens and earth / sun and moon / ravens / fire / lions /
          the fish — Isa 45:12: 'My hands stretched the heavens and
          commanded all their host'). Outcome converged and only it is
          state: a standing condition attached to the gathered sea at its
          naming. Typed anchor: Exod 14:27 — the later text that finds the
          condition executing. WITNESS-GROUNDED TIER (owner ruling
          2026-08-20): never mixed into text-grounded facts.
        cites: ["Bereshit Rabbah 5:5"]
        confidence: "witness-grounded (aggadic tier); registry extension = recorded reading"
      - op: TEST
        expr_en: "PASS(tov, gathering)"
        he: כִּי־טוֹב
        he_translit: "ki-tov"
        en: >
          test #1: va-yar Elohim ki-tov with NO explicit et-object
          (contrast 1:4 et-ha-or) — the inspection's Theme is implicit:
          the whole 3a work; ki = complementizer 'that' (standing ruling),
          tov = oracle predicate. AMENDMENT 2026-08-23, the double-tov
          accounting made explicit from the chain's side: R. Shmuel — the
          water-work was UNFINISHED on day 2, hence day 3's double ki-tov,
          'one for the completion of the water's work and one for the
          day's own work' — THIS test is the one that closes day 2's open
          ledger debt (the cross-unit accounting step A anticipated;
          gen_02's missing-tov dossier records the same transaction from
          the other side).
        cites: ["Bereshit Rabbah 4:6"]
        confidence: tested
    comment: >
      Mid-day naming + test BEFORE the second cycle opens: day 3 interleaves
      its transactions rather than batching (names for 3a land before 3b's
      spec is even issued).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_11
    order: 3
    ref: "Gen.1.11"
    op: DECLARE_DELEGATED_SPEC
    he: וַיֹּאמֶר אֱלֹהִים תַּדְשֵׁא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע עֵץ פְּרִי עֹשֶׂה פְּרִי לְמִינוֹ אֲשֶׁר זַרְעוֹ־בוֹ עַל־הָאָרֶץ וַיְהִי־כֵן
    he_translit: "va-yomer Elohim tadshe ha-aretz deshe esev mazria zera etz peri oseh peri le-mino asher zar'o-vo al-ha-aretz va-yehi khen"
    en: "[EN-AID/JPS] And God said: 'Let the earth put forth grass, herb yielding seed, and fruit-tree bearing fruit after its kind, wherein is the seed thereof, upon the earth.' And it was so."
    tree_left:
      he: ויאמר אלהים תדשא הארץ דשא עשב מזריע זרע עץ פרי עשה פרי למינו אשר זרעו בו על הארץ
      he_translit: "va-yomer … al-ha-aretz"
      en: "delegated fiat + full product specification (etnachta arm)"
    tree_right:
      he: ויהי כן
      he_translit: "va-yehi khen"
      en: "generic RESULT — logged before the execution narrative"
    operators:
      - op: ORAL_UTTERANCE
        expr_en: "UTTERANCE(5, fiat) — ma'amar census (Avot 5:1)"
        en: >
          va-yomer Elohim tadshe — the fifth utterance of the ten by the
          STANDARD census (Bereshit Rabbah 17:1, standing canon rule from
          gen_01); the SIXTH under R. Yaakov ben Kurshai's census (the
          dispute-relative numbering, note-only as at 1:9). The double-
          build day carries TWO of the ten utterances — the only day
          before day six to do so.
        cites: ["Bereshit Rabbah 17:1"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(sprout(aretz, vegetation)))"
        he: תַּדְשֵׁא הָאָרֶץ
        he_translit: "tadshe ha-aretz"
        en: "HIFIL JUSSIVE, FEMININE (Vhj3fs), subject = ha-aretz: the FIRST DELEGATION — the directive is addressed to a creature, commissioning the earth herself to produce; Elohim specifies, the delegate builds"
        cites: ["TIR-026"]
        confidence: tested
      - op: INVARIANT
        expr_en: "INVARIANT(mazria(esev, zera) ∧ oseh(etz, peri) ∧ le-mino(reproduction)) during t_open"
        he: מַזְרִיעַ זֶרַע … עֹשֶׂה פְּרִי לְמִינוֹ
        he_translit: "mazria zera … oseh peri le-mino"
        en: "two participles (Vhrmsa, Vqrmsa) = standing reproduction duties, keyed by-kind (le-mino) with self-contained seed (asher zar'o-vo) — the spec is a self-replicating system definition"
        cites: ["TIR-031"]
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(sprout(aretz, vegetation), t2) — va-yehi khen logged BEFORE the execution narrative of 1:12"
        he: וַיְהִי־כֵן
        he_translit: "va-yehi khen"
        en: "the receipt precedes the build story — order unique to cycle 3b (elsewhere khen follows or replaces narration); recorded, left [OPEN]"
        cites: []
        confidence: tested
    comment: >
      The product spec, verbatim (load-bearing for 1:12): etz PERI oseh peri
      — 'a FRUIT-tree making fruit': classically, tree-substance itself
      fruit-like, and fruit-bearing. Hold that phrase.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_12
    order: 4
    ref: "Gen.1.12"
    op: DELEGATED_BUILD_DELTA_TEST
    he: וַתּוֹצֵא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע לְמִינֵהוּ וְעֵץ עֹשֶׂה־פְּרִי אֲשֶׁר זַרְעוֹ־בוֹ לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טוֹב
    he_translit: "va-totze ha-aretz deshe esev mazria zera le-minehu ve-etz oseh-peri asher zar'o-vo le-minehu va-yar Elohim ki-tov"
    en: "[EN-AID/JPS] And the earth brought forth grass, herb yielding seed after its kind, and tree bearing fruit, wherein is the seed thereof, after its kind; and God saw that it was good."
    tree_left:
      he: ותוצא הארץ דשא עשב מזריע זרע למינהו ועץ עשה פרי אשר זרעו בו למינהו
      he_translit: "va-totze … le-minehu"
      en: "the delegate's delivery report (etnachta arm)"
    tree_right:
      he: וירא אלהים כי טוב
      he_translit: "va-yar Elohim ki-tov"
      en: "test #2 of the day"
    operators:
      - op: EVENT
        expr_en: "bring-forth(e1) ∧ Agent(e1, aretz) ∧ Theme(e1, deshe)"
        he: וַתּוֹצֵא הָאָרֶץ
        he_translit: "va-totze ha-aretz"
        en: >
          HIFIL WAYYIQTOL, FEMININE (Vhw3fs) agreeing with aretz: the
          EARTH is the build agent — the only build event of the week not
          performed by Elohim; the delegation of 1:11 executed by the
          delegate. AMENDMENT 2026-08-23 — the chain reads OUR VERB:
          R. Berekhya — va-TOTZE, 'brought forth': 'something that was
          already STORED inside it' — the delegate releases inventory
          seeded at creation, not ex nihilo (the fig-pickers parable,
          R. Nechemya: present from day one, each emerging at its time; vs
          R. Yehudah: each created at its time — recorded dispute). The
          INCUBATION ARCHITECTURE rides beside it: day 3 is the earth's
          DELIVERY day in every recorded model — the three-bases pipeline
          (earth day 1 → trees, vegetation, Eden on day 3; firmament →
          lights; water → swarms), the two-bases variant, and both houses'
          arithmetic in the Jerusalem Talmud (Beit Shammai and Beit Hillel
          disagree on the whole schedule, yet 1:11's day-3 sprouting
          stands in every model). Model choice = recorded dispute, never
          state.
        cites: ["Bereshit Rabbah 12:4", "Bereshit Rabbah 12:5", "Jerusalem Talmud Chagigah 2:1:17"]
        confidence: tested
      - op: REGISTRY_INSTALL
        expr_en: "WORLD += {deshe} — delivered by the delegated build"
        en: "vegetation enters the world via the earth's act, not divine fiat"
        cites: []
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'etz peri oseh peri' delivered 'etz oseh peri' — flag spec_delta"
        he: עֵץ פְּרִי עֹשֶׂה פְּרִי ← וְעֵץ עֹשֶׂה־פְּרִי
        he_translit: "etz peri oseh peri -> ve-etz oseh-peri"
        en: >
          the spec asked for a FRUIT-tree making fruit; the delivery
          reports a tree MAKING fruit — the word peri is absent from the
          tree's own description. Letter-visible in the Hebrew. Micro-delta
          also recorded: spec le-mino, delivery le-minehu (suffix form
          shift) — noted, [OPEN]. AMENDMENT 2026-08-23, the full dossier:
          the deviation's POLARITY is a RECORDED DISPUTE — R. Yehudah b.
          R. Shalom: the earth VIOLATED its command (tree-substance itself
          was to be edible), hence 'cursed is the ground' (Gen 3:17;
          R. Natan: three entered judgment, FOUR came out condemned) — vs
          R. Pinchas: the earth did MORE than commanded (even barren trees
          bore fruit), cursed only as the nurse of the sinner. Converged
          and carried: the delta is real ink, and Gen 3:17's curse is
          linked — by BOTH horns. The Jerusalem Talmud's parallel adds the
          LEGAL RIDER: the kind-word is 'not written at the commandment,
          only at the REALIZATION' — the chain using this very spec-vs-
          receipt diff as a legal operator (bounding what law derives from
          the spec). Onkelos PRESERVES the delta in translation — 'ilan
          PEIRIN aved peirin' (1:11) against 've-ilan AVED peirin' (1:12):
          the received translation refuses to smooth exactly here. And the
          CALENDAR machloket reads the delta as seasonal evidence: Tishrei
          from 1:11's command-form (the month of full ripe fruit,
          R. Eliezer) vs Nisan from 1:12's receipt-form (the month of
          sprouting, R. Yehoshua) — joins day 4's calendar thesis;
          dispute carried, no state.
        cites: ["Bereshit Rabbah 5:9", "Jerusalem Talmud Kilayim 1:7:4", "Rosh Hashanah 11a:3", "Rosh Hashanah 11a:4"]
        confidence: "delta tested (letter-visible); significance = named-Oral track; polarity = recorded dispute"
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'esev mazria zera' delivered 'esev mazria zera le-minehu' — flag spec_delta"
        he: עֵשֶׂב מַזְרִיעַ זֶרַע ← עֵשֶׂב מַזְרִיעַ זֶרַע לְמִינֵהוּ
        he_translit: "esev mazria zera -> esev mazria zera le-minehu"
        en: >
          AMENDMENT 2026-07-30 (oral_links coverage review): the delta
          runs BOTH WAYS — the spec keys 'by its kind' (le-mino) to the
          TREES only; the delivery adds le-minehu ('by its kind') to the
          HERBS too. Over-delivery beside the trees' under-delivery.
          AMENDMENT 2026-08-23, the full dossier read: R. Chanina bar
          Pappa — when God said 'after its kind' of the TREES, the grasses
          drew a QAL VA-CHOMER (a-fortiori, middah E5/I1 — explicit,
          performed by a CREATURE inside the world) upon themselves:
          'if the trees, which do not naturally interbreed, were commanded
          by kind — we, all the more so.' Every grass emerged by its kind,
          and the minister of the world approved ON THE RECORD: 'May the
          glory of the Lord endure forever' (Ps 104:31) — 'who do His will
          even when NOT EXPLICITLY INSTRUCTED.' The surplus delta carries
          the week's only creature-side licensed inference entering a
          delivery report. Onkelos transmits it: kind-word once in its
          1:11 (li-zneh), twice in its 1:12 (li-znohi on herb AND tree).
        cites: ["Chullin 60a:10", "Chullin 60a:12"]
        confidence: "delta tested (letter-visible in 1:11 vs 1:12); significance = named-Oral track; middah E5 explicit"
      - op: WITNESS_STATE
        expr_en: "WITNESS(deshe, staged_at_soil_mouth) — delivered, growth deferred"
        en: >
          Rav Asi's contradiction on our receipt: 1:12 says 'the earth
          BROUGHT FORTH grass' (day 3), yet 2:5 says 'no shrub of the
          field was YET in the earth' (day 6) — resolved: the grasses
          emerged and STOOD AT THE OPENING OF THE GROUND, and did not grow
          until Adam prayed for mercy and rain came — 'the Holy One
          desires the prayers of the righteous.' Outcome converged and
          only it is state: the delegate's delivery is REAL but STAGED —
          installed at the surface, completion deferred to a
          prayer-and-rain trigger outside this unit's span. Typed anchor:
          Gen 2:5-6 — the later text that finds the staging. WITNESS-
          GROUNDED TIER: never mixed into text-grounded facts; the
          machine's WORLD += deshe stands as written.
        cites: ["Chullin 60b:5"]
        confidence: "witness-grounded (aggadic tier); single converged reading"
      - op: TEST
        expr_en: "PASS(tov, vegetation)"
        he: כִּי־טוֹב
        he_translit: "ki-tov"
        en: "test #2 — again with NO explicit et-object; the delivery passes inspection AS DELIVERED, both deltas and all: the deviations are flagged by comparison, not by the oracle"
        cites: []
        confidence: tested
    comment: >
      The machine's punchline: the delivery deviates from the spec AND passes
      the acceptance test. Spec-conformance and goodness are separate
      predicates in this corpus — the flag records the first, the oracle
      grants the second, and the tension between them belongs to the
      interpreters (BR 5:9, dual-track).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_13
