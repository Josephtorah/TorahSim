    en: "one day, two build modes: niphal agentless rearrangement (3a) vs commissioned creature-build (3b)"

oral_notes:
  - id: ORAL_eretz_earned
    status: verified
    work_en: "Bereshit Rabbah 5:8 (on the naming, 1:10)"
    he: למה נקרא שמה ארץ? שרצתה לעשות רצון קונה
    he_translit: "lamah niqra shemah eretz? she-ratzta la'asot retzon konah"
    en: >
      "Why was its name called eretz? Because it WISHED (ratzta) to do its
      Owner's will (retzon konah)" — a wordplay derivation (eretz~ratzon)
      that gives the day-3 entity its own title to the name, addressing
      collision #2; the same passage treats the plural yamim.
    comment_en: "Verified from Data/bereshit_rabbah_he.json. Dual-track; not merged."
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_fruit_tree_delta
    status: verified
    work_en: "Bereshit Rabbah 5:9 (on the spec delta, 1:11-12)"
    he: שלשה נכנסו לדין וארבעה יצאו מחיבין … ונתקללה הארץ עמהן
    he_translit: "sheloshah nikhnesu la-din ve-arba'ah yatze'u mechuyavin … ve-nitqallelah ha-aretz immahen"
    en: >
      "Three entered for judgment and four came out condemned … and the earth
      was cursed with them" — the classical reading that the earth's
      fruit-tree deviation (delivering etz oseh peri where etz peri was
      specified) is remembered at Eden's judgment. The named source for the
      spec_delta flag's significance.
    comment_en: "Verified from local Data. Dual-track; the flag is Written-visible, the verdict is Oral."
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_grasses_kal_vachomer
    status: verified
    work_en: "Bavli Chullin 60a (on le-minehu, 1:12) — surfaced by the oral_links coverage review"
    he: בשעה שאמר הקב"ה למינהו באילנות נשאו דשאים קל וחומר בעצמן
    he_translit: "be-sha'ah she-amar HKB'H le-minehu ba-ilanot, nas'u desha'im kal va-chomer be-atzman"
    en: >
      "When the Holy One said le-minehu ('by its kind') of the TREES, the
      grasses (desha'im) drew a kal va-chomer (a-fortiori inference) upon
      themselves" — R. Chanina bar Papa: the herbs' 'by its kind' in the
      delivery is the grasses' own inference, never commanded — the named
      owner of the second spec delta. Same page, Rav Assi: the grasses stood
      at the soil's mouth until Adam prayed for rain — "the Holy One desires
      the prayers of the righteous" (resolving 1:12 against 2:5).
    comment_en: "Verified from Data/bavli_chullin_he.json 2026-07-30. Dual-track; not merged."
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_policy
    status: observation
    work_en: "Oral policy"
    comment_en: "Named location only; never silent-merge."
    source: "[PROJECT]"

