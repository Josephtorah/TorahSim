  - id: ORAL_onkelos_tier_a
    status: verified
    work_en: "Onkelos Genesis 5:1-32 — read Tier-A at derive time (32 sequential fetches, Data/FETCHLOG.md 2026-08-01)"
    he: וְלַיְתוֹהִי אֲרֵי (לָא) אֲמֵית יָתֵהּ יְיָ
    he_translit: "ve-layetohi arei (la) ameit yateh YY"
    en: >
      The span's translation witness — and the witness itself is
