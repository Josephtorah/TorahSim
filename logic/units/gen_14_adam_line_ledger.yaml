    en: >
      Named, not read: the cache holds ZERO sources anchored to Gen 5
      — eighth tripwire span. 5:1 anchors a named tannaitic dispute
      over the Torah's greatest principle (a klal ["general
      principle"] class target for the detector); the 5:24 einenu
      fork is a translation-variant specimen — the split sits INSIDE
      the buffer layer itself (see Tier-A below), the cleanest
      dual-reading test our spans have produced.
