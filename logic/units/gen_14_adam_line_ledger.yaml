      — one manuscript line kills Chanokh, the other denies it, and
      both replace the letter's TAKE-verb with a DEATH-verb (unique
      in our derived spans; both variants held). Both walk-lines
      buffer "with God" into "in the FEAR of the LORD." At 5:3 the
      image-word is deleted in transmission ("who RESEMBLED him");
      at 5:1 the divine names split (the LORD creates, the likeness
      stays God's); at 5:29 the curse-quote survives with the
      toil-word as "weariness of our hands." The template stretch
      renders mechanically — the Aramaic's plainest run in our
      spans: the buffer layer only speaks where the letter breaks
      its own pattern.
    comment_en: "Read from Data/sefaria_texts/ (local, gitignored; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

