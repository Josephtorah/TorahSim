derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      The whole book of Adam's line (5:1-32): the header (5:1-2), ten
      ledger rows, and the open last row — 6:1 pivots to the
      sons-of-God episode and the flood countdown, the next block.
      Chapter 5 is a single literary object (one template, tracked
      deviations); splitting it would sever the refrain from its one
      refusal. Derived whole: 32 verses, 365 words — the largest
      span yet, carried by the template's compression.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 32 verses from DB tree_json (rule set v3, unique, pure
      binary; ascii rendered 2026-08-01). Tree facts: the template
      verses share their rest-splits row over row (the begetting
      verses rest after the age; the totals verses rest after the
      number, isolating VA-YAMOT on the verse-end); 5:1 [the book
      header | the likeness clause]; 5:24 [the walk and the was-not
      | for God took him] — the shortest heavy verse in the unit;
      5:29 [the naming | the reason-speech quoting the curse]; 5:32
      [Noach at 500 | the three sons]. The etnachta (major mid-verse
      rest) positions were pulled from the DB for every verse and
      drive the tree_left/tree_right splits mechanically.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-08-01): SEFER
      ("book") — the Torah's first token (5:1; token 2 = Exod
      17:14); the begetting verb is HIPHIL (causative) throughout —
      chapter 4's mothers bore in the simple stem; the ledger's
      fathers cause-birth, and NO mother is named in the chapter;
      the die-verb: every token before 5:5 is command or quote
      (2:17; 3:3-4) — 5:5's va-yamot is the FIRST NARRATIVE token,
      then the refrain x8 (5:8, 11, 14, 17, 20, 27, 31); the
      totals-verb is plural (va-yihyu) for seven rows, SINGULAR
      (va-yehi) for exactly two — Chanokh (5:23) and Lemekh (5:31)
      [held, not explained]; the walk-verb (hitpael reflexive):
      3:8 God walks the garden alone -> 5:22+5:24 Chanokh walks
      WITH (854) God -> 6:9 Noach -> 17:1 the imperative to Abram;
      VE-EINENU (5:24) — the suffixed is-not word's first corpus
      token; LAQACH — the verb that put the human INTO the garden
      (2:15) takes the seventh man out; the image/likeness pair:
      1:26 image+likeness, 5:1 LIKENESS ONLY (image dropped), 5:3
      both SWAPPED (order and prepositions) with direction now
      man-to-son, 9:6 image again; ITZAVON ("toil") — exactly three
      Torah tokens: 3:16, 3:17, 5:29; the curse-root at 5:29 is
      token 4 (3:14, 3:17, 4:11 before it; 9:25 after — Noach's own
      mouth); NACHAM ("comfort") debuts at 5:29 and its tokens 2-3
      are 6:6-7 — YHWH's REGRET; the name/verb mismatch (NOACH
      rest-root explained by the comfort-root) held [OPEN]; 365 for
      the seventh row's total (the solar count — letter fact, no
      claim); 969 the corpus maximum (Metushelach); 777 for Lemekh
      — three sevens against the Cain-line Lamech's 77; 5:28's son
      born NAMELESS (the only inline-nameless begetting; the name
      waits for the reason-speech); 5:32 the first TRIPLE begetting
      (Shem, Cham, Yafet — first tokens) and NO closing row for
      Noach (his total waits at 9:29). The year-word: 48 tokens in
      one chapter.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      The ledger genre does with a template what narrative did with
      events: it makes DEVIATION the signal. The machine's model:
      rows as beget-events + standing facts (totals, bulk children),
      the refrain as die-events — and the unit's meaning
      concentrated where the template breaks: (1) the header quotes
      day 6 minus the image-word, and row one returns the pair
      swapped — the transmission question flagged twice against
      frozen text; (2) the seventh row substitutes both load-bearing
      verbs and ends in a taking with no destination — the corpus's
      first missing death, held as an ABSENCE in the event log; (3)
      the ninth row wraps a name around a quotation of the frozen
      curse with the curser named and a comfort no one ratifies;
      (4) the tenth row never closes. Adam's first-death event
      lands the 2:17 word as narrative at last — 930 years wide of
      in-the-day — while the gen_08 handler's flags stand
      untouched: the machine records the correlation and derives
      nothing.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines; NO ledger-register row (the LEDGER register
      remains the creation week's — this book's "ledger" is genre,
      not machine state). SECTION at 5:1 (gen_08's header device —
      labels, installs nothing). EVENTs: bless (5:2 — the blessing
      re-run WITHOUT its mandate: no content quoted, none
      installed), beget x10 (hiphil; 5:32 one event with three
      Themes), die x8 (the refrain — first narrative death-tokens
      in the corpus), take x1 (5:24). NAME x3: adam_species (GOD
      names — the registry's first divine species-write; plural
      suffix noted), shet (the SECOND naming of an already-named
      man — the father's, against the mother's at 4:25; held, not
      harmonized), noach (the third birth-etymology, first by a
      father). NOTE_SPEC_DELTA x3 against frozen text: 5:1 (image
      dropped vs day 6), 5:3 (pair swapped, direction inverted),
      5:29 (curse attributed + comfort forecast). Standing facts:
      totals x9, bulk sons-and-daughters x9, the walk, the einenu,
      the reason-speech pair, Noach-at-500. NO demands (SPECS
      empty end-to-end — the first multi-death unit with an empty
      queue), NO tests, ZERO WORLD installs (the second
      zero-install unit after gen_12). Chanokh's missing death is
      modeled as exactly that — no die-event fires for row seven:
      the machine's negative space. Interpreter extensions: NONE.
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en. Machine
      tokens apostrophe-free: kol_yemei_metushelach_969_shanah,
      hithalekh_chanokh_et_ha_elohim, einenu_ki_lakach_oto_elohim,
      min_ha_adamah_asher_ererah_YHWH. Template rows share
      operator shape by design.
    confidence: established
  - step: G
    name_en: "Oral (named only) + Tier-A translation check"
    comment: >
      Named but NOT read (cache: zero for Gen 5 — eighth tripwire;
      gen_14 Tier-A queue): Bereshit Rabbah 24-25 (ben Azzai on 5:1
      as the Torah's great principle vs Akiva — the klal-class
      dispute; BR 25:1 the Chanokh reading war; BR 25:2 the
      Noach name/verb mismatch); Bavli Sanhedrin 38b; the Chanokh
      apocalypse literature is OUT OF CORPUS (the written chain's
      silence around the most famous absence is itself the
      observation); Rashi at 5:1, 5:22, 5:24, 5:29 (observation
      tier). Tier-A Onkelos (32 fetches, FETCHLOG 2026-08-01):
      5:24 THE TRANSLATION ITSELF IS FORKED — "he was not, for the
      LORD (LA — not?) CAUSED HIM TO DIE": a bracketed manuscript
      variant negates the death; either reading replaces the
      TAKE-verb with the DEATH-verb (unique find in our spans;
      both variants held dual-track); 5:22+5:24 "walked with God"
      -> "walked in the FEAR of the LORD" (companionship buffered
      to reverence, twice); 5:3 the image-word DELETED in
      transmission ("begot in his likeness, who RESEMBLED him" —
      tzelem refused father-to-son exactly where the letter dares
      it); 5:1 the divine names split (the LORD creates; the
      likeness stays God's); 5:29 the curse-quote survives
      translation, itzavon -> "weariness of our hands"; the
      template stretch renders mechanically — the Aramaic's
      plainest run in our spans.
    confidence: tested
    tags: ["[ORAL]","[TIER-A]"]
  - step: H
    name_en: "Scenarios"
    comment: >
      S1 the header: God's species-write on the registry; the
      image-drop flagged; adam flagged as read. S2 row one: two
      registry writes (the father's Shet). S3 the first death:
      Adam's total standing, first narrative die-event on the
      trace. S4 the seventh row: walk and einenu facts hold — and
      no die-event fired for Chanokh (asserted in prose; the
      absence is the state). S5 the maximum: 969. S6 the naming:
      spec-delta flagged (the curse quoted); the reason-facts
      hold. S7 the 777 total. S8 the open row: Noach-at-500 holds;
      SPECS empty at unit end — the ledger closes owing nothing
      and owning nothing. S9_negative: LET? contract guard;
      S10_negative: flag-never-block.
    confidence: tested
  - step: I
    name_en: "English leakage review"
    comment: >
      Operators derive from morph codes (hiphil begettings, qal
