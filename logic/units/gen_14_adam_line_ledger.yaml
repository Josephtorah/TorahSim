boot_steps:
  - id: STEP_Gn_5_1
    order: 1
    ref: "Gen.5.1"
    op: BOOK_HEADER_LIKENESS_ONLY
    he: זה ספר תולדת אדם ביום ברא אלהים אדם בדמות אלהים עשׂה אתו
    he_translit: "ze sefer toldot adam be-yom bero Elohim adam bi-demut Elohim asa et-o"
    en: "[EN-AID/JPS] This is the book of the generations of Adam. In the day that God created man, in the likeness of God made He him;"
    tree_left:
      he: זה ספר תולדת אדם
      he_translit: "ze sefer toldot adam"
      en: "this is the BOOK of the generations of Adam (etnachta arm)"
    tree_right:
      he: ביום ברא אלהים אדם בדמות אלהים עשה אתו
      he_translit: "be-yom bero Elohim adam bi-demut Elohim asa et-o"
      en: "in the day of creating — in the LIKENESS of God (image dropped)"
    operators:
      - op: SECTION
        expr_en: "SECTION(sefer_toledot_adam, zeh sefer toledot adam — the book header labels; installs nothing)"
        he: זה ספר תולדת אדם
        he_translit: "ze sefer toldot adam"
        en: >
          SEFER ('book') — the Torah's FIRST token of the book-word (token 2
          waits for Exod 17:14): the corpus's first self-named DOCUMENT, and
          it is a genealogy. toledot ('generations') token 2 — gen_08's 2:4
          header device recurs, now with a medium attached: heaven-and-earth
          got a story; Adam gets a LEDGER. A header labels; it installs
          nothing.
        cites: []
        confidence: tested
      - op: PRECONDITION_STATE
        expr_en: "HOLDS(be_yom_bero_elohim_adam_bidmut_elohim_asah_oto, t0)"
        he: ביום ברא אלהים אדם בדמות אלהים עשׂה אתו
        he_translit: "be-yom bero Elohim adam bi-demut Elohim asa et-o"
        en: >
          The retrospective (perfect + infinitive — background, not new
          events): 'in the DAY God created adam, in the LIKENESS of God made
          He him.' BE-YOM — 2:4's anchor construct re-used; and the handler's
          trigger word (2:17 be-yom) hangs over the ledger this header opens:
          every total below answers it. Onkelos splits the names — 'the LORD
          created... in the likeness of GOD' (the Hebrew has God both times;
          dual-track).
        cites: ["TIR-014"]
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "flag: spec 'be-tzalmenu ki-dmutenu — in-our-IMAGE after-our-LIKENESS (1:26, frozen day 6)' delivered 'bidmut elohim asah oto — LIKENESS ONLY, the image-word dropped from the restatement (5:1)'"
        he: בדמות אלהים עשׂה אתו
        he_translit: "bi-demut Elohim asa et-o"
        en: >
          QUOTE-DIFF against the frozen day-6 text: the restatement keeps
          demut ('likeness') and DROPS tzelem ('image') — the pair that day 6
          spoke together is halved in the book's own header [the letter's
          fact; the machine flags the delta and reads nothing into it]. The
          image-word census: 1:26, 1:27 x2, then NOT here — it returns at 5:3
          and 9:6.
        cites: []
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "adam are READ without prior install (Eden's first man, resumed as the ledger's head)"
        en: "flag, not fix"
        cites: []
        confidence: tested
    comment: >
      The corpus opens its first book, and the book is a death ledger with
      a birth certificate for a header — quoting day 6 minus one word.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_5_2
    order: 2
    ref: "Gen.5.2"
    op: SPECIES_BLESSED_AND_NAMED
    he: זכר ונקבה בראם ויברך אתם ויקרא את־שׁמם אדם ביום הבראם
    he_translit: "zakhar u-neqeva beraa-m va-yevarekh et-m va-yiqra et-shema-m adam be-yom hibara-m"
    en: "[EN-AID/JPS] male and female created He them, and blessed them, and called their name Adam, in the day when they were created."
    tree_left:
      he: זכר ונקבה בראם
      he_translit: "zakhar u-neqeva beraa-m"
      en: "male and female — created and blessed (etnachta arm)"
    tree_right:
      he: ויברך אתם ויקרא את־שמם אדם ביום הבראם
      he_translit: "va-yevarekh et-m va-yiqra et-shema-m adam be-yom hibara-m"
      en: "and He called their name ADAM, in the day of their creating"
    operators:
      - op: EVENT
        expr_en: "bless(e1) ∧ Agent(e1, Elohim) ∧ Theme(e1, zakhar_u_nekevah)"
        he: זכר ונקבה בראם ויברך אתם
        he_translit: "zakhar u-neqeva beraa-m va-yevarekh et-m"
        en: >
          The blessing re-run WITHOUT its mandate: 1:28 blessed and QUOTED the
          charge (fruitful, multiply, fill, subdue, rule); 5:2 blesses and
          quotes NOTHING — the ledger keeps the act and drops the content
          [letter-honest: no mandate facts installed here]. zakhar u-nekevah
          ('male and female') — 1:27's pair verbatim.
        cites: []
        confidence: tested
      - op: NAME
        expr_en: "name(adam_species) := Adam"
        he: ויקרא את־שׁמם אדם
        he_translit: "va-yiqra et-shema-m adam"
        en: >
          GOD NAMES — the naming verb (va-yiqra, the registry formula) with
          the divine subject: the registry's first DIVINE naming of humans,
          and the name is given to THEM (shemam, plural suffix — 'He called
          THEIR name Adam'): the species-name covers male and female together
          [the chain's dossiers on this plural queue; named-only]. Day
          1-derived precedent: God named day, night, sky, land, seas
          (gen_01-03); then humans named everything since. The namer of the
          first week returns for one more entry.
        cites: []
        confidence: tested
      - op: PRECONDITION_STATE
        expr_en: "HOLDS(zakhar_u_nekevah_beraam, t0) ∧ HOLDS(be_yom_hibaram, t0)"
        he: זכר ונקבה בראם
        he_translit: "zakhar u-neqeva beraa-m"
        en: >
          Standing facts: created male-and-female, 'in the day of their being
          created' (passive infinitive — the day-word again).
        cites: ["TIR-032"]
        confidence: tested
