        he_translit: "al-ken yaazov-ish … ve-davak … ve-hayu le-vasar echad"
        en: >
          THE CORPUS'S FIRST NARRATOR ETIOLOGY — al-ken ('THEREFORE'):
          a one-time surgery generalized into a standing pattern, and
          the grammar is the LAW'S OWN: imperfect (yaazov, 'leaves')
          + two weqatal chains (ve-davak 'and-cleaves', ve-hayu
          'and-they-become' — TIR-029, the legal spine form). But
          there is NO trigger clause and NO addressee: not a HANDLER
          (nothing fires it), not a demand (nothing is asked) — a
          standing PATTERN fact, the operator this unit adds. The
          vocabulary is all debuts and trails: av ('father') and em
          ('mother') have their FIRST tokens in the verse about
          LEAVING them; davak ('cleave') goes from this marriage verb
          to Deuteronomy's covenant formula ('cleave to YHWH' — 10:20,
          11:22, 13:5, 30:20; A-join); basar echad ('ONE FLESH')
          re-uses 2:21's brand-new flesh word as the union term.
          Onkelos expands halakhically: 'a man leaves the BED-CHAMBER
          (beit mishkevei) of his father and his mother' — the
          translation already carries the Sanhedrin 58a reading (2:24
          as Noachide law; named-only, the span's tripwire dossier).
          Voice [OPEN]: narrator's aside vs continued speech — the
          chain splits; the machine records the pattern either way.
        cites: ["TIR-029"]
        confidence: tested
    comment: >
      One verse of law grammar inside a narrative span: no event, no
      demand — a pattern installed over every ish to come. The
      machine's WORLD gains its first standing generalization.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

