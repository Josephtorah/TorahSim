    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(sabbath_sign, sign_between_word)"
        en: >
          THE SIGN BETWEEN MY WORD AND YOU [claim EX31-03]. BUT My Sabbaths
          you shall keep — the scoping particle the tradition reads as the
          labors' own boundary: the tabernacle work does not override the
          Sabbath, and from this join the case shelf's labor catalog hangs
          (Mishnah Shabbat 7:1, this exam's docket). The double sanction —
          death for the profaner, karet for the worker; an everlasting
          covenant; He CEASED AND RESTED; the Memra the covenant party twice
          (Onkelos Exod 31).
        cites: ["Mishnah Shabbat 7:1", "Onkelos Exod 31"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(sabbath_sign, announced_gift_file)"
        en: >
          THE ANNOUNCED GIFT AND THE ADDED SOUL [claim EX31-07]. The
          round-21 conduct block seats the sign-clause's own liturgy
          layer. THE GIVER INFORMS: לָדַעַת כִּי אֲנִי ה׳ מְקַדִּשְׁכֶם
          ("to KNOW that I the LORD sanctify you") — the Holy One to
          Moses: "a good gift is in My treasury, Shabbat its name — go
          and INFORM them" (Shabbat 10b:4); hence the conduct rule,
          bread to a child — tell his mother. THE FORK: Moses' shining
          face went unannounced — a gift bound to become known needs no
          announcing; one not bound to become known must be announced —
          and Shabbat's REWARD is the unannounced part (10b:5), the
          same fork Beitzah 16a:11 runs on this verse's "between Me and
          the children of Israel": the sign given IN PRIVATE (16a:10).
          THE ADDED SOUL: שָׁבַת וַיִּנָּפַשׁ (31:17) read "he rested —
          VAI, the soul is lost": an added soul given at the Sabbath's
          entry, taken at its close — the Sunday watch-fast barred for
          its departure (Taanit 27b:9; Beitzah 16a:12). THE
          JURISDICTION RIDER beside the conduct file: a student rules
