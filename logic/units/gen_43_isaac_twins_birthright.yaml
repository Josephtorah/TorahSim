    AMENDMENT WAVE 2026-08-06 — owner-authorized amendment of committed state (was frozen
    in b715772). LAST amendment unit (gen_43); Genesis 27 will lean on this — precision
    pays forward. Full bar C. Claude care-points (RELAY #4). SNAPSHOT + debut_map.
    Dump: gen43_amend_piece1_*. verse_trees OMITTED [bar C.7]. Elisions … . §1a Claude law.

    Piece 1 (25:19-23) this append — toledot, entreat-pair, first inquire-of-YHWH, oracle
    decree-FACTS. STOP for Claude before 25:24. Pieces planned: 19–23 · 24–28 · 29–34.

    NUMBERED FLAGS (ratify-or-reverse; leave OPEN):

    (1) NAME CHOICE: gen_43_isaac_twins_birthright (id kept).

    (2) 25:19 ve-ele toldot yitzchaq — SECTION header. toldot 8435 tok10/29 (seam from
    gen_42 tok8/9 Ishmael; tok10 opens Isaac) [VERIFIED debut_map]. Not SPECS.

    (3) 25:20 age-forty + Rivqah from Padan-aram / sister of Laban — marriage FACT/install
    continuity with gen_41. arbaim 705 tok11 (echo Esau forty later 26:34 tok12).

    (4) 25:21 ENTREAT-PAIR [owner care]: va-yetar (HC/Vqw3ms 6279 tok1/10) + va-yeater
    (HC/VNw3ms niphal 6279 tok2/10) — BOTH tokens in one verse; TORAH DEBUT of atar
    (entreat) as a pair [VERIFIED: SNAPSHOT Gen.25.21 idx0,8]. Isaac entreats YHWH opposite
    his wife; YHWH is entreated; Rivqah conceives. SAFE: dual EVENT (human petition + divine
    answer + conceive) — not SPECS push (prayer/receipt narrative, zero volitive 2ms).
    BOLD: LET(yetar) pop by yeater — staged OPEN, rejected under non-demand form.
    aqara (6135 tok2/6; tok1=11:30 Sarai) [VERIFIED] — barren-word career lands.

    (5) 25:22 va-yitrotzatzu (7533 tok1/2) struggle EVENT; Rivqah's lamah-ze anokhi question
    FACT. li-derosh et-YHWH (1875 tok4/22) — darash root earlier at 9:5 edrosh x3 (blood
    demand), but this is the corpus's FIRST oracle consultation of YHWH (inquire-of-YHWH
    frame) [care (2)]. EVENT go-to-inquire; not SPECS.

    (6) 25:23 ORACLE — divine imperfects = decree-FACTS, not SPECS pushes [care (3)].
    shene goyim / shene leumim (3816 tok1–3 debut cluster in-verse); yiparedu; leom mi-leom
    yeematz; ve-rav (7227 tok7) yaavod (5647 tok9) tzair (6810 tok5)
    [VERIFIED SNAPSHOT]. "the elder shall serve the younger" — standing oracle FACT for
    later units (incl. Gen 27). SPECS empty.

    (7) Piece-1 end: SPECS empty; REGISTRY 0; TESTS 0. Later pieces (filed for continuity):
    25:25–26 dual namings + aqev/eqev; ahav tok3–4; birthright machine (haliteni/mikhra/
    hishavah pops); gulp residual; va-yivez debut; seam 26:1.

