  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_43_2026-08-08.md; manifest verified
    19/19, zero FAILED, zero-iteration pass). CROWNS
    (chain-attested + DB-verified). THE TWO PROUD ONES IN THE WOMB
    [G43-01/02, Minchat Shai on 25:23; Avodah Zarah 11a; Bereshit
    Rabbah]: שני גיים ("TWO NATIONS are in your womb") — the
    Torah's ONE nations-word written with two yods and no vav
    (read גוים): SNAPSHOT carries written and read side by side
    (two-token encoding), and the census locks the rule — bare
    plene גוים eighteen tokens, the lean two-yod form ONCE; the
    Talmud's derash rides the written form: read it GEYIM, the two
    lordly ones — Rebbi and Antoninus at one table. THE TWO-WAY
    SERVE-VERB [G43-03, Minchat Shai on 25:23; Bereshit Rabbah 63
    via the Yefeh Toar]: ורב יעבד צעיר ("and the elder shall
    serve the younger" — or the reverse) — DEFECTIVE, and the
    midrash makes the ambiguity explicit ("if worthy... if not"):
    the oracle's double edge lives in the missing vav; the form
    stands SIX times in the Torah, all lean (no plene token
    exists, builder-asserted), sharing its verb with the
    service-laws — the Hebrew slave (Exod 21:2), the jubilee
    hireling (Lev 25:40), the Levite's retirement (Num 8:25-26),
    the unworked valley (Deut 21:4). THE LEAN TWINS AND THE FULL
    [G43-06/07, Kitzur Baal HaTurim on 25:24]: תומם ("behold,
    TWINS in her womb") — doubly lean (no aleph, no yod), unique;
    its one full counterpart is Tamar's תאומים (Gen 38:27, also
    unique): Rebecca's twins (one wicked) written lean, Tamar's
    (both righteous) written whole — the tradition's contrast
    letter-exact. THE TWO RUDDY ONES [G43-04/05, Minchat Shai on
    25:25]: אדמוני ("and the first came out RUDDY") — unique in
    the Torah, plene as the precise books rule; the Masorah's
    pair-leg is David (I Sam 16:12, 17:42; edges): Esau and David
    share the red, and the midrash's contrast (blood by whim,
    blood by the court's word) hangs on the pair. THE BOTH-BARREN
    SKELETON [G43-08, Minchat Shai on 25:21; Yevamot 64]:
    כי עקרה הוא ("for she was barren") — the she-word written in
    the masculine skeleton הוא with the feminine vowel (the
    pentateuchal written-he), and the Talmud rides exactly that:
    both were barren, he was entreated FOR HIM. THE PRAYER OUT IN
    PATACH, THE ANSWER BACK IN SEGOL [G43-09, Minchat Shai on
    25:21]: the verse's two entreat-verbs — ויעתר ("he entreated") then ויעתר ("He was entreated") — pointed apart; the tav-segol of the answered
    form verified as ruled. THE PRESSED QUESTIONS [G43-11/12,
    Minchat Shai on 25:22; Kitzur on 25:32]: למה זה ("WHY THEN am
    I thus?" — Rebecca) with the zayin dageshed as ruled; and
    Esau's ולמה־זה ("WHY THEN a birthright to me?") joined by
    maqqef, machine-checked — the second leg of the Masorah's joined pair is the vain-breath verse (Job 27:12; edge). THE MICHLOL'S SOFT
    LAMED [G43-13, Minchat Shai on 25:23]: ולאם מלאם ("one PEOPLE
    stronger THAN THE OTHER") — the lamed of מלאם soft against
    the doubling custom (the Michlol's noted exception), both
    people-words lean of vav. SHEM IN THE FINALS [G43-14, Kitzur
    on 25:27]: איש תם ("a WHOLESOME MAN, dwelling in tents") —
    closes ש-ם, the letters of שם ("Shem"), in order: the
    tent-sitter's teacher sealed in the phrase's ends. HAMAN IN
    THE GULP [G43-15, Kitzur on 25:30]: הלעיטני נא מן ("POUR INTO
    ME, please, from...") — initials ה-נ-מ, the letters of המן
    ("Haman"): the descendant sold-for-bread already in the
    wolfed-down stew (as Jacob bought Esau with bread and
    lentils, Mordechai bought Haman with bread). THE ARAMEAN IS
    THE DECEIVER [G43-16, Kitzur on 25:20]: הארמי ("Laban THE
    ARAMEAN") — the gentilic's letters are exactly the letters of הרמאי ("the deceiver"), verified letter for letter at Laban's token.
    THE UNIQUE WORDS AND THEIR CANON LEGS [G43-17/18/19, Kitzur]:
    בקחתו ("at his TAKING of Rebecca," 25:20) unique — the
    Masorah's pair is Jeremiah taken bound (Jer 40:1; edge),
    Isaac's barren boundness read in; וידו ("AND HIS HAND
    grasping the heel," 25:26) unique — the legs are the
    outstretched hand and the line-dividing hand over the nations
    (Isa 14:26-27, 34:17; edges); ויבז ("and Esau DESPISED the
    birthright," 25:34) unique — the pair-leg is Haman's
    despising (Esth 3:6; edge): "the despiser son of the
    despiser." DISCREPANCY [G43-10, Minchat Shai on 25:22]:
    ויתרצצו ("and the children STRUGGLED within her") — the
    ruling wants the tzadi with plain sheva "per our custom";
    SNAPSHOT points HATAF PATACH (the compound half-vowel): the
    sheva-vs-hataf codex split's FOURTH station (the bless-word
    class: 12:3, 22:18, 24:60 — now the twins' first struggle).
    Watchlist. INSTRUMENT GAPS: ואלה תולדת (25:19) opens a
    parasha petucha (open paragraph) — paragraph layer
    uninstrumented; the header's bare-spelled תולדת joins the
    bare-toledot ledger (frozen gen_16's four-header crown; this
    station verified in the stream). READINGS (named-only,
    unclaimed): the Kitzur's gematria pieces without rows — the
    struggling twins dividing after צו ("command") and idols; the
    ten nations of the גיים reading; אשתו read toward straw and
    fire; לדרוש toward Shem's academy; יושב אהלים counted toward
    the Presence's tent-years; נזיד toward mourning-food (Jacob's
    lentils on the day of Abraham's death — the Kitzur's own
    frame for the stew).
