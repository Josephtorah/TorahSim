scenarios:
  - id: SC1_path_then_end
    description_en: >
      A path is evaluated as straight before a person; the proverb states its end.
    inputs_en: >
      Matches יש דרך ישר ל/פני איש / yesh derekh yashar li-fnei ish /
      "there is a straight way before a man".
    expected:
      - field: "end"
        value_en: "its end is ways of death"
        value_he: "ו/אחרית/ה דרכי מות"
        value_he_translit: "ve-acharita darkhei mavet"
        justified_by: "R_path_end_death"
    comment: "Applies at both 14:12 and 16:25."
    confidence: hypothesis

  - id: SC2_do_not_place_death_in_left_arm
    description_en: >
      Check that death is not smuggled into the left arm by English "wrong path."
    inputs_en: >
      Left arm only: יש דרך ישר ל/פני איש (no מות / mavet / "death" token).
    expected:
      - field: "left_arm_tokens"
        value_en: "no death word in left half"
        value_he: "יש דרך ישר ל/פני איש"
        value_he_translit: "yesh derekh yashar li-fnei ish"
        justified_by: "STEP_Pr_14_12"
      - field: "death_location"
        value_en: "death only in right arm"
        value_he: "דרכי מות"
        value_he_translit: "darkhei mavet"
        justified_by: "R_path_end_death"
    comment: "English-leakage guard: keep מות in THEN, not WHEN."
    confidence: tested

  - id: SC3_parallel_same_rule
    description_en: "Reader opens 16:25 after 14:12."
    inputs_en: "Same Hebrew as 14:12 under osis Prov.16.25."
    expected:
      - field: "rule"
        value_en: "same decision row, no second English rule"
        value_he: "יש דרך ישר … דרכי מות"
        value_he_translit: "yesh derekh yashar … darkhei mavet"
        justified_by: "R_path_end_death"
    comment: "RULE_parallel_same_bracket."
    confidence: tested

