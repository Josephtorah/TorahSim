derivation_log:
  - step: A
    name_en: "Choose the unit"
    comment: >
      Chosen after prov_03_trust_know to re-test poetry tree→logic on a different
      dual shape: path-setup ‖ end-result (not DO ‖ DO-NOT). Hebrew book
      מִשְׁלֵי / Mishlei / "Proverbs"; refs 14:12 and // 16:25 (identical structure).
    tags: ["[HE-WRITTEN]"]
    confidence: established

  - step: B
    name_en: "Load Hebrew source"
    comment: >
      Hebrew from morphhb OSHB Prov.xml via taamim_tree_parse.py. English only [EN-AID].
    tags: ["[HE-WRITTEN]", "[EN-AID]"]
    confidence: tested

  - step: C
    name_en: "Segment structure (trees FIRST)"
    comment: >
      Both verses: unique, pure_binary, leaf_complete, system=poetry, 8 words, 4 bricks.
      Same tree_ascii shape and same expect_bracket_plain. Etnachta top split.
    tags: ["[HE-STRUCT]"]
    confidence: tested

  - step: D
    name_en: "Extract predicates and outcomes"
    comment: >
      LEFT: יש דרך ישר ל/פני איש / yesh derekh yashar li-fnei ish /
      "there is a straight way before a man".
      RIGHT: ו/אחרית/ה דרכי מות / ve-acharita darkhei mavet /
      "and its end — ways of death".
      ישר / yashar / "straight/right" is appearance-before-man, not final moral verdict
      from the English word "right" alone — end is מות / mavet / "death".
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: E
    name_en: "Choose logic format"
    comment: >
      One decision row shared by both verse refs (//). STEPs per osis for show-work.
      Pattern TIR-025 (path claim → end). Contrast TIR-023 (dual imperative) from unit 1.
    tags: ["[INFER]"]
    confidence: hypothesis

  - step: F
    name_en: "Fill trilingual objects"
    comment: >
      phrase_map once (shared); tree_coverage listed for 14:12 and mirrored for 16:25
      (same roles; mark sequences may differ slightly — both lock same brackets).
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: G
    name_en: "Optional Oral"
    comment: "No Oral attachments in this draft."
    tags: ["[ORAL]"]
    confidence: hypothesis

  - step: H
    name_en: "Scenarios"
    comment: "Appearance of straight path vs written end = death-ways."
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: I
    name_en: "English-leakage review"
    comment: >
      Avoid English "seems right" as sole condition — ground on יש דרך ישר ל/פני איש.
      Free gloss may say "seems straight before a man" as [EN-AID] of ל/פני איש.
    tags: ["[EN-AID]"]
    confidence: hypothesis

  - step: J
    name_en: "Freeze"
    comment: "status remains draft. Not frozen."
    tags: []
    confidence: hypothesis

