  - id: ORAL_calendar_thesis
    status: verified
    work_en: "Pesikta DeRav Kahana 5:1 (with Bereshit Rabbah 6:1) — on the 1:14 DECLARE; day-4 triage rows 7, 89"
    he: "אָמַר רַבִּי יוֹחָנָן לֹא נִבְרָא לְהָאִיר אֶלָּא גַּלְגַּל חַמָּה בִּלְבַד — יְהִי מְאֹרֹת, מְאֹרֹת כָּתַב. אִם כֵּן לָמָּה נִבְרֵאת הַלְּבָנָה, אֶלָּא לְקַדֵּשׁ בָּהּ רָאשֵׁי חֳדָשִׁים וְרָאשֵׁי שָׁנִים"
    he_translit: "amar Rabbi Yochanan: lo nivra le-ha'ir ela galgal chamah bilvad — yehi me'orot, ME'OROT KATAV. im ken lamah nivreit ha-levanah? ela le-kadesh bah rashei chodashim ve-rashei shanim"
    en: >
      "R. Yochanan said: only the sun-orb was created to illuminate — 'yehi
      me'orot': ME'OROT IS WRITTEN [defective]. Why then was the moon
      created? To sanctify New Moons and New Years by it." The chain reads
      the unit's TWO grammar flags TOGETHER — the singular yehi (BR 6:1
      makes the singular explicit) and the defective spelling — and derives
      from them the calendar thesis: one illuminator, one calendar
      instrument. PDRK adds R. Zeira's anti-deification foresight ('if two
      that contradict each other are deified — one alone, all the more so').
    middah: >
      null for the thesis itself — a ktiv ('written-form') derivation of
      the al-tiqrei family, honestly not one of the cataloged 32; R.
      Zeira's argument inside it = E5 (explicit qal wa-chomer, 'light and
      heavy'), dayo cap unstrained. Tagged rev 2 per Step 5.
