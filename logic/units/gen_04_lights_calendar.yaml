boot_steps:
  - id: STEP_Gn_1_14
    order: 1
    ref: "Gen.1.14"
    op: DECLARE_SPEC_CALENDAR
    he: וַיֹּאמֶר אֱלֹהִים יְהִי מְאֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים וּלְיָמִים וְשָׁנִים
    he_translit: "va-yomer Elohim yehi me'orot bi-rkia ha-shamayim le-havdil bein ha-yom u-vein ha-lailah ve-hayu le-otot u-le-mo'adim u-le-yamim ve-shanim"
    en: "[EN-AID/JPS] And God said: 'Let there be lights in the firmament of the heaven to divide the day from the night; and let them be for signs, and for seasons, and for days and years.'"
    tree_left:
      he: ויאמר אלהים יהי מארת ברקיע השמים להבדיל בין היום ובין הלילה
      he_translit: "va-yomer … u-vein ha-lailah"
      en: "speech act + existence fiat + mount location + separation purpose (etnachta arm)"
    tree_right:
      he: והיו לאתת ולמועדים ולימים ושנים
      he_translit: "ve-hayu le-otot u-le-mo'adim u-le-yamim ve-shanim"
      en: "the weqatal THEN-chain: the calendar job list"
    operators:
      - op: ORAL_UTTERANCE
        expr_en: "UTTERANCE(6, fiat) — ma'amar census (Avot 5:1)"
        en: >
          va-yomer Elohim yehi me'orot — the sixth utterance of the ten by
          the census rule established at day one (bereshit + each va-yomer;
          Rosh Hashanah 32a, read at the gen_01 triage). Standalone machine
          keeps its local count — cross-unit chaining is Stage E (amendment
          2026-08-21, day-4 readings applied).
        cites: ["Rosh Hashanah 32a:19"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(exists(meorot), loc=raqia_ha_shamayim))"
        he: יְהִי מְאֹרֹת
        he_translit: "yehi me'orot"
        en: >
          QAL JUSSIVE 3MS (Vqj3ms) over a PLURAL subject (me'orot, Ncmpa):
          a singular fiat commanding a plural product — the number mismatch
          is machine-visible in the morph codes and recorded [OPEN]. Onkelos
          (Tier-A 2026-07-30) normalizes to plural yehon — the authorized
          translation smooths what the Hebrew leaves rough. Spelling: מארת
          doubly defective here, מאורת at 1:15, מאור (singular, plene) at
          1:16 — three orthographies of one lexeme inside one unit,
          letter-visible [OPEN]. AMENDMENT 2026-08-21 — the chain reads the
          two flags TOGETHER and answers: yehi IS singular, exactly as
          written — 'only the sun-orb was created to illuminate; why then
          the moon? to sanctify New Moons and years by it' (Bereshit Rabbah
          6:1, with R. Shilo: months counted only once the sun has set;
          Pesikta DeRav Kahana 5:1 makes the ktiv argument explicit and
          adds R. Zeira's anti-deification foresight); and the defective
          ktiv carries the me'erot ('curses') reading — the fourth-day fast
          for the children (Jerusalem Talmud Taanit 4:3:3, chain-primary;
          ORAL_meorot_defective, verified). The flags stand [OPEN] as facts
          of the letters; the resolutions ride beside them, dual-track.
        cites: ["TIR-026", "Bereshit Rabbah 6:1", "Pesikta DeRav Kahana 5:1",
                "Jerusalem Talmud Taanit 4:3:3"]
        confidence: tested
      - op: TRIPLE
        expr_en: "{ P: raqia read (installed gen_02) } install-lights { Q: exists(meorot), loc=raqia_ha_shamayim }"
        he: לְהַבְדִּיל … וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים וּלְיָמִים וְשָׁנִים
        he_translit: "le-havdil … ve-hayu le-otot u-le-mo'adim u-le-yamim ve-shanim"
        en: >
          The acceptance contract, with the job list as its criteria. Purpose
          #1 — le-havdil bein ha-yom u-vein ha-lailah (lamed + infinitive
          construct, TIR-030): the very function Elohim performed personally
          on day 1 (va-yavdel, 1:4) is here WRITTEN INTO THE FIXTURES' SPEC —
          an operational handover, machine to fixtures. Then the weqatal
          THEN-chain (ve-hayu, Vqq3cp, TIR-029): le-otot (signs),
          u-le-mo'adim (appointed times/festivals), u-le-yamim ve-shanim
          (days and years) — the CALENDAR job. Onkelos makes the computation
          explicit: u-le-mimnei ve-hon yomin u-shnin, 'to COUNT by them days
          and years' — a verb of counting the Hebrew leaves implicit. Note
          the objects of havdil here are the day-1 REGISTRY LABELS (ha-yom,
          ha-lailah) — hold that for 1:18. AMENDMENT 2026-08-21 — the
          tannaitic chain reads the THEN-chain as a SECOND handover: 'the
          commandments given to them from the heavens: intercalation of
          years and fixing of New Moons — as it is stated: ve-hayu le-otot
          u-le-mo'adim' (Sifrei Devarim 306:14) — the calendar job delegated
          onward THROUGH the fixtures to Israel's computation; and the Bavli
          quotes this clause back as the moon's compensation — 'let Israel
          count the days and years with you' (Chullin 60b:3). The operator
          is unchanged; its criteria now carry the chain's two readings of
          who computes.
        cites: ["TIR-029", "TIR-030", "Sifrei Devarim 306:14",
                "Chullin 60b:3"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "raqia, shamayim are READ without prior install (standalone machine; installed in gen_02 — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
    comment: >
      The etnachta splits [fiat + mount location + operate-purpose | signal-
      purposes]: the spec itself is two-track — the fixtures must OPERATE
      (divide) and SIGNAL (mark, count). First demand in the corpus whose
      receipt does not arrive in its own verse.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_15
    order: 2
    ref: "Gen.1.15"
    op: SPEC_CROSS_REGISTRY_RESULT
    he: וְהָיוּ לִמְאוֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהָאִיר עַל־הָאָרֶץ וַיְהִי־כֵן
    he_translit: "ve-hayu li-me'orot bi-rkia ha-shamayim le-ha'ir al-ha-aretz va-yehi khen"
    en: "[EN-AID/JPS] 'And let them be for lights in the firmament of the heaven to give light upon the earth.' And it was so."
    tree_left:
      he: והיו למאורת ברקיע השמים להאיר על הארץ
      he_translit: "ve-hayu li-me'orot … al-ha-aretz"
      en: "spec continuation: service purpose across registries (etnachta arm)"
    tree_right:
      he: ויהי כן
      he_translit: "va-yehi khen"
      en: "generic RESULT — the receipt"
    operators:
      - op: NOTE_PRESUPPOSED
        expr_en: "aretz are READ without prior install (standalone machine; installed in gen_01, renamed in gen_03 — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(exists(meorot), loc=raqia_ha_shamayim, t1) — va-yehi khen pops the 1:14 demand"
        he: וַיְהִי־כֵן
        he_translit: "va-yehi khen"
        en: >
          Generic summary receipt. TWO pattern notes: (a) the demand was
          pushed at 1:14 and pops here — the first verse-boundary-crossing
          spec in the corpus (days 1-3 closed same-verse); (b) the receipt
          PRECEDES the build narrative of 1:16-17, exactly as 1:11's khen
          preceded 1:12 — receipt-before-execution, second occurrence: a
          pattern now, not an anomaly. The second weqatal (ve-hayu
          li-me'orot … le-ha'ir al-ha-aretz, TIR-029/030) is the
          CROSS-REGISTRY service purpose: mounted heaven-side (raqia
          ha-shamayim, day 2's entity), serving earth-side (aretz, days
          1/3) — the first spec that wires three prior units together.
        cites: ["TIR-029", "TIR-030"]
        confidence: tested
    comment: >
      The integration verse: raqia/shamayim (gen_02), aretz (gen_01/03), and
      by 1:14's purposes the yom/lailah labels (gen_01) all referenced in a
      single spec. The machine reads them presupposed; the flags are the
      cross-unit wiring made visible.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_16
    order: 3
    ref: "Gen.1.16"
    op: BUILD_DIFFERENTIATE_DELTA
    he: וַיַּעַשׂ אֱלֹהִים אֶת־שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים אֶת־הַמָּאוֹר הַגָּדֹל לְמֶמְשֶׁלֶת הַיּוֹם וְאֶת־הַמָּאוֹר הַקָּטֹן לְמֶמְשֶׁלֶת הַלַּיְלָה וְאֵת הַכּוֹכָבִים
    he_translit: "va-ya'as Elohim et-shnei ha-me'orot ha-gedolim et-ha-maor ha-gadol le-memshelet ha-yom ve-et-ha-maor ha-qaton le-memshelet ha-lailah ve-et ha-kokhavim"
    en: "[EN-AID/JPS] And God made the two great lights: the greater light to rule the day, and the lesser light to rule the night; and the stars."
    tree_left:
      he: ויעש אלהים את שני המארת הגדלים
      he_translit: "va-ya'as Elohim et-shnei ha-me'orot ha-gedolim"
      en: "the build event + the SUMMARY inventory: 'the two GREAT lights' (etnachta arm)"
    tree_right:
      he: את המאור הגדל לממשלת היום ואת המאור הקטן לממשלת הלילה ואת הכוכבים
      he_translit: "et-ha-maor ha-gadol … ve-et ha-kokhavim"
      en: "the ITEMIZED inventory: great/small differentiated, offices assigned, stars appended"
    operators:
      - op: EVENT
        expr_en: "make(e4) ∧ Agent(e4, Elohim) ∧ Theme(e4, maor_gadol) ∧ Theme(e4, maor_qaton) ∧ Theme(e4, kokhavim)"
        he: וַיַּעַשׂ אֱלֹהִים אֶת … אֶת … וְאֶת … וְאֵת
        he_translit: "va-ya'as Elohim et … et … ve-et … ve-et"
        en: >
          asah ('made', Vqw3ms) — not bara: manufacture, not creation ex
          nihilo. FOUR et-markers in one verse (To x4: the summary pair +
          each light + the stars) — the densest Theme inventory since 1:1,
          the ORAL_et_theme_marker semantics (et = object/Theme marker,
          Onkelos yat) on full display.
        cites: ["TIR-014", "TIR-015"]
        confidence: tested
      - op: REGISTRY_INSTALL
        expr_en: "WORLD += {maor_gadol, maor_qaton, kokhavim} — the delivered inventory, differentiated"
        en: "three entities enter the world where the spec named one undifferentiated plural"
        cites: []
        confidence: tested
      - op: ASSIGN
        expr_en: "REGISTRY: maor_gadol->memshelet_yom, maor_qaton->memshelet_lailah"
        he: לְמֶמְשֶׁלֶת הַיּוֹם … לְמֶמְשֶׁלֶת הַלַּיְלָה
        he_translit: "le-memshelet ha-yom … le-memshelet ha-lailah"
        en: >
          Dative le- + construct memshelet ('for the dominion of'): ROLE
          bindings, not names — this unit contains NO va-yiqra; the naming
          series ended on day 3. The same dative frame TIR-022 reads on
          naming writes here carries an OFFICE APPOINTMENT: greater light ->
          dominion of day, lesser light -> dominion of night. The stars
          receive NO office — a trailing et with no le- phrase. Onkelos
          renders the office verbally (le-mishlat, 'to rule'). NEW OP:
          interpreter vocabulary extended at verification (day-3 precedent).
        cites: ["TIR-022"]
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'me'orot (one undifferentiated plural)' delivered 'shnei ha-me'orot ha-GEDOLIM, then ha-gadol / ha-qaton' — flag spec_delta"
        he: הַמְּאֹרֹת הַגְּדֹלִים ← הַגָּדֹל / הַקָּטֹן
        he_translit: "ha-me'orot ha-GEDOLIM -> ha-gadol / ha-qaton"
        en: >
          The same-verse tension: the pair is introduced as BOTH GREAT
          (ha-gedolim, plural adjective) and immediately split into greater
          and lesser — letter-visible within eleven words; the tree itself
          stages it (the etnachta closes the summary half before the
          itemization half splits them). AMENDMENT 2026-08-21 — the
          significance is READ: created equal; 'is it possible for two
          kings to serve with one crown?' — 'go and diminish yourself'
          (Chullin 60b:2); and the chain asks this delta in its own words —
          'after He calls them GREAT, He turns and diminishes them?!' —
          answering: because one entered its fellow's domain (Bereshit
          Rabbah 6:3). The flag stands; the significance is the chain's,
          on the record.
        cites: ["Chullin 60b:2", "Bereshit Rabbah 6:3"]
        confidence: "delta tested (letter-visible); significance verified (oral, dual-track)"
      - op: WITNESS_STATE
        expr_en: "WITNESS(maor_qaton, equal_then_diminished) — created equal, made small"
        en: >
          The lesser light entered the world GREAT and was made small. The
          PROVENANCE is a machloket ('recorded dispute'), carried as data:
          position A — self-diminution, after 'is it possible for two kings
          to serve with one crown?' — 'go and diminish yourself' (Chullin
          60b:2); position B — 'because one entered its fellow's domain'
          (Bereshit Rabbah 6:3). The OUTCOME converges — diminished — and
          only the converged outcome is state; the dispute rides beside it,
          never merged (day-one precedent; the I13/E15 shape: two accounts
          stand, no third text recorded deciding). The compensations
          package: rule day AND night ('what use is a candle at noon?'),
          Israel counts days and years by it, the righteous named after the
          qatan (Chullin 60b:3). WITNESS-GROUNDED TIER (owner ruling
          2026-08-20): never mixed into the text-grounded facts.
        cites: ["Chullin 60b:2", "Bereshit Rabbah 6:3", "Chullin 60b:3"]
        confidence: "witness-grounded (aggadic tier); provenance = recorded dispute"
      - op: WITNESS_STATE
        expr_en: "WITNESS(kapparah_chodesh, standing_monthly) — the atonement for the diminution"
        en: >
          R. Pinchas on the New-Moon goat, 'a sin offering FOR the Lord':
          'bring an atonement for Me, for having diminished the moon'
          (Bereshit Rabbah 6:3) — a standing MONTHLY obligation on the
          divine ledger, witnessed into the world as its own entity so the
          later text that names it finds it mechanically: Num 28:15 is the
          typed anchor. Witness-grounded tier; walled.
        cites: ["Bereshit Rabbah 6:3"]
        confidence: "witness-grounded (aggadic tier)"
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'no stars in the job order' delivered 've-et ha-kokhavim' — flag spec_delta"
        he: וְאֵת הַכּוֹכָבִים
        he_translit: "ve-et ha-kokhavim"
        en: >
          Over-delivery: the stars appear only at the build, never in the
          1:14-15 spec — the day-3 pattern again (the herbs' le-minehu),
          delivery exceeding order; appended as a bare trailing Theme with
          no office and no size adjective. AMENDMENT 2026-08-21 — the
          chain's answer to this delta: the stars are the diminished moon's
          retinue — 'since this one diminished himself … when he goes out,
          they go out with him' (Bereshit Rabbah 6:4): the over-delivery
          explained as restitution inside the diminution settlement. The
          flag stands; the reading is the chain's, dual-track. Middah: E26
          (mashal, 'parable' — the two-stewards parable licenses the
          reading).
        cites: ["Bereshit Rabbah 6:4"]
        confidence: "delta tested (letter-visible); significance verified (oral, dual-track)"
      - op: WITNESS_STATE
        expr_en: "WITNESS(kokhavim, retinue_of_maor_qaton) — the compensation escort"
        en: >
          The witnessed link that carries the parable's content as state:
          the stars go out WITH the diminished moon — retinue, not
          accident. The spec's silence on the stars and the build's bare
          trailing Theme both stay text-tier facts; the relation lives at
          witness tier only.
        cites: ["Bereshit Rabbah 6:4"]
        confidence: "witness-grounded (aggadic tier)"
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'jobs: divide, signs, festivals, days+years, shine' delivered 'le-memshelet (dominion) added' — flag spec_delta"
        he: לְמֶמְשֶׁלֶת
        he_translit: "le-memshelet"
        en: >
          The office of RULE appears only in the delivery (1:16) and the
          install recap (1:18 ve-limshol) — the 1:14-15 job list never
          mentions dominion. Delivery adds a governance layer the spec did
          not order.
        cites: []
        confidence: "delta tested (letter-visible)"
    comment: >
      The build differentiates what the spec left generic — and every
      difference is flagged, not judged: three deltas on the books, verdict
      deferred to the oracle at 1:18 (the day-3 lesson: spec-conformance and
      goodness are separate predicates).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_17
    order: 4
    ref: "Gen.1.17"
    op: INSTALL_MOUNT
    he: וַיִּתֵּן אֹתָם אֱלֹהִים בִּרְקִיעַ הַשָּׁמָיִם לְהָאִיר עַל־הָאָרֶץ
    he_translit: "va-yiten otam Elohim bi-rkia ha-shamayim le-ha'ir al-ha-aretz"
    en: "[EN-AID/JPS] And God set them in the firmament of the heaven to give light upon the earth."
    tree_left:
      he: ויתן אתם אלהים ברקיע השמים
      he_translit: "va-yiten otam Elohim bi-rkia ha-shamayim"
      en: "the mount event: placed into day 2's entity (etnachta arm)"
    tree_right:
      he: להאיר על הארץ
      he_translit: "le-ha'ir al-ha-aretz"
      en: "delivered-purpose recap begins: to shine on the earth"
    operators:
      - op: EVENT
        expr_en: "place(e5) ∧ Agent(e5, Elohim) ∧ Theme(e5, otam_ha_meorot)"
        he: וַיִּתֵּן אֹתָם
        he_translit: "va-yiten otam"
        en: >
          natan ('set/placed', Vqw3ms) with otam — the et-marker carrying a
          pronominal suffix (To+Sp3mp): the built entities, referenced as a
          group, mounted into raqia ha-shamayim. TWO-STEP BUILD: asah (1:16,
          manufacture) then natan (1:17, installation) — distinct events;
          day 2's raqia had va-ya'as only. The purpose chain that begins
          here (le-ha'ir) continues across the verse boundary into 1:18 —
          the infinitives hang off this install event.
        cites: ["TIR-030"]
        confidence: tested
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(or, or_ha_ganuz) — the withdrawn light, read at witness tier (witnessed in gen_01; cross-unit chaining is Stage E)"
        en: >
          Flag, not fix — the presupposed-read discipline extended to the
          witness tier (amendment 2026-08-21; NEW OP, the day-3 vocabulary
          precedent). The chain builds its objection FROM these verses:
          'was light created on day one? but va-yiten otam … yom revi'i!'
          (Chagigah 12a:8) — and resolves through the hidden light,
          deciding verse Ps 97:11, 'light is SOWN for the righteous.'
          Since the day-one amendment or_ha_ganuz ('the hidden light') IS
          present in gen_01's witnessed world: the fixtures mount here as
          the withdrawn light's operating replacement — a handover, not an
          invention. Middah: E15 (two passages contradict until a third
          text decides — the sugya supplies Ps 97:11). The read installs
          nothing in any tier of THIS machine; the wall is asserted.
        cites: ["Chagigah 12a:8"]
        confidence: "witness-grounded (aggadic tier); cross-unit read flagged"
    comment: >
      Manufacture and deployment separated: the corpus distinguishes making
      a thing from putting it where it serves. Location = the day-2 entity,
      read presupposed (flagged at 1:14).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_18
    order: 5
    ref: "Gen.1.18"
    op: PURPOSE_RECAP_DELTA_TEST
    he: וְלִמְשֹׁל בַּיּוֹם וּבַלַּיְלָה וּלְהַבְדִּיל בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ וַיַּרְא אֱלֹהִים כִּי־טוֹב
    he_translit: "ve-limshol ba-yom u-va-lailah u-le-havdil bein ha-or u-vein ha-choshekh va-yar Elohim ki-tov"
    en: "[EN-AID/JPS] And to rule over the day and over the night, and to divide the light from the darkness; and God saw that it was good."
    tree_left:
      he: ולמשל ביום ובלילה ולהבדיל בין האור ובין החשך
      he_translit: "ve-limshol … u-vein ha-choshekh"
      en: "delivered-purpose recap: rule + separate, at ENTITY level (etnachta arm)"
    tree_right:
      he: וירא אלהים כי טוב
      he_translit: "va-yar Elohim ki-tov"
      en: "the day's test"
    operators:
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'le-havdil bein ha-YOM u-vein ha-LAILAH (registry labels, 1:14)' delivered 'u-le-havdil bein ha-OR u-vein ha-CHOSHEKH (the entities, 1:18)' — flag spec_delta"
        he: בֵּין הַיּוֹם וּבֵין הַלָּיְלָה ← בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ
        he_translit: "bein ha-yom u-vein ha-lailah -> bein ha-or u-vein ha-choshekh"
        en: >
          The delegated separation restated at ENTITY level where the spec
          spoke at LABEL level: 1:14 divides the day-1 REGISTRY LABELS
          (yom/lailah), 1:18 divides the day-1 ENTITIES (or/choshekh) — the
          label-vs-entity distinction (gen_01's ORAL_label_not_entity, BR
          3:6 'the light is not the day?!') drawn by the text itself across
          the spec/delivery pair. Letter-visible; recorded as the FOURTH
          delta of the unit (renumbered rev 2 — the machine always counted
          four; the prose said three) — [OPEN] whether restatement or
          refinement.
        cites: []
        confidence: "delta tested (letter-visible); significance [OPEN]"
      - op: TEST
        expr_en: "PASS(tov, meorot)"
        he: כִּי־טוֹב
        he_translit: "ki-tov"
        en: >
          The day's single test — again with NO explicit et-object (contrast
          1:4 va-yar ET-ha-or; like both day-3 tests): the inspection covers
          the delivered work as a whole. FOUR deltas stand flagged
          (renumbered rev 2 — the machine's own count); the oracle passes
          the delivery AS DELIVERED — the day-3 lesson (spec-conformance
          and goodness are separate predicates) repeats on a quadruple
          deviation.
        cites: []
        confidence: tested
    comment: >
      1:18's infinitive chain (ve-limshol … u-le-havdil, TIR-030) hangs off
      1:17's va-yiten: the install's delivered-purpose recap. Delivered job
      list {shine, rule, divide(or/choshekh)} vs spec job list
      {divide(yom/lailah), signs, festivals, days+years, shine}: the diffs
      are exactly the flags on the books.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_19
    order: 6
    ref: "Gen.1.19"
    op: COMMIT_DAY
    he: וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם רְבִיעִי
    he_translit: "va-yehi erev va-yehi voqer yom revi'i"
    en: "[EN-AID/JPS] And there was evening and there was morning, a fourth day."
    tree_left:
      he: ויהי ערב ויהי בקר
      he_translit: "va-yehi erev va-yehi voqer"
      en: "cycle close"
    tree_right:
      he: יום רביעי
      he_translit: "yom revi'i"
      en: "day ledger entry — spec received, build delivered, one test, two offices"
    operators:
      - op: COMMIT
        expr_en: "cycle(erev -> boqer); LEDGER[day 4] := {spec ✓, test PASS, roles 2}"
        he: יוֹם רְבִיעִי
        he_translit: "yom revii"
        en: >
          revi'i = ORDINAL 'fourth' — and here the morphology itself testifies:
          OSHB tags it Aomsa, ordinal adjective (the day-1 cardinal echad is
          the marked exception, as ORAL_echad_label_form records). Spec
          received (1:15), inventory delivered and mounted, one PASS on the
          books, two offices bound; four spec-delta flags ride the ledger
          without blocking (renumbered rev 2). Clean commit.
        cites: []
        confidence: tested
    comment: >
      The fullest clean transaction so far: five distinct phases (spec,
      receipt, build, install, recap+test) closed by one ordinal commit.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

state_machine:
  comment_en: "Day-4 work order (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 1:14 — all registers empty (standalone unit)"
    - id: S_spec_open
      en: "After 1:14 — LET(exists(meorot)) pushed and OPEN (first cross-verse demand); job list on the contract; raqia/shamayim flagged"
    - id: S_spec_received
      en: "After 1:15 — receipt pops the demand (before the build narrative); WORLD += meorot (receipt-level); aretz flagged"
    - id: S_built_differentiated
      en: "After 1:16 — WORLD += {maor_gadol, maor_qaton, kokhavim}; REGISTRY: two role writes (offices); spec_delta x3 building"
    - id: S_mounted
      en: "After 1:17 — the delivered inventory placed into raqia (day-2 entity); purpose recap opens"
    - id: S_recapped_tested
      en: "After 1:18 — third delta flagged (label->entity restatement); TESTS: PASS(tov, meorot)"
    - id: S_day4_committed_clean
      en: "After 1:19 — LEDGER[4] closed ordinal revi'i; clean (no commit_without_test); three deltas ride"
  transitions:
    - {from: S_boot, to: S_spec_open, via: STEP_Gn_1_14}
    - {from: S_spec_open, to: S_spec_received, via: STEP_Gn_1_15}
    - {from: S_spec_received, to: S_built_differentiated, via: STEP_Gn_1_16}
    - {from: S_built_differentiated, to: S_mounted, via: STEP_Gn_1_17}
    - {from: S_mounted, to: S_recapped_tested, via: STEP_Gn_1_18}
    - {from: S_recapped_tested, to: S_day4_committed_clean, via: STEP_Gn_1_19}

state_after:
  - id: AFTER_S_day4_committed_clean
    en: >
      WORLD: meorot (receipt-level plural, fiat-result 1:15) + maor_gadol,
      maor_qaton, kokhavim (the delivered, differentiated inventory, 1:16) +
      raqia, shamayim, aretz (presupposed, flagged). The machine keeps BOTH
      the generic receipt entity and the delivered three because the text
      does (1:15 receipt vs 1:16 delivery). REGISTRY: maor_gadol ->
      memshelet_yom, maor_qaton -> memshelet_lailah — 2 ROLE writes, 0
      naming writes: the first build day with no va-yiqra (the naming series
      ended day 3 — recorded [OPEN]). TESTS: PASS(tov, meorot). LEDGER: day
      4 committed, ordinal revi'i, clean. FLAGS: read_before_install x3
      (raqia, shamayim, aretz) + the witness-tier presupposed read of
      or_ha_ganuz at the install (WITNESS_READ, rev 2), spec_delta x4
      (gedolim->
      gadol/qaton; stars over-delivered; dominion unspecified; spec-label
      vs recap-entity — renumbered rev 2, the machine always counted
      four) — none blocking. UTTERANCES (local census): [6] — va-yomer of
      1:14, the sixth ma'amar (rev 2). WITNESSED (aggadic tier, walled by
      assertion, rev 2): maor_qaton equal_then_diminished (provenance a
      recorded dispute, outcome converged), kapparah_chodesh
      standing_monthly (typed anchor Num 28:15), kokhavim
      retinue_of_maor_qaton.

