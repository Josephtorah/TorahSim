    he: "אָמְרָה יָרֵחַ לִפְנֵי הַקָּדוֹשׁ בָּרוּךְ הוּא: רִבּוֹנוֹ שֶׁל עוֹלָם, אֶפְשָׁר לִשְׁנֵי מְלָכִים שֶׁיִּשְׁתַּמְּשׁוּ בְּכֶתֶר אֶחָד? אָמַר לָהּ: לְכִי וּמַעֲטִי אֶת עַצְמֵךְ"
    he_translit: "amrah yareach lifnei HKB'H: ribbono shel olam, efshar li-shnei melakhim she-yishtamshu be-kheter echad? amar lah: lekhi u-ma'ati et atzmekh"
    en: >
      "The moon said before the Holy One: Master of the Universe, is it
      possible for two kings to serve with one crown? He said to her: go
      and diminish yourself." Created equal ('the two GREAT lights'); the
      compensations follow — rule day and night ('what use is a candle at
      noon?'), and 'let Israel COUNT the days and years with you,' with
      this unit's own 1:14 quoted back ('ve-hayu le-otot u-le-mo'adim…').
      The named owner of the unit's first spec delta, and a re-derivation
      of the calendar job through the diminution narrative.
    comment_en: >
      AMENDED 2026-07-30 at the day-4 triage (owner order 'do the day 4
      triage'; upgrade pre-announced in the frozen note): observation ->
