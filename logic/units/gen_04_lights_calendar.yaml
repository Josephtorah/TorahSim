    he: "בָּרְבִיעִי הָיוּ מִתְעַנִּין עַל הַתִּינוֹקוֹת שֶׁלֹּא תַעֲלֶה אַסְכָּרָה לְתוֹךְ פִּיהֶם. וַיֹּאמֶר אֱלֹהִים יְהִי מְאוֹרוֹת. מְאֹרֹת כָּתוּב"
    he_translit: "ba-revi'i hayu mit'anin al ha-tinokot she-lo ta'aleh askara le-tokh pihem; va-yomer Elohim yehi me'orot — ME'OROT KATUV"
    en: >
      "On the fourth day they would fast for the children, that askara
