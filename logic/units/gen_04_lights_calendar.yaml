  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_04_2026-08-08.md; manifest 10/10
    VERIFIED, zero FAILED). CROWNS (chain-attested + DB-verified).
    THE CURSE-SKELETON LUMINARIES [G04-01/02, Pesikta + Yerushalmi
    Taanit via Minchat Shai; Kitzur Baal HaTurim; the Ramah's
    census]: מארת ("luminaries," 1:14) is DOUBLY LEAN — no vav at
    all, the written skeleton of מארה ("curse"): the Pesikta reads
    "only the sun's orb was created to give light," the Yerushalmi
    hangs the Wednesday fast over the children's croup on it, and
    the Kitzur adds that the moon exists only so the sun would not
    be worshipped alone. The Ramah's census seals it: exactly TWO
    doubly-lean stations — יהי מארת ("let there be luminaries,"
    1:14) and את שני המארת ("the two luminaries," 1:16) — and the
    stream carries both, only these. THE LEAN SIGNS [G04-03, the
    Zohar's list via MS]: לאתת ("for signs," 1:14) lean in both
    slots, once in the Torah. THE HILLELI'S FULL FIRST VAV [G04-04,
    handwritten Masorah + the Hilleli codex + the Ramah via MS]:
    למאורת ("for luminaries," 1:15) full in the first vav, lean in
    the second — the reading of the 900-year-old Hilleli codex whose
    spelling list MS copied, matched in-stream. THE RAMAH'S
    LUMINARY-RULE VERIFIED WHOLE [G04-05/06/07]: "המאור ('the
    luminary') full, and every luminary-word in the Torah full —
    except ONE: שמן למאר ('oil for the light'), FIRST of the Terumah
    portion." SNAPSHOT: all seven article-stations full (the great
    and small lights of 1:16, the Tabernacle lamp-verses, the
    lamp-charge of Numbers), all four remaining למאור ("for the
    light") full, and the single lean למאר exactly at Exod 25:6 —
    the Ramah's own sign at his own address (the handwritten
    Masorah's "unique-and-lean" note on 1:16 loses to the Ramah and
    the precise books, and the stream sides with them). THE DIVIDED
    DIVIDE-WORD [G04-08/09/10, Et Sofer + Meiri's Kiryat Sefer + the
    divided books via MS]: ולהבדיל ("and to divide," 1:18) — Et
    Sofer and the Meiri rule the vav carries a geiya (the small
    stress-stroke); other books point the lamed with the hataf
    half-vowel instead of the plain silent half-vowel. SNAPSHOT
    writes BOTH marks —
    geiya on the vav AND hataf under the lamed — a mixed station
    joining the two camps, the half-vowel law's LAMED again
    (split-attested station 5, the water-troughs mix), and the
    word's accent is the zaqef qatan (the small two-dot pause) MS
    names. READINGS (named-only): R. Yehuda Chayyuj's rule via MS on
    ולמועדים ("and for seasons") — every vav that begins a word with
    the u-vowel is read as if it were an aleph carrying that vowel,
    "as we have received the reading generation after generation."
derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      Day-4 unit (1:14-19): the fullest work-order shape in the week so far —
      SPEC with a job list (1:14-15) -> receipt -> BUILD (1:16) -> INSTALL
      (1:17) -> delivered-purpose recap (1:18a) -> TEST -> COMMIT. It is also
      the integration unit: the spec references every prior unit's outputs
      (raqia/shamayim of day 2, aretz of days 1/3, the yom/lailah labels of
      day 1) and takes over a function Elohim performed personally on day 1.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 6 verses via taamim_tree_parse.py rule set v3: status unique,
      pure_binary true. tree_ascii regenerated 2026-07-30 from DB tree_json.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-07-30): yehi Vqj3ms —
      QAL JUSSIVE SINGULAR — over me'orot Ncmpa PLURAL (number mismatch,
      machine-visible in the codes); ve-hayu C+Vqq3cp WEQATAL twice (1:14,
      1:15 — the THEN-chain form, TIR-029); le-havdil R+Vhc and le-ha'ir
      R+Vhc and ve-li-meshol C+R+Vqc — lamed + infinitive construct, the
      PURPOSE frame (TIR-030); va-ya'as Vqw3ms (asah, not bara); va-yiten
      Vqw3ms; FOUR object markers in 1:16 (To x4) plus To+Sp3mp (otam) in
      1:17 — the densest et-inventory since 1:1; revi'i Aomsa — the
      morphology itself tags the day label ORDINAL.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      SPEC: LET(exist lights, loc=raqia) + purpose(divide day/night) +
      THEN(jobs: signs, festivals, days+years) + THEN(be lights to shine on
      the earth) -> generic receipt (1:15, crossing a verse boundary and
      preceding the build narrative, as in 1:11). BUILD: asah delivers a
      DIFFERENTIATED inventory (great/small/stars) with an office each for
      the two lights (dominion of day / of night) — three letter-visible
      deltas against the spec. INSTALL: natan mounts them in the day-2
      registry entity. RECAP restates the delegated separation at ENTITY
      level (or/choshekh) where the spec spoke at LABEL level (yom/lailah).
      TEST passes without an et-object. COMMIT ordinal, clean.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines + WORLD/REGISTRY writes + day-ledger row; ONE Hoare
      TRIPLE carries the acceptance contract of the spec; ASSIGN introduced
      for the dative role bindings (le-memshelet) — REGISTRY write of an
      OFFICE, deliberately distinct from NAME (no va-yiqra in this unit);
      interpreter vocabulary to be extended at verification (day-3
      NOTE_SPEC_DELTA precedent).
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en; register values keep
      Hebrew where the text supplies them (memshelet, revi'i). Compound
      machine identifiers use underscores for clause-checkability.
    confidence: established
  - step: G
    name_en: "Oral (named only) + Tier-A translation check"
    comment: >
      Verified from local Data: JT Rosh Hashanah 2:8:4 (R. Simon on OUR
      ve-hayu — festivals by BOTH luminaries; read in triage batch 5, row
      90); Bavli Chagigah 12a:6 (the MEASURES of day and night created day
