  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_42_2026-08-08.md; manifest verified
    16/16, zero FAILED). CROWNS (chain-attested + DB-verified).
    THE ONE LEAN ENOCH [G42-01/02, Minchat Shai on 25:4]: וחנך
    ("and Hanoch," the Midianite grandson of Keturah) — UNIQUE and
    DEFECTIVE (no vav) while the name runs PLENE at every other
    bearer (builder-asserted): Cain's city-son (4:17), the
    walked-with-God patriarch (Gen 5, six tokens), Reuben's
    firstborn (46:9, Exod 6:14, Num 26:5) — twelve full Enochs,
    one lean Midianite. THE LEAN GIFTS [G42-03, Minchat Shai on
    25:6; Sanhedrin, perek Chelek]: מתנת ("Abraham gave GIFTS to
    the concubines' sons") — defective, and the Talmud's derash
    rides the lean word (a name of impurity handed east); the form
    stands exactly TWICE in the Torah — here and at the priestly
    forehead-plate atoning for "the GIFTS of their holy things"
    (Exod 28:38): the concubines' gifts and the sanctuary's, one
    lean written form. THE CONCUBINES-WORD ARBITRATED [G42-04,
    Minchat Shai on 25:6]: הפילגשים ("the sons of THE
    CONCUBINES") — Bereshit Rabbah 61 and Rashi build the
    one-concubine reading (Hagar is Keturah) on a defective
    written form; the Chizkuni protests "plene in all the precise
    books," and SNAPSHOT agrees: the yod STANDS — the codex line
    arbitrates for the precise books, the one-concubine reading
    survives named-only, off the letter. THE NAMES-LIST RULES
    [G42-05/06/07, Minchat Shai on 25:13, the Ramah + the Vaera
    Masorah]: בשמתם ("by their NAMES") defective per the
    whole-Torah rule (the printed Masorah's too-small three
    overruled); לתולדתם ("by their GENERATIONS") first vav full,
    second lean, as all precise books rule — and the rule's only
    exceptions censused whole: the doubly-defective לתלדתם stands
    exactly twice, both in Vaera's Levi genealogy (Exod 6:16,
    6:19), precisely the Masorah's sign-verses. THE ISHMAEL
    PRINCE-LIST MINUTIAE [G42-08/09/10/11, Minchat Shai on
    25:13-15]: נבית ("Nevayot, the firstborn") under zaqef qatan
    (the small upright accent) as the precise books rule, וקדר
    ("and Qedar") carrying the lengthener-class stroke, both
    matching the Chronicles mirror-list (I Chr 1:29; edge);
    ודומה ("and Dumah") with final heh and full vav against the
    printed emendation; חדד ("Chadad") with TWO dalets, unique in
    the Torah (Chronicles pair I Chr 1:30; edge) — the precise
    books' double-dalet against the Targum (the Aramaic rendering) tradition that read a sharpened blade. THE GRAMMARIANS OVERRULED AT DEDAN [G42-12,
    Minchat Shai on 25:3]: the verse writes דדן twice — first
    with the dalet DAGESHED, then ובני דדן ("and the sons of
    Dedan") with the dalet SOFT after the vowel: all the books
    and the Radak's Michlol against the grammarians' doubling
    rule, and SNAPSHOT is soft exactly at the disputed site. THE
    KETURAH GRANDSON SPELLING TRIO [G42-13/14/15, Minchat Shai
    on 25:3]: אשורם ("Asshurim") vav full, NO yod, as ruled;
    ולאמים ("and Leummim") no vav, yod STANDING, the ruling that
    rejected the printed variant — but DISCREPANCY on the middle
    brother: ולטושים ("and Letushim") — the precise books rule it
    lean of yod like Asshurim; SNAPSHOT writes the yod PLENE: the
    codex line splits from the ruling on one of three names (the
    flanking two match). Watchlist, the counted-law-vs-codex
    class. THE HITTITE WITHOUT THE WHEEL [G42-16, Minchat Shai on
    25:9]: החתי ("Ephron THE HITTITE," at Abraham's burial by his
    two sons) — the precise Sephardic books deny the galgal (the
    wheel-accent) on the heh; SNAPSHOT stands with them (plain
    lengthener-stroke, no wheel) — the galgal layer itself
    remains uninstrumented (standing gap). READINGS (named-only,
    unclaimed): the Kitzur's juxtaposition at the seam — "before
    all his brothers he FELL" (25:18) handing directly to "and
    these are the generations of Isaac" (25:19): when Ishmael
    falls at the end of days, the son of David sprouts from
    Isaac's line; Bereshit Rabbah 61's well-woman reading behind
    the one-concubine claim (Hagar who sat by the well of the
    Living One).
