meta:
  id: gen_53_flight_over_the_river
  title_en: "The return-command and the flight over the river (31:1-21)"
  title_he: שׁוּב אֶל־אֶרֶץ אֲבוֹתֶיךָ
  title_he_translit: shuv el-eretz avotekha
  title_he_en: "'Return to the land of your fathers'"
  book_he: בְּרֵאשִׁית
  book_he_translit: Be-reshit
  book_en: Genesis
  refs: 31:1-21
  unit_span_planned: 31:1-21
  data_paths_he:
  - Data/Gen.xml
  status: frozen
  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #7 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    31:1-21, from the sons' complaint to the crossed river. 21 verses · 287
    tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C. Conventions:
    step he: = plain (no accents/meteg; maqqef ־ per snapshot); tree halves
    = accents kept, slashes stripped; split at etnachta — EXCEPT 31:9 (NO
    etnachta; 7 tokens): split at the earliest strongest disjunctive before
    the final word, the tifcha at idx4 (rank 2; gen_03 1:13 / gen_50 29:22
    precedent). Onkelos BUFFER PENDING.

    UNIT SHAPE — TWO pushes, ZERO pops: the unit ends mid-flight. YHWH's
    live command (31:3, shuv — RETURN, with ve-ehye imakh attached) and the
    wives' joint demand (31:16, ase — "all that Elohim said to you, DO")
    both stand OPEN at the wall: the doing begins at 31:17 (va-yaqam — the
    retold qum performed verbatim) and runs through the river-crossing, but
    the demand-content binds to ALL of what Elohim said, and the return
    itself completes only at 35:27 (arrival at Isaac) — under the corpus's
    letter-precision law (gen_50 object, gen_51 number, now the
    ALL-quantifier) neither card clears while the return is underway. Ends
    SPECS depth 2 OPEN — the THIRD consecutive depth-2 wall (gen_51,
    gen_52, gen_53). The 31:12-13 imperatives (sa, u-ree, qum, tze,
    ve-shuv) sit inside Jacob's DREAM-RETELL to the wives: RETELLING FENCE
    (gen_41's law — every volitive inside a retell is content-fact of
    reported speech, no push). REGISTRY 0. TESTS 0 (zero tov-tokens,
    DB-checked).

    CROWN CARE — THE REGISTRY READ-BACK (31:13): anokhi ha-El BET-EL — God
    self-identifies by the label gen_48 wrote (name(ha_maqom_luz) :=
    beit_el, 28:19): the strongest NAME-write read-back in the corpus — the
    named-One reads the ledger's own entry back to its writer (frozen
    ledger untouched; landing-note only). In the same verse the
    ANOINT-verb's first Torah token (mashachta, 4886 tok1/29) names the
    28:18 oil-pour retroactively — the anointing institution's verb debuts
    in a divine retell of gen_48's pillar — and both vow-words point at
    their own gen_48 debuts (nadar tok2/15, neder tok2/34; careers → the
    vow-law corpus, Lev 27 / Num 6, 30 / Deut 23).

    CARE-POINTS (filed before derivation; every ordinal DB-verified):
    (1) 31:1 kavod 3519 tok1/24 DEBUT — THE GLORY-WORD IS BORN as the
    sons' word for Jacob's wealth ("all this kavod"); tok2 = 45:13
    (Joseph's "my glory in Egypt"), toks 4+ = the GLORY OF YHWH (Exod
    16:7,10; 24:16,17). laqach 3947 tok91/393 ("Jacob TOOK all") — the
    take-career's accusation token; toks 92-94 = the pursuit's takes.
    (2) 31:2,5 temol 8543 + shilshom 8032 toks 1-2 BOTH in-span (each) —
    the yesterday-and-before idiom debuts ×2 on Laban's changed face; its
    career becomes law's recidivism clock: Pharaoh's bricks (Exod 5:7,8,
    14), the goring ox (Exod 21:29,36), the manslayer (Deut 4:42,
    19:4,6). Face-walk: pene lavan (31:2) → pene avikhen (31:5) → panav
    har ha-gilad (31:21) — the unit runs changed-face to set-face.
    (3) 31:3 THE PUSH: shuv (7725 tok35/180, HVqv2ms) — the
    return-imperative; 12:1's LEKH-LEKHA INVERTED: moledet 4138 tok5/13
    — tok2 = 12:1 "from your moledet"; the go-word's destination-language
    returns as a come-back command. ve-ehye imakh — the with-you promise
    (26:3 ehyeh imkha class; and see care 5). tok39 = 32:10: Jacob
    re-quotes the command to God with the object SHIFTED (31:3 el-eretz
    AVOTEKHA, your fathers' land → 32:10 le-ARTZEKHA, your land — a
    letter-delta filed for the 32:10 unit). PUSH LET(shuv_eretz_avot
    (yaaqov)).
    (4) 31:4 va-yishlach yaaqov (7971 tok31/201) — gen_52's watch LANDS:
    the demander of shalcheni does his own sending — he sends FOR Rachel
    and Leah, to the field (private space; the flock as cover).
    (5) 31:5 THE CONDITION DECLARED TRUE: ve-lohe avi haya IMADI (5978
    tok9/19) — the gen_48 HANDLER's first if-clause word (28:20 im yihye
    Elohim IMADI = tok6) asserted as past FACT in Jacob's mouth; tok12 =
    35:3 ("the God who was imadi on the way") — the vow-condition's
    truth-walk; tok1 = 3:12 ("the woman You gave imadi").
    (6) 31:6 koach 3581 tok2/14 — tok1 = 4:12, the GROUND's strength
    denied Cain; tok2 = "with ALL MY STRENGTH I served your father";
    tok12 = Deut 8:17, "my strength made me this wealth" — the boast the
    law warns against. serve 5647 tok21/113.
    (7) 31:7 hetel (2048 tok1/2 DEBUT) — the MOCK-verb: its only other
    token is Exod 8:25, Moses to Pharaoh "let not Pharaoh MOCK by not
    SENDING the people" — mock+send pair again. ve-hechelif (2498 tok1/5
    DEBUT) — the CHANGE-verb born on wages; tok2 = 31:41 (the repeat),
    tok3 = 35:2 "CHANGE your garments" (the Bethel-return purge), tok4 =
    41:14 (Joseph's prison-clothes). maskurti (4909 tok2/3) — gen_50's
    watch LANDS ("changed my wages"); tok3 = 31:41. aseret monim (4489
    tok1/2; tok2 = 31:41). ve-lo netano Elohim le-hara imadi (5414
    tok83/647; 5978 tok10) — give-as-permit: God did NOT give him the
    harm.
    (8) 31:8 THE WAGE-FLIP RULE: sekharekha 7939 toks 6-7/12 — the
    wage-noun's LAST Genesis tokens, both in one verse, closing the
    career opened at 15:1; naqod toks 6-7/9, aqod toks 4-5/7 — the deal's
    adjectives in Jacob's law-report of the flips.
    (9) 31:9 (NO etnachta; tifcha idx4 split): va-yatzel (5337 tok1/25
    DEBUT) — THE RESCUE-VERB IS BORN: God rescues the livestock; tok2 =
    31:16 (the wives' echo), tok3 = 32:12 "RESCUE ME from the hand of my
    brother" (Jacob's prayer), toks 5-6 = Reuben rescuing Joseph
    (37:21,22), tok8 = Exod 3:8 — "I have come down TO RESCUE" — flocks →
    Jacob → Joseph → Israel. give tok84 (va-yiten li).
    (10) 31:10-12 THE DREAM AND THE CHANGED ADJECTIVE: chalom 2472 toks
    3-4/37 (NOUN — toks 1-2 = AVIMELEKH's warning-dream 20:3,6; tok5 =
    31:24, LABAN's warning-dream: Jacob's one dream is bracketed by
    outsider-warning dreams). atudim 6260 toks 1-2/16 DEBUT (career =
    Num 7's tribal offerings ×13 + Deut 32:14). u-verudim (1261 toks
    1-2/2) — the dream's THIRD ADJECTIVE is a whole-career pair — and it
    REPLACES the deal's telu'im/chum: deal (30:32) = naqod+talu+chum;
    dream (31:10,12) = aqod+naqod+BARUD — the retell swaps an adjective,
    machine-visible against gen_52's frozen wage-clause (ledger
    untouched; token-fact). yachem tok5/6 (gen_52 watch lands).
    (11) 31:11 hineni (2009+Sp1cs, tok69/213) — the suffixed here-I-am:
    the form's FIRST suffixed token is GOD'S OWN (6:17, "I, behold-Me,
    am bringing the flood"); its prior HUMAN answer-tokens are the
    AKEDAH's three (22:1,7,11) and the deception's two openers
    (27:1,18); its next are Joseph's (37:13,
    sent to his brothers), Jacob's at Beer-sheva (46:2), and MOSES at
    the bush (Exod 3:4). malakh 4397 tok13/39 (tok8 = 22:11 the Akedah
    caller; toks 14-16 = 32:2-7 — angel-camps then Jacob's human
    messengers: the word slides angel→messenger at the wall).
    (12) 31:12-13 RETELLING FENCE (gen_41's law): sa / u-ree / qum /
    tze / ve-shuv are dream-quoted imperatives inside Jacob's report —
    content-facts, NO pushes (the live command was 31:3; the retell is
    Jacob's evidence to the wives). shuv tok36 = the retold twin of
    tok35. See CROWN CARE for 31:13's registry read-back, mashachta
    debut, matzevah tok3/16 (28:18,22 → here → the heap 31:45-52 →
    35:14,20 → the LAW BANS the pillar: Exod 23:24, Lev 26:1, Deut
    16:22 — installed at Bethel, read back here, outlawed at Sinai).
    (13) 31:14 THE SISTERS ANSWER AS ONE: va-taan rachel VE-LEAH
    va-tomarna — the rivals of gen_51 speak jointly. cheleq 2506a
    tok3/15 (toks 1-2 = 14:24, Abram's men's portion; career → the
    priestly no-portion law, Num 18:20, Deut 18:1,8). nachalah 5159
    tok1/74 DEBUT — THE INHERITANCE-WORD IS BORN in the disinherited
    daughters' question ("is there yet for us a portion and
    INHERITANCE"); its 74-token career is the land-inheritance corpus
    (Exod 15:17; Num 16-36; Deut).
    (14) 31:15 nokhriot (5237 tok1/9 DEBUT) — the FOREIGN-adjective born
    on Laban's daughters; tok2 = Exod 2:22 (Gershom, "sojourner in a
    FOREIGN land"). nechshavnu (2803 tok2/31) — THE RECKON-VERB: tok1 =
    15:6 "he RECKONED it to him as righteousness" — with gen_52's
    tzedaqah (6666 tok3 at 30:33), BOTH nouns of 15:6 land in
    consecutive units; tok3 = 38:15 (Tamar reckoned a harlot), toks 4-5
    = 50:20 ("you reckoned evil; God reckoned it good"). mekharanu
    (4376 tok3/39) — the SELL-verb: toks 1-2 = the BIRTHRIGHT sale
    (25:31,33); tok3 = "he SOLD US"; toks 4-6 = selling JOSEPH
    (37:27,28,36). va-yokhal gam akhol — the eat-verb doubled
    (infinitive absolute): he DEVOURED our silver.
    (15) 31:16 THE SECOND PUSH: kol asher amar Elohim elekha ASE — the
    wives convert God's word into their own imperative: a COMPOUND
    speaker, rachel_ve_leah — the corpus's first two-WOMEN compound
    (the first compound-speaker push of any kind is gen_41's
    lavan_betuel, 24:50-51). ha-osher (6239
    tok1/1) — the WEALTH-noun's only Torah token, in the wives' audit.
    hitzil tok2/25. PUSH LET(ase_kol_asher_amar(yaaqov)).
    (16) 31:17-18 THE DOING BEGINS — NO POP: va-yaqam (6965b tok35/145)
    — the retold qum performed verbatim; but ase binds to ALL that
    Elohim said, and shuv completes only at 35:27: both cards hold
    (letter-precision: gen_50 object, gen_51 number, here the
    ALL-quantifier). 31:18 = 12:5'S DEPARTURE FORMULA RE-RUN: rekhusho
    asher rakhash (7399 tok9/13 + 7408 toks 2-3/5) — 12:5's "rekhusham
    asher rakhashu" same relative clause, same destination (artzah
    kenaan, 12:5 ×2); rekhush tok8 = 15:14, "they shall exit with great
    REKHUSH" — the covenant's exit-promise word at Jacob's exit.
    va-yinhag (5090 tok1/7 DEBUT) — the DRIVE-verb born; tok2 = 31:26
    (Laban's "you DROVE my daughters like captives" — the same verb
    weaponized in the accusation), tok3 = Exod 3:1 (Moses drives the
    flock to Horeb), tok5 = Exod 14:25 (Egypt's chariots). la-vo
    el-yitzchaq aviv — DIRECTION, not arrival.
    (17) 31:19 ve-lavan halakh LI-GZOZ (1494 tok1/4 DEBUT) — the
    SHEAR-verb born as the flight's cover-occasion; toks 2-3 = 38:12,13
    (Judah's shearing, Tamar's occasion), tok4 = Deut 15:19 (the
    firstling no-shear law). va-tignov rachel (1589 tok2/21) — gen_52's
    armed storm begins: the steal-verb born in Jacob's innocence-clause
    (30:33) performs first in RACHEL's hands. ha-terafim (8655 tok1/3)
    — the household-gods word's whole Torah career is this story
    (31:19,34,35).
    (18) 31:20 va-yignov yaaqov et-LEV lavan (1589 tok3; 3820 tok9/67)
    — the heart-walk: tok8 = 27:41, Esau's murder-planning heart
    (gen_47's be-libo fence) → Jacob steals Laban's heart; tok10 = 34:3
    (Shechem's heart at Dinah). ha-arami (761 tok4/6) — the epithet's
    walk: intro-tokens 25:20 ×2, 28:5 → the heart-theft → 31:24 (God
    warns "Laban the Aramean") → Deut 26:5, ARAMI OVED AVI — the
    firstfruits credo's last Torah token (token-fact only; the credo's
    grammar is not adjudicated). ki voreach hu — barach tok4/14
    (participle).
    (19) 31:21 THE FLIGHT AND THE RIVER: va-yivrach (1272 tok5/14) —
    THE FLEE-VERB'S LANDING: tok3 = 27:43, the mother's berach-lekha —
    gen_47 froze LET(qum_berach_yashavta) OPEN because Jacob GOES but
    never FLEES in that span; the flee-verb now performs, four chapters
    and three unit-walls later (frozen ledger untouched; landing-note
    only); toks 6-7 = 31:22,27 (the pursuit hears it), toks 8-9 =
    35:1,7 — GOD NAMES THE FLIGHT in the Bethel-return command
    ("be-varchakha — when you fled"); tok10 = Exod 2:15, MOSES flees.
    va-yaqam tok36 — qum performed twice in-span (31:17, 31:21).
    va-yaavor et-HA-NAHAR (5104 tok8/18) — the RIVER: toks 1-4 = EDEN's
    river system (2:10-14), toks 5-7 = 15:18 ×3 — the covenant's
    river-to-river border — and now the first narrated crossing of
    ha-nahar since the border was drawn. panav har ha-gilad (1568
    tok1/22 DEBUT) — Gilead born as the flight's compass-point; toks
    2-3 = the pursuit (31:23,25); tok4 = 37:25 — the Ishmaelite caravan
    FROM GILEAD that buys Joseph. UNIT END: SPECS depth 2 OPEN
    (shuv_eretz_avot · ase_kol_asher_amar — both resolve at 35:27's
    arrival horizon; 35:1's qum aleh bet-el re-issues the motion).
    REGISTRY 0. TESTS 0. Divine-name walk: YHWH ×1 (31:3, the live
    command), Elohim ×6 (31:5,7,9,11,16 ×2 — the household's word for
    the rescuer), ha-El ×1 (31:13, the self-name by the registry
    label).

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_53_2026-08-08.md; manifest verified
    14/14, zero FAILED, zero manual rows — all-checkable). CROWNS
    (chain-attested + DB-verified). THE ONE FULL FATHERS [G53-07,
    Minchat Shai]: אבותיך ("RETURN to the land of YOUR FATHERS, and I
    will be with you," 31:3 — the command that turns the whole unit)
    is the Torah's ONE fathers-of-yours written full with both vav
    and yod; the other fifteen tokens all run vav-lean
    (builder-counted). The word is written whole exactly once — at
    the command to go back to it. THE ONE FULL AND-THEY-SAID [G53-11,
    Minchat Shai; the Masorah's none-like-it]: ותאמרנה ("and Rachel
    and Leah answered AND SAID to him," 31:14) — the Torah's ONE
    feminine group-speech written full with its closing he; its two
    bare sisters ותאמרן are the midwives before Pharaoh (Exod 1:19)
    and the well-daughters of Midian (Exod 2:19): three companies of
    women speak in the Torah, and only the wives consenting to the
    return speak the word written whole. THE GLORY WRITTEN LIKE THE
    LIVER [G53-03, Minchat Shai]: הכבד ("all this WEALTH," 31:1 —
    the riches Laban's sons begrudge) — the glory-word written LEAN,
    no vav, against the fullness of every other glory-word in the
    Torah whose kaf carries qamatz (the long a), and the lean skeleton is exactly the skeleton of
    הכבד THE LIVER: the other eleven tokens of these letters in the
    Torah are all the liver-lobe of the altar (Exodus and Leviticus,
    bet in tzere (the long e), builder-checked one by one). The begrudged wealth
    written one vav short, into the letters of the organ burned whole
    on the fire. YESTERDAY WHOLE AT THE SEEING, BARE AT THE TELLING
    [G53-04/05, Minchat Shai; Hilleli + the Ramah's lean-list]:
    כתמול שלשום ("as yesterday and the day before") — at 31:2, the
    narrator's verse (and Jacob SAW Laban's face), both time-words
    carry their vav; at 31:5, Jacob TELLING his wives, the identical
    idiom drops both vavs — exactly as the precise books rule. What
    Jacob saw was whole; what he could say of it had already thinned.
    THE PRONOUN AMONG THE GIVE-VERBS [G53-08, Kitzur Baal HaTurim]:
    ואתנה ("AND YOU know that with all my strength I served your
    father," 31:6) — the Torah writes these letters nine times, but
    eight are the verb "and I will give"; only here the feminine
    pronoun AND-YOU (the tagged form itself distinguishes them,
    builder-checked), and it is the pronoun the Masorah's three-list
    counts, its companions both in Ezekiel, named: the pasture-flock
    that is Israel (Ezek 34:31) and the hailstones (Ezek 13:11). THE
    DREAM-LIFT'S RULED MUSIC [G53-12]: ואשא עיני ("and I LIFTED MY
    EYES and saw in a dream," 31:10) — merkha (the Sephardic maarich)
    on the lift-verb's shin and TEVIR on the eyes-word's nun against
    the zaqef qatan (the small two-dot pause) camp, both exactly as ruled. THE MOCK AND THE
    CHANGE [G53-09/10]: התל ("your father has MOCKED me," 31:7) — the
    he in tzere (the long e) and the tav SOFT, its doubling dot
    resting unwritten, Minchat Shai dismissing the printer by the
    verse's own verb ("a deceived heart misled him"); והחלף ("and he
    CHANGED my wage ten counts") — the het in hataf segol (the
    compound half-vowel) and the word lean of its yod, with the
    Ramah. AS RULED [G53-01/02/13/14]: וישמע ("and he heard") under
    revia (the four-dot pause); את of "all this wealth" standing free
    of maqqef (the joining stroke) before the all-word; הגמלים ("the
    camels") gimel dageshed; רכשו ("his property") lean with the
    Ramah against the old scroll-manual's most-books full form.
    DISCREPANCIES: the one verse that crosses both counts [G53-06] —
    SNAPSHOT writes מתמול ("from yesterday") full four times, but the
    Ramah rules the token at Deut 4:42 LEAN (his fourth lean member),
    and the Hilleli's two-full count of שלשום ("the day before")
    likewise excludes Deut 4:42, where SNAPSHOT again writes full:
    one verse, the cities-of-refuge debut, carries BOTH its
    yesterday-words plene against both camps' rulings — a two-word
    counted-law variance concentrated on a single verse, filed with
    the eleven-vs-eighteen class. READINGS (named-only, unclaimed):
    the Kitzur's exile-reading of AND-YOU (Ezekiel's pasture-flock
    read on Israel; the hailstones read on Jacob's field-nights);
    Minchat Shai's note on 31:9 left unencoded rather than guessed
    (its sense could not be pinned to a letter-fact), flagged for a
    future pass.
