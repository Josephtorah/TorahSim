  - id: ORAL_e1_maamar
    status: verified
    work_en: "Ten utterances (asarah ma'amarot) — Mishnah Avot 5:1, enumerated at Bereshit Rabbah 17:1"
    he: "תְּנֵינַן בַּעֲשָׂרָה מַאֲמָרוֹת נִבְרָא הָעוֹלָם, וְאֵלּוּ הֵן: בְּרֵאשִׁית, וְרוּחַ אֱלֹהִים מְרַחֶפֶת, וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר…"
    he_translit: "teneinan ba-asarah ma'amarot nivra ha-olam, ve-elu hen: be-reshit, ve-ruach Elohim merachefet, va-yomer Elohim yehi or…"
    en: >
      "We learned: with TEN UTTERANCES the world was created, and these are they:
      'be-reshit' (1:1), 'and the spirit of God hovered' (1:2), 'and God said let
      there be light' (1:3) …" — the chain's own census of the account's speech-act
      operators. It counts e1 (Gen 1:1) as an utterance although va-yomer ("and He
      said") is absent there — grounded on Ps 33:6 ("by the word of the LORD the
      heavens were made") — and records dissent: Menachem bar Yosei removes the
      ruach utterance and substitutes Gen 2:18; R. Yaakov ben Kurshai retains it.
    comment_en: >
      Bears on this unit's e1, which models bara as EVENT with no speech operator:
      the chain holds e1 to be a maamar too (with a named minority view). Recorded
      as dual-track testimony; the operator itself is unchanged pending a derive
      pass. Verified from Data/sefaria_texts/ (BR 17:1, local). Triage ledger row 37.
      CORROBORATED (amendment pass 2026-07-30): Bavli Megillah 21b:10 and Rosh
      Hashanah 32a:19 state the same census (RH adds the architecture: ONE
      utterance created all matter, the other nine differentiated it — rows 52,
      65); ADRN B 36:2 preserves the dissent census, reaching ten va-yomer lines
      WITHOUT counting bereshit (row 93).
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_et_theme_marker
    status: verified
    work_en: "The et rule — Bereshit Rabbah 1:14, Bavli Chagigah 12a:20 (Nachum Ish Gam Zu via R. Akiva), Targum Onkelos Gen 1:1"
    he: "אִילּוּ נֶאֱמַר ״שָׁמַיִם וָאָרֶץ״, הָיִיתִי אוֹמֵר: ״שָׁמַיִם״ — שְׁמוֹ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא. עַכְשָׁיו שֶׁנֶּאֱמַר ״אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ״ — שָׁמַיִם מַמָּשׁ, אָרֶץ מַמָּשׁ"
    he_translit: "ilu ne'emar 'shamayim va-aretz', hayiti omer: shamayim — shemo shel HKB'H; akhshav she-ne'emar 'ET ha-shamayim VE-ET ha-aretz' — shamayim mamash, aretz mamash"
    en: >
      "Had it said 'shamayim va-aretz' (heavens and earth), I would have said
      shamayim is the NAME of the Holy One; now that it says ET ha-shamayim
      ve-ET ha-aretz — actual heavens, actual earth" (Chagigah 12a:20): et
      disambiguates Agent-name from created OBJECT. Sister rule at BR 1:14:
      "akhin ve-rakin mi'utin, ETIN ve-gamin RIBUYIN" — akh/rak exclude, et/gam
      INCLUDE ("et ha-shamayim includes sun, moon, constellations; et ha-aretz
      includes trees, grasses, Gan Eden"). And the Targum rules in the grammar
      itself: Onkelos renders et as YAT, the explicit Aramaic object marker
      ("be-kadmin bera YY YAT shemaya ve-YAT ar'a").
    comment_en: >
      Three independent chain witnesses for the TIR-014/015 reading of et as
      Theme marker / Theme-inventory on e1: hermeneutic rule (BR), agent/Theme
      disambiguation argument (Bavli), and translation grammar (Onkelos).
      Verified local. Triage rows 14, 43, 105. Amendment pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_echad_label_form
    status: verified
    work_en: "The cardinal echad — Bereshit Rabbah 3:9, Targum Onkelos Gen 1:5"
    he: "לֹא הָיָה צָרִיךְ לְמֵימַר אֶלָּא אֶחָד שְׁנַיִם שְׁלֹשָׁה, אוֹ רִאשׁוֹן שֵׁנִי וּשְׁלִישִׁי. שֶׁמָּא אֶחָד, שֵׁנִי, שְׁלִישִׁי, אֶתְמְהָא"
    he_translit: "lo hayah tzarikh le-meimar ela echad shenayim shelosha, o rishon sheni u-shlishi; shema echad, sheni, shlishi — etmeha?!"
    en: >
      "It should have said only echad, shenayim, shelosha (one, two, three) OR
      rishon, sheni, shlishi (first, second, third) — but ECHAD then SHENI?!"
      (BR 3:9) — the chain itself asks our LEDGER's mixed-series question, and
      answers by deferred repayment at the Mishkan's dedication ("va-yehi
      ha-makriv ba-yom ha-RISHON… first to creation"). Onkelos preserves the
      anomaly in translation: "yoma CHAD" (ONE day, cardinal kept) — and splits
      the yom polysemy: the registry label is rendered YEMAMA ("daytime") while
      the ledger unit stays yoma.
    comment_en: >
      Two chain witnesses on the label_form [OPEN] flag: the question named and
      answered (BR 3:9, with the same anomaly-repayment pattern as the alef/
      Sinai tradition, PDRK 12:24), and the authorized translation refusing to
      ordinalize while formally distinguishing REGISTRY label from LEDGER unit
      (Onkelos 1:5). The [OPEN] flag stays open — the chain marks the anomaly
      as deliberate, not resolved into an ordinal. Verified local. Triage rows
      29, 109, 130. Amendment pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_presupposed_resolutions
    status: verified
    work_en: "The presupposed materials — Bereshit Rabbah 1:9 vs Bavli Chagigah 12a:6"
    he: "צַיָּר גָּדוֹל הוּא אֱלֹהֵיכֶם, אֶלָּא שֶׁמָּצָא סַמְּמָנִים טוֹבִים — תֹּהוּ וָבֹהוּ וְחֹשֶׁךְ וְרוּחַ וּמַיִם וּתְהוֹמוֹת. אֲמַר לֵיהּ: כּוּלְּהוֹן כְּתִיב בָּהֶן בְּרִיאָה"
    he_translit: "tzayar gadol hu Eloheikhem, ela she-matza samemanim tovim — tohu va-vohu ve-choshekh ve-ruach u-mayim u-tehomot; amar leih: kulhon ketiv bahen beriah"
    en: >
      The philosopher to Rabban Gamliel: "a great painter is your God — but He
      FOUND good pigments: tohu, vohu, darkness, wind, water, deeps." Gamliel:
      "creation is written of ALL of them," answering item by item from later
      Scripture (darkness: Isa 45:7 yotzer or u-vore choshekh). The Bavli's
      parallel resolution (Chagigah 12a:6): TEN things were created on DAY ONE —
      heavens and earth, tohu and vohu, light AND DARKNESS, wind and water, the
      measure of day and the measure of night — each with its day-1 verse.
    comment_en: >
      The chain's twin resolutions of exactly our NOTE_PRESUPPOSED flag (the
      read-before-install list {tohu, vohu, choshekh, ruach, mayim, tehom}):
      BR answers from later Written verses (the same verses now in the echo
      register — Isa 45:7 edge); the Bavli declares them day-one creations
      outright. The unit's flag stands — the machine still observes reads
      before installs in the local text; the chain's answers are recorded as
      the resolution tradition. Verified local. Triage rows 9, 40. Amendment
      pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_theme_order
    status: verified
    work_en: "Theme order carries no temporal claim — Mekhilta DeRabbi Yishmael, Pischa 1:4"
    he: "שׁוֹמֵעַ אֲנִי, כָּל הַקּוֹדֵם בַּמִּקְרָא הוּא קוֹדֵם בַּמַּעֲשֶׂה; כְּשֶׁהוּא אוֹמֵר בְּיוֹם עֲשׂוֹת ה׳ אֱלֹהִים אֶרֶץ וְשָׁמָיִם, מַגִּיד שֶׁשְּׁנֵיהֶם שְׁקוּלִין זֶה בָזֶה"
    he_translit: "shome'a ani, kol ha-kodem ba-mikra hu kodem ba-ma'aseh; k'she-hu omer 'be-yom asot H' Elohim eretz ve-shamayim', magid she-SHNEIHEM SHEKULIN zeh ba-zeh"
    en: >
      "I might hear that whatever precedes in the VERSE precedes in the DEED;
      when it says (Gen 2:4) 'on the day the LORD God made EARTH AND HEAVENS'
      [reversed], it tells you the two are equal to one another." Tannaitic
      ruling: surface order in e1's Theme list carries no temporal claim.
    comment_en: >
      Grounds the unit's order-agnostic Theme list on e1. The amoraic machloket
      (Beit Shammai heavens-first / Beit Hillel earth-first — BR 1:15, Chagigah
      12a:16, JT Chagigah 2:1:17, VR 36:1) is recorded around this; VR 36:1
      generalizes the same move into a rule (a single order-inversion among
      fixed orderings teaches equivalence, across six word-pairs). Verified
      local. Triage rows 15, 42, 59, 83, 114, 127. Amendment pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_result_latency
    status: verified
    work_en: "Result is instantaneous-complete — Bereshit Rabbah 3:2"
    he: "לֹא בֶעָמָל לֹא בִיגִיעָה בָּרָא הַקָּדוֹשׁ בָּרוּךְ הוּא אֶת עוֹלָמוֹ, אֶלָּא בִּדְבַר ה׳ — וְהָיָה אוֹר אֵין כְּתִיב כָּאן אֶלָּא וַיְהִי אוֹר, כְּבָר הָיָה"
    he_translit: "lo ve-amal lo vi-ygi'ah bara HKB'H et olamo, ela bi-dvar H' — VE-HAYA or ein ketiv kan ela VA-YEHI or: kevar hayah"
    en: >
      "Not with toil nor labor did the Holy One create His world, but by the
      word of the LORD (Ps 33:6) — 've-haya or' (and light SHALL BE) is not
      written here, but VA-YEHI or (and light WAS): it already was."
    comment_en: >
      Chain-primary derivation from the wayyiqtol mood that the RESULT of the
      yehi-or command is latency-zero — complete on utterance; the same
      morphological contrast (va-yehi vs ve-haya) that TIR-026/029 encode,
      argued by the chain on this unit's own token. Sister to the cited BR 3:7
      seder-zemanim argument. Note Ps 33:6 as ground — the same verse behind
      ORAL_e1_maamar and in the echo-candidate frontier. Verified local.
      Triage row 22. Amendment pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_label_not_entity
    status: verified
    work_en: "The naming write binds label, not identity — Bereshit Rabbah 3:6"
    he: "וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם — לֹא הוּא אוֹר וְלֹא הוּא יוֹם, אֶתְמְהָא"
    he_translit: "va-yiqra Elohim la-or yom — lo hu or ve-lo hu yom, etmeha?!"
    en: >
      "'And God called the light day' — but the light is not [the same as] the
      day?! " — the chain opens by articulating that the naming write binds a
      LABEL to an entity without collapsing them; it continues with the
      primordial light serving neither day nor night, hidden (nignezah) for the
      righteous.
    comment_en: >
      Chain-primary articulation of this unit's REGISTRY semantics (TIR-022):
      va-yiqra installs label->entity bindings ({or: yom, choshekh: layla}),
      label distinct from entity. The Bavli runs the operational consistency
      test on the same verse (Megillah 20b:2-3 / Pesachim 2a:5: the 'advancing
      light' reading rejected by choshekh-symmetry — labels read literally);
      Onkelos splits the label lexically (yemama, see ORAL_echad_label_form).
      Verified local. Triage rows 26, 50, 51, 63. Amendment pass 2026-07-30.
    source: "[ORAL][VERIFIED-LOCAL]"
