  id: "gen_01_creation_boot"
  title_en: "Genesis boot: create world, light, separate, name, day one (1:1-5)"
  title_he: בְּרֵאשִׁית — אִתְחוּל הַבְּרִיאָה (יוֹם אֶחָד)
  title_he_translit: "bereshit — itchul ha-beri'ah (yom echad)"
  title_he_en: Bereshit — start of creation (one day)
  book_he: בְּרֵאשִׁית
  book_he_translit: Be-reshit
  book_en: Genesis
  refs: "1:1-5"
  data_paths_he:
