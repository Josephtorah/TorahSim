  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_01_2026-08-08.md; manifest 6/6
    VERIFIED, zero FAILED — all-checkable). CROWNS (chain-attested +
    DB-verified). THE FINALS OF TRUTH [G01-01, Kitzur Baal HaTurim]:
    the Torah's first three words — בראשית ברא אלהים ("In the
    beginning God created") — end in the letters of אמת ("truth"),
    DB-checked in order: the world created with truth sealed into the
    opening's own ends, as the psalm says "the head of Your word is
    truth." THE FIRST SPLIT OF THE TWO SCHOOLS [G01-03, Minchat
    Shai]: at the Torah's first command — יהי אור ("let there be
    LIGHT," 1:3) — the two masters of the Masorah part for the first
    time: Ben Asher reads the command unjoined with the galgal (the
    wheel-accent), Ben Naphtali joins it to the light with maqqef
    (the joining stroke) — Minchat Shai records this as the FIRST of
    all their differences. SNAPSHOT stands with BEN ASHER: no maqqef
    on the command (DB-checked), the reading the Rambam relied on —
    while the fulfillment ויהי־אור IS joined by maqqef
    (builder-checked): the command free, the fulfillment bound. The
    wheel itself is stored as a munach stroke — the galgal class's
    fourth station, at the most famous site it will ever have. THE
    GREAT BET'S VERIFIED COMPANIONS [G01-02]: the Torah's first
    letter — the famous LARGE bet of בראשית, the bet of
    Blessed-is-His-Name — belongs to the uninstrumented letter-size
    layer (its most famous member, filed with the head-of-line,
    head-of-page placement to the layout gap); but its two ruled
    companions stand in the stream exactly as given: the bet dageshed
    and the tipcha under the shin (DB-checked). THE FIVE LIGHTS OF
    THE FIRST DAY [G01-04, Kitzur]: the light-word אור stands exactly
    FIVE times in the light-section (1:3 twice, 1:4 twice, 1:5 once —
    builder-counted): five lights against the five books of the
    Torah, which is itself called light. THE COVENANT AT THE ENDS OF
    THE LIGHT-CLAUSE [G01-05, Kitzur]: the four words את האור כי טוב
    ("the light, that it was good," 1:4) end in the letters of ברית
    ("covenant"), DB-checked in order — the covenant sealed at the
    ends of the first thing called good; the flame-blessing teaching
    named beside it. THE HOVERING SPIRIT, ONCE [G01-06]: the pair
    ורוח אלהים ("and the SPIRIT OF GOD was hovering over the face of
    the waters," 1:2) stands exactly once in the Torah; the
    construct-pair Masorah's partner is the spirit that clothed
    ZECHARIAH (II Chr 24, named) — with Minchat Shai's own
    text-criticism preserved: the printed Baal HaTurim cites Amasai,
    and Minchat Shai proves the copy corrupt and restores Zechariah;
    the Kitzur's Messiah-count on the hovering, named. READINGS
    (named-only): the Rosh-HaShanah count and the
    Israel-accepts-the-Torah word-split on בראשית; the 613 summed at
    את האור; the yearly count of Sabbath-closing blessings on ויבדל ("and He divided"); and Minchat Shai's whole
    history of the two Masorah masters (the schools, the names, the
    Rambam's reliance), kept in his note on 1:3.
derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      Day-1 unit (1:1-5) chosen as Stage C pilot: smallest complete
      spec->build->verify->name->commit transaction in the corpus.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 5 verses via taamim_tree_parse.py rule set v3 (glue bricks): status unique,
      pure_binary true, leaf_complete true for every verse. tree_ascii recorded below.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Leaves = conjunctive-glued bricks closed by disjunctives; brick roles frame from
      OSHB verb morphology (#IMPOSED labeled aid, logic/lexicon v1 glosses EN-AID).
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      Candidate operators per leaf: DECLARE/LET (jussive), state-block (verse 2, zero
      wayyiqtol), PASS(tov) test, divide partition, registry naming, cycle commit.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines (deontic/event/temporal per TIR-026..033) + registry table +
      day-ledger row. Not a decision table (no casuistic ki-frames in this block).
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en; registers named in English
      with Hebrew value fields where the text supplies them (yom, layla, echad).
    confidence: established
  - step: G
    name_en: "Oral (named only)"
    comment: >
      BR 3:7 (seder zemanim on va-yehi erev) verified from local Data; day-1 light
      midrashim (or ha-ganuz) NOT verified locally -> observation tier only.
    confidence: tested
    tags: ["[ORAL]"]
  - step: H
    name_en: "Scenarios"
    comment: >
      Machine-state scenarios S1-S6 below: register deltas per verse + one negative
      scenario (commit-without-test) so the day-2 contrast is testable.
    confidence: tested
  - step: I
    name_en: "English leakage review"
    comment: >
      Operators derive from verb forms (jussive/wayyiqtol/participle/perfect), the
      et/bein/le particles, and tree arms — not from English glosses. LET? never
      silently upgraded (TIR-028 discipline).
    confidence: established
  - step: J
    name_en: "Freeze"
    comment: >
      status: frozen 2026-07-28. Changes require a new derive pass, not
      silent edits. Oral audit 2026-08-08 folded same day (run 7 block
      9, creation week begins): 6 VERIFIED, 0 FAILED, 0 UNCHECKABLE;
      headline: the finals of truth at the opening words, and the
      first Ben Asher / Ben Naphtali split at the light-command.
    confidence: established

boot_steps:
  - id: STEP_Gn_1_1
    order: 1
    ref: "Gen.1.1"
    op: EVENT_CREATE
    he: בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ
    he_translit: "be-reshit bara Elohim et ha-shamayim ve-et ha-aretz"
    en: "[EN-AID] In the beginning God created the heavens and the earth."
    tree_left:
      he: בראשית ברא אלהים
      he_translit: "be-reshit bara Elohim"
      en: "time-anchor + creation event (etnachta arm)"
    tree_right:
      he: את השמים ואת הארץ
      he_translit: "et ha-shamayim ve-et ha-aretz"
      en: "the complete Theme inventory (double et)"
    operators:
      - op: TIME_ANCHOR
        expr_en: "t0 := reshit (timeline origin from the be- prefix frame)"
        cites: ["TIR-022"]
        confidence: tested
      - op: EVENT
        expr_en: "create(e1) ∧ Agent(e1, Elohim) ∧ Theme(e1, shamayim) ∧ Theme(e1, aretz)"
        he: אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ
        he_translit: "et ha-shamayim ve-et ha-aretz"
        en: "perfect bara = completed narrative event; et X ve-et Y = full Theme list"
        cites: ["TIR-014", "TIR-015"]
        confidence: tested
      - op: REGISTRY_INSTALL
        expr_en: "WORLD += {shamayim, aretz} — installed by narration, NOT by naming formula"
        en: "these two labels are re-issued later (1:8, 1:10) — the registry collisions"
        cites: []
        confidence: tested
    comment: >
      Top split L=etnachta after Elohim: [event | inventory]. No directive operator:
      verse 1 is direct initialization, narrated not commanded.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_2
    order: 2
    ref: "Gen.1.2"
    op: STATE_BLOCK
    he: וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל־פְּנֵי הַמָּיִם
    he_translit: "ve-ha-aretz hayta tohu va-vohu ve-choshekh al-penei tehom ve-ruach Elohim merachefet al-penei ha-mayim"
    en: "[EN-AID] The earth was formless and void, darkness over the deep, God's spirit hovering over the waters."
    tree_left:
      he: והארץ היתה תהו ובהו וחשך על פני תהום
      he_translit: "ve-ha-aretz hayta tohu va-vohu ve-choshekh al-penei tehom"
      en: "state predicates: formless/void + darkness-over-deep"
    tree_right:
      he: ורוח אלהים מרחפת על פני המים
      he_translit: "ve-ruach Elohim merachefet al-penei ha-mayim"
      en: "standing condition: spirit hovering"
    operators:
      - op: PRECONDITION_STATE
        expr_en: "HOLDS(tohu(aretz) ∧ vohu(aretz), t0); HOLDS(over(choshekh, face(tehom)), t0)"
        en: "perfect hayta + verbless clauses = states, not actions"
        cites: []
        confidence: tested
      - op: INVARIANT
        expr_en: "INVARIANT(hover(ruach-Elohim, face(mayim))) during t0"
        he: מְרַחֶפֶת
        he_translit: merachefet
        en: "participle = ongoing condition"
        cites: ["TIR-031"]
        confidence: tested
      - op: NOTE_ZERO_EVENTS
        expr_en: "no wayyiqtol in the verse — this whole verse is {P}, the precondition block"
        cites: []
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "choshekh, tehom, mayim, ruach are READ without prior install (uninitialized entities)"
        en: "flag, not fix: the pre-existing-materials question belongs to interpretation"
        cites: []
        confidence: tested
    comment: >
      Precondition block for the first triple: {P} = 1:2 in full.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_3
    order: 3
    ref: "Gen.1.3"
    op: DECLARE_LET_RESULT
    he: וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַיְהִי־אוֹר
    he_translit: "va-yomer Elohim yehi or va-yehi or"
    en: "[EN-AID] God said: let there be light — and there was light."
    tree_left:
      he: ויאמר אלהים יהי אור
      he_translit: "va-yomer Elohim yehi or"
      en: "speech act wrapping the jussive directive"
    tree_right:
      he: ויהי אור
      he_translit: "va-yehi or"
      en: "the postcondition asserted"
    operators:
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(exists(or)))"
        he: יְהִי אוֹר
        he_translit: "yehi or"
        en: "jussive yehi = LET; the saying is the doing (performative)"
        cites: ["TIR-026"]
        confidence: tested
      - op: TRIPLE
        expr_en: "{ P: 1:2 state } yehi or { Q: exists(or) }"
        en: "spec and result share root+letters; mood alone (jussive vs wayyiqtol) splits demanded-Q from holds-Q"
        cites: ["TIR-026"]
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(exists(or), t1) — SPECS queue popped same verse (latency 0)"
        he: וַיְהִי־אוֹר
        he_translit: "va-yehi or"
        en: "wayyiqtol: narrative event; verbatim echo of the spec (only day with verbatim RESULT)"
        cites: []
        confidence: tested
    comment: >
      The minimal fiat: cleanest {P} op {Q} in the corpus.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_4
    order: 4
    ref: "Gen.1.4"
    op: TEST_AND_PARTITION
    he: וַיַּרְא אֱלֹהִים אֶת־הָאוֹר כִּי־טוֹב וַיַּבְדֵּל אֱלֹהִים בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ
    he_translit: "va-yar Elohim et-ha-or ki-tov va-yavdel Elohim bein ha-or u-vein ha-choshekh"
    en: "[EN-AID] God saw the light, that it was good; and God divided the light from the darkness."
    tree_left:
      he: וירא אלהים את האור כי טוב
      he_translit: "va-yar Elohim et-ha-or ki-tov"
      en: "inspection + acceptance test"
    tree_right:
      he: ויבדל אלהים בין האור ובין החשך
      he_translit: "va-yavdel Elohim bein ha-or u-vein ha-choshekh"
      en: "partition event on the between-pair"
    operators:
      - op: TEST
        expr_en: "PASS(tov, or) — inside see(e2, Agent Elohim, Theme or): epistemic wrap"
        he: כִּי־טוֹב
        he_translit: "ki-tov"
        en: "ki here = 'that' (complementizer under the etnachta arm), NOT casuistic IF — per-unit ki ruling (STANDING §3); tov = oracle predicate, undefined in-text"
        cites: ["TIR-014"]
        confidence: tested
      - op: EVENT_PARTITION
        expr_en: "divide(e3, Agent Elohim, between(or, choshekh)) ⇒ or ∩ choshekh = ∅"
        he: בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ
        he_translit: "bein ha-or u-vein ha-choshekh"
        en: "bein...u-vein = one two-place relation (set partition reading = hypothesis)"
        cites: []
        confidence: "event tested; partition reading hypothesis"
    comment: >
      Note: divide operates on choshekh — an entity never installed (see STEP_Gn_1_2 flag).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_5
    order: 5
    ref: "Gen.1.5"
    op: NAME_AND_COMMIT
    he: וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם וְלַחֹשֶׁךְ קָרָא לָיְלָה וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם אֶחָד
    he_translit: "va-yiqra Elohim la-or yom ve-la-choshekh qara layla va-yehi erev va-yehi voqer yom echad"
    en: "[EN-AID] God called the light Day and the darkness Night; evening, morning — day one."
    tree_left:
      he: ויקרא אלהים לאור יום ולחשך קרא לילה
      he_translit: "va-yiqra Elohim la-or yom ve-la-choshekh qara layla"
      en: "two registry writes via the naming formula"
    tree_right:
      he: ויהי ערב ויהי בקר יום אחד
      he_translit: "va-yehi erev va-yehi voqer yom echad"
      en: "cycle close + day ledger entry"
    operators:
      - op: NAME
        expr_en: "REGISTRY: name(or) := yom; name(choshekh) := layla"
        he: לָאוֹר יוֹם … וְלַחֹשֶׁךְ … לָיְלָה
        he_translit: "la-or yom … ve-la-choshekh … layla"
        en: "performative naming: le- prefix marks the receiver; bare word after = label; registry write, not a truth claim; choshekh (never installed) is legitimized by naming"
        cites: ["TIR-022"]
        confidence: tested
      - op: COMMIT
        expr_en: "cycle(erev -> boqer); LEDGER[day 1] := {spec ✓, test PASS, names 2}"
        he: יוֹם אֶחָד
        he_translit: "yom echad"
        en: "echad = CARDINAL 'one' (days 2-6 use ordinals) — marked form, flagged not resolved"
        cites: []
        confidence: "commit tested; cardinal significance [OPEN]"
    comment: >
      Day-1 transaction closes complete: P (1:2) -> fiat (1:3) -> test+partition (1:4)
      -> names+commit (1:5). This shape is the baseline the other days deviate from.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

state_machine:
  comment_en: "Day-1 transaction machine (registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 1:1 — all registers empty (Elohim presupposed constant)"
    - id: S_world_seeded
      en: "After 1:1 — WORLD={shamayim, aretz}, t0 set"
    - id: S_precondition_loaded
      en: "After 1:2 — state facts + hover INVARIANT loaded; zero events"
    - id: S_light_exists
      en: "After 1:3 — LET issued and satisfied; WORLD += or"
    - id: S_tested_partitioned
      en: "After 1:4 — TESTS: PASS(tov, or); or/choshekh partitioned"
    - id: S_day1_committed
      en: "After 1:5 — REGISTRY has yom/layla; LEDGER[1] closed"
  transitions:
    - {from: S_boot, to: S_world_seeded, via: STEP_Gn_1_1}
    - {from: S_world_seeded, to: S_precondition_loaded, via: STEP_Gn_1_2}
    - {from: S_precondition_loaded, to: S_light_exists, via: STEP_Gn_1_3}
    - {from: S_light_exists, to: S_tested_partitioned, via: STEP_Gn_1_4}
    - {from: S_tested_partitioned, to: S_day1_committed, via: STEP_Gn_1_5}

state_after:
  - id: AFTER_S_day1_committed
    en: >
      WORLD: shamayim, aretz, or (created) + choshekh, tehom, mayim, ruach (presupposed).
      REGISTRY: or->yom, choshekh->layla. TESTS: day-1 PASS. LEDGER: day 1 committed
      (cardinal). SPECS: empty.

exports:
  - id: EXPORT_day_cycle
    he: וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר
    he_translit: va-yehi-erev va-yehi-voqer
    en: day cycle = evening then morning (COMMIT formula; absent on day 7)
  - id: EXPORT_light_dark
    he: אוֹר / חֹשֶׁךְ
    he_translit: or / choshekh
    en: light and darkness as a partitioned pair with registry names yom/layla
  - id: EXPORT_create_by_speech
    he: וַיֹּאמֶר … וַיְהִי
    he_translit: va-yomer … va-yehi
    en: DECLARE+LET -> RESULT (the fiat cycle; TIR-026)
  - id: EXPORT_agent_elohim
    he: אֱלֹהִים
    he_translit: Elohim
    en: God as creating agent (presupposed constant of the machine)
  - id: EXPORT_precondition_block
    he: תֹהוּ וָבֹהוּ
    he_translit: tohu va-vohu
    en: verse 2 as reusable {P} pattern — a zero-event state block
  - id: EXPORT_day_ledger_pattern
    en: "spec -> build -> RESULT -> PASS(tov) -> name -> COMMIT: baseline for days 2-7 deviations"

oral_notes:
  - id: ORAL_seder_zemanim
    status: verified
    work_en: "Bereshit Rabbah 3:7 (on va-yehi erev, 1:5)"
    he: יהי ערב אין כתיב כאן אלא ויהי ערב — מכאן שהיה סדר זמנים קדם לכן
    he_translit: "yehi erev ein ketiv kan ela VA-yehi erev — mi-kan she-hayah seder zemanim qodem lakhen"
    en: >
      "'Let there be evening' is not written — rather 'AND there WAS evening': from here,
      an order of times existed beforehand." R. Yehuda b. Simon reads the wayyiqtol
      (not jussive!) of the commit formula — the same mood distinction TIR-026 encodes.
    comment_en: "Verified from Data/bereshit_rabbah_he.json. Dual-track; not merged into Written."
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_or_haganuz
    status: verified
    work_en: "Or ha-ganuz (hidden primordial light) — Bavli Chagigah 12a (R. Elazar)"
    he: אור שברא הקב"ה ביום ראשון אדם צופה בו מסוף העולם ועד סופו כיון שנסתכל הקב"ה בדור המבול ובדור הפלגה וראה שמעשיהם מקולקלים עמד וגנזו מהן
    he_translit: "or she-bara HKB'H be-yom rishon adam tzofeh bo mi-sof ha-olam ve-ad sofo; keivan she-nistakel be-dor ha-mabul u-ve-dor ha-flagah ve-ra'ah she-ma'aseihem mequlqalim, amad u-genazo mehen"
    en: >
      "The light the Holy One created on day one (or = light) — a person could
      see by it from one end of the world to the other; when He beheld the
      generation of the Flood and the generation of the Dispersion and saw
      their deeds corrupt, He arose and hid it (genazo) from them."
    comment_en: >
      AMENDED 2026-07-30: upgraded observation -> verified. The oral_links
      coverage review anchored Chagigah 12a to this span and the quote was
