    he_translit: "br'shyt br' 'lhym … 't hshmym v't h'rtz"
    en: "[EN-AID] From top split: LEFT «בראשית ברא אלהים» / RIGHT «את השמים ואת הארץ». Derive claim from Hebrew arms. Gen 1:1."
