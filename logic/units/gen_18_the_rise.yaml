    en: "2:7's gift-formula (nishmat chayim, 'breath of life') quoted at the drowning one word WIDER — nishmat-RUACH chayim ('breath of the SPIRIT of life'); NESHAMAH has exactly 3 Torah tokens (the gift, the drowning, the ban of Deut 20:16); quote-diff held at PROSE (2:7 frozen in a prior unit; no cross-unit machine spec) [OPEN: what the inserted ruach marks]; Onkelos preserves the compound word for word; and CHARAVAH ('dry land') is a two-token word shared with the sea's rescue-path (Exod 14:21)"
