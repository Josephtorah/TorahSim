state_after:
  - id: AFTER_S_prevailing
    en: >
      TIME: t0 EMPTY — decision: the letter gives DURATIONS (the
      forty of 7:17, the hundred-fifty of 7:24), not a calendar
      anchor; gen_17's date stands in its own unit; encoding a span
      as an epoch would misstate the letter. WORLD: ZERO installs
      (+3 presupposed: tevah, mayim, noach — the build, the waters,
      the boarder, all read from prior frozen state). Standing
      facts (10): the forty running, the great increase, the
      exceedingly-state, the totality clause (all the high
      mountains under ALL the heavens), the fifteen cubits in the
      blueprint's unit, the dying-list with humankind last, the
      COMPOUNDED breath-criterion (2:7 quoted one word wider —
      prose-held quote-diff), the dry-land death, the decree-scope
      quoted verbatim (6:7 word for word, humankind first), the
      hundred and fifty days. EVENTS (11): lift (the waters as
      agent — the bear-verb's token 2 carrying the rescue), rise
      (the rise-verb's Torah debut), prevail x2 (beats 1 and 4 of
      the born-here cluster, ringing two perfect-tense states),
      walk (the ark on the 1:2 hover-line), cover x2 (the
      cover-verb's debut, agentless, burying the corpus's first
      mountains), expire (the decree's verb receipted), wipe (NO
      agent — the letter's subject covert, ZERO divine names in
      the span), wiped (niphal agentless — the deed doubled from
      the undergoing side), and REMAIN — the remnant-root's FIRST
      Torah token, naming only Noach and the ark's company.
      REGISTRY: ZERO writes (fourth unit running). SPECS: EMPTY
      THROUGHOUT — nothing pushed, nothing popped: the corpus's
      first zero-traffic demand queue; the wipe this unit narrates
      answers gen_15's queue ACROSS UNIT WALLS (prose + [OPEN];
      the Stage E linker's test case). TESTS: EMPTY (no inspection
      formula in the letter; flags never block). LEDGER: EMPTY.
      FLAGS (3): read_before_install x3 (tevah, mayim, noach). NO
      spec-delta (the 2:7-compound held at prose level; decision
      recorded). The machine ends underwater: no clock, no
      verdict, no queue, no name on the page — eleven events, ten
      facts, three flags, one survivor.

exports:
  - id: EXPORT_the_waters_bear_the_ark
    he: וַיִּשְׂאוּ אֶת־הַתֵּבָה וַתָּרָם
    he_translit: "va-yisu et-ha-tevah va-taram"
    en: "the nasa bear-verb's token 2 (token 1: Cain's 'too great to BEAR', 4:13) fires ACTIVE and PLURAL with the judgment WATERS as agent — the flood carries the rescue; and the rum rise-verb's Torah DEBUT follows on the ark (career: Abram's raised hand, the staff over the Nile, Israel's high hand out of Egypt); Onkelos passivizes the rise ('it was raised') — dual-track"
  - id: EXPORT_the_ark_walks_the_hover_line
    he: וַתֵּלֶךְ הַתֵּבָה עַל־פְּנֵי הַמָּיִם
    he_translit: "va-telekh ha-tevah al-pnei ha-mayim"
    en: "the go-verb stem's token 2 (token 1: the serpent's belly-crawl sentence, 3:14) applied to a vessel, on a THREE-token Torah phrase — the spirit hovers on the face of the waters (1:2), the ark walks it (7:18), the calf-dust is scattered on it (Exod 32:20); the builder walked with God (6:9), his build walks the deep; Onkelos de-animates to a durative participle — dual-track"
  - id: EXPORT_prevail_born_as_flood
    he: וַיִּגְבְּרוּ הַמַּיִם … גָּבְרוּ … גָּבְרוּ … וַיִּגְבְּרוּ
    he_translit: "va-yigberu ha-mayim … gavru … gavru … va-yigberu"
    en: "GAVAR ('prevail/be strong') — 7 Torah tokens total, tokens 1-4 ALL in this span (7:18, 19, 20, 24): the strengthen-verb born as four beats of rising water, ringed and-then/perfect/perfect/and-then (two events framing two states); career: the father's blessings prevail (49:26), Israel and Amalek prevail by Moses' hands (Exod 17:11)"
  - id: EXPORT_mountains_debut_drowned
    he: וַיְכֻסּוּ כָּל־הֶהָרִים הַגְּבֹהִים אֲשֶׁר־תַּחַת כָּל־הַשָּׁמָיִם
    he_translit: "va-yekhusu kol-he-harim ha-gevohim asher-tachat kol-ha-shamayim"
    en: "HAR ('mountain') enters the corpus at 7:19-20 already under water (token 3: the ark RESTS on the mountains of Ararat, 8:4); GAVOHA ('high') debuts on the drowned peaks (3 Torah tokens); KASAH ('cover') debuts as two agentless passives burying them — and its next token covers a father's nakedness (9:23); AMAH ('cubit') token 5 measures the flood in the ark-blueprint's own unit (tokens 1-4: the spec; token 6: the ark of the covenant, Exod 25:10)"
  - id: EXPORT_three_death_orders
    he: בָּעוֹף וּבַבְּהֵמָה וּבַחַיָּה וּבְכָל־הַשֶּׁרֶץ … וְכֹל הָאָדָם / מֵאָדָם עַד־בְּהֵמָה עַד־רֶמֶשׂ וְעַד־עוֹף
    he_translit: "ba-of u-va-behemah u-va-chayah u-ve-khol-ha-sheretz … ve-khol ha-adam / me-adam ad-behemah ad-remes ve-ad-of"
    en: "the dying-list (7:21) runs bird-to-HUMANKIND-LAST (man isolated on the verse-end arm); the wipe-scope (7:23) quotes 6:7's decree VERBATIM with humankind FIRST; neither is creation's build order: the dying is told creation-wise, the wiping decree-wise — three orders held as letter fact, no harmonizing"
  - id: EXPORT_compounded_breath
