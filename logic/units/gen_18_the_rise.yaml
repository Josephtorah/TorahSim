      Benjamin-left-alone 42:38, what the plagues leave); AKH
      ('only') — the restriction particle rides the debut. 7:24
      the fourth prevail-beat; CHAMISHIM U-MEAT YOM ('fifty and a
      hundred days' — the letter counts small-first): the phrase
      occurs exactly TWICE in the Torah — here (the rise) and 8:3
