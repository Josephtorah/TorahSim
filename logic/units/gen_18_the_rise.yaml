    he_translit: "va-yishaer akh-Noach va-asher ito ba-tevah"
    en: "SHAAR ('be left / remain') — the REMNANT-ROOT's first Torah token (of 29), niphal agentless, born naming one man and a boat's company at the bottom of the flood, with AKH ('only') riding the debut; career: the war's survivors (14:10), Jacob's camp-that-is-left (32:9), Benjamin alone (42:38), what the plagues leave; the word remnant-theology stands on is minted at the corpus's emptiest moment"

