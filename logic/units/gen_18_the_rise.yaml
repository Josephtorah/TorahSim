derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      The rise (7:17-24): from the waters lifting the ark to the
      hundred and fifty days — 8:1 opens the remembering (Elohim
      remembers Noach; the wind; the recession), the next block.
      Inside: the forty running, the lift and the rise, the walk on
      the face of the waters, the four-beat prevail cluster, the
      mountains covered twice, the fifteen cubits, the dying-list,
      the compounded breath-criterion, the double wipe, the remnant
      — and the waters still prevailing at the close. The unit ends
      underwater: no closure, no clock, one survivor.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 8 verses from DB tree_json (rule set v3, unique, pure
      binary; ascii rendered 2026-08-01). Tree facts: 7:17 [the
      forty of the flood | the waters multiplied, LIFTED the ark,
      and it ROSE]; 7:18 [the waters prevail and multiply | the ark
      WALKS the face of the waters]; 7:19 [prevailed exceedingly
      exceedingly | all the high mountains under ALL the heavens
      covered]; 7:20 [fifteen cubits upward (etnachta arm carries
      the measure) | and the mountains were covered]; 7:21 [the
      dying-list: creeping flesh, bird, livestock, beast, swarmer |
      AND ALL HUMANKIND — man's death ALONE on the verse-end arm];
      7:22 [the compounded breath-criterion and the dry land | DIED
      — a single word on the verse-end]; 7:23 [the wipe active, the
      decree-scope, the wipe passive | AND ONLY NOACH WAS LEFT —
      the remnant clause alone on the verse-end arm]; 7:24 [the
      waters prevailed | a hundred and fifty days]. Three verse-end
      isolations in four verses: the letter keeps its heaviest
      words for the last position.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-08-01), all
      censuses run BEFORE drafting. 7:17 VA-YISU ('and they
      LIFTED') — the nasa bear-verb's TOKEN 2 of 168 in the Torah
      (token 1 = 4:13, Cain's 'my punishment is too great to
      BEAR'): ACTIVE, PLURAL, the waters as agent — the judgment
      water carries the rescue; VA-TARAM ('and it ROSE') — the rum
      rise-verb's FIRST TOKEN of 46 (career: Abram's raised-hand
      oath 14:22, the staff over the Nile Exod 7:20, Israel's high
      hand Exod 14:8). 7:18 VA-TELEKH ('and it WALKED') — the
      go-verb stem's token 2 (token 1 = 3:14, the serpent's
      belly-crawl sentence), applied to a VESSEL, AL-PNEI HA-MAYIM
      ('on the face of the waters') — a THREE-token Torah phrase:
      1:2 the spirit hovers there, 7:18 the ark walks there, Exod
      32:20 the calf-dust is scattered there. 7:18-24 GAVAR
      ('prevail/be strong') — 7 Torah tokens TOTAL, tokens 1-4 ALL
      IN-SPAN (7:18, 19, 20, 24): the strengthen-verb born as
      flood grammar (career: the father's blessings prevail 49:26;
      Israel and Amalek prevail Exod 17:11 x2); morphology splits
      the four — two narrative and-then forms (7:18, 7:24) framing
      two perfects (7:19, 7:20): two events bracketing two
      standing states. 7:19-20 HAR ('mountain') — FIRST TOKENS of
      150, both drowned (token 3 = 8:4, the ark RESTS on the
      mountains of Ararat); GAVOHA ('high') — 3 Torah tokens,
      token 1 here; KASAH ('cover') — first two tokens of 47, both
      agentless passives (pual — 'and they WERE COVERED'; token 3
      = 9:23, the sons covering their father's nakedness); AMAH
      ('cubit') TOKEN 5 — tokens 1-4 are the ark's blueprint
      (6:15 x3, 6:16), token 6 opens Exod 25:10, the ark of the
      covenant: the flood measured in the rescue's unit. 7:21
      VA-YIGVA ('and it EXPIRED') — gava token 2 (token 1 = 6:17,
      the decree's own verb receipted in the deed; career: the
      patriarchs' peaceful deaths, the Korach panic Num 17:27-28);
