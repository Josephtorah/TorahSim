    he: וְאִשְׁתָּאַר בְּרַם נֹחַ
    he_translit: "ve-ishtaar beram Noach"
    en: >
      The span's translation witness: the lift kept ACTIVE (the
      waters keep the deed) but the RISE PASSIVIZED (va-taram 'and
      it rose' -> ve-ittaramat 'and it WAS RAISED' — the ark's one
      self-verb handed to an unnamed lifter; flagged); the WALK
      de-animated (va-telekh 'and it walked' -> u-mehallekha 'and
      it was moving about', durative participle; flagged) while
      the face-of-the-waters echo SURVIVES (al apei mayya, 'on the face of the waters'); the
      buffer's 'high mountains' is the RUM-root adjective (turaya
      ramaya, 'the high mountains') — peaks and ark-lift tied by one root the Hebrew
      keeps separate; the prevail-cluster survives as one verb
      (tekifu, 'grew mighty', x4 — the doubled 'very' kept doubled); the
      expire-verb leveled to the plain die-verb (the 6:17
      decree-echo lost; flagged); the remes/sheretz crawl-words
      leveled to one root; the COMPOUNDED breath-formula preserved
      word for word (nishmeta rucha de-chayin, 'breath of the spirit of life' —
      the quote-diff is translation-stable); the two-token dry-land word leveled to
      the common one (be-yabbeshta, 'on the dry ground'; flagged); the wipe kept DOUBLE
      (u-mecha 'and He wiped' / ve-itmechiu 'and they were wiped'),
      the remnant kept in its own cognate (ve-ishtaar, 'and he
      was left'), the restriction kept (beram, 'only'); the 150
      reversed to big-first; and ZERO divine names inserted — the
      covert subject stays covert.
    comment_en: "Read from Data/sefaria_texts/ (local, gitignored; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

