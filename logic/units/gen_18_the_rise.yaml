state_machine:
  comment_en: "The rise (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 7:17 — all registers empty (standalone unit)"
    - id: S_risen
      en: "After 7:17 — the forty-fact holds; the waters LIFT the ark (bear-verb token 2, waters as agent) and it RISES (rise-verb debut); tevah/mayim flagged as read"
    - id: S_walking
      en: "After 7:18 — the prevail-verb debuts (beat 1 of 4); the increase-fact holds; the ark WALKS the face of the waters (the 1:2 hover-line)"
    - id: S_under
      en: "After 7:19-20 — the exceedingly-state and the totality clause hold; the mountains covered twice (cover-verb debut, agentless); the fifteen-cubit measure holds"
    - id: S_expired
      en: "After 7:21-22 — all flesh expired (decree-verb receipted); the dying-list with humankind last; the compounded breath-criterion and the dry-land death hold"
