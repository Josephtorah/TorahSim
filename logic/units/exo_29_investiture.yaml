          this-the-thing crown. THE COLLECTION: by a fit priest
          in service vessels — R. Akiva's anointed-priests
          analogy (Zevachim 13a:11-12). THE FINGER: bound to the
          PLACING by the parse-direction meta-rule — a verse is
          expounded on what precedes it, not before-the-before
          (Zevachim 24b:2-3), with the right-hand laterality
          default (24b:4). THE DOUBLED "IT": two written, one
          FREED — the freed-token operator's smallest exemplar
          (12b:14). AND THE FOODS (29:33-34): the priests eat
          and the OWNERS are atoned — the meal a stage of
          atonement (EX29-06 held the eaten-by-those-it-atoned
          clause); sleep never, eating as service-need;
          pouring-so-burning sanctity; the leftover's excision by
          kodesh-kodesh; the omer and jealousy offerings included
          against the atonement-word's pull (Pesachim 59b:3-4,
          Yoma 68b:19-20, Sukkah 49b:1, Zevachim 28b:5-6, 44b:6).
          Auto-seat law, F-105.
