o fed you manna in the wilderness which your fathers did not know, to humble you and test you, to do you good in your end — and you say in your heart, my power and the might of my hand have gotten me this wealth; remember the lord your god, for it is he who gives you power to get wealth, to establish his covenant which he swore to your fathers, as at this day; the testimony: and it shall be, if you surely forget the lord your god and go after other gods and serve them and bow down to them, i testify against you this day that you shall surely perish; like the nations the lord makes perish before you, so shall you perish, because you would not hearken to the voice of the lord your god.
