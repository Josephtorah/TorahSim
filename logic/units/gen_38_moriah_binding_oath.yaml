      letter did.
exports:
  - id: EXPORT_the_crown_fork
    he: קַח־נָא … וְהַעֲלֵהוּ … אַל־תִּשְׁלַח יָדְךָ … וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנוֹ
    he_translit: "qach-na … ve-haalehu … al-tishlach yadkha … va-yaalehu le-olah tachat beno"
    en: "THE CROWN FORK — OWNER-GRADE, STAGED BOTH WAYS, UNRESOLVED [flag 2]: the compound triple's FOURTH token is God's own (qach-na + ve-lekh-lekha + ve-haalehu — take/go/offer-him-up, one breath, one demand; the class's first divine token, with the third divine na); at 22:12 the roster's FIRST DIRECT COUNTERMAND lands (two LET-NOTs per frozen gen_35's 19:17 two-push shape — no cancel operator exists, the demand and its countermand COEXIST on the queue from there on); at 22:13 ALL THREE demanded roots return in the demand's own order as foreground deeds by the demandee — va-yelekh, va-yiqach, va-yaalehu (root and stem, same object-suffix) — ON A SUBSTITUTE marked by the letter's own word: TACHAT BENO. The base encoding fires NO RESULT (the demand names the son; no frozen precedent pops a switched object; the pop is one edit away); side A's case is laid out whole: the echo-receipt standard met three-for-three, the demanded verb RESERVED by the letter for exactly this verse (eleven deeds in 22:3-10 and never alah), God's own receipt-speech at 22:16 (yaan asher ASITA 'because you have DONE'), and the buffer's chalaf-weld (the ram CHALAF the son, the blessing CHALAF the deed). If side A is ratified, cycle #15 is its consequence — named, not claimed. Queue at close: FOUR OPEN FOREVER"
  - id: EXPORT_the_test_that_no_test_can_grade
    he: וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם … כִּי עַתָּה יָדַעְתִּי כִּי־יְרֵא אֱלֹהִים אַתָּה
    he_translit: "ve-ha-elohim nisah et-avraham … ki atah yadati ki-yere elohim atah"
    en: "THE MACHINE IRONY [flag 10]: nisa ('test') makes its Torah debut in the SECOND consecutive instrument-silent chapter (tov/shaah/tzaddiq/nichoach all x0) — the letter's own test-word arrives exactly where the TESTS register cannot be tempted, and the trial runs entirely on the SPECS queue instead; its verdict is not a machine PASS but a CONFERRED TITLE — yere elohim ('God-FEARING', the adjective's debut) landing frozen gen_36's 20:11 guess-line right side up — and its yield is knowledge ('NOW I know'), spoken in the divine first person through the angel (gen_32's slide-class); the test-verb's career runs to Marah, the manna, Massah, and Exod 20:20 — the same Sinai verse frozen gen_36 linked for the fear-noun: test and fear share a landing twice"
  - id: EXPORT_the_binding_lexicon
    he: וַיַּעֲקֹד … הַמַּאֲכֶלֶת … יְחִידְךָ … הִנֵּנִי … אַבְרָהָם אַבְרָהָם … יַחְדָּו
    he_translit: "va-yaaqod … ha-maakhelet … yechidkha … hineni … avraham avraham … yachdav"
    en: "THE TRIAL SPENDS ONCE-WORDS [census-exact]: AQAD ('bind') — the verb that names the event exists ONCE in the Torah; YACHID ('only one') — the whole 3-token lexeme is this trial; MAAKHELET ('knife') — both Torah tokens on this ascent, ending mid-reach; MORIAH and SEVAKH ('thicket') hapaxes; the love-verb (ahav) debuts in the command (token 2 = Isaac loving Rivqah); HINENI — the first HUMAN here-I-am, three times (God, son, angel); AVRAHAM AVRAHAM — the Torah's first doubled-name CALL (the class: 22:11 -> 46:2 -> Exod 3:4; hunt shown); the fire-ladder (covenant torch, Sodom's rain, the father's hand, the bush); YACHDAV born doubled in 13:6's separation, spent tripled on this walk; the where-ladder (Sarah, the men of Sodom, the lamb); lekh-lekha exactly TWICE in the Torah — the call and the test, both deferring their destination (areka / omar elekha); shelishi's first narrative third day; and the see-verb naming the mountain in two voices — YIREH / YERAEH on the verse's two rests"
  - id: EXPORT_the_oath_and_the_coda
    he: בִּי נִשְׁבַּעְתִּי נְאֻם־יְהוָה … בָרֵךְ אֲבָרֶכְךָ … וּבְתוּאֵל יָלַד אֶת־רִבְקָה
    he_translit: "bi nishbati neum-YHWH … varekh avarekhkha … u-vetuel yalad et-rivqah"
    en: "THE OATH AND THE BRIDE [flags 9, 12]: shava token 4 lands frozen gen_37's watch — the swear-verb's DIVINE turn (by Myself), one chapter after its human debut field, birthing NEUM ('oracle of YHWH' — the prophetic formula's Torah debut, seated on the etnachta); two infinitive-absolute doublings pay the trial in emphatic grammar (blessing-I-will-bless, multiplying-I-will-multiply — promise-facts, nothing demanded); the stars of 15:5 re-cited under oath with the sand-debut beside them; the bless-verb returns HITPAEL where 12:3 ran niphal — the two lekh-lekha commands wear two stems of one blessing; qol token 11 — the voice-ladder ends at God's own voice, credited to Abraham's ear (the idiom that indicted Adam, commanded Sarah's hearing, and heard the lad); the name-texture splits 5/5 (Elohim tests and provides, YHWH stays the knife and swears); and the coda — inside the tell-verb's first passive — counts Nachor's TWELVE (eight and four, flanking the bound son's promised twelve princes across the walls), spends TEN name-hapaxes, and rests an etnachta on RIVQAH: the next matriarch minted as news, eight verses after the knife"

