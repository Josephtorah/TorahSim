    CROWNS (chain-attested + DB-verified). THE TWO FATHER-ANSWERS
    [G38-04/05/06, Minchat Shai on 22:7]: of the Torah's 22 הנני
    ("here I am") tokens, exactly TWO carry the dageshed suffix-nun
    the Masorah counts — Abraham answering Isaac on the way to the
    binding ("here I am, MY SON," 22:7: first nun in segol — the short e-vowel — both nuns dotted, no maqqef) and Isaac answering Jacob at the
    blessing-deception ("here I am; who are you, my son," 27:18):
    the only two doubled here-I-ams in the Torah are a father
    answering "my son." THE ONE LEAN INHERITANCE [G38-07/08/09,
    Minchat Shai on 22:17, the Ramah's rule]: וירש ("and your seed
    shall INHERIT the gate of his enemies") — the Torah's ONE
    single-yod defective inherit-verb; the five plene twins
    censused whole: Sarah's exclusion ("shall NOT inherit with my
    son," 21:10), Rebecca's echo-blessing (24:60), the Amorite
    conquests (Num 21:24, 21:32), the locust-curse (Deut 28:42) —
    the Aqedah's inheritance-promise is the lean one. THE RAMAH'S
    ONE FULL OFFERING [G38-28/29, Minchat Shai on 22:6]: העלה
    ("the wood of the BURNT-OFFERING") defective per the
    whole-Torah rule — and the rule censused whole on SNAPSHOT:
    the Torah's ONE plene עולה is Num 28:27, the first-fruits-day
    offering in Pinchas, precisely the Ramah's own sign-verse: one
    full offering in the Torah, and it is the new grain's. THE
    THREE DOUBLED CALLS [G38-01/02/03, Minchat Shai on 22:11]:
    אברהם אברהם (the knife-stopping sky-call, 22:11), יעקב יעקב
    (the night-visions, 46:2), משה משה (the bush, Exod 3:4) — all
    three answered הנני ("here I am"); consonant-adjacency also
    surfaces the toledot-seam doubling ("the son of Abraham;
    Abraham fathered Isaac," 25:19) that the tradition's list of paseq strokes (the vertical divider) excludes — the
    stroke itself uninstrumented (gap). THE TWO RETURNS [G38-14,
    Kitzur Baal HaTurim on 22:5]: ונשובה ("and we will RETURN") —
    exactly twice in the Torah, LETTER-IDENTICAL tokens
    (builder-asserted): Abraham's worship-return from Moriah
    (22:5) against the spies' "let us appoint a head and RETURN
    to Egypt" (Num 14:4) — the same written word carries the
    ascent and the desertion; the Masorah's six-list adds the
    repentance verses (Hosea, Lamentations; edges) — "all in
    Abraham's merit." THE GATE SPLITS BY ONE WORD [G38-10/11,
    Minchat Shai on 22:17]: Abraham's seed inherits שער איביו
    ("the gate of his ENEMIES," 22:17); Rebecca's seed שער שנאיו
    ("the gate of his HATERS," 24:60) — the father's and the
    bride's blessings differ by exactly one word; the Masorah's
    mnemonic: "upon your enemies and upon your haters who pursued
    you" (Deut 30:7). THE TWO DAWN-SADDLERS [G38-12/13, Minchat
    Shai on 22:3]: Abraham's lads אתו ("WITH him," 22:3) against
    Balaam's lads עמו (the other with-word, Num 22:22) — the
    Masorah's own filing of the midrashic pair, verified at both
    legs. THE COVENANT IN THE FINALS [G38-18, Kitzur on 22:18]:
    עקב אשר שמעת בקלי ("because you have LISTENED to My voice" —
    the oath's closing four words) — final letters ב-ר-ת-י, the
    letters of ברית ("covenant"). UNIQUE WORDS [G38-15/16/17,
    Kitzur]: לשחט ("to SLAUGHTER his son," 22:10) — one Torah
