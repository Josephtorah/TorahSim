      TIME: t0 only — no RESULT, no t1 mark: the first unmarked clock
      since gen_34 (the trial ends with nothing paid on the machine's
      terms and everything paid on the letter's — flag 2). WORLD:
      THREE installs (yitzchaq; shnei_nearav; malakh_YHWH) + ONE
