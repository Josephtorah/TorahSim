      TESTS: ZERO — the second consecutive instrument-silent chapter,
      with the TEST-VERB ITSELF debuting into the emptiness (flag 10);
      zero triage contact. SPECS: FOUR pushed / ZERO popped / FOUR
      OPEN FOREVER: the compound triple qach_lekh_ve_haalehu (THE
      CROWN FORK — all three roots performed at 22:13 on the ram,
      tachat beno; the RESULT withheld in the base encoding, side A
      staged with cycle #15 as its consequence — flag 2), the
      stay-demand shevu (obeyed in no root — flag 5), and the two
