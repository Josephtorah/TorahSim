      appended from 24:1-5 onward; certified 2026-08-05) and frozen
      2026-08-05 after Claude structural review plus four pre-freeze
      directives. The unit id was approved as the draft name with the
      ratification flag left standing.
    confidence: reconstructed
  - step: D
    name_en: "Flagged-choice ledger (distilled)"
    comment: >
      Fifteen numbered ratify-or-reverse flags, all left open at
      freeze, including: the un-named servant installed by designation
      at his first address and first act (24:2), citing the frozen
      wilderness unit's device for the un-named lad; the oath-content
      boundary — "you shall not take" (imperfect verb with the plain
      negator), "you shall go," and "and you shall take" encoded as
      facts of the sworn terms and a then-duty, with bolder live
      readings staged open; "that I make you swear" ruled an oath-frame
