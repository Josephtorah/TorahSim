meta:
  id: gen_40_servant_oath_well
  title_en: The servant's oath and the well (24:1-33)
  title_he: שִׂים־נָא יָדְךָ תַּחַת יְרֵכִי
  title_he_translit: sim-na yadkha tachat yerekhi
  title_he_en: '''Place, please, your hand under my thigh'''
  book_he: בְּרֵאשִׁית
  book_he_translit: Be-reshit
  book_en: Genesis
  refs: 24:1-33
  data_paths_he:
  - Data/Gen.xml
  status: frozen
  draft_note_en: 'FROZEN 2026-08-05 by the interim coordinator after Claude structural review + four
    pre-freeze directives. DRAFT by the interim coordinator (certified 2026-08-05). Span: ONE UNIT Gen 24:1-33, PER-VERSE
    x33, seam at 24:33/24:34 on daber (''Speak!''). Evidence only from attached package files. PIECES:
    24:1-5 VERIFIED; 24:6-10 this append. FLAGGED CHOICES so far (ratify-or-reverse): (1) NAME CHOICE:
    gen_40_servant_oath_well (approved as draft id; ratification flag stands). Alts: gen_40_thigh_oath_well,
    gen_40_daber_cliffhanger. (2) ha_eved (''the servant'') INSTALLED AT 24:2 by designation — first address
    and first act — citing frozen gen_37 ha_naar (''the lad'') device (Excerpt C). Un-named throughout.
    (3) 24:2 sim-na (''PLACE, please'') is the ONLY SPECS push in this piece. Cycle candidate staged:
    pop expected at 24:9 va-yasem (''and he placed'') — label "cycle #17-or-#18, contingent on the crown
    ruling" (Excerpt D wording). Resolve nothing. (4) 24:3 lo tiqach (''you shall not take''): oath-content
    FACT SAFE — morph imperfect HVqi2ms, negator lo (''not'') not al (''do-not''). LET-NOT staged BOLD,
    flag OPEN. (5) 24:3 ve-ashbia-kha (''that I make you swear''): morph HC/Vhi1cs/Sp2ms (hiphil imperfect
    1cs + 2ms suffix) — NOT a volitive push. Encoded as oath-FRAME FACT. If main loop reclassifies as
    purpose-cohortative, same outcome per template gen_39 ve-eqbrah (''that I may bury''): "purpose-cohortative,
    fact." Frame''s push is sim alone. (6) 24:4 telekh (''you shall go'', imperfect) = fact of the oath''s
    terms. ve-laqachta (''and you shall take'', weqatal Vqp2ms) = THEN duty (live second-person address).
    Oath- content boundary flagged; all-facts alternative staged. (7) TESTS expected ZERO for whole unit
    (instrument sleep fourth chapter) — no instrument word in 24:1-5. (8) Onkelos: BUFFER PENDING (main
    loop) throughout. (9) verse_trees: OMITTED (main loop generates). (10) 24:6 hishamer…pen (''GUARD
    yourself, lest…'') = true guard-push LET(hishamer); pen-clause = content of the guard (fact of the
    avoided return), not a second push. (11) 24:7 nishba (''he swore'') past-oath citation = FACT. yishlach
    (''he will send'') morph HVqi3ms imperfect — NOT weqatal; encoded as promise-fact of divine agency.
    Coordinator said "weqatal handling" — flag VERIFY [flag 13]. ve-laqachta at 24:7 (Vqq2ms weqatal)
    = THEN duty restated (same take-duty field as 24:4), not a new SPECS push. (12) 24:8 if-clause = oath
    release condition, FACT. shevuah (''oath'' noun) debut; niqqah (''be free/clean'') debut. lo tashev
    residual: SAFE fact of residual terms; BOLD LET-NOT staged OPEN [flag 14]. (13) 24:9 POP of sim at
    va-yasem — cycle #17-or-#18 contingent on the crown ruling. va-yishava oath-perform EVENT beside.
    (14) 24:10 aram-naharayim DEBUT destination — install-on-arrival SAFE; read_before_install / pure-presupposition
    staged OPEN [flag 15]. ir nachor: nachor READ (known cast behind walls). NEXT BLOCK AUTHORIZED (owner
    2026-08-05): gen_41 = 24:34-67 after this unit freezes. DRAFT SPAN COMPLETE 24:1-33; freeze pending
    full self-review + gate.

    '
  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_40_2026-08-08.md; manifest verified
    19/19 checkable, zero FAILED, one builder-asserted manual row).
    CROWNS (chain-attested + DB-verified). THE MAIDEN WRITTEN AS
    THE LAD [G40-04/05/06, Minchat Shai qere notes on 24:14/16/28;
    the Zohar page named]: הנער — at Rebecca's debut ("let THE
    MAIDEN to whom I say...," 24:14), her beauty-verse (24:16), and
    her run home (24:28), the consonants are the BOY-skeleton (no
    final heh) carrying GIRL-vowels: written one sex, read the
    other. SNAPSHOT instruments the whole Torah rule structurally:
    the vowel-only feminine skeleton stands at EIGHT tokens
    (Rebecca's five in this chapter, Dinah's three in Gen 34,
    builder-asserted); the maiden-laws of Deut 22 pair an unpointed written-form token with its read-form; and in the WHOLE TORAH exactly
    ONE maiden is written out in full — Deut 22:19, where the
    slanderer must keep his bride ("she shall remain his wife"):
    the one place the letter writes her whole, proven by the DB's
    own single-token encoding there against pair-tokens everywhere
    else. THE FOUR LEAN DRINKS [G40-01/02, Minchat Shai on 24:22]:
    לשתת ("to drink," defective) — exactly FOUR in the Torah,
    precisely the Masorah's four: Rebecca's own offer ("until they
    have finished to drink," 24:19) and the three water-crises —
    the undrinkable Nile (Exod 7:24), Marah (Exod 15:23), Rephidim
    (Exod 17:1); and three verses after the offer the narrator
    writes the same infinitive PLENE at the camels' finish (24:22,
    the Hilleli and the precise books against the printers): offer
    lean, fulfillment full, inside one scene. THE OATH IS ALWAYS
    SEVEN [G40-03, Minchat Shai on 24:8; Shaarei Orah's second
    gate]: משבעתי ("clear of THIS MY OATH") — the oath-noun runs
    DEFECTIVE through all ten Torah tokens (builder-asserted),
    "for every oath is from the word SEVEN": the letters keep the
    oath indistinguishable from the seven, as at Beer Sheva where
    seven ewes sealed the swearing (the frozen well-oath unit's
    span). THE SET-FOOD PAIR [G40-07/08, Minchat Shai on 24:33;
    Masoret haMasoret; the Ramah]: ויישם ("and food WAS SET before
    him") WRITTEN with two yods, READ ויושם with the shuruk (the
    dotted vav) exactly where Masoret haMasoret demands it against the erroneous qubutz (the short u-dots) — SNAPSHOT carries both tokens side by side
    (the two-token ktiv/qere encoding). THE BRIDE'S ONE-OF-A-KIND
    BIRTH-WORD [G40-16, Minchat Shai on 24:15]: ילדה ("Rebecca,
    who WAS BORN to Bethuel") — the passive born-form: dageshed
    lamed, no vav, UNIQUE in the Torah (builder-asserted
    whole-token census) — the Masorah marked it "none like it" although the dagesh (the doubling dot) alone would forbid the vav. THE GAZING MAN
    [G40-09/10, Minchat Shai on 24:21; the Michlol]: משתאה ("the
    man GAZING at her, silent") — unique in the Torah, aleph in tzere (the long e-vowel) as ruled. ONE VOWEL WIDENS THE FAMILY [G40-17, Minchat
    Shai on 24:27]: בית אחי אדני ("the house of my master's
    BRETHREN" — the road-thanksgiving) — אחי in TZERE, plural
    construct, the whole kin-house; the Masorah's pair-note sends
    to the retelling (24:48, the next unit's span) where the same
    consonants take CHIRIK — singular "my master's BROTHER."
    MINUTIAE AS RULED [G40-11..15, 18, 19, Minchat Shai]: the
    dageshed mem of המשל ("who RULED over all he had," 24:2, the
    trusted servant); the dageshed zayin of הזאת ("THIS land,"
    24:5); the revia (resting dot-accent) on the yod of ויקם
    ("and the servant AROSE," 24:10); חסד ("show KINDNESS," 24:12
    — the Torah's first match-prayer) under zaqef gadol per the
    precise Sephardic books; the lone zarqa (thrown-stone accent)
    on טרם ("BEFORE he had finished speaking — behold, Rebecca,"
    24:15); the meteg on the vav of ואת at the bracelets (24:30,
    the Ben Asher reading); כה דבר ("THUS SPOKE the man," 24:30)
    with soft undotted dalet and the bet in segol (the short e-vowel). THE MISSING BUT
    [G40-20, Minchat Shai on 24:4, manual]: כי אל־ארצי תלך ("BUT
    to my land you shall go") — one of the Masorah's FIVE verses
    where readers wrongly supply אם ("if/but") after כי: the
    verse has no such token (builder-asserted scan) — the letter
    trusts כי alone to carry the turn. INSTRUMENT GAPS: the
    holy/profane Name layer over the oath-invocation and prayer
    (standing gap, unclassified above the letter); 24:12's zaqef
    gadol and 24:21's לדעת ("to know" — revia vs pazer gadol)
    are accent-convention choices among named camps — SNAPSHOT
    sides with the precise-Sephardic reading at both (variance
    class, named). READINGS (named-only, unclaimed): Bereshit
    Rabbah 59's Eliezer-daughter derash on the defective אלי
    ("perhaps/to me," 24:39 — banked for the retelling unit,
    whose span holds it; Yalkut Hosea 528; the deceitful-scales
    verse behind it); the Zohar's maiden-qere page; Shaarei
    Orah's oath-from-seven secret.
