    comment: >
      One unit, Genesis 24:1-33, per-verse x33. The seam falls at
      24:33/24:34 on the command "Speak!" — the next unit opens with
      the compliance arriving in another verb ("and he said"), so the
      seam demand stays open at this unit's wall by design. Evidence
