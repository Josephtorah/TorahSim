          WILDERNESS IN THE TABLE-LAND FOR THE REUBENITES, RAMOTH IN GILEAD
          FOR THE GADITES, GOLAN IN BASHAN FOR THE MANASSITES. 'THEN MOSES SET
          APART' — the act in the third person, 'then' with the imperfect the
          Song's construction (Exodus 15:1, Numbers 21:17; six Torah seats);
          the set-apart root twenty-one Torah seats (Genesis 1's four first;
          the refuge law's 19:2, 7); 'THREE CITIES' 4:41, 19:7, 19:9, Amos 4:8
          — Numbers 35:14's 'THE three cities' with the article the law's one
          seat; the parser [3]; 'toward the sunrise' 4:41 and 4:47 in the
          Torah; 'to flee there' with Numbers 35:6; the manslayer-token
          twenty-eight seats, Numbers 35's fourteen; 'UNAWARES' five; 'hated
          him not in time past' 4:42 and 19:4 — 19:4 reads 'SMITES', 4:42
          'SLAYS', the tail 'and flee to one of these cities and live' the
          ACT's; 'and live' the refuge's and the serpent's word; the parser
          [1]; Golan four seats (Joshua 20:8 GAULON); 'for the Gadites' and
          'for the Manassites' one seat each; ONKELOS 'then' (4:41, 29:19),
          'separated' (4:41, 21:17), 'the slayer' four, 'without knowledge'
          two, 'to the tribe of' supplied thrice. THE DEBIT: the refuge
          runner's appoint_six_cities_of_refuge stands OPEN BY DESIGN to this
          verse (Numbers 35:14; the 1b box's item (ii)) — the compile closes
          it here; Makkot 9b:18, 10a:9-16 the testing shelf's rows on these
          verses, credited from the refuge exam docket.
