          what is appropriate to it (Exod 29:37); the RAMP is included;
          the ministering vessels consecrate what is appropriate to them
          (Exod 30:29) — and the vessels are TYPED: wet consecrates wet,
          dry measures dry, never across; a punctured vessel consecrates
          only while it still performs its whole-function; all of it
          inside the courtyard only.
        cites: ["Sifra, Tzav, Chapter 1 11", "Sifra, Tzav, Chapter 1 12"]
        confidence: witnessed
