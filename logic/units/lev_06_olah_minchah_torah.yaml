          is kindled from the outer altar ('the fire of the altar shall be
          kindled thereby'); the menorah's rides the continuous-fire
          clause with Exod 27:20; the Yom Kippur coal pan's is sealed by
          Lev 16:12 — 'from off the altar BEFORE the LORD': the altar
          which is partly, not wholly, before the LORD is the outer one.
          The whole fire topology drains from one source.
