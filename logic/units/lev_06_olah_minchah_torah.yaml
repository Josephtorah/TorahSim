          limbs are placed at sunset and burn all night; day-pieces (the
          fistful, incense, frankincense, wood, the priests' and libation
          meal-offerings) ride up at night through the comprehensive 'law
          of the olah'; 'until the morning' is freed to the ash removal —
          its window is the whole night. And the altar is ONE-WAY: what is
          fit, once up, does not come down — R. Yehoshua classing by
          fire-fitness, R. Gamliel by altar-fitness (their recorded delta:
          unfit blood and libations), R. Shimon's principle sealing it:
          the courtyard accepts what became unfit INSIDE it (overnight,
          gone-out, tamei, wrong time or place, unfit handlers stay up;
          night-slaughter, spilled or exited blood, and all pre-entry
          unfitness come down); the libation rides its offering both ways.
        cites: ["Sifra, Tzav, Chapter 1 3", "Sifra, Tzav, Chapter 1 4", "Sifra, Tzav, Chapter 1 5", "Sifra, Tzav, Chapter 1 6", "Sifra, Tzav, Chapter 1 7", "Sifra, Tzav, Chapter 1 8", "Sifra, Tzav, Chapter 1 9", "Sifra, Tzav, Chapter 1 10", "Sifra, Tzav, Chapter 1 13", "Sifra, Tzav, Chapter 1 15"]
