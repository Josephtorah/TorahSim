    en: "FOUR TORAH DEBUTS IN ONE COMPACT SPAN [flags 9-10]: navi ('prophet' — born naming Abraham an INTERCESSOR, by God, to a foreign king), palal ('pray' — promised at 20:7 in law-grammar, PERFORMED at 20:17 in narrative: the letter's own promise-performance pair, prose), rapha ('heal' — born answering the debut prayer), chalom ('dream' — the revelation-class opening on a gentile; the interior-speech device's outward twin, no new operator). THE DUAL-TRACK CROWN: Onkelos wrote PRAYER over Abraham's standing at frozen 18:22 and 19:27 (meshamesh bi-tzlo) two chapters before the Hebrew had a pray-verb — at 20:7/17 the buffer receives the letter's palal in its own root (VI-TZALEI / VE-TZALI): the anticipation vindicated in the debut verses; and the MEMRA takes the dream-shift (va-ata MEIMAR min qodam YYY, 20:3/6)"
  - id: EXPORT_the_trial_lexicon
    he: הֲגוֹי גַּם־צַדִּיק תַּהֲרֹג … בְּתָם־לְבָבִי וּבְנִקְיֹן כַּפַּי … חֲטָאָה גְדֹלָה … וְנֹכָחַת
    he_translit: "ha-goy gam-tzaddiq taharog … be-tom-levavi u-ve-niqyon kapai … chataah gedolah … ve-nokhachat"
    en: "THE COURT'S WORDS ARE BORN AND SPENT AT GERAR [flags 8, 11-12; census-exact]: tzaddiq token 10 as a KING'S QUESTION (frozen gen_34's line landed; the discipline's third consecutive chapter — no test, no demand-on-God, the triages fenced); the sin-VERB's debut pair both in-span (God's against-ME, the king's what-have-I); CHATAAH GEDOLAH ('great sin') — four Torah tokens: Gerar and the golden calf x3; TOM ('integrity') spent in one exchange; NIQAYON ('cleanness') a hapax; YIRAT ELOHIM ('fear of God') born NEGATED in a wrong guess (the court had feared at 20:8) and installed right at Sinai (Exod 20:20 — token 2); YAKHACH ('set right') debuting ON SARAH's vindication with token 2 waiting at 21:25 to reprove the vindicator; CHASAKH ('withhold') born in God's mercy, crowned at the Aqedah; the touch-chain (Eden's fence -> Pharaoh's plague -> Gerar's restraint -> 26:11); and the closer's pair: ATZOR ATZAR (atzar tokens 2-3; token 1 = frozen gen_32's atzarani — Sarai's own word) over RECHEM born SHUT — the seam handing every closed womb to 21:1's visitation"
  - id: EXPORT_the_second_sister_court
    he: אֲחֹתִי הִוא … אִמְרִי־לִי אָחִי הוּא … וַיָּשֶׁב … שָׂרָה אֵשֶׁת אַבְרָהָם
    he_translit: "achoti hi … imri-li achi hu … va-yashev … sarah eshet avraham"
    en: "THE EPISODE-PAIR HELD ACROSS WALLS [flags 5, 16; nothing crosses]: the sister-word's tokens 4-6 complete a career that is all ruse (tokens 2-3 = frozen gen_28's 12:13/19); the QUOTED demand (20:13's imri-li — testimony inside a retrospective) pushes nothing while gen_28's original stands open behind two walls, its 'at every place' clause making 20:2 an nth execution; the take-verb active where 12:15 was the rare passive (gen_34's census note quoted); the gifts AFTER the truth where Egypt's came before; expulsion inverted to invitation (shev — the grant-imperative pushed by gen_29's offer-class, the unit's one open demand); the kill-fear tokens binding the courts (12:12/20:4/20:11); and the chapter's last three words giving the ruse its verdict: sarah ESHET AVRAHAM ('Sarah, Abraham's WIFE'). The third episode is pre-seeded: gerar tokens 4-5 and the touch-decree wait at 26:1-11 [watch]"

