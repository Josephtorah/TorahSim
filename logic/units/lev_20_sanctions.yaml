          adulteress').
        cites: ["Sifra, Kedoshim, Chapter 10 8", "Onkelos Lev 20:10"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(the_sanctions_matrix_by_its_own_tokens, the_formula_decoded_on_20_27)"
        en: >
          THE SANCTIONS MATRIX BY ITS OWN TOKENS [claim LV20-09]. Compiled
          cold (cold_run_sanctions.py, 241 of 241), the sanction vocabulary
          of Lev 20 was censused before any union was judged: stoning NAMED
          at 20:2 and 20:27 only; burning at 20:14 only; 'their blood is
          upon them' at 20:11, 12, 13, 16, 27 and 'his blood is upon him' at
          20:9; the bare 'shall surely be put to death' at nine seats; the
          cutting-off at ten seats across the three chapters; 'childless' at
          20:20-21; 'bear iniquity' at 17:16, 20:17, 19, 20; the set face at
          17:10, 20:3, 5, 6. Each union is then LOCATED in the chapter by
          its own kinship token (the father's wife 20:11, the daughter-in-
          law 20:12, the male 20:13, 'a woman and her mother' 20:14, 'his
          lying with a beast' 20:15 — the bare 'with a beast' also stands at
          20:25, the species clause, an honest locator catch — the woman
          20:16, the sister 20:17, the ailing one 20:18, the two aunts
          20:19, the aunt-by-marriage 20:20, the brother's wife 20:21, the
          fellow's wife 20:10, the curser 20:9, 'who gives of his seed to
          Molech' 20:2 — 'to Molech' alone stands at 20:2, 3, 4 — and the
          bearer 20:27) and the located verse read for its tokens. The
          FORMULA DECODER of the Sifra (Chapter 9 14: every 'their blood is
          upon them' means stoning) is GROUNDED by the census itself: of the
          six formula seats exactly one, 20:27, stands beside a named mode,
          and that mode is stoning; Onkelos renders the formula 'death-
          liable' at 20:9 and 20:27. The bare death at 20:10 is filled as
          strangling by the recorded default (Chapter 10 8), the man with
          the beast by the killing analogy (Chapter 11 1), the mother by the
          father's-wife clause (Chapter 10 9). From the matrix the answer
          sheet's censuses are recomputed: Sanhedrin 7:4's nine stoned of
          this span, 9:1's one burned, 11:1's one strangled, MAKKOT 3:1's
          LASH LIST as the karet-grade unions WITHOUT a court death (the
