      both files — an arm reversed, an ancestor inserted, a rule about rules
      dropped, RESEARCH_LOG.md). Ledger num_31_midian_2026-09-12.md, coverage computed by
      script, the ink facts computed from the Tanakh DB and the snapshot store
      (every fact an assert — fourteen fell on the first typed pass and one on
      the second, each retyped from the leg print), every number by the
      engine's own numeral parser (right on the spoil's census, the halves, the
      tributes and the shekels; silent on the ratio's denominator at 31:28, 30,
      47 — the fraction class named and left for the compile), every quotation
      cut by consonants in glossed pieces (no cut miss). Seated as claims
      MT31A-01..11: avenge the vengeance of the children of israel from the midianites; afterward you shall be gathered to your people — the command and its run share the word, the death sequenced after the war; arm men for the host to give the vengeance of the lord on midian; a thousand to a tribe, a thousand to a tribe — twelve thousand delivered; moses sent them with phinehas, the holy vessels and the trumpets of alarm — israel's vengeance relayed as the lord's, the ink's own product, the trumpets' one narrative seat; they warred against midian as the lord commanded moses and killed every male; the five kings of midian upon their slain — evi, rekem, zur, hur, reba — and balaam son of beor by the sword: the first of four receipts, shechem's clause, joshua's retelling, the ass's sword; the women and the little ones taken captive, the cattle and the wealth plundered, the cities and the castles burned; all the spoil and the prey brought to moses, eleazar and the congregation at the plains of moab by the jordan of jericho — the booty's four nouns, the prey-word's seats, honest men against achan; moses, eleazar and the princes went out to meet them; moses was wroth with the officers of thousands and of hundreds: have you let every female live? they were to israel by the word of balaam, to commit treachery in the matter of peor, and the plague was in the congregation of the lord — the wrath-verb's three seats, jethro's grades, the midwives' verb, phinehas's own retelling; kill every male among the little ones and every woman who has known a man by lying with a male — kill; the little ones among the women who have not, keep alive — the verse opens and closes on the verb; jabesh-gilead runs the sentence; we do not punish by inference; encamp outside the camp seven days and purify yourselves on the third and the seventh day, you and your captives; every garment, skin, goat-work and wood; eleazar: this is the statute of the torah — the gold, silver, bronze, iron, tin and lead through the fire and the water of sprinkling, the rest through water; wash on the seventh day and afterward come into the camp — the heifer's law in the priest's mouth; take the sum of the prey — you, eleazar and the heads of the fathers; halve it between those who took the war and the congregation; levy a tribute to the lord from the warriors' half, one soul of the five hundred, to eleazar the lord's heave-offering; from israel's half one held of the fifty to the levites who keep the charge of the tabernacle; and they did as the lord commanded — the half-shekel's spelling and phrase, the fraction the parser leaves silent, the shelf silent from here; the prey, the rest of the booty the people of the host had plundered: 675,000 sheep, 72,000 cattle, 61,000 donkeys, 32,000 persons of the women who had not known a man; the warriors' half 337,500 / 36,000 / 30,500 / 16,000 and the lord's tribute 675 / 72 / 61 / 32; moses gave the tribute to eleazar as the lord commanded — the parser right on every number, the arithmetic exact, the soldiers' plunder uncounted; the congregation's half which moses halved from the men who warred: 337,500 sheep, 36,000 cattle, 30,500 donkeys, 16,000 persons; moses took the held one of the fifty and gave them to the levites as the lord commanded — the same four numbers, the levites' share never written, the fourth receipt; the officers of thousands and of hundreds drew near: your servants have taken the sum of the men of war and not one of us is missing; we have brought the lord's offering — armlet, bracelet, ring, earring and kumaz — to atone for our souls; 16,750 shekels to the tent of meeting, a memorial for the children of israel before the lord — the ransom of exodus 30 run at a count.
