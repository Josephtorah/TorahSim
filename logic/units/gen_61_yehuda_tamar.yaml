  draft_note_en: >
    DERIVED 2026-08-08 · FORWARD ERA unit #2 (run FWD-1 block 2; freeze
    review waived — mechanical gates only). Span: 38:1-30, whole chapter:
    30 verses · 405 tokens (SNAPSHOT-verified, prestage). Conventions
    unchanged; every verse carries an etnachta. Oral layer IN-PIPELINE:
    manifest 12/12 VERIFIED, zero FAILED — see oral_audit_note_en.

    MACHINE PROFILE. The run's first REGISTRY-ACTIVE unit: FIVE naming
    acts, five writes — Er by the FATHER's voice (va-yiqra, one of the
    Masorah's three he-named births), Onan and Shelah by the mother's
    (va-tiqra), Peretz and Zerach at the double birth. Volitive census 8
    (7 imperatives + 1 cohortative), modeled as FIVE DECLAREs: the
    levirate seed-demand (38:8), the sit-as-widow demand (38:11 — the
    span's only pushed-and-satisfied-in-the-SAME-verse demand), the
    roadside request (38:16), the burn-order (38:24), and Tamar's
    haker-na (38:25). FOUR RESULTs. END-STATE: the burn-order ALONE
    stays open — pushed at 38:24, reversed in effect by the recognition
    and confession, never executed and never revoked on the letter: the
    second demand in two units to DIE ON THE QUEUE (gen_60's
    kill-demand). THE MACHINE HEART: the seed-demand (haqem zera
    le-achikha) is pushed on ONAN, refused from inside (obedience in
    form, refusal in substance — the machine keeps it open through his
    act), and DISCHARGED THROUGH JUDAH HIMSELF at the twins (38:27):
    the demandee-mismatch class (gen_46's Isaac-blessing precedent) at
    full chapter scale. TESTS 0 (zero tov). LEDGER 0.

    CARE-POINTS: the sit-demand's CONDITION (Shelah grown -> Tamar
    given) is convicted by the narrator's own clause at 38:14 (ki gadal
    shela ve-hiv lo nitna lo) and by Judah's confession (38:26 ki al
    ken lo netatiha le-shela) — the demand was satisfied, the promise
    behind it broken; filed as letter-note, not a machine flag. The
    GOAT-COIN: the kid of the goats (38:17-23) prices this deception
    as the goat's blood priced the coat (37:31) — one animal-class,
    two frauds, consecutive chapters. The IDENTITY-OBJECTS: seal,
    cord, staff, scarlet thread — the chapter argues by tokens, and
    the pledge-triple returns as evidence at 38:25. The word-shift
    zona (38:15, Judah's eyes) -> qedesha (38:21-22, Hirah's mouth,
    the townsmen's answer) — the span's politest lie, letter-note.
    The passive tellings (va-yugad 38:13, 38:24) — both actors act on
    agentless news. bat-shua enters and dies nameless while Tamar
    enters by name (38:6). vi-kheziv (38:5): the birthplace of the
    withheld son carries the lie-word's skeleton; letter-note.
    WATCHLIST ARMS: 46:12 (Er and Onan dead in the descent-roster;
    Peretz's sons); Num 26:19-22 (the Masorah's ledger of this
    house); Deut 25:5-10 (the levirate LAW the narrative precedes —
    the shoe where the seed-demand gets its statute); Ruth 4:12,18
    ("like the house of PERETZ" — the kingdom the Kitzur reads from
    ki gadal, outside the instrument, named); Exod 17:5 (the staff
    armed by G61-06); 25:24's lean twins vs 38:27's full (the
    two-spelling twin-pair, armed).
  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (IN-PIPELINE, forward era; manifest
    logic/oral_audit/manifests/gen_61_yehuda_tamar_claims.json 12/12
    VERIFIED, zero FAILED; record
    logic/oral_audit/AUDIT_gen_61_2026-08-08.md). CROWNS
    (chain-attested + DB-verified). THE HE-NAMED FIRSTBORN [G61-01,
    the Masorah via Minchat Shai on 38:3; the Toledo-corrected books;
    Ramban]: every "she conceived and bore" takes SHE-named except
    THREE he-named — Er here, Gershom (Exod 2:22), Beriah (Chronicles,
    named) — and the stream splits exactly: ויקרא ("and HE called")
    for Er, ותקרא ("and SHE called") for Onan and Shelah; Ramban reads
    Judah as the namer; a book-variance (some copies she-name Er too)
    filed named. THE ONE FULL FIRSTBORN [G61-02, MS on 38:6]: בכורו
    ("his firstborn") written FULL with vav ONCE in the Torah — on Er,
    the firstborn who dies first; the lean pair (Sidon 10:15, Uz
    22:21) asserted. THE FURNACE-VERSE'S LETTERS [G61-03/04/05, MS on
    38:25; Bereshit Rabbah 85; Ketubot 67b; Sotah 10b; Bava Metzia
    59a; R. Chananel; the Arukh; the Ritva; the Hilleli and Yerushalmi
    codices; the Ramah]: הוא מוצאת ("SHE was brought out") — written
    he-vav, read she: R. Huna — SHE and HE were due to come out; the
    written skeleton keeps the sentencing man inside her verse
    (in-stream). The furnace-teaching (better the furnace than a
    fellow's public shame) hangs on מוצאת — R. Chananel's text read it
    LEAN of its aleph ("set alight"), the Ritva answers "no book has
    it so," and SNAPSHOT writes the aleph with the books, the
    kindling-reading surviving as the homily's read-it-as. And
    והפתילים ("the cords") FULL-OF-FULL — both yods — with the
    Yerushalmi codex and the Ramah AGAINST the Hilleli's lean: the
    stream rules against the Hilleli at the very word the recognition
    turns on. THE STAFF OF THE WONDERS [G61-06, Kitzur on 38:18]:
    ומטך ("and your staff") stands exactly TWICE in the Torah —
    Judah's pledge in Tamar's hand and "your staff with which you
    struck the Nile" (Exod 17:5): the Kitzur — the staff given into
    her hand is the staff of the miracles. THE NAME IN THE VERDICT
    [G61-07, Kitzur on 38:24]: the initials of
    "Judah... bring-her-out... and-let-her-be-burned" + the next
    verse's opening she-word — four initials spelling the four-letter
    Name across the verse-seam: the Holy One summoned her the signs
    that were lost (three initials checked, the fourth asserted).
    FEAR IN THE FINALS [G61-08, Kitzur on 38:25]: the four words of
    "recognize, please, whose is the seal" close in letters that read,
    from the last word back, תירא ("FEAR") — fear the One and confess
    (ordered finals checked). THE KI-GADAL PAIR [G61-09, Kitzur on
    38:14]: "for Shelah WAS GROWN" — the adjacency stands exactly
    twice in the Torah, Tamar's seeing and Isaac's growing greatness
    (26:13): from her seeing came the house that grows very great.
    THE FOUND-HER SKELETON [G61-10, Kitzur on 38:20]: ולא מצאה ("he
    did not find her") — the skeleton's four Torah stations locked
    (the dove's no-rest 8:9, the road 38:20, the redeemer's
    sufficiency Lev 25:28, the field Deut 22:27); the Kitzur pairs
    road and field. THE DAGESH AND METEG SET [G61-11/12, MS ×9]:
    adulami's lamed dagesheed at both stations; the lamed of לו
    ("to WHOM I am with child") dagesheed at the pledge-speech; tiqach ("let her keep it") with
    the qof dagesheed AND — where MS records the books divided on the
    meteg — SNAPSHOT writing BOTH strokes: a both-camps station (the
    divide-word class). gam and ha-gedi dagesheed, hotziuha's tifcha
    on the aleph, natan's soft tav, bet-avikh's soft bet (asserted).
    DISCREPANCY: titen LI ("what will you give ME," 38:16) — MS rules
    the lamed SOFT; SNAPSHOT writes the crowding dagesh: the stream
    against MS's camp, filed. Stress-variance at ve-lo yasaf od
    (38:26, end-stressed against the Michlol's custom) named, with
    the double reading (did not continue / did not cease). READINGS
    (named-only): the burning's law (Rashi's priest's-daughter vs
    Ramban's ruler's-court); the cords as tefillin; Petach Enayim's
    Abraham-count; the harlot-pair with the city (Isaiah); the
    scorn-pair (Proverbs); Peretz toward David (the atbash and the
    sum); Er's deed supplied from Onan's; the twins' two spellings
    (38:27 full vs 25:24 lean).
