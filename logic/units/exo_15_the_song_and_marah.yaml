    he_translit: ze el-y ve-anve-hu elohe avi-y va-aromme-nehu
    en: >
      THE VOW-PAIR. ZE eli ve-ANVEHU — 'THIS is my God, and I will GLORIFY
      Him' (the pointing-word: the readings on the finger at the sea — the
      maidservant seeing what prophets sought — named-only); elohe AVI va-
