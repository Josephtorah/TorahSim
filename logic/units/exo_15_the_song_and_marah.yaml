    he: עָזִּי וְזִמְרָת יָהּ וַיְהִי־לִי לִישׁוּעָה
    he_translit: azi-y ve-zimrat ya va-yehi-li-y li-yshua
    en: >
      THE STRENGTH [EX15-12; EX15-13]. UZI ve-zimrat YAH — 'my STRENGTH
      and song is the LORD': the strength-word Torah-unique (VERIFIED) —
      the Kitzur's three named (the Hallel's and Isaiah's wells-of-
      salvation twin) with the sweet-floor: 'SWEET water flowed from the
      sea-bed and they DREW IT IN JOY'; and the word's own grammar carries
      a loss (MS, EX15-13): the ayin in QAMATZ-CHATUF 'because of the
      zayin's dagesh, WHICH MARKS THE DROPPED ROOT-LETTER' — the strength-
      word spelled minus a letter of its own root (15:13's nehalta ve-
      ozkha the same rule, bet raphe; va-aromemenhu's first mem on sheva
      alone); va-yehi-LI li-YSHUA — 'He has become MY SALVATION': 14:13's
      stand-and-see oracle receipted in the first person (the yeshua armed
      at the panic, delivered at 14:30, SUNG at 15:2 — the machine closes
      the salvation-arc in the singer's own mouth); and the readings'
      counter named-only: my-strength against the prince of Egypt the
      Kitzur named at the drawing-near (14:10's arm paid).
    cites: []
    confidence: tested
  - op: PRECONDITION_STATE
    expr_en: "HOLDS(ze_eli_ve_anvehu, t0)"
