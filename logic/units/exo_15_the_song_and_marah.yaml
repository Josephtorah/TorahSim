boot_steps:
- id: STEP_Ex_15_1
  order: 1
  ref: Exod.15.1
  op: THEN_SANG_MOSES
  he: אָז יָשִׁיר־מֹשֶׁה וּבְנֵי יִשְׂרָאֵל אֶת־הַשִּׁירָה הַזֹּאת לַיהוָה וַיֹּאמְרוּ לֵאמֹר אָשִׁירָה לַיהוָה כִּי־גָאֹה גָּאָה סוּס וְרֹכְבוֹ רָמָה בַיָּם
  he_translit: az yashir-moshe u-vene yisrael et-ha-shira ha-zot la-YHWH va-yomru le-mor ashira la-YHWH ki-gao gaa sus ve-rokhv-o rama va-yam
  en: "[EN-AID] Then sang Moses and the sons of Israel this song to the LORD, and they spoke, saying: I will sing to the LORD, for He is highly exalted; the horse and its rider He has thrown into the sea."
  tree_left:
    he: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּבְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַשִּׁירָ֤ה הַזֹּאת֙ לַֽיהוָ֔ה וַיֹּאמְר֖וּ לֵאמֹ֑ר
    he_translit: az yashir-moshe u-vene yisrael et-ha-shira ha-zot la-YHWH va-yomru le-mor
    en: "then sang Moses and the sons of Israel this song to the LORD, and they spoke, saying (etnachta on le-mor) [VERIFIED: SNAPSHOT Exod.15.1 idx10 etnachta in-stream]"
  tree_right:
    he: אָשִׁ֤ירָה לַֽיהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְרֹכְב֖וֹ רָמָ֥ה בַיָּֽם
    he_translit: ashira la-YHWH ki-gao gaa sus ve-rokhv-o rama va-yam
    en: "I will sing to the LORD, for He is highly exalted: the horse and its rider He has thrown into the sea (verse-final va-yam) [VERIFIED: SNAPSHOT Exod.15.1 idx11-19]"
  operators:
  - op: EVENT
    expr_en: "shirat_ha_yam(e1); Agent(e1, moshe); Theme(e1, bene-yisrael)"
    he: אָז יָשִׁיר־מֹשֶׁה וּבְנֵי יִשְׂרָאֵל אֶת־הַשִּׁירָה הַזֹּאת לַיהוָה וַיֹּאמְרוּ לֵאמֹר
    he_translit: az yashir-moshe u-vene yisrael et-ha-shira ha-zot la-YHWH va-yomru le-mor
    en: >
      THE SONG [EX15-03 CROWN]. AZ YASHIR moshe u-vene yisrael — 'THEN
      SANG Moses and the sons of Israel': THE EVENT — the corpus's first
      song, and the then-sang frame stands exactly TWICE in the Torah
      (VERIFIED): the Sea here and THE WELL (Num 21:17 — where Moses' name
      is withheld, the Kitzur: 'he too sang — but it does not name him,
      FOR HE WAS STRUCK THROUGH WATER': the water-singer barred by water,
      Num 20 armed); the yod of yashir counted as TEN SONGS (the Sea, the
      Well, the witness-song, Joshua, Deborah, Hannah, David, Solomon,
      Hezekiah, and THE SONG TO COME — the chain's canon of history, the
      last unsung); and the Kitzur's redeemed grudge: 'with the word I
      COMPLAINED — u-ME-AZ bati el-paro (5:23: SINCE THEN it has gone
      worse) — with that word I WILL BEGIN THE PRAISE' (asserted: exo_05's
      bitterest adverb returned as the Song's first word); yashir bound by
      maqqef (MS, EX15-13); the machine stamps the singing and notes the
      tense the readings live on: the future-form sang in the past, named-
      only.
    cites: []
    confidence: tested
  - op: PRECONDITION_STATE
    expr_en: "HOLDS(ki_gao_gaa_sus_ve_rokhvo, t0)"
    he: אָשִׁירָה לַיהוָה כִּי־גָאֹה גָּאָה סוּס וְרֹכְבוֹ רָמָה בַיָּם
    he_translit: ashira la-YHWH ki-gao gaa sus ve-rokhv-o rama va-yam
    en: >
      THE REFRAIN. ashira la-YHWH ki GAO GAA — 'I will sing to the LORD,
      for He is HIGHLY EXALTED' (the cohortative: the Song opens on a
      first-person vow); the doubled exaltation-verb SOFT then HARD
      (EX15-01: both checked — the Masorah's twin-pairs file); sus ve-
      rokhvo rama va-yam — 'the horse and its rider He has THROWN into the
      sea': the refrain-line minted whole — SEVEN tokens that will return
      VERBATIM in Miriam's mouth (asserted at the build: 15:1 and 15:21
      token-identical): the machine arms the antiphon.
    cites: []
    confidence: tested
  comment: >
    The Song event; the refrain minted.
  confidence: tested
  source: "[HE-WRITTEN][HE-STRUCT]"

- id: STEP_Ex_15_2
  order: 2
