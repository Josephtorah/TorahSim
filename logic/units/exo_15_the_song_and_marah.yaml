      lo-asim alekha — 'all the DISEASE which I set upon Egypt I will not
      set upon you': the plague-cycle re-classed in one word as DISEASE
      (the corpus's own retrospect: what Egypt received is what obedience
      is spared) — and the Kitzur's anagram-pharmacy asserted: the
      disease-word's letters are THE BREAD and THE SALT (letter for
      letter, finals normalized), its number its own etiology ('EIGHTY-
      THREE kinds of illness hang on the gall — and morning bread with
      salt and a jug of water ANNULS THEM ALL — therefore SPRINGS OF WATER
      are juxtaposed': 15:27 next verse — the remedy spelled inside the
      malady, the menu inside the diagnosis); kol-ha-machala's lengthener-
      and-binder ruled, the he WITHOUT a lengthener 'so for BEN ASHER'
      (the codex-master cited twice in one verse, MS, EX15-13); ki ANI
      YHWH ROFEKHA — 'for I AM THE LORD YOUR HEALER': the I-am-the-LORD
      formula (6:2's spine-word) gains its first TITLE — and the title's
