  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_47_2026-08-08.md; manifest verified
    8/8 checkable, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified, all Minchat Shai on the span).
    THE POINTED KILL-WORD [G47-02]: ואהרגה ("that I may KILL my
    brother," 27:41) — vav in sheva (the half-vowel), aleph in patach
    (the short a) exactly as ruled from the Chizkuni, SNAPSHOT adding
    the meteg (the small stress-stroke) on the aleph. THE SOFT BET
    [G47-03]: בחיי ("I am disgusted WITH MY LIFE," 27:46) — bet soft,
    no doubling dot: the bet-then-sheva pattern is its own absence
    proof. THE SEND-OFF ACCENTS [G47-05/06]: יעקב ("Jacob") under
    zaqef qatan (the small upright pause) with no pashta (the
    forward-leaning accent) at 28:5; עשו ("Esau") under revia (the
    resting dot-accent) at 28:6 — the pause sits on the seer's own
    name at his first seeing. THE LAW'S FIRST SPLIT-ATTESTED STATION
    [G47-07]: בברכו ("when he blessed him," 28:6) — Minchat Shai
    himself records the books DIVIDED on the resh: plain sheva in
    some, sheva-patach in others; SNAPSHOT points hataf patach (the
    compound half-vowel), joining the compound camp — consistent with
    all eight censused resh stations, and the tradition's own recorded
    division is external witness that the resh-class split is real.
    Sub-variance: the root-bet carries qamatz with NO meteg against
    "the lengthening stroke in all the books" (meteg-omission class).
    MAHALATH AS THE PRECISE BOOKS RULE [G47-08/09]: את joined by
    maqqef (the joining stroke); מחלת ("Mahalath," a Torah one-time
    name) with mem in qamatz and chet in hataf patach per the precise
    books and Or Torah — SNAPSHOT arbitrates AGAINST the printer's
    plain sheva; the guttural chet takes the compound half-vowel by
    nature, the inverse shape of the resh split in the same
    verse-neighborhood. DISCREPANCY [G47-01]: ברכו ("blessed him,"
    27:41) — ruled resh with sheva alone "as our custom"; SNAPSHOT
    hataf patach — station 8 of the resh class, censused from the
    blessing unit's span, now source-anchored inside its own unit
    (eight ruled stations plus one split-attested, all resh).
    INSTRUMENT GAP [G47-04, manual]: קצתי ("I am disgusted," 27:46)
    written with a SMALL QOF per the scribal lists — letter-size
    layer uninstrumented; the Kitzur reads the qof of one-hundred
    made small (the House a hundred cubits high destined for ruin)
    against the large qof of the sparrow's nest (Ps 84), David's plea
    that it stand. The paragraph question at 28:10 (whether a break
    precedes "and Jacob went out") banked for the Bethel unit;
    paragraphs uninstrumented. READINGS (named-only, unclaimed):
    Rashi 27:42 — the leak to Rebecca of what Esau said IN HIS HEART
    "told her by the holy spirit" (the machine's teller-withheld
    passive carries the very gap the reading answers); Bereshit
    Rabbah 67 — the mourning-days calculation and the
    consolation-by-murder reading of מתנחם ("consoles himself").
