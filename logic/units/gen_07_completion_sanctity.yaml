boot_steps:
  - id: STEP_Gn_2_1
    order: 1
    ref: "Gen.2.1"
    op: COMPLETION_PASSIVE
    he: וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָם
    he_translit: "va-yekhulu ha-shamayim ve-ha-aretz ve-khol-tzeva'am"
    en: "[EN-AID/JPS] And the heaven and the earth were finished, and all the host of them."
    tree_left:
      he: ויכלו השמים והארץ
      he_translit: "va-yekhulu ha-shamayim ve-ha-aretz"
      en: "the passive completion over the two registries (tifcha arm)"
    tree_right:
      he: וכל צבאם
      he_translit: "ve-khol tzeva'am"
      en: "the inventory summarized under the new term: all their HOST"
    operators:
      - op: EVENT
        expr_en: "complete(e1) ∧ Theme(e1, shamayim) ∧ Theme(e1, aretz) ∧ Theme(e1, tzevaam)"
        he: וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָם
        he_translit: "va-yekhulu ha-shamayim ve-ha-aretz ve-khol-tzeva'am"
        en: >
          PUAL wayyiqtol 3MP (VPw3mp) — 'and they WERE FINISHED': the
          corpus's first main-line AGENTLESS event — no subject performs
          it; the two registries of 1:1 (heavens, earth) and their whole
          contents simply arrive at completion. The event carries NO
          Agent term — the machine records what the letter records
          (TIR-032's agentless class; the rule was written for the
          niphal, the pual is the same family — noted, not stretched).
          The contents are summarized under a NEW term: tzeva'am ('their
          HOST/array' — an order/muster word; Onkelos: chayil, 'force'),
          [OPEN]: the inventory the week built piece by piece is renamed
          wholesale as an ARRAY. Bereshit Rabbati 58 (read, day-1 row
          463) hears kalah/reveal in the verb: completion as disclosure.
          AMENDMENT 2026-08-23, the completion dossier read: TZIVYONAM
          — 'do not read tzeva'am (their host) but tzivyonam (their
          FORM): all the acts of Creation were created in their full
          stature, full capacity, full form' (R. Yehoshua ben Levi,
          Chullin 60a) — and the teaching is APPLIED at Rosh Hashanah
          11a to resolve day-3's Tishrei/Nisan fruit-tree objection:
          our verse closes the calendar machloket's loop. The
          PERFECTING MECHANISM (Bereshit Rabbah 10:5): 'the heavens
          were perfected through sun, moon, constellations; the earth
          through trees, vegetation, Eden' — each base completed by
          its delivered products (the incubation architecture's closing
          clause); 'made in generic form, gradually expanded.' The DARK
          DOUBLE (10:4): vaykhulu heard as KELAYA (blow/destruction) —
          the orbits slowed after the sin, day-3's instant yield
          impaired, healed in the future — a recorded double reading
          of our verb. The schedule dispute sits ON this verse (12:4,
          re-verdicted): completed-at-their-time vs
          emerged-each-at-its-time. Onkelos renders VE-ISHTAKHLALU —
          the perfecting verb (shakhlel), leaving the dark double
          Hebrew-ink-only. THE RECITAL LAW (Shabbat 119b): whoever
          recites vaykhulu on Shabbat evening 'is ascribed credit as
          if he became a PARTNER in the act of Creation — do not read
          vaykhulu (they were finished) but vaykhallu (THEY finished)'
          — this span as standing weekly testimony, the completion
          re-executed by every reciter; speech is like action (Ps
          33:6).
        cites: ["TIR-032", "Chullin 60a:9", "Rosh Hashanah 11a:6", "Bereshit Rabbah 10:5", "Shabbat 119b:2"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "shamayim, aretz are READ without prior install (standalone machine; installed in gen_01/gen_02/gen_03 — cross-unit chaining is Stage E)"
        en: "flag, not fix — the completion's subjects are the corpus's first two registries"
        cites: []
        confidence: tested
    comment: >
      Five words, no agent, no speech: the span opens by closing — the
      1:1 pair (heavens and earth) returns as the subject of a passive,
      bracketing the account. The liturgical chain (Megillah 30b:10)
      reads 1:1-2:3 as one unit; the letter's bracket is this echo.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_2_2
    order: 2
    ref: "Gen.2.2"
    op: COMPLETE_CEASE
    he: וַיְכַל אֱלֹהִים בַּיּוֹם הַשְּׁבִיעִי מְלַאכְתּוֹ אֲשֶׁר עָשָׂה וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי מִכָּל־מְלַאכְתּוֹ אֲשֶׁר עָשָׂה
    he_translit: "va-yekhal Elohim ba-yom ha-shevi'i melakhto asher asah va-yishbot ba-yom ha-shevi'i mi-kol-melakhto asher asah"
    en: "[EN-AID/JPS] And on the seventh day God finished His work which He had made; and He rested on the seventh day from all His work which He had made."
    tree_left:
      he: ויכל אלהים ביום השביעי מלאכתו אשר עשה
      he_translit: "va-yekhal Elohim ba-yom ha-shevi'i melakhto asher asah"
      en: "the ACTIVE completion, dated ON the seventh (etnachta arm)"
    tree_right:
      he: וישבת ביום השביעי מכל מלאכתו אשר עשה
      he_translit: "va-yishbot ba-yom ha-shevi'i mi-kol-melakhto asher asah"
      en: "the ceasing — the mirrored half"
    operators:
      - op: EVENT
        expr_en: "finish(e2) ∧ Agent(e2, Elohim)"
        he: וַיְכַל אֱלֹהִים בַּיּוֹם הַשְּׁבִיעִי מְלַאכְתּוֹ
        he_translit: "va-yekhal Elohim ba-yom ha-shevi'i melakhto"
        en: >
          PIEL ACTIVE (Vpw3ms) — 'and God FINISHED, ON THE SEVENTH DAY,
          His work': the passive completion of 2:1 is followed by an
          active finishing act explicitly dated INSIDE the ceasing day —
          recorded [OPEN] (what act of finishing remained after 1:31's
          global pass?). The chain's dossier is queued: PRE 18:4 (read)
          makes va-yekhal a DEDICATION ceremony; BR 10:9 (named) answers
          'menuchah — REST itself was the seventh day's creation'.
          Onkelos (Tier-A) retains the seventh-day dating unharmonized —
          the received text stood where other ancient versions moved the
          finishing to the sixth. The work-word is NEW: melakhah —
          unknown to days 1-6, x3 in this span, and destined to be the
          Sabbath law's operative term (65 occurrences Torah-wide; the
          prospective watch-list's negative-rarity finding).
          AMENDMENT 2026-08-23, THE CRUX DOSSIER READ (the v1 queue
          discharged): Bereshit Rabbah 10:9's answer set — the hammer
          raised by day, lowered after nightfall; R. Shimon ben Yochai:
          man, not knowing his times, must add from the profane to the
          sacred, but He who KNOWS His hours 'entered it by a
          HAIRBREADTH'; Geniva: the wedding canopy lacked its BRIDE —
          what did the world lack? SHABBAT; the Rabbis: the signet
          lacked its SEAL. What was created on it after He rested:
          TRANQUILITY, SATISFACTION, CALM, QUIET. R. Levi: the works
