          asah tail): completion and cessation as parallel transactions.
          Onkelos renders ve-NACH ('and He RESTED') — the translation's
          interpretive gloss, cessation read as rest; the Hebrew says
          only that the working STOPPED. AMENDMENT 2026-08-23 — THE
          REST'S SCOPE, read exactly as the letter bounds it: 'He
          rested from the labor of CREATING HIS WORLD — but not from
          the labor of the wicked nor from the labor of the righteous'
          (Bereshit Rabbah 11:10): reward and punishment continue as
          labor (Jer 50:25; Ps 31:20) — the cease op's mi-kol-melakhto
