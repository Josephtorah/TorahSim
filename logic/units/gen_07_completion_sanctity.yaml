          [OPEN]: what the world lacked, the seventh day supplied —
          MENUCHAH (rest): the bride for the canopy (Geniva), the seal
          for the signet (the Rabbis) — two parables, one substance;
          named outright in the same passage: 'tranquility,
          satisfaction, calm, and quiet' were created on it. The
          finishing act the letter dates inside the day IS, on the
          witness tier, the arrival of rest as a created thing. Typed
          anchor: Exod 20:11 — 'and He RESTED on the seventh day;
          therefore the Lord blessed the Sabbath day' — the later text
          that finds the creation standing and builds law on it.
