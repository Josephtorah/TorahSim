          bound. AND THE LAW COUNTS OUR TOKEN: the 39 Shabbat labor
          categories derive from the count of melakhah occurrences in
          the Torah, and the count EXPRESSLY INCLUDES this verse —
          'God completed on the seventh day His work — it is with
          them' (Jerusalem Talmud Shabbat 7:2:2; R. Acha checked the
          whole Torah by eye that no plural form occurs): the Sabbath
          law's numerical foundation is built partly on this unit's
          own ink.
