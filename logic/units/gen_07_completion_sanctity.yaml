        he_translit: "va-yevarekh Elohim et-yom ha-shevi'i"
        en: >
          The third BLESS of the corpus — and both prior parameters are
          gone: the recipient is not a creature but a TIME OBJECT (the
          seventh day, et-marked as a direct object), and there is NO
          QUOTED MANDATE — no le-mor ('saying'), no imperatives, no
          speech at all (this span is the corpus's only speech-less
          day: zero census utterances). Days 5-6 blessed AND
          commissioned; day 7 blesses and commissions NOTHING — the
          standing is conferred on the day itself, not on any agent's
          future action. INTERPRETER NOTE: the day-5 BLESS handler
          required the mandate clause; this unit shows the mandate was a
          parameter, not the operator's essence — vocabulary extension
          at verification (mandate optional). AMENDMENT 2026-08-23 —
          BLESSED WITH WHAT (the chain's content list for a mandate-less
          blessing): the MANNA — 'He blessed it with manna and
          sanctified it with manna' (R. Yishmael: double portion Friday,
          none on Shabbat; R. Natan: sanctified with a blessing;
          R. Yitzchak: through the wood-gatherer — the sanctification's
          vehicle a recorded dispute); apparel; the candle that burned
          undiminished; the FACE-RADIANCE ('a person's face on Shabbat
          is not as on weekdays'); and the PRIMORDIAL LIGHT held
          THIRTY-SIX HOURS in Shabbat's honor — hidden only at its
          close, when Adam, afraid of the first night, drew FIRE from
          two flints and blessed it: 'why does one bless the light at
          Shabbat's conclusion? because then was the beginning of its
          creation' (the havdalah blessing's ground; retold at Bereshit
          Rabbah 82:15). The reduction-rule's day-7 answer: days 5-6
          are blessed against reduction; the seventh 'He blessed due to
          the EXPENDITURE' (11:3, re-verdicted). LAW FROM THE BLESSING:
          no mourning on Shabbat — 'the blessing of the Lord, it will
          enrich (= God blessed the seventh day), without adding
          sadness (= mourning)' (Prov 10:22; Bereshit Rabbah 11:1 +
          100:7, where the seven-day mourning structure itself derives
          from His mourning for His world).
