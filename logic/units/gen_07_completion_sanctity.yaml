  - id: STEP_Gn_2_3
    order: 3
    ref: "Gen.2.3"
    op: BLESS_SANCTIFY
    he: וַיְבָרֶךְ אֱלֹהִים אֶת־יוֹם הַשְּׁבִיעִי וַיְקַדֵּשׁ אֹתוֹ כִּי בוֹ שָׁבַת מִכָּל־מְלַאכְתּוֹ אֲשֶׁר־בָּרָא אֱלֹהִים לַעֲשׂוֹת
    he_translit: "va-yevarekh Elohim et-yom ha-shevi'i va-yekadesh oto ki vo shavat mi-kol-melakhto asher-bara Elohim la'asot"
    en: "[EN-AID/JPS] And God blessed the seventh day, and hallowed it; because that in it He rested from all His work which God in creating had made."
    tree_left:
