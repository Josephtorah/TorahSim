derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      Day-7 unit (2:1-3): the week's closing span, defined by ABSENCES the
      six prior units make measurable. No va-yomer — the corpus's ONLY
      speech-less day (the ten-utterances census has zero members here).
      No demand — the first unit whose SPECS log ends empty. No build —
      zero WORLD installs. No test — no tov. No receipt — no va-yehi khen.
      And NO COMMIT — no evening, no morning, no day label: the
      transaction opened by the evening-morning cycle at 1:5 never closes
      on the seventh. The learning-pass model called this the OPEN
      TRANSACTION; the machine now holds it as a ledger with six closed
      rows and a seventh day that exists only as an OPERAND (blessed,
      sanctified) — never as a row. What the span DOES contain: the
      passive completion, the dated finishing act, the third blessing
      (aimed at a time object, with no quoted mandate), and the Torah's
      first holiness write.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 3 verses via taamim_tree_parse.py rule set v3: status unique,
      pure_binary true. tree_ascii regenerated 2026-07-31 from DB
      tree_json. Tree facts: 2:2 splits into two MIRRORED halves at the
      etnachta ([finished on-the-seventh his-work which-he-made | ceased
      on-the-seventh from-all-his-work which-he-made] — same four-part
      shape twice); 2:3 splits [blessed the seventh day + sanctified it |
      the reason clause], isolating the ki-clause with the la'asot tail
      as the right arm.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-07-31): va-yekhulu
      VPw3mp — PUAL (passive intensive) wayyiqtol — the completion is
      AGENTLESS: 'they WERE finished' (the TIR-032 agentless-passive
      class; the rule was written for the niphal — the pual is the same
      agentless family, noted). va-yekhal Vpw3ms — PIEL ACTIVE — 'He
      finished', dated BA-YOM HA-SHEVI'I ('ON the seventh day') —
      recorded [OPEN]: an act of finishing located inside the ceasing
      day. va-yishbot Vqw3ms — 'and He CEASED' (shavat — the verb that
      will name the Sabbath, here only a verb; the noun shabbat does not
      occur in the span). va-yevarekh Vpw3ms — the third BLESS.
      va-yekadesh Vpw3ms — PIEL 'sanctified': lemma 6942 kdsh, the
      corpus's FIRST holiness token (DB-verified; next occurrence in the
      whole Torah: Exod 13:2). shavat Vqp3ms — the perfect inside the
      reason clause. bara Vqp3ms + la'asot Vqc — 'which God CREATED to
      MAKE': perfect + purpose infinitive (TIR-030), recorded [OPEN].
      melakhah ('work') x3 — new register term, unknown to days 1-6.
      tzeva'am ('their HOST/array') — new summary term over the whole
      inventory. yom ha-shevi'i x3, all with the definite article —
      day 6's heh yeterah ('extra heh') is now the norm.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      2:1 — system-wide PASSIVE completion: heavens, earth, and all their
      tzava ('host') are finished, with no named finisher — the corpus's
      first agentless main-line event. 2:2 — the ACTIVE completion, dated
