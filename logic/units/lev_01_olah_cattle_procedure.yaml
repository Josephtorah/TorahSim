  - id: STEP_Lv_1_4
    order: 1
    ref: "Lev.1.4"
    op: ETNACHTA_SPLIT
    he: וסמך ידו על ראש העלה … ונרצה לו לכפר עליו
    he_translit: "vsmk ydv 'l r'sh h'lh … vnrtzh lv lkpr 'lyv"
    en: "[EN-AID] From top split: LEFT «וסמך ידו על ראש העלה» / RIGHT «ונרצה לו לכפר עליו». Derive claim from Hebrew arms. Lev 1:4."
    tree_left:
      he: וסמך ידו על ראש העלה
      he_translit: "vsmk ydv 'l r'sh h'lh"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: ונרצה לו לכפר עליו
      he_translit: "vnrtzh lv lkpr 'lyv"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(semichah, no_delegation_sons) — SEMICHAH: no delegation; sons not daughters (women-may recorded); acceptance scope"
        en: >
          HAND-LAYING [claim LV01B-01]. 'His hand' — not his wife's, his
          bondsman's, or his messenger's: the one op in the pipeline that
          admits NO AGENT; on the head, not the neck or back. Sons of
          Israel, not daughters — with R. Yossi and R. Shimon recording the
          women-MAY position (Abba Elazar's calf testimony). 'Venirtzah'
          scopes the return value: acceptance atones for what carries no
          stipulated punishment; the atonement AGENT is the blood (Lev
          17:11).
        cites: ["Sifra, Vayikra Dibbura DeNedavah, Chapter 4 2", "Sifra, Vayikra Dibbura DeNedavah, Section 2 2", "Sifra, Vayikra Dibbura DeNedavah, Chapter 4 8", "Sifra, Vayikra Dibbura DeNedavah, Chapter 4 9"]
        confidence: witnessed
    comment: >
      Top split L mark=etnachta (major mid-verse rest); maps_to this verse only.
    confidence: hypothesis
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Lv_1_5
    order: 2
    ref: "Lev.1.5"
    op: ETNACHTA_SPLIT
    he: ושחט את בן הבקר לפני יהוה … והקריבו בני אהרן הכהנים את הדם וזרקו את הדם על המזבח סביב אש
    he_translit: "vshcht 't bn hbqr lpny yhvh … vhqrybv bny 'hrn hkhnym 't hdm vzrqv 't hdm 'l hmz"
    en: "[EN-AID] From top split: LEFT «ושחט את בן הבקר לפני יהוה» / RIGHT «והקריבו בני אהרן הכהנים את הדם וזרקו את הדם על המזבח סביב אשר פתח אהל מועד». Derive claim from Hebrew arms. Lev 1:5."
    tree_left:
      he: ושחט את בן הבקר לפני יהוה
      he_translit: "vshcht 't bn hbqr lpny yhvh"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: והקריבו בני אהרן הכהנים את הדם וזרקו את הדם על המזבח סביב אשר פתח אהל מועד
      he_translit: "vhqrybv bny 'hrn hkhnym 't hdm vzrqv 't hdm 'l hmzbch sbyb 'shr ptch 'hl mv'd"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(role_table, caller_to_priest_handoff) — PIPELINE ROLES: slaughter=anyone; from RECEIVING on=priest+vessel; adjacency zero-gap"
        en: >
          THE ROLE TABLE [claim LV01B-02]. Slaughter is valid by non-priests
          — laymen, women, bondsmen, even the unclean — while hand-laying-
          to-slaughter runs same-place and IMMEDIATE (zero-gap adjacency);
          at 'vehikrivu' the pipeline crosses to the priesthood: RECEIVING
          the blood needs a fit priest and a ministering vessel (challalim
          and the blemished excluded), with the R. Tarfon/R. Akiva
          receiving-vs-dashing dispute on record.
        cites: ["Sifra, Vayikra Dibbura DeNedavah, Section 4 1", "Sifra, Vayikra Dibbura DeNedavah, Section 4 2", "Sifra, Vayikra Dibbura DeNedavah, Section 4 4", "Sifra, Vayikra Dibbura DeNedavah, Section 4 5", "Sifra, Vayikra Dibbura DeNedavah, Section 4 6"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(blood_stage, two_that_are_four) — BLOOD ALGORITHM: two-that-are-four; spill recovery state-dependent; device+site preconditions"
        en: >
          THE BLOOD STAGE [claim LV01B-03]. 'Roundabout' + 'they shall dash'
          = TWO applications that are FOUR (diagonal corners; R. Yishmael
          derives four-with-pauses by identity). Spill recovery is state-
          dependent: from the vessel — gathered and valid; from the throat —
          never received, invalid. Device and site preconditions: a broken
          altar-horn invalidates; no service with the tent dismantled or the
          curtain furled. Blood mixtures: with olah, temurah, or
          unconsecrated — offered; with invalid or inner offerings — not.
        cites: ["Sifra, Vayikra Dibbura DeNedavah, Section 4 9", "Sifra, Vayikra Dibbura DeNedavah, Section 4 10", "Sifra, Vayikra Dibbura DeNedavah, Section 4 11", "Sifra, Vayikra Dibbura DeNedavah, Section 4 13", "Sifra, Vayikra Dibbura DeNedavah, Section 4 14", "Sifra, Vayikra Dibbura DeNedavah, Section 4 7"]
        confidence: witnessed
    comment: >
      Top split L mark=etnachta (major mid-verse rest); maps_to this verse only.
    confidence: hypothesis
    source: "[HE-WRITTEN][HE-STRUCT]"

