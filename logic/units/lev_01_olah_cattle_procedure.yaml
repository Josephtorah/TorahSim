    en: "[EN-AID] From top split: LEFT «וערכו בני אהרן הכהנים את הנתחים את הראש ואת הפדר» / RIGHT «על העצים אשר על האש אשר על המזבח». Derive claim from Hebrew arms. Lev 1:8."
    tree_left:
      he: וערכו בני אהרן הכהנים את הנתחים את הראש ואת הפדר
      he_translit: "v'rkv bny 'hrn hkhnym 't hntchym 't hr'sh v't hpdr"
