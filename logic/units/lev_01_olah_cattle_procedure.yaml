  - id: STEP_Lv_1_7
    order: 4
    ref: "Lev.1.7"
    op: ETNACHTA_SPLIT
    he: ונתנו בני אהרן הכהן אש על המזבח … וערכו עצים על האש
    he_translit: "vntnv bny 'hrn hkhn 'sh 'l hmzbch … v'rkv 'tzym 'l h'sh"
    en: "[EN-AID] From top split: LEFT «ונתנו בני אהרן הכהן אש על המזבח» / RIGHT «וערכו עצים על האש». Derive claim from Hebrew arms. Lev 1:7."
    tree_left:
      he: ונתנו בני אהרן הכהן אש על המזבח
      he_translit: "vntnv bny 'hrn hkhn 'sh 'l hmzbch"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: וערכו עצים על האש
      he_translit: "v'rkv 'tzym 'l h'sh"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(fire_stage, man_made_uniform_checked) — FIRE: man-made though heaven-sent; uniform check; wood spec; two logs"
        en: >
          THE FIRE STAGE [claim LV01B-04]. Though fire DESCENDS from Heaven,
          man-made fire is commanded (the heavenly fire's history recorded:
          Moses' to the Temple, Solomon's to Menasheh). The UNIFORM CHECK:
          high priest in a common priest's vestments — invalid, and the
          reverse. Wood upon the fire (order); all species EXCEPT olive and
          grapevine; R. Shimon reads TWO extra logs at the afternoon daily
          from the plural — a quantity read off morphology; communal-wood
          dispute recorded.
        cites: ["Sifra, Vayikra Dibbura DeNedavah, Chapter 5 8", "Sifra, Vayikra Dibbura DeNedavah, Chapter 5 9", "Sifra, Vayikra Dibbura DeNedavah, Chapter 5 10", "Sifra, Vayikra Dibbura DeNedavah, Chapter 5 11", "Sifra, Vayikra Dibbura DeNedavah, Chapter 6 4", "Sifra, Vayikra Dibbura DeNedavah, Chapter 6 5"]
        confidence: witnessed
    comment: >
      Top split L mark=etnachta (major mid-verse rest); maps_to this verse only.
    confidence: hypothesis
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Lv_1_8
    order: 5
    ref: "Lev.1.8"
    op: ETNACHTA_SPLIT
    he: וערכו בני אהרן הכהנים את הנתחים את הראש ואת הפדר … על העצים אשר על האש אשר על המזבח
