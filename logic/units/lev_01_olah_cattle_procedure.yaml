    order: 6
    ref: "Lev.1.9"
    op: ETNACHTA_SPLIT
    he: וקרבו וכרעיו ירחץ במים … והקטיר הכהן את הכל המזבחה עלה אשה ריח ניחוח ליהוה
    he_translit: "vqrbv vkr'yv yrchtz bmym … vhqtyr hkhn 't hkl hmzbchh 'lh 'shh rych nychvch l"
    en: "[EN-AID] From top split: LEFT «וקרבו וכרעיו ירחץ במים» / RIGHT «והקטיר הכהן את הכל המזבחה עלה אשה ריח ניחוח ליהוה». Derive claim from Hebrew arms. Lev 1:9."
    tree_left:
