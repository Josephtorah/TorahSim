      he_translit: "vqrbv vkr'yv yrchtz bmym"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: והקטיר הכהן את הכל המזבחה עלה אשה ריח ניחוח ליהוה
      he_translit: "vhqtyr hkhn 't hkl hmzbchh 'lh 'shh rych nychvch lyhvh"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(burn_close, no_return_intent_ladder) — CLOSE: wash any-amount water; no-return above altar; the-whole attached; 5-term intent"
        en: >
          THE BURN CLOSE [claim LV01B-05]. Washing 'with water' — ANY
          amount, not wine (unbounded where the bather's law binds forty
          seah). THE NO-RETURN RULE: once upon the altar, even the invalid,
          escaped, piggul, notar, or unclean is smoked — 'upon the altar' is
          the boundary. 'The whole' carries attached bone, sinew, horn,
          hoof; detached is extracted. The INTENT LADDER: olah, fire, savor,
          sweet, to-the-LORD — five intent parameters; Onkelos converts the
          savor throughout to 'an offering RECEIVED WITH FAVOR' — the return
          value de-anthropomorphized by the buffer.
        cites: ["Sifra, Vayikra Dibbura DeNedavah, Chapter 6 7", "Sifra, Vayikra Dibbura DeNedavah, Chapter 6 8", "Sifra, Vayikra Dibbura DeNedavah, Chapter 6 9", "Sifra, Vayikra Dibbura DeNedavah, Chapter 6 10", "Onkelos Lev 1:9"]
        confidence: witnessed
