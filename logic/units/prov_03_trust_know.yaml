decision_table:
  columns_note: >
    WHEN cells are Hebrew-grounded stance/actions from the dual and know-command.
    THEN cells are Hebrew-grounded prohibitions or divine results.
    Not temple casuistry; instructional wisdom only. Not binding law.
  rows:
    - id: R_dual_trust_no_lean
      when:
        - id: W_trust_YHWH
          he: "בטח אל יהוה"
          he_translit: "betach el YHWH"
          en: "trust toward YHWH"
          comment: >
            Positive imperative brick B0 (dehi). Condition = the stance commanded,
            not a prior case feature like gender.
          tags: ["[HE-WRITTEN]"]
          confidence: tested
          source: "Prov 3:5; taamim v3 B0"
        - id: W_all_heart
          he: "ב/כל לב/ך"
          he_translit: "be-khol libbekha"
          en: "with all your heart"
          comment: "Manner/scope on the trust command (B1 to etnachta)."
          tags: ["[HE-WRITTEN]"]
          confidence: tested
          source: "Prov 3:5; taamim v3 B1"
      then:
        - id: T_no_lean
          he: "אל תשען"
          he_translit: "al tishsha'en"
          en: "do not lean"
          comment: >
            Parallel prohibitive half (B3). Paired object: ו/אל בינת/ך / ve-el binatekha /
            "and toward your understanding" (B2) — lean-target of the prohibition.
          tags: ["[HE-WRITTEN]"]
          confidence: tested
          source: "Prov 3:5; taamim v3 B2–B3"
      row_comment: >
        English summary: Dual instruction — trust YHWH with the whole heart,
        and do not lean on your own understanding. Both arms are commands (TIR-023),
        not condition→result. Tree: etnachta A ‖ B.
      confidence: hypothesis
      source: "[HE-WRITTEN][HE-STRUCT]"

    - id: R_know_then_straighten
      when:
        - id: W_know_all_ways
          he: "ב/כל דרכי/ך דע/הו"
          he_translit: "be-khol derakhekha da'ehu"
          en: "in all your ways know Him"
          comment: "Left half of 3:6 (etnachta); command / IF-arm (TIR-024)."
          tags: ["[HE-WRITTEN]"]
          confidence: tested
          source: "Prov 3:6; taamim v3 B0"
      then:
        - id: T_he_straightens
          he: "ו/הוא יישר ארחתי/ך"
          he_translit: "ve-hu yeyashsher orchotekha"
          en: "and He will straighten your paths"
          comment: >
            Right half: agent ו/הוא / ve-hu / "and He" + effect יישר ארחתי/ך /
            yeyashsher orchotekha / "will straighten your paths".
          tags: ["[HE-WRITTEN]"]
          confidence: tested
          source: "Prov 3:6; taamim v3 B1–B2"
      row_comment: >
        English summary: If/when you know Him in all your ways, He straightens your paths.
