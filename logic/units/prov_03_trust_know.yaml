    - from: "Prov.3.5 B2–B3 אל תשען on בינת/ך"
      to: "P3–P4"
      relation: "prohibition + forbidden lean-target"
    - from: "Prov.3.6 top left"
      to: "R_know_then_straighten.when"
      relation: "command (IF / DO arm)"
    - from: "Prov.3.6 top right"
      to: "R_know_then_straighten.then"
      relation: "YHWH result (THEN arm)"
    - from: "Prov.3.6 B1 ו/הוא"
      to: "P6 agent"
      relation: "subject of straighten = He (YHWH context from 3:5)"

