          end_mark: silluq
          he: "יישר ארחתי/ך"
          he_translit: "yeyashsher orchotekha"
          en: "will straighten your paths"
          role_en: "divine_result_straighten"
      tree_ascii: |
        PHRASE (binary 6w) בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ וְ֝/ה֗וּא יְיַשׁ…
        ├── [0-2] GLUE בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ (atnach, rank=1)
        └── PHRASE (binary 3w) וְ֝/ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ
            ├── [3] וְ֝/ה֗וּא (revia, rank=3)
            └── [4-5] GLUE יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ (silluq, rank=1)
      maps_to:
