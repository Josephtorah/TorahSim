            he_translit: "be-khol derakhekha da'ehu"
            en: "in all your ways know Him"
        right_half:
          phrase:
            he: "ו/הוא יישר ארחתי/ך"
            he_translit: "ve-hu yeyashsher orchotekha"
            en: "and He will straighten your paths"
      nested_bricks:
