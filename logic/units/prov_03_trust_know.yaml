      (e.g. midrash on trust / binah) — not merged into Written.
    tags: ["[ORAL]"]
    confidence: hypothesis

  - step: H
    name_en: "Scenarios"
    comment: >
      Three English-readable cases testing dual commands and know→straighten chain;
      expectations cite rule ids only.
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: I
    name_en: "English-leakage review"
    comment: >
      Conditions quote Hebrew first. English free glosses marked [EN-AID].
      Checklist filled below; freeze blocked until re-read.
    tags: ["[EN-AID]"]
    confidence: hypothesis

  - step: J
    name_en: "Freeze"
    comment: >
      status remains draft. Not frozen. No interpreter may invent rules from this unit.
    tags: []
    confidence: hypothesis

