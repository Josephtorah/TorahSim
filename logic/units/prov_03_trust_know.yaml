derivation_log:
  - step: A
    name_en: "Choose the unit"
    comment: >
      After Prov full-book smoke (915/915 structural pass) and locked goldens on
      Prov.3.5 / Prov.3.6, start first Pre-Code poetry unit on this dual.
      Hebrew book: מִשְׁלֵי / Mishlei / "Proverbs"; range 3:5–6.
      Why: clearest instructional dual + consequence chain already golden-locked.
    tags: ["[HE-WRITTEN]"]
    confidence: established

  - step: B
    name_en: "Load Hebrew source (English aid only)"
    comment: >
      Hebrew from morphhb OSHB Prov.xml via taamim_tree_parse.py (book_file_for_osis).
      No English translation used as derivation input. Free en glosses are [EN-AID] only.
    tags: ["[HE-WRITTEN]", "[EN-AID]"]
    confidence: tested

  - step: C
    name_en: "Segment structure (BINARY / ta'amim trees FIRST)"
    comment: >
      Parsed Prov.3.5 and Prov.3.6 with taamim_tree_parse.py rule_set v3 poetry.
      Both unique, pure_binary, leaf_complete. Full tree_ascii stored under binary_trees.
      Top splits both at etnachta (rank-1 mid-verse rest in poetry).
    tags: ["[HE-STRUCT]"]
    confidence: tested

  - step: D
    name_en: "Extract predicates and outcomes from Hebrew"
    comment: >
      3:5 LEFT: בטח אל יהוה / betach el YHWH / "trust toward YHWH"
      + manner ב/כל לב/ך / be-khol libbekha / "with all your heart".
      3:5 RIGHT: אל תשען / al tishsha'en / "do not lean" on ו/אל בינת/ך / ve-el binatekha /
      "and toward your understanding".
      3:6 LEFT: ב/כל דרכי/ך דע/הו / be-khol derakhekha da'ehu / "in all your ways know Him".
      3:6 RIGHT: ו/הוא יישר ארחתי/ך / ve-hu yeyashsher orchotekha / "and He will straighten your paths".
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: E
    name_en: "Choose logic format(s)"
    comment: >
      decision_table + sparse rules (not pure casuistic WHEN gender THEN days).
      3:5 = parallel dual_imperative (positive ‖ prohibitive).
      3:6 = command_then_result (know → He straightens).
      Optional coarse FSM for agent stance (leaning on self vs trusting YHWH).
    tags: ["[INFER]"]
    confidence: hypothesis

  - step: F
    name_en: "Fill trilingual logic objects"
    comment: >
      Every atom he + he_translit + en; phrase_map from glue bricks; tree_coverage
      100% words (15); rules R_dual_trust_no_lean, R_know_then_straighten.
    tags: ["[HE-WRITTEN]"]
    confidence: hypothesis

  - step: G
    name_en: "Optional Oral attachments"
    comment: >
