          Etnachta splits command (LEFT) from divine result (RIGHT).
          TIR-001-style setup vs consequence, adapted for poetry instruction (TIR-024).
          LEFT ends on דע/הו / da'ehu / "know Him"; RIGHT agent ו/הוא / ve-hu / "and He"
          then effect יישר ארחתי/ך / yeyashsher orchotekha / "will straighten your paths".
        left_half:
