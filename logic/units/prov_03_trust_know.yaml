          he: "ב/כל לב/ך"
          he_translit: "be-khol libbekha"
          en: "with/in all your heart"
          role_en: "manner_scope_all_heart"
        - id: B2
          words: [5, 6]
          end_mark: revia
          he: "ו/אל בינת/ך"
          he_translit: "ve-el binatekha"
          en: "and toward your understanding"
          role_en: "prohibited_lean_target"
        - id: B3
          words: [7, 8]
          end_mark: silluq
          he: "אל תשען"
          he_translit: "al tishsha'en"
          en: "do not lean / do not rely"
          role_en: "prohibitive_imperative"
      tree_ascii: |
        PHRASE (binary 9w) בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בּ…
        ├── PHRASE (binary 5w) בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ
        │   ├── [0-2] GLUE בְּטַ֣ח אֶל יְ֭הוָה (dehi, rank=2)
        │   └── [3-4] GLUE בְּ/כָל לִבֶּ֑/ךָ (atnach, rank=1)
        └── PHRASE (binary 4w) וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן
