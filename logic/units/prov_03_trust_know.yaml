        en: "Trust toward YHWH with all your heart, and toward your understanding do not lean."
        en_note: "Free gloss [EN-AID]; not a legal ruling."
      top_binary_split:
        comment: >
          Etnachta (poetry rank 1) splits dual: LEFT = positive trust-cluster;
          RIGHT = prohibitive lean-cluster. Pattern TIR-023 (poetry dual imperative ‖).
          Not condition vs consequence (both arms are commands).
        left_half:
          phrase:
            he: "בטח אל יהוה ב/כל לב/ך"
            he_translit: "betach el YHWH be-khol libbekha"
            en: "Trust toward YHWH with all your heart"
        right_half:
          phrase:
            he: "ו/אל בינת/ך אל תשען"
            he_translit: "ve-el binatekha al tishsha'en"
            en: "and toward your understanding do not lean"
      nested_bricks:
        - id: B0
          words: [0, 1, 2]
          end_mark: dehi
          he: "בטח אל יהוה"
          he_translit: "betach el YHWH"
          en: "trust toward YHWH"
          role_en: "positive_imperative_core"
        - id: B1
          words: [3, 4]
