scenarios:
  - id: SC1_full_chain
    description_en: >
      A person trusts toward YHWH with all the heart, does not lean on their own
      understanding, and knows Him in all their ways.
    inputs_en: >
      Stance matches בטח אל יהוה ב/כל לב/ך / betach el YHWH be-khol libbekha /
      "trust toward YHWH with all your heart"; avoids אל תשען / al tishsha'en /
      "do not lean" on בינת/ך / binatekha / "your understanding"; does
      ב/כל דרכי/ך דע/הו / be-khol derakhekha da'ehu / "in all your ways know Him".
    expected:
      - field: "dual_commands"
        value_en: "both arms of the dual satisfied"
        value_he: "בטח … ואל תשען"
        value_he_translit: "betach … ve-al tishsha'en"
        justified_by: "R_dual_trust_no_lean"
      - field: "paths"
        value_en: "He straightens the paths"
        value_he: "יישר ארחתי/ך"
        value_he_translit: "yeyashsher orchotekha"
        justified_by: "R_know_then_straighten"
    comment: >
      Full written chain of 3:5–6. Result agent is ו/הוא / ve-hu / "and He".
    confidence: hypothesis

  - id: SC2_lean_on_binah
    description_en: >
      A person relies on their own understanding and does not take the trust dual.
    inputs_en: >
      Acts as leaning on בינת/ך / binatekha / "your understanding" contrary to
      אל תשען / al tishsha'en / "do not lean".
    expected:
      - field: "prohibition"
        value_en: "violates prohibitive arm of dual"
        value_he: "אל תשען"
        value_he_translit: "al tishsha'en"
        justified_by: "R_dual_trust_no_lean"
    comment: >
      Does not invent extra punishments; only flags the written prohibition.
    confidence: hypothesis

  - id: SC3_know_without_claiming_extra
    description_en: >
      Someone knows Him in all ways; text states He will straighten paths.
    inputs_en: >
      Matches ב/כל דרכי/ך דע/הו / be-khol derakhekha da'ehu /
      "in all your ways know Him".
    expected:
      - field: "result"
        value_en: "and He will straighten your paths"
        value_he: "ו/הוא יישר ארחתי/ך"
        value_he_translit: "ve-hu yeyashsher orchotekha"
        justified_by: "R_know_then_straighten"
    comment: >
      No English-only conditions (e.g. "success in career") added beyond ארחתי/ך /
      orchotekha / "your paths".
    confidence: hypothesis

