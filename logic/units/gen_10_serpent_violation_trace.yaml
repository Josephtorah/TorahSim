boot_steps:
  - id: STEP_Gn_3_1
    order: 1
    ref: "Gen.3.1"
    op: SERPENT_ONSET_INVERTED_QUOTE
    he: וְהַנָּחָשׁ הָיָה עָרוּם מִכֹּל חַיַּת הַשָּׂדֶה אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים וַיֹּאמֶר אֶל־הָאִשָּׁה אַף כִּי־אָמַר אֱלֹהִים לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן
    he_translit: "ve-ha-nachash hayah arum mi-kol chayat ha-sadeh asher asah YHWH Elohim va-yomer el-ha-ishah af ki-amar Elohim lo tokhlu mi-kol etz ha-gan"
    en: "[EN-AID/JPS] Now the serpent was more subtle than any beast of the field which the LORD God had made. And he said unto the woman: 'Yea, hath God said: Ye shall not eat of any tree of the garden?'"
    tree_left:
      he: והנחש היה ערום מכל חית השדה אשר עשה יהוה אלהים
      he_translit: "ve-ha-nachash hayah arum mi-kol chayat ha-sadeh asher asah YHWH Elohim"
      en: "the credentials: cunning — and MADE by YHWH Elohim (etnachta arm)"
    tree_right:
      he: ויאמר אל האשה אף כי אמר אלהים לא תאכלו מכל עץ הגן
      he_translit: "va-yomer el-ha-ishah af ki-amar Elohim lo tokhlu mi-kol etz ha-gan"
      en: "the question carrying the inverted quote"
    operators:
      - op: PRECONDITION_STATE
        expr_en: "HOLDS(arum(nachash), t0) ∧ HOLDS(asah_YHWH_Elohim(nachash), t0)"
        he: וְהַנָּחָשׁ הָיָה עָרוּם … אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים
        he_translit: "ve-ha-nachash hayah arum … asher asah YHWH Elohim"
        en: >
          The onset is a STATE clause (haya, perfect — the 1:2/2:5
          background device): the serpent enters described, not
          acting. Two credentials: CUNNING (arum — one Torah token;
          2:25's naked, arumim, is its letter-twin one verse back:
          the pun is the seam between the units) and MADE (asher
          asah YHWH Elohim — the accent tree closes its first arm on
          the maker's compound name: a creature is bracketed before
          a speaker gets to talk). Onkelos: CHAKIM ('wise') — the
          SAME word the translation gave the knowledge-tree's eaters
          at 2:9/2:17: in Aramaic the serpent already IS what the
          tree promises to make you (Tier-A, dual-track; the pun
          levels away).
        cites: ["TIR-031"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "nachash, ishah, gan are READ without prior install (standalone machine; the woman of gen_09, the garden of gen_08)"
        en: "flag, not fix — the scene's cast enters presupposed"
        cites: []
        confidence: tested
      - op: EVENT
        expr_en: "say(e1) ∧ Agent(e1, nachash) ∧ Theme(e1, ishah)"
        he: וַיֹּאמֶר אֶל־הָאִשָּׁה אַף כִּי־אָמַר אֱלֹהִים
        he_translit: "va-yomer el-ha-ishah af ki-amar Elohim"
        en: >
          THE CORPUS'S FIRST NON-HUMAN SPEECH — and it opens the
          corpus's first CONVERSATION (nine speech acts in this
          span). The form is a QUESTION carrying a QUOTE: af ki
          ('really? even though...' — Onkelos be-kushta, 'in
          truth?'). What is quoted is gen_08's frozen rule — see
          the two deltas below.
        cites: []
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'akhol tokhel mi-kol etz ha-gan + one exclusion (gen_08 2:16-17: permission over ALL, prohibition on ONE)' delivered 'lo tokhlu mi-kol etz ha-gan (the serpent: negation over ALL — the scope INVERTED, and the addressee pluralized 2ms->2mp)'"
        en: "quote-diff 1-2 of 7: the rule's shape flipped from nearly-everything-permitted to everything-forbidden; the single addressee became a pair"
        cites: []
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'YHWH_Elohim (the rule's issuer, gen_08 2:16 — the Eden-exclusive compound)' delivered 'Elohim (the serpent's bare generic; the compound vanishes for exactly 3:1b-5 and returns at 3:8 — DB-verified window)'"
        en: >
          quote-diff 3 of 7: the divine name reduced in the
          serpent's mouth — and the woman will answer in kind.
          Onkelos LEVELS this (its serpent says the divine name):
          the Hebrew's name census is invisible in translation —
          the letter's finding stands on the letter (dual-track).
        cites: []
        confidence: tested
    comment: >
      A creature made by YHWH Elohim quotes Elohim: the credential
