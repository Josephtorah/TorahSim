    he: וַיִּשְׁמְעוּ אֶת־קוֹל יְהוָה אֱלֹהִים מִתְהַלֵּךְ בַּגָּן לְרוּחַ הַיּוֹם וַיִּתְחַבֵּא הָאָדָם וְאִשְׁתּוֹ מִפְּנֵי יְהוָה אֱלֹהִים בְּתוֹךְ עֵץ הַגָּן
    he_translit: "va-yishme'u et-qol YHWH Elohim mithalekh ba-gan le-ruach ha-yom va-yitchabe ha-adam ve-ishto mi-penei YHWH Elohim be-tokh etz ha-gan"
    en: "[EN-AID/JPS] And they heard the voice of the LORD God walking in the garden toward the cool of the day; and the man and his wife hid themselves from the presence of the LORD God amongst the trees of the garden."
    tree_left:
      he: וישמעו את קול יהוה אלהים מתהלך בגן לרוח היום
