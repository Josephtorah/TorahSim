state_after:
  - id: AFTER_S_testimony
    en: >
      WORLD: 1 install — chagorot (the girdles): the violation trace
      adds exactly one object to the world. Standing facts: the
      serpent's two credentials, the testimony chain
      (feared-naked-hid), and TWO ADMISSIONS (admission_va_okhel:
      adam, ishah). REGISTRY: no writes. SPECS: EMPTY END TO END —
      the first unit since gen_01 in which no demand is ever issued;
      gen_08's two OPEN demands and armed HANDLER stand outside this
      standalone unit, untouched, with the trigger events now on
      this unit's record (cross-unit firing = Stage E). TESTS: 1
      PASS — creature-run (the woman's), true on its criterion and
      beside the rule's point. LEDGER: EMPTY. FLAGS:
      read_before_install x5 (nachash, ishah, gan, ha_etz, adam),
      spec_delta x7 (the quote-diffs: inversion, pluralization,
      name-reduction; de-totalization; relocation; the fence; the
      softened penalty) — none blocking: flags are data, and this
      unit is the corpus's first whose flags ARE its findings.

