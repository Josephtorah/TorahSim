        he_translit: "va-yishme'u et-qol YHWH Elohim mithalekh ba-gan"
        en: >
          THE COMPOUND NAME RETURNS — twice in this verse: the bare
          Elohim window (3:1b-5, the serpent's dialogue) closes the
