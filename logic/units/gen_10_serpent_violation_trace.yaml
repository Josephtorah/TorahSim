state_machine:
  comment_en: "Eden III (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 3:1 — all registers empty (standalone unit)"
    - id: S_serpent_quote
      en: "After 3:1 — serpent credentialed (state facts); cast flagged presupposed; quote-diffs 1-3 flagged; SPECS empty"
    - id: S_woman_quote
      en: "After 3:2-3 — the amended quote: diffs 4-7 flagged (fence added, penalty softened); SPECS still empty"
    - id: S_contradiction
      en: "After 3:4-5 — the negated doubling flagged; the counter-theory held as claim event (no demand)"
    - id: S_trigger
      en: "After 3:6 — creature-run TEST PASS on the books; the trigger events recorded (took, ate, gave, ate)"
    - id: S_opened
