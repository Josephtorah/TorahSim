    - id: S_interrogation
      en: "After 3:9-11 — the docket open: where / who told / have-you-eaten (the rule quoted back, third form)"
    - id: S_testimony
      en: "After 3:12-13 — two admissions held (both ending va-okhel); the deceit hapax on record; LEDGER empty; SPECS empty end to end"
  transitions:
    - {from: S_boot, to: S_serpent_quote, via: STEP_Gn_3_1}
    - {from: S_serpent_quote, to: S_woman_quote, via: STEP_Gn_3_2}
    - {from: S_woman_quote, to: S_woman_quote, via: STEP_Gn_3_3}
    - {from: S_woman_quote, to: S_contradiction, via: STEP_Gn_3_4}
    - {from: S_contradiction, to: S_contradiction, via: STEP_Gn_3_5}
