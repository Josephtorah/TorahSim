        he: וַיִּתְחַבֵּא הָאָדָם וְאִשְׁתּוֹ … בְּתוֹךְ עֵץ הַגָּן
        he_translit: "va-yitchabe ha-adam ve-ishto … be-tokh etz ha-gan"
