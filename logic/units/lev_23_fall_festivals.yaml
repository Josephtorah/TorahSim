          'Children of Israel' — not gentiles; converts and slaves by 'for
          you.' R. Eliezer: shabbaton = the day's holiness, mikra kodesh =
          sanctify it; R. AKIVA'S PARSE: shabbaton = REST, zikaron = the
          ZIKHRONOT, teruah = the SHOFAROT, mikra kodesh = the day's
          holiness; MALKHUYOT from 'the LORD your God... in the seventh
          month' (R. Yosei b. R. Yehuda's building block from Num 10:10:
          wherever zikhronot, adjoin malkhuyot). THE ORDER: R. Yochanan b.
          Nuri — malkhuyot with the Name's holiness and no blast; R. Akiva
          — 'if no blast, why mention them?' — malkhuyot with the day's
          holiness and blast; Rabbi — the fourth; R. Shimon b. Gamliel —
          the middle; the USHA episode recording both practices at Yavneh.
          And ONKELOS DEFINES THE SOUND: דּוּכְרַן יַבָּבָא ('a memorial
          of the BROKEN CRY').
