          instrument a SHOFAR — Lev 25:9's spare 'in the seventh month'
          makes the Jubilee's blast the model; a PLAIN blast before and
          after from 'pass a shofar of teruah' / 'pass a shofar'; THREE
          SETS OF THREE from three verses (Lev 25:9, Lev 23:24, Num 29:1);
          'seventh month'-'seventh month' — the Jubilee's rules to Rosh
          Hashanah and back. Every parameter of the day's sound fetched by
          verbal analogy from Lev 25.
