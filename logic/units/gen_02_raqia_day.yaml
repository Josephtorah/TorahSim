boot_steps:
  - id: STEP_Gn_1_6
    order: 1
    ref: "Gen.1.6"
    op: DECLARE_TWO_MOOD_SPEC
    he: וַיֹּאמֶר אֱלֹהִים יְהִי רָקִיעַ בְּתוֹךְ הַמָּיִם וִיהִי מַבְדִּיל בֵּין מַיִם לָמָיִם
    he_translit: "va-yomer Elohim yehi raqia be-tokh ha-mayim vi-yhi mavdil bein mayim la-mayim"
    en: "[EN-AID/JPS] And God said: 'Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.'"
    tree_left:
      he: ויאמר אלהים יהי רקיע בתוך המים
      he_translit: "va-yomer Elohim yehi raqia be-tokh ha-mayim"
      en: "speech act + existence fiat + location (etnachta arm)"
    tree_right:
      he: ויהי מבדיל בין מים למים
      he_translit: "vi-yhi mavdil bein mayim la-mayim"
      en: "the job spec: a standing divider between waters"
    operators:
      - op: ORAL_UTTERANCE
        expr_en: "UTTERANCE(3, fiat) — ma'amar census (Avot 5:1)"
        en: >
          va-yomer Elohim yehi raqia — the third utterance of the ten by the
          STANDARD census (bereshit + each va-yomer; Rosh Hashanah 32a,
          read at the gen_01 triage; Bereshit Rabbah 17:1 the census
          primary). ORDINALS ARE DISPUTE-RELATIVE (unification 2026-08-23,
          TorahSim's catch): under the recorded census dissent carried at
          day one (R. Yaakov ben Kurshai counts ruach of 1:2), this verse
          is the FOURTH — the machloket renumbers every later position
          without touching this verse's membership. The machine keeps the
          standard count; the dispute-relative numbering rides as note
          (the dispute itself lives in gen_01's UTTERANCES_DISPUTED, its
          home span). Standalone machine keeps its local count —
          cross-unit chaining is Stage E.
        cites: ["Rosh Hashanah 32a:19", "Bereshit Rabbah 17:1"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(exists(raqia)))"
        he: יְהִי רָקִיעַ
        he_translit: "yehi raqia"
        en: >
          yehi here is CODED JUSSIVE (Vqj3ms) — a clean LET; location rider
          be-tokh ha-mayim (in the midst of the waters). AMENDMENT
          2026-08-23 — the chain's readings recorded dual-track: the
          TWO-PHASE BUILD (Rav, both Talmuds: 'the works were FLUID on day
          one, and on the second they CONGEALED' — yehi as YECHEZAQ, 'let
          it STRENGTHEN', with the Jerusalem Talmud's full verb set:
          strengthen / congeal / skin over / stretch); the raqia lexeme
          derived from HAMMERED SHEETS by wording-analogy to Exod 39:3
          (va-yeraq'u — middah E7, gezerah shavah at narrative strength);
          be-tokh read as exact midpoint (be-tavekh, R. Bun). The operator
          stands as derived — the machine's LET is clean; the chain's
          strengthen-the-existing reading rides beside it, never merged.
          Standing practice note: the MONDAY FAST of the watches hangs on
          this very verse — 'on the second day they fast for those who set
          sail — va-yomer Elohim yehi raqia' (Jerusalem Talmud Taanit
          4:3:3, re-verdicted material for this span): the water-division's
          peril acknowledged weekly.
        cites: ["TIR-026", "Bereshit Rabbah 4:2", "Jerusalem Talmud Berakhot 1:1:23", "Jerusalem Talmud Taanit 4:3:3"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET?(mavdil(raqia, mayim|mayim)))"
        he: וִיהִי מַבְדִּיל
        he_translit: "vi-yhi mavdil"
        en: "SAME speech act, second directive. vi-yhi is CODED IMPERFECT (Vqi3ms) — the ? is mandatory and never auto-upgraded; contrast the jussive yehi two words earlier: the text itself switches mood between the existence demand and the job demand"
        cites: ["TIR-028"]
        confidence: "tested as flag; resolution per-unit only"
      - op: INVARIANT
        expr_en: "INVARIANT(mavdil(raqia, mayim|mayim)) during t_open"
        he: מַבְדִּיל
        he_translit: mavdil
        en: "participle (Vhrmsa, hifil) = a STANDING JOB, not an event: the firmament's duty is continuous division — spec as invariant"
        cites: ["TIR-031"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "mayim are READ without prior install (standalone machine; gen_01 installed them by narration — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
    comment: >
      Top split L=etnachta after ha-mayim: [fiat+location | job spec]. The
      two-mood spec is the verse's signature: jussive for BE, imperfect for
      DO — existence commanded cleanly, function stated with the form that
      cannot distinguish command from future (TIR-028 discipline).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_7
    order: 2
    ref: "Gen.1.7"
    op: BUILD_DIVIDE_RESULT
    he: וַיַּעַשׂ אֱלֹהִים אֶת־הָרָקִיעַ וַיַּבְדֵּל בֵּין הַמַּיִם אֲשֶׁר מִתַּחַת לָרָקִיעַ וּבֵין הַמַּיִם אֲשֶׁר מֵעַל לָרָקִיעַ וַיְהִי־כֵן
    he_translit: "va-ya'as Elohim et-ha-raqia va-yavdel bein ha-mayim asher mi-tachat la-raqia u-vein ha-mayim asher me-al la-raqia va-yehi khen"
    en: "[EN-AID/JPS] And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament; and it was so."
    tree_left:
      he: ויעש אלהים את הרקיע ויבדל בין המים אשר מתחת לרקיע ובין המים אשר מעל לרקיע
      he_translit: "va-ya'as … va-yavdel … me-al la-raqia"
      en: "build event + partition event with asher-located sides (etnachta arm)"
    tree_right:
      he: ויהי כן
      he_translit: "va-yehi khen"
      en: "the generic RESULT formula"
    operators:
      - op: EVENT
        expr_en: "make(e1) ∧ Agent(e1, Elohim) ∧ Theme(e1, raqia)"
        he: וַיַּעַשׂ אֱלֹהִים אֶת־הָרָקִיעַ
        he_translit: "va-ya'as Elohim et-ha-raqia"
        en: "wayyiqtol build event; et marks the Theme"
        cites: ["TIR-014"]
        confidence: tested
      - op: EVENT_PARTITION
        expr_en: "divide(e2, Agent Elohim, between(mayim-under, mayim-over)) ⇒ mayim-under ∩ mayim-over = ∅"
        he: בֵּין הַמַּיִם … וּבֵין הַמַּיִם
        he_translit: "bein ha-mayim … u-vein ha-mayim"
        en: "the two sides are LOCATED by asher-clauses (which-under / which-over la-raqia): the partition is defined relative to the thing just built"
        cites: []
        confidence: "event tested; partition reading hypothesis"
      - op: WITNESS_STATE
        expr_en: "WITNESS(mayim_elyonim, suspended_by_maamar) — the upper waters hang by the word"
        en: >
          R. Tanchuma's letter argument on the unit's own preposition: the
          text says ME-AL la-raqia ('from ABOVE the firmament'), not AL
          ('on') — so the upper waters do not REST on the built thing; THEY
          ARE SUSPENDED BY THE MA'AMAR (Bereshit Rabbah 4:3; R. Meir's
          demonstration to the challenger, 4:4). The GAP's geometry rides
          beside it as a recorded dispute, never decided: vast as
          earth-to-firmament (4:3) vs ben Zoma's three fingerbreadths
          (Chagigah 15a); ratio exceed-by-thirty — derived by letter-value,
          lamed = 30 in la-mayim (middah E29, gematria; unification
          2026-08-23) — vs half-and-half (4:5);
          R. Yochanan's half-to-raqia half-to-ocean (4:4). Outcome
          converged and only it is state: a standing separation, maintained
          by the word, whatever its measure. Typed anchor: Ps 148:4 — 'the
          waters that are ABOVE the heavens' still praising: the later text
          that finds this state. Middah note: diqduq on the preposition —
          letter-level, honestly unnumbered. WITNESS-GROUNDED TIER (owner
          ruling 2026-08-20): never mixed into text-grounded facts.
        cites: ["Bereshit Rabbah 4:3", "Bereshit Rabbah 4:4", "Chagigah 15a:4"]
        confidence: "witness-grounded (aggadic tier); geometry = recorded dispute"
      - op: RESULT
        expr_en: "HOLDS(exists(raqia), t2) — va-yehi khen pops the jussive spec"
        he: וַיְהִי־כֵן
        he_translit: "va-yehi khen"
        en: "GENERIC result formula ('and it was so') — a summary discharge, NOT a verbatim echo of the spec (day 1 remains the only verbatim day)"
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(mavdil(raqia, mayim|mayim), t2) — the job demand discharged by the divide event"
        he: וַיַּבְדֵּל
        he_translit: "va-yavdel"
        en: "satisfaction is NOT upgrade: the demand is met, but its mood stays LET? on the log (TIR-028 — the ? records what the FORM could not tell us)"
        cites: ["TIR-028"]
        confidence: tested
    comment: >
      Build verse: two events, one summary RESULT covering both demands.
      NOTE the absence beginning here: no inspection, no PASS(tov) — day 2
      has no test anywhere.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_8
    order: 3
    ref: "Gen.1.8"
    op: NAME_AND_COMMIT_NO_TEST
    he: וַיִּקְרָא אֱלֹהִים לָרָקִיעַ שָׁמָיִם וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם שֵׁנִי
    he_translit: "va-yiqra Elohim la-raqia shamayim va-yehi erev va-yehi voqer yom sheni"
    en: "[EN-AID/JPS] And God called the firmament Heaven. And there was evening and there was morning, a second day."
    tree_left:
      he: ויקרא אלהים לרקיע שמים
      he_translit: "va-yiqra Elohim la-raqia shamayim"
      en: "one registry write via the naming formula"
    tree_right:
      he: ויהי ערב ויהי בקר יום שני
      he_translit: "va-yehi erev va-yehi voqer yom sheni"
      en: "cycle close + day ledger entry — with no test on the books"
    operators:
      - op: NAME
        expr_en: "REGISTRY: name(raqia) := shamayim"
        he: לָרָקִיעַ שָׁמָיִם
        he_translit: "la-raqia shamayim"
        en: >
          dative la- marks the receiver; bare word after = label. COLLISION
          (cross-unit): the label shamayim already denotes the 1:1
          narration-entity — within this standalone unit the write is
          clean; the collision is recorded here and resolved only on the
          named Oral track. AMENDMENT 2026-08-23 — the chain's derivation
          set recorded (Bereshit Rabbah 4:7 + Chagigah 12a): shamayim =
          ESH + MAYIM (fire and water kneaded together, Rav); SHAM-MAYIM
          ('carrier of water'); SA-MAYIM; and shamim with a written-form
          note ('shamim KETIV' — the heavens appraise the creatures'
          deeds). Middah: E30 (notarikon — words read as compounds); the
          etymologies attach THIS name to THIS entity, which is how the
          chain answers the collision. Dual-track; the registry write
          unchanged.
        cites: ["TIR-022", "Bereshit Rabbah 4:7"]
        confidence: tested
      - op: COMMIT
        expr_en: "cycle(erev -> boqer); LEDGER[day 2] := {spec ✓, names 1}"
        he: יוֹם שֵׁנִי
        he_translit: "yom sheni"
        en: >
          sheni = ORDINAL 'second' — the ordinal series begins here (day 1
          was cardinal echad). The claim set has NO test entry because the
          text has none: TESTS is empty at commit and the interpreter must
          FLAG commit_without_test and proceed — deviation is data (S6 on
          real text). AMENDMENT 2026-08-23 — the missing tov is
          CHAIN-WITNESSED: the chain asks the flag in its own words ('why
          is ki-tov not written on the second?') and carries a standing
          multi-position dispute — Gehinnom created that day (R. Yosei b.
          Chalafta); MACHLOKET itself created that day, derived from OUR
          OWN CLAUSE vi-yhi mavdil bein mayim la-mayim, and even
          order-building division earns no 'good' (R. Chanina; R.
          Tavyomei arguing a-fortiori — 'division for the world's repair
          earns no tov; disruptive division all the more so' — middah E5,
          unification 2026-08-23); the water-work stood UNFINISHED — day 3 therefore
          carries ki-tov TWICE, once for the water's completion, once for
          its own work (R. Shmuel — the cross-unit accounting gen_03's
          double test exhibits); with Ben Zoma's astonishment at va-ya'as
          ('they exist by the word!', Ps 33:6) and the flood-liability
          legion parable beside them (Bereshit Rabbah 4:6). The flag
          STANDS as a fact of the text; the dossier rides dual-track.
          Chain coda on the commit itself: 'a second day — fluid on the
          first, CONGEALED on the second' (Bereshit Rabbah 4:7) — the
          ordinal tied to the two-phase build. Boundary note: the chain
          itself declines to derive counting law from this formula — ein
          lemedin mi-briyato shel olam, 'one does not learn from the
          creation of the world' (Jerusalem Talmud Rosh Hashanah 1:1:2).
        cites: ["Bereshit Rabbah 4:6", "Bereshit Rabbah 4:7", "Jerusalem Talmud Rosh Hashanah 1:1:2"]
        confidence: "commit tested; ordinal-series significance [OPEN]; missing-tov chain-witnessed (oral, dual-track)"
    comment: >
      Day-2 transaction: spec (1:6, two moods) -> build+result (1:7) ->
      name+commit (1:8). Checklist vs day-1 baseline: RESULT present (generic),
      TEST ABSENT, name 1, commit present. The missing tov is the unit's
      central finding; three named Oral voices address it (see oral_notes).
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

