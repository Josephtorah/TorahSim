    FIRST word of the Great Masorah's alphabet of vav-written yod-read
    words; SNAPSHOT carries the written and read forms as a token-pair
    in-stream; the Kitzur counts the sentence inside it — ten years
    for the slander of ten brothers, two more for the two
    remember-me's. THE CORRECTED WORD [G62-03, MS on 39:22; the
    Ramah; the Meiri; the Hilleli — against the printer]: האסירם
    ("all the prisoners") — wrongly dragged into the written/read
    list by the printer (Minchat Kohen following); restored by MS
    with the Ramah, the Meiri, and the Hilleli's note as
    yod-after-samekh, lean second yod, no pair, marked UNIQUE — and
    SNAPSHOT writes exactly that, once in the Torah. THE REFUSAL ON
    THE CHAIN [G62-04, Rabbeinu Bachya via MS on 39:8]: וימאן ("and
    he REFUSED") carries the shalshelet (the chain-accent) — one of
    the whole Torah's FOUR chain-stations (gen_35's census) — and
    Bachya states the principle on this very word: from the Torah's
    accents we understand what is not written, as from a man's
    gestures we know his heart. HIS TONGUE IN THE FINALS [G62-05,
    Kitzur on 39:4]: "and all he had he gave into his hand" — the
    five words' final letters spell לשונו ("his TONGUE"): Gabriel
    taught him seventy tongues, and so he prospered; ordered finals
    in-stream. THE BOUND PAIR [G62-06, Kitzur on 39:20]: אסורים
    ("bound") — exactly two Torah stations, both Joseph's prison
    (39:20, 40:5); the third is "the LORD releases the bound"
    (Psalms, named): she said 'I will bind you'; he answered with
    the release. THE RAISED HAND AND THE RAISED VOICE [G62-07,
    Kitzur on 39:15]: הרימתי ("I raised") exactly twice in the
    Torah — Abram's oath-hand (14:22) and the wife's false cry:
    one word, an oath and a lie. THE TWO DESCENTS [G62-08/09,
    Kitzur on 39:1]: הורד ("was brought down") — Joseph here and
    the ornaments of Exod 33:5 (the Kitzur's own pair is with
    Sheol, named, outside); הורדהו ("bring him down") exactly
