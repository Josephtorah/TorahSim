    be-yadah the seized garment (39:12-18) -> be-yad yosef the
    prisoners (39:22): one noun carries trust, lie, and custody.
    THE THIRD GARMENT-CODE — coat (gen_60), veil (gen_61), cloak
    (here): three units, three cloths doing the testimony; bigdo six
    tokens in-span, always as evidence. THE TWO TELLINGS' SHIFTS
    (39:14 vs 39:17): ish ivri -> ha-EVED ha-ivri (the man demoted),
