    LAST Torah token — the census gen_07 opened (heavens/earth/sea ×3
    + Joseph 39:11) closes inside this span's empty-house verse. The
    anger's unnamed target (39:19) and the un-narrated cry (39:14-15,
    claimed only in her speech) — readings filed named. WATCHLIST
    ARMS: 40:5 (the asurim pair's second station, next unit); 40:15
    (Joseph's own account: gunavti — the passive counter-telling);
    44:21 (horiduhu repaid, armed by G62-09); Exod 33:5 (the
    ornaments taken down, armed by G62-08); Ps 146:7 (the release of
    the bound, named, outside); 49:23-24 (the bow that stayed firm —
