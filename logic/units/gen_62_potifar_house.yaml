    sheva-and-patach (the compound half-vowel) CHECKED under the
    guttural; the chet of לצחק ("to mock") in segol and the zayin
    of הזה ("this") dagesheed, asserted. DISCREPANCY [G62-11, MS on 39:23]: roe et-kal
    — MS rules the et maqqefed WITHOUT a stress-stroke; SNAPSHOT
    joins the maqqef but writes the meteg his books omit: the
