derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      First law unit, chosen as pilot (owner discussion 2026-07-31): Lev
      13:1-8, the skin-mark intake — the most code-shaped procedure in the
      Torah (case dispatch, predicate conditionals, a bounded two-iteration
      quarantine loop with fixed re-inspection dates, declarative status
      writes, and a trigger that stays armed after release). The unit
      boundary is the text's own: 13:2 opens the case with ki ("when");
      13:9 opens the NEXT case with its own ki — one ki-case per unit, the
      law-genre analogue of one day-commit per unit. Chapter-wide particle
      census (DB): ki ("when") x13, im ("if") x15 — the branch tokens are
      the letter's, not the machine's.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 8 verses via taamim_tree_parse.py rule set v3: status unique,
      pure_binary true. tree_ascii regenerated 2026-07-31 from DB tree_json.
      STRUCTURAL FINDING: in all seven law verses (2-8), the etnachta
      (major mid-verse rest) falls exactly at the CONDITION | ACTION
      boundary — the cantillation brackets IF | THEN: 13:2 [case
      conditions | routing], 13:3 [predicates + classification | verdict
      act], 13:4 [three negated predicates | confine], 13:5 [day-7 check |
      second confine], 13:6 [second check | release chain], 13:7 [spread
      condition | re-presentation], 13:8 [confirmation | verdict]. The
      13:1 frame verse (no etnachta) is the only verse without the
      bracket — and the only verse with a narrative verb. Accent-level
      echo: 13:5 and 13:6 carry the rare zinor + segol pair on their
      seventh-day inspection frames — the same rare pair Gen 1:28's
      blessing frame carries (observation tier).
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-07-31): the span
      holds exactly ONE narrative-spine verb — va-yedabber (Vpw3ms, piel
      wayyiqtol 'and-then-he-spoke', 13:1, the frame). Everything after it
      is law grammar: yihyeh Vqi3ms (imperfect inside the ki-frame — the
      CASE CONDITION, not a demand: same form, different genre, the ki
      re-types it); then WEQATAL ('and-he-shall-do', TIR-029) on every
      action verb, stem by stem: ve-hayah Vqq (the threshold), ve-huva VHq
      (HOPHAL weqatal — passive routing: 'he SHALL BE BROUGHT'), ve-ra'ah/
      ve-ra'ahu Vqq x6 (the inspection calls), ve-hisgir/ve-hisgiro Vhq x2
      (HIPHIL — the confine calls), ve-timme/ve-timme'o Vpq x2 and
      ve-tiharo Vpq (PIEL DECLARATIVES — 'declare impure/pure': status
      writes, not transformations), ve-khibbes Vpq (the released party's
      own duty), ve-taher Vqq (QAL stative — 'and he IS pure': the
      declare/become minimal pair with piel ve-tiharo INSIDE ONE VERSE,
      13:6), ve-nir'ah VNq (NIPHAL weqatal — passive re-presentation).
      Condition predicates ride PERFECTS inside the if-clauses (hafakh
      'has turned', amad 'has stood', fasah 'has spread', kehah Vpp 'has
      dimmed') with the negators lo/ein. 13:7's condition carries the
      INFINITIVE-ABSOLUTE DOUBLING pasoh tifseh (Vqa + Vqi3fs — 'spread
      it SPREADS') — the mot-tamut construction (Gen 2:17) on the
      escalation verb. Orthography flag: 13:4 and 13:8 write the feminine
      pronoun as הוא (ktiv hu) coded Pp3fs (qere hi) — the Torah-wide
      ktiv/qere on this pronoun, letter-visible in our own data, recorded
      [OPEN]. Form shift: the 13:2 mark-name sapachat returns at 13:6-8
      as MISPACHAT (mem-prefixed; 3 occurrences, Torah-wide unique to
      this chapter) — recorded [OPEN]; Onkelos levels both to one word.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      13:1 FRAME: the only event — YHWH speaks to Moshe AND AHARON (dual
      addressee: the inspector is on the distribution list of the
      inspection law; first YHWH-name in a derived unit — the gen units
      ran on Elohim). 13:2 CASE: adam KI yihyeh — the intake filter: three
      mark-classes (se'et/sapachat/baheret, or-connected) in the skin of
      the flesh, threshold ve-hayah le-nega tzara'at, then PASSIVE routing
      (ve-huva — the case moves; no one is commanded to move it) to a
      NAMED inspector class (Aaron the priest or one of his sons). 13:3
      HANDLER 1 (verdict-impure): IF hair in the mark has turned white AND
      its look is deeper than the skin THEN it IS nega tzara'at — the
      priest sees him and DECLARES him impure (piel declarative; the
      doubled seeing ve-ra'ah...ve-ra'ahu recorded [OPEN]). 13:4 HANDLER 2
      (confine): IF bright-spot white AND look NOT deeper AND hair NOT
      turned THEN confine SEVEN DAYS — and the letter confines ET-HA-NEGA
      ('THE MARK'), where 13:5 confines ve-hisgirO ('HIM'): mark-object
      vs person-object across the two confinements, [OPEN]. 13:5 HANDLER 3
      (first recheck): ON THE SEVENTH DAY (day 7's definite label as the
      loop's re-entry date), ve-hineh — IF the mark has STOOD in its
      appearance (amad be-einav — idiom [OPEN]; Onkelos resolves: 'stood
      AS IT WAS') AND not spread THEN confine seven days SHENIT ('a
      second time' — the loop's bounded second and final iteration).
      13:6 HANDLER 4 (release): second seventh-day check — IF dimmed AND
      not spread THEN the priest DECLARES HIM PURE; classification
      mispachat hi ('it is a scab'); the released party washes his
      garments (subject shifts priest->patient mid-chain); ve-taher —
      'and he IS pure' (stative). 13:7 HANDLER 5 (armed trigger): IF
      spread it SPREADS after his having been seen for his purification
      THEN he SHALL BE SEEN a second time — the release is conditional
      forever; the case can reopen. 13:8 HANDLER 6 (reopen verdict):
      the priest sees, ve-hineh it has spread — DECLARE impure:
      tzara'at hi. Then the span ends mid-parashah: no receipt, no test,
      no commit — six handlers standing, nothing executed. THE LAW
      INSTALLS; ONLY CASES EXECUTE.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      NEW OPERATOR FAMILY for the law genre (interpreter extension at
      freeze; ASSIGN/BLESS/CMD-US precedent): CASE (the ki-opener: intake
      filter + routing, recorded as a standing WORLD fact) and HANDLER
      (the weqatal chain: IF(predicates) THEN(actions), recorded as a
      standing WORLD fact). Handlers are INSTALLED, never executed — the
      day-5 BLESS-mandate rule extended to its natural genre: standing
      directives are facts, not SPECS; there is no receipt because
      nothing was demanded of the narrative present. The unit therefore
      leaves SPECS/TESTS/REGISTRY/LEDGER untouched — asserted as machine
      state in the scenarios (the gen_07 LEDGER-stays-EMPTY check reused:
      the law, like the seventh day, is an open transaction — standing,
      re-entered per case, never closed by the text).
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en; machine tokens
      apostrophe-free (seet_o_sapachat_o_baheret, mareh_amok). Predicate
      tokens inside IF()/THEN() are underscore-joined transliterations of
      the verse's own words, so scenario fact-tokens remain checkable.
    confidence: established
  - step: G
    name_en: "Oral (named only) + Tier-A translation check"
    comment: >
      Chain-primary honesty: Sifra Tazria (Nega'im) and Mishnah Negaim —
      the chapter's owners, and the home texts of the 13 middot — are NOT
      in the local cache; nothing is claimed from them. Named for the
      Tier-A triage queue: Sifra Tazria Nega'im parashah 1ff; Mishnah
      Negaim 1:1 (the four shades), 3:1 (who inspects); Bavli Shevuot
      6a-b (the shades sugya — bears on Onkelos's amka); Bavli Arakhin
      15b-16b (tzara'at and speech-sin); Bereshit Rabbah 41:2 (the Gen
      12:17 nega debut as tzara'at). Tier-A Onkelos read at derive time
      (FETCHLOG 2026-07-31), five findings — the star: tzara'at rendered
      SEGIRU/SEGIRUTA ('the SHUTTING-disease') — the condition named by
      its own quarantine procedure, on the sagar root whose corpus debut
      is Gen 2:21's flesh-closure (and 7:16's ark-closure): translation-
      level fusion of disease and confinement. Also: amad be-einav
      resolved to kam kad havah ('stood AS IT WAS' — appearance reading);
      sapachat/mispachat leveled to adita ('the added one'); se'et
      (raised) rendered amka ('deep-spot') — dossier queued; the piel
      declaratives retained (visa'ev/vidakkei — declare, not transform).
    confidence: tested
    tags: ["[ORAL]","[TIER-A]"]
  - step: H
    name_en: "Scenarios"
    comment: >
      S1 the frame (nothing but an event and two presupposition flags);
      S2 the case fact standing; S3-S8 one handler fact per verse,
      accumulating; S8 also asserts the GENRE SIGNATURE as machine state:
      SPECS empty, no test, no name, LEDGER stays EMPTY (open
      transaction). S9_negative re-asserts flag-never-block. No demand
      exists in the unit, so no mood-contract scenario applies — shared
      with gen_07, for the same textual reason inverted: day 7 had
      nothing left to demand; the law demands nothing because it
      installs for cases that have not yet occurred.
    confidence: tested
  - step: I
    name_en: "English leakage review"
    comment: >
      Operators derive from morph codes (the single Vpw frame verb; Vqi
      inside ki -> case condition; Vqq/Vpq/Vhq/VHq/VNq weqatal -> THEN
      per TIR-029, stems preserved in the readings — hophal passive
      routing, hiphil confine, piel declaratives, qal stative, niphal
      re-presentation; Vqa+Vqi doubling at 13:7; perfects as condition
      predicates), particles (ki/im case/branch tokens — 13/15 chapter
      census; lo/ein negators; o 'or' disjunction in the intake list),
      and the etnachta condition|action bracket verified on all seven
      law verses. The ktiv-hu/qere-hi and sapachat/mispachat flags rest
      on our own letter data.
    confidence: established
  - step: J
    name_en: "Pre-flight + freeze gate"
    comment: >
      Pre-flight 2026-07-31: prototype CASE + HANDLER handlers injected
      in the scratchpad harness (repo file untouched); all scenarios
      green. FROZEN 2026-08-01 on owner order ("freeze lev 13"): h_case
      + h_handler added to run_unit.py and dispatched; unit re-verified
      green through the real interpreter. Narrative (ASK FIRST) and
      triage remain on owner order — the triage doubles as the middot
      detector's legal-device tripwire test (Sifra/Negaim enter the
      cache). Changes require a new derive pass, not silent edits.
    confidence: established

boot_steps:
  - id: STEP_Lv_13_1
    order: 1
    ref: "Lev.13.1"
    op: FRAME_SPEECH
    he: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן לֵאמֹר
    he_translit: "va-yedabber YHWH el-Moshe ve-el-Aharon le-mor"
    en: "[EN-AID/JPS] And the LORD spoke unto Moses and unto Aaron, saying:"
    tree_left:
      he: וידבר יהוה
      he_translit: "va-yedabber YHWH"
      en: "the frame's speech event"
    tree_right:
      he: אל משה ואל אהרן לאמר
      he_translit: "el-Moshe ve-el-Aharon le-mor"
      en: "the dual distribution list + the quote opener"
    operators:
      - op: EVENT
        expr_en: "speak(e1) ∧ Agent(e1, YHWH)"
        he: וַיְדַבֵּר יְהוָה
        he_translit: "va-yedabber YHWH"
        en: >
          The unit's ONLY narrative-spine verb (Vpw3ms, wayyiqtol —
          'and-then-he-spoke'): the frame that hands down everything
          after it. First YHWH-name in a derived unit (the seven gen
          units ran entirely on Elohim). Dual addressee: el-Moshe VE-EL
          AHARON — the law whose executor is the priest is ADDRESSED to
          the priest; the inspector is on the distribution list of the
          inspection procedure.
        cites: []
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "moshe, aharon are READ without prior install (standalone machine; the persons of the Exodus narrative — cross-unit chaining is Stage E)"
        en: "flag, not fix — the frame's addressees are imports"
        cites: []
        confidence: tested
    comment: >
      One verse of narrative, then the machine goes silent: no wayyiqtol
      ('and-then-he-did' form) occurs again in the span. The learning
      pass measured this genre signature corpus-wide (Lev 1: 2 narrative
      verbs vs 27 weqatal); this unit holds it at 1 vs 13.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Lv_13_2
    order: 2
    ref: "Lev.13.2"
    op: CASE_INTAKE
    he: אָדָם כִּי־יִהְיֶה בְעוֹר־בְּשָׂרוֹ שְׂאֵת אוֹ־סַפַּחַת אוֹ בַהֶרֶת וְהָיָה בְעוֹר־בְּשָׂרוֹ לְנֶגַע צָרָעַת וְהוּבָא אֶל־אַהֲרֹן הַכֹּהֵן אוֹ אֶל־אַחַד מִבָּנָיו הַכֹּהֲנִים
    he_translit: "adam ki-yihyeh ve-or-besaro se'et o-sapachat o vaheret ve-hayah ve-or-besaro le-nega tzara'at ve-huva el-Aharon ha-kohen o el-achad mi-banav ha-kohanim"
    en: "[EN-AID/JPS] When a man shall have in the skin of his flesh a rising, or a scab, or a bright spot, and it become in the skin of his flesh the plague of leprosy, then he shall be brought unto Aaron the priest, or unto one of his sons the priests."
    tree_left:
      he: אדם כי יהיה בעור בשרו שאת או ספחת או בהרת והיה בעור בשרו לנגע צרעת
      he_translit: "adam ki-yihyeh be-or besaro se'et o sapachat o baheret ve-hayah be-or besaro le-nega tzara'at"
      en: "the case conditions: subject, ki-trigger, three mark-classes, threshold (etnachta arm)"
    tree_right:
      he: והובא אל אהרן הכהן או אל אחד מבניו הכהנים
      he_translit: "ve-huva el-Aharon ha-kohen o el-achad mi-banav ha-kohanim"
      en: "the routing: passive, to the named inspector class"
    operators:
      - op: CASE
        expr_en: "CASE(adam, mark_in_or_basar(seet_o_sapachat_o_baheret) -> nega_tzaraat) ROUTE(hova_el_ha_kohen)"
        he: אָדָם כִּי־יִהְיֶה … וְהוּבָא אֶל־אַהֲרֹן הַכֹּהֵן
        he_translit: "adam ki-yihyeh … ve-huva el-Aharon ha-kohen"
        en: >
          THE CORPUS'S FIRST DERIVED CASE OPERATOR. adam KI-yihyeh — the
          ki ('when') re-types the imperfect: in narrative, yihyeh in
          command position was a demand (TIR-028's LET?); inside a
          ki-frame it is a CASE CONDITION — a trigger awaiting instances,
          not a receipt. The intake filter: THREE mark-classes joined by
          o ('or') — se'et ('swelling' — detector grade A: its only
          earlier life is Gen 4:7, Cain's im-branch), sapachat ('scab'),
          baheret ('bright spot') — in the SKIN of his FLESH (be-or
          besaro: Gen 3:21's or on Gen 2:21's basar). Threshold: ve-hayah
          (weqatal) le-nega tzara'at — 'and it BECOMES a tzara'at mark'
          (nega: Gen 12:17's debut noun; tzara'at: Onkelos renders
          SEGIRU, 'the shutting-disease'). Routing: ve-huva — HOPHAL
          weqatal, PASSIVE: 'he shall BE BROUGHT' — the case moves; no
          agent is commanded to move it. Inspector class NAMED: Aaron
          the priest or ONE OF his sons — the office (Exod 28) with a
          disjunction: any single priest suffices, [OPEN] (Sifra/Negaim
          3:1 queued: who may inspect).
        cites: ["TIR-029"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "adam, or_basar, ha_kohen are READ without prior install (standalone machine; gen_06 species / Gen 3:21 skin on Gen 2:21 flesh / Exod 28 office — the import chain is mapped in gen_boot)"
        en: "flag, not fix — the case's subject, substrate, and officer are all imports"
        cites: []
        confidence: tested
    comment: >
      The etnachta brackets [conditions | routing] — the first of seven
      consecutive verses whose accent split is the IF|THEN boundary. The
      opening five words carry four imports and zero local installs: the
      law legislates entirely over inherited symbols.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Lv_13_3
    order: 3
    ref: "Lev.13.3"
    op: HANDLER_VERDICT_TAMEI
    he: וְרָאָה הַכֹּהֵן אֶת־הַנֶּגַע בְּעוֹר־הַבָּשָׂר וְשֵׂעָר בַּנֶּגַע הָפַךְ לָבָן וּמַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ נֶגַע צָרַעַת הוּא וְרָאָהוּ הַכֹּהֵן וְטִמֵּא אֹתוֹ
    he_translit: "ve-ra'ah ha-kohen et-ha-nega be-or ha-basar ve-se'ar ba-nega hafakh lavan u-mar'eh ha-nega amok me-or besaro nega tzara'at hu ve-ra'ahu ha-kohen ve-timme oto"
