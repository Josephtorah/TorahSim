status_note_en: >
  FROZEN 2026-08-01 (owner approved, "freeze lev 13"; interpreter gained
  the CASE/HANDLER law-genre operators at freeze): eighth logic-derived
  unit and the FIRST LAW UNIT — the pilot the owner chose after the
  seven days closed. Central findings: the genre parses exactly
  as the learning pass predicted — one narrative frame verb, then
  installed code: a ki-case with a three-class intake filter and passive
  routing, six weqatal handlers (verdict, confine, recheck-confine,
  release, armed reopen trigger, reopen verdict), predicates as perfects
  under lo/ein negation, the infinitive-absolute doubling on the
  overturn branch, and the declare/become minimal pair (piel/qal) inside
  the release verse. The etnachta brackets condition|action in all seven
  law verses. The quarantine loop runs on the frozen week's clock
  (shivat yamim; re-entry BA-YOM HA-SHEVI'I) with a bounded second
  iteration (shenit). Onkelos fuses disease and procedure (tzara'at ->
  segiru, 'the shutting-disease'). The machine ends with SEVEN standing
  law facts and every other register untouched: no demand, no test, no
  name, no ledger row — installed code, armed, unexecuted. Narrative
  (ASK FIRST) and triage await owner order; the triage is the middot
  detector's legal-device tripwire test. Not binding religious law.
