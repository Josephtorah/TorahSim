state_machine:
  comment_en: "Law-unit installer (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER). States are INSTALL states — the case-flow the handlers define (intake -> verdict/confine -> recheck -> release/reopen) executes only when cases occur, which this span never narrates."
  states:
    - id: S_boot
      en: "Before 13:1 — all registers empty (standalone unit)"
    - id: S_framed
      en: "After 13:1 — one speech event (YHWH -> Moshe + Aharon); moshe/aharon flagged; nothing else"
    - id: S_case_installed
      en: "After 13:2 — the intake case standing as a WORLD fact (3-class filter -> passive routing to the priest); adam/or_basar/ha_kohen flagged"
    - id: S_handlers_1_2
      en: "After 13:3-4 — verdict-impure handler + first-confine handler standing (facts x3)"
    - id: S_handlers_3_4
      en: "After 13:5-6 — recheck/second-confine + release handlers standing (facts x5)"
    - id: S_installed_armed
      en: "After 13:7-8 — reopen trigger + reopen verdict standing (facts x7); SPECS/TESTS/REGISTRY/LEDGER all untouched: installed code, armed, unexecuted"
  transitions:
    - {from: S_boot, to: S_framed, via: STEP_Lv_13_1}
    - {from: S_framed, to: S_case_installed, via: STEP_Lv_13_2}
    - {from: S_case_installed, to: S_handlers_1_2, via: STEP_Lv_13_4}
    - {from: S_handlers_1_2, to: S_handlers_3_4, via: STEP_Lv_13_6}
    - {from: S_handlers_3_4, to: S_installed_armed, via: STEP_Lv_13_8}

state_after:
  - id: AFTER_S_installed_armed
    en: >
      WORLD: NOTHING created; five presupposed imports flagged (moshe,
      aharon, adam, or_basar, ha_kohen) + SEVEN standing law facts — one
      case (intake filter -> routing) and six handlers (verdict-impure;
      confine-7; recheck-confine-7-shenit; release with declare/become
      pair; reopen trigger; reopen verdict). REGISTRY: untouched — the
      tamei/tahor writes inside the handlers are PARAMETERIZED (they
      execute per case, and no case occurs in the span). SPECS: log
      EMPTY — the ki-condition is a trigger, not a demand; nothing is
      owed to the narrative present. TESTS: empty — the tov instrument
      belongs to the other genre; this unit's verdict axis is
      tamei/tahor. LEDGER: EMPTY — the law closes no days. FLAGS:
      read_before_install x5 — none blocking. The genre signature in one
      line: a unit whose ONLY writes are standing handler facts — the
      measured definition of installed code.

