        he: שֹׁפֵךְ דַּם הָאָדָם בָּאָדָם דָּמוֹ יִשָּׁפֵךְ
        he_translit: "shofekh dam ha-adam ba-adam damo yishafekh"
        en: >
          THE CORPUS'S FIRST TALION-FORM, installed as standing
          law-grammar — gen_12's HANDLER class matched exactly
          (4:15: HANDLER IF(horeg(kayin)) THEN(shivatayim_yukam)):
          the participle IS the case-form ('the SHEDDER of...' —
          whoever, whenever), the niphal the consequence. A
          six-word chiasm — shedder/blood/human //
          human/blood/shed — with SHAFAKH ('shed') tokens 1-2 of
          22 BOTH inside it: deed and undergoing in one line
          (career: tokens 5+ are the altar's blood-pourings, Exod
          29:12 / Lev 4 — the shed-verb's future is cultic). DAM
          tokens 5-6 close the span's blood-run begun at Abel's
          cry [letter facts; the ba-adam instrument is the
          chain's question — named-only; Onkelos writes WITNESSES
          AND JUDGES into the two words — the courtroom inserted
          into the mirror; dual-track, flagged].
        cites: []
        confidence: tested
      - op: PRECONDITION_STATE
        expr_en: "HOLDS(ki_be_tzelem_elohim_asah_et_ha_adam, t1)"
        he: כִּי בְּצֶלֶם אֱלֹהִים עָשָׂה אֶת־הָאָדָם
        he_translit: "ki be-tzelem Elohim asah et-ha-adam"
        en: >
          The ground: 'for in the IMAGE of God He made the human'
          — TZELEM ('image') token 5 of 6 (1:26, 1:27 x2, 5:3,
          here; token 6 = Num 33:52's idol-images): day six's
          word returns as the law's reason. Encoded as FACT —
          gen_09's PATTERN class was weighed and DECLINED: that
          op is the NARRATOR'S al-ken ('therefore') etiology
          with no addressee; this ki ('because') is in-speech
          reasoning grounding the handler [decision recorded;
          Onkelos KEEPS the image and swaps the name inside it —
          dual-track, flagged].
        cites: []
        confidence: tested
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(bloodshed_verse, complete_criminal_procedure)"
        en: >
          THE CROWN: A WHOLE CRIMINAL PROCEDURE READ WORD BY WORD OUT OF ONE
          VERSE [claim G21-11]. R. Chanina derives from this verse's own
          phrasing - conviction on ONE witness, before ONE judge, with NO
          forewarning required, liability for one who kills through an AGENT,
          and from בָּאָדָם (ba-adam, 'IN the man') liability for a FETUS,
          'the man within a man'. The strangler is added, since the blood
          stays inside him. The MODE of execution comes from the verb: 'by man
          shall his blood BE SHED' means death by shedding, excluding
          strangling and stoning. The verse's own legal role is disputed - one
          school holds it the SOURCE of the prohibition, others that it
          supplies only the death mode - and it stands as the punishment
          paradigm for the whole seven-law list: 'the Merciful One revealed it
          at bloodshed, and the same holds for all'. [folded shape: priced
          law]
        cites: ["Bereshit Rabbah 34:14", "Mekhilta DeRabbi Yishmael, Tractate Nezikin 4:9", "Sanhedrin 57a:3", "Sanhedrin 57a:13"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(bloodshed_verse, quoted_inside_the_forewarning_liturgy)"
        en: >
          THE VERSE IS SPOKEN ALOUD IN COURT AS THE STATUTE [claim G21-12].
          The warning administered to a suspect before a capital act QUOTES
          this verse - 'know that he is a son of the covenant, and the Torah
          said: he who spills a man's blood...' - and liability attaches only
          if the suspect answers that he knows and acts on that condition,
          with one seat requiring all the witnesses to warn as one. The verse
          is further paired with the Decalogue's prohibition as its other
          half: 'You shall not kill' is the exhortation, ours is the
          PUNISHMENT. Two verses, one statute. [folded shape: cross-corpus
          link]
        cites: ["Jerusalem Talmud Sanhedrin 5:1:8", "Tosefta Sanhedrin 11:1", "Mekhilta DeRabbi Yishmael, Tractate Bachodesh 8:10"]
        confidence: witnessed
      - op: WITNESS_STATE
        expr_en: "WITNESS(bloodshed_verse, refuses_conviction_yet_licenses_killing)"
        en: >
          THE SAME VERSE REFUSES A CONVICTION AND LICENSES A KILLING [claim
          G21-13]. REFUSED: the pursuer is seen, the warning given citing this
          verse, the witnesses' eyes averted for a moment, the knife found
          dripping - and still no execution, because 'a clean and righteous
          one you shall not kill'. Circumstantial proof, however overwhelming,
          does not convict. LICENSED: the pursuer law rides the same clause -
          'save the blood of the pursued WITH the blood of the pursuer' - and
          whether forewarning is required there is disputed on both sides of
          this one verse. [folded shape: recorded dispute]
        cites: ["Mekhilta DeRabbi Yishmael, Tractate Kaspa 3:9", "Sanhedrin 72b:15", "Sanhedrin 72b:17"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(image_clause, affirmative_body_care_duty)"
        en: >
          THE CLAUSE THAT GROUNDS A CAPITAL PROHIBITION ALSO GROUNDS A DUTY
          [claim G21-14]. Hillel holds bathing itself a commandment, arguing
          from the statue-scrubber: if one appointed over the images of kings
          scrubs and washes them and is honoured for it, how much more one
          made in the image of God. The image clause generates an affirmative
          obligation toward one's own body alongside the prohibition against
          destroying another's. [folded shape: priced law]
        cites: ["Vayikra Rabbah 34:3"]
        confidence: witnessed
    comment: >
      The law's whole weight hangs on a mirror six words wide,
      and the mirror hangs on day six.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

