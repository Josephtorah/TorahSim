  - step: B
    name_en: "Source + span + structure"
    comment: >
      Genesis 31:22-54, from the told flight to the covenant meal: 33
      verses, 481 tokens, source-verified; every verse carries the
      mid-verse rest, so no fallback splits this unit. A tooling fix
      is on record here: the pre-stage volitive census pattern
      required a word boundary after the mood letter and reported
      NONE; fixed 2026-08-07, and the corrected census (twelve
      volitives) governs the unit. Evidence: the SNAPSHOT database
      plus the debut-map attachment.
    confidence: reconstructed
  - step: C
    name_en: "Draft path + review"
    comment: >
      Solo-era unit #8: Claude as coordinator and deriver, with an
      external fresh-context adversarial review before freeze per the
      standing law. Frozen 2026-08-07.
    confidence: reconstructed
  - step: D
    name_en: "Care-point ledger (distilled)"
    comment: >
      The crown: THE TWO TONGUES (31:47). Laban names the heap in
      Aramaic and the source tags both tokens with the Aramaic
      language prefix — a full-corpus morph scan returns EXACTLY
      those two tokens: the Torah's only Aramaic-tagged words, the
      language switch visible in the data layer itself. One object
      takes two name writes within ONE VERSE, in two languages — the
      corpus's first bilingual name-pair and first translation event
      (the Hebrew witness-noun had debuted three verses earlier as
      the covenant's own term). Last-write-wins leaves the Hebrew
      label on the ledger — and the letter's own etiology settles on
      the same name: the machine's overwrite mirrors the text. The
      third label, the watchpost, arrives with NO naming verb —
      report-class etiology, the registry sleeps — and the pun's two
      halves (the watchpost and the may-he-watch verb) are each
      single-token careers. Among twenty-two care-points: the
      pursue-overtake pair prefigures the sea; the household gods
      exit the Torah UNFOUND; the feel-verb's four Genesis tokens
      are two deceiver-feelings; the hide-verb closes the career it
      opened in Eden; the sacrifice verb and noun are BORN at the
      covenant meal; the witness-noun that will police testimony is
      born policing a heap; the Fear-of-Isaac epithet is born and
      completed as an oath-name inside one unit; the heap-noun's
      whole Torah career lives in seven verses.
    confidence: reconstructed
  - step: E
    name_en: "Machine design"
    comment: >
      SEVEN pushes, ZERO pops, seven open — the frozen Mamre
      end-shape re-fires at Gilead, the corpus's second all-open
      seven (exceeded only by the thirteen and the twelve). The
      queue: God's guard-order to Laban (guard-pushes carry no
      receipt); the identify-and-take compound — Laban feels every
      tent, finds NOTHING, then claims EVERYTHING and takes nothing;
      the let-it-not-burn (the burn-verb's very next career token
      ignites in JACOB, the wrong eyes); the tribunal demand —
      nothing is ever set, and Jacob declares God already adjudicated
      LAST NIGHT (the tribunal-verb and the set-verb each walk
      performance BEFORE demand); the covenant cohortative re-runs
      Gerar EXACTLY — the cut-verb's only two cohortative
      covenant-demands are answered by adjacent swear-verb tokens,
      other root, card open both times; gather-stones — demanded in
      the gather-verb, performed in the take-verb, roots ONE LETTER
      apart: the letter-precision family (object, number,
      quantifier) gains a VERB member; and the watchpost prayer,
      re-running the judge-between-us formula as watch-between-us.
      The mood-law's cleanest pair closes the unit: the jussive
      watch-verb PUSHES, the imperfect judge-verb three verses later
      stays FENCED. Registry two writes, both on one object. Zero
      tests.
    confidence: reconstructed
  - step: F
    name_en: "Freeze + later history"
    comment: >
      Frozen at commit 55b371e (2026-08-07, "Freeze gen_54: pursuit
      and the heap of witness in two tongues"). Oral audit 2026-08-08
      folded same day (run 7 block 3): 18 VERIFIED, 0 FAILED,
