    en_sample: "[EN-AID] Sample only; not derivation source; dual-track."
    comment_en: >
      Dual-track sample — does not rewrite Written tree-derived STEPs.
    source: "[ORAL][SIFREI]"
    confidence: hypothesis
  - id: ORAL_sample_3
    status: dual_track
    work_en: Sifrei Bamidbar
    locus_en: "Sifrei Bamidbar: sifrei_bamidbar_he"
    he_sample: "וישלחו מן המחנה מחנה שכינה. שומע אני ממחנה לויה תלמוד לומר אל מחוץ למחנה תשלחום. הא עד שלא יאמר יש לי בדין אם נדחו טמאים ממחנה ארון הקל, קל וחומר ממחנה שכינה החמור. אלא אם אמרת כן ענשת מן הדין, לכך נאמר וישלחו מן המחנה ללמדך שאין עונשין מן "
