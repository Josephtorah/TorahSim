    en: >
      THE SUMMONS [G72-13]. HEASFU ve-agida lakhem — 'GATHER, and I will
      tell you': the machine installs the testament's section — twelve
      addresses between a summons and a charge; be-ACHARIT ha-yamim — 'in
      the END of days': and the end is NOT told (the readings: the
      Presence withdrew and the end closed; the sons answer that the
      letters of SIN stand in none of their names, and the father answers
      that neither do the letters of THE END — the concealment explained
      by the alphabet itself, named [G72-13]): the machine files the
      withheld disclosure as the section's own frame — a telling
      announced, a telling withheld, twelve blessings given instead.
    cites: []
    confidence: tested
  - op: WITNESS_STATE
    expr_en: "WITNESS(the_end_of_days, revealed_then_sealed_mid_sentence)"
    en: >
      THE CHAPTER'S GOVERNING CLAIM, AND THE MACHINE'S REASON IT IS
      BLESSING AND NOT CHRONOLOGY [claim G72-24]. Three readings of what
      he meant to tell them, and the Rabbis' answer: he came to reveal the
      End and IT WAS CONCEALED FROM HIM - proven by the fact that his next
      word is a son's name. Only two are said to have had the End revealed
      and withdrawn. The gathering is opened four ways, closing on a
      command against dissension: you shall all be one assembly. [folded
      shape: recorded dispute]
