  he: וַיִּקְרְבוּ יְמֵי־יִשְׂרָאֵל לָמוּת וַיִּקְרָא לִבְנוֹ לְיוֹסֵף וַיֹּאמֶר לוֹ אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ שִׂים־נָא יָדְךָ תַּחַת יְרֵכִי וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת אַל־נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  he_translit: va-yiqrvu yeme-yisrael la-mut va-yiqra li-ven-o le-yosef va-yomer l-o im-na matzati chen be-ene-kha sim-na yad-kha tachat yerekhi-y ve-asita imadi-y chesed ve-emet el-na tiqbre-ni be-mitzrayim
  en: "[EN-AID] And the days of Israel drew near to die; and he called his son Joseph, and said to him: If, pray, I have found favor in your eyes, put, pray, your hand under my thigh, and do with me kindness and truth: do not, pray, bury me in Egypt."
  tree_left:
    he: וַיִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָמוּת֒ וַיִּקְרָ֣א לִבְנ֣וֹ לְיוֹסֵ֗ף וַיֹּ֤אמֶר לוֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ שִֽׂים נָ֥א יָדְךָ֖ תַּ֣חַת יְרֵכִ֑י
    he_translit: va-yiqrvu yeme-yisrael la-mut va-yiqra li-ven-o le-yosef va-yomer l-o im-na matzati chen be-ene-kha sim-na yad-kha tachat yerekhi-y
    en: "Israel's days drew near to die; he called Joseph: put your hand under my thigh (etnachta on yerekhi-y) [VERIFIED: SNAPSHOT Gen.47.29 idx18 etnachta in-stream]"
  tree_right:
    he: וְעָשִׂ֤יתָ עִמָּדִי֙ חֶ֣סֶד וֶאֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖נִי בְּמִצְרָֽיִם
    he_translit: ve-asita imadi-y chesed ve-emet el-na tiqbre-ni be-mitzrayim
    en: "do with me kindness and truth: do not, pray, bury me in Egypt (verse-final be-mitzrayim) [VERIFIED: SNAPSHOT Gen.47.29 idx19-26]"
  operators:
  - op: DECLARE
    expr_en: "DECLARE(yisrael, LET-NOT(al_na_tiqbreni_be_mitzrayim))"
    he: אַל־נָא תִקְבְּרֵנִי בְּמִצְרָיִם
    he_translit: el-na tiqbre-ni be-mitzrayim
    en: >
      THE BAN [G70-08; G70-13]. va-YIQRVU yeme yisrael la-MUT — 'and the
      days of Israel DREW NEAR to die': the death-approach formula's one
      Torah adjacency [VERIFIED: manifest G70-08] — its Scripture-partner
      is DAVID's (1 Kgs 2:1, named): one hundred forty-seven psalms
      answering one hundred forty-seven years, each father crowned his son
      alive; SIM na yadkha TACHAT yerekhi — the thigh-oath gesture:
      Abraham's steward swore so (24:2, the file's first station) — now
      the grandson's son under the same thigh-covenant (the Kitzur's
      count: na yadkha = CIRCUMCISION, the covenant it touches, named
      [G70-13]); CHESED ve-EMET — kindness-and-TRUTH: the kindness done
      the dead (Rashi via the Kitzur — the only kindness with no
      repayment; the coffin-bier-shrouds initials, named); AL-NA tiqbreni
      be-MITZRAYIM — the ban pushed: not in Egypt — OPEN, its honoring
      beyond the span (the carrying-out, 50:4-13, ARMED).
    cites: []
    confidence: tested
  comment: >
    The death-approach formula; the burial ban pushed.
  confidence: tested
  source: "[HE-WRITTEN][HE-STRUCT]"

- id: STEP_Gn_47_30
  order: 30
  ref: Gen.47.30
  op: CARRY_ME_AND_BURY_ME
  he: וְשָׁכַבְתִּי עִם־אֲבֹתַי וּנְשָׂאתַנִי מִמִּצְרַיִם וּקְבַרְתַּנִי בִּקְבֻרָתָם וַיֹּאמַר אָנֹכִי אֶעֱשֶׂה כִדְבָרֶךָ
  he_translit: ve-shakhavti im-avota-y u-nesata-ni mi-mitzrayim u-qevarta-ni bi-qevurata-m va-yomar anokhi eese khi-devare-kha
  en: "[EN-AID] And I will lie with my fathers, and you shall carry me from Egypt, and bury me in their burying-place. And he said: I will do according to your word."
  tree_left:
    he: וְשָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔י וּנְשָׂאתַ֨נִי֙ מִמִּצְרַ֔יִם וּקְבַרְתַּ֖נִי בִּקְבֻרָתָ֑ם
    he_translit: ve-shakhavti im-avota-y u-nesata-ni mi-mitzrayim u-qevarta-ni bi-qevurata-m
    en: "I will lie with my fathers: carry me from Egypt, bury me in their grave (etnachta on bi-qevurata-m) [VERIFIED: SNAPSHOT Gen.47.30 idx6 etnachta in-stream]"
  tree_right:
    he: וַיֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִדְבָרֶֽךָ
    he_translit: va-yomar anokhi eese khi-devare-kha
    en: "and he said: I will do according to your word (verse-final khi-devare-kha) [VERIFIED: SNAPSHOT Gen.47.30 idx7-10]"
  operators:
  - op: DECLARE
    expr_en: "DECLARE(yisrael, LET(u_qevartani_bi_qvuratam))"
    he: וּנְשָׂאתַנִי מִמִּצְרַיִם וּקְבַרְתַּנִי בִּקְבֻרָתָם
    he_translit: u-nesata-ni mi-mitzrayim u-qevarta-ni bi-qevurata-m
    en: >
      THE CHARGE [G70-12]. ve-SHAKHAVTI im avotai — 'I will LIE with my
      fathers': the lying-formula claims the cave before naming it (49:29
      will name it); u-nesatani mi-mitzrayim u-QEVARTANI bi-qvuratam —
      'CARRY me from Egypt and BURY me in their burying-place': the
      positive charge pushed beside the ban — the queue holds the death
      before the death; anokhi EESE khi-devarekha — 'I will DO according
      to your word': Joseph ACCEPTS — and acceptance is not performance:
      the demand stands OPEN for the deed (50:7-13, ARMED); the accept-
      verb's ayin carries a split: the old Sepharad codices point BARE
      SHEVA ('beautifully pointed', their margins say; Or Torah concurs),
      the stream writes CHATAF SEGOL — carried named [VERIFIED under
      G70-12].
    cites: []
    confidence: tested
  comment: >
    The burial charge pushed; the acceptance is not the deed.
  confidence: tested
  source: "[HE-WRITTEN][HE-STRUCT]"

- id: STEP_Gn_47_31
  order: 31
  ref: Gen.47.31
  op: SWEAR_TO_ME
  he: וַיֹּאמֶר הִשָּׁבְעָה לִי וַיִּשָּׁבַע לוֹ וַיִּשְׁתַּחוּ יִשְׂרָאֵל עַל־רֹאשׁ הַמִּטָּה
  he_translit: va-yomer hishava-ה li-y va-yishava l-o va-yishtachu yisrael al-rosh ha-mita
  en: "[EN-AID] And he said: Swear to me. And he swore to him. And Israel bowed upon the head of the bed."
  tree_left:
    he: וַיֹּ֗אמֶר הִשָּֽׁבְעָה֙ לִ֔י וַיִּשָּׁבַ֖ע ל֑וֹ
    he_translit: va-yomer hishava-ה li-y va-yishava l-o
    en: "he said: swear to me — and he swore to him (etnachta on l-o) [VERIFIED: SNAPSHOT Gen.47.31 idx4 etnachta in-stream]"
  tree_right:
    he: וַיִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַמִּטָּֽה
    he_translit: va-yishtachu yisrael al-rosh ha-mita
    en: "and Israel bowed upon the head of the bed (verse-final ha-mita) [VERIFIED: SNAPSHOT Gen.47.31 idx5-9]"
  operators:
  - op: DECLARE
    expr_en: "DECLARE(yisrael, LET(hishava_li))"
    he: וַיֹּאמֶר הִשָּׁבְעָה לִי
    he_translit: va-yomer hishava-ה li-y
    en: >
      THE OATH ASKED. HISHAVA li — 'SWEAR to me': the father converts the
      acceptance (47:30) into covenant-grade security — the word alone did
      not suffice where a grave is at stake (the machine notes the
      escalation: word, then oath; 50:5-6 will trade on exactly this oath
      before Pharaoh).
    cites: []
    confidence: tested
  - op: RESULT
    expr_en: "RESULT: HOLDS(hishava_li, t4)"
    he: וַיִּשָּׁבַע לוֹ
    he_translit: va-yishava l-o
    en: >
      SWORN IN PLACE [G70-13]. va-YISHAVA lo — 'and he SWORE to him': the
      demand discharges inside its own verse (the same-verse class); va-
      YISHTACHU yisrael al ROSH ha-mita — 'and Israel BOWED on the head of
