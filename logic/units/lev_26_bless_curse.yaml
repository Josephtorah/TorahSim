          'Walk in My statutes' cannot be the commandments — 'keep My
          commandments and do them' says that — so walking = LABOR IN
          TORAH (the Omnipresent desires it: Psalm 81, Isaiah 48, Deut 5);
          the curse's 'not listen to Me' splits the same way at 26:14. THE
