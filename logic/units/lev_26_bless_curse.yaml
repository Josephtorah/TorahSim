          when made and each under 'you shall not set up' — the Mercury-
          heaps on the roads (Rabban Shimon b. Gamliel: the sun-images on
          the roofs); 'a figured stone... IN YOUR LAND to bow upon' — in
          your land on no stone, but on the SANCTUARY'S stones you do bow:
          the place clause carves the sanctuary out. Onkelos: טַעֲוָן
          ('errors') for idols — the contempt performed; אֶבֶן סָגְדָא ('a
          stone of bowing') — defined by use.
