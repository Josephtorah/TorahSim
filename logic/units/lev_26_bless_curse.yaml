          heart, so remember = RECITE WITH THE MOUTH; the same pairing at
          the desert provocation, Miriam, Amalek — four seats. 'Keep and
          DO' — one who learns in order to do; who learns not to do,
          better uncreated. Onkelos: בִּקְיָמַי תְּהָכוּן ('in My statutes
          you shall walk') — the walking kept, the labor not written in.
