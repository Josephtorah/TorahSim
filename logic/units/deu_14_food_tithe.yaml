        en: >
          THE WATER AND THE BIRDS: OF ALL THAT IS IN THE WATERS, WHAT HAS FINS
          AND SCALES YOU MAY EAT, AND WHAT HAS NOT YOU SHALL NOT — UNCLEAN TO
          YOU; EVERY CLEAN BIRD YOU MAY EAT, AND THESE YOU SHALL NOT — THE
          EAGLE, THE OSSIFRAGE, THE OSPREY, THE GLEDE, THE KITE, THE VULTURE
          AFTER ITS KIND, EVERY RAVEN, THE OSTRICH, THE NIGHT-HAWK, THE
          SEA-MEW, THE HAWK, THE LITTLE OWL, THE GREAT OWL, THE HORNED OWL,
          THE PELICAN, THE CARRION-VULTURE, THE CORMORANT, THE STORK, THE
          HERON, THE HOOPOE AND THE BAT; EVERY SWARMING THING OF THE FOWL IS
          UNCLEAN TO YOU, THEY SHALL NOT BE EATEN; EVERY CLEAN FOWL YOU MAY
          EAT [claim DV14-03]. THE WATER AND THE BIRDS: OF ALL THAT IS IN THE
          WATERS, WHAT HAS FINS AND SCALES YOU MAY EAT, AND WHAT HAS NOT YOU
          SHALL NOT — UNCLEAN TO YOU; EVERY CLEAN BIRD YOU MAY EAT, AND THESE
          YOU SHALL NOT — THE EAGLE, THE OSSIFRAGE, THE OSPREY, THE GLEDE, THE
          KITE, THE VULTURE AFTER ITS KIND, EVERY RAVEN, THE OSTRICH, THE
          NIGHT-HAWK, THE SEA-MEW, THE HAWK, THE LITTLE OWL, THE GREAT OWL,
          THE HORNED OWL, THE PELICAN, THE CARRION-VULTURE, THE CORMORANT, THE
          STORK, THE HERON, THE HOOPOE AND THE BAT; EVERY SWARMING THING OF
          THE FOWL IS UNCLEAN TO YOU, THEY SHALL NOT BE EATEN; EVERY CLEAN
          FOWL YOU MAY EAT. 'Fins and scales' five seats; 14:9 twelve of
          twelve tokens of 11:9 in order (the seas and the rivers dropped);
          'every clean BIRD' (14:11) before and 'every clean FOWL' (14:20)
          after — the two frames, each ONE seat: THE PERMITTED BIRDS HAVE NO
          SIGN IN THE INK; 14:15 IS 11:16 TO THE LETTER; THE RA'AH AND THE
          DA'AH — resh for dalet, 14:13's three names against 11:14's two (the
          dayyah added; the ra'ah's letters the verb 'see' at two other seats
          — the shelf's reading of the name); the shalach and the tinshemet
          moved from 11:17-18's order; the racham spelled rachamah; 'after its
          kind' four in each list; twenty-one names against Leviticus
          11:13-19's twenty; 'THEY SHALL NOT BE EATEN' the chapter's one
          third-person form; LEVITICUS 11:21-22'S FOUR PERMITTED LOCUSTS ARE
          NOT IN THIS CHAPTER (the Leviticus 11 ledger's rows credited). THE
          SHELF: THE LEXICON RULE — wherever 'bird' is said, Scripture speaks
          of a clean one (98:3 — R. Josiah; 228:5 THE PARADIGM APPLIED AT THE
          BIRD'S NEST: sent away and returned, exempt from sending again — I3,
          never read ahead), 'fowl' and 'bird' the two frames' two nouns (98:4
          — R. Isaac, the row without a citation); THE RA'AH IS THE DAYYAH,
          all a kind of dayyah, a hundred kinds in the East all a kind of
          ayyah (98:5 — Issi son of Judah; Chullin 63b at 12b); the leper's
          two birds argued in both directions from the two frames (103:1-2 —
          Leviticus 14:4 by CALL); 'EAGLE' HERE AND THERE — the whole list
          under 'do not feed' and 'do not eat' (103:3 — I2, R. Akiva); 'ayyah'
          here and there — the ra'ah made a kind of ayyah (103:4 — I2, R.
          Shimon); the raven's kinds and the starling, the hawk's kind
          (103:5-6); the clean fowl outnumber the unclean — SCRIPTURE
          SPECIFIES THE FEWER (103:7); THE SIGNS OF THE FOWL WERE NOT SAID —
          every fowl that seizes is unclean, THE EAGLE THE FATHER OF THE
          CLASS: no crop, no extra toe, no peelable gizzard, seizes and eats
          (103:8 — I3; Mishnah Chullin 3:6 in the row's own Hebrew: the
          compile's parameter the_birds_signs from the answer sheet, not the
          code — the code/data separation law's own case inside the spine);
          'every clean fowl' a positive command (103:9); THE LOCUSTS IN THE
          FRAMES — the clean and the unclean (103:10 — R. Shimon) where the
          ink names none. THE REGISTER: plural throughout; 14:13-18 neither
          number — the list; 'unclean' at 10 and 19. Onkelos: 'fins and
          scales' the Aramaic's own pair, the ra'ah 'THE DAUGHTER OF THE
          WING', the ar and the aziya, the kadya, the kefufa and the buta, the
          fish-drawer for the cormorant, the mountain-carpenter for the hoopoe
          — names, not glosses.
