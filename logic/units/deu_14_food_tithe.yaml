        en: >
          THE THIRD YEAR: AT THE END OF THREE YEARS YOU SHALL BRING OUT ALL
          THE TITHE OF YOUR PRODUCE IN THAT YEAR AND LAY IT UP WITHIN YOUR
          GATES, AND THE LEVITE, FOR HE HAS NO PORTION NOR INHERITANCE WITH
          YOU, AND THE SOJOURNER AND THE FATHERLESS AND THE WIDOW WITHIN YOUR
          GATES SHALL COME AND EAT AND BE SATISFIED, THAT THE LORD YOUR GOD
          MAY BLESS YOU IN ALL THE WORK OF YOUR HAND WHICH YOU DO [claim
          DV14-07]. THE THIRD YEAR: AT THE END OF THREE YEARS YOU SHALL BRING
          OUT ALL THE TITHE OF YOUR PRODUCE IN THAT YEAR AND LAY IT UP WITHIN
          YOUR GATES, AND THE LEVITE, FOR HE HAS NO PORTION NOR INHERITANCE
          WITH YOU, AND THE SOJOURNER AND THE FATHERLESS AND THE WIDOW WITHIN
          YOUR GATES SHALL COME AND EAT AND BE SATISFIED, THAT THE LORD YOUR
          GOD MAY BLESS YOU IN ALL THE WORK OF YOUR HAND WHICH YOU DO. 'AT THE
          END OF THREE YEARS' — THE NUMBER VERSE, the parser reading [3]
          (measured; 'years' starred as the plural of 'two', 'the tithe of'
          starred and no number read); Samaria's fall the phrase's one kin (2
          Kings 18:10); 'at the end of' the book's seven seats — 15:1's and
          31:10's seven years the kin (never read ahead); 'the tithe of your
          produce' 26:12's clause — THE THIRD YEAR'S TITHE, its confession
          ahead (the closest verse by computation); THE FOUR AT THE GATE the
          formula's first seat (16:11, 16:14 ahead; the 'to' form at 24:19-21
          and 26:12); 'eat and be satisfied' ONE seat in this form; 'THAT THE
          LORD MAY BLESS YOU IN ALL THE WORK OF YOUR HAND' — 24:19's forgotten
          sheaf the twin (seven tokens in order), 2:7's the first; 14:29's
          closest kin by computation 14:27 itself. THE SHELF: NOT AT THE
          FESTIVAL, NOT AT HANUKKAH — 'end' here and at 31:10 gives a
          pilgrimage festival (109:1-2 — I2), and 'when you have finished
          tithing' (26:12) picks PASSOVER: THE EVE OF THE LAST FESTIVAL DAY OF
          PASSOVER OF THE FOURTH AND THE SEVENTH YEAR (109:3 — Mishnah Maaser
          Sheni 5:6: THE REMOVAL'S DATE A CLOCK DATUM for the compile); the
          seventh year not liable (109:4 — Exodus 23:10-11 by CALL); ONE TITHE
          PRACTISED, NOT TWO (109:5 — the poor man's tithe replaces the second
          in the third and the sixth year); every tithe removed, from
          uncleanness to cleanness, that year's alone, the vegetable from the
          New Year to Passover (109:6-8 — Rosh Hashanah 12a at 12b); laid up
          in the store when no poor man is there (109:9); WHICH TITHE YIELDS —
          the second, the Levite's 'no portion' the proof (109:10 — R. Judah),
          and THE FIRST TITHE DOES NOT MOVE, an inheritance (109:11 — R.
          Eliezer son of Jacob; Numbers 18:21 by CALL); the gleanings, the
          forgotten sheaf and the corner exempt — things in which he has a
          portion with you (109:12 — Leviticus 19:9-10 and 23:22 by CALL); THE
          FOUR IN WANT — Leviticus 19:10's 'poor' against 24:17's widow rich
