          I3): THE SOJOURNER OF 14:29 THE CONVERT AGAINST 14:21'S RESIDENT
          ALIEN — ONE NOUN, TWO PERSONS IN ONE CHAPTER (Onkelos writes the
          two, asserted); enough to satisfy them — not less than half a kav of
          wheat or a kav of barley (110:3 — Tosefta Peah 4:2 in the row's
          Hebrew: a quantity, the data channel); not taken out of the Land
          (110:4); the house of Neballata's six hundred talents kept in
          Jerusalem (110:5 — the row without a citation). THE REGISTER:
          singular; the consecutive perfects 'and shall come', 'and eat', 'and
          be satisfied'; the chapter's last 'for'. Onkelos: 'from the end of
          three years' the number carried, 'store it in your cities', 'the
          CONVERT, the orphan and the widow', 'they shall eat and be
          satisfied'.
