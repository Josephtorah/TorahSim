e, on strong drink, on whatever your soul asks of you, and eat there before the lord and rejoice, you and your household; and the levite within your gates you shall not forsake, for he has no portion nor inheritance with you; the third year: at the end of three years you shall bring out all the tithe of your produce in that year and lay it up within your gates, and the levite, for he has no portion nor inheritance with you, and the sojourner and the fatherless and the widow within your gates shall come and eat and be satisfied, that the lord your god may bless you in all the work of your hand which you do.
