          THE MONEY ON WHATEVER YOUR SOUL DESIRES, ON OXEN, ON SHEEP, ON WINE,
          ON STRONG DRINK, ON WHATEVER YOUR SOUL ASKS OF YOU, AND EAT THERE
          BEFORE THE LORD AND REJOICE, YOU AND YOUR HOUSEHOLD; AND THE LEVITE
          WITHIN YOUR GATES YOU SHALL NOT FORSAKE, FOR HE HAS NO PORTION NOR
          INHERITANCE WITH YOU. 'THE WAY TOO LONG' — 19:6's refuge road the
