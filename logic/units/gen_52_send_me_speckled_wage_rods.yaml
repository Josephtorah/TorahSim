  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #6 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    30:25-43, from the moment of Joseph's birth to the flock explosion. 19
    verses · 278 tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C.
    Conventions: step he: = plain (no accents/meteg; maqqef ־ per snapshot);
    tree halves = accents kept, slashes stripped; split at etnachta (all 19
    verses have one; at 30:28 it sits on the FIRST token va-yomar, at 30:34
    on the third, hen — one-word and three-word left halves, mechanical).
    Onkelos BUFFER PENDING.

    UNIT SHAPE — THREE pushes, ONE pop, and a never-performed send. The unit
    opens on gen_51's last write ("when Rachel had borne Joseph"): Jacob
    pushes LET(shalcheni(lavan)) — SEND ME — and LET(tena_nashai_viladai
    (lavan)) — hand over my wives and children. Laban counter-pushes
    LET(naqva_sekhar(yaaqov)) — designate your wage — and that card pops at
    30:32 by content-performance: the wage is NAMED (every speckled, spotted,
    and dark head, "ve-haya sekhari"). The other two never pop: no give-token
    ever hands over wives or children (the give-walk's in-span objects are
    checked), and the send-demand is performed by NO ONE — chapter 31 answers
    it with FLIGHT; the send-verb's next tokens are Jacob sending FOR his
    wives (31:4), Laban's counterfactual "I would have SENT you away with
    joy" (31:27), and Jacob's "you would have SENT me away empty" (31:42):
    the never-performance filed in both mouths, beyond the wall. Ends SPECS
    depth 2 OPEN — the second consecutive unit wall at depth 2 (gen_51
    ended depth 2; gen_50 ended depth 1). REGISTRY 0
    (no naming formula in-span). TESTS 0 (zero tov-tokens in-span,
    DB-checked).

    CARE-POINTS (filed before derivation; every ordinal DB-verified):
    (1) 30:25 THE CLOCK: va-yehi ka-asher yalda rachel et-yosef — the unit
    opens on gen_51's twelfth write; yosef name-token 2/175. shalcheni
    (7971 tok30/201 HVpv2ms+1cs suffix) — PUSH; ve-elkha (HC/Vqh1cs)
    purpose-cohortative, gen_46 27:4 class, no push. el-meqomi u-le-artzi —
    place and land (the Bethel handler's return-clause resonance, prose
    only).
    (2) 30:26 tena (5414 tok77/647 HVqv2ms+Sh) — PUSH tena_nashai_viladai;
    avodah 5656 tok2/83 (tok1 = 29:27 its birth, gen_50's care 13 bridge
    LANDS; toks 3+ = Exod 1:14 Egypt); avadti/avadticha (5647 toks
    18-19/113); ve-elekha cohortative again.
    (3) 30:27 nichashti (5172 tok1/7 DEBUT) — THE DIVINATION-VERB IS BORN
    IN LABAN'S MOUTH: toks 2-5 = 44:5,15 JOSEPH's cup ×4; toks 6-7 = the
    PROHIBITIONS (Lev 19:26, Deut 18:10) — debut in Laban, career to
    Joseph's cup, death in law. chen 2580 tok4/27 (Noah 6:8, Abraham 18:3,
    Lot 19:19 — then Laban; next block = Jacob toward Esau, 32:6-33:15).
    biglal 1558 tok2/6 — for-your-sake: 12:13 (Abram at Sarai) → Laban at
    Jacob → 39:5 (YHWH blesses the EGYPTIAN's house for JOSEPH's sake).
    YHWH in Laban's mouth (va-yevarakheni YHWH).
    (4) 30:28 naqva (5344 tok1/7 DEBUT HVqv2ms+Sh) — the DESIGNATE-verb is
    born as "name your wage"; its six later tokens: Lev 24:11,16 ×3 (the
    blasphemer PRONOUNCING the Name), Num 1:17 (the census men designated
    BY NAME), Num 23:8,25 (Balaam's curse-designations).
    PUSH LET(naqva_sekhar(yaaqov)); sakhar-noun 7939 tok3/12 (gen_51 care
    18 bridge LANDS: toks 3-5 in-span); ve-etena (5414 tok78) cohortative
    counter. Depth 3.
    (5) 30:29-30 THE AUDIT: avadticha tok20; miqneh 4735 tok8/51. paratz
    (6555 tok2/7) — THE BETHEL PLEDGE LANDS: tok1 = 28:14 u-faratzta
    ("you shall BREAK OUT," God's own pledge at the ladder) — its first
    return performs on Laban's flock; tok3 = 30:43, on Jacob himself.
    la-rov (7230 tok3/12: 16:10 Hagar's seed, 27:28 the blessing's
    abundance); le-ragli (7272 tok7/60; tok6 = 29:1 "lifted his feet");
    matai eese gam anokhi le-veti — when for MY house (the vow's bet-Elohim
    resonance, prose only).
    (6) 30:31 lo titen li meuma — GIVE NOTHING: give toks 79-80 (ma eten /
    lo titen); meuma 3972 tok2/9 — tok1 = 22:12 THE AKEDAH ("do not do
    ANYTHING to him"); toks 3-6 = the Joseph house-trust cluster
    (39:6,9,23, 40:15). ashuva ere eshmor — 1cs cohortative with NO
    addressee: pushes nothing (gen_47's 27:41 ve-aharga fence).
    (7) 30:32 THE POP: the wage NAMED — kol se naqod ve-talu ... ve-haya
    sekhari (sakhar tok4). naqod 5348 toks 1-2/9 DEBUT ×2 (toks 6-9 =
    31:8-12, the next unit's retell); tala 2921 toks 1-2/6 (all six
    in-span); chum 2345 tok1/4 (all four in-span); seh 7716 toks 3-4/28 —
    toks 1-2 = THE AKEDAH's lamb (22:7,8): the lamb-word's career runs
    altar-question → wage-definition → pesach (Exod 12). POP
    naqva_sekhar, latency 4 verses, content-performance. Depth 2.
    (8) 30:33 THE HONESTY CLAUSE: tzedaqah 6666 tok3/9 — the
    righteousness-word's third token ever: 15:6 (counted to Abram), 18:19
    (the way of YHWH), now a flock audit ("my righteousness shall ANSWER
    for me"). machar 4279 tok1/17 DEBUT — TOMORROW is born here; career =
    the plague-tomorrows and the catechism-tomorrows (Exod 13:14, Deut
    6:20). ganuv (1589 tok1/21 DEBUT) — the STEAL-verb is born inside an
    innocence formula ("counted as STOLEN with me") and its next EIGHT
    tokens are chapter 31's theft-storm (terafim 31:19, heart-stealing
    31:20,26,27...). Depth 2.
    (9) 30:34 hen lu yehi khi-devarekha — the deal accepted on the word
    yehi (1961 tok192/1050, HVqi3ms imperfect — same surface as 1:3's
    fiat, different tag: fenced, prose only). Etnachta on hen (idx2).
    (10) 30:35-36 THE SAME-DAY REMOVAL: va-yasar BA-YOM HA-HU — the yom
    walk 96-99 in-span: ha-yom (the deal, 30:32) → be-yom machar (the
    audit, 30:33) → ba-yom ha-hu (the trick, 30:35) → derekh sheloshet
    YAMIM (the gap, 30:36); tok100 = 31:22 ("on the THIRD day Laban was
    told" — the seam continues). teyashim 8495 tok1/2 (tok2 = 32:15, the
    Esau-tribute he-goats). lavan-WHITE 3836 tok1/25 DEBUT — "every one
    that had WHITE in it" — see care 12. va-yiten be-yad BANAV (give
    tok81) — the give-verb's trick-token: into his SONS' hand. notarot
    (3498 tok1/33 DEBUT) — the REMAIN-verb debuts on the leftover flock;
    tok2 = 32:25 va-yivater yaaqov LEVADO — Jacob himself the remnant at
    Peniel. sheloshet yamim — the three-days gap (22:4's third day; 31:22
    next).
    (11) 30:37-38 THE RODS: maqal 4731 toks 1-2/9 DEBUT (toks 3-6
    in-span; tok7 = 32:11 "with my STAFF I crossed this Jordan"). THREE
    tree-hapaxes in one verse: livne poplar 3839 1/1 (itself from the
    white-root), luz almond 3869 1/1 (the tree-word wears the surface of
    LUZ the city renamed Beit-El in gen_48 — different strong, 3869 vs
    3870, FENCED), armon plane 6196 1/1. patzal 6478 toks 1-2/2 (career
    complete in-span) + petzalot 6479 1/1 + machsof 4286 1/1 — five
    hapax-class tokens in the rod-verse pair. rahat 7298 toks 1-2/3 —
    tok3 = Exod 2:16, ZIPPORAH's troughs: the trough-word's whole career
    is shepherd-courtship scenes and this trick. shoqet 8268 tok2/2 —
    CAREER CLOSES: tok1 = 24:20, REBEKAH's bride-test trough. yacham 3179
    tok1/6 DEBUT (conceive-heat; toks 1-4 of 6 in-span, tok5 = 31:10 the
    dream-retell).
    (12) 30:37 THE WHITE PEELED — the name-pun as token-fact: petzalot
    LEVANOT machsof HA-LAVAN — the white-adjective (3836, toks 2-3/25;
    tok1 = 30:35) debuts and clusters INSIDE the Laban-name story (3837,
    seven in-span name-tokens) — Jacob peels the white out of laban's
    rods; strongs distinct (3836 white / 3837 Laban), the pun is carried
    by surface alone, FENCED as token-fact. The white-word's career: tok4
    = 49:12 (teeth white with milk), tok5 = Exod 16:31 (the manna), toks
    6+ = LEVITICUS 13 — the quarantine-law's diagnostic color: the
    corpus's law unit (lev_13) reads its whiteness from a career that
    debuts on these rods.
    (13) 30:39-40 THE CONCEPTION AND THE SORT: va-teladna aqudim nequdim
    u-teluim — the offspring wear the deal's three adjectives (aqod 6124
    toks 1-3/7 in-span; toks 4-7 = 31:8-12 retell). hifrid (6504 tok8/9)
    — THE ORACLE'S VERB: toks 1-7 = Eden's river parting (2:10), the
    nations (10:5,32), Abram-Lot (13:9,11,14), and 25:23's "two peoples
    SHALL BE PARTED" — the separation-word becomes husbandry. eder 5739
    tok5/10 (toks 1-4 = gen_49's well-flocks; toks 6-10 = the Esau-gift
    droves, 32:17,20 — all ten tokens live in the Jacob cycle). give
    tok82 (va-yiten pene ha-tzon).
    (14) 30:41-42 THE STRONG AND THE FEEBLE: mequsharot/qeshurim (7194
    toks 1-2/6) — the BIND-verb debuts in flock-sorting; its career ends
    at Deut 6:8/11:18 "BIND them as a sign" (the sign-binding command) —
    token-walk only. ataf 5848 toks 1-2/2 — the feeble-word's whole
    career inside one verse. The sort-line: the feeble to Laban, the
    bound-strong to Jacob.
    (15) 30:43 THE BREAK-OUT DOUBLED: va-yifrotz ha-ish MEOD MEOD —
    paratz tok3/7 (28:14's pledge now performing on Jacob himself); the
    consecutive meod-meod pair's four precedents (DB-scan of consecutive
    3966 pairs): 7:19 (the waters prevailed meod meod) and 17:2/6/20 —
    the covenant multiply-exceedingly formula (Abram ×2, Ishmael): the
    flock explosion borrows the covenant's doubling. Wealth-list: tzon
    rabot u-shefachot va-avadim u-gemalim va-chamorim (shifchah 8198
    tok21/31 — gen_50's dowry maid-word now plural property; list-form
    kin: 12:16, 24:35, 26:14 — prose only). UNIT END: depth 2 OPEN
    (shalcheni · tena_nashai_viladai). REGISTRY 0. TESTS 0.

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_52_2026-08-08.md; manifest verified
    19/19 checkable, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified). THE REMAINING FLOCK AND THE
    SKELETON COLLISION [G52-08/09, Minchat Shai citing the Masorah,
    the Ramah, and Bereshit Rabbah 73]: the letter-skeleton הנותרת
    ("the remaining") stands exactly THREE times in the Torah, but
    only two are the Masorah's word — the plural "the flock
    REMAINING" (30:36) and "according to the years REMAINING"
    (Lev 27:18), both written lean without the second vav as ruled,
    Jeremiah's full third (34:7) named outside; the third Torah token
    (Lev 10:12) is the SINGULAR "the meal-offering that remains," a
    different word — and it is precisely the plural's missing vav
    that collapses the two words into one skeleton. SNAPSHOT stands
    with the Masorah's written form against Resh Lakish's claimed
    form נתרת ("dropped away" — both vavs gone). THE SPECKLED-WORD
    LEAN EVERYWHERE [G52-06]:
    נקד ("speckled") bare exactly twice — the wage named (30:32) and
    the wage audited ("whatever is not speckled... is stolen," 30:33)
    — lean with the Hilleli and all the books against the
    Yerushalmi's full form, and the Ramah's whole-Torah rule holds:
    no full speckled-form anywhere in the Torah, builder-checked
    across every prefixed and suffixed form. THE ANDROGYNOUS VERB AT
    THE TROUGHS [G52-13]: ויחמנה ("and they CAME INTO HEAT when they
    came to drink," 30:38) — the Masorah's THREE-word list of forms
    bearing both signs, the masculine yod at the head and the
    feminine nun-he at the tail, "the male preceding the female"; the
    Torah's one member carries exactly that skeleton in the stream
    (the cows of Beth Shemesh, I Sam 6:12, and Daniel's four
    kingdoms, Dan 8:22, named outside). THE SEVIRIN "ON" [G52-14]:
    ולא שתם על צאן לבן ("he did not set them ON the flock of Laban,"
    30:40) — the sense expects WITH (עם), the letter writes ON (על),
    and the written form stands in the stream: the sevirin class
    takes its second in-corpus member after Sodom's morning (19:23).
    TOMORROW'S DAY, SPOKEN ONCE [G52-18, Kitzur Baal HaTurim]: ביום
    מחר ("so shall my righteousness answer for me IN THE DAY TO
    COME," 30:33) — the two-word form Torah-unique at Jacob's one
    boast about tomorrow, paired by the Masorah with "do not boast
    about the day to come" (Prov 27:1, named): the Kitzur hears the
    rebuke arm itself at the gate of the Dinah chapters. THE FEEBLE
    ONES AND THE FAMINE [G52-17, Kitzur]: העטפים ("the FEEBLE ones
    were Laban's," 30:42) — the word's only Torah token, paired by
    the Masorah with "the ones WRAPPED in famine at the head of every
    street" (Lam 2:19, named); quiet variance noted: the Kitzur's
    headword cites the pair full with vav, SNAPSHOT writes the Torah
    member lean, the u-vowel carried by the point alone. THE
    PEEL-VERB'S LONG E [G52-11]: פצל ("the rods that he had PEELED,"
    30:38) — tzadi dageshed in tzere with all the books and the
    Michlol, Minchat Shai's own arbitration AGAINST the Mikraot
    Gedolot printer who called every pointer mistaken. MY-PLACE
    WRITTEN FULL [G52-01]: מקומי ("to MY PLACE," 30:25 — the first
    word of the never-performed send-me demand) plene with the Ramah
    against one old book's recorded lean form. POINTING AS RULED
    [G52-03/04/05/07/10/15/16, Minchat Shai]: גם ("also I") soft
    gimel; לי ("give ME nothing") soft lamed; שה ("every dark LAMB")
    joined by maqqef (the joining stroke) with NO meteg on the shin
    per Ben Asher's own variant-lists; העזים ("the she-goats") zayin
    dageshed; לבנה ("poplar") nun in segol; המקשרות ("the sturdy
    ones") mem soft against the minority meteg camp; ליחמנה ("that
    they might come into heat") mem in tzere with the precise
    Sephardic books. DISCREPANCIES: the bless-word's half-vowel,
    station ELEVEN [G52-02] — ויברכני ("and YHWH has BLESSED ME," in
    Laban's mouth, 30:27): ruled resh with plain sheva, SNAPSHOT
    hataf patach (the compound half-vowel) — the characterized law's
    eleventh station, the bless-word family's fifth; and the
    wrapping-verb's absent strokes [G52-19] — ובהעטיף (30:42): Ben
    Asher's metegs on the vav and tet absent from the stream,
    meteg-omission class member 4. SPLIT-ATTESTED: the troughs'
    half-vowel — THE CLASS TAKES A QOF [G52-12]: בשקתות ("in the
    water TROUGHS," 30:38) — Minchat Shai's books write the qof with
    hataf patach, the Michlol's precise books plain sheva (compound
    only in the mouth, by force of the meteg on the hiriq); SNAPSHOT
    joins the written-hataf camp WHILE carrying the Michlol's driving
    meteg in the same word — split-attested station 4, the class's
    first qof, a fourth consonant for the consonant-general law.
    INSTRUMENT GAPS: the large-pe question [G52-20, manual] — the pe
    of ובהעטיף ("and when the flock was feeble"): some printed books
    make it large, Minchat Shai sides with the precise books AGAINST
    the enlargement; the letter-size layer is uninstrumented, the
    question filed, not settled. READINGS (named-only, unclaimed):
    the Kitzur's Dinah-warning at tomorrow's day; the Kitzur's two
    readings of the feeble stock; Resh Lakish reading the remaining
    flock as dropped away like the Caesar's teeth (Bereshit Rabbah
    73), overruled by the Masorah's own count.
