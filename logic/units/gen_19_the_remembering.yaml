state_machine:
  comment_en: "The remembering (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 8:1 — all registers empty (standalone unit)"
    - id: S_remembered
      en: "After 8:1 — the remember-event (Agent: elohim — the Name back, speech not); the wind passes; the waters subside; noach/tevah/mayim flagged as read"
    - id: S_shut
      en: "After 8:2 — the near-verbatim shut-mirror: fountains and windows stopped (hapax verb, agentless), the rain restrained (agentless)"
    - id: S_receding
      en: "After 8:3-5 — the waters commute (going-and-returning); the 150-bracket closed; the ark RESTS on Ararat (month 7 day 17, fact); the tops appear by day 3's formula (month 10 day 1, fact)"
    - id: S_inquiring
      en: "After 8:6-8 — the window he made opened (end of forty days); the raven shuttling; the dove sent to SEE whether the waters abated"
    - id: S_returned_empty
      en: "After 8:9 — no resting-place for the sole of her foot (fact, not FAIL); the return; the hand sent, the take, the bring-in"
    - id: S_leaf
      en: "After 8:10-11 — the first wait (verb one); the second sending; the dove back at the first evening since the week, olive leaf in mouth; Noach KNOWS the waters abated"
    - id: S_released
      en: "After 8:12 — the second wait (verb two, the hapax); the third sending; she returns no more — the verse ends on the lone word OD ('any more')"
    - id: S_anchored_dry
      en: "After 8:13 — TIME t0 = year-601/month-1/day-1 (the second full calendar date); the waters parched (fact); the cover removed; the seeing without a verdict-word"
    - id: S_dry_sealed_in
      en: "After 8:14 — month 2 day 27: the earth dry (fact); queue empty as it began — readiness without permission; the exit-word belongs to 8:15"
  transitions:
    - {from: S_boot, to: S_remembered, via: STEP_Gn_8_1}
    - {from: S_remembered, to: S_shut, via: STEP_Gn_8_2}
    - {from: S_shut, to: S_receding, via: STEP_Gn_8_3}
    - {from: S_receding, to: S_receding, via: STEP_Gn_8_4}
    - {from: S_receding, to: S_receding, via: STEP_Gn_8_5}
    - {from: S_receding, to: S_inquiring, via: STEP_Gn_8_6}
    - {from: S_inquiring, to: S_inquiring, via: STEP_Gn_8_7}
    - {from: S_inquiring, to: S_inquiring, via: STEP_Gn_8_8}
    - {from: S_inquiring, to: S_returned_empty, via: STEP_Gn_8_9}
    - {from: S_returned_empty, to: S_leaf, via: STEP_Gn_8_10}
    - {from: S_leaf, to: S_leaf, via: STEP_Gn_8_11}
    - {from: S_leaf, to: S_released, via: STEP_Gn_8_12}
    - {from: S_released, to: S_anchored_dry, via: STEP_Gn_8_13}
    - {from: S_anchored_dry, to: S_dry_sealed_in, via: STEP_Gn_8_14}

state_after:
  - id: AFTER_S_dry_sealed_in
    en: >
      TIME: t0 = shnat_601_chodesh_1_yom_1 — the register's SECOND
      full calendar value (gen_17's was year-600/month-2/day-17;
      this is new year's day of the year after), anchored at the
      date ladder's only year-bearing rung; the other rungs (month
      7 day 17; month 10 day 1; month 2 day 27) held as facts —
      single-anchor decision recorded. WORLD: ZERO installs (+3
      presupposed: noach, tevah, mayim — the standing trio).
      Standing facts (18): the two infinitive-pair gaits
      (going-and-returning; going-and-diminishing), the closed
      150-bracket, the resting date and Ararat, the appearing
      tops, the end-of-forty, the raven's shuttle-horizon, the
      dove's question, the NO-RESTING-PLACE (fact, not FAIL — the
      clause Deut 28:65 will quote verbatim), the
      waters-on-all-the-earth, the second seven, the olive leaf,
      the no-more-return, the parched waters, the parched
      ground-face, the exit-less dry-date pair. EVENTS (23): the
      REMEMBER and the PASS with a NAMED divine agent (elohim —
      the register-level difference from nameless gen_18), the
      subside, the two agentless shuttings (the hapax stop-up +
      the restrain), the return and diminish, the REST (the
      builder's name-sound), the window OPEN (sky-verb to hand),
      five SENDS (raven, dove, the hand, dove, dove — the
      Eden-expulsion verb turned scout), the dove's return, the
      take, the BRING-IN (the boarding-verb gone causative), two
      WAITS in two different verbs (the second a Torah hapax),
      the evening COME, the KNOW (knowledge from a carried sign),
      the cover-REMOVE, and the SEE with no verdict-word.
      REGISTRY: ZERO writes (fifth unit running). SPECS: EMPTY
      THROUGHOUT — second zero-traffic queue in a row: the
      remembering commands nothing; the exit-command is 8:15's
      (next unit). TESTS: EMPTY — the dove's lo-matzah ('did not
      find') held OUT of the register by decision (no oracle, no
      verdict-adjective; the see-verb appears only as purpose and
      as verdict-less looking). LEDGER: EMPTY. FLAGS (3):
      read_before_install x3 (noach, tevah, mayim). NO spec-delta.
      The machine ends dry and sealed-in: a new clock, a known
      answer, an empty queue — and no permission yet to leave.

exports:
  - id: EXPORT_remember_debut
    he: וַיִּזְכֹּר אֱלֹהִים אֶת־נֹחַ וְאֵת כָּל־הַחַיָּה
    he_translit: "va-yizkor Elohim et-Noach ve-et kol-ha-chayah"
    en: "ZAKHAR ('remember') — the remember-verb's Torah debut, on Noach AND every animal together; the Name back on the page (Elohim x2, the span's only name-tokens) with NO speech until 8:15 — the second speechless span but not a nameless one; career: the rainbow's I-will-remember (9:15-16), Lot (19:29), Rachel (30:22), the butler who did not (40:14, 40:23); Onkelos renders a mindful STATE and levels the Name — dual-track"
  - id: EXPORT_wind_over_the_flood
    he: וַיַּעֲבֵר אֱלֹהִים רוּחַ עַל־הָאָרֶץ
    he_translit: "va-yaaver Elohim ruach al-ha-aretz"
    en: "AVAR ('pass over') debuts carrying RUACH ('wind/spirit', token 7): 1:2's hovering word set moving — the lexically real creation-mirror opening the reversal; the pass-verb's career runs to Abram's crossing (12:6) and the covenant-pieces (15:17); the subside-verb (shakhakh) is a two-token word shared only with God subsiding the murmurings (Num 17:20)"
  - id: EXPORT_shut_mirror_hapax
    he: וַיִּסָּכְרוּ מַעְיְנֹת תְּהוֹם וַאֲרֻבֹּת הַשָּׁמָיִם
    he_translit: "va-yisakhru mayenot tehom va-arubot ha-shamayim"
    en: "7:11's double breach shut in ONE agentless verb — and the verb is a TORAH HAPAX (sakhar, 'stop up'), not 7:16's door-verb sagar: door and sky get different shut-words; the mirror is NEAR-verbatim — KOL ('all') and RABBAH ('great') dropped: the totalizers do not come back; the two-token window-word (arubot) closes its own bracket; the rain RESTRAINED by the verb whose third token restrains Tabernacle donations (Exod 36:6)"
  - id: EXPORT_the_ark_rests_on_the_name
    he: וַתָּנַח הַתֵּבָה … עַל הָרֵי אֲרָרָט
    he_translit: "va-tanach ha-tevah … al harei Ararat"
    en: "NUACH ('rest') debuts as the ark's arrival-verb, on the consonants of NOACH's own name (5:29 named him from the COMFORT-verb nacham — the letter plays the sound, not the etymology); career: God rests (Exod 20:11), the promised rest (Exod 33:14); the resting is dated month-7-day-17 — five months to the day from the breach — on the mountains that debuted drowned (gen_18) and now carry; Ararat a Torah hapax (Onkelos: Kardu — dual-track)"
  - id: EXPORT_day3_formula_reruns
    he: נִרְאוּ רָאשֵׁי הֶהָרִים
    he_translit: "niru rashei he-harim"
    en: "the mountaintops APPEAR by creation's own formula — the see-verb in niphal, the same verb and stem as 1:9's ve-teraeh ('let the dry land BE SEEN') [lexically verified]; the dry-root family completes the mirror: yavesh ('be dry') — both Torah tokens in-span (the raven's horizon 8:7, the earth's last word 8:14) — is the verb-root of 1:9's yabbashah ('dry land')"
  - id: EXPORT_sendings_and_the_hand
    he: וַיְשַׁלַּח … וַיִּשְׁלַח יָדוֹ … וַיָּבֵא אֹתָהּ
    he_translit: "va-yeshallach … va-yishlach yado … va-yave otah"
    en: "SHALACH ('send'): tokens 1-2 are the Eden EXPULSION (3:22-23); tokens 3-7 are this span's five sendings — raven, dove, the HAND, dove, dove (birds in piel, the hand in qal): the exile-verb turned scout, and its fifth beat is a rescue reach; the take-verb's next token takes the altar's animals (8:20); the bring-in is BO ('come') gone causative — gen_17's self-boarding cargo now carried in by hand"
  - id: EXPORT_manoach_and_the_curse
    he: וְלֹא־מָצְאָה הַיּוֹנָה מָנוֹחַ לְכַף־רַגְלָהּ
    he_translit: "ve-lo-matzah ha-yonah manoach le-khaf-raglah"
    en: "the dove FINDS no MANOACH ('resting-place') — matza's early triptych: no helper found (2:20), Noach found grace (6:8), the dove finds nothing (8:9); and manoach is a TWO-token Torah word whose only other token is Deut 28:65 — 'no resting-place for the sole of your foot': the exile-curse quotes the dove's clause VERBATIM (DB-verified); encoded as FACT, not the corpus's first FAIL — the TESTS register keeps its verdict-formula discipline"
  - id: EXPORT_leaf_evening_knowing
    he: עֲלֵה־זַיִת טָרָף בְּפִיהָ … לְעֵת עֶרֶב
    he_translit: "aleh-zayit taraf be-fiha … le-et erev"
    en: "the dove returns at the FIRST EVENING since the week (erev tokens 1-6 = the creation refrain; token 7 = here) with ET ('time') debuting inside the phrase; ALEH ('leaf') — 3 Torah tokens: shame's fig-leaves (3:7), this good-news leaf, the exile's driven leaf (Lev 26:36); ZAYIT ('olive') debuts en route to the lamp oil (Exod 27:20); TARAF ('freshly-plucked') a Torah hapax; and Noach KNOWS — the inquiry closes in knowledge, not speech; the abate-root of that knowledge (qalal) is the root of 8:21's never-again-CURSE"
  - id: EXPORT_two_waits_two_verbs
    he: וַיָּחֶל … וַיִּיָּחֶל
    he_translit: "va-yachel … va-yiyachel"
    en: "the two seven-day waits come in two DIFFERENT wait-verbs — the chul-root (token 1 of 3), then the yachal-root, a TORAH HAPAX lemma: the letter spends a once-word on the second patience; 8:12 ends on the accent-isolated word OD ('any more') — the dove's story closes on a negated AGAIN; Onkelos levels both waits to one verb — the distinction does not survive translation"
  - id: EXPORT_new_year_cover_off
    he: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ … וַיָּסַר נֹחַ אֶת־מִכְסֵה הַתֵּבָה
    he_translit: "ba-rishon be-echad la-chodesh … va-yasar Noach et-mikhseh ha-tevah"
    en: "the corpus's SECOND full calendar date — year 601, month 1, day 1 — anchors the TIME register (single-anchor decision; the ladder's other rungs held as facts), with RISHON ('first') debuting inside the date (career: Exod 12:2's first-of-months); MIKHSEH ('covering') token 1 — every other Torah token is sanctuary fabric (Tabernacle and march-coverings); CHAREV ('be parched') spends both its Torah tokens in one verse; the see-verb gets no verdict-word; 8:14's exit-less close sits ten days past the entry-date's slot one year on [letter arithmetic; the chain's solar/lunar reading named-only]"

