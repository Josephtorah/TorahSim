state_machine:
  comment_en: "The ark spec (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 6:9 — all registers empty (standalone unit)"
    - id: S_header
      en: "After 6:9-10 — the third toledot; the righteous walker's facts; the cast re-stated; noach flagged as read"
    - id: S_indictment
      en: "After 6:11-13 — the corruption events (one root); the third seeing-mutation flagged; the end-decree confided to the exception"
    - id: S_commission
      en: "After 6:14 — LET(aseh(noach, tevah)) pushed: the first divine imperative to a named individual; the spec-sheet opens"
    - id: S_blueprint
      en: "After 6:15-17 — dimensions, light, door, decks standing; the flood announced over the Speaker's own signature"
    - id: S_covenant
      en: "After 6:18-20 — the covenant word's first token (promised, not yet established); the manifest by kinds, self-loading"
    - id: S_two_demands
      en: "After 6:21 — LET(qach(...)) pushed beside LET(aseh(...)): two open demands, the fullest mid-unit queue yet"
    - id: S_receipt
      en: "After 6:22 — WORLD += tevah (receipted complete); BOTH demands popped by one compliance formula; SPECS empty: the first settled cycle"
  transitions:
    - {from: S_boot, to: S_header, via: STEP_Gn_6_9}
    - {from: S_header, to: S_header, via: STEP_Gn_6_10}
    - {from: S_header, to: S_indictment, via: STEP_Gn_6_11}
    - {from: S_indictment, to: S_indictment, via: STEP_Gn_6_12}
    - {from: S_indictment, to: S_indictment, via: STEP_Gn_6_13}
    - {from: S_indictment, to: S_commission, via: STEP_Gn_6_14}
    - {from: S_commission, to: S_blueprint, via: STEP_Gn_6_15}
    - {from: S_blueprint, to: S_blueprint, via: STEP_Gn_6_16}
    - {from: S_blueprint, to: S_blueprint, via: STEP_Gn_6_17}
    - {from: S_blueprint, to: S_covenant, via: STEP_Gn_6_18}
    - {from: S_covenant, to: S_covenant, via: STEP_Gn_6_19}
    - {from: S_covenant, to: S_covenant, via: STEP_Gn_6_20}
    - {from: S_covenant, to: S_two_demands, via: STEP_Gn_6_21}
    - {from: S_two_demands, to: S_receipt, via: STEP_Gn_6_22}

state_after:
  - id: AFTER_S_receipt
    en: >
      WORLD: ONE install — tevah (the ark: the SECOND human-built
      entry and the first RECEIPTED COMPLETE — against gen_13's
      city, a participle that never finishes; +1 presupposed: noach,
      read). Standing facts (16): the character pair (righteous-
      blameless-in-his-generations [OPEN]; the walk in Chanokh's
      verbatim phrase), the violence fill, the corrupted way, the
      end-decree pair, the spec-sheet (material+rooms, the
      atonement-root sealant, three dimensions, the hapax light,
      sin's door-word as entrance, three decks), the flood
      announcement pair (behold-I-bring; all-shall-expire), the
      covenant promise (BRIT's first token — weqatal, ratification
      waiting in Gen 9) with the boarding list, the manifest pair
      (two-of-all male-and-female; by-kinds self-loading), and the
      food-grant re-issue. EVENTS: the triple begetting re-stated,
      the agentless corruption, the third seeing, the end-decree
      speech, the receipted MAKE — plus the two declares and the
      two results. REGISTRY: ZERO writes (second unit running — the
      spec names nothing, not even the ark). SPECS: EMPTY at unit
      end — and that emptiness is the unit's SIGNATURE: two demands
      pushed (the corpus's first divine imperatives to a named
      individual — make, 6:14; take, 6:21) and BOTH POPPED by the
      one compliance formula (ke-khol asher tzivah... ken asah —
      the make-verb doubled): the FIRST FULLY-SETTLED
      DIVINE-TO-HUMAN COMMAND CYCLE (2:16's first rule was
      violated; 6:14's is built; the corpus-wide inherited debt —
      five open demands in prior frozen units — stands outside
      this standalone machine, prose until Stage E). TESTS: EMPTY
      (no verdict token; the third seeing returns a flagged
      mutation, not a test). LEDGER: EMPTY. FLAGS (2):
      read_before_install x1 (noach), spec_delta x1 (ve-hinneh tov
      meod -> ve-hinneh nishchatah, cited against frozen 1:31).
      The machine ends with a finished hull, an empty queue, and a
      covenant word waiting for its ratifying unit.

