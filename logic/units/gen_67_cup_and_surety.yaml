    machine's two great OPEN entries: the DISMISSAL (alu le-shalom,
    44:17 — go up in peace to your father) is pushed and NEVER
    obeyed: the next verse is Judah stepping CLOSER — the queue
    holds the release-order open while the speech overturns the
    board; and the SUBSTITUTION (yeshev-na avdekha tachat ha-naar,
    44:33) — the seller offering himself sold — stands open at the
    span's end: the answer it receives is not a receipt but the
    unmasking (45:1), which the corpus world will carry as an
    authored settlement link. Queue at close: TWO OPEN, both
    load-bearing. REGISTRY 0; TESTS 0 (the steward's trial is
    stagecraft, not oracle); LEDGER 0. EVENTS 3 marked: the TEARING
    (44:13 — the garment-code turns: the coat-strippers tear their
    own), the FALLING (44:14 — the dream-ledger's steepest bow),
    the DRAWING-NEAR (44:18 — at the closed portion-seam).

    CARE-POINTS: the RETELLING OF RETELLINGS (44:19-32) — the
    corpus's deepest quotation nest (Judah quotes 43:7 quoting
    42:13), with the variance-file's crown: ve-asima eni alav
    (44:21, 'that I may set my eye on him') — words no narrator
    recorded from Joseph; the added death-clause (44:22); the
    four-wives-to-one arithmetic (44:27); TAROF TORAF (44:28) —
    Jacob's coat-verdict quoted to the torn one's face; the rash
    sentence (44:9) replaying Jacob's oath over Rachel (31:32);
    the steward sentencing BELOW the offer (44:10). Judah CITING
    his own surety (44:32 cashing 43:9) — the second witness to
    quote his own record (after Reuben, 42:22). The gray-hair file
    CLOSES complete (G65-08: 42:38 + 44:29 + 44:31, all Jacob's,
    all Sheol-bound). WATCHLIST ARMS: 45:1 (the substitution's
    answer — the unmasking), 45:5 (ve-al yichar's second token,
    G67-04), 45:13 (ve-horadtem's joy-token, G67-06), 50:18
    (hinenu's third station, G67-02), Exod 9:14 + Deut 18:15 (the
    like-me class, G67-03), Deut 1:25 (the lowered fruit, G67-07).
  oral_audit_note_en: >
    ORAL AUDIT 2026-08-09 (IN-PIPELINE, forward era; manifest
    logic/oral_audit/manifests/gen_67_cup_and_surety_claims.json
    13/13 VERIFIED, zero FAILED; record
    logic/oral_audit/AUDIT_gen_67_2026-08-09.md). CROWNS
    (chain-attested + DB-verified). BROUGHT DOWN [G67-01, MS on
    44:21; the Ramah] — THE UNIT'S MARQUEE: הורדהו ("bring him
    down") stands exactly TWICE in the Torah, and its partner is
    the wound itself: "the Ishmaelites BROUGHT HIM DOWN there"
    (39:1) — the brother sold down and the brother demanded down
    in one skeleton, the Ramah ruling both letter-identical (full
    vav before the resh, lean before the dalet). THE THREE
    HERE-WE-ARES [G67-02, MS on 44:16; the Masorah]: הננו ("here
    we are") with both nuns dageshed — exactly THREE in the Torah:
    the surrender at the cup (44:16), the brothers' final "here we
    are, your slaves" (50:18), and the doomed climbers of Kadesh
    (Num 14:40): three offered selves, each refused. LIKE ME
    [G67-03, MS on 44:15; the Ramah]: כמני ("like me") LEAN,
    exactly THREE in the Torah: the masked governor (44:15), the
    Holy One in the plagues ("none like Me", Exod 9:14), and the
    prophet like Moses (Deut 18:15) — a mask, the Name, and the
    prophet in one lean skeleton. LET IT NOT BURN [G67-04, Kitzur
    on 44:18; the Masorah]: ואל יחר ("let not [your anger] burn")
    — the phrase exactly TWICE in the Torah, BOTH in this cycle:
    Judah's plea (44:18) and Joseph's own pardon-sentence "let it
    not burn in your eyes that you sold me" (45:5): the plea
    against anger and the absolution of it, adjacency-checked.
    THE CHILD AND THE LEFT-ALONE [G67-05, Kitzur on 44:20]: one
    verse carries two pair-words — וילד ("and a child"): twice in
    the Torah, the old-age child (44:20) and Lemech's "a child
    for my wound" (4:23); ויותר ("and he was left"): twice — Jacob
    LEFT alone at the wrestling (32:25) and Benjamin LEFT alone
    of his mother (44:20): the wounded child and the father's own
    alone, in the son's plea. THE THREE BRING-DOWNS [G67-06, MS +
    Kitzur on 44:29]: והורדתם ("you will bring down") — THREE in
    the Torah: the father's dread twice (42:38 in sorrow, 44:29
    in evil) and the sons' JOY-command "bring my father down
    here" (45:13): the verb that buries is the verb that
    reunites. THE TWO LOWERINGS [G67-07, MS on 44:11; the Ramah]:
    ויורדו ("and they lowered") — TWICE: the bags of the search
    (44:11) and the spies' fruit brought down to the camp (Deut
    1:25); an old scroll-correction's variant locked out by the
    Masorah. THE CLIPPED OVERTAKING [G67-08, MS on 44:6]: וישגם
    ("and he overtook them") — LEAN, its one such token, against
    the full-yod rule of every other hiriq-pointed form of the
    word. THE ONE-YOD CLEAN [G67-09, MS on 44:10; the Hilleli and
    Yerushalmi]: נקים ("clean") with ONE yod — the Hilleli one,
    the Yerushalmi two, all our books one; MS untangles the Great
    Masorah's own confused note. THE CORRECTED SEEING [G67-10, MS
    on 44:31]: כראותו ("when he sees") FULL with the Hilleli and
    every book — MS corrects the Great Masorah's SWAPPED lean/full
    note (the Kings partner, 2 Kgs 23:29, is the lean one); תספון
    ("you shall not again", 44:23) lean-vav-lean-yod with all
    books (Deuteronomy partner named, asserted). THE PAZER AND THE
    YETIV [G67-11, MS on 44:17]: האיש ("the man") under the PAZER
    stroke (MS rules the great pazer; SNAPSHOT writes the pazer
    in-stream — the span's rarest accent, checked) and הוא ("he")
    under the YETIV stroke (asserted): the dismissal-verse wears
    two rare marks. THE BOUND SOUL [G67-12, Kitzur on 44:30]:
    קשורה ("bound") — ONCE in the Torah; Scripture's pair "folly
    bound in the heart of a lad" (Prov 22:15) named. THE POINTING
    FILE [G67-13, MS ×7]: הקטן ('the youngest', 44:23) qof DAGESHED (checked);
    gevii (44:2) no restraining-stroke on the vav, ve-gam (44:9)
    with its vav against erring readers and copies, כדבריכם ('according to your words',
    44:10) kaf soft (Mikhlol), halo yedatem (44:15) full per the
    Shelach list, dvar (44:18) dalet soft — asserted; named: the
    closed break (setuma) at ויגש ('and he drew near', 44:18). READINGS
