    MACHINE PROFILE. FOUR DECLAREs, TWO RESULTs. The trial's orders
    pop instantly: the plant-order (44:1) by the ka-devar-yosef
    receipt (44:2), the pursuit (44:4) by the overtaking (44:6) —
