boot_steps:
  - id: STEP_Gn_1_24
    order: 1
    ref: "Gen.1.24"
    op: DECLARE_SPEC_LAND_CLASSES_RECEIPT
    he: וַיֹּאמֶר אֱלֹהִים תּוֹצֵא הָאָרֶץ נֶפֶשׁ חַיָּה לְמִינָהּ בְּהֵמָה וָרֶמֶשׂ וְחַיְתוֹ־אֶרֶץ לְמִינָהּ וַיְהִי־כֵן
    he_translit: "va-yomer Elohim totze ha-aretz nefesh chaya le-minah behemah va-remes ve-chayto-eretz le-minah va-yehi khen"
    en: "[EN-AID/JPS] And God said: 'Let the earth bring forth the living creature after its kind, cattle, and creeping thing, and beast of the earth after its kind.' And it was so."
    tree_left:
      he: ויאמר אלהים תוצא הארץ נפש חיה למינה בהמה ורמש וחיתו ארץ למינה
      he_translit: "va-yomer Elohim totze ha-aretz nefesh chaya le-minah behemah va-remes ve-chayto-eretz le-minah"
      en: "the whole fiat: klal (general class) + prat (three-item breakdown), kind-keyed (etnachta arm)"
    tree_right:
      he: ויהי כן
      he_translit: "va-yehi khen"
      en: "the receipt, isolated as the root's own right arm — the token RETURNS"
    operators:
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET(totze(aretz), product=nefesh_chaya_le_minah))"
        he: תּוֹצֵא הָאָרֶץ נֶפֶשׁ חַיָּה לְמִינָהּ
        he_translit: "totze ha-aretz nefesh chaya le-minah"
        en: >
          HIPHIL JUSSIVE 3FS (Vhj3fs) — a clean LET (TIR-026): the earth
          delegated to bring forth living creature by kind. The demand verb
          is DAY 3'S DELIVERY VERB: va-totze ha-aretz (1:12, the earth
          bringing forth vegetation) re-used as a spec verb — the corpus
          orders with the vocabulary of a prior delivery. Product structure,
          chain-labeled (Lekach Tov 1:23:1, cached): nefesh chaya = KLAL
          ('general'); behemah va-remes ve-chayto-eretz = PRAT
          ('particular' — cattle, creeper, wild beast). The third prat item
          is written in the ARCHAIC CONSTRUCT chayto-eretz ('wild-beast-of
          earth', paragogic vav, bare 'earth' without article) — an
          orthography flag of the me'orot class, recorded [OPEN].
        cites: ["TIR-026"]
        confidence: tested
      - op: TRIPLE
        expr_en: "{ P: aretz read (presupposed, standalone) } delegate-build { Q: totze(aretz), product=nefesh_chaya_le_minah }"
        he: תּוֹצֵא הָאָרֶץ
        he_translit: "totze ha-aretz"
        en: >
          The delegation contract: the earth, read presupposed, is to
          produce the land classes. Unlike day 5's contract (receipt
          relocated into the delivery), this one discharges IN ITS OWN
          VERSE — the next operator.
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(totze(aretz), product=nefesh_chaya_le_minah, t1) — va-yehi khen: the receipt token RETURNS, same verse as the fiat (days 1-4 convention restored; prediction #1 of the learning pass confirmed)"
        he: וַיְהִי־כֵן
        he_translit: "va-yehi khen"
        en: >
          'And it was so' — the ceremonial receipt is BACK after day 5
          dropped it, and back in the days-1-4 position: same verse as the
          fiat, BEFORE the delivery narrative. The accent tree isolates it
          as the root's own right arm ([whole fiat | receipt]) — the
          identical bracket 1:30 will give the week's last receipt. Mood
          stays LET on the log (clean jussive; no ? to carry).
        cites: []
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "aretz are READ without prior install (standalone machine; installed in gen_01/gen_03 — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
    comment: >
      The etnachta splits [whole fiat | receipt]: the day-3 shape (spec +
      same-verse receipt, delivery to follow) restored on the same
      delegate, the earth. Day 5's missing-receipt deviation lasted
      exactly one day.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_25
    order: 2
    ref: "Gen.1.25"
    op: BUILD_DELTA_TEST
