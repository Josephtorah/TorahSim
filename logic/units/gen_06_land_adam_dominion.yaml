    / 0 FAILED / 1 UNCHECKABLE). CROWNS (chain-attested +
    DB-verified). MAN IS EARTH'S LETTERS [G06-01, Kitzur Baal
    HaTurim]: האדם ("the man," 1:27) carries exactly the letters of
    אדמה ("earth") — created from it — and the word אדם abbreviates
    ash, blood, bile: the body's stuff; the letter identity verified.
    THE LEAN SUBDUE-WORD [G06-03, Yevamot 65b + Tanchuma + Bereshit
