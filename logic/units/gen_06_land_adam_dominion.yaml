    pairs it with "go down to Gat of the Philistines" (Amos 6:2,
    outside the Torah instrument): merit rules even the fish, sin
    goes down to Gat. In the Torah the imperative stands ONCE — and
    the same skeleton returns re-pointed in the curses ("your foes
    shall RULE over you," Lev 26:17): the Torah's own inner echo.
    THE ETROG PAIR, EXACT [G06-05/06, Kitzur; the Masorah]: פרי עץ
    ("fruit of a tree") twice — "that has within it the fruit of a
    tree" (1:29, the pe soft) and "fruit of a beautiful tree" (Lev
    23:40): the hint that the tree Adam ate from was the ETROG; both
    stations Torah-side, no third adjacency in the stream — the
    mirror of this day-three corpus's own commanded עץ פרי
    ("fruit-tree"), itself unique at 1:11. THE KOL-RULE IN ONE VERSE
    [G06-07/08, MS]: "every כל ('all') bound to the next word takes
    qamatz (the long a); every כל carrying its own accent takes
    holam (the o-dot)" — and verse 1:30 demonstrates BOTH halves:
    its first two bound forms with qamatz, its third — accented with
    the upright conjunctive stroke — with holam. THE SIX-DOTTED
    GREEN [G06-09, MS]: ירק ("green herb," 1:30) "with six dots" —
    two segols (the three-dot e), counted in-stream. THE NAME SEALS
    CREATION [G06-10/11, Kitzur]: יום הששי ("the sixth day") + ויכלו
    השמים ("and the heavens were finished") — four initials spelling
    the four-letter Name across the day-six/day-seven seam, the seal
    on the work of creation (partner acrostic in "let the heavens be
    glad," Psalms 96:11, named). GAPS: בצלם אלהים ("in the image of
    God") ruled HOLY by MS — Name-classification layer
    uninstrumented (station 13); the Kitzur's gematria pair (זכר
    "male" = ברכה "blessing"; נקבה "female" = בקללה "in a curse") —
    no gematria check type yet, filed named. READINGS (named-only):
    R. Meir's Torah read טוב מות ("good is DEATH") at "very good"
    (BR 9 via MS), with the garments of LIGHT parallel (BR 20).
derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      Day-6 unit (1:24-31): the week's LONGEST day (8 verses, 149 words),
      three census utterances (1:24, 1:26, 1:29 — no other day holds more
      than two), and the week's densest cluster of firsts: the first
      first-person-PLURAL form of any kind in the corpus (na'aseh, 'let us
      make' — and the 'our' suffixes of tzelem/demut in the same verse),
      the first first-person PERFECT (natati, 'I have given' — the corpus's
      first completed 'I did'), the first definite article on a day label
      (HA-shishi, 'THE sixth'), the first adamah ('ground', at 1:25 — one
      verse before adam is proposed), and the RETURN of the receipt token
      va-yehi khen ('and it was so', 1:24 and 1:30) after day 5 dropped it
      — the learning-pass prediction #1, confirmed. One day, one commit,
      one unit: the span's three utterance blocks (land classes; the adam
      council + delivery + blessing; the food grants) are steps, not units.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 8 verses via taamim_tree_parse.py rule set v3: status unique,
      pure_binary true. tree_ascii regenerated 2026-07-31 from DB tree_json.
      Tree facts used: 1:24 and 1:30 both isolate va-yehi khen as the
      ROOT'S OWN RIGHT ARM ([whole fiat | receipt] — identical bracket for
      both receipts); 1:26 splits [make-proposal | rule-design] at the
      etnachta; 1:27 splits [singular creation | male-and-female plural];
      1:28 splits the mandate at the fill/rule boundary and carries a rare
      prose accent pair on the blessing frame (zinor + segol) where day 5's
      frame used plain accents; 1:29 isolates the standing-state demand
      (lakhem yihyeh le-okhlah) as the right arm.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-07-31): totze
      Vhj3fs — HIPHIL JUSSIVE — a clean LET (TIR-026), the earth delegated
      (and the demand verb is day 3's DELIVERY verb va-totze, re-used as
      spec). na'aseh Vqi1cp — QAL IMPERFECT 1CP: the volitive 'let us
      make' (TIR-033 CMD-US) CODED IMPERFECT (final-heh verbs show no
      distinct cohortative form) — TIR-028's mandatory ? applies: CMD-US?.
      FIRST 1cp verb of the corpus (verified: no earlier %1cp% morph
      exists), with the corpus's first 'our' suffixes in the same verse
      (be-tzalmeNU, ki-dmuteNU). ve-yirdu Vqj3mp — QAL JUSSIVE — clean LET
      (TIR-026), the dominion design. bara x3 at 1:27: Vqw3ms wayyiqtol
      ('and-then-he-did' narrative form) + Vqp3ms perfect x2. Five
      imperatives at 1:28: peru/u-revu/u-milu/ve-khivshuha/u-redu, all
      Vqv2mp (TIR-027) — ve-khivshuha with an OBJECT SUFFIX on the
      imperative (Sp3fs, 'subdue IT' = the earth). natati Vqp1cs — the
      corpus's FIRST first-person perfect (verified: next are 3:10, 4:1) —
      a performative give. yihyeh Vqi3ms — imperfect standing-state demand
      inside the grant (TIR-028: LET?). zorea Vqrmsa x2 — QAL participle
      where day 3's spec used HIPHIL mazria ('seed-causing') — stem shift
      at re-reference. ha-romes/ha-romeset/romes — participles (TIR-031).
      chayto (1:24) — ARCHAIC CONSTRUCT with paragogic vav (chayto-eretz,
      'wild-beast-of earth'), normalized at delivery (1:25 chayat
      ha-aretz) — the me'orot-class orthography flag family. ha-shishi
      Td/Aomsa — the ONLY day label carrying the definite article
      (verified against 1:5 echad Acmsa cardinal; 1:8/13/19/23 bare
      ordinals Aomsa).
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      BLOCK 1 (1:24-25): spec delegates to the earth (klal 'nefesh chaya'
      + prat 'behemah/remes/chayto-eretz' — the chain's own labels, cached);
      va-yehi khen SAME VERSE — the receipt-before-delivery convention of
      days 1-4 RESTORED after day 5 dropped it; delivery by God (asah)
      with NO credit clause for the delegate (day 3: delegate performed;
      day 5: delegate credited; day 6: delegate silent — the delegation
      pattern's third variant), order permuted (wild-beast last->first),
      archaic form normalized, substrate shifted to ha-ADAMAH; TEST rides
      the delivery verse. BLOCK 2 (1:26-28): the council proposal CMD-US?
      (make adam, spec image+likeness) with the dominion DESIGN as jussive
      purpose-clause (no receipt for dominion exists in the span — it is
      re-issued at 1:28 as mandate: design handed to its bearers, mood
      escalated LET->CMD!); delivery at 1:27 with bara TRIPLED and NO
      va-yehi khen — closing the chain's own triad (heavens/taninim/adam
      lack the token 'because beriah is said of them', Lekach Tov 1:21:4,
      verified at day 5 — the machine's day-5 finding PREDICTED this
      shape); the delivery resolves the plural spec to a singular agent
      (be-tzalmO, be-tzelem ELOHIM; Onkelos: be-tzalma d-Adonai) and adds
      the unannounced male-and-female with an oto->otam number shift;
      BLESS at 1:28 with FIVE 2mp imperatives, no mood split (contrast
      day 5's rationed fowl), direct address (va-yomer LAHEM vs day 5's
      le-mor), the earth moved from dominion-domain to fill-and-subdue
      OBJECT, and the un-specced verb kavash added. BLOCK 3 (1:29-30):
      the performative grant (natati) binds the seed-bearing inventory to
      the food office for the adam and the green herb to every
      nefesh-chaya bearer — plants only, no flesh (the Gen 9:3 amendment
      precedent); the grant's standing-state demand (yihyeh) is popped by
      the week's LAST va-yehi khen with the same verb root (yihyeh ->
      va-yehi), letter-visible. CLOSE (1:31): the global test — et-KOL
      asher asah, the week's only explicit-object inspection, hineh
      deictic, me'od intensifier (Onkelos: takin lachada, 'exceedingly
      WELL-ORDERED', vs plain tav for every local test — the translation
      reads it as an arrangement check); COMMIT on the definite ordinal.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines + WORLD writes + day-ledger row. TWO Hoare triples:
      the land delegation contract (discharged same verse) and the
      dominion DESIGN contract (deliberately left UNDISCHARGED — the text
      gives dominion no receipt; the contract standing open at commit is
      the machine's record of a design whose horizon exceeds the week).
      The 1:28 mandate = standing WORLD facts, never SPECS (day-5 BLESS
      rule: the day commits clean). The food grants = ASSIGN (day-4
      precedent: dative role binding — here the plants are bound to food
      offices; first REGISTRY writes since day 4). NEW MOOD FAMILY CMD-US
      (TIR-033) on the DECLARE operator — interpreter vocabulary extended
      at verification (ASSIGN/BLESS precedent), with the auto-upgrade
      refusal contract extended to the new mood (S9_negative).
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en; register values
      keep Hebrew where the text supplies them (behemah, ha-shishi).
      Machine tokens are apostrophe-free (na'aseh -> demand token
      make(adam); tov me'od -> oracle token tov_meod) so checker regexes
      hold; display fields keep the apostrophes.
    confidence: established
  - step: G
    name_en: "Oral (named only) + Tier-A translation check"
    comment: >
      Verified from local Data at derive time: Lekach Tov 1:23:1-5 (the
      klal-u-frat labels on 1:24 — read at the day-5 triage as rows 37-41,
      verdict 'next-day content', now landed); Tanchuma Bereshit 1:8 +
      Ein Yaakov Shabbat 9:9 (Resh Lakish's heh-yeterah tenai on
      HA-shishi — day-1 triage rows 380, 154); Bereshit Rabbah 8:1 and
      8:12 (androginos/dyu-partzufim on the number shift; the redu/yerdu
      dominion wordplay — day-1 triage rows 30-31, filed then as 'day-6
