      (the na'aseh consultation dossier — named by TIR-033's own rulebook
      note); Bavli Shabbat 88a direct. Tier-A Onkelos read at derive time
      (FETCHLOG 2026-07-31), 8 findings: the 1cp plural RETAINED (na'avid
      — the anti-anthropomorphic translator does not normalize it;
