state_machine:
  comment_en: "Day-5 work order (standalone; registers: TIME/WORLD/REGISTRY/SPECS/TESTS/LEDGER)."
  states:
    - id: S_boot
      en: "Before 1:20 — all registers empty (standalone unit)"
    - id: S_spec_open_two
      en: "After 1:20 — TWO LET? demands pushed and OPEN (swarm delegation; flight); NO receipt token anywhere ahead; mayim/aretz/raqia/shamayim flagged"
    - id: S_built_credited_tested
      en: "After 1:21 — bara delivery: WORLD += {taninim, nefesh_chaya_romeset, of_kanaf}; both demands popped (receipt via relative clause / via delivery); moods remain LET?; spec_delta x3; TESTS: PASS(tov, nefesh_chaya) — before the blessing"
    - id: S_blessed_mandated
      en: "After 1:22 — first BLESS: mandate standing as WORLD facts (3 CMD! + 1 LET), SPECS untouched; yamim flagged"
    - id: S_day5_committed_clean
      en: "After 1:23 — LEDGER[5] closed ordinal chamishi; clean; zero REGISTRY writes; three deltas ride"
  transitions:
    - {from: S_boot, to: S_spec_open_two, via: STEP_Gn_1_20}
    - {from: S_spec_open_two, to: S_built_credited_tested, via: STEP_Gn_1_21}
    - {from: S_built_credited_tested, to: S_blessed_mandated, via: STEP_Gn_1_22}
    - {from: S_blessed_mandated, to: S_day5_committed_clean, via: STEP_Gn_1_23}

state_after:
  - id: AFTER_S_day5_committed_clean
    en: >
      WORLD: taninim, nefesh_chaya_romeset, of_kanaf (the delivered,
      credited, kind-keyed inventory — the corpus's first LIVING entities)
      + mayim, aretz, raqia, shamayim, yamim (presupposed, flagged) +
      standing mandate facts {CMD!(peru), CMD!(revu), CMD!(milu),
      LET(yirev)} — the first WORLD entries that are directives held BY
      creatures rather than states of them. REGISTRY: untouched — 0 naming
      writes, 0 role writes (day 4 ended naming; day 5 uses neither
      device). SPECS: log holds two satisfied demands, both moods still
      LET? (TIR-028). TESTS: PASS(tov, nefesh_chaya). LEDGER: day 5
      committed, ordinal chamishi, clean. FLAGS: read_before_install x5
      (mayim, aretz, raqia, shamayim, yamim), spec_delta x3 (agent shift;
      taninim over-delivered; totality/kind-keys/kanaf enrichment) — none
      blocking.

