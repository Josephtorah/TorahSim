  - id: STEP_Gn_1_22
    order: 3
    ref: "Gen.1.22"
    op: BLESS_MANDATE
    he: וַיְבָרֶךְ אֹתָם אֱלֹהִים לֵאמֹר פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הַמַּיִם בַּיַּמִּים וְהָעוֹף יִרֶב בָּאָרֶץ
    he_translit: "va-yevarekh otam Elohim le-mor peru u-revu u-milu et-ha-mayim ba-yamim ve-ha-of yirev ba-aretz"
    en: "[EN-AID/JPS] And God blessed them, saying: 'Be fruitful, and multiply, and fill the waters in the seas, and let fowl multiply in the earth.'"
    tree_left:
      he: ויברך אתם אלהים לאמר
      he_translit: "va-yevarekh otam Elohim le-mor"
      en: "the blessing event + the quote opener (etnachta arm)"
    tree_right:
      he: פרו ורבו ומלאו את המים בימים והעוף ירב בארץ
      he_translit: "peru u-revu u-milu et-ha-mayim ba-yamim ve-ha-of yirev ba-aretz"
      en: "the quoted mandate: three imperatives + the fowl's jussive"
    operators:
      - op: BLESS
        expr_en: "BLESS(Elohim, otam) MANDATE {CMD!(peru), CMD!(revu), CMD!(milu(et_ha_mayim_ba_yamim)), LET(yirev(ha_of_ba_aretz))}"
        he: וַיְבָרֶךְ אֹתָם אֱלֹהִים לֵאמֹר פְּרוּ וּרְבוּ וּמִלְאוּ
        he_translit: "va-yevarekh otam Elohim le-mor peru u-revu u-milu"
        en: >
          The corpus's FIRST BLESSING: va-yevarekh (PIEL wayyiqtol — a new
          verb stem) + otam (the et-marker with pronominal suffix, the 1:21
          inventory as recipients) + le-mor opening QUOTED DIRECT SPEECH.
          Inside the quote: peru u-revu u-milu — Vqv2mp x3, the corpus's
          first true IMPERATIVES (TIR-027: CMD!): the creatures are the
          first entities the corpus ADDRESSES — second-person speech to
          made things, inside a blessing (the rulebook's own note on the
          1:28 parallel: the operator records mood, not tone, and the
          co-occurrence is itself a finding). Then the mood SPLITS: the
          fowl's clause is 3MS JUSSIVE (yirev, Vqj3ms, apocopated —
          TIR-026: LET) — third person inside the same mandate, and the
          fowl receives only ONE of the three verbs (r-b-h, the middle
          one): no peru, no milu — 1/3 of the mandate, letter-visible
          (Onkelos mirrors: pushu/u-sgu/u-mlu 2mp, then yisgei 3ms — the
          s-g-y repetition exposing the ration). Role flip, letter-visible:
          et-ha-mayim — the 1:20 DELEGATE is now the OBJECT to be filled
          (subject at 1:20-21, patient at 1:22), recorded [OPEN]. The
          mandate is a STANDING DIRECTIVE recorded as WORLD facts, NOT
          pushed to SPECS: no receipt for it exists in the text, its
          horizon exceeds the week (1:28 humans; 9:1 Noah), and the day
          still commits clean — a SPECS push would falsify that. NEW OP:
          interpreter vocabulary extended at verification (day-4 ASSIGN
          precedent).
        cites: ["TIR-027", "TIR-026", "TIR-014"]
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "yamim are READ without prior install (standalone machine; NAMED in gen_03's va-yiqra — cross-unit chaining is Stage E)"
        en: "flag, not fix — the mandate's fill-target container is day 3's named entity"
        cites: []
        confidence: tested
    comment: >
      The day's novelty verse: after building and testing, the corpus
      acquires a speech act that neither demands (DECLARE) nor labels
      (NAME) nor appoints (ASSIGN) — it EMPOWERS its recipients toward
      their own increase, in the second person. First addressees, first
      imperatives, first standing mandate.
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_23
    order: 4
    ref: "Gen.1.23"
    op: COMMIT_DAY
