derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      Day-5 unit (1:20-23): four firsts in four verses — the corpus's first
      LIFE (nefesh chaya), its first BLESSING (va-yevarekh), its first true
      IMPERATIVES (peru u-revu u-milu, Vqv2mp — the creatures are the first
      entities the corpus addresses in the second person), and the first
      return of bara since 1:1. Structurally it is the deviation unit: the
      only work-day fiat with NO receipt token (va-yehi khen absent from
      the whole span, MT — Onkelos adds none either), both demands in the
      corpus's LET? mood (imperfect forms, TIR-028), and the delivery
      executed by God under a spec that delegated to the waters.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 4 verses via taamim_tree_parse.py rule set v3: status unique,
      pure_binary true. tree_ascii regenerated 2026-07-30 from DB tree_json.
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-07-30): yishretzu
      Vqi3mp — QAL IMPERFECT, not jussive-coded — over subject ha-mayim:
      the LET? mood is mandatory (TIR-028); ye'ofef Voi3ms — POLEL
      IMPERFECT — second LET?. shartzu Vqp3cp — the same root sh-r-tz
      returning as PERFECT inside 1:21's relative clause (imperfect demand
      -> perfect receipt, letter-visible). ha-romeset Vqrfsa — participle,
      standing behavior (TIR-031). va-yevarekh Vpw3ms — PIEL wayyiqtol,
      new verb stem for the corpus. peru/u-revu/u-milu Vqv2mp x3 — the
      corpus's first true imperatives (TIR-027); yirev Vqj3ms — JUSSIVE,
      apocopated — a third-person mood inside the same quoted mandate.
      THREE et-markers at 1:21 (To x3) + otam (To+Sp3mp) at 1:22.
      ha-taninim coded PLURAL (Ncmpa) but written DEFECTIVE — the plural
      suffix missing its yod (התנינם, single yod; verified from own letter
      data 2026-07-30) — the me'orot-class orthography flag. chamishi
      Aomsa — the day label morphology-tagged ORDINAL.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      SPEC (1:20): two LET? demands in one utterance — the waters delegated
      to swarm swarming-life (cognate accusative: yishretzu...sheretz), and
      fliers to fly across the face of the raqia (second cognate pair:
      of...ye'ofef). NO receipt token follows — the first fiat in the week
      whose verse (and span) has no va-yehi khen. BUILD (1:21): bara — God
      himself delivers; the great taninim lead the inventory unordered;
      the relative clause asher shartzu ha-mayim (PERFECT) credits the
      delegate after the fact — the receipt rides the delivery. Kind-keys
      (le-minehem/le-minehu) and the kanaf differentiator are added at
      delivery. TEST passes at 1:21, BEFORE the blessing. BLESS (1:22):
      the mandate quoted via le-mor — three 2mp imperatives for the water
      creatures, one 3ms jussive for the fowl (which receives only the
      middle verb, r-b-h); the erstwhile delegate mayim becomes the OBJECT
      to be filled (et-ha-mayim). COMMIT ordinal, clean.
    confidence: tested
  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines + WORLD writes + day-ledger row; ONE Hoare TRIPLE
      carries the delegation contract of the primary demand; BLESS
      introduced for the benediction speech act — the mandate is recorded
      as STANDING WORLD FACTS, deliberately NOT pushed to SPECS: its
      fulfillment horizon exceeds the unit (and the week — pru u-rvu
      recurs at 1:28 and 9:1), and the text itself closes the day clean
      with no receipt for it; a SPECS push would falsify the text's own
      clean commit. Interpreter vocabulary to be extended at verification
      (day-4 ASSIGN precedent).
    confidence: established
  - step: F
    name_en: "Bilingual logic objects"
    comment: >
      Every operator line carries he + he_translit + en; register values
      keep Hebrew where the text supplies them (sheretz, chamishi).
      Compound machine identifiers use underscores for clause-checkability.
    confidence: established
  - step: G
    name_en: "Oral (named only) + Tier-A translation check"
    comment: >
      Verified from local Data: Avot DeRabbi Natan B 36:2 (R. Yirmiyah's
      ten-utterances census variant COUNTS this unit's va-yivra
      et-ha-taninim among the ten — read at the day-1 triage, gen_01
      ledger row 93; quote re-verified local 2026-07-30). Named but not
      yet read (observation tier, day-5 Tier-A queue): Bava Batra 74b and
      BR 7:4 on the defective taninim ktiv (the tradition Rashi on 1:21
      transmits — Leviathan and its mate). Tier-A Onkelos read at derive
      time (FETCHLOG 2026-07-30), five findings: yirchashun — the
      delegation and its imperfect mood RETAINED (contrast day 4, where
      Onkelos normalized yehi's number); NO receipt token added — the
      missing va-yehi khen stood in the received text; archishu — the
      waters' swarming rendered in the APHEL (causative) stem, "which the
      waters BROUGHT FORTH": the translation's resolution of the dual
      agency; ofa de-farach — kanaf re-verbalized, giving the flier demand
      the same relative-clause receipt shape the Hebrew gives only the
      swarm demand; the imperatives pushu/u-sgu/u-mlu retained 2mp with
      the fowl's 3ms yisgei — both grammar quirks preserved, and the
      s-g-y root repetition exposes the fowl's one-verb-of-three mandate.
    confidence: tested
    tags: ["[ORAL]","[TIER-A]"]
  - step: H
    name_en: "Scenarios"
    comment: >
      S1-S4 register deltas per step: the two LET? demands with moods
      intact after 1:20, the triple discharge and three-entity WORLD write
      and spec-delta flags and early TEST at 1:21, the standing mandate
      facts at 1:22, the clean ORDINAL commit at 1:23. S5_negative
      re-asserts the LET? contract on the very form this unit carries live
      (the interpreter's S7 self-test has rehearsed LET?(swarm(mayim))
      since gen_02 — day 5 is where the rehearsal becomes the text).
      S6_negative re-asserts flag-never-block.
    confidence: tested
  - step: I
    name_en: "English leakage review"
    comment: >
      Operators derive from morph codes (Vqi/Voi imperfects -> LET?;
      Vqv2mp imperatives -> CMD!; Vqj3ms jussive -> LET; Vpw piel
      wayyiqtol; Vqp perfect; Vqrfsa participle; Aomsa ordinal), particles
      (et x3 inventory, le- kind-keys, al-pnei vs bi- mount contrast) —
      not from English glosses. The deltas are letter-visible
      word-sequence comparisons (taninim absent from spec; sh-r-tz
      imperfect -> perfect with agent shift; kind-keys and kanaf added).
      The defective-plural flag rests on our own letter data (התנינם,
      single yod) against the OSHB plural coding (Ncmpa).
    confidence: established
  - step: J
    name_en: "Freeze"
    comment: >
      status: frozen 2026-07-30 on owner approval ("freeze"). BLESS
      handler added to the interpreter at verification (ASSIGN precedent);
      all five logic-derived units verified green. Changes require a new
      derive pass, not silent edits.
      Oral audit 2026-08-08 folded same day (run 8 block 3): 6 VERIFIED /
      0 FAILED / 1 UNCHECKABLE — see meta oral_audit_note_en; machine
      layer untouched.
    confidence: established

boot_steps:
  - id: STEP_Gn_1_20
    order: 1
    ref: "Gen.1.20"
    op: DECLARE_SPEC_SWARM_FLIGHT
    he: וַיֹּאמֶר אֱלֹהִים יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ נֶפֶשׁ חַיָּה וְעוֹף יְעוֹפֵף עַל־הָאָרֶץ עַל־פְּנֵי רְקִיעַ הַשָּׁמָיִם
    he_translit: "va-yomer Elohim yishretzu ha-mayim sheretz nefesh chaya ve-of ye'ofef al-ha-aretz al-pnei reqia ha-shamayim"
    en: "[EN-AID/JPS] And God said: 'Let the waters swarm with swarms of living creatures, and let fowl fly above the earth in the open firmament of heaven.'"
    tree_left:
      he: ויאמר אלהים ישרצו המים שרץ נפש חיה
      he_translit: "va-yomer Elohim yishretzu ha-mayim sheretz nefesh chaya"
      en: "speech act + the swarm delegation with its cognate product (etnachta arm)"
    tree_right:
      he: ועוף יעופף על הארץ על פני רקיע השמים
      he_translit: "ve-of ye'ofef al-ha-aretz al-pnei reqia ha-shamayim"
      en: "the flight demand: over the earth, across the FACE of the firmament"
    operators:
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET?(swarm(mayim), product=sheretz_nefesh_chaya))"
        he: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ נֶפֶשׁ חַיָּה
        he_translit: "yishretzu ha-mayim sheretz nefesh chaya"
        en: >
          QAL IMPERFECT 3MP (Vqi3mp) — NOT jussive-coded: the ? is mandatory
          (TIR-028) and stays on the log forever (contrast day 3's yiqqavu,
          coded niphal JUSSIVE, a clean LET). A delegation with a named
          delegate: the WATERS are the subject of the swarming — the day-3
          pattern (tadshe ha-aretz) on the water registry. The product is a
          COGNATE ACCUSATIVE: yishretzu...sheretz — the verb's own root
          (sh-r-tz) as its object, letter-visible; and the product class is
          NEFESH CHAYA — the corpus's first living entities (day 3's plants
          never receive the term). Onkelos (Tier-A 2026-07-30) retains both
          the delegation and the imperfect (yirchashun mayya) — no
          normalization this time.
        cites: ["TIR-028"]
        confidence: "tested as flag; resolution per-unit only"
      - op: DECLARE
        expr_en: "DECLARE(Elohim, LET?(fly(of), loc=pnei_raqia_ha_shamayim))"
        he: וְעוֹף יְעוֹפֵף עַל־הָאָרֶץ עַל־פְּנֵי רְקִיעַ הַשָּׁמָיִם
        he_translit: "ve-of ye'ofef al-ha-aretz al-pnei reqia ha-shamayim"
        en: >
          POLEL IMPERFECT 3MS (Voi3ms) — second mandatory LET?. Second
          cognate pair in the same verse: of...ye'ofef ('let the flier
          fly'). Location note, letter-visible against day 4: the
          luminaries were mounted BI-rkia ('IN the firmament', 1:17); the
          fliers fly AL-PNEI reqia ('across the FACE of the firmament') —
          two prepositions, two relations to the same day-2 entity: the
          birds are not fixtures.
        cites: ["TIR-028"]
        confidence: "tested as flag; resolution per-unit only"
      - op: TRIPLE
        expr_en: "{ P: mayim read (presupposed, standalone) } delegate-build { Q: swarm(mayim), product=sheretz_nefesh_chaya }"
        he: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
        he_translit: "yishretzu ha-mayim sheretz"
        en: >
          The delegation contract on the primary demand: the waters, read
          presupposed, are to produce swarming life. Unlike day 4's triple
          (job-list criteria, receipt by va-yehi khen at 1:15), this
          contract has NO receipt token waiting — its discharge arrives
          inside the delivery verse itself (1:21's relative clause).
        cites: []
        confidence: tested
      - op: NOTE_PRESUPPOSED
        expr_en: "mayim, aretz, raqia, shamayim are READ without prior install (standalone machine; installed in gen_01/gen_02 — cross-unit chaining is Stage E)"
        en: "flag, not fix"
        cites: []
        confidence: tested
    comment: >
      The etnachta splits [delegation + cognate product | flight demand]:
      one utterance, two demands, two registries (waters below, the
      raqia's face above). The FIRST fiat in the week with no va-yehi khen
      in its verse — and none ever comes: the receipt convention of days
      1-4 is silently dropped (MT; Onkelos adds none), recorded [OPEN].
    confidence: tested
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_1_21
    order: 2
    ref: "Gen.1.21"
    op: BUILD_CREATE_CREDIT_DELTA_TEST
    he: וַיִּבְרָא אֱלֹהִים אֶת־הַתַּנִּינִם הַגְּדֹלִים וְאֵת כָּל־נֶפֶשׁ הַחַיָּה הָרֹמֶשֶׂת אֲשֶׁר שָׁרְצוּ הַמַּיִם לְמִינֵהֶם וְאֵת כָּל־עוֹף כָּנָף לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טוֹב
    he_translit: "va-yivra Elohim et-ha-taninim ha-gedolim ve-et kol-nefesh ha-chaya ha-romeset asher shartzu ha-mayim le-minehem ve-et kol-of kanaf le-minehu va-yar Elohim ki-tov"
    en: "[EN-AID/JPS] And God created the great sea-monsters, and every living creature that creepeth, wherewith the waters swarmed, after its kind, and every winged fowl after its kind; and God saw that it was good."
    tree_left:
      he: ויברא אלהים את התנינם הגדלים
      he_translit: "va-yivra Elohim et-ha-taninim ha-gedolim"
      en: "bara returns: the unordered great taninim lead the inventory (etnachta arm)"
    tree_right:
      he: ואת כל נפש החיה הרמשת אשר שרצו המים למינהם ואת כל עוף כנף למינהו וירא אלהים כי טוב
      he_translit: "ve-et kol-nefesh ha-chaya ha-romeset asher shartzu ha-mayim le-minehem ve-et kol-of kanaf le-minehu va-yar Elohim ki-tov"
      en: "the credited inventory (kind-keyed) + the day's test — before the blessing"
    operators:
      - op: EVENT
        expr_en: "create(e1) ∧ Agent(e1, Elohim) ∧ Theme(e1, taninim) ∧ Theme(e1, nefesh_chaya_romeset) ∧ Theme(e1, of_kanaf)"
        he: וַיִּבְרָא אֱלֹהִים אֶת … וְאֵת … וְאֵת
        he_translit: "va-yivra Elohim et … ve-et … ve-et"
        en: >
          bara ('created', Vqw3ms) — the 1:1 verb, RETURNING for the first
          time since the corpus opened: not asah (days 2, 4), not a
          delegate's production (day 3) — creation's own verb, and its
          themes are the corpus's first LIVING entities. THREE et-markers
          (To x3). Orthography flag, verified from own letter data
          2026-07-30: הַתַּנִּינִם is coded PLURAL (Ncmpa) but WRITTEN
          DEFECTIVE — the plural suffix missing its yod (single-yod ktiv) —
          the me'orot-class mismatch between coded form and written form,
          recorded [OPEN] (Oral candidate: the tannin/Leviathan reading —
          observation tier, ORAL_taninim_defective). ha-romeset: participle
          (Vqrfsa) — the delivered class described by STANDING BEHAVIOR
          (TIR-031), not event.
        cites: ["TIR-014", "TIR-015", "TIR-031"]
        confidence: tested
      - op: REGISTRY_INSTALL
        expr_en: "WORLD += {taninim, nefesh_chaya_romeset, of_kanaf} — the delivered inventory, credited and kind-keyed"
        en: "three entity classes enter the world; the middle one arrives inside a relative clause that names its producer"
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(swarm(mayim), product=sheretz_nefesh_chaya, t1) — asher shartzu ha-mayim: the perfect-tense relative clause is the receipt; no va-yehi khen exists in this unit"
        he: אֲשֶׁר שָׁרְצוּ הַמַּיִם
        he_translit: "asher shartzu ha-mayim"
        en: >
          The receipt, relocated: the demand verb returns as a PERFECT
          (shartzu, Vqp3cp — same root, same subject ha-mayim) inside the
          delivery's relative clause — 'which the waters SWARMED'. The
          text pops the 1:20 demand not with the ceremonial token but by
          crediting the delegate mid-inventory. Onkelos sharpens the
          crediting into causation: archishu (APHEL) — 'which the waters
          BROUGHT FORTH'. Mood of the demand stays LET? on the log
          (TIR-028 — satisfaction is not upgrade).
        cites: []
        confidence: tested
      - op: RESULT
        expr_en: "HOLDS(fly(of), loc=pnei_raqia_ha_shamayim, t1) — ve-et kol-of kanaf: receipt by delivered inventory"
        he: וְאֵת כָּל־עוֹף כָּנָף
        he_translit: "ve-et kol-of kanaf"
        en: >
          The flier demand pops by DELIVERY ALONE: no perfect-tense echo,
          no receipt clause — the winged inventory simply appears in the
          bara list. Receipt asymmetry, letter-visible: the waters get
          verbal credit (shartzu), the fliers only presence. Onkelos
          repairs the asymmetry — ofa DE-FARACH ('fowl THAT FLIES')
          re-verbalizes kanaf, handing the flier demand the same
          relative-clause receipt shape. Recorded [OPEN].
        cites: []
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'yishretzu HA-MAYIM (the waters as delegated producer)' delivered 'va-yivra ELOHIM (bara — God executes; the waters credited only in the relative clause)' — flag spec_delta"
        he: יִשְׁרְצוּ הַמַּיִם ← וַיִּבְרָא אֱלֹהִים
        he_translit: "yishretzu ha-mayim -> va-yivra Elohim"
        en: >
          The agent delta: the spec delegates, the delivery is executed by
          God himself with creation's strongest verb — while the relative
          clause simultaneously credits the delegate. Dual agency,
          letter-visible in one verse (bara + shartzu). Contrast day 3,
          where the delegate performed (tadshe -> va-totze ha-aretz).
          Significance = named-Oral track (Onkelos's aphel is the first
          resolution witness; chain primaries queued for the day-5 triage).
        cites: []
        confidence: "delta tested (letter-visible); significance = named-Oral track"
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'no taninim in the order' delivered 'et-ha-taninim ha-gedolim leading the inventory, with the week's only mid-week bara' — flag spec_delta"
        he: אֶת־הַתַּנִּינִם הַגְּדֹלִים
        he_translit: "et-ha-taninim ha-gedolim"
        en: >
          Over-delivery in first position: the great taninim appear in no
