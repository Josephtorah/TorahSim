    he: "רַבִּי מֵאִיר אוֹמֵר: אֵלּוּ שֶׁנִּבְרְאוּ מִן הָאָרֶץ פָּרִים וְרָבִים בָּאָרֶץ, וְאֵלּוּ שֶׁשָּׁרְצוּ מִן הַמַּיִם פָּרִים וְרָבִים בַּמַּיִם, חוּץ מִכָּל מִין עוֹף כָּנָף שֶׁבְּרִיָּתוֹ מִן הַמַּיִם וּפָרֶה וְרָבֶה בָּאָרֶץ, שֶׁנֶּאֱמַר וְהָעוֹף יִרֶב בָּאָרֶץ"
