  - id: ORAL_taninim_defective
    status: verified
    work_en: "Bereshit Rabbah 7:4 (the ktiv owner) with Bava Batra 74b:5-8 (the Leviathan dossier; 74b:6-8 via §4.1 promotion fetch) — read at the day-5 triage (ledger rows 3, 9); the tradition Rashi on 1:21 transmits"
    he: "רַבִּי פִּנְחָס בְּשֵׁם רַבִּי אַחָא אָמַר תַּנִּינָם כְּתִיב, זֶה בְּהֵמוֹת וְלִוְיָתָן שֶׁאֵין לָהֶם בֶּן זוּגוֹת"
    he_translit: "Rabbi Pinchas be-shem Rabbi Acha amar: TANNINAM KTIV — zeh Behemot ve-Livyatan she-ein lahem ben zugot"
    en: >
      "R. Pinchas in the name of R. Acha said: TANNINAM IS WRITTEN
      [defective] — this is Behemot and Leviathan, who have no mates":
      the chain-primary owner of the single-yod flag, reading the short
      plural as the pair-less singulars. Beside it the Bavli's version
      (BB 74b:5: R. Yochanan — "this is Leviathan the slant serpent and
      Leviathan the tortuous serpent"; 74b:6: "male and female He created
      them… He castrated the male and slew the female and salted her for
      the righteous — ve-harag et ha-tannin asher ba-yam", Isa 27:1):
      same flag, two chain resolutions (never-paired vs pair-broken).
      Targum Jonathan writes the tradition into the verse itself ("yat
      Leviathan and its mate, readied for the day of consolation" — the
      preserved-not-slain version); Lekach Tov 1:21:1 states the letter
      fact verbatim ("tanninam is written, MISSING ITS YOD"). The
      letter-level fact remains verified from our own word data
      (single-yod ktiv against the Ncmpa plural coding, 2026-07-30).
    comment_en: >
      AMENDED 2026-07-30 at the day-5 triage (owner order "do the day 5
      triage"; upgrade pre-announced in the note's own text): observation
      -> verified at the chain-primary locations, from local text.
      Dual-track; the machine's [OPEN] flag stands. Not merged.
    source: "[ORAL][VERIFIED-LOCAL]"
  - id: ORAL_of_source_reqaq
    status: verified
    work_en: "Bavli Chullin 27b:11 (with the sugya's answer at 27b:12, carried in Ein Yaakov Chullin 2:1) and Pesikta DeRav Kahana 4:3 — on the 1:20 DECLARE-2; day-5 triage rows 11, 66"
    he: "כָּתוּב אֶחָד אוֹמֵר יִשְׁרְצוּ הַמַּיִם … וְעוֹף יְעוֹפֵף — אַלְמָא מִמַּיָּא אִיבְּרוֹ, וּכְתִיב וַיִּצֶר ה' אֱלֹהִים מִן הָאֲדָמָה … וְאֵת כָּל עוֹף הַשָּׁמַיִם — אַלְמָא מֵאַרְעָא אִיבְּרוֹ! … מִן הָרְקָק נִבְרְאוּ"
    he_translit: "katuv echad omer yishretzu ha-mayim … ve-of ye'ofef — alma mi-maya ibberu; u-khtiv va-yitzer … min ha-adamah … ve-et kol of ha-shamayim — alma me-ar'a ibberu! … min ha-REQAQ nivre'u"
    en: >
      "One verse says 'let the waters swarm … and fowl fly' — so they were
      created FROM THE WATER; but another says 'He formed from the GROUND
      … every fowl of the heavens' (2:19)!" — answered: "from the REQAQ
      (the mud-shallows) they were created." The chain asking whether the
      of stands INSIDE or BESIDE the waters' delegation — the structure of
      the unit's second demand — and resolving it with a third medium.
      Bar Kappara's form (PDRK 4:3): "the of was created from the reqaq
      OF THE SEA." Targum Jonathan writes the harmonization into the verse
      itself: yerachashun REQAQEI moi — "let the MUD-SHALLOWS of the
      waters swarm."
    comment_en: >
      AMENDED 2026-07-30, owner order ("amend"). The DECLARE-2 operator
      stands as derived (the of the subject of its own imperfect); the
      chain's source-medium debate is recorded beside it. Verified local.
