  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_58_2026-08-08.md; manifest 7/7
    checkable VERIFIED, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified). THE REUBEN VERSE, COMMITTED TO
    ONE [G58-01, Or Torah via Minchat Shai]: the tradition carries
    35:22 doubly — ONE verse in one reading and TWO in the other,
    some words bearing two accents at once, the way of the Ten
    Commandments (both accent-lists quoted). SNAPSHOT's stream stores
    it as ONE verse with a single accent per word — the twelve-sons
    clause continuing unbroken after "and Israel heard" — following
    the one-verse cantillation at every station except ראובן itself,
    which carries the TWO-verse reading's zaqef qatan (the small
    two-dot pause): the doubled tradition flattened to one line, with
    Reuben's own word keeping the other reading's mark. First member
    of a NEW instrument-gap class (double-reading verses). BENJAMIN
    BORN FULL [G58-02, the Masorah + Sotah via Minchat Shai]: at the
    naming — Rachel's בן־אוני ("son of my sorrow") answered by his
    father's בנימין ("son of the right hand," 35:18) — the name is
    written FULL with its yod as ruled; and the fullness maps the
    name's whole career: all SEVEN full tokens stand in Genesis,
    where Benjamin lives and is wept over, while every roster-token
    of Numbers runs lean (builder-checked): the living son full, the
    census-name lean. PUT-AWAY, ONCE AND LEAN [G58-04]: הסרו ("PUT
    AWAY the foreign gods in your midst," 35:2 — the purge before
    Bethel) — the word's only Torah token, lean of its yod as the
    whole chain rules; its one Scripture partner written full at
    Jeremiah's "REMOVE the foreskin of your heart" (4:4, named): the
    idols put away lean, the heart full. THE BIRTH-ROAD PAIR
    [G58-05]: on the road to Ephrath the coming-word לבוא is FULL as
    all the books rule (35:16), and בהקשתה ("in her HARD labor,"
    35:17) is LEAN — the Masorah's none-like-it, Hilleli and the
    Ramah against the Yerushalmi: the road whole, the travail one
    letter short. THE POURING SOFT, TWICE RULED [G58-06]: ויצק ("and
    he POURED oil on it," 35:14 — the pillar anointed again) — tzadi
    soft with most books, the Radak, and Or Torah: the same soft-camp
    SNAPSHOT joined at this pillar's FIRST anointing (28:18, the
    split-attested station) — the two Bethel pourings pointing
    together. AS RULED [G58-07]: בתככם ("in your midst") kaf plain
    sheva; ויהי of the soul's departing under gershayim (the double
    stroke); גר of "where Abraham and Isaac SOJOURNED" (35:27) with
    the precise manuscripts' meteg. DISCREPANCY: the terror-verse's
    leveled surroundings [G58-03] — at "the TERROR of God was on the
    cities AROUND THEM" (35:5) Minchat Shai's entire chain (all his
    books, the Hilleli, the written Masorah, the Ramah) rules
    the word full with its vav (סביבותיהם, "around them"); SNAPSHOT writes it LEAN,
    level with the two lean members at Korach's swallowing (Num
