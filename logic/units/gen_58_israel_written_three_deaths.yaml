derivation_log:
  - step: A
    name_en: "Reconstruction notice (2026-08-08)"
    comment: >
      This unit was frozen in the lean era (meta + scenarios + boot
      steps; no step table was written at freeze). The steps below were
      reconstructed on 2026-08-08 from the freeze-era draft note
      (meta.draft_note_en, displayed on the unit page), the era's
      continue-docs, and git history. No new derivation claims are
      introduced: every entry restates recorded decisions, and the full
      per-verse machine record is the boot steps below.
    confidence: established
  - step: B
    name_en: "Source + span + structure"
    comment: >
      Genesis 35:1-29, the whole chapter: 29 verses, 378 tokens,
      source-verified. Twenty-six verses carry the mid-verse rest;
      the three without (35:15, 35:24, 35:25) split at the
      strongest-disjunctive fallback. No written/read variants in
      span. Evidence: the SNAPSHOT database plus the debut-map
      attachment.
    confidence: reconstructed
  - step: C
    name_en: "Draft path + review"
    comment: >
      Solo-era unit #12: Claude as coordinator and deriver, with an
      external fresh-context adversarial review before freeze per the
      standing law. Frozen 2026-08-07.
    confidence: reconstructed
  - step: D
    name_en: "Care-point ledger (distilled)"
    comment: >
      Six crowns govern the record. THE DECREE AND THE FORMULA IN ONE
      VERSE (35:10): the decree grammar — which writes nothing, per
      the frozen law — stands beside the narrative naming formula,
      which writes: the registry takes Jacob := Israel three chapters
      after the wrestling decree withheld it, and only the formula
      moves the machine; the countersign is that the narrator's first
      Israel comes only AFTER the write, while Jacob keeps being
      written — last-write-wins, not erasure. THE PURITY-PAIR BORN IN
      CONSECUTIVE CHAPTERS: the defile-verb entered on Dinah, the
      purify-verb enters one chapter later in the purge command — the
      codebook's defining pair, back to back. LAST-WRITE-WINS, TWICE:
      the El-prefixed Bethel name reduced to the plain one; and the
      dying mother's son-of-my-sorrow overwritten by the father's
      Benjamin — the machine's own law enacting the story's grief.
      THE CULT KIT SEEDED AT BETHEL: the libation-noun born on the
      pillar; the pour-verb's first two tokens are the same man's two
      Bethel anointings twenty years apart; the pillar's career ends
      BANNED by the law. GOD-GOES-UP, EXACTLY TWICE: only the two
      renaming theophanies end with God ascending. BETHLEHEM EXISTS
      ONLY AT RACHEL'S GRAVE: the death-scene's entire rare
      vocabulary recurs nowhere but the dying Jacob's own retelling.
      Also filed: God NAMES the flight — the flee-verb Jacob never
      performed is the verb God uses for that journey; the earring's
      ledger walks bride-gift, buried idol-freight, the golden calf,
      the sanctuary offering; the nurse who traveled anonymous since
      the bride-scenes receives her name IN HER DEATH-VERSE — a
      hapax person under a hapax tree with a hapax name, standing
      where Rebekah's never-narrated death never will; the
      hardness-verb is born in Rachel's labor and spent on hearts
      and necks; the midwife's office debuts losing a mother; the
      wished jussives of the send-off blessing return as commands
      from the wished God; and the brother-pair burial repeats with
      its order FLIPPED — Esau precedes Jacob where Isaac preceded
      Ishmael.
    confidence: reconstructed
  - step: E
    name_en: "Machine design"
    comment: >
      NINE pushes, ZERO pops — a second nine-open wall, back to back
      with the previous unit's, and they are OPPOSITES: those nine
      died refused and unperformed; these nine die OBEYED. Every
      commanded thing happens, and not one commanded VERB ever
      returns as the demandee's narrated deed: arise-and-go-up is
      answered by journeying and coming; dwell by the other
      abide-root; make-an-altar by BUILDING it; remove-the-gods by
      giving and hiding; purify and change-garments are never
      narrated at all; the Torah's ONLY SINGULAR
      be-fruitful-and-multiply (a full form-census: one singular
      imperative of each root, both in this verse, against the
      plural blessings of creation and Noah) waits on a
      people-horizon; and the midwife's fear-not is followed by the
      mother's death. The one commanded root that does narrate has
      GOD, not the demandee, as subject — ascending FROM Jacob, the
      opposite direction. Under the standing other-root law all nine
      cards stand open over a chapter of visible obedience: the
      mismatch family gains its COMPLIANCE class. The volitive
      census (twelve) is fully accounted — nine cards, zero fenced.
      Registry: six formula-writes on four objects (two overwrites)
      — the ledger ends Bethel, the Oak of Weeping, Israel,
      Benjamin. Zero tests.
    confidence: reconstructed
  - step: F
    name_en: "Freeze + later history"
    comment: >
      Frozen at commit 4a1eb5e (2026-08-07, "Freeze gen_58: Israel
      written, three deaths on the road"). Oral audit 2026-08-08
      folded same day (run 7 block 7): 7 VERIFIED, 0 FAILED,
