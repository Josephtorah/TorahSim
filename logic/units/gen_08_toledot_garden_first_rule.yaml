          ve-ashrei ('caused-to-DWELL' — the shra root the Aramaic
          uses where Presence dwells; Tier-A, dual-track).
        cites: []
        confidence: tested
      - op: ASSIGN
        expr_en: "REGISTRY: adam->oved_ve_shomer"
        he: לְעָבְדָהּ וּלְשָׁמְרָהּ
