          courts. The unit's declare payload is unchanged; the laws ride it.
          [folded shape: priced law]
        cites: ["Sanhedrin 56b:4", "Bereshit Rabbah 16:6", "Pesikta DeRav Kahana 12:1", "Sanhedrin 56b:23"]
        confidence: witnessed
    comment: >
      Frame left, permission right, and the corpus's first doubled verb
