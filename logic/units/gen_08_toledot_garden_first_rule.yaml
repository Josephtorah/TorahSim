    op: COMMAND_PERMISSION
    he: וַיְצַו יְהוָה אֱלֹהִים עַל־הָאָדָם לֵאמֹר מִכֹּל עֵץ־הַגָּן אָכֹל תֹּאכֵל
    he_translit: "va-yetzav YHWH Elohim al-ha-adam le-mor mi-kol etz-ha-gan akhol tokhel"
    en: "[EN-AID/JPS] And the LORD God commanded the man, saying: 'Of every tree of the garden thou mayest freely eat.'"
    tree_left:
