        expr_en: "command(e9) ∧ Agent(e9, YHWH_Elohim) ∧ Theme(e9, adam)"
        he: וַיְצַו יְהוָה אֱלֹהִים עַל־הָאָדָם לֵאמֹר
        he_translit: "va-yetzav YHWH Elohim al-ha-adam le-mor"
        en: >
          THE FIRST COMMAND TOKEN OF THE CORPUS: va-YETZAV (piel
          wayyiqtol; DB-verified first of 252 tzavah tokens Torah-wide)
          — the root of the ka'asher tzivah ('as He commanded') receipt
          system the corpus runs on. The preposition is AL ('UPON the
          human'), not el ('to') — command as something LAID ON the
          addressee. The command is an EVENT in narrative tense — the
          rule is INSTALLED by an act at a moment, to one addressee:
          contrast Lev 13's agentless weqatal statute. le-mor
          ('saying') carries the etnachta: the verse's own rest divides
          [frame | body] — installation apparatus left, payload right.
        cites: ["TIR-014"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(YHWH_Elohim, LET?(akhal(adam, mi_kol_etz_ha_gan)))"
        he: מִכֹּל עֵץ־הַגָּן אָכֹל תֹּאכֵל
        he_translit: "mi-kol etz-ha-gan akhol tokhel"
        en: >
          THE PERMISSION: 'from EVERY tree of the garden, EATING YOU
          MAY EAT' — akhol tokhel: infinitive absolute + imperfect
          2ms, and the DB says this is the CORPUS'S FIRST
          infinitive-absolute doubling, full stop — the emphatic
          device is born in a permission. The imperfect inside command
          speech takes TIR-028's mandatory ?: form alone cannot split
          permission/command/future (the chain's own split: reshut —
          permission — vs the Sanhedrin 56b reading that derives
          standing law from this clause; named-only, queued). The
          demand enters SPECS and stays OPEN — nothing in the span
          (nor in Eden) receipts it. Scope: mi-KOL, 'from ALL' — the
          widest grant the corpus has issued to a named individual;
          measured against 1:29 it NARROWS (spec-delta below).
          Onkelos retains the doubling: meikhal teikhul (Tier-A).
        cites: ["TIR-028"]
        confidence: tested
      - op: NOTE_SPEC_DELTA
        expr_en: "spec 'kol esev + kol etz le-okhlah (1:29 universal food grant)' delivered 'mi-kol etz ha-gan + one exclusion pending (the grant narrows to a bounded domain)'"
        en: "the food specification changes shape: universal grant -> scoped permission with a carve-out one verse away"
        cites: []
        confidence: tested
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(declare_payload, six_noachide_commandments)"
        en: >
          THE CROWN: SIX LAWS READ OFF THIS OPERATOR'S OWN WORDS [claim
          G08-28]. R. Yochanan derives the commandments binding all humanity
          word by word from this verse — צַו (tzav, 'command') yielding the
