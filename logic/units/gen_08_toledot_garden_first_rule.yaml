        expr_en: "DECLARE(YHWH_Elohim, LET-NOT(akhal(adam, me_etz_ha_daat_tov_va_ra)))"
        he: וּמֵעֵץ הַדַּעַת טוֹב וָרָע לֹא תֹאכַל מִמֶּנּוּ
        he_translit: "u-me-etz ha-daat tov va-ra lo tokhal mimenu"
        en: >
          THE CORPUS'S FIRST PROHIBITION — and the interpreter's first
          LET-NOT: the mood has existed since day 1 and never fired
          through seven units; it fires here, where the text's first
          lo + imperfect-2ms stands (DB-verified: this is the first
          such token in the corpus; the second is 3:17 — the sentence
          quoting this clause back). TIR-034 (provisional, minted at
          this derivation): lo + imperfect INSIDE AN EXPLICIT COMMAND
          FRAME (va-yetzav ... le-mor, the performative verb one verse
          up) reads as PROHIBITION, not forecast — the frame is the
          disambiguator TIR-028 says the bare form lacks; where no
          frame exists the form stays flagged. The rule-note records
          the corpus's own proof of the ambiguity: the serpent's 3:4
          lo mot temutun re-reads exactly this construction as a
          (false) forecast. The demand enters SPECS as LET-NOT and
          stays OPEN — and S10_negative asserts the contract: a
          prohibition has NO resolution path (resolve_spec refuses;
          no citation can flip a LET-NOT). Scope: ONE tree, named by
          the knowledge it carries; mimenu ('from it') pins the
          source. Onkelos re-runs its effect-naming of the tree and
          keeps the negation plain: la teikhul minneh (Tier-A).
        cites: ["TIR-034"]
        confidence: tested
      - op: HANDLER
        expr_en: "HANDLER IF(be_yom_akhal(adam, me_etz_ha_daat_tov_va_ra)) THEN(mot_tamut(adam))"
        he: כִּי בְּיוֹם אֲכָלְךָ מִמֶּנּוּ מוֹת תָּמוּת
        he_translit: "ki be-yom akholkha mimenu mot tamut"
        en: >
          THE PENALTY, installed as a STANDING CONDITIONAL — the lev_13
          HANDLER, hand-authored here per Pre-Code: the ki-clause
          ('for in the DAY of your eating from it') is a trigger
          description, and mot tamut ('DYING YOU SHALL DIE' —
          infinitive absolute + imperfect, the span's SECOND doubling)
          is the consequence. Nothing is demanded of the narrative
          present — no receipt is owed — so the machine holds it as a
          WORLD fact awaiting its case: Gen 3 is the case arriving.
          The trees bracket this verse [prohibition | penalty] at the
          etnachta — the SAME [condition | action] bracket all seven
          of Lev 13:1-8's law verses carry: the law genre's shape,
          present in embryo in the corpus's first rule, installed by
          narrative speech rather than statute. The formula's afterlife
          is measured: mot tamut is the first of the 31-member
          death-doubling family; from Exod 21:12 the law codes fix it
          as mot YUMAT ('he shall surely be PUT to death') — the
          second-person warning institutionalized into the capital
          formula (DB census, watch-list A.4). The timing clause
          (be-yom, 'in the DAY') runs the penalty on the week's own
          clock — and its non-firing-as-written on the day of Gen 3:6
