          thousand-years readings; commutation readings — triage
          material, named-only). Onkelos keeps the doubling: meimat
          temut (Tier-A).
        cites: ["TIR-029"]
        confidence: tested
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(death_handler, divine_day_scope_and_exact_payload)"
        en: >
          THE HANDLER THAT LOOKS LIKE IT NEVER FIRED [claim G08-29]. The human
          eats and does not die that day. The chain resolves it on the
          operator's own wording, three ways. SCOPE OF THE DAY: 'you do not
          know whether one of My days or one of yours — I will grant him one
          of Mine, a thousand years' (Psalms 90:4); the handler DID fire, Adam
          dying at 930, inside the divine day. EXACT PAYLOAD: the prohibition
          was on EATING only, and the touching clause is the woman's addition
          at 3:3 — on this exact gap the principle כָּל הַמּוֹסִיף גּוֹרֵעַ
          (kol ha-mosif gorea, 'whoever adds, subtracts') is minted, the fence
          built taller than the law being what the serpent pushed against.
          MOTIVE ON RECORD: the serpent is quoted reasoning FROM this clause —
          'I know He said on the day you eat you shall die; I will trick them
          and they will be punished.' [folded shape: kept record]
        cites: ["Bereshit Rabbah 19:8", "Bereshit Rabbah 19:3", "Sanhedrin 29a:34", "Jerusalem Talmud Kiddushin 4:1:9"]
        confidence: witnessed
    comment: >
      The unit ends OWING: two demands open (a permission never
      receipted, a prohibition standing), one handler armed, no test,
      no commit — the corpus's first unit whose SPECS queue survives
