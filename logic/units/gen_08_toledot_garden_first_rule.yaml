    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Gn_2_17
    order: 14
    ref: "Gen.2.17"
    op: PROHIBITION_PENALTY
    he: וּמֵעֵץ הַדַּעַת טוֹב וָרָע לֹא תֹאכַל מִמֶּנּוּ כִּי בְּיוֹם אֲכָלְךָ מִמֶּנּוּ מוֹת תָּמוּת
    he_translit: "u-me-etz ha-daat tov va-ra lo tokhal mimenu ki be-yom akholkha mimenu mot tamut"
    en: "[EN-AID/JPS] 'But of the tree of the knowledge of good and evil, thou shalt not eat of it; for in the day that thou eatest thereof thou shalt surely die.'"
    tree_left:
      he: ומעץ הדעת טוב ורע לא תאכל ממנו
      he_translit: "u-me-etz ha-daat tov va-ra lo tokhal mimenu"
      en: "THE PROHIBITION: from the knowledge tree you shall not eat (etnachta arm)"
    tree_right:
