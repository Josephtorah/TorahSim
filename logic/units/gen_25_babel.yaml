    he: וְאִתְגְּלִי יְיָ לְאִתְפְּרָעָא
    he_translit: "ve-itgeli YY le-itpara"
    en: >
      The span's translation witness: THE DESCENT BECOMES A
      REVEALING AND THE SEEING BECOMES PUNISHING [find-class] —
      'the LORD was REVEALED to EXACT PUNISHMENT upon the DEEDS
      of the city and tower': the anthropomorphism dodged, the
      letter's withheld verdict INSERTED (gen_19's
      seeing-without-judging is precisely what the buffer
      refuses to carry), the buildings turned to deeds (the
      machine's no-TEST stands on the letter; dual-track,
      flagged). The divine cohortative re-voiced with the
      reveal-verb (havu nitgeli) but the COUNCIL-PLURAL KEPT
      (u-nevalbel, 'let Us confuse'). The BAVEL/BALAL pun
      survives DOUBLED (balal -> balbel); SAPHAH -> LISHAN
      throughout — the lip/tongue sibling-split leveled to the
      table's tongue-word; 'one words' -> 'one speech'. The east
      TEMPORALIZED (mi-qedem -> 'at first' — the Eden-to-Babel
      east-line invisible); Shinar -> 'the land of Babel' again;
      the materials recast (cast-bricks, fire, plaster); the
      tower's head 'reaching to the TOP OF the heavens'. The
      cessation becomes a RESTRAINT rhymed with the assessment:
      'they ceased' -> 'they were RESTRAINED', the same Aramaic
      root the buffer gave 11:6's 'nothing will be withheld' —
      one root where the letter has two verbs: a buffer-side arc
      the letter does not draw (flagged).
