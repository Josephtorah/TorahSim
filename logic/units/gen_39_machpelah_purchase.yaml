    20/20 checkable, zero FAILED, one builder-asserted manual row).
    CROWNS (chain-attested + DB-verified). THE MISER LOSES HIS
    LETTER [G39-01/02/03, Minchat Shai on 23:16; Bereshit Rabbah
    58 + Shemot Rabbah 31; Kitzur]: Ephron's name stands EIGHT
    times in the purchase chapter — seven PLENE with vav, exactly
