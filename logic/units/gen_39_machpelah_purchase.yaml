    paragraph layer uninstrumented; 23:9's accent-choice splits
    (revia vs double geresh on ויתן לי "that he may give me"; qadma with azla (the paired ascending accents) vs wheel-and-revia on בכסף מלא "for full silver") — the accent-convention
    variance class, named-only. READINGS (named-only, unclaimed):
    R. Yitzchak's defective-ישב throne-reading at 23:10 ("that
    day they seated him as chief over them" — Bereshit Rabbah 58,
    the Zohar page named); the Kitzur's sun-juxtaposition
    (Rebecca born before Sarah's sun set); the ten-utterances
    moral; the "many dead" derash on the withheld yod.
