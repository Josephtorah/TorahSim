    — exactly TEN times in the whole Torah: eight at the purchase
    (23:3, 5, 7, 10 twice, 16, 18, 20), two deed-echoes (25:10 at
    Abraham's burial, 49:32 in Jacob's charge); nine bare pairs
    plus the bowing-verse's prefixed tenth — the Kitzur's
    ten-utterances reading ("who clarifies a scholar's purchase is
    as one who fulfilled the Ten") censused whole. THE MIDST-WORD
    DIVIDES AS THE RAMAH RULES [G39-05/06, Minchat Shai on 23:9]:
    בתוככם ("a burial holding IN YOUR MIDST") plene with vav, TEN
    such in the Torah — and the only TWO defective midst-tokens
    are exactly the Ramah's sign-verses: "remove the foreign gods
    in your midst" (Gen 35:2) and the Transjordan condition
    (Num 32:30). THE BURY-WORD RUNS LEAN [G39-07, Minchat Shai on
    23:6, the Ramah + Minchat Kohen]: every bury-form in the
    chapter defective (the rule that unmasked the Mikra Gedolah
    printer's false plene note) — and the Torah's ONE vav-written
    bury-form is the emphatic doubled קבור ("you shall SURELY
    BURY him" — the hanged man, Deut 21:23): the whole Torah
    buries lean except the verse that insists on burial itself.
    THE WITHHELD YOD OF THE DEAD [G39-04, Minchat Shai + Kitzur
    on 23:6]: מתך ("your DEAD") — four tokens in the Torah, all
    in this chapter (23:6 twice, 23:11, 23:15), ALL defective:
    Bereshit Rabbah's "many dead" derash rides the missing yod
    (the Yefeh Toar: "as if written with it") against the one
    plene resurrection-word — "your dead shall LIVE" (Isa 26:19;
    edge). THE SUN IN THE INITIALS [G39-11, Kitzur on 23:1]:
    שרה מאה שנה ("Sarah, a hundred years") — the three words open
    ש-מ-ש, the letters of שמש ("sun"): the Kitzur's seal on "the
    sun rises and the sun sets" — before Sarah's sun set,
    Rebecca's rose (her birth-notice stands one verse before the
    chapter). ESAU IN THE DEED [G39-12, Kitzur on 23:17]:
    ויקם שדה עפרון ("and the field of Ephron was ESTABLISHED") —
    initials ו-ש-ע, the letters of עשו ("Esau") reversed: the
    future contester of the cave hiding backwards in the verse
    that seals its purchase. THE WITHHOLD-VERB STANDS ALONE
    [G39-08/09, Kitzur on 23:6]: יכלה ("withhold" / "could") — three consonantal tokens
    in the Torah, split by pointing: the segol-pointed withhold
    ("none of us will WITHHOLD his grave from you," 23:6, unique)
    against the two qamatz could-verbs ("the land COULD not bear
    them," 36:7; "she COULD no longer hide him," Exod 2:3); the
    Kitzur's Masorah-moral: deny a grave and lack one (the
    failing rod, Prov 22:8; edge). THE CAVE FACES MAMRE DIRECTLY
    [G39-18, Minchat Shai on 23:19]: of the six Machpelah tokens
    in the Torah, only Sarah's burial-verse runs the cave
    straight onto על פני ממרא ("facing Mamre") with no אשר
    ("which") between — the Masorah's unique, verified by adjacency against Abraham's burial-notice (25:9) where the
    relative-word intervenes. MINUTIAE AS RULED
    [G39-13/14/15/16/17/19/20, Minchat Shai]: the lone tarsa (the
    postpositive ornament-accent) on ויען ("and Ephron ANSWERED,"
    23:10) and on ארץ ("a land of four hundred shekels," 23:15);
    the dageshed zayin of לאחזת ("burial HOLDING," 23:20); גר ("a
    STRANGER and a sojourner am I," 23:4) bare of the
    lengthener-stroke per the Ben Asher collation Minchat Shai
    confirmed in an early codex, leaning on the sojourner by
    maqqef; and the rise-verb's alternating accent — ויקם ("and
    Abraham ROSE") doubled-marked at 23:3 (stress drawn back
    before מעל "from before") and single-marked at the bowing
    (23:7), exactly per the mnemonic "at מעל — back; at the
    bowing — forward." INSTRUMENT GAPS: ולבכתה ("and to weep for
    her," 23:2) carries the SMALL KAF — the letter-size layer
    remains uninstrumented (the Kitzur's two readings named: he
    wept little, for she was old; or her own agency in her death
    — station note); the paseq dispute after the Name at
    נשיא אלהים אתה ("a prince of God are you," 23:6 — Lonzano
    against one ancient codex; the Yalkut-quoted Soferim "holy"
