  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #3 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    29:15–30, the wage-to-double-marriage boundary (29:31 opens the womb
    arc). 16 verses · 185 tokens (SNAPSHOT-verified). SNAPSHOT + debut_map.
    bar C. Conventions: step he: = plain (no accents/meteg; maqqef ־ per
    snapshot); tree halves = accents kept, slashes stripped; split at
    etnachta — EXCEPT 29:22, which has NO etnachta: split at its strongest
    disjunctive, the tifcha at idx5 (precedent: gen_03's 1:13 class of
    etnachta-less verses). Onkelos BUFFER PENDING.

    UNIT SHAPE — the deception INSIDE the demand mechanics: five volitives
    (four imperatives + one purpose-cohortative) → FOUR pushes, THREE pops,
    and the unit's centerpiece is a NON-POP: at 29:23 Laban delivers a
    woman to the man who demanded "MY WIFE" — the object is the WRONG
    DAUGHTER, so LET(hava_ishti) holds OPEN through the wedding night. The
    switch is machine-visible as a card that refuses to clear. It pops only
    at 29:28 when the contracted wife is finally given. Depth walk:
    0→1→0→1→2→(non-pop)→3→1; ends depth 1 OPEN (sheva_imadi — the
    dwell-root never returns in-span). INSTRUMENT NOTE: tov "good" 2896
    tok28 WAKES at 29:19 — first in-span instrument token since gen_45 —
    but as Laban's comparative inside speech ("BETTER I give her to you"):
    attribute-fenced per gen_46's 27:9 tovim; NO TEST fires. TESTS 0.
    REGISTRY 0 (Leah/Zilpah/Bilhah are narrator introductions, no
    va-yiqra-shem formula).

    CARE-POINTS (filed before derivation; every ordinal DB-verified):
    (1) 29:15 THE WAGE QUESTION. serve-verb 5647 tok12 va-avadtani — toks
    9-10-11-12 CONSECUTIVE: 25:23 the oracle ("the elder shall SERVE the
    younger") → 27:29 the blessing ("peoples SERVE you") → 27:40 the
    anti-blessing ("your brother you SERVE") → "should you SERVE me for
    nothing?" — and SIX serve-tokens in-span (12-17): the verb promised TO
    Jacob becomes his own fourteen years. chinam 2600 tok1/4 DEBUT ("for
    nothing"; toks 2-3 = Exod 21:2,11 — the slave freed for nothing);
    maskoret 4909 tok1/3 DEBUT (wages; toks 2-3 = 31:7,41 "changed my
    wages"). PUSH: hagida-li (5046 tok15 HVhv2ms) = LET(hagida_maskoret
    (yaaqov)) — tell-me-your-wage.
    (2) 29:16 the two daughters: ha-gedola 1419 tok25 / ha-qetana 6996
    tok6 — THE ELDER/YOUNGER PAIR RETURNS: 27:1/15/42 used it for the
    brothers (1419 toks 18-19, 22); now the daughters. Leah 3812 tok1/33
    DEBUT.
    (3) 29:17 the eyes and the form. ene Leah rakot — eyes 5869 tok38;
    rakh 7390 tok2/6 (tok1 = 18:7 Abraham's TENDER calf; tok3 = 33:13
    Jacob's own "the children are tender"); Rachel yefat-toar — toar 8389
    tok1/5 DEBUT (tok2 = 39:6 JOSEPH yefe-toar: the mother's beauty-word
    passes to her son; toks 3-4 = Pharaoh's cows).
    (4) 29:18 THE ANSWER = THE POP. va-yeehav 157 tok8 — love toks 5-6-7
    are the DECEPTION'S FOOD-LOVE (27:4/9/14 "delicacies as he loved");
    tok8 = the first man-loves-woman-before-marriage in the corpus's
    span. POP LET(hagida_maskoret): the wage is TOLD — "I will serve you
    seven years for Rachel your younger daughter" (content-performance;
    the demand was to tell, and the telling names object, price, and
    term). Depth 0.
    (5) 29:19 THE FENCED INSTRUMENT + NEW PUSH. tov 2896 tok28 — the
    good-instrument's first in-span token since gen_45, as Laban's
    COMPARATIVE inside speech ("BETTER my giving her to you than to
    another man") — attribute-fenced (gen_46 27:9 tovim precedent), NO
    TEST. give-verb 5414 toks 63-64 (titi/mi-titi — Laban's giving-
    economy opens); PUSH: shevah imadi (3427 tok41 HVqv2ms+Sh) =
    LET(sheva_imadi(yaaqov)) — dwell with me: the DWELL-FAMILY's third
    movement (27:44 mother's ve-yashavta limb, frozen OPEN in gen_47 →
    29:14 the month-dwell landing → now Laban DEMANDS the dwelling).
    (6) 29:20 THE FEW-DAYS SEAM. ke-yamim achadim — 259 toks 21-22-23:
    27:44 "yamim achadim" (the mother's promised few days) → 27:45 "yom
    echad" (her both-sons fear) → 29:20 the seven years "were in his eyes
    AS A FEW DAYS." Her word for the exile's length returns as the
    feeling of its first seven years. eyes 5869 tok39 (toks 38-39
    in-span: Leah's eyes → his eyes); love tok9 be-ahavato.
    (7) 29:21 THE BABEL IMPERATIVE. hava 3051 tok4/11 — toks 1-2-3 are
    ALL BABEL (11:3,4,7 "come, let us…"): the collective tower-imperative
    returns as one man's "GIVE my wife." PUSH: LET(hava_ishti(lavan)) —
    the demanded object is THE CONTRACTED WIFE (29:18 named her: Rachel).
    ve-avoa (935 tok91 HC/Vqh1cs) = purpose-cohortative CONTENT (gen_46
    27:4 ve-okhela class — not a separate push). malu yamay — male 4390
    tok10 (see care 14).
    (8) 29:22 THE FEAST (no etnachta — tifcha split). mishteh 4960 tok4/5
    (toks 1-3 = Lot's feast, the weaning feast, the Gerar pact-feast;
    tok5 = 40:20 Pharaoh's birthday); asah tok94 (see care 11's walk);
    maqom 4725 tok32 ("the men of THE PLACE" — the place-word after
    Bethel's naming run).
    (9) 29:23 THE NON-POP — the unit's centerpiece. va-yiqach 3947 tok86
    — take-career toks 79-86: the prohibition (28:1), the push on JACOB
    (28:2 ve-qach), the seen command ×2 (28:6), ESAU's mirror-take
    (28:9), the two stones (28:11,18) — and now LABAN takes LEAH.
    Cross-wall landing-note: gen_47's qum_lekh_qach demanded Jacob TAKE a
    wife from Laban's daughters; the take arrives performed by the WRONG
    AGENT with the WRONG DAUGHTER (frozen ledger untouched). IN-UNIT:
    LET(hava_ishti) does NOT pop — the demand named "my wife" (the
    contracted Rachel, 29:18); Leah is delivered → OBJECT-MISMATCH → NO
    POP. The switch is visible in the machine as a demand that refuses to
    clear on the wedding night. bo-chain: va-yave (hiphil tok92, LABAN
    brings) → va-yavo (tok93, he goes in) — the purpose-cohortative's
    content performed on the wrong object. erev 6153 tok11 (evening — the
    switch happens at the day-boundary word of 1:5).
    (10) 29:24 Zilpah 2153 tok1/7 DEBUT; shifcha 8198 toks 11-12.
    (11) 29:25 THE MORNING AND THE FORMULA. va-yehi va-boqer ve-hine hiv
    LEAH — boqer 1242 tok14 (tok13 = 28:18 Bethel's early rise: the
    morning after the ladder vs the morning after the switch). ma-zot
    asita li — the DECEIVED-ACCUSER FORMULA (3:13 to the woman, 12:18
    Pharaoh, 20:9 + 26:10 Avimelech) now in JACOB's mouth; asah walk toks
    92-97 CONSECUTIVE: 27:45 "what you DID to him" (the flee-reason) →
    28:15 "until I have DONE what I spoke" (God's pledge) → the feast →
    "what have you DONE to me" → "it is not DONE so" → "Jacob DID so."
    rimitani 7411 tok1/4 — THE DECEIVE-VERB DEBUTS in the deceiver's own
    mouth: the Torah's ONLY piel "deceive" (toks 2-4 are the qal "threw"
    of Exod 15:1,21 + Num 15:30's high hand). mirma's verb finally
    conjugates — 27:35's "your brother came BE-MIRMA" answered by "why
    have you RIMITANI."
    (12) 29:26 THE CUSTOM — chapter 27 inverted. lo yease khen
    bi-mqomenu: la-tet ha-TZEIRA lifne ha-BEKHIRA. tzeira 6810 tok6/8 —
    toks 1-4 = LOT'S DAUGHTERS ×4; tok5 = 25:23 THE ORACLE ("the elder
    shall serve the TZAIR") — the oracle's own younger-word, now refused
    by custom. bekhirah 1067 tok5/5 — CAREER CLOSES: toks 1-4 = Lot's
    firstborn daughter ×4; the feminine firstborn-word exists in the
    Torah only for Lot's daughters and Laban's law. Said to the man who
    went before HIS firstborn brother wearing his clothes.
    (13) 29:27 THE WEEK AND THE SERVICE-NOUN. male shevua zot — shevua
    7620 toks 1-2/9 DEBUT (the bridal week; the week-word's career runs
    to the Feast of Weeks); PUSH: LET(male_shevua(yaaqov)). avodah 5656
    tok1/83 DEBUT — THE SERVICE-NOUN IS BORN HERE ("ba-avoda asher
    taavod"): its 83-token career becomes Egypt's bondage and the
    tabernacle service — born naming marriage-labor.
    (14) 29:28 THE DOUBLE POP. male 4390 toks 10-11-12: malu yamay
    (29:21, my days are FULFILLED) → male! (29:27, the imperative) →
    va-yemale (29:28, compliance) — statement, demand, performance on one
    root; POP male_shevua, latency one verse. va-yiten et-RACHEL — the
    CONTRACTED wife delivered at last → POP hava_ishti
    (content-performance; the 29:23 delivery could not pop it, this one
    does — the contrast IS the derivation). give-verb 5414 toks 63-69:
    SEVEN in-span (Laban gives daughters, maids, and excuses; after
    gen_48's 60-62 grant-vow-tithe walk).
    (15) 29:29 Bilhah 1090 tok1/9 DEBUT; shifcha toks 13-14.
    (16) 29:30 END. va-yavo gam el-Rachel; va-yeehav — love tok10:
    "loved Rachel MORE THAN LEAH" (the preference-formula that will
    drive the womb arc); va-yaavod 5647 tok17 — od sheva shanim acherot:
    the serve-verb closes the unit as it opened it. UNIT END: SPECS
    depth 1 OPEN — LET(sheva_imadi(yaaqov)): the dwell-root (yashav)
    never returns in-span; Jacob's fourteen years answer it in life but
    never on the letter's surface. SETTLED 3 (hagida_maskoret ·
    hava_ishti · male_shevua). REGISTRY 0. TESTS 0.

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_50_2026-08-08.md; manifest verified
    11/11 checkable, zero FAILED, zero manual — the run's first
    all-checkable manifest). CROWNS (chain-attested + DB-verified).
    THE WAGE-VERB AGAINST TWO ANOMALIES [G50-01, Minchat Shai here
    and at 28:15]: אעבדך ("I will SERVE YOU seven years for Rachel,"
    29:18) — bet in plain qamatz (the long a), NOT the Chizkuni's
    compound pointing; the root's first letter standard, NOT the
    Jerusalem manuscript's reading Minchat Shai calls "a great
    anomaly"; exactly one pashta (the forward-leaning accent), on the
    final letter, none on the bet — the promise-verb twin banked at
    Bethel ("I will not leave you," 28:15) lands here: SNAPSHOT sides
    with Minchat Shai at both stations of his own cross-reference.
    THE TENDER EYES STAND AS WRITTEN [G50-03, Minchat Shai; Kitzur]:
    רכות ("and Leah's eyes were TENDER," 29:17) — the Torah's ONLY
    token of the word, written with no aleph: Ben Efraim's emendation
    (read it "long") refuted by the letter itself — "he lacked
    nothing but wisdom" — while the enduring-gifts derash
    (priesthood, Levites, kingship) rides the word as written; the
    soft-words pair is Writings-side, named. THE TWO VERSE-INITIAL
    EYES [G50-04, Kitzur]: ועיני ("and the eyes of...") opens a verse
    exactly TWICE in the Torah — Leah's tender eyes (29:17) and
    ISRAEL's age-heavy eyes (48:10): the woman who feared marrying
    Esau, and the man her eyes feared for, grown old, blessing her
    rival's grandsons; the third of the Kitzur's triple (the failing
    eyes of the wicked) is Writings-side, named. THE DEMAND AND ITS
    PURPOSE, BOTH MARKED [G50-05/06, Minchat Shai]: הבה ("GIVE my
    wife," 29:21 — the tower-imperative in one man's mouth)
    end-stressed as ruled; ואבואה ("that I may COME to her") — the
    form's ONE full-spelled token in the Torah ("full with vav, all
    the rest lean"): the demanded wedding carries the Torah's one
    full coming. POINTING AS RULED [G50-02/07/08/10, Minchat Shai]:
    הקטנה ("the YOUNGER") with the dageshed nun; זאת ("what is THIS
    you have done," 29:25 — the deceived-accuser formula in Jacob's
    mouth) with the hard zayin; the also-words of the double marriage
    (גם at 29:27 and twice at 29:30) dageshed and joined; וימלא ("and
    he FULFILLED her week," 29:28 — the root the machine popped) with
    the lamed in tzere (the long e). THE SECOND TO-HIM STANDS
    [G50-11, Minchat Shai]: 29:28 carries לו ("to him") TWICE — "and
    he gave TO HIM Rachel his daughter, TO HIM as wife": some books
    drop the second; the codices of Spain and the books of R. Meir
    and R. Gershom keep it, and SNAPSHOT keeps both — the letter says
    twice whose wife she is, on the verse that finally clears the
    give-my-wife card. INSTRUMENT GAP [G50-09]: אשר of the
    service-clause (29:27) — ruled "with galgal (the rare
    wheel-accent), not with maqqef": SNAPSHOT agrees on the testable
    half (no maqqef, an accent present) but stores munach (the common
    sustaining accent) where the ruling names galgal — the galgal
    layer remains uninstrumented, the standing run-4 gap now
    source-anchored at its first probed instance. READINGS
    (named-only, unclaimed): the linked eye-readings (Leah fearing
    Esau's lot; Israel's eyes heavy at Jeroboam and Ahab); the
    Talmud's real-tears-to-her-praise reading against the
    enduring-gifts reading; "the elder Leah, great in her gifts."
