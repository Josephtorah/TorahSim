    name_en: "Care-point ledger (distilled)"
    comment: >
      The crown: THE RETURNED WORD (33:11). "Take, please, MY
      BLESSING" — the verb and the noun of the 27:36 theft-cry ("he
      took my blessing") return with speaker and addressee EXCHANGED,
      and Esau takes: the stolen-blessing sentence performed with the
      roles reversed. The second crown: Jacob's FIRST altar (every
      prior altar is his fathers'), named by the full formula — and
      the registry receives the name ISRAEL for the first time
      OBLIQUELY, inside God's title on the altar, before any
      formula-write of the man's own name. Among twelve care-points:
      the weep-verb's four prior tokens are all SINGULAR — its first
      plural token has the man who wept alone at the blessing-theft
      weeping WITH the man who caused it; the bow-verb steps straight
      from the blessing's your-mother's-sons-will-bow decree to its
      inverse performance — Jacob bowing seven times to the brother —
      with nothing between; the neck-word's first three tokens are
      the disguise, the yoke, and the embrace; the grace-verb is born
      twice in one meeting and its career reaches the priestly
      blessing; the acceptance-verb of the sacrificial formulas is
      born in a brother accepting a brother, one chapter before the
      first altar; the Booths-festival's whole vocabulary springs
      from cattle-shelters at a road-fork (the naming there an
      etiology report — no write); the buy-verb holds the Torah's
      two patriarch land-purchases as adjacent career tokens; the
      smooth/portion homograph — the word that dressed the lie buys
      the first homestead; and the span carries zero YHWH-tokens —
      all its God-talk is grace-grammar until the altar speaks.
    confidence: reconstructed
  - step: E
    name_en: "Machine design"
    comment: >
      Four pushes, ONE POP, three open — after fourteen unpopped
      cards across the two prior units, the run's first RESULT fires,
      and the demand that clears is TAKE-BACK-THE-BLESSING: the
      demand's own root returns as a foreground deed by the demandee
      in the SAME VERSE — demand and receipt consecutive career
      tokens, latency zero. Still open, all three the brothers'
      courtesies: Esau's keep-what-is-yours jussive, UNDONE BY ITS
      OWN DEMANDER two verses later when he takes the very gift he
