    work_en: "Onkelos Genesis 11:10-32 — read Tier-A at derive time (23 sequential fetches, Data/FETCHLOG.md 2026-08-03)"
    he: וּדְבַר תֶּרַח … וּנְפָקוּ עִמְּהוֹן
    he_translit: "u-devar terach … u-nefaku imhon"
    en: >
      The span's translation witness — headline: THE BUFFER PRESERVES
      THE LETTER'S ANOMALIES AND SPLITS ITS ONE REPEATED VERB. The
      take-verb the letter uses twice (va-yiqach, 11:29 and 11:31)
      forks in Aramaic: u-nesiv ('and he took') for the WIVES, u-devar
      ('and he LED/conducted') for the FAMILY on the road — the
      translation reads person-taking as leading exactly where the
      journey begins [find-class; dual-track]. Preserved wobbles: the
      fronted perfects of 11:12/11:14 (ve-arpakhshad chaya, ve-shelach
      chaya — the two-row anomaly survives word order); the itam crux
      (u-nefaku IMHON, 'and they went out WITH THEM' — unresolved);
      11:32's kol-less total (va-havo yomei terach — no 'all' in the
      Aramaic either); the doubled absence at 11:30 with the hapax kept
      as COGNATE (leit lah VELAD — the child-word survives translation
      as itself). ha-mabul ('the deluge') exits as tufana (the Aramaic
      flood-word) in the same verse-final seat. 11:28's father-idiom
      kept literal (al apei, 'upon the face of' — the buffer does NOT
      insert 'in the lifetime of'; the chain's gloss war stays outside
      the translation). Ur becomes Ura de-Khasdaei; moledet
      ('birthplace') becomes yaladuteih ('his birth'). The template
      stretch renders mechanically — begettings as oléd, the rows'
      rhythm intact; the plainest Aramaic since Gen 5, broken exactly
      where the Hebrew breaks.
    comment_en: "Read from Data/sefaria_texts/ (local; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

  - id: ORAL_reading_pass_2026_08_25
    status: verified
    work_en: "RE-era reading pass 2026-08-25 (parashat Noach sweep, block 11 of 11; ledger logic/oral_triage/gen_26_shem_ledger_2026-08-25.md)"
    he: נקרא כולו
    he_translit: "nikra kulo (read in full)"
    en: >
      The v1 queue above is DISCHARGED: the declared core shelf was read
      end to end this sitting. HEADLINES: the HARAN-AT-SIX arithmetic on
      our 11:29 (one year, one year, two pregnancies) carried into LIVE
      LAW — the paternity-age sugya cites it as precedent (Achaz at
      nine, Haran at six, Caleb at ten; joining the carried Shem-100
      arithmetic and Yefet-the-elder proof from our 11:10); the EIN-LA
      particle rule (every "she had none" eventually HAD — Sarah,
      Hannah, Zion) beside the AYLONIT ink-parse of 11:30's superfluous
      clause ("not even a place for a child") and the LO/VELA
      barrenness-scope dispute; the AL-PENEI verbal-analogy dispute in
      priestly-service law with OUR 11:28 as the in-his-lifetime pole
      (against Genesis 23:3's at-his-death) — the idol shop, the
      ladder-debate, and Haran's hedge at the furnace explaining the
      same ink; the DELIBERATE VERSE-ORDERING claim on 11:32 (Terach's
      death recorded sixty-five years early to spare Abraham the
      desecration, with the honoring-parents exemption); TERACH'S SHARE
      held under the doubled-name rule ("you shall go to your fathers in
      peace"); YISKA IS SARAH (the seven-prophetesses census on our
      11:29); the TEN-GENERATIONS Mishnah (Pirkei Avot 5:2) counting
      our ledger's very structure ("until Abraham came and received the
      reward of them all"); Ur = Khuta (the imprisonment dossier).
      Findings in the ledger; dual-track throughout; no reading merged
      into the machine.
    comment_en: "Reading-pass record; the stamp and ritual remain the owner's word (batch, per parashah)."
    source: "[ORAL][READ-THROUGH]"

