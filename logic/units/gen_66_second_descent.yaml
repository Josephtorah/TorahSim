    each for its own house), והצעיר ("and the youngest", 43:33 —
    Isaiah's mighty-younger named): four once-forms at one table.
    THE PORTION FILE [G66-11, MS on 43:34; the Hilleli]: ממשאת
    ("than the portions of") LEAN with the Hilleli, the old print,
    and every precise copy against an erring printer — the
    Masorah's four-token portion-file: this verse's two lean, its
