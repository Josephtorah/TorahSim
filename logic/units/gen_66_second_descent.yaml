    the gift crosses Joseph's threshold. THE CLIPPED BOW [G66-02,
    MS on 43:28]: ויקדו וישתחו — the span's own ketiv/qere lands on
    the BOW-WORD: written clipped (וישתחו), read whole (וישתחוו) —
    and SNAPSHOT carries the pair as two tokens, the bare written
    form beside the pointed read form: the verse's word-count wears
    the doubling (checked). THE RETURN-VERB'S CHAPTER [G66-03, MS
    on 43:2; the Ramah]: שבו ("return") LEAN at the bare demand
    (43:2; its twin 44:25) — and the SAME chapter writes שובו FULL
    at the release (43:13): the Ramah's three-full file (with the
    gate-run Exod 32:27 and the tents Deut 5:30) verified in the
    skeleton census (the noun 'his return', Gen 14:17, collides
    and is framed): lean empty-handed, full with the brother. THE
    ONE ALEF-LULEI [G66-04, MS on 43:10; the Kitzur]: לולא ("had
    we not") — the Torah writes the word with a final yod
    everywhere (31:42; Deut 32:27) EXCEPT this once with a final
    ALEF (census exact) — and the Kitzur reads the seam of the
    same verse: the last letters of כי עתה שבנו זה ("for by now we
    could have returned") spell the four-letter Name in order
    (builder-asserted): the Name goes down with the caravan. THE
    TWO DESCENTS [G66-05, Kitzur on 43:4; the Masorah]: נרדה ("let
    us go down / we will go down") — exactly TWICE in the Torah:
    Babel's divine plural (11:7) and the brothers' condition
    (43:4); the Masorah's third is Saul's night-pursuit (1 Sam
    14:36, named): a descent that scatters, a descent that buys
    bread. THE ASKING, THE KING, AND THE GRAVE [G66-06, MS on
    43:7; the Ramah; the Hilleli]: שאול ("asking") FULL — and the
    full skeleton's four Torah tokens are the doubled asking
    (43:7), the Edomite king Shaul (36:37-38), and SHEOL itself
    (Deut 32:22): to ask, a king, and the grave in one spelling;
    the Samuel pair named. THE ONE KNOWING [G66-07, MS on 43:7;
    the Hilleli]: הידוע ("could we know") — its one Torah token,
    FULL with the Hilleli and the precise books against divided
    Masorah-notes. THE DOUBLE-YOD FEAR [G66-08, MS on 43:18;
    Rashi]: וייראו ("and they feared") with BOTH yods — the
    Hilleli alone clips one; Rashi's own note ('written with two
    yods') and the Masorah's all-Torah-full rule stand with the
    stream. THE TWO RETURNED-WORDS [G66-09, MS on 43:18]: הכסף
    השב ("the silver that was returned") — the clipped participle;
    erring copies harmonize it to 43:12's המושב: the letter keeps
    the father's word and the sons' word apart one chapter wide
    (both tokens in-stream). THE FEAST'S ONCE-WORDS [G66-10, the
    Kitzur ×4]: ומשנה ("and double", 43:15), יחנך ("be gracious
    to you", 43:29 — checked; the priestly ויחנך ('and be gracious to you'), Num 6:25,
    collision framed), ויתאפק ("and he restrained himself", 43:31
