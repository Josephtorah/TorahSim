  - step: E
    name_en: "Logic format choice"
    comment: >
      Operator lines; NO ledger row. The counsel (4:7) is the
      unit's hinge and gets the full law kit, hand-authored per
      Pre-Code: TWO HANDLERs (IF(teitiv) THEN(se'et);
