derivation_log:
  - step: A
    name_en: "Block choice"
    comment: >
      The Cain cycle proper (4:1-16): from the first birth to the
      settlement in Nod — 4:17 opens the genealogy (Cain's line,
      the city, Lamech), the next block. Inside: two births (one
      name explained by the mother — the corpus's first birth-
      etymology; one left as vapor, unexplained), two professions,
      two offerings, one favor and one silence, the anger
      diagnostic, the two-branch counsel with the corpus's first
      IF, the empty quote, the field, the murder, the
      interrogation, the lie, the ground's mouth, the third curse,
      the plea, the sevenfold decree, the mark, and the exit east.
      The unit ends where Eden's geography points: kidmat-Eden.
    confidence: established
  - step: B
    name_en: "Hebrew source + trees"
    comment: >
      All 16 verses from DB tree_json (rule set v3, unique, pure
      binary; ascii rendered 2026-08-01). Tree facts: 4:1 [the
      knowing and the birth | the mother's speech: acquired-with-
      YHWH]; 4:4-5 mirror at the rests — [Abel's offering | the
      GAZE] / [to Cain and his offering NO gaze | the anger and
      the fallen face]; 4:7 [the two-branch counsel: if-well
      UPLIFT, if-not-well at-the-door sin crouches | the 3:16
      pair: its longing to you — and YOU shall rule]; 4:8 [the
      empty quote + the field | rose and killed]; 4:9 [where is
      Abel your brother | not-known + the keeper question]; 4:11
      [cursed are YOU from the ground | the mouth that took the
      bloods]; 4:15 [the sevenfold decree | the mark set,
      not-to-strike]; 4:16 [out from before YHWH | settled in
      Wandering, east of Eden].
    confidence: tested
    tags: ["[HE-STRUCT]"]
  - step: C
    name_en: "Segment structure"
    comment: >
      Verb morphology (#IMPOSED OSHB, DB-verified 2026-08-01): 4:1
      yada perfect — the KNOWLEDGE verb's carnal debut (the tree's
      verb domesticated); qaniti — the corpus's first
      birth-etymology, in the MOTHER's mouth, carrying solo-YHWH's
      first token (et here = 'with', lemma 854): the first human
      to say the name is Chavah. 4:2 Hevel unexplained ('vapor' —
      the name is a noun the text never glosses [OPEN]); the
      professions chiastic (shepherd / ground-worker — 3:23's job
      inherited). 4:3-5 the offering scene: minchah x3 (first
      tokens — Lev 2's term), bekhorot + chelev (the firstborn
      and fat institutions in embryo), sha'ah x2 (gaze/regard — 3
      corpus tokens total) — favor and its absence, NO stated
      reason [OPEN]; charah (anger) debuts and is immediately
      interrogated (4:5, 4:6 — its first two tokens). 4:7 THE
      COUNSEL: ha-lo im ... ve-im lo — the corpus's FIRST
      conditional particle, twice; se'et (the nasa root as
      UPLIFT; lev_13's lead mark-name — the A-join's source);
      la-petach CHATTAT rovetz — sin's first token, crouching
      (participle) at a door; then the 3:16 pair VERBATIM
      (teshukato / timshol-bo) — the woman's sentence grammar
      re-aimed at sin, closing on a coded imperfect (TIR-028).
      4:8 the EMPTY QUOTE (va-yomer with no content — the corpus's
      first silent speech report [OPEN]); ba-sadeh; va-yahargehu —
      harag's first token: the corpus's first actual death,
      man-made. 4:9-10 the docket: ei (ayeka's formula, token 2);
      lo yadati (the first LIE — the know-verb again);
      ha-SHOMER achi anokhi (the office word interrogative); meh
      asita (3:13 verbatim); qol demei — the qol thread; demei
      PLURAL [OPEN]; tza'ak debut (the outcry verb). 4:11-12 the
      third curse: arur atah MIN-ha-adamah (the first human
      cursed; the ground given a MOUTH — patztah et-piha,
      la-qachat the bloods); the ground strike (lo-tosef
      tet-kochah — Cain's medium refuses him beyond 3:17); na
      va-nad (two participles — the wanderer state). 4:13-14 the
      plea: avon debut + mi-neso (the nasa root returns — the
      se'et offered at 4:7 becomes the burden unbearable);
      gerashta (garash token 2, first person — 3:24 answered);
      esater (hide — the face thread); the finder-fear [OPEN: who
      exists?]. 4:15 the protection: LAKHEN + kol-horeg Kayin
      SHIVATAYIM yukam (the week's number as vengeance
      arithmetic; nakam debut, hophal) — an IF/THEN in divine
      speech; va-yasem OT (day 4's sign-word turned personal —
      tokens 2-3 are the RAINBOW, 9:12,17); le-vilti hakot (the
      3:11 not-to form; nakah debut). 4:16 va-yetze mi-lifnei
      YHWH; be-eretz NOD — 'Wandering': his sentence fossilized
      as a place-name — kidmat-EDEN.
    confidence: tested
    tags: ["[HE-STRUCT]","#IMPOSED-OSHB"]
  - step: D
    name_en: "Predicates & outcomes"
    comment: >
      The cycle re-runs Eden one ring out: a test (favor on the
      offering — the instrument now sha'ah, not tov; the rejection
      unexplained), a warning WITH a rulebook (the first IF-pair:
      well -> uplift; not-well -> sin at the door — and the door's
