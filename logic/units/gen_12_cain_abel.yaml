      murderers, a sign for penitents).
    comment_en: "Ops unchanged; the sevenfold and the mark now carry the chain's full recorded position set with the middah-limit on the books."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_east_refuge_axis
