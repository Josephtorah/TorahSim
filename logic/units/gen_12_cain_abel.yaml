    comment_en: "Ops unchanged; the curse op carries the downstream reader as a typed anchor, the day-one pattern."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_first_birth_and_quota
    status: verified
    work_en: "Bereshit Rabbah 22:2-4 (the first-birth dossier; the fifty days); Yevamot 62a:7 (the procreation quota); Sanhedrin 58b:7-10 (the sister at its legal seat); Bereshit Rabbah 22:5 + Vayikra Rabbah 27:5 (the favor test's two grounds); Sifra, Shemini, Mekhilta DeMiluim II 31 (the years of Hevel)"
    he: קָנִיתִי אִישׁ אֶת־יְהוָה
    he_translit: "kaniti ish et-Adonai"
    en: >
      The opening ops' dossier: the word-order diyyuk (ve-ha-adam
      yada — Adam first, the teacher of all); the twins doctrine (two
      went up, seven came down; "gave birth again but did not conceive
      again"); the et of kaniti DISCUSSED and DECLINED as a derivation
      (R. Yishmael to R. Akiva, the Nachum of Gam Zo method — the
      inclusion middah weighed on our token and set aside); Abel's
      lifespan MEASURED at no more than fifty days, computed both ways
      through the standing Tishrei/Nisan creation machloket. The
      quota law: R. Natan per Beit Shammai derives FOUR children from
      our 4:2's double et joined to 4:25 (the Rabbis: thanksgiving, no
      quota) — the et-inclusion firing with dissent, joining gen_06's
      procreation measure at its our-span seat. The sister the quarrel
      presupposes stands at her legal seat: Adam did not marry his
      daughter SO CAIN COULD MARRY HIS SISTER — "the world shall be
      built on chesed" — the Noachide incest frame's permitted-then-
      forbidden structure. And the favor test carries TWO recorded
      grounds, never merged: offering quality (refuse against
      firstborn-and-fats, with the pre-Sinai offering-class machloket
      dual-tracked) and PERSECUTED STATUS ("God seeks the persecuted —
      Abel was persecuted by Cain and the Holy One chose Abel"), with
      Abel's era read into Malachi's "former years" — the time before
      idolatry, the canon of the acceptable offering.
    comment_en: "Ops unchanged; the birth, offering, and favor ops each carry their chain dossiers, disputes as data throughout."
    source: "[ORAL][PRIMARY-READ]"

