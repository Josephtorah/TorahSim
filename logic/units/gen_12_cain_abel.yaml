      meeting Cain — "such is the power of repentance, and I did not
      know" — and Psalm 92 attributed to Adam on that meeting.
    comment_en: "Ops unchanged; the sentence op, the settlement op, and the gadol-avoni token now carry the chain's recorded machinery."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_sevenfold_suspension
    status: verified
    work_en: "Bereshit Rabbah 23:4 (Lemekh's a-fortiori and Rabbi's objection); Bereshit Rabbah 32:5 (the Genesis 7:23 yekum position); Bereshit Rabbah 22:12 (who demanded justice; the no-precedent principle; the sign machloket)"
