      you done), the evidence (the bloods cry FROM the ground —
      the witness is the crime scene), the sentence (the curse's
      third token, first human; the ground-worker unlanded), the
      plea and the mitigation (the sevenfold handler; the mark —
      protection stamped on the punished), and the exit east. The
      offering institutions (minchah, firstlings, fat) and the sin
      word debut here and run straight into the law's altar.
