    comment_en: "Ops unchanged; the empty-quote flag now cites the chain's three-way fill."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_teshuvah_half_decree
    status: verified
    work_en: "Sanhedrin 37b:12 (exile atones half); Vayikra Rabbah 10:5 (teshuvah accomplishes half; Pesikta DeRav Kahana 24:11 the PDK seat); Sanhedrin 101b:3 (the demand track); Bereshit Rabbah 22:11 (complaint and confession); Bereshit Rabbah 22:13 (vayetze; the Adam encounter; Psalm 92)"
    he: נָע וָנָד — וַיֵּשֶׁב בְּאֶרֶץ נוֹד
    he_translit: "na va-nad — vayeshev be-eretz Nod"
    en: >
      The unit's own operator pair IS the chain's prooftext: sentenced
      "na va-nad" (fugitive AND wanderer) but settled "in the land of
      NOD" — one half of the sentence gone from the ink. TWO recorded
      mechanisms ride the same delta, dual-tracked and never merged:
      EXILE ATONES HALF A SIN (Rav Yehuda son of R. Chiyya), and
      TESHUVAH ACCOMPLISHES HALF (R. Yehuda, against R. Yehoshua ben
      Levi's teshuvah-whole). The trigger token gadol avoni runs
      THREE tracks — complaint (You bear worlds, not my sin?),
      confession (greater than Father's — an a-fortiori), and demand
      (greater than the 600,000's calf You will forgive? — Cain first
      of the three who came with a demand). And the exit op carries the
