oral_notes:
  - id: ORAL_cain_queue
    status: observation
    work_en: "Bereshit Rabbah 22 (the cycle; 22:16 the empty-quote dispute); Mishnah Sanhedrin 4:5 (the bloods-plural worlds-doctrine — the diyyuk tripwire); Bavli Sanhedrin 37b; Pirkei DeRabbi Eliezer 21; Midrash Tanchuma Bereshit 9 (the offerings); Bavli Shabbat 105b (the anger dossier) — gen_12 Tier-A queue"
    he: דְּמֵי אָחִיךָ
    he_translit: "(queue — named only)"
    en: >
      Named, not read: the cache holds ZERO sources anchored to Gen
      4 — sixth tripwire span; the Mishnah's derivation of the
      worlds-doctrine from one PLURAL is a form-based device — the
      detector's diyyuk-class formulas should fire on it when
      cached (and its doctrine already surfaces inside Onkelos
      4:10, read Tier-A).
    comment_en: "Queue entry — no claim made beyond the naming. DISCHARGED 2026-08-25 (rev 2): read at the primaries in the canon window (ledger logic/oral_triage/gen_12_cain_abel_2026-08-25.md); the Mishnah Sanhedrin 4:5 tripwire fired as predicted — its derivation and reasons read at the Mishnah, Bavli, and Jerusalem Talmud seats. The Vilna citation 22:16 seats at the shelf's numbering 22:7. Pirkei DeRabbi Eliezer, Tanchuma, and Shabbat 105b stand outside the declared scope (corroboration tier — depth passes on owner order). Findings in the ORAL_* blocks below."
    source: "[ORAL][NAMED-ONLY]"
  - id: ORAL_onkelos_tier_a
    status: verified
    work_en: "Onkelos Genesis 4:1-16 — read Tier-A at derive time (16 sequential fetches, Data/FETCHLOG.md 2026-08-01)"
    he: אִם תְּתוּב יִשְׁתְּבֵק לָךְ
    he_translit: "im tetuv yishtevek lakh"
    en: >
      The span's translation witness — the largest expansion in our
      derived spans: 4:7 rebuilt as a theology of repentance
      (deeds; FORGIVEN; sin KEPT for the day of judgment; exacted
      IF you do not repent; forgiven if you do — se'et resolved as
      forgiveness, the crouching beast replaced, teshuvah twice,
      the longing-clause absorbed); 4:13 'too great to be
      FORGIVEN' (the same shevak verb — forgiveness brackets the
      Aramaic story as nasa brackets the Hebrew one); 4:10 the
      bloods as DESCENDANTS; 4:14 'NOT POSSIBLE to hide' (the
      speaker corrected); 4:15 seven GENERATIONS; 4:16 Nod
      dissolved into 'exiled and wandering'; minchah -> korban
      vocabulary; sha'ah -> FAVOR before the LORD; ha-shomer ->
      ha-NATER (3:15's keep-verb).
    comment_en: "Read from Data/sefaria_texts/ (local, gitignored; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

  - id: ORAL_capital_witness_law
    status: verified
    work_en: "Mishnah Sanhedrin 4:5 (the ruling); Sanhedrin 37a:11-12 (the reason and the demei derivation); Sanhedrin 37b:10 (multiple wounds, the neck); Jerusalem Talmud Sanhedrin 4:9:1 (the JT recension); Bereshit Rabbah 22:9 (the BR seat of the plural)"
    he: דְּמֵי אָחִיךָ — דָּמוֹ וְדַם זַרְעִיּוֹתָיו
    he_translit: "demei achikha — damo ve-dam zar'iyotav"
    en: >
      The v1 queue's predicted tripwire, fired: the capital court's
      witness-admonition procedure is GROUNDED on our 4:10 — "demei
      akhikha," the PLURAL bloods — his blood and the blood of his
      offspring, ascribed until eternity; the recorded alternative
      (blood splattered on the trees and the stones) is carried beside
      it. The Bavli adds the forensics: multiple wounds, "he did not
      know from where the soul departs, until he came to his neck" —
      the neck-and-signs claim Bereshit Rabbah 22:8 hangs on the
      father's bull. A standing law of the tradition's court procedure
      hangs its full weight on this unit's own ink.
    comment_en: "Ops unchanged; the DEMEI token's plural was already flagged at derive time — the chain's use of it is now on the record at four seats."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_seet_parse_fork
    status: verified
    work_en: "Mekhilta DeRabbi Yishmael, Tractate Amalek 1:22 (Isi ben Yehudah's five-verses list, tannaitic seat); Yoma 52b:1 (the Bavli seat); Bereshit Rabbah 80:6 (the four-verses form); Jerusalem Talmud Avodah Zarah 2:7:9 (the JT witness)"
    he: שְׂאֵת — אֵין לוֹ הֶכְרֵעַ
    he_translit: "se'et — ein lo hekhrea"
    en: >
      The chain RECORDS that our 4:7's se'et has no resolution — it
      heads Isi ben Yehudah's list of the Torah's undecidable parses
      (forgiveness-reading against remembrance-reading, both spelled at
      the tannaitic seat). This is a tree-layer claim on the span's own
      token: the verse's syntax is recorded by the tradition itself as
      a standing fork. And the unit's v1 Onkelos block already
      witnesses the received translation TAKING THE FORGIVENESS SIDE
      (im tetuv yishtevek lakh) — the fork and its one-sided resolver
      both stand on the record, dual-tracked, never merged. The machine
      may never resolve what the chain records as unresolvable.
    comment_en: "Ops unchanged; the 4:7 counsel op's se'et token carries the recorded irresolution beside Onkelos's resolution."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_counsel_op_laws
    status: verified
    work_en: "Sifrei Devarim 45:1 (the antidote braita, tannaitic seat); Kiddushin 30b:4-5 (its Bavli carrier); Kiddushin 61b:9 (the compound condition); Sanhedrin 91b:7 (yetzer timing; Niddah 30b:23 corroborates); Bereshit Rabbah 20:7 (the four desires); Bereshit Rabbah 22:6 (se'et blessing/curse; the rovetz ink-grammar)"
    he: לַפֶּתַח חַטָּאת רֹבֵץ
    he_translit: "la-petach chattat rovetz"
    en: >
      The 4:7 counsel op is a law factory in the chain's hands, and
      every derivation rides a specific token: the TORAH-ANTIDOTE
      schema deploys all four clauses (do-well/lifted; crouches;
      desire; rule — the king's dressing on the wounded son); R. Meir's
      COMPOUND-CONDITION law (tenai kaful) takes the double
      if-formulation as its paradigm, with R. Chanina ben Gamliel's
      dissent answered on our verse; the yetzer's TIMING is resolved on
      la-petach — "at the entrance" = from birth, the support Rabbi
      credited to Antoninos; the four-desires register types our
      teshukato beside the woman's (3:16), the rain's, and the Holy
      One's; and the BR seat reads the ink's own grammar — chatat
      rovetzET is not written, but ROVETZ, the masculine on the
      feminine noun, flagged by the chain itself.
    comment_en: "Ops unchanged; the coded-imperfect LET? and its clauses now carry the chain's four derivations, each cited to its seat."
    source: "[ORAL][PRIMARY-READ]"

  - id: ORAL_empty_quote_three_ways
    status: verified
    work_en: "Bereshit Rabbah 22:7 (Vilna numbering 22:16 — the v1 queue's citation, seated at the shelf's 22:7)"
    he: וַיֹּאמֶר קַיִן — וְלֹא נֶאֱמַר מָה
    he_translit: "vayomer Kayin — ve-lo ne'emar mah"
