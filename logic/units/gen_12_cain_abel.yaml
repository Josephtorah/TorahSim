    he_translit: "shivatayim yukkam-Kayin"
    en: >
      The sevenfold op read as SUSPENSION WITH A COLLECTION DATE:
      Lemekh argues a-fortiori from it (seven generations for a
      murderer — seventy-seven for me), and Rabbi's objection stands
      recorded — "a flawed a-fortiori: from whom would He ever collect
      His promissory note?" — a middah-limit exhibit on the span's own
      tokens. One recorded position reads the collection into Genesis
      7:23 — "He obliterated all yekum," Cain suspended until the Flood
