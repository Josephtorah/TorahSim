      the non-regard held as fact, NOT a FAIL: the letter gives no
      verdict token and no reason. LEDGER: EMPTY. FLAGS:
      read_before_install x3 (adam, chavah, adamah),
      named_before_any_presence x1 and assigned_before_any_presence
      x1 (both KAYIN — the newborn is named at birth and cursed at
