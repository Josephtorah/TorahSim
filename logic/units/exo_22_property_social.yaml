          round-14 Talmud-first block adds the Sanhedrin 72 machinery to
          the Mekhilta reading this seat already holds. THE HOSTILITY
          DEFAULT SET BY KINSHIP: the two sun-baraitot resolve at the
          FATHER — a father breaking into his son's house is presumed
          merciful, kill only on certainty; anyone else, doubt kills
          (72b:1). THE LICENSE IS A STATE, NOT A STATUS: both clauses
          run on Shabbat, and if the wall fell ON the burglar on
          Shabbat, CLEAR THE PILE — the rescue duty survives the
          kill-license (Rav Sheshet, 72b:5). THE PURSUER STATUS: 'and
          is smitten' — by ANY person, for the burglar is a pursuer and
          anyone saves the householder; 'and dies' — by any death,
          needed because the murderer and the blood-redeemer are
          two-verses-that-come-as-one and teach no principle — the
          meta-rule named (72b:6-10). THE LOCATION EXTENSION: 'found' —
          roof, courtyard, enclosure too; and the second baraita's
          seal: HIS BREAKING IN IS HIS FOREWARNING — elsewhere a
          warning is owed (72b:11-12) — the forewarning machinery
          (EX21-23, the same sitting) meeting the burglar clause.
          Finding F-052, auto-seated per the standing law.
