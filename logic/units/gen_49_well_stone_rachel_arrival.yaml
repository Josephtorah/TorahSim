  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_49_2026-08-08.md; manifest verified
    13/13 checkable, zero FAILED, one builder-asserted manual row).
    CROWNS (chain-attested + DB-verified). SHE IS COMING / SHE CAME
    [G49-05/06, Minchat Shai]: באה at the announcement ("Rachel his
    daughter IS COMING," 29:6) END-stressed — the accent on the final
    syllable marks the participle, arrival in motion; the same three
    letters at the arrival ("and Rachel CAME," 29:9) PENULT-stressed —
    the resting dot on the first syllable marks the perfect, arrival
    done: the tense of Rachel's entrance is carried by stress alone,
    proven by the accents' own positions. THE ONE FULL BRING-HIM AND
    ITS LEAN TWIN [G49-08/09, Minchat Shai]: ויביאהו ("and he BROUGHT
    HIM to his house," 29:13) — the form's ONLY plene (full-spelled)
    token in the Torah, as ruled ("full with yod, and all the rest
    lean"); the family's one other token is the LEAN יבאהו of Exod
    22:12 — the shepherd bringing the TORN CARCASS as evidence: the
    guest brought home written full, the carcass brought to court
    written lean — and the torn-animal noun itself debuts in Jacob's
    shepherd-audit to this same Laban (31:39, the pursuit unit). THE
    READERS AT THE WELL [G49-10/11, Kitzur Baal HaTurim]: פי הבאר
    ("the MOUTH of the well") stands exactly FIVE times in the whole
    Torah — all five in this scene — the five festival Torah-readers;
    מעל פי ("FROM UPON the mouth") exactly THREE — the three weekday
    readers: both censuses whole-Torah exact. THE TWO STONES ARE THE
    TWO TABLETS [G49-12, Kitzur]: והאבן ("and the STONE") exactly
    TWICE in the whole Torah — the vow's pillow-stone at Bethel
    (28:22, "this stone... shall be God's house") and the great stone
    on the well's mouth (29:2): the letter pairs the house-of-God
    stone with the stone rolled for Rachel. THE ROLL AND THE
    UNCOVERING [G49-13, Kitzur]: the skeleton ויגל stands exactly
    twice in the Torah — Jacob ROLLING the stone (29:10) and Balaam's
    eyes UNCOVERED (Num 22:31): roll and reveal on one written form;
    the Kitzur's own pair is the Psalm's "my glory REJOICED" (named).
    POINTING AS RULED [G49-01/02, Minchat Shai]: בני ("the sons of"
    the east, 29:1) — bet soft, no meteg, joined by the maqqef (the joining stroke) so the pair
    counts as ONE WORD (the Michlol's rule verbatim on the token);
    והנה ("and behold," 29:2) with the dageshed nun. DISCREPANCIES —
    THE CLASS JUMPS CONSONANTS [G49-03/04]: וגללו ("and they ROLL the
    stone," 29:3 AND 29:8) — ruled lamed with plain sheva (the bare
    half-vowel) "as our custom" both times; SNAPSHOT points hataf
    patach (the compound half-vowel) both times: the ruled-vs-pointed
    class, censused as resh-stations (one tzadi) through Gen 27,
    takes its first LAMED members — the split is consonant-general,
    ten ruled stations plus one split-attested, the one probed
    guttural (26:22) still bare. THE HEARING'S SOFT KAF [G49-07]:
    כשמע ("when Laban HEARD," 29:13) — the precise codices dagesh the
    kaf per Minchat Shai; SNAPSHOT reads it soft (dagesh-after-vowel
    class; his cross-references named). INSTRUMENT GAP [G49-14,
    manual]: the well-word exactly SEVEN times in the scene (29:2-10,
    builder-asserted span count) = the seven water-libation days and
    the seven Shabbat readers — span-bound counts have no manifest
    check type. READINGS (named-only, unclaimed): the mother's
    well-omen; the wilderness well; the three flocks as Aaron, Moses,
    and Miriam; the embrace that frisked for coins and the kiss that
    checked for pearls; "they said peace" but not peace-TO-HIM; the
    shepherdess read on the exiles; the holy spirit at the roll.
