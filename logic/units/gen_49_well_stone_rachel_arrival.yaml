    va-yagel 1556 tok3 — he rolls it ALONE. va-yashq 8248 tok19 — the
    demanded watering done by the DEMANDER: performer ≠ demandee → NO
    POP (mismatch family, third variation). Depth stays 1.
    (11) 29:11 KISS, VOICE, WEEPING. va-yishaq 5401 tok3 — THE KISS
    CAREER: toks 1-2 = 27:26 "kiss me" + 27:27 the deception kiss; toks
    3-4 = Jacob kisses Rachel, Laban kisses Jacob — deception → love →
