    (9) 29:9 STILL-SPEAKING ARRIVAL. odenu medaber (od 5750 toks 18-19
    both in-span) — the while-still-speaking arrival class of 24:15
    (Rivqah at the well); ve-Rachel baa … ki ROA hiv (7462 tok3) — the
    FIRST NAMED SHEPHERDESS, introduced with Abel's verb.
    (10) 29:10 THE DEMANDER PERFORMS. Triple "achi imo" — Laban named
    "his MOTHER'S brother" ×3 in one verse (ach 251 toks 55-56-57; em
