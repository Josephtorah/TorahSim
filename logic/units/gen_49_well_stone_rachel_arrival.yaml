    fourth weeper: Hagar (21:16), Abraham (23:2), Esau (27:38), Jacob.
    (12) 29:12 THE TELL-CHAIN. va-yaged 5046 tok13 / va-taged tok14 —
    tell toks 12-13-14: the 27:42 LEAK to Rivqah → Jacob tells Rivqah's
    niece → she RUNS and tells her father. va-taratz 7323 tok7 — the
    run-career: toks 5-6 = 24:28 Rivqah runs-and-tells + 24:29 LABAN
    runs; the niece repeats the aunt's run-and-tell a generation later.
    ben Rivqah (7259 tok28/30) — his credential is the mother.
    (13) 29:13 LABAN'S SECOND RUN. khi-shemoa 8085 tok33 — hear toks
    32→33 CONSECUTIVE: 28:7 Jacob heeds his parents → Laban hears the
    REPORT (shema NOUN 8088 tok1/4 DEBUT) of Jacob; va-yaratz 7323 tok8
    — Laban's only two run-tokens (6, 8) are BOTH at well-meetings, a
    generation apart; li-qerato 7125 tok7 (meet toks 5-6 = 24:17,
