    DRAFT 2026-08-07 · SOLO ERA unit #2 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    29:1–14, the well-arrival boundary (29:15 opens Laban's wage question).
    14 verses · 204 tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C.
    Conventions: step he: = plain (no accents/meteg; maqqef ־ per snapshot);
    tree halves = accents kept, morpheme slashes stripped; split at etnachta.
    Onkelos BUFFER PENDING. Instruments asleep (tov/shaah/tzaddik/nichoach
    0 hits in span).

    UNIT SHAPE: exactly THREE volitives, all in one verse — 29:7, Jacob's
    imperatives to the shepherds (hashqu "water!" hiphil + u-lekhu "and go!"
    + reu "pasture!") = ONE compound LET pushed on the shepherds. They
    REFUSE with grounds in 29:8 (lo nukhal "we cannot" — the stone
    protocol); refusal never pops. Then in 29:10 the DEMANDER performs his
    own demanded content (va-yashq, same watering root) — performer is not
    a demandee → NO pop. THIRD VARIATION of the mismatch family: gen_46 the
    wrong brother performs, gen_47 the never-demandee mirrors, gen_49 the
    demander self-performs. Unit ends SPECS depth 1 OPEN. REGISTRY 0 (no
    naming formula anywhere). TESTS 0.

    CARE-POINTS (filed before derivation; every ordinal DB-verified):
    (1) 29:1 THE LIFTED FEET. va-yisa 5375 tok18 raglav (unique feet-idiom);
    qedem 6924 toks 11→12 CONSECUTIVE — 28:14 va-qedmah ("eastward," the
    promise's spread) → 29:1 artzah vene-qedem (he walks east); va-yelekh
    3212 tok58.
    (2) 29:2 THE TABLEAU. veer 875 tok17 (well toks 10-16 = the gen_45
    Gerar well cluster 26:18-32); edre 5739 tok1/10 DEBUT (flock-herds —
    toks 1-4 ALL in-span); rovtzim 7257 tok2/10 — THE CROUCH-VERB: tok1 =
    4:7, SIN CROUCHING AT THE DOOR; its second Torah token is flocks
    crouching at the well; ha-even 68 tok6 gedola (stone toks 6-10 FIVE
    in-span, continuing gen_48's pillow→pillar→house toks 3-5); gedola
    1419 tok23 (toks 22-23-24: 27:42 the elder brother → the GREAT stone
    → 29:7 the day is GREAT); yashqu 8248 tok15 (see care 7); pi ha-beer
    ×2.
    (3) 29:3 THE STONE PROTOCOL (habitual). ve-neesfu 622 tok4 (asaf toks
    4-5-6 all in-span); ve-galalu 1556 tok1/4 DEBUT — the ROLL-verb is
    born on this stone; toks 1-2-3 all in-span, tok4 = 43:18 le-hitgolel
    (the brothers' fear in Egypt); ve-heshivu 7725 tok33 — the return-verb
    (gen_47/48 toks 29-32 wait→promise→vow) returns the STONE to its
    place; li-meqomah 4725 tok31 — the place-word's next token after
    gen_48's six place-tokens (25-30) is the stone's place.
    (4) 29:4 FROM HARAN — CAREER CLOSES. acha-y 251 tok54 ("my brothers"
    to strangers); me-ayin 370 tok1/3 DEBUT ("from where"); me-charan
    2771 tok7/7 — the HARAN-WORD'S CAREER CLOSES: toks 5-6-7 = 27:43
    mother's "flee to Haran" → 28:10 his road → 29:4 "from Haran are we."
    The word's final arc is exactly this journey, closing at arrival.
    (5) 29:5 KNOW-CHAIN + GRANDFATHER-SKIP. ha-yedatem 3045 tok31 /
    yadanu tok32 — know toks 30-31-32: 28:16 "I knew NOT" → "do you
    know?" → "we know." Lavan ben NACHOR (5152 tok15/16) — kin-formula
    FACT: 28:5 said ben Betuel (Betuel's career CLOSED 9/9 there); here
    the letter skips to the grandfather. Record; never adjudicate.
    (6) 29:6 SHALOM-CHAIN + RACHEL DEBUT. ha-shalom / shalom 7965 toks
    5-6 — peace toks 4-5-6 CONSECUTIVE: 28:21 the vow's "return in
    peace" → the first question at Haran is peace ×2; ve-hine RACHEL
    7354 tok1/44 — THE NAME DEBUTS mid-speech ("and behold Rachel his
    daughter comes"); baa 935 tok88 participle.
    (7) 29:7 THE COMPOUND PUSH (the unit's only volitives). hashqu (8248
    tok17 HVhv2mp) + u-lekhu (3212 tok59 HC/Vqv2mp) + reu (7462 tok2
    HVqv2mp) = LET(hashqu_lekhu_reu(ha_roim)) — one breath, one
    addressee-group, gen_41 compound law. THE WATER-VERB: toks 8-14 =
    the ch. 24 Rivqah WELL-TEST cluster (ashqe/hashqini …); toks 15-19
    all in-span — the type-scene verb returns at the next well. THE
    PASTURE-VERB: 7462 tok1 = 4:2 ABEL the first shepherd; tok2 = this
