    13/13 VERIFIED, zero FAILED; record
    logic/oral_audit/AUDIT_gen_68_2026-08-09.md). CROWNS
    (chain-attested + DB-verified). THE HARVEST-PAIR [G68-01,
    Kitzur on 45:6] — THE UNIT'S MARQUEE: וקציר ("and harvest")
    stands exactly TWICE in the Torah — the covenant's "seed and
    HARVEST shall not cease" (8:22) and the decree "no plowing and
    HARVEST" (45:6) — and the Kitzur reconciles the collision on
    the letter's own terms (named): what is sown will be reaped;
    these years none could sow — the corpus's first
    invariant-versus-narrative collision, and the tradition
    resolves it without breaking either verse. THE FOUR NECKS
    [G68-02, MS on 45:14; the Ramah]: צואריו ("his neck") — four
    tokens in the Torah: the kid-skins on Jacob's DECEIVING neck
    (27:16), Benjamin's neck (45:14), and the father-reunion pair
    (46:29 twice): the neck that deceived a father, the neck of
    the undeceived brother, the neck of the restored son — full
    alef and full yod per the Ramah (the lean the Mizrachi's text
    implied is found nowhere, as the supercommentaries and the
    Ramah's rule agree, named). THE LEAN VOICE [G68-03, MS on
    45:16]: והקל ("and the voice") LEAN — the Masorah's pair:
    Ezra's shout at the rebuilding FULL ("the voice was heard afar", Ezra
    3:13) — first lean, second full, "and the secret of the matter
    is in the Zohar" (MS's own words, named); the skeleton's other
    Torah token is Jethro's "they will LIGHTEN from you" (Exod
    18:22): homograph collision framed. COME DOWN [G68-04, Kitzur
    on 45:9]: רדה ("come down") — ONCE in the Torah; Scripture's
    pair is the descent-order over Pharaoh's own house ("go down,
    be laid with the uncircumcised", Ezek 32:19, named): the
    Kitzur weighs exile against the pit. THE UNSPARING EYE
    [G68-05, MS on 45:20; the Ramah]: ועינכם ("and your eye") with
    its second yod LEAN — one of the Masorah's matched one-of-each
    pairs (the full twin in the garden's "your eyes will be
    opened"): this exact form once in Scripture; תחס ("spare")
    lean vav with the precise books (asserted). THE TWO CHANGES
    [G68-06, MS on 45:22; the Hilleli and Yerushalmi]: חלפות /
    חלפת ("changes of garments") — the word lives in the Torah
    ONLY in this verse, twice, with two spellings: the first FULL,
    the second LEAN (each its only token; the Hilleli's first
    reading is our books'; the Yerushalmi leans both, named):
    Benjamin's five changes ride the lean word. THE SIXTH FULL
    BENJAMIN [G68-07, MS on 45:12; the chilufim REJECTED]: ועיני
    אחי בנימין ("and the eyes of my brother Benjamin") FULL — the
    seven-full census's sixth station, at the SEEING — while the
    weeping-necks verse writes him LEAN twice (45:14); and MS
    REJECTS the printed variance-list's Ben Asher/Ben Naphtali
    note at 45:14 by rule: the chilufim do not dispute full/lean
    spelling (named) — a books-vs-books-list correction carried
    whole. THE PRESUMED LAND [G68-08, MS on 45:25; the Masorah's
    five]: ויבאו ארץ כנען ("they came to the land of Canaan") —
    one of the Masorah's FIVE sevirin ("presumed") cases: readers
    presume the directional to-the-land; the letter writes the
    bare land and the Masorah locks it. THE COMMANDED-HE [G68-09,
    MS on 45:19]: צויתה ("you are commanded") FULL to its final
    he — "for the homily, as the Zohar reads it" (MS naming his
    source, named). THE LEAN TELLING AT ITS STATION [G68-10 =
    G65-06 CLOSED, MS + Kitzur on 45:26]: ויגדו לו ("and they
    told him") LEAN — the second and last of the Ramah's two lean
    tellings (the well, 26:32; the son, here): the census armed
    two units back closes at its own verse; the Kitzur reads the
    clipped yod as the clipped telling (the ban of the ten,
    named); ויפג ("and it went numb") — the heart's numbing-verb,
    its one Torah token (asserted). THE LEAN TRAIN [G68-11, MS on
    45:23; the Ramah]: אתנת ("she-asses") lean-of-lean, נשאת
    ("carrying") lean (the Chronicles full partner named) — the
    Ramah's double-lean rule asserted in-stream. THE SUSTENANCE
    PAIR [G68-12, Kitzur on 45:23]: ומזון ("and sustenance") —
    TWICE in Scripture: the father's provision-train and Daniel's
    empire-tree "food for all in it" (named): the son feeds the
    father as the tree feeds all flesh (Torah-side token checked).
    THE POINTING FILE [G68-13, MS ×5]: תרגזו ("quarrel", 45:24)
