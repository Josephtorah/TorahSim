    (maharu va-alu, 45:9) discharges at the ascent (45:25); the
    wagon-order (45:19) at the ken-receipt (45:21). OPEN at close:
    Pharaoh's royal summons (u-vou elai, 45:18 — the arrival is the
    next units' engine) and the do-not-quarrel (45:24, the
    negative-demand class that takes no receipt). Queue: TWO OPEN,
    both forward-armed. REGISTRY 0; TESTS 0; LEDGER 0. EVENTS 2
    marked: weeping stations three (45:2 — heard by an empire) and
    four (45:14 — the first reciprocal weeping, Benjamin's neck).
    CROSS-UNIT SETTLEMENTS (corpus-world links, per the one-world
    law): gen_67's SUBSTITUTION (44:33) is answered off-queue by
    the unmasking (45:3-4); gen_67's open DISMISSAL (go up in
    peace, 44:17) finally happens at 45:25; gen_66's El-Shaddai
    PRAYER (43:14) completes as all twelve stand alive on the
    board and go up together (45:25); gen_63/64's remember-arc and
