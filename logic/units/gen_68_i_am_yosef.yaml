    CARE-POINTS: the HEALED SPEECH (45:15 — dibru echav ito against
    37:4's lo yakhlu dabro le-shalom: the corpus's longest repaired
    clause, twenty-two years, nine units). The anger-pair closing
    INSIDE the cycle (44:18 -> 45:5, G67-04). The agency inversion
    (45:8 lo atem... ki ha-Elohim) with the deed unerased (45:4
    mekhartem — the sale said aloud). The covenant-vs-decree
    collision resolved on the letter's terms (45:6 against 8:22,
    G68-01). The inner come-down demand on Jacob (rada, 45:9)
    armed for gen_69's descent. The still-alive question detonating
    (43:27 -> 45:3). The five changes answering the five hands
    (43:34 -> 45:22). WATCHLIST ARMS: 46:1-7 (the descent — the
    royal summons and the inner rada), 46:29 (the reunion necks,
    G68-02; the hard-alef chariot binding, G65-05), 46:30 (the
    before-I-die clause meeting its speaker), 47:1-6 (Goshen
