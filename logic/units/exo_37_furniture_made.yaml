          and Bezalel argues house-first, 'the custom of the world'
          (Babylonian Talmud Berakhot 55a). A genuine two-recension dispute
          over which scheduling argument the exchange carried; the as-run
          order is its own record — boards, tent, veil, ark, cover, table,
          lampstand, 'the practice of kings' (Midrash Tanchuma, Vayakhel
          10:1) — and R. Eleazar the son of R. Yose testifies: I SAW THE ARK
