          ARK — the one vessel in the whole account carrying the craftsman's
          name; everything else was made at his word and counsel (Onkelos
          Exod 37; Midrash Tanchuma, Vayakhel 7:1) — because the ark is where
          the Holy One COMPRESSES His Presence, and the name says it: Bezalel
          made the SHADE of God between the cherubim. And the attribution law
          rides: he GAVE HIS SOUL to the work, so his name is published on
          every stage — the byline goes to the soul-giver (Midrash Tanchuma,
          Vayakhel 10:3). Seated under the amended spine, auto-seat law.
