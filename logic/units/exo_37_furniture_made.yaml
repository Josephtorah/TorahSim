          He may dwell in it and teach Torah'; 'and where will the Torah be
          placed?'; Moses orders house-then-ark; Bezalel answers ARK FIRST —
          the dependency argument, light before the palace (Midrash Tanchuma,
          Vayakhel 6:5, with the begin-with-light doctrine at 6:3; same track
          at Midrash Tanchuma Buber, Vayakhel 8:3) — while the Babylonian
