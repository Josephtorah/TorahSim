          (Midrash Tanchuma, Vayakhel 8:1); the Buber recension states the
          operator: He heals WITH THE WOUNDING INSTRUMENT — bitter wood
          sweetened Marah's bitter water, and the sin at Shittim is healed by
          shittim (Midrash Tanchuma Buber, Vayakhel 9:1). The plural command
          rides: for the ark alone THEY shall make — all Israel — so no man
          can claim the Torah is more his than his fellow's; Torah as water,
          free and unpriced, the desert its ownerless home, the convert equal
          to the high priest at it (Midrash Tanchuma, Vayakhel 8:2). Seated
          under the amended spine, auto-seat law.
