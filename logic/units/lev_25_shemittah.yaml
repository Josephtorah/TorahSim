          thirty days before the New Year count as the year; the three-
          year figs have their seventh in the second year after (R. Yehuda
          adds the Persian figs; refused). 'A sabbath to the LORD' — as
          creation's Sabbath. Onkelos: נְיַח שְׁמִטְּתָא ('a rest of
          release').
