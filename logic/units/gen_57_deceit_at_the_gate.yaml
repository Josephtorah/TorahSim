  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_57_2026-08-08.md; manifest 8/8
    VERIFIED, zero FAILED, zero manual rows). CROWNS (chain-attested
    + DB-verified). THE ONE FULL SISTER [G57-01, Minchat Shai + the
    Ramah]: אחותנו ("shall he make OUR SISTER as a harlot?", 34:31 —
    the brothers' closing cry) is the Torah's ONE sister-of-ours
    written full with its vav; the two lean twins are Rebecca's
    send-off blessing (24:60) and the deceit-speech's own "to give
    OUR SISTER to one uncircumcised" (34:14). The sister-word is
    whole only in the verse that refuses her dishonor. THE DECEIT'S
    ONE LEAN LETTER [G57-02, the Ramah via Minchat Shai]: every
    circumcise-form in the Torah is written FULL — except ONE lean:
    להמל in the brothers' false offer, "only in this will we
    consent... TO BE CIRCUMCISED" (34:15). Abraham's covenant-verb
    (17:10), the Passover stranger (Exod 12:48), and this chapter's
    own repeats (34:17, 34:22) all keep their vav (builder-checked):
    the one spoken in deceit is written one letter short. THE TWO
    SILENCES [G57-03]: והחרש ("and Jacob KEPT SILENT until they
    came," 34:5) is written lean of its yod exactly twice in the
    Torah — the father's silence over Dinah, and the vows-law's
    silence that lets the woman's vow stand (Num 30:12): the silence
    over the daughter and the silence that binds, one lean pair.
    DINAH IN THE BOY'S LETTERS [G57-04]: all three of Dinah's
    maiden-tokens in this chapter (34:3 twice, 34:12) are written in
    the bare boy-skeleton הנער and read as the maiden — girl-vowels
    on boy-letters in the stream, the characterized maiden-law
    holding (its one written-whole exception remains Deut 22:19) —
    and the SAME skeleton stands once more in this chapter as an
    actual boy: Shechem himself, "the YOUNG MAN did not delay"
    (34:19, boy-vowels, builder-checked). One set of letters carrying
    the violated maiden and her violator. THE DEFILED SISTER, ONCE
    [G57-05, Kitzur Baal HaTurim]: טמאו ("they had DEFILED their
    sister," 34:27) — the word's only Torah token; the Masorah's
    companions are the defiled sanctuary of Ezekiel and the defiled
    temple of Psalm 79 (named): every later defilement learned from
    Shechem's deed. THE GRIEF DAGESHED, IN THE VERSE WITHOUT A
    DECISION [G57-06]: ויתעצבו ("and the men WERE GRIEVED," 34:7) —
    the tzadi dageshed as ruled; and the tradition marks this clause
    one of Scripture's VERSES WITHOUT DECISION (R. Tanchuma's list —
    does "when they heard" lean backward or forward?): SNAPSHOT's
    accent stream, which must sing the verse one way, binds it
    forward — the instrument committing where the tradition holds the
    question open. THE JOINING STROKES OF THE SWORD-DAY [G57-07]:
    "the TWO SONS of Jacob, Simeon and Levi" (34:25) — the precise
    Sephardic books rule maqqef (the joining stroke), NOT the
    wheel-accent, and SNAPSHOT joins them; "that which was in the
    city" (34:28) joined bare as ruled: the wheel-vs-stroke question
    that split at Esau's meeting lands here on the stroke's side.
    POINTING AS RULED [G57-08]: בהיותם ("WHEN THEY WERE in pain,"
    34:25) — the he with plain sheva (the silent half-vowel) against
    the printer's compound: a THIRD guttural witness for the
    half-vowel law's boundary (after the two ayin stations); בנתיכם
    ("your daughters") bet dageshed; הכזונה ("as a HARLOT") kaf soft
    with no stress-stroke per the Michlol — its large-zayin question
    (one alphabet enlarges it; Minchat Shai sides with the precise
    books against) filed to the uninstrumented letter-size layer.
    READINGS (named-only): the Kitzur's pair of בבנות ("among the daughters") with Samson and
    the hidden-daughter midrash; the הרבו pair with Gilgal; the
    beast-deed juxtaposition; the ונקומה three-list (Bethel, Judah's
    pledge, the war); garment-changing before Bethel read on
    prayer-dress.
