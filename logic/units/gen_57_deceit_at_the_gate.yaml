      outrage-word has exactly two Torah tokens — this unit's
      anger-verse and the stoning-law verse of Deut 22:21, where it
      stands immediately beside the whore-root that this unit's LAST
      WORD debuts; the law-verse even keeps the cast. THE SILENCE
      ARCHITECTURE: the Torah gives Dinah exactly ONE finite verb —
      "she went out" — and no speech; Jacob's silence-verb's career
      cluster is the vow-law where a father's silence makes a
      woman's vow binding; his one speech carries eight
      first-person marks and not one word for Dinah; and the closing
      verse sets its rest on its FIRST token — the only plural
      say-verb among the Torah's twelve first-token rests — leaving
      the question unanswered above nine open cards. ONE PEOPLE,
      TWICE BROKEN: the bare one-people phrase occurs three times in
      the Torah — Babel, and this deal's two — and the
      intermarry-verb conjugates finitely exactly twice: this
      invitation and the Deuteronomy ban. THE STATUTES ALREADY
      WATCHING: the defile-verb that will carry the purity codebook
      is BORN on Dinah; the bride-price word's only other token is
      the seduction law; the long-for and delight verbs land in the
      captive-woman law; the mouth-of-the-sword idiom debuts here
      and runs to the war-laws. Also filed: the mood rulings (the
      exchange-terms imperfects fenced, with the letter's own
      witness — the dwell imperfect re-issued as an imperative in
      the same verse), and the letter-note that the conditional
      threat's taking fires although its condition was met by the
      other side — the negotiation's letter and outcome part company
      at every joint.
