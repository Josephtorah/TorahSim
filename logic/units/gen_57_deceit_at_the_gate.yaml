  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #11 (Claude coordinator+deriver;
    external fresh-context adversarial review before freeze per standing
    law). Span: 34:1-31, the Dinah span, whole chapter: 31 verses · 421
    tokens (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C. Conventions:
    step he: = plain (no accents/meteg; maqqef ־ per snapshot); tree halves
    = accents kept, slashes stripped; split at etnachta — ALL 31 verses
    carry one (token-map scan; the strongest-disjunctive fallback stays
    unused). No ketiv in span. Onkelos BUFFER PENDING.

    UNIT SHAPE — NINE pushes, ZERO pops, NINE OPEN at the wall: the
    corpus's LARGEST ALL-OPEN WALL (the prior all-open maximum is seven,
    held three times: gen_34's Mamre, gen_54's Gilead, gen_55's Peniel;
    deeper walls exist only in units that also popped — gen_35's
    17-pushed/3-popped Sodom board, gen_46's twelve). Every demand in the
    whole negotiation dies unperformed by its demandee: the
    performance-shaped answers are the wrong performers' takings
    (card 1) and the other-root compliance at 34:24 (card 9). The nine, in queue
    order:
    (1) 34:4 LET(qach_li(chamor, et_ha_yalda_ha_zot_le_isha)) — Shechem's
    take-me-this-girl imperative on his father, pushed AFTER the taking
    already happened: laqach ("take", 3947) walks tok104 = 34:2 va-yiqach
    (the deed) → tok105 = 34:4 qach (the demand) — deed then demand,
    CONSECUTIVE career tokens: gen_54's performed-before-demanded class
    in its starkest form. And the demandee (Hamor) never performs laqach
    anywhere after; instead the take-verb returns as the AVENGERS'
    takings — swords (tok110, 34:25), Dinah herself (tok111, 34:26), the
    spoil (tok112, 34:28): wrong-performer, three times over. OPEN.
    (2) 34:8 LET(tenu_na(bet_yaaqov, otah_lo_le_isha)) — Hamor's
    give-her-please imperative on Jacob's house; REFUSED on the letter
    at 34:14 (lo nukhal... LA-TET, "we cannot... TO GIVE" — the refusal
    quotes the demand's own verb: gen_35's refused-demand class), then
    conditionally promised at 34:16 (VE-NATANU, "then we will give" —
    weqatal duty-content, gen_40's class, not performance): no narrated
    giving anywhere. OPEN.
    (3) 34:9 LET(hitchatnu(bet_yaaqov, otanu)) — the intermarry
    imperative: the verb chatan (2859) conjugates finitely exactly TWICE
    in the Torah — this invitation and Deut 7:3's prohibition (lo
    titchaten bam, "you shall not intermarry with them") [see CROWN 3];
    never performed. OPEN.
    (4-6) 34:10 LET(shevu(bet_yaaqov, itanu)) + LET(secharuha(bet_yaaqov,
    ha_aretz)) + LET(heachazu(bet_yaaqov, ba_aretz)) — the settlement
    triple: dwell, trade-in-it, take-holdings-in-it — three imperatives
    in one verse, none performed by the demandee in-span; the hold-verb
    achaz (270) performs its very NEXT career token at 47:27 (va-yeachazu
    bah) — in GOSHEN, the wrong land (prospective arm). All three OPEN.
    (7) 34:12 LET(harbu(aviha_ve_acheha, mohar_u_matan)) — multiply-upon-
    me-the-bride-price: answered in the OTHER root (the circumcision
    condition, 34:15), never in silver — and mohar's only other Torah
    token is Exod 22:16's seduction-law (ke-mohar ha-betulot) [CROWN 4].
    OPEN.
    (8) 34:12 LET(tenu_li(aviha_ve_acheha, et_ha_naara_le_isha)) —
    Shechem's own give-me imperative doubling his father's card #2: two
    demanders, one demanded object (gen_54's double-push pattern); same
    refusal, same non-performance. OPEN.
    (9) 34:23 CMD-US?(neota(anshe_ha_ir, la_hem)) — the unit's only
    cohortative push: neota is a true 1cp cohortative (HVNh1cp), Hamor
    and Shechem exhorting themselves-with-their-townsmen — TIR-033's
    ?-guard (gen_45's nikhreta, gen_56's nisa-ve-nelekha). The town DOES
    comply — but by OTHER roots (shama "heed" + mul "circumcise", 34:24);
    the consent-verb ot (225) itself never returns after the cohortative:
    gen_45's other-root law (performance in another root never pops)
    holds the card OPEN — and the consent-verb's whole Torah career is
    THREE tokens, all inside this negotiation (34:15, 34:22, 34:23): born
    in the brothers' condition, spent in the townsmen pitch, dead on its
    own cohortative. OPEN.

    MOOD RULINGS (the fences). 34:9b-10a's paired imperfects (titnu /
    tiqchu, "your daughters you-shall-give... our daughters you-shall-
    take"; teshevu, "with us you-shall-dwell") are OFFER-TERMS, not
    command-frame imperfects: TIR-028's mandatory ?-guard requires a
    command frame (gen_33's 17:9 tishmor, God commanding Abraham;
    gen_55's 32:5/32:20 tomrun/tedabrun, master scripting servants) — a
    reciprocal exchange proposal between negotiating houses is not one,
    and the letter supplies its own witness: teshevu (imperfect, 34:10
    first half) is RE-ISSUED as shevu (imperative, 34:10 second half) IN
    THE SAME VERSE — the imperative is the push; an imperfect that
    pushed independently would double-push the dwell-demand inside one
    verse. gen_51's yosef-class (imperfect volitive-by-sense → fenced,
    no push) is the standing precedent. Also fenced: 34:11's eten and
    34:21's niqach/niten (self-commits); 34:12's ve-etna (1cs cohortative
    self-commit, gen_47's 27:41 / gen_52's ashuva class); 34:16's weqatal
    chain ve-natanu... ve-yashavnu ve-hayinu (duty-content, gen_40);
    34:17's conditional protasis+apodosis (ve-im lo tishmu... ve-laqachnu
    ve-halakhnu) — see the LETTER-NOTE below; 34:21-23's third-person
    imperfects (ve-yeshvu ×2, ve-yischaru, yeotu — Vqi/VNi by morph, not
    jussive): retold offer, proposal about third parties, no push. The
    prestage volitive census (10 volitives: 8 imperatives, 2 cohortatives)
    is fully accounted: 8 imperative LETs + 1 CMD-US? + 1 fenced 1cs
    cohortative.

    LETTER-NOTE — THE APODOSIS THAT FIRES WITH ITS CONDITION UNMET:
    34:17 stakes a conditional threat: IF you do not heed us, to be
    circumcised (protasis) — we take our daughter and go (apodosis,
    weqatal ve-laqachnu). The protasis FAILS: 34:24 va-yishmu ("they DID
    heed") and every male is circumcised. Yet the apodosis' taking
    performs anyway: 34:26 va-yiqchu et-dina ("they TOOK Dinah" — laqach
    tok111)... va-yetzeu. The stated condition is met by the other side,
    and the threatened taking happens regardless — the negotiation's
    letter and its outcome part company at every joint (gen_55's
    refused-met-condition mismatch, inverted: there the condition was
    met and the demand still didn't close; here the condition-guard
    failed and the threat fired anyway).

    CROWN 1 — THE LAW-VERSE REUNION (Deut 22:21): the unit's frame-words
    reunite in one statute. nevala ("outrage", 5039) has exactly TWO
    Torah tokens: 34:7 (nevala asa ve-yisrael — "an outrage he did
    in-Israel") and Deut 22:21 (asta nevala ve-yisrael) — both riding a
    do-verb (asa) plus an in-Israel [VERIFIED: full 5039 census; both
    be-yisrael tokens lemma b/3478]. And in Deut 22:21 the tokens run
    CONSECUTIVELY: nevala (idx15) → be-yisrael (idx16) → li-zenot
    (idx17) — the outrage-word of this unit's anger-verse standing
    immediately beside the whore-root (zanah, 2181) that this unit's
    LAST WORD debuts: 34:31 ha-khe-zona is zanah's tok1/20; Deut 22:21's
    li-zenot is tok18/20. The law-verse even keeps the cast: ha-naara
    (the girl), avi-ha (her father) ×2, anshe ira-h (the men of her
    city). The unit opens its anger with outrage-in-Israel and closes
    asking "like a whore?" — and the Torah's stoning-law verse holds
    both words side by side.

    CROWN 2 — THE SILENCE ARCHITECTURE: (a) DINAH'S GRAMMAR: the Torah
    gives Dinah exactly ONE finite verb as grammatical subject — va-tetze,
    "she went out" (34:1) [VERIFIED: 3fs-finite census of Gen 34 (the
    only others: yalda = Leah bearing, va-tidbaq/chashqa = his soul,
    tihye = the land) + her full 8-token name-career (30:21 named by
    Leah; 46:15 the census-list)]. Every other Dinah-token is object or
    possessive; she speaks nowhere; every speech in the span belongs
    to a man. (b) JACOB'S VERB: ve-hecherish (2790 tok2/10)
    — Jacob "kept silent": the silence-verb's tok1 is 24:21 (the servant
    silently watching Rebekah — a bride watched into the family; a
    daughter silenced out of it), and its career cluster is Num 30's
    vow-law (toks 4-9), where a father's or husband's SILENCE at a
    woman's vow is what makes the vow BINDING — the verb of Jacob's
    silence becomes the law's instrument of paternal consent. (c)
    JACOB'S ONE SPEECH: Jacob speaks once in the span (34:30), and the
    speech carries EIGHT first-person-singular marks [VERIFIED: 1cs
    morph census of 34:30 — oti, le-havisheni, va-ani, alay, ve-hikuni,
    ve-nishmadti, ani, u-veti] and not one word for Dinah. (d) THE
    UNANSWERED END: 34:31 sets its etnachta on its FIRST TOKEN
    (va-yomru, "and they said") — the Torah splits a verse at its first
    word only 12 times [VERIFIED: corpus mark census]; eight of the
    twelve sit on a say-verb, and this is the ONLY PLURAL one — the
    whole closing question hangs in the verse's second half, and nothing
    answers it: the unit ends on an open question standing over nine
    open cards.

    CROWN 3 — ONE PEOPLE, TWICE BROKEN: le-am echad ("one people") —
    the bare phrase am echad occurs exactly THREE times in the Torah
    [VERIFIED: adjacency census; the one further adjacency, 49:16's
    am-o ke-achad — "his people, AS ONE OF the tribes" — is a
    suffixed noun + kaf-preposition, not the phrase]: 11:6 (hen am
    echad — BABEL, the
    one-people God disperses) and this unit's 34:16 + 34:22 (the merger
    clause of the marriage-deal, once in the brothers' deceit-offer,
    once in Hamor's gate-retelling). The only one-people ever proposed
    after Babel is this one, and it ends under the sword on day three.
    Beside it, the intermarry-verb chatan (2859): 19 tokens, but finite
    exactly TWICE — 34:9's invitation (ve-hitchatnu, imperative) and
    Deut 7:3's ban (lo titchaten, imperfect) [VERIFIED: full morph
    census — all 16 middle tokens are participles, Jethro the
    father-in-law (Exod 3-18, Num 10:29) + one mother-in-law (Deut
    27:23)]: the verb is born inviting, and its FINITE life ends at
    the ban — the lemma's last token (Deut 27:23) is the
    mother-in-law participle.

    CROWN 4 — THE STATUTES ALREADY WATCHING: the span's rare words keep
    landing in the law codes that will regulate its scene. tamei
    ("defile", 2930) is BORN here — toks 1-3/114 are 34:5, 34:13, 34:27
    (heard-defiled, answered-defiled, plundered-because-defiled), then
    tok4 jumps to Lev 5:3: the verb that will carry the purity codebook
    debuts on Dinah [VERIFIED: debut_map]. mohar ("bride-price", 4119
    tok1/2) → Exod 22:16, the seduction law's ke-mohar ha-betulot, a
    verse that also holds the refusing FATHER (im maen yemaen aviha) and
    the give-verb (le-tita-h). chashaq ("long-for", 2836 tok1/7) →
    Deut 21:11's captive-woman law (ve-chashaqta bah) — beside chafetz
    ("delight", 2654 tok1/5) → Deut 21:14 (im lo chafatzta bah, the same
    law's release clause). le-fi charev ("by the mouth of the sword",
    first of six Torah tokens at 34:26) → Exod 17:13 (Amalek), Num 21:24
    (Sihon), Deut 13:16 ×2 (the condemned city), Deut 20:13 (the war
    law) [VERIFIED: adjacency census]. And nevala + zanah → Deut 22:21
    [CROWN 1]. The chapter's vocabulary is a syllabus of its own future
    statutes.

    CARE-POINTS (ordinals from debut_map via prestage unless tagged):
    (1) 34:1 THE EXIT: va-tetze dina bat lea — Dinah introduced as
    LEAH'S daughter (the narrator's mother-tag; from 34:3 on she is bat
    yaaqov, "Jacob's daughter", in the desirer's and narrator's
    mouths); li-reot bi-venot ha-aretz ("to see among the daughters of
    the land") — the exit-verb frame: yatza tok54/348 = her going-out,
    tok58 = 34:26 va-yetzeu, the brothers going-out carrying her back
    [the span's outer bracket]. See CROWN 2a.
    (2) 34:2 THE TAKING BEFORE THE ASKING: va-yiqach... va-yishkav...
    va-yeaneha — laqach tok104 [card 1's deed]; shakhav ("lie", 7901
    tok14/62; tok16 = 35:22, Reuben and Bilhah — the next family
    violation is the verb's next narrative token; tok17 = 39:7,
    Potiphar's wife's imperative); anah ("afflict/violate", 6031 tok5/27)
    — and tok4 is 31:50, LABAN'S OATH-CONDITION sworn one unit ago: "if
    you AFFLICT (teane) my daughters" — the afflict-verb's very next
    token after the oath violates JACOB'S daughter: consecutive career
    tokens, the oath's word landing on the swearer's own house; career →
    Exod 1:11-12 (Egypt afflicts Israel), Exod 22:21-22 (the
    afflict-not laws), Lev 16/23 (afflict-your-souls), Deut 22:24,29
    (the violation laws' own verb).
    (3) 34:3 THE CLEAVE AND THE HEART: va-tidbaq nafsho — davaq
    ("cleave", 1692 tok4/13): tok1 is 2:24's PATTERN (ve-davaq
    be-ishto, the leave-and-cleave marriage law) — the marriage-law's
    cleave-verb cleaves here with no marriage; career → Deut's
    cleave-to-YHWH cluster. va-yedaber al lev ha-naara ("spoke to the
    girl's heart") — the comfort-idiom dibber al-lev (speak-verb +
    AL, "upon", + heart) occurs exactly TWICE in the Torah [VERIFIED:
    adjacency census of all 67 heart-tokens]: here (Shechem to the
    girl he violated) and 50:21 (Joseph to the brothers who sold him)
    — both speakers soothing their own victims; distinct from the
    inward EL-heart idiom (6:6, 8:21, 24:45 — speech TO one's own
    heart).
    (4) 34:4 THE DEMAND AFTER THE DEED [card 1]: qach li et ha-yalda
    ha-zot — ha-yalda (3207 tok1/1 HAPAX): the feminine child-noun
    appears once in the Torah, here, in the taker's mouth; the demand
    rides one verse behind its own performance [UNIT SHAPE (1)].
    (5) 34:5 THE DEFILE-VERB IS BORN, AND THE SILENCE: ve-yaaqov shama
    ki TIME et dina vito — tamei tok1/114 [CROWN 4]; ve-hecherish
    yaaqov ad boam — the silence [CROWN 2b]. His sons were with the
    livestock ba-sade ("in the field"); the father hears, and is
    silent until they come.
    (6) 34:6 THE FATHER GOES OUT: va-yetze chamor... le-daber ito —
    Hamor's exit (yatza tok55) to speak WITH him (et-o = ito, the
    with-preposition 854, not the object-marker); chamor (2544
    tok3/11): the name's whole career minus its purchase-debut (33:19,
    "the sons of Chamor") is this span, and its last token is his
    death-verse (34:26).
    (7) 34:7 THE OUTRAGE IN ISRAEL: u-vene yaaqov bau min ha-sade...
    va-yitatzvu... va-yichar lahem meod — atzav ("grieve", 6087
    tok2/3): tok1 is 6:6 — GOD grieved-to-His-heart before the flood;
    tok2 the brothers; tok3 = 45:5, Joseph's al-teatzvu ("do not
    grieve") — the grief-verb's whole Torah career is three tokens:
    flood, Dinah, reconciliation. ki nevala asa VE-YISRAEL ("an
    outrage he did in-Israel") [CROWN 1] — and be-yisrael (lemma
    b/3478) is the name ISRAEL's FOURTH token ever: decree (32:29),
    people (bene yisrael, 32:33), God-title (el-elohe-yisrael, 33:20),
    and now JURISDICTION — a place a crime can be "in" — four tokens,
    three units, and the nation-shaped usage precedes any nation.
    ve-khen lo yease ("and so is not done") — PATTERN-CANDIDATE, NOT
    OP-IFIED: gnomic negative generalization, but embedded in the
    ki-clause of the brothers' anger (voice ambiguous: narrator gnomic
    vs reported outrage) and marked ve-khen, not al-ken; the corpus's
    nine PATTERNs are unambiguous narrator voice — filed OPEN,
    owner-gated [see OPEN OBSERVATIONS].
    (8) 34:8 THE LONGING SOUL [card 2]: shekhem beni chashqa nafsho
    be-vitkhem — chashaq tok1/7 [CROWN 4]; tenu na otah lo le-isha —
    the give-her imperative [UNIT SHAPE (2)]; the give-verb natan
    (5414) opens its in-span walk: demand (tok86) → their-terms
    (titnu, tok87) → self-commits (eten 88, ve-etna 89) → the second
    demand (u-tenu, 90) → the refusal (la-tet, 91) → the conditional
    promise (ve-natanu, 92) → the retelling (niten, 93) — seven more
    give-tokens and not one narrated giving; tok94 = 35:4, the next
    unit: what Jacob's house finally GIVES is the foreign gods and the
    earrings, buried under Shechem's terebinth.
    (9) 34:9 THE INTERMARRY INVITATION [card 3; CROWN 3]: ve-hitchatnu
    itanu — chatan tok1/19, finite-twice crown; titnu/tiqchu — the
    exchange-terms imperfects, fenced [MOOD RULINGS].
    (10) 34:10 THE SETTLEMENT TRIPLE [cards 4-6]: ve-itanu teshevu —
    the imperfect re-issued as shevu in the same verse [MOOD RULINGS'
    letter-witness]; ve-ha-aretz tihye li-fenekhem ("the land shall be
    before you") — Hamor's land-grant echo of the patriarchal formula;
    shevu u-secharuha ve-heachazu bah — dwell, trade, hold: sachar
    ("trade", 5503 tok2/5; tok3 = 34:21, the retelling; tok4-5 =
    37:28's socharim, the MIDIANITE TRADERS who buy Joseph, and 42:34's
    tischaru, Joseph's "you may trade" — the trade-verb runs from this
    offer to the brother-sale and back); achaz tok3/11 → tok4 = 47:27
    Goshen [UNIT SHAPE (4-6)].
    (11) 34:11-12 GRACE, PRICE, AND THE DOUBLED GIVE [cards 7-8]:
    emtza chen be-enekhem ("let me find grace in your eyes" — chen
    tok9/27; the find-grace formula last stood at 33:8,10,15, Jacob to
    Esau: the appeasement grammar re-used by the violator); harbu alay
    meod mohar u-matan — mohar tok1/2 [CROWN 4], matan tok1/2 (tok2 =
    Num 18:11, the priestly gift-word); ve-etna — fenced 1cs
    cohortative [MOOD RULINGS]; u-tenu li et ha-naara le-isha — the
    second give-demand [UNIT SHAPE (8)]; ka-asher tomru elay — the
    whatever-you-say blank check (tomru: relative-clause imperfect, no
    volitive form).
    (12) 34:13-14 THE DECEIT AND THE REFUSAL: va-yaanu vene yaaqov...
    BE-MIRMA — mirma ("deceit", 4820 tok2/2 CLOSES): tok1 is 27:35 —
    "your brother came BE-MIRMA and took your blessing" (Isaac to
    Esau, about JACOB) — the deceit-noun's whole Torah career is this
    father-to-sons inheritance: the father's deceit named at the
    stolen blessing, the sons' deceit answering their sister's
    violation; both tokens ride a laqach-story. lo nukhal la-asot
    ha-davar ha-ze la-tet et achotenu — the refusal quoting the
    demand's verb [UNIT SHAPE (2)]; le-ish asher lo arla ("to a man
    who has a foreskin") — arla tok6/10 (toks 1-5 = the Gen 17
    covenant cluster; tok7 = Exod 4:25, Zipporah; tok8 = Lev 12:3;
    tok9 = Lev 19:23, the fruit-tree's foreskin; tok10 = Deut 10:16,
    the heart's); ki cherpa hiv lanu — cherpa ("reproach", 2781
    tok2/2 CLOSES): tok1 is 30:23, Rachel's "God has gathered my
    reproach" at Joseph's birth — the reproach-noun born at a birth,
    spent on a foreskin, career complete inside Jacob's household.
    (13) 34:15-17 THE CONDITION AND THE THREAT: akh be-zot neot
    lakhem — ot ("consent", 225 tok1/3): the consent-verb born [UNIT
    SHAPE (9)]; im tihyu khamonu le-himol lakhem kal zakhar — mul
    ("circumcise", 4135 toks 12-16/21 in-span: the covenant-verb of
    Gen 17 (toks 1-10) + Isaac's eighth day (tok11) is here
    weaponized ×5, then resumes at Exod 12:44,48 (Passover), Lev 12:3,
    Deut 10:16/30:6 (the heart)); kal zakhar ("every male", 2145 toks
    11-14/56 in-span) — the every-male word's walk: ark (toks 4-6,
    Gen 7), covenant (toks 7-10, Gen 17:10-23), Shechem (toks 11-14:
    circumcised at 34:15,22,24 — killed at 34:25); ve-natanu...
    ve-hayinu le-am echad — the weqatal promise-chain, fenced [MOOD
    RULINGS], carrying CROWN 3's one-people clause; 34:17 the
    conditional counter-threat — see LETTER-NOTE.
    (14) 34:18-19 DELIGHT WITHOUT DELAY: va-yitvu divrehem — the
    words were GOOD in their eyes (yatav tok8/38 — the do-good verb
    of gen_55's unsourced doublet, here approving the deceit); ve-lo
    echar ha-naar — achar ("delay", 309 tok3/6): tok2 is 32:5,
    Jacob's va-echar ("I TARRIED" — twenty years); the tarry-verb's
    next token: Shechem does not tarry a day; ki CHAFETZ be-vat
    yaaqov — chafetz tok1/5 [CROWN 4]; ve-hu nikhbad mi-kol bet aviv
    ("most honored of all his father's house") — kaved tok3/23: tok14
    = Exod 20:12's KABED et-avikha ("HONOR your father") — the
    honored-son word en route to the honor-your-father command.
    (15) 34:20-23 THE GATE PITCH [card 9]: el shaar iram ("to the
    gate of their city") — the legal locus (shaar tok7/56; 19:1 Lot
    in Sodom's gate; 22:17/24:60 the seed-shall-possess-the-gate
    blessings; 23:10,18 the Machpelah purchase); ha-anashim ha-ele
    SHELEMIM hem itanu ("these men are PEACEABLE with us") — shalem
    tok3/6: tok1 = 15:16 (the Amorite iniquity "NOT YET COMPLETE" —
    the four-generations prophecy), tok2 = 33:18 (Jacob arrived
    SHALEM, whole, at this very city) — consecutive tokens: Jacob
    whole, the town peaceable, and neither survives the chapter
    whole; ve-ha-aretz hine rachavat yadayim ("the land is
    wide-handed") — rachav tok1/2: tok2 = Exod 3:8, eretz tova
    U-RECHAVA — the land-is-wide word's only other token is God's
    promised-land description; THE TWO-FACED PITCH: to Jacob's house
    Hamor said "the land shall be before YOU" (34:10) and Shechem
    offered mohar; to the town he says "their livestock and their
    property and all their beasts — are they not OURS?" (34:23,
    miqnehem ve-qinyanam ve-khal behemtam ha-lo lanu hem) — the
    property-motive clause the family never hears, as the mohar
    clause never reaches the town: the deceit-chapter's negotiation
    is double-tongued on both sides [letter-anchored: token
    comparison 34:8-12 vs 34:20-23]; akh NEOTA lahem — the CMD-US?
    push [UNIT SHAPE (9)].
    (16) 34:24 THE CONSENT ENACTED IN OTHER ROOTS: va-yishmu...
