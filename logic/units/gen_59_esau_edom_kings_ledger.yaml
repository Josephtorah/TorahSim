  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_59_2026-08-08.md; manifest 7/7
    checkable VERIFIED, zero FAILED, one manual row). CROWNS
    (chain-attested + DB-verified). THE SEVEN-POSITION NAME LEDGER
    [G59-02, the Ramah via Minchat Shai]: the sons of Seir carry the
    Dishon/Dishan name SEVEN times in this chapter, and the Ramah
    rules each position's spelling one by one — the first with vav
    and no yod, the third and sixth doubly lean, the other four with
    yod. SNAPSHOT matches the ledger at ALL SEVEN positions (36:21
    twice, 36:25, 36:26, 36:28, 36:30 twice, every write
    builder-checked): a seven-station spelling law landing whole.
    THE EIGHT MY-LORDS AND THE EIGHT KINGS [G59-03, Kitzur Baal
    HaTurim]: Jacob calls Esau MY LORD exactly eight times across the
    meeting (32:5 through 33:15, all eight builder-checked) — and the
    reign-verb וימלך ("and he reigned") appears exactly EIGHT times
    in the whole Torah, all of them Edom's kings in this ledger
    (36:32-39): eight deferences, eight crowns before Israel's — and
    with gen_55's eight-mem gift-verse (32:15) the arithmetic now
    spans three units, the program's first three-unit crown. THE LAST
    KING'S RESH [G59-01]: the eighth and final Edomite king is
    written הדר with a RESH (36:39) — one of a kind against the
    dalet of the Hadads before him (36:35, 36:36, builder-checked)
    and against his own name's dalet-spelling in Chronicles (named):
    the closing king shifted one letter into the Torah's own
    splendor-word. THE SOJOURNING-WORD'S THREE [G59-04]: מגוריהם
    ("the land of their SOJOURNINGS could not bear them," 36:7) —
    full here and at Jacob's hundred-and-thirty-years answer to
    Pharaoh (47:9), lean exactly once at the covenant-verse of Vaera
    (Exod 6:4, builder-checked): the Ramah's two-full-one-lean
    landing to the letter. WRITTEN YEISH, READ YEUSH [G59-05]: Esau's
    son is twice written יעיש with a yod and read יעוש with a vav
    (36:5, 36:14) — SNAPSHOT carries BOTH at each site as a
    written/read token-pair, while the third mention (36:18) needs no
    pair and is written as read: the two-token instrument working
    exactly where the tradition splits the name; the Kitzur counts
    the written yod as the TEN nations gathered against the Temple.
    THE LAND THAT COULD NOT BEAR [G59-06, Kitzur]: יכלה of "the land
    COULD NOT bear them together" (36:7) paired by the Masorah with
    the one other could-not of its shape — Moses' mother, who COULD
    no longer hide him (Exod 2:3); the skeleton's third Torah token
    is Ephron's withhold-verb (23:6), distinguished by its own
    pointing (builder-checked). THE LEDGER'S NAMES AS RULED [G59-07]:
    Oholibamah ONE fused word at all four sites; Baal-hanan TWO
    written-and-read words that are one name (the Ramah); הימם of the
    wilderness lean between its two mems (the Ramah; a Zohar teaching
    named); Rehoboth-of-the-river lean in its first vav and full in
    its second; רכושם ("their property") FULL against the printer,
    standing beside the lean רכשו class of Gen 14 and 31; יעלם with
    plain sheva on the ayin — a FOURTH guttural witness for the
    half-vowel law's boundary; מגדיאל (Magdiel) with its dalet dageshed.
    INSTRUMENT GAPS: no break at the second heading [G59-08, manual]
    — Minchat Shai rules that "and these are the generations of Esau,
    father of Edom" (36:9) opens NO new paragraph: Esau's two ledgers
    run as one skin; the paragraph layer is uninstrumented, filed
    with its standing members. READINGS (named-only): Esau's
    offspring called births like beast-litters, never sons-of with
    the mothers; Bozrah's future lashing (the Isaiah 63 pair); the
    hunted king with no city, and the king who reigned by his wife's
    wealth; the eleven chiefs against Israel's eleven judges; the
    Ramah's whole-family full-yod rule on the Teman names.
