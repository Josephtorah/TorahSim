      the mamzer audit with its three-vs-four count dispute and the
      Ana double-listing read as Tzivon's incest); the PROMISSORY-
      NOTE flight at 36:6 (Esau leaving the Land to dodge the
      your-descendants-will-be-strangers debt); the SHIP-KINGDOM
      reading of the imported kings ("an estate seized hastily…
      unblessed at its end"); the MAGDIEL-DIOCLETIAN countdown with
      Iram's treasuries held in escrow for the messianic king (and
      Elijah refilling a squanderer's vaults); TIMNA's a-fortiori
      ("kingdoms wished to cleave to Abraham's house — if not wife,
      then maidservant"); the yemim hapax with the buffer's
      independent third reading (the MIGHTY ONES, against mules and
      hot springs); the forgiven-name bride resurfacing as Basmat in
      the roster; Botzra's supplier-liability; the seam into
      Vayeshev ("the wind carries them off; the one who trusts
      inherits"). Findings in the ledger; dual-track; no machine
      ops changed.
    comment_en: "Reading-pass record; the stamp and ritual remain the owner's word (batch, per parashah). Outside-scope primaries recorded in the ledger await the exam (testing shelf) or depth orders. gen_55 carries Vayetze's tail 32:1-3 (blocks are the ledger unit)."
    source: "[ORAL][READ-THROUGH][SPINE-DEFAULT]"

