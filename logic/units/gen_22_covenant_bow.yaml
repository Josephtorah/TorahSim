      the third zero-traffic queue). TESTS: EMPTY. REGISTRY: ZERO
      writes. LEDGER: EMPTY. FLAGS (3): read_before_install x3.
      The machine ends at rest holding three structures no event
      can retire: two forever-negations and one standing
      remember-rule — the counter-decree completed.

