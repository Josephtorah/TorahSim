      are le-dorot olam, 'for everlasting generations': scope, not
      anchor). WORLD: ZERO installs (+3 presupposed: noach, banav,
      tevah — the ark read once, in 9:10's exit-roster). Standing
      facts (9 + the handler): the ladder's three rungs (participle
