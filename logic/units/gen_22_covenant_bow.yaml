      closing perfect), the all-flesh partner-list, the
      give-participle with le-dorot-olam, the two bow-facts (the
      set-perfect and the sign-office weqatal — ASSIGN and INSTALL
      declined on the Cain-mark precedent), the THEN-facts (the
      remembering pledged — zakhar tokens 2-3, frozen gen_19's
      prediction landed — and the never-again re-sounded inside the
      mechanism), and the everlasting third-person clause (between
      ELOHIM and every living soul — the letter's strangest turn,
      held). INVARIANTS (2): the public never-again pair — the
      cut-verb's negated Torah debut inside #1, the decree's
      destroy-verb quoted inside #2 (8:21's interior pledges made
      covenant; delta named). HANDLERS (1): the weather-wired
      memory-duty — IF(I cloud up AND the bow is seen) THEN(I
      remember My covenant): gen_12's class, the letter's own
      when-then chain, crossing the 9:14/9:15 verse-break. EVENTS:
      exactly THREE — the triple va-yomer frame (9:8 to Noach and
      sons; 9:12 the sign named; 9:17 the seal, to Noach alone):
