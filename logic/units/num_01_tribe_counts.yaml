          NM01B-03]. THE CENSUS'S NUMBER GRAMMAR, MEASURED ON EVERY NUMBER OF
          1:1-4:20: a unit immediately before 'hundreds' multiplies;
          'thousand'/'thousands' WITHOUT the conjunction multiplies the whole
          group before it ('six and forty thousand' = 46,000; 'six hundred
          thousand'); 'AND a thousand' is an addend (3:50 = 1,365; the form's
          three Torah seats Exod 38:25, Num 3:50, 26:51); 'from' and 'a
          hundred of' are consonantal homographs told apart by their vowels
          (3:49-50 against 2:9-31); a doubled numeral is distributive (3:47
          'five, five'). THE ENGINE'S NUMERAL PARSER CANNOT READ THE CENSUS
          (measured: cold_run_sequence.ink_numbers on 1:21 gives 1,546 for
          46,500; on 3:39 1,020 for 22,000; on 1:46 two numbers for one) —
          Genesis's and Exodus's grammar has no thousands and reads 'two' as
          'years': the compile sitting's item.
        cites: ["Onkelos Num 1:21"]
