    would have SPOKEN to Abraham") — unique in the Torah, and the
    Kitzur's arithmetic rides the letters: 40+30+30 = ONE HUNDRED,
    the father's age one verse earlier; the Masorah's pair-leg is
    the watchman oracle (Isa 21:11-12; edge — "Aram's fall in
    Abraham's merit"). THE DEATH-WORD IS ALWAYS FULL
    [G37-11/12/13, Minchat Shai on 21:16, the Ramah's rule]:
    במות in Hagar's cry ("let me not look on the DEATH of the
    child") plene with vav, per the whole-Torah rule proven at
