    en: >
      TIME: t0 + one mark (t1 — the separation receipt). WORLD: ONE
      install (mizbeach_chevron — the corpus's sixth built thing,
      Abram's third altar) + 12 presupposed reads flagged
      (mitzrayim, ha_negev, beit_el, ha_ai, MIZBEACH_BEIT_EL — a
