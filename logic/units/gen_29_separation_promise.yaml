      ha_yarden, sedom, amora, tzoar, eretz_kenaan, mamre, chevron).
      REGISTRY: ZERO writes (13:4's call is invocation, not naming).
      EVENTS: 16 narrative + 4 declares + 1 result. SPECS: FOUR
      pushed, ONE popped — the pop is the corpus's FIRST HUMAN-
      DEMAND RECEIPT (hipared -> va-yipardu, the demand's own
      niphal verb and preposition; SETTLED CYCLE #7 claimed,
      flagged) — and THREE stand OPEN at the wall:
      LET-NOT(tehi(merivah, bein_avram_u_ven_lot)) — the first
      human negative demand (AL's Torah debut); no verse ends the
      strife [OPEN]; LET(sa_u_ree(avram, tzafonah_va_negbah_va_
      qedmah_va_yamah)) — no seeing by Abram is narrated [OPEN];
      LET(qum_hithalekh(avram, ba_aretz_le_arkah_u_le_rachbah)) —
      13:18's verbs are tent/come/dwell/build, not the walk's
      [OPEN]. THE INVERSION OF GEN_28: there, three open, all
      human, zero settled — the machine owed everything; here, one
      human demand SETTLES (the peace-plea's), and what stays open
      is one human wish against strife and two divine commands.
      Standing facts (14 fact-lines): the company roster, the
      heavy-wealth triple (kaved 3513 token 1; kesef debut), the
      ktiv/qere tent-at-the-first, Lot's tent-and-flock kit, the
      land-cannot-bear pair (yachdav debut x2), the strife +
      two-nations notice (az token 3 LANDED; Perizzite outside the
      table), the brotherhood ground (ach token 15, verse-final
      anachnu), the whole-land premise + the two-hapax offer-halves
      (3231/8041, one token each), the watered-plain clause with
      the proleptic destruction (shachat token 8; gan token 14 —
      Eden's word out of Eden; boakhah Tzoar), the Sodom verdict
