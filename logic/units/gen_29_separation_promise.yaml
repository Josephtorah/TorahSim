      word, on the silluq). TESTS: EMPTY. LEDGER: EMPTY. FLAGS:
      read_before_install x12. THE GEOMETRY IS THE STATE: up,
      back, apart — then four compass points, a length, a breadth,
      and a forever; the quarrel died of distance, not decree; the
      land that could not carry two men is pledged whole to one of
      them, in dust-arithmetic no man can finish, while the other
      man's tent-rope runs out at Sodom.

exports:
  - id: EXPORT_first_receipted_human_demand
    he: הִפָּרֶד נָא מֵעָלָי … וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
    he_translit: "hipared na me-alai … va-yipardu ish me-al achiv"
    en: "SETTLED CYCLE #7 CLAIMED [flagged]: the corpus's FIRST FULFILLED HUMAN DEMAND — 13:9's hipared na me-alai ('separate, please, from me'; niphal imperative, human issuer, gen_13's class) is popped by 13:11's va-yipardu ish me-al achiv in the demand's OWN verb, stem, and preposition, and 13:14's narrator timestamp (acharei hipared-lot) countersigns it inside the divine speech's frame [no ka-asher formula — verb-identity receipt, delta named]; every prior human demand stands open (gen_13's shema, gen_28's imri/qach/va-lekh); the queue's full state INVERTS frozen gen_28: there 3 open all-human 0 settled, here 1 human settle + 3 open (the first human LET-NOT — al-na tehi merivah, the AL-particle's Torah debut, born refusing a quarrel and never popped: they part, but no verse says the strife died — and two divine commands with no narrated receipt: no seeing by Abram, no walking, only tent/come/dwell/build)"
