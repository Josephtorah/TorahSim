    he_translit: "lekha etnenah u-le-zarakha ad-olam"
    en: "THE PERPETUITY FORMULA ENTERS THE LAND-PLEDGE [flag 1 — the unit's boldest call, held as promise-FACT pair, NOT INVARIANT]: ad-olam ('until forever') is the corpus's FIRST — olam token 6 after Eden's live-forever, the 120-year limit, the men of old, and the covenant pair — and the span's own ad ('until') runs Beit-El, Sodom, forever [places, then out of places]; ETNENAH is natan's ('give') first OBJECT-SUFFIXED form ('I will give IT'), spoken twice — at 13:15's etnachta AND as the divine speech's LAST WORD on 13:17's silluq; the recipient expands from 12:7's seed-only to LEKHA first; the weigh: gen_20's INVARIANT law ('no possible execution receipt'), gen_21's ('no single execution event'), and gen_22's own giving-with-perpetuity held as HOLDS (9:12, expr quoted) all cut to FACT — the ad-olam perpetuates the TENURE, not the pledging, and the corpus receipts the giving later in its own grammar (15:18 natati, named-only); the dust-rider: manah ('count') debuts x2 and its ONLY other Torah token is Bilam's mi manah afar yaakov — all three tokens count dust-seed; afar ('dust'), the death-sentence word (2:7, 3:14, 3:19), becomes the census-unit of the future"
  - id: EXPORT_eden_double_at_the_jordan
    he: וַיִּפָּרְדוּ … כְּגַן־יְהוָה
    he_translit: "va-yipardu … ke-gan-YHWH"
