  - id: EXPORT_return_and_the_sixth_altar
    he: אֶל־מְקוֹם הַמִּזְבֵּחַ … וַיִּבֶן־שָׁם מִזְבֵּחַ לַיהוָה
    he_translit: "el-meqom ha-mizbeach … va-yiven-sham mizbeach la-YHWH"
    en: "the return and the sixth install: 13:1's va-yaal closes frozen gen_28's named inclusio (quoted, LANDED); the stages retrace gen_27's road to a FROZEN INSTALL the standalone machine can only READ (mizbeach_beit_el presupposed — the first re-visit of an installed object across a frozen wall; the letter's own verb delta: BUILT at 12:8, remembered MADE at 13:4); the call-formula lands exactly where frozen gen_27's reviewer note put it (13:4 = the first sham-interposed variant of the strict-adjacency roster 4:26/12:8/26:25); az ('then') token 3 lands gen_27's roster beside a qara-be-shem a third time; AHAL ('to tent') — both Torah tokens inside this unit, one per parted man (Lot toward Sodom, Abram toward Hebron); the unit closes with banah token 10, mizbeach token 6, WORLD += mizbeach_chevron (gen_20's device, gen_27's sibling-naming; tokens 7-8 of the altar-word are the binding's) — and the walk-command stays open above it: the survey (13:17, the hitpael stem's first imperative — LAND-valence; gen_14's companionship thread precisely delimited, no amend) is never narrated walked"

