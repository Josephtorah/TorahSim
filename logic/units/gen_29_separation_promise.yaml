    status: verified
    work_en: "Onkelos Genesis 13:1-18 — read Tier-A at derive time (18 sequential fetches, 0.5s spacing, Data/FETCHLOG.md 2026-08-03)"
    he: בִּישִׁין בְּמָמוֹנְהוֹן וְחַיָּבִין בִּגְוִיָּתְהוֹן
    he_translit: "bishin be-mamonhon ve-chayavin bi-gviyat-hon"
    en: >
      The span's translation witness — headline: THE BUFFER ITEMIZES
      THE INDICTMENT. 13:13's two bare adjectives (raim ve-chataim,
      'evil and sinners') become two CHARGE-DOMAINS: 'evil WITH
      THEIR MONEY and guilty WITH THEIR BODIES' (bishin be-mamonhon
      ve-chayavin bi-gviyat-hon) — the letter files no particulars;
      the Aramaic files two, plus the standing kodam-distancing
      ('before YHWH' for 'against YHWH') [find-class: the buffer
      supplies the bill of charges the letter withholds —
      dual-track, flagged]. SECOND FIND: the two Torah-hapax
      direction-verbs of 13:9 (ve-eminah 'I will go right' /
      ve-asmilah 'I will go left') VANISH — the buffer flattens the
      body-relative pair to compass prepositions ('if you to the
      NORTH, I to the SOUTH...', le-tzipuna/le-daroma): the letter's
      coined verbs die untranslated; the humility of 'whichever
      hand you take' becomes cartography. THIRD: 13:16's dust-dare
      becomes a VERDICT — 'just as it is NOT POSSIBLE (la efshar)
      for a man to count... so your sons will NOT BE COUNTED': the
      letter's open conditional closed by the buffer. Watch-points
      answered: AD-OLAM KEPT EXACTLY (ad alam, 'until forever' —
      the perpetuity formula survives translation); the GARDEN
      KEPT (ke-ginta da-YHWH — no Eden-shyness, though the
      destroying is nominalized: kodam CHABALUT YHWH, 'before the
      DESTRUCTION of YHWH'). Repeat buffers consistent with frozen
      records: va-yiqra be-shem -> VE-TZALI ('prayed') — gen_27's
      call-as-prayer policy, landed; la-YHWH (altar) -> KODAM YHWH
      — gen_20/gen_27's dedication-distancing, third altar running;
      kaved -> TAKIF ('severe') — the same Aramaic gen_28 recorded
      for the famine's kaved: the buffer re-fuses the sibling
      lemmas; na -> khe-an ('now') x3 — the please-particle
      temporalized again (gen_28's policy); ohel -> MASHKAN-forms
      (mashkneh/mashkenin — the tent rendered with the sanctuary's
      noun-family); elonei Mamre -> MEISHREI ('plains of') Mamre —
      the tree-site de-arborized; riv AND merivah -> one noun
      (matzuta) — the buffer merges the strife-pair the letter
      split; zera -> bnakh ('your sons') — seed concretized.
    comment_en: "Read from Data/sefaria_texts/ (local; FETCHLOG is provenance). Dual-track; not merged."
