  genre_note_en: >
    The corpus's first VISION and its first true DIALOGUE between God
    and a human since Eden's interrogation — but this time the human
    opens. The chapter runs on question-grammar and gift-grammar: two
    questions of Abram (what will You give; how shall I know), two
    answers that outrun them (stars; a map from river to river), one
    rite in which the only human deeds are taking, cutting, and
    keeping vultures off, and a decree that files four hundred years
    of affliction as standing fact between a fear-not and a
    burial-promise. The letter clocks it by the sun going down twice
    and seals it with a perfect verb: I HAVE given.
