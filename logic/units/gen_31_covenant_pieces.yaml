boot_steps:
  - id: STEP_Gn_15_1
    order: 1
    ref: "Gen.15.1"
    op: THE_WORD_THE_SHIELD_AND_THE_FEAR_NOT
    he: אַחַר הַדְּבָרִים הָאֵלֶּה הָיָה דְבַר־יְהוָה אֶל־אַבְרָם בַּמַּחֲזֶה לֵאמֹר אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד
    he_translit: "achar ha-devarim ha-eleh hayah devar-YHWH el-avram ba-machazeh le-mor al-tira avram anokhi magen lakh sekharkha harbeh meod"
    en: "[EN-AID/JPS] After these things the word of the LORD came unto Abram in a vision, saying: 'Fear not, Abram, I am thy shield, thy reward shall be exceeding great.'"
    tree_left:
      he: אחר הדברים האלה היה דבר־יהוה אל־אברם במחזה לאמר
      he_translit: "achar ha-devarim ha-eleh hayah devar-YHWH el-avram ba-machazeh le-mor"
      en: "after these things, the word of YHWH to Abram in a vision (etnachta arm ends on le-mor)"
    tree_right:
      he: אל־תירא אברם אנכי מגן לך שכרך הרבה מאד
      he_translit: "al-tira avram anokhi magen lakh sekharkha harbeh meod"
      en: "fear not — I am your shield; your reward exceedingly great: the verse ends on harbe meod"
    operators:
      - op: EVENT
        expr_en: "come(e1) ∧ Theme(e1, devar_YHWH) ∧ Goal(e1, avram)"
        he: הָיָה דְבַר־יְהוָה אֶל־אַבְרָם בַּמַּחֲזֶה
        he_translit: "hayah devar-YHWH el-avram ba-machazeh"
        en: >
          THE PROPHETS' FORMULA, BORN: hayah devar-YHWH el ('the
          word of YHWH came to') — the construct-adjacency census
          finds devar-YHWH's only two Genesis tokens at 15:1 and
          15:4, and no other Torah verse carries this frame (Exod
          9:20-21's 'feared the word of YHWH' is a different
          syntax): the sentence that will open the prophetic books
          debuts here and leaves the Torah [census, prose].
          BA-MACHAZEH ('in a VISION') — TORAH DEBUT; the
          vision-word's only other Torah tokens are Num 24:4 and
          24:16: BILAM's visions — the genre-word belongs to this
          night and to a foreign seer [census, prose]. Onkelos
          names the genre outright: ba-machazeh -> BI-NEVUAH ('in
          PROPHECY') [dual-track]. ACHAR HA-DEVARIM HA-ELEH
          ('after these things') — the davar-word carries both
          senses in one verse: after these THINGS, the WORD came
          [letter fact].
        cites: ["TIR-014"]
        confidence: tested
      - op: DECLARE
        expr_en: "DECLARE(YHWH, LET-NOT(tira(avram)))"
        he: אַל־תִּירָא אַבְרָם
        he_translit: "al-tira avram"
        en: >
          THE FIRST DIVINE PLEA-NEGATIVE [flag 3]: AL token 2 —
          token 1 is 13:8, Abram's own al-na ('let there be no
          strife'), and the controlling class is frozen gen_29's,
          quoted: 'DECLARE(avram, LET-NOT(tehi(merivah,
          bein_avram_u_ven_lot)))' with 'AL — the plea-negative
          particle's TORAH DEBUT, born in peace-making' — the
          particle born in Abram's mouth is aimed back at him as
          the corpus's first divine fear-not. TIRA is a JUSSIVE
          (HVqj2ms — the LET-NOT class's native coded mood,
          DB-verified) [TIR-034]. Pushed; OPEN at the wall — a
          LET-NOT has no resolution path (the S10 contract), and
          the letter's sequel is its own commentary: the dread of
          15:12 falls on the man told not to fear [prose]. YARE
          ('fear') token 2 — token 1 is 3:10, Adam's va-ira ('I
          was AFRAID') in the garden: the fear-verb's first two
          tokens are a hiding man and a shielding God [census,
          prose].
        cites: ["TIR-034"]
        confidence: tested
