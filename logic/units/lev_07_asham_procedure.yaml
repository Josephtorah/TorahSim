          wrong intent — the asham stays fit (Section 5 8; Zevachim 1:1).
          The sin offering precedes it except the leper's (Zevachim 10:5),
          and 7:1's 'the law' puts even the leper's blood below the red line
          (Section 5 1-2). The Lev 5 engine now calls this law for its guilt
