    comment: >
      The book's tenth reading, at the chapter's grain (chapter 12 as one
      draft — the header and the demolition, the place the LORD will choose with the offerings brought there and the rest and the inheritance, the burnt offerings only there, the profane slaughter with the blood poured like water and the gates, the border enlarged with the slaughter as commanded and the altar, the nations cut off and the abomination; no portion edge inside it — Re'eh holds it whole),
      ONE run and its tail under the cost rules and every row whole under
      the whole-row rule: Onkelos Deuteronomy 12:1-31 whole and fresh (the
      export's thirty-one rows the DB's thirty-one — the identity,
      asserted; the English's 12:32 the DB's 13:1); THE SIFREI ON
      DEUTERONOMY ON THE CHAPTER — piskaot 59-81, twenty heading on the
      chapter's verses and three without a head citation (68, 73, 74)
      folded in on their consonants, one hundred and fifty-nine rows read
      whole in both files (five prior reads of four rows found in the
      earlier ledgers by computation and reread whole), seven rows outside
      the spine citing the chapter read whole (the rest as the Land, the
      firstling and the second tithe, the rejoicing, the Asherah not
      planted, the order of offerings, build anywhere, the blood's reward;
      none excluded), the kin's spine (Leviticus 17:1-16, Numbers 18:8-32,
      7:5 and 7:25-26, Leviticus 20:2-5 and 18:21, Numbers 33:52, Exodus
      23:24; Exodus 20:21 through the Mekhilta) credited by name from the
      earlier ledgers. Ledger deu_12_reeh_2026-09-20.md, coverage computed by
      script (197 sources), the ink facts computed from the Tanakh DB and
      the snapshot store (121 asserts — five fell on the first typed pass,
      forms not facts, retyped from the print), the engine's numeral parser
      measured on every verse (one number verse, 12:14 "in one of" [1]; one
      starred token, 12:17's tithe; no ordinal; no gap), no written/read
      pair in the chapter, every quotation cut by consonants (no miss).
      Seated as claims DV12-01..06: the header and the demolition: these are the statutes and the judgments which you shall keep to do in the land which the lord the god of your fathers has given you to possess, all the days that you live on the earth; destroy, you shall destroy all the places where the nations you are dispossessing served their gods, on the high mountains and on the hills and under every leafy tree; tear down their altars, break their pillars, burn their asherim in fire, cut down the images of their gods and destroy their name from that place; you shall not do so to the lord your god; the place chosen: but to the place which the lord your god will choose from all your tribes to put his name there — his dwelling you shall seek, and you shall come there; bring there your burnt offerings and your sacrifices, your tithes and the heave offering of your hand, your vows and your freewill offerings and the firstlings of your herd and your flock; eat there before the lord your god and rejoice in all you put your hand to, you and your households, wherein he has blessed you; you shall not do as all that we do here today, every man what is right in his eyes, for you have not yet come to the rest and the inheritance; when you cross the jordan and dwell in the land and he gives you rest from all your enemies round about and you dwell in safety, then the place which the lord your god will choose to make his name dwell there — there you shall bring all that i command you, your burnt offerings and sacrifices, your tithes and the heave offering of your hand and all the choice of your vows; and you shall rejoice before the lord your god, you and your sons and daughters, your menservants and maidservants, and the levite within your gates, for he has no portion nor inheritance with you; the burnt offerings only there: take heed to yourself lest you offer your burnt offerings in every place that you see; but in the place which the lord will choose in one of your tribes, there you shall offer your burnt offerings and there you shall do all that i command you; the profane slaughter, the blood and the gates: only, with all the desire of your soul you may slaughter and eat flesh according to the blessing of the lord your god in all your gates, the unclean and the clean may eat it, as the gazelle and as the hart; only the blood you shall not eat — on the earth you shall pour it like water; you may not eat within your gates the tithe of your grain, wine and oil, the firstlings of your herd and flock, your vows, your freewill offerings or the heave offering of your hand, but before the lord your god in the place he will choose — you and your son and daughter, your manservant and maidservant and the levite within your gates — and rejoice before the lord your god in all you put your hand to; take heed to yourself lest you forsake the levite all your days on your land; the border enlarged and the altar: when the lord your god enlarges your border as he has spoken to you and you say 'let me eat flesh', for your soul craves flesh — with all the desire of your soul you may eat flesh; when the place he will choose to put his name there is too far from you, slaughter of your herd and flock as i have commanded you and eat within your gates; as the gazelle and the hart are eaten so you shall eat it, the unclean and the clean together; only be steadfast not to eat the blood, for the blood is the life, and you shall not eat the life with the flesh — pour it on the earth like water, that it may go well with you and your children after you when you do what is right in the eyes of the lord; only your holy things and your vows you shall take up to the place he will choose, and offer your burnt offerings, the flesh and the blood, on his altar — the blood of your sacrifices poured on the altar and the flesh eaten; observe and hear all these words which i command you, that it may go well with you and your children after you forever, when you do the good and the right in the eyes of the lord your god; the nations cut off and the abomination: when the lord your god cuts off the nations whither you go to dispossess them, and you dispossess them and dwell in their land — take heed to yourself lest you be ensnared after them after they are destroyed from before you, and lest you inquire after their gods, saying: how did these nations serve their gods? and i will do so too; you shall not do so to the lord your god, for every abomination of the lord which he hates they did for their gods — even their sons and their daughters they burn in the fire to their gods.
      The compile (the place a variable the run assigns — the stations of
