    en: >
      The span's translation witness — HEADLINE: THE PRAYER DOUBLE
      THAT UN-NAMES GOD. At 16:11 ki-shama YHWH el-onyekh ('for
      YHWH has HEARD your AFFLICTION') becomes arei QABIL YHWH
      TZELOTIKH ('YHWH has RECEIVED your PRAYER' — the affliction
