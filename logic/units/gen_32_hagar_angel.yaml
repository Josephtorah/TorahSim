    The corpus's first surrogacy crisis and its first annunciation:
    a chapter run entirely on institutional words born for it
    (mistress, restrained, built-from, wild-ass, the angel) and on
    verbs handed from party to party — give and take pass from
    God's covenant to Sarai's transaction, the afflict-verb passes
    from decree to deed to command, the naming-verb passes from
    an angel's decree through a slave's mouth onto God Himself and
    back down to a father naming a son. Between a barren wife's
    two speeches and an old man's one permission, the letter sends
    its first angel to the one person in the story no one asked.
