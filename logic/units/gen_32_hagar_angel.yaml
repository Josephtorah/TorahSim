      men') and the hand-clauses turned economy ('he will be
      NEEDY of all, and the hands of men will be NEEDY of him')
      — the wild-ass domesticated to mutual commerce
      [dual-track]. REPEAT BUFFERS CONSISTENT WITH FROZEN
      RECORDS: 16:2's va-yishma le-qol -> VE-QABIL le-MEIMAR
      ('accepted the WORD') — the EXACT buffer frozen gen_11
      recorded at 3:17: the two wife-listenings get one
