    en: >
      TIME: t0 + one mark (t1 — the RESULT at 16:4). WORLD: ZERO
      installs (a well is NAMED, never built — gen_25's discipline) +
      3 presupposed reads flagged (shur, qadesh, bered). REGISTRY:
      TWO WRITES — the unit's signature: YHWH->El_Roi (a slave-woman
      naming God — flag 1, the boldest; the named_before_any_presence
      flag stands as expected data) and yishmael->Yishmael (the
      father performing the angel's decree) — machine-asserted at
      both stations. EVENTS: 17 narrative + 4 declares + 2 namings +
      1 pattern. SPECS: FOUR pushed, ONE popped, THREE OPEN — the
      queue's story: the wife's bo settled in its own verb (cycle #9
      claimed; the first woman-issued demand and the first
      machine-asserted settle since the creation-week receipts); the
      wife's yishpot-on-GOD open (the corpus's first human demand on
      God — no judging narrated; flag 2); the husband's do-good
      permission open forever over an afflict-deed (the verb-swap —
      the machine does not equate what the letter distinguishes;
      flag 4); the angel's return-and-submit open (no return
      narrated; flag 5). Standing facts (18 + the PATTERN): the
      barrenness and the maid (gen_28's prediction landed), the
      restrained-womb theology (hers), the build-plea, the ten
      years and the wife-promotion, the contempt (the 12:3
      guard-verb's first firing, in the house), the flood-word
      grievance and the female natati, the where-questions and the
      runaway's testimony, the doubled multiply-promise and the
