      wild-ass oracle pair, the naming-ground (hagam halom), the
      well-etiology (the al-ken formula's fourth token) and its
      coordinates, the age-frame. TESTS: EMPTY (ha-tov idiomatic —
      no instrument fires). LEDGER: EMPTY. FLAGS:
      read_before_install x3 + named_before_any_presence x2 (YHWH;
      yishmael — both expected data: neither entity installed;
      flags never block). THE SHAPE IS THE STATE: a household
      passes give and take through three hands, a demand settles in
