exports:
  - id: EXPORT_the_name_on_YHWH_and_the_registry_pair
    he: וַתִּקְרָא שֵׁם־יְהוָה הַדֹּבֵר אֵלֶיהָ אַתָּה אֵל רֳאִי … וַיִּקְרָא אַבְרָם שֶׁם־בְּנוֹ … יִשְׁמָעֵאל
    he_translit: "va-tiqra shem-YHWH ha-dover eleha atah el roi … va-yiqra avram shem-beno … yishmael"
    en: "THE NAME-ON-YHWH WEIGH [flag 1, boldest — staged both ways, owner triages]: 16:13 carries the FULL va-tiqra naming formula with an explicit agent, so the NAME class fires (gen_25's formula-rule quoted both ways; gen_12/13's name(kayin)/name(shet) class) — the REGISTRY takes YHWH->El_Roi from an Egyptian slave-woman, the corpus's ONLY human-names-God event (named_before_any_presence stands as expected data; the alternative — spoken-fact only, a reverence-exception — would be NEW LAW and is staged for the owner); EL token 5 lands frozen gen_30's El-ladder line verbatim (El Elyon's four, then a slave's El Roi); the roi-skeleton sits on three consecutive thrones (16:13 x2, 16:14); the al-ken well-naming takes PATTERN with NO name-op (the formula's fourth token census-exact: 2:24, 10:9, 11:9, 16:14 — gen_25's bare-perfect rule quoted); the pre-birth decree (16:11's weqatal ve-qarat) is FACT not demand; and the father performs the mother's decree at 16:15 (name(yishmael) := Yishmael — gen_13's alternation line continues): four naming acts, four grammars, four different machine classes — and Onkelos DISSOLVES the boldest one (ve-tzalliat, 'she PRAYED' — the buffer un-names exactly what the machine registers) [dual-track tension, flagged]"
  - id: EXPORT_the_household_queue_and_cycle_9
    he: בֹּא־נָא אֶל־שִׁפְחָתִי … וַיָּבֹא אֶל־הָגָר … יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ … עֲשִׂי־לָהּ הַטּוֹב בְּעֵינָיִךְ … שׁוּבִי … וְהִתְעַנִּי
    he_translit: "bo-na el-shifchati … va-yavo el-hagar … yishpot YHWH beini u-veinekha … asi-lah ha-tov be-einayikh … shuvi … ve-hitani"
    en: "THE HOUSEHOLD QUEUE — four demands, three issuers, three verdicts of openness: SARAI IS THE CORPUS'S FIRST FEMALE DEMAND-ISSUER (bo — TIR-027; gen_13's Lemekh device made wives addressees, never issuers) and her demand SETTLES IN ITS OWN VERB one verse later (va-yavo — cycle #9 claimed on gen_17's class, the SAME verb bo that settled #2 for Noach's ark; and the pop is MACHINE-ASSERTED: SPECS empty at 16:4, the first mechanically-proven settle since the creation-week receipts); her SECOND demand aims AT GOD (yishpot — shafat's debut, true jussive HVqj3ms, the jussive-LET class per gen_30's yiqchu device: the corpus's first human demand on God, OPEN — no judging narrated; flag 2); Abram's do-good permission (asi — his only line) stands OPEN FOREVER over an afflict-deed — the VERB-SWAP: asah commanded, anah done, and RESULT pops only the demand's own string (the machine does not equate what the letter distinguishes; flag 4); the angel's compound shuvi_ve_hitani (gen_31's compound device) stands OPEN — no return narrated (flag 5); around the queue: chamas token 3 (the flood-cause word as household grievance — gen_16's lines quoted), the female natati (the receipt-grammar's first woman speaker, one chapter after gen_31's covenant natati), and the 12:3 guard-verb qalal firing first between the patriarch's two women (gen_27's verse)"
  - id: EXPORT_the_angel_field_and_the_landings
    he: וַיִּמְצָאָהּ מַלְאַךְ יְהוָה עַל־עֵין הַמַּיִם … כִּי־שָׁמַע יְהוָה אֶל־עָנְיֵךְ
    he_translit: "va-yimtzaah malakh YHWH al-ein ha-mayim … ki-shama YHWH el-onyekh"
    en: "THE ANGEL CLASS OPENS ON A SLAVE: malakh YHWH debut x4 (tokens 5-6 are Sodom's pair) — born FINDING (matza token 7: the verb of the failed helper-search, Cain's dreaded finders, Noach's favor, and the dove reaches its first divine finding of a person) a runaway at a spring the lexicon splits from the contempt-eyes (5869 a/b — the lemma-split class); the where-ladder's third firing (ayeka to Adam, ei to Cain, ei-mizeh to Hagar) with the whither-word's debut; THREE consecutive angel re-launches carrying a promise in the DIVINE FIRST PERSON (the letter's slide, held), the doubled multiply-formula's second firing (3:16 Chavah's pain -> 16:10 Hagar's seed -> 22:17 Abraham's oath — census-exact), and the corpus's first ANNUNCIATION (hinakh harah; the pre-birth name-decree; the name as the hear-verb's monument: shama tokens 7-8 in-span — Abram heard the wife, YHWH heard the maid, and the child is YISHMA-EL); FROZEN gen_31's three staged landings all land quoted (anah tokens 2-3 at 16:6/16:9; safar token 3 at 16:10; shuv token 13 at 16:9) — the afflict-decree of 15:13 fires FIRST in Abram's house, on an Egyptian, one chapter after it was spoken [cross-unit prose + [OPEN], nothing pops; Ramban's verdict named-only]"
