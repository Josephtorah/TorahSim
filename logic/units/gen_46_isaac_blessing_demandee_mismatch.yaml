    comment: >
      Genesis 27:1-40 under the owner-and-Claude span ruling (the
      grudge and the flight, 27:41-28:9, derived later as the next
      unit). The first NEW derivation after the amendment wave: ten
      planned pieces of four verses, pieces one through seven each
