      letter's own; the blessing stacks jussives while the
      anti-blessing of 27:39-40 carries ZERO jussives, pure
      indicative futures — the grammar itself splits blessing from
      anti-blessing; the written/read double-row bow of 27:29 ruled
      ONE jussive, not two; the interrogative etiology of 27:36 and
      the false "I am Esau" both left without name writes.
    confidence: reconstructed
  - step: E
    name_en: "Machine design"
    comment: >
      End depth TWELVE open — the deepest queue in the corpus, and
      the openness is the finding: the hunt-compound on Esau
      (demandee-mismatch), the two listen-and-fetch demands on Jacob
      (the bring-limb object-mismatched), the rise-sit-eat and
