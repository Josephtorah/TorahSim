      The CENTERPIECE, encoded letter-faithfully and said loudly: the
      DEMANDEE-MISMATCH MACHINE. Isaac's hunt-chain at 27:3-4 — five
      second-person volitives in one breath to one addressee — rides
      ONE compound demand pushed on ESAU alone. Jacob later performs
      the content but is never the demandee: by the machine's own
      addressee standard the compound can NEVER pop — the blessing is
      obtained over an unpaid demand, and the queue itself exhibits
      the deception. Also filed unit-wide: the retelling fence over
      Rebecca's report of Isaac's speech; the bless-events asymmetry
