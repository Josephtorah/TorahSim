  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_46_2026-08-08.md; manifest verified
    21/21 checkable, zero FAILED, two builder-asserted manual
    rows). CROWNS (chain-attested + DB-verified). THE LEAN VOICE
    OF JACOB [G46-01, Minchat Shai on 27:22; Bereshit Rabbah 65]:
    הקל קול יעקב ("THE VOICE is the voice of Jacob, but the hands
    are Esau's hands") — the sentence's first voice-word written
    DEFECTIVE and UNIQUE in the whole Torah (one lean the-voice
    token), while its own echo in the same breath runs full: the
    midrash rides exactly this — when Jacob's voice goes lean in
    the synagogues and study-houses, Esau's hands prevail. THE
    HUNT'S EXTRA LETTER [G46-02, Minchat Shai on 27:3, the Ramah;
    Kitzur]: צידה ("hunt me GAME") — WRITTEN with a closing heh,
    READ without it (both tokens side by side on SNAPSHOT): the
    Ramah's one extra-heh of its kind in the Torah; the Kitzur
    reads the surplus five-letter as the FIVE laws of slaughter
    Isaac taught with the hunt. THE BOW-VERBS, ONE LEAN ONE FULL
    [G46-03, Minchat Shai on 27:29, the Ramah's Masorah]:
    וישתחו לך לאמים ("peoples shall BOW to you") — written one closing vav, read doubled (a written/read token pair), while the verse's
    second bow-verb is written with both vavs: the lean and the
    full side by side in the blessing (the Kitzur counts the lean
    vav toward Edom's six served generations). THE BLESS-CAREER
    COMPLETED [G46-04/05, Minchat Shai on 27:29, the Ramah's
    three-list]: ומברכיך ("and THOSE WHO BLESS YOU — blessed") —
    plene with the yod, the middle station between Abraham's call
    (מברכיך, 12:3) and Balaam's mouth (Num 24:9): the whole
    three-token career plene, letter-exact (run 4's
    vocalization-law crown gains its center link). THE PAUSE THAT
    SAVES THE SENTENCE [G46-06, Minchat Shai on 27:19; the Zohar;
    Bereshit Rabbah 65:16]: אנכי עשו בכרך ("I am... Esau your
    firstborn") — the tradition cuts Jacob's words at אנכי ("I am
    who I am; Esau is your firstborn"; R. Levi: "I am — destined
    to receive the Ten Utterances"), and SNAPSHOT's own accent
    carries the cut: אנכי under pashta (the postpositive
    disjunctive) — the saving pause is in the letter's music. THE
    TWO PRESSED BLESS-ME'S [G46-08, Minchat Shai on 27:19 +
    27:31]: תברכני ("that your soul may BLESS ME") — the nun
    dageshed as ruled, and the same pressed nun returns in Esau's
    mouth (27:31, builder-asserted): the disguised request and
    the desperate one pointed identically. THE CRY THAT RETURNS
    [G46-15, Minchat Shai on 27:34, the Masorah's mirror-set]:
    ויצעק צעקה ("Esau CRIED an exceedingly great and bitter CRY")
    — the doubled cry-figure once in the Torah (verified by
    adjacency); the mirror is Mordechai's great and bitter cry
    (Esth 4:1; edge): the extorted cry repaid on the decree-day —
    the two bitter cries filed as one pair. THE DECEIT REPAID IN
    KIND [G46-16, Kitzur on 27:35]: במרמה ("your brother came
    WITH DECEIT") — exactly twice in the Torah: Jacob's deceit
    here, his own sons' answer at Shechem (34:13) — the word
    returns on the deceiver's house in a two-token lock. THE
    BLESSING'S LADDER [G46-17, Kitzur on 27:36]: ברכתי ("my
    blessing") — four consonantal tokens: Esau's "he TOOK my
    blessing" (27:36), Jacob's restitution "TAKE, please, my
    blessing" to Esau's face (33:11), God's "I will COMMAND my
    blessing" (Lev 25:21) — taken, returned, commanded; the
    fourth is the verb at Ishmael's promise (17:20, homograph
    named). THE TWO-WAY SERVE-VERB AGAIN [G46-18, Minchat Shai on
    27:40; Bereshit Rabbah 67]: ואת אחיך תעבד ("your brother you
    shall SERVE") — defective, and the whole family lean: תעבד
    twelve Torah tokens, no plene (builder-asserted), from Cain's
    soil to the labor-commandment; the midrash reads the
    reversal in the missing vav exactly as at the twins' birth
    (frozen G43-03). THE TEN-WORD DEW-BLESSING AND THE
    NAME-COUNT [G46-19/20, Kitzur on 27:28-29]: ויתן לך — the
    dew-verse counts exactly TEN words (machine-checked;
    against the Ten Utterances), and the whole blessing
    TWENTY-SIX read words (ten plus sixteen, the written/read
    bow-pair counted once, builder-asserted): the blessing
    carries the four-letter Name's own number. THE SWORD AT THE
    BOOK'S MIDDLE [G46-23, Minchat Shai on 27:40, manual]:
    ועל חרבך תחיה ("by your sword you shall live") — the
    Masorah's half-of-Genesis marker (its verse-total: 1,534);
    SNAPSHOT's versification counts 1,533 with 27:40 standing
    768th — one seam off the arithmetic middle: the verse-count
    split between the Masorah's total and the codex line is
    itself the finding (variance, named). SMALLER CROWNS
    [G46-07/10/11/12/13/14/21/22]: מצידי ("of my game," 27:19)
    plene against the old correction-book; מראת ("dimmed from
    SEEING," 27:1) unique and lean; כמתעתע ("as a mocker,"
    27:12) unique, first tav soft; the hairy brother's two lean
    tokens (שער 27:11, שערת 27:23) — SNAPSHOT with Minchat
    Kohen's retraction, the goat-reading four-list a named
    dispute; ואברכהו ("and I BLESSED him," 27:33) with the vav
    in qamatz (the past-converter) against its future-pointed
    pair at Abraham's verse (Isa 51:2; edge — the Kitzur: the
    blessing of Abraham passes to Jacob); מי אפוא ("WHO
    then...?") — initials ו-מ-א, the letters of אמו ("his
    mother"): the Kitzur answers Isaac's question from the
    verse's own openings; הוה ("BE lord," 27:29) unique (the
    snow-command its pair, Job 37:6; edge); ולכה ("and FOR YOU
    then, what shall I do, my son?," 27:37) — the Torah's only
    heh-written dative (the two consonantal look-alikes are
    Balaam's go-imperatives, Num 22:17, 23:7). DISCREPANCY
    [G46-09, Minchat Shai on 27:27/34/41]: the chapter's four
    ruled bless-tokens — ויברכהו and ברכו (27:27), ברכני
    (27:34), ברכו (27:41) — all wanted with the resh in plain
    sheva "per our custom"; SNAPSHOT points HATAF PATACH at
    every one (builder-asserted): the sheva-vs-hataf split now
    counts EIGHT stations, all resh (gen_45's boundary result
    stands: the ayin stays bare). Watchlist. INSTRUMENT GAPS:
    קצתי ("I am weary of my life," 27:46) carries the SMALL QOF
    — letter-size layer uninstrumented (the Kitzur's
    temple-height reading named); the pause-readings at 27:19 ride the accent layer (instrumented, claimed
    above). READINGS (named-only, unclaimed): the Kitzur's
    Passover frame (וירח = "it was the day of Pesach"; the two
    kids — one for the feast, one for the offering; the נאה לך
    initials-play at 27:9); the four-exiles reading of the
    hunting-gear (27:3); the letter-count reading at 27:33 (gehinnom, "the netherworld," entering with Esau);
    Isaac's trembling read against the Rebbi-and-Antoninus
    table; the firstborn-pair בכרך (27:19 with Exod 4:23 —
    "Israel is My firstborn... I slay YOUR firstborn," the
    Kitzur's two-edged pair, named).
