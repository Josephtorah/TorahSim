    (1) CENTERPIECE — DEMANDEE-MISMATCH MACHINE.
    Isaac's hunt-chain at 27:3–4 (five 2ms volitives in one breath, one addressee:
    sa / ve-tze / ve-tzuda / va-ase / ve-havia + purpose-cohortative ve-okhela) rides
    ONE compound demand per the frozen compound class (gen_41 qach_va_lekh; gen_40
    multi-imperative single-frame) — pushed on ESAU alone. Jacob later performs the
    content (food brought, 27:14ff) but is NOT the demandee: by the machine's own
    addressee standard the compound can NEVER pop — the blessing is obtained over an
    unpaid demand, and the SPECS queue itself exhibits the deception. Encode
    letter-faithfully and say it loudly. Label: LET(sa_tze_tzuda_ase_havia(esav)).

    (2) FENCE at 27:6–7 (later pieces): Rivqah reporting Isaac's speech = FACTS
    (Excerpt A retelling fence); her own live shema be-qoli / lekh / qach (27:8–9, 13)
    = real pushes on Jacob; his 27:14 va-yelekh va-yiqach is same-root double
    performance — weigh pops with contingent labels continuing after #23-or-#24.

    (3) BLESS-EVENTS ASYMMETRY (census with total care across unit): narrated
    bless-EVENT (va-yevarakhehu, wayyiqtol) fires for Jacob; Esau's two barakhe-ni
    ("bless me, me also!") pushes at 27:34/38 are answered in SPEECH-content only —
    check whether the letter EVER narrates a bless-event on Esau in-span; if not,
    both demands stay OPEN and the withholding is the letter's own.

    (4) BLESSING JUSSIVES (27:28–29, later): ve-yiten ha-elohim ("may God give") =
    demand-on-God class per gen_32 fence, OPEN; yaavdu-kha third-party jussives =
    LET pushes; heve gevir ("be master") = benediction-imperative per gen_41 hayi
    precedent (push; content-alternative staged).

    (5) FALSE-IDENTITY FACTS (later pieces): "I am Esau your firstborn" (27:19) and
    the ani of 27:24 — the machine records speech, never adjudicates truth; hold as
    spoken facts; flag collision with gen_43 REGISTRY (names are written; the mouth
    misuses one).

    (6) CAREERS TO LAND: bekhorah token 6 at 27:36 citing gen_43's machine; tzayid
