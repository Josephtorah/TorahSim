          (Exodus 22:24 'as a creditor', 24:10-11's pledge, Elisha's widow,
          Nehemiah's usurers); 'proclaim' with liberty the jubilee's,
          Isaiah's, Jeremiah's; 'THE FOREIGNER' the book's five (14:21's
          carcass credited; 17:15, 23:21, 29:21 ahead); THE NUMBER VERSE — the
          parser reads 15:1's 'seven years' as [7] and 15:9's 'the seventh' as
          the ordinal [7]; 15:2 THE ONE VERSE THAT ADDRESSES NO ONE (the
          creditor's law in the third person) and THE HOMOGRAPH OF MOSES' NAME
