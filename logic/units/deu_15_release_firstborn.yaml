    comment: >
      The book's thirteenth reading, at the chapter's grain (chapter 15 as one
      draft — the release of debts at the end of seven years with the foreigner exacted, the needy who shall not be and shall never cease with the blessing on hearkening, the hand opened and the base thought barred, the Hebrew slave freed in the seventh year and furnished from the flock, the floor and the press, the awl through the ear into the door and the double hire, the firstling sanctified and eaten year by year at the place, the blemished eaten in the gates and the blood poured as water; no portion edge inside it — Re'eh holds it whole),
      TWO runs to two clean compaction points and the tail under the cost
      rules, every row whole under the whole-row rule: Onkelos
      Deuteronomy 15:1-23 whole and fresh (the export's twenty-three rows
      the DB's twenty-three — the identity, asserted); THE SIFREI ON
      DEUTERONOMY ON THE CHAPTER — sixteen piskaot 111-126 heading on the
      chapter's verses in verse order, no tail folded in (110's rows chapter
      14's, 126's stopping before 16:1): ninety-nine rows read whole in both
      files (two prior reads of two rows found in the earlier ledgers by
      computation and reread whole — the base thought at chapter 13, the wife
      by "for him" at Genesis 2), ten rows outside the spine citing the
      chapter read whole (six reread whole from chapters 11, 12 and 14 — the
      release after the conquest, the permanent blemish and the one dish, the
      firstling's year, the end at Booths; the blemishes at 17:1, the
      hireling's cry at 24:15 and Moses' righteousness at 33:21 fresh; none
      excluded), the kin (Leviticus 25's sabbatical, poor brother and sold
      brother; Leviticus 22:17-27 and 21:16-23; Leviticus 27:26 and Numbers
      18:15-18; Deuteronomy 12:6, 15-18, 22-24, 14:28-29 and 5:15) credited
      by name from the earlier ledgers. Ledger deu_15_reeh_2026-09-22.md,
      coverage computed by script (132 sources), the ink facts computed from
      the Tanakh DB and the snapshot store (3 asserts fell on the first typed
      pass, every one the instrument's shape; green on the second), the
      engine's numeral parser measured on every verse (four number verses —
      15:1 "seven years" [7], 15:7 "one of your gates" [1], 15:12 and 15:18
      "six years" [6]; one ordinal — 15:9 "the seventh" [7]; no gap), the
      store the DB at every verse (no written/read pair), every quotation cut
      by consonants (nine misses retyped from the export's own spellings).
      Seated as claims DV15-01..07: the release: at the end of seven years you shall make a release; and this is the manner of the release — every creditor shall release the loan of his hand which he lends to his neighbor, he shall not exact it of his neighbor and his brother, for a release has been proclaimed to the lord; the foreigner you may exact, but what is yours with your brother your hand shall release; the needy and the blessing: howbeit there shall be no needy among you, for the lord will surely bless you in the land which he gives you for an inheritance to possess — only if you diligently hearken to the voice of the lord your god to keep to do all this commandment which i command you today; for the lord your god will bless you as he spoke to you, and you shall lend to many nations and not borrow, rule over many nations and they shall not rule over you; the hand opened: if there be among you a needy one of your brothers within one of your gates in your land, you shall not harden your heart nor shut your hand from your needy brother, but open, you shall open your hand to him and lend, you shall lend him sufficient for his need; beware lest there be a base thought in your heart, saying 'the seventh year, the year of release, draws near', and your eye be evil against your needy brother and you give him nothing, and he cry against you to the lord and it be sin in you; give, you shall give him and your heart shall not be grieved, because for this thing the lord will bless you; for the needy shall never cease from the midst of the land — therefore i command you, saying: open, you shall open your hand to your brother, to your poor and to your needy in your land; the hebrew slave: if your brother, a hebrew man or a hebrew woman, be sold to you, he shall serve you six years and in the seventh year you shall let him go free from you; and when you let him go free you shall not let him go empty — furnish, you shall furnish him from your flock, your threshing-floor and your winepress, with which the lord your god has blessed you; and you shall remember that you were a slave in the land of egypt and the lord your god redeemed you — therefore i command you this thing today; the awl and the double hire: and if he say to you 'i will not go out from you', because he loves you and your house, because it is well with him with you, then you shall take the awl and put it through his ear into the door, and he shall be your servant for ever — and also to your maidservant you shall do likewise; let it not seem hard in your eyes when you let him go free, for double the hire of a hireling he has served you six years, and the lord your god will bless you in all that you do; the firstling: every firstling male that is born in your herd and in your flock you shall sanctify to the lord your god; you shall do no work with the firstling of your ox nor shear the firstling of your flock; before the lord your god you shall eat it year by year in the place which the lord shall choose, you and your household; the blemish and the blood: and if there be in it a blemish, lame or blind, any evil blemish, you shall not sacrifice it to the lord your god; within your gates you shall eat it, the unclean and the clean alike, as the gazelle and as the hart; only its blood you shall not eat — on the ground you shall pour it as water.
      The compile (the release as an effect on the debts with its onset and
      territory parameters and the prozbul's procedure from the answer sheet;
