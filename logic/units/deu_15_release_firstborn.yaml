          THE RELEASE: AT THE END OF SEVEN YEARS YOU SHALL MAKE A RELEASE; AND
          THIS IS THE MANNER OF THE RELEASE — EVERY CREDITOR SHALL RELEASE THE
          LOAN OF HIS HAND WHICH HE LENDS TO HIS NEIGHBOR, HE SHALL NOT EXACT
