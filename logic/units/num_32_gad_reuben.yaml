      chapters cite 32:1 and 32:37-38, credited with a quick look (read whole
      at sitting 3). Ledger num_32_gad_reuben_2026-09-12.md, coverage computed by script, the
      ink facts computed from the Tanakh DB and the snapshot store (every fact
      an assert — ten fell on the first typed pass, each retyped from the leg
      print; one more on the second), the engine's numeral parser measured on
      every verse (two numbers, both read — no gap), every quotation cut by
      consonants in glossed pieces (no cut miss; the lint clean on the first
      write). Seated as claims MT32A-01..10: much cattle had the sons of reuben and the sons of gad; they saw the land of jazer and gilead, a place for cattle, and asked it of moses, eleazar and the princes — nine cities — for a possession: do not bring us over the jordan; shall your brothers go to war and you sit here? why do you discourage the heart of the children of israel? thus did your fathers when i sent them from kadesh barnea to see the land; they went up to the valley of eshcol and discouraged the heart — the vows' verb, a written-and-read pair, the spies' verb changed; the lord's anger burned on that day and he swore: if the men who came up from egypt, from twenty years old and upward, shall see the land i swore to abraham, isaac and jacob, for they have not followed me fully — except caleb the kenizzite and joshua; he made them wander forty years until all the generation that did evil in the eyes of the lord was consumed — the oath of chapter 14 retold with the verb supplied; behold, you have risen in your fathers' place, a brood of sinful men, to add yet to the fierce anger of the lord against israel; for if you turn from after him, he will again leave them in the wilderness and you will destroy all this people — sodom's word, peor's phrase, isaiah's idiom, the rebuke's own condition; they drew near: sheepfolds we will build for our cattle here and cities for our little ones; we will be armed, hastening before the children of israel until we have brought them to their place; we will not return until every man has inherited; our inheritance has come to us on this side of the jordan eastward — the cattle before the children, the arm-root's seven tokens, the retellings' rest; if you do this thing, if you arm yourselves before the lord and every armed man passes over the jordan before the lord until he has driven out his enemies and the land is subdued before the lord — afterward you shall return and be clear before the lord and before israel, and this land shall be yours; but if you do not, you have sinned against the lord, and know your sin which will find you; build cities for your little ones and folds for your sheep, and that which has gone out of your mouth you shall do — the condition doubled, onkelos's buffer, the clearance, the utterance rule's second seat; your servants will do as my lord commands: our little ones, our wives, our cattle and all our beasts shall be in the cities of gilead, and your servants will pass over, every armed man of the host, before the lord to the war, as my lord says — the acceptance in moses' order; moses commanded concerning them eleazar the priest, joshua son of nun and the heads of the fathers of the tribes: if they pass over armed, give them gilead for a possession; if not, they shall have possessions among you in canaan; they answered: that which the lord has spoken to your servants, so will we do; we will pass over armed before the lord, and with us the possession of our inheritance — the commission named, the second doubled condition, moses' word the lord's; moses gave to gad, reuben and half the tribe of manasseh the kingdom of sihon and the kingdom of og, the land with its cities; gad built dibon, ataroth, aroer, atroth shophan, jazer, jogbehah, beth nimrah and beth haran — fortified cities and sheepfolds; reuben built heshbon, elealeh, kiriathaim, nebo and baal meon (their names being changed) and sibmah, and called by names the cities they built — manasseh first named at the grant, the nine split four and five, the crossed cities, the prophets' moab; the sons of machir son of manasseh went to gilead, took it and dispossessed the amorite; moses gave gilead to machir and he dwelt in it; jair son of manasseh took their villages and called them havvoth jair; nobah took kenath and its daughters and called it nobah after his own name — joseph's knees, the father of gilead, jair's two lineages, the daughter-towns.
      The compile (the doubled condition as a conditional grant with both
      arms, the utterance rule's second seat by CALL into the vows' runner,
      the clearance before the LORD and before Israel, the oath's retelling
      against chapter 14's tape lines, the cities as entities, the release at
      Joshua 22 a run outside the Torah) follows in its own sitting
      (World/step9/NUMBERS_WALK.md).
