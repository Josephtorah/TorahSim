  fourth extension-free derivation in a row. Central findings, all
  DB-verified before drafting: the WANDERER BUILDS THE FIRST CITY
  (ir tokens 1-2 in one verse; the build verb a participle — never
  finished; the naming verb spent on the city, for the son; the first
  HUMAN WORLD install); the crafts offices founded by template
  (shape-identical trees at 4:20-21; avi as office formula, BROKEN
  for the smith; first tokens: tent, harp, the Torah's only pipe,
  bronze whose next stop is the Tabernacle, iron whose next stop is
  a curse; the herd-word carrying Kayin's own name-root); the FIRST
  HUMAN IMPERATIVES (every prior imperative is divine blessing)
  demanding a hearing for a kill-boast the machine holds as
  testimony, not event — and Onkelos NEGATES; QUOTE-DIFF #2: the
  sevenfold decree quoted VERBATIM and inflated x11 by a human mouth
  with no ratification (shivatayim's whole Torah census is the
  decree and this echo) — flagged, never installed; the REPLACEMENT
  SEED named with 3:15's SET-verb (the root's only other Gen 1-10
  token) while the mother names the murder and switches the divine
  name; and the close: AZ's own first token, worship's formula
  agentless under the begin/profane LEXICAL FORK — Onkelos votes the
  dark side; the letter holds both; the machine ends with one
  install, one flag, one open HUMAN demand, and the fork standing.

