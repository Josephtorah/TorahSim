boot_steps:
  - id: STEP_Gn_4_17
    order: 1
    ref: "Gen.4.17"
    op: FIRST_CITY_BUILT_NAMED
    he: וַיֵּדַע קַיִן אֶת־אִשְׁתּוֹ וַתַּהַר וַתֵּלֶד אֶת־חֲנוֹךְ וַיְהִי בֹּנֶה עִיר וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ חֲנוֹךְ
    he_translit: "va-yeda Kayin et-ishto va-tahar va-teled et-Chanokh va-yehi boneh ir va-yiqra shem ha-ir ke-shem beno Chanokh"
    en: "[EN-AID/JPS] And Cain knew his wife; and she conceived, and bore Enoch; and he builded a city, and called the name of the city after the name of his son Enoch."
    tree_left:
      he: וידע קין את אשתו ותהר ותלד את חנוך
      he_translit: "va-yeda Kayin et-ishto va-tahar va-teled et-Chanokh"
      en: "the knowing, the conception, Enoch born (etnachta arm)"
    tree_right:
      he: ויהי בנה עיר ויקרא שם העיר כשם בנו חנוך
      he_translit: "va-yehi boneh ir va-yiqra shem ha-ir ke-shem beno Chanokh"
      en: "he was building a city — named for his son Enoch"
    operators:
      - op: EVENT
        expr_en: "bear(e1) ∧ Agent(e1, eshet_kayin) ∧ Theme(e1, chanokh)"
        he: וַיֵּדַע קַיִן אֶת־אִשְׁתּוֹ וַתַּהַר וַתֵּלֶד אֶת־חֲנוֹךְ
        he_translit: "va-yeda Kayin et-ishto va-tahar va-teled et-Chanokh"
        en: >
          The 4:1 formula re-run in exile: knew / conceived / bore.
          The WIFE HAS NO SOURCE — no birth, no building, no naming
          precedes her [OPEN: the letter's most famous silent
          presence; the chain's dossiers queue; nothing invented].
          The child: Chanokh — a name the letter will use again in
          the OTHER line (5:18: same lemma) for the man who walks
          with God.
        cites: ["TIR-014"]
        confidence: tested
      - op: REGISTRY_INSTALL
        expr_en: "WORLD += {ir}"
        he: וַיְהִי בֹּנֶה עִיר
        he_translit: "va-yehi boneh ir"
        en: >
          THE FIRST HUMAN WORLD INSTALL — every created entity so
          far was made by God; the corpus's first human-built thing
          is a CITY, built by the man sentenced to WANDER (the
          letter's structural irony: na va-nad -> boneh ir). And
          the verb is a PARTICIPLE (TIR-031): 'he WAS BUILDING' —
          a standing state, not a completed act: the letter never
          finishes the city. ir's corpus career from here: tokens
          1-2 this verse; then Nineveh (10:11-12); then BABEL
          (11:4-5) — founder-under-curse, empire, tower.
        cites: ["TIR-031"]
        confidence: tested
