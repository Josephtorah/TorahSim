  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_45_2026-08-08.md; manifest verified
    18/18 checkable, zero FAILED, one builder-asserted manual row).
    CROWNS (chain-attested + DB-verified). THE RE-DUG NAMES, FULL
    AND LEAN IN ONE VERSE [G45-01/02, Minchat Shai on 26:18]:
    Isaac re-digs his father's wells "and called them NAMES
    (שמות, plene, under zaqef qatan — the small upright accent)
    like the NAMES (כשמת, defective, under zaqef gadol — the
    great upright) his father had called them": the son's fresh
    namings written FULL, the father's remembered ones LEAN, each
    under its own upright accent exactly as ruled — restoration
    writes fuller than memory. THE THREE WELLS AND THEIR
    EXILE-READINGS [G45-04/05/06/07, Kitzur on 26:20-22; Minchat
    Shai]: עשק ("Esek," the quarrel-well) — its consonants stand
    three times in the Torah: the well and the fraud-laws' twice
    OPPRESSION (Lev 5:21, 5:23) — the Kitzur's Babylon-reading
    filed with the Torah's own oppression-word; שטנה ("Sitnah,"
    the accusation-well) — UNIQUE in the Torah, its only other
    Scripture station the informers' ACCUSATION-letter of the
    exile (Ezra 4:6; edge — the Kitzur's Haman-reading);
    רחבות ("Rehovot," the room-well) — unique, written
    first-vav-lean second-vav-full as all the books and the Ramah
    rule against the Hilleli's doubly-lean reading (manuscript
    split named; the Kitzur's Greece-reading with the escape into fruitfulness). THE HALF-VOWEL SPLIT'S BOUNDARY PROVEN
    [G45-08, Minchat Shai on 26:22]: ויעתק ("and he MOVED ON") — the ayin with PLAIN sheva (the bare half-vowel) exactly as ruled, and SNAPSHOT
    AGREES: the codex split that compounds the half-vowel against
    the rulings at four stations (the bless-word class: 12:3,
    22:18, 24:60, 25:22) does not reach the ayin — the split is
    letter-specific (resh and tzadi compound; ayin stays bare),
    and this token proves the boundary. THE DOUBLED SEEING SPLITS
    BY SPEAKER [G45-11/12, Kitzur on 26:28]: ראו ראינו ("we have
    SURELY SEEN that YHWH is with you" — the Philistines' plural
    confession) writes the doubled see-verb's infinitive with
    VAV; God's singular at the bush writes it with HEH
    (ראה ראיתי, "I have SURELY SEEN My people's affliction,"
    Exod 3:7) — both verified unique by adjacency: one doubled verb,
    two spellings, split exactly by the speaker's number as the
    Kitzur rules. THE CORONATION GREETING [G45-13/14/15, Kitzur +
    Minchat Shai on 26:29]: אתה עתה ברוך יהוה ("YOU are NOW the
    blessed of YHWH") — the you-now pair stands once in the Torah, verified by adjacency; the Masorah's legs are kingdom-verses
    (edges): Gerar's greeting read as a coronation; and the
    blessed-of-YHWH adjacency censused whole — five Torah sites:
    Noah's blessing (9:26), the servant's praise (24:27), Laban's
    greeting (24:31), Avimelech's greeting (26:29), Jethro's
    praise (Exod 18:10) — three praises, two GREETINGS, and both
    greetings are the Kitzur's hollow-courtesy pair (Laban's
    poison-bowl tradition beside Avimelech's "we have not touched
    you"); the do-verb of their treaty-oath (תעשה, "you will do") pointed with tzere — the long e-vowel — as ruled. THE NAMELESS NAMING [G45-16, Kitzur on 26:33,
    manual]: the chapter names its three quarrel-wells WITH a
    name-word (שם at Esek, שמה at Sitnah and Rehovot,
    builder-asserted) — but the oath-well's naming alone drops
    it: ויקרא אתה שבעה, "he called IT Shiv'ah," no name-word —
    the Kitzur rides the missing word into Edom's
    smallness-verse; the city-etymology's own שם follows
    separately. THE TENT WITH ITS VAV [G45-10, Minchat Shai on
    26:25]: אהלו ("and he pitched HIS TENT") — written with the
    closing vav, expressly NOT one of the written-heh tent-words
    (the Noach-parasha ledger; frozen gen_23's crown): Isaac's
    tent is his own on the letter's surface. GERAR'S SOFT GIMEL
    AND THE COLLATION SITE [G45-03/09, Minchat Shai]: רעי גרר
    ("the herdsmen of GERAR") — gimel soft after the vowel as
    ruled; כי עתה ("for NOW YHWH has made room") — the collation
    split (Ben Asher's kaf-stroke vs the camp of the maqqef, the joining stroke) lands on a SNAPSHOT token carrying BOTH features at once: the both-marks
    reading filed. THE BITTER LAST WORD [G45-17/18/19, Kitzur +
    Minchat Shai on 26:34-35]: בארי ("Judith daughter of BEERI
    the Hittite") — unique in the Torah; the Masorah's pair-leg
    is the prophet's father (Hos 1:1; edge — Hosea's
    exchange-plea hung on the shared name); ותהיין מרת רוח ("and
    they WERE a bitterness of spirit" — Esau's wives, the
    chapter's close) — unique, the heh with plain sheva and no
    stroke on the tav, both as ruled: the bitterness-verse
    pointed bare. READINGS (named-only, unclaimed): the Kitzur's
    four-kingdoms ladder over the wells (Esek-Babylon,
    Sitnah-Haman/Persia, Rehovot-Greece, Shiv'ah-Edom); the
    mikveh-miracle reading at Rehovot ("we shall be fruitful");
    Isaac chastened without the mercy-Name (Kitzur on 26:24 —
    the God-of-Abraham address without the four-letter Name's
    pairing, named-only).
