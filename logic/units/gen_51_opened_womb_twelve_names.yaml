  en: "[EN-AID] And YHWH saw that Leah was hated, and He opened her womb; and Rachel was barren."
  tree_left:
    he: וַיַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַיִּפְתַּ֖ח אֶת רַחְמָ֑הּ
