  draft_note_en: >
    DRAFT 2026-08-07 · SOLO ERA unit #5 (Claude coordinator+deriver; external
    fresh-context adversarial review before freeze per standing law). Span:
    29:31-30:24, the womb arc: from YHWH's opening of Leah's womb to the name
    that petitions for one more son. 29 verses · 366 tokens
    (SNAPSHOT-verified). SNAPSHOT + debut_map. bar C. Conventions: step he: =
    plain (no accents/meteg; maqqef ־ per snapshot); tree halves = accents
    kept, slashes stripped; split at etnachta — EXCEPT 30:5, 30:10, 30:12,
    30:19 (four short birth-notices with NO etnachta): split at the
    earliest strongest disjunctive before the final word (gen_03 1:13 /
    gen_50 29:22 precedent) — zaqef qatan idx1 / tifcha idx3 / zaqef qatan
    idx3 / zaqef qatan idx2 respectively, all DB-verified. Onkelos BUFFER
    PENDING.

    UNIT SHAPE — the REGISTRY's densest span and the mismatch family's fifth
    member. TWELVE NAME WRITES (Reuben, Simeon, Levi, Judah, Dan, Naphtali,
    Gad, Asher, Issachar, Zebulun, Dinah, Joseph) — more than the whole
    corpus to date combined. THREE pushes, ONE pop: hava_banim (30:1,
    give-me-CHILDREN, plural, demanded of the husband) is answered at
    30:22-23 by the WRONG PERFORMER (Elohim, whom the demandee himself named
    at 30:2: "am I in place of God?") delivering the WRONG NUMBER (one son)
    — NO POP, and at 30:24 Rachel writes the remainder INTO THE REGISTRY:
    the name yosef = "may YHWH ADD another son." The card she opened, she
    herself keeps open; the ledger's twelfth label is the card's text.
    bo_el_bilhah (30:3) pops CLEAN at 30:4 — the family's one exact
    demandee-performance. teni_dudaim (30:14) never pops: the mandrake
    transfer is never narrated — the price-clause (30:16 "sakhor
    sekharticha be-dudae") treats as paid what the letter never delivers.
    Ends SPECS depth 2 OPEN. TESTS 0 (tov at 30:20 attribute-fenced).
    REGISTRY 12.

    CARE-POINTS (filed before derivation; every ordinal DB-verified):
    (1) 29:31 senua 8130 tok3/34 (toks 1-2 = 24:60 Rebekah's blessing-gate,
    26:27 Isaac to Avimelekh; toks 5-7 = 37:4,5,8 — the hated-word leaps
    next to JOSEPH). aqara 6135 tok3/6: Sarai (11:30) → Rebekah (25:21) →
    Rachel — the third barren matriarch. rechem 7358 tok2/11 (tok1 = 20:18
    YHWH CLOSING Avimelekh's wombs; toks 2-3 both in-span, both openings).
    patach 6605 tok4/25. EVENT patach by YHWH.
    (2) 29:32 reuven 7205 tok1/39 DEBUT. Etiology raah+oni: oni 6040
    tok2/9 — tok1 = 16:11 HAGAR's affliction heard; Leah's first two
    etiologies split Hagar's verse (SAW my affliction / HEARD I am hated).
    ahav 157 tok11/41 (ye-ehavani, after 29:30's loved-more).
    (3) 29:33 shama 8085 tok34/241; natan 5414 tok70/647 — the give-walk
    opens with GOD giving before anyone demands giving. shimon 1/24 DEBUT.
    (4) 29:34 MASCULINE qara (HVqp3ms) — the only masculine naming-verb in
    the twelve; no speaker assigned. yilave 3867 tok1/8 DEBUT — career →
    Num 18:2,4 the LEVITES joined to Aaron, same niphal. levi 1/36 DEBUT.
    (5) 29:35 ode 3034 tok1/6 DEBUT (praise-verb born; tok2 = 49:8 "your
    brothers shall PRAISE you" back at Judah; toks 3-6 = the confession
    tokens Lev 5:5-Num 5:7). yehuda 1/49 DEBUT. qara fem PERFECT (HVqp3fs)
    — third verb-form variety. amad 5975 tok7/84 as cessation.
    (6) 30:1 qana 7065 tok2/12 (26:14 Philistines → Rachel → 37:11 the
    brothers at Joseph). hava 3051 tok5/11 (Babel ×3 → 29:21 give-my-wife →
    give-me-children; tok6 = 38:16 Judah to Tamar). PUSH
    LET(hava_banim(yaaqov)) — object PLURAL on the letter. meta anokhi
    (mut 4191 tok39/303 fem participle) — the death-stake.
    (7) 30:2 THE FIRST charah+af PAIRING IN THE TORAH (2734 tok5/33 + 639
    tok7/51 — no earlier verse carries both; next = 39:19 Potiphar at
    Joseph's cloak; af tok6 = 27:45 the mother's Esau-anger). ha-tachat
    8478 tok14/137 — the demandee names the true performer; tachat returns
    at 30:15 (tok15) pricing the mandrakes: the only two in-span
    exchange-tokens. mana 4513 tok1/3 DEBUT. peri 6529 tok9/42 (toks 1-8 =
    creation/Eden/Cain — first human application: fruit of the womb; beten
    990 tok3/13, toks 1-2 = Rebekah's oracle womb).
    (8) 30:3 THE SARAI SCRIPT: ve-ibane 1129 (HC/VNi1cs) — 16:2 ibane
    (HVNi1cs) and this token are the ONLY two niphal 1cs build-tokens in
    the Torah (full-morph scan). amah 519 tok6/27 (toks 2-5 = the Hagar
    cycle: Rachel reaches for the maid-word of Sarah's story; the narrator
    keeps shifchah). bo imperative as 16:2's bo-na. berekh 1290 tok1/4
    DEBUT (knees; toks 2-3 = 48:12, 50:23 — the knees-career is adoptive
    birth in this family only). ve-teled Vqj3fs = purpose-content (gen_46
    27:4 ve-okhela class), no second push. PUSH LET(bo_el_bilhah(yaaqov)).
    (9) 30:4 THE CLEAN POP: va-yavo eleha yaaqov — exact performance by
    the demandee, latency one verse. natan tok71.
    (10) 30:5-8 Bilhah's sons. din 1777 tok3/5 (6:3 → 15:14 God's "I will
    judge" to Abram → danani; tok4 = 49:16 dan yadin back at the name).
    dan name-token 1835 tok2/27 NOT a debut (tok1 = 14:14 the place).
    shama tok35 — hear-my-voice with GOD as hearer (16:2's formula had
    Abram hearing Sarai). naftule 5319 + niftalti 6617 BOTH 1/1 — double
    hapax etiology. yakhol 3201 tok8/64 (tok7 = 29:8 gen_49's cannot;
    toks 10-11 = 32:26,29 PENIEL's could-not/prevailed). achot 269
    toks 16-17/47 (envied-her-sister / wrestled-my-sister).
    (11) 30:9 NO PUSH before Zilpah's giving (contrast 30:3): laqach
    tok87/393 (LEAH takes, after 86 = 29:23 Laban takes Leah), natan
    tok73. amad tok8/84.
    (12) 30:10/12/21 THE MISSING CONCEPTION CLAUSE: Zilpah's two births
    and Dinah's carry NO va-tahar (Bilhah's and Leah's all do).
    (13) 30:11 THE WRITTEN AND THE READ — corpus first inside a
    name-etiology: SNAPSHOT idx2 = בגד unvocalized WRITTEN form beside
    idx3-4 = בָּא גָד vocalized READ form ("fortune has come"), etnachta ON
    the read form. Both 1409 tokens (1-2/2) = the noun's whole career.
    Precedent for side-by-side carry: 25:23 gyym/goyim (gen_43). gad name
    1410 tok1/28 DEBUT.
    (14) 30:13 SECOND double hapax: be-oshri 837 1/1 + ishruni 833 1/1.
    asher 836 tok1/20 DEBUT.
    (15) 30:14 reuven tok2/39 — THE FIRST REGISTRY-NAMED CHILD TO ACT.
    qatzir 7105 tok2/14 (tok1 = 8:22 the covenant's harvest). chitim 2406
    tok1/6 DEBUT. dudaim 1736 toks 1-5/5 ALL IN-SPAN (career opens and
    closes in three verses). PUSH LET(teni_dudaim(leah)) — teni 5414
    tok74 HVqv2fs, the give-walk's one imperative.
    (16) 30:15 laqach toks 88-89 in accusation. yishkav Vqi3ms plain
    imperfect — NO push (Rachel disposes, the machine records state).
    tachat tok15. THE TRANSFER GAP: no give-token takes dudaim as object
    anywhere (give-walk 70-76 checked) — teni_dudaim stays OPEN.
    (17) 30:16 sakhor sekharticha 7936 toks 1-2/3 — the hire-verb DEBUTS
    as infinitive-absolute doubling; tok3 = Deut 23:5 Balaam hired.
    be-dudae = instrument-of-price while the card stays open. erev at a
    bed-scene again (gen_50's 29:23 switch). shakhav tok13/62.
    (18) 30:17-20 THE WEEK'S ORDINALS RETURN: chamishi 2549 tok2/16 (tok1
    = 1:23 day five) and shishi 8345 tok2/9 (tok1 = 1:31 day six) — the
    son-count borrows creation-week numerals. sakhar-noun 7939 tok2/12
    (tok1 = 15:1 God's own wage-word to Abram; toks 3-7 = 30:28-31:8 the
    NEXT unit's wage war). natan toks 75-76. yisashkhar 1/18 DEBUT.
    THIRD hapax cluster at 30:20: zevadani 2064 + zeved 2065 + yizbeleni
    2082 all 1/1. tov 2896 tok29/86 ATTRIBUTE-FENCED (gen_46 27:9, gen_50
    29:19 precedent) — NO TEST. ha-paam ×3 in-unit (29:34, 29:35, 30:20).
    zevulun 1/18 DEBUT.
    (19) 30:21 DINAH: the only daughter, the only write with NO etiology
    and no conception clause. dina 1783 tok1/8 DEBUT. cherpah (debuting
    30:23) has exactly one other token: 34:14, HER story.
    (20) 30:22-24 zakhar 2142 tok5/42 (8:1 Noah, 9:15-16 covenant, 19:29
    Abraham-for-Lot — every prior object a rescue; toks 6-8 = 40:14,23 the
    cupbearer NOT remembering Joseph). patach tok5 + rechem tok3 — the
    29:31 bookend, opener now Elohim. asaf 622 tok8/50 (after the
    gather-tokens of 29:3,7,8,22) beside yosef 3254 tok9/58 — gather-away
    and add-more, the etiology's two verbs, one name; yasaf morph HVhi3ms
    PLAIN IMPERFECT (volitive by sense only — fenced, no push; toks 10-11
    = 37:5,8 "hated him YET MORE": the add-verb's next tokens add hatred
    at the child it named). cherpah 2781 tok1/2 DEBUT. acher 312 tok10/53
    (toks 7-9 = gen_50's another-man/other-seven-years). yosef name 3130
    tok1/175 DEBUT. Divine-name token-walk: YHWH ×5 (29:31,32,33,35 +
    30:24 Rachel's mouth), Elohim ×9 (30:2-30:23, incl. 30:8's
    construct-intensifier) — the unit opens under YHWH, runs its middle
    under Elohim, closes with Rachel saying YHWH. NON-POP stands at
    30:23: number-mismatch (ben singular vs banim plural) + no
    demandee-performance (no Jacob-token in 30:22-23).

  oral_audit_note_en: >
    ORAL AUDIT 2026-08-08 (retro, oral-first era; record:
    logic/oral_audit/AUDIT_gen_51_2026-08-08.md; manifest verified
    15/15 checkable, zero FAILED, two manual rows). CROWNS
    (chain-attested + DB-verified). THE NAME IN THE FINALS [G51-01,
    Kitzur Baal HaTurim]: the four words "and YHWH SAW that hated..."
    (29:31) end in the letters of אהיה ("I WILL BE" — the bush-Name),
    in order: God signing His witness on the suspected wife in the
    verse's own last letters, at the verse that opens her womb. THE
    HATED-WORD AND THE LAW'S ONE YOD [G51-02/03, Minchat Shai citing
    the Ramah]: שנואה ("hated") runs vav-FULL through its three bare
    Torah tokens — Leah's two (29:31, 29:33) and the hated-wife law's
    own opening (Deut 21:15) — and the Ramah's single exception is
    לשניאה, written with YOD, at that same law's climax: "the
    firstborn shall be TO THE HATED one" — the statute that guards
    the Leah-case firstborn spells her word differently at exactly
    the clause that protects her son. THE NAME WITH THE SILENT LETTER
    [G51-13, Minchat Shai; Ben Asher named]: יששכר ("Issachar," the
    wage-name) written with TWO shins in all fourteen bare Torah
    tokens (prefixed tokens likewise, builder-checked), ONE read —
    and SNAPSHOT carries the silence in the pointing itself: the
    first shin voweled, the second bare of any vowel. THE ONE FULL ME
    [G51-14, Minchat Shai's own census]: the direct-object אותי
    ("me") written full with vav appears exactly ONCE in the whole
    Torah — "because you did not sanctify ME" (Deut 32:51); every
    other token, including Zebulun's dowry-verse here, is lean.
    WRITTEN ONE, READ TWO — INSIDE A NAME [G51-10, the Ramah's
    fifteen-list; the Zohar page named]: at Gad's etiology (30:11)
    the WRITTEN form stands as one bare unpointed word beside the
    READ pair בא גד ("FORTUNE HAS COME") — the fifteen-list's
    encoding carried natively by the stream's written/read
    pairing of tokens, the corpus's first such pair inside a
    name-etiology. THE ONE-OF-A-KIND DAGESH AT DAN [G51-07]: דנני
    ("God has JUDGED me," 30:6) — the second nun's dagesh (the
    doubling dot) marked by the Masorah itself as "none like it."
    THE WITHHELD NAMER'S OWN STROKE [G51-05]: קרא ("he CALLED his
    name Levi," 29:34) — the twelve writes' one masculine
    naming-verb, its subject withheld by the letter — carries the
    precise manuscripts' meteg (the small stress-stroke) and the
    joining maqqef (the joining stroke) as ruled. POINTING AND SPELLING AS RULED
    [G51-04/06/08/16, Minchat Shai]: ותעמד ("and she STOOD from
    bearing") lean, with the Ramah's all-lean rule holding whole
    across the Torah; ברכי ("upon my KNEES," the adoptive-birth
    formula) with the dageshed kaf — Minchat Kohen refuted, the two
    soft knee-words both outside the Torah; בן ("a second SON," 30:7)
    in tzere (the long e) WITHOUT the printed maqqef — the misplaced
    rule dismantled; הפעם ("THIS TIME") with the hard pe. THE NIGHT
    THE LETTER LEAVES BARE [G51-12]: הוא of the mandrake night ("he
    lay with her THAT night," 30:16) — the sense expects the
    the-prefixed form, the letter writes it bare: one of the
    Masorah's FOUR such stations (the Vayera list, named), the
    expected-form class's in-span member. THE TRIBES' TWO MARKED
    LETTERS [G51-17, Kitzur; manual, builder-asserted over the
    eleven name-writes]: among all the tribe-names only JOSEPH
    carries a samekh and only SIMEON an ayin — Esau's adversary in
    the one, the watching eye in the other (Zimri's deed, named).
    DISCREPANCIES: the dowry-word's camp [G51-15] — זבד ("a good
    ENDOWMENT," 30:20): the books divide six dots against five;
    SNAPSHOT points tzere (the long e), joining the five-dot
    minority — the run's third split-attested station; and the
    meteg-omission class takes member three at מן of from-the-field
    (30:16 — maqqef as ruled, the ruling's meteg absent). INSTRUMENT
    GAPS: the paseq of the wrestlings [G51-09, manual] — a paseq
    (the separating bar) ruled after אלהים ("wrestlings of GOD,"
    30:8, Naphtali); the layer is absent from the stream
    (builder-probed) — the standing gap's second source-anchored
    instance; the no-break rule at 30:14 filed with the paragraph
    gap. READINGS (named-only, unclaimed): the measure-for-measure
    at the mandrakes and "therefore she was not buried with him";
    the three-then-six arithmetic of Leah's bearing; Reuben's
    naming-order inversion (name before reason, alone among the
    twelve); Bilhah "my MAID," a concubine's daughter; the
    mandrakes' letter-count.
