    MACHINE PROFILE. FIVE DECLAREs, TWO RESULTs — the span's demand
    ledger is a study in how demands die and live: Jacob's go-down
    (42:2) discharges in ONE VERSE (42:3); Joseph's FIRST plan
    (shilchu, 42:16 — send one, nine bound) is SUPERSEDED by its own
    author on the third day and left OPEN forever (the dead-by-
    revision class debuts); the third-day plan (zot asu, 42:18) is
    receipted by the letter's own compliance-clause (va-yaasu khen,
    42:20) BEFORE its parts execute (Simeon bound 42:24, the going
    42:26); the bring-the-youngest demand (42:20) stays OPEN as the
    span's forward hook (43:15/26 in waiting); Reuben's pledge (tena,
    42:37) meets a flat REFUSAL (42:38) and stays open — the
    dead-by-refusal class (gen_62's shikhva-imi) gains its gravest
    member: a father refusing a son's sons. Queue at close: THREE
    OPEN (the superseded plan, the carrying demand, the refused
    pledge). REGISTRY 0 writes. TESTS 0 — the span's own test-word
    (tibachenu, 42:15-16) is Joseph's procedure, not the oracle's:
    the register stays silent by TIR discipline. LEDGER 0. EVENTS 3
    marked: the BOWING (42:6 — gen_60's sheaves-dream discharges its
    first fulfillment), the REMEMBERING (42:9 — va-yizkor yosef et
    ha-chalomot: the remember-verb whose failure and repair
    structured gen_63/64 now turns in Joseph's own mouth), the FIRST
    WEEPING (42:24 — the weep-verb opens its seven-station cycle
    series).

    CARE-POINTS: the RETELLING VARIANCE FILE (42:30-34 against
    42:7-20): the binding softened to a leaving (hanichu for
    yeaser), the charge softened by a kaf (KA-meraglim), the
    conjugation drift (hayinu for hayu), and the ADDED trading
    license (ve-et ha-aretz tischaru, 42:34 — the retelling's
    invention, the gen_64 lo-noda pattern at family scale). The
    RETRO-FACT of the pit: the plea (be-hitchaneno, 42:21) that
    gen_60's narration never recorded, released twenty-two years
    late in the guilty men's mouths. Reuben CITING his own still-
    open gen_60 demands (halo amarti, 42:22) — the corpus's first
    witness to its own queue. The is-not word (enennu) tolling
    42:13/32/36. The silver returned unasked (42:25) beginning the
    sale-silver's long answer. The seen/feared pun (va-yiru/va-
    yirau, 42:35). Jacob's claim-without-source (ki achiv met,
    42:38). WATCHLIST ARMS: 43:15/26 (Benjamin brought; the
    carrying demand's discharge), 43:14 (the bereave-verb returned),
    43:30 (weeping station two), 44:29 (sevati's second token,
    G65-08), 45:26 (the lean telling, G65-06), 46:29 (the hard-alef
    chariot binding, G65-05), Exod 14:6 (Pharaoh's chariot, G65-05),
    Exod 12:32 (the take-and-go pair, named), Num 32:32 (nachnu's
    war-pledge partner, G65-07).
  oral_audit_note_en: >
    ORAL AUDIT 2026-08-09 (IN-PIPELINE, forward era; manifest
    logic/oral_audit/manifests/gen_65_first_descent_claims.json
    13/13 VERIFIED, zero FAILED; record
    logic/oral_audit/AUDIT_gen_65_2026-08-09.md). CROWNS
    (chain-attested + DB-verified). WHEEL-STATION TEN [G65-01, MS on
    42:6]: עַם ("people") — the precise books' galgal (the wheel
    stroke) with no maqqef; SNAPSHOT writes the munach (the upright
    conjunctive stroke): the galgal class stands at TEN stations,
    the stream in the munach camp at every one. THE SEVEN FULL
    BENJAMINS [G65-02, MS on 42:4; the Ramah]: בנימין ("Benjamin")
    with the yod between mem and nun — the Ramah counts SEVEN such
    fulls in the Torah and the census is EXACT in-stream: the
    naming (35:18), the guarding (42:4), the sending (43:14), the
    seeing (43:16), the greeting (43:29), the kissing (45:12), the
    blessing (49:27) — while the same chapter writes the demanded
    son LEAN (בנימן, "Benjamin" shorn of its yod, 42:36): full when
    held, lean when claimed.
    THE ONE-VERSE FULL/LEAN PAIR [G65-03, MS on 42:7; the Hilleli
    and Yerushalmi copies]: אליהם ("to them") FULL — the Hilleli
    lean, the Yerushalmi and every precise book full, one of the
    Masorah's seventeen fulls — and the SAME VERSE writes its
    second to-them LEAN (אלהם), excluded by the Masorah's own note:
    the seesaw inside nineteen tokens. FROM-EGYPT WITH THE PRECISE
    BOOKS [G65-04, MS on 42:3]: ממצרים ("from Egypt") — the
    Aspamia codex and Rabbenu Gershom's book against copies reading
    in-Egypt; SNAPSHOT with the precise books. THE THREE BINDINGS
    [G65-05, MS on 42:24; the Masorah; Mikhlol]: וַיֶּאֱסֹר ("and
    he bound" — Simeon) with the alef in CHATAF SEGOL, the
    Masorah's one SOFT binding against two hard: Joseph's chariot
    bound to meet his father (46:29) and Pharaoh's bound to chase
    (Exod 14:6) — a brother bound softly; the chariots hard. THE
    TWO LEAN TELLINGS [G65-06, MS on 42:29; the Ramah; the Hilleli
    and Yerushalmi]: ויגידו ("and they told") FULL (the Hilleli
    alone lean), for the Ramah's census stands: the Torah's lean
    tellings are exactly TWO — the well found (26:32) and 'Joseph
    still lives' (45:26): census EXACT in-stream. THE SHORT WE
    [G65-07, Kitzur on 42:11; the Masorah]: נחנו ("we", the clipped
    form) — exactly TWICE in the Torah: the brothers' plea and the
    Reubenites' war-pledge (Num 32:32); the Masorah's third is
    Lamentations' 'we have transgressed' (named): the Kitzur reads
    all three into one speech, and hears the missing letter as the
    missing brother. THE GRAY-HAIR FILE [G65-08, MS on 42:38; the
    Ramah]: שיבתי ("my gray hair") FULL — the Ramah rules every
    gray-hair form in the Torah full, and the file verifies EXACT:
    sevati twice (42:38, 44:29), sevat once (44:31) — all three
    Jacob's, all bound to Sheol-clauses. THE BARE ALL-OF-THEM
    [G65-09, Kitzur on 42:36; the Masorah]: כלנה ("all of them") —
    ONCE in the Torah bare (Calneh of Babel wears it only with a
    vav); the Masorah pairs it with 'you surpass them ALL' (Prov
    31:29, named). THE KILL-WORD [G65-10, Kitzur on 42:37]: תמית
    ("you may kill") — ONCE in the Torah; the reading tradition
    rides the two-sons clause to Datan and Aviram (named). THE
    UNRECOGNIZED [G65-11, Kitzur on 42:8; the Masorah]: הכרהו
    ("recognized him", negated) — ONCE in the Torah; the Masorah's
    pair is Job's friends (Job 2:12, named): suffering hid the one,
    elevation the other. THE POINTING FILE [G65-12, MS ×7]:
    במצרים ("in Egypt", 42:2) bet DAGESHED (checked); ve-nichye (42:2)
    yod in segol, meraglim (42:9) gimel dageshed throughout,
