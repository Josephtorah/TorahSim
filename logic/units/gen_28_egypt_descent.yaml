    - id: S_interrogated
      en: "After 12:18 — the garden's question-form in a king's mouth; no answer from Abram recorded"
    - id: S_countermanded
      en: "After 12:19 — the confession-facts hold (amarta re-routes the sister-words to Abram); LET(qach) + LET(lekh) pushed and OPEN — the call's verb handed back, verse-final"
    - id: S_expelled
      en: "After 12:20 — tzavah's first human subject; the garden-expulsion stem sends the family out; QUEUE ENDS 3 OPEN, ALL HUMAN; every other register empty"
  transitions:
    - {from: S_boot, to: S_descended, via: STEP_Gn_12_10}
