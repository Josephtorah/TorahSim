    he: וְתִתְקַיֵּם נַפְשִׁי בְּפִתְגָּמָיְכִי
    he_translit: "ve-titqayam nafshi be-fitgamaykhi"
    en: >
      The span's translation witness — headline: THE BUFFER GIVES
      SARAI THE WORDS THE LETTER WITHHOLDS: 12:13 gains an
      instrument — 'that my soul may be PRESERVED BY YOUR WORDS'
      (be-fitgamaykhi): in the Hebrew her speech is demanded and
      never delivered; in the Aramaic her words are already the
      saving cause [find-class; dual-track, flagged]. The
      person-taking buffer holds through ALL THREE take-forms:
      va-tuqach -> ve-idabbarat ('she was LED'), va-eqach ->
      u-devarit ('I LED her'), qach -> devar ('LEAD [her]') — the
      lead-for-take policy gen_26 found at 11:31, now passive,
      confessional, and imperative. VA-LEKH -> IZEL: Pharaoh's
      go-word is the same Aramaic imperative Onkelos gave 12:1's
      lekh-lekha (izel lakh) — the letter's frozen-wall echo
      survives translation exactly. The expulsion SOFTENED:
      va-yeshalchu -> ve-ALVIU ('they ESCORTED/accompanied him') —
      the garden-stem's rhyme is buffered away into an honor guard.
      The plague DE-TACTILIZED: va-yenaga -> ve-aiti ('He BROUGHT
      plagues upon'), negaim -> makhtashin — the same Aramaic
      noun the law's buffer uses for nega [cross-buffer
      consistency]. NA ('please') -> khe-an ('now') both times —
      the corpus's first please vanishes in translation. raav ->
      kafna; kaved -> takif ('severe'); la-gur -> le-itotava
      ('to dwell').
    comment_en: "Read from Data/sefaria_texts/ (local; FETCHLOG is provenance). Dual-track; not merged."
    source: "[ORAL][TIER-A]"

