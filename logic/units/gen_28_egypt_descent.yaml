    - id: S_descended
      en: "After 12:10 — go_down fired (yarad token 3 — gen_25's frozen line lands); famine-facts hold; mitzrayim flagged"
    - id: S_first_speech
      en: "After 12:11 — Abram's FIRST recorded speech (census-verified); the beauty-address holds"
    - id: S_forecast
      en: "After 12:12 — the kill-me/keep-you-alive forecast holds (no event fires; his words only)"
    - id: S_requested
