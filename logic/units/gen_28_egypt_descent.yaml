    en: "the queue's inversion of gen_27: there God commanded twice and one demand still stands; here THREE demands push and ALL are human (a husband's imri, a king's qach + va-lekh) and ALL stand open — zero RESULT ops in the unit [the letter writes no receipt: the sister-words execute without her voice; the taking-back and the going are never narrated in-span — the ascent is 13:1, across the seam]; VA-LEKH is VERSE-FINAL [tree fact]: the go-verb of 12:1's summons returns as a pagan expulsion-word on the silluq throne; and in Aramaic the echo is EXACT — Onkelos renders Pharaoh's va-lekh as IZEL, the same imperative it gave YHWH's lekh-lekha [dual-track]; tzavah ('command') tokens 1-7 all divine, TOKEN 8 = PHARAOH — the command-verb's first human subject is a king ordering an escort"
  - id: EXPORT_passive_take_and_the_plague
    he: וַתֻּקַּח הָאִשָּׁה … וַיְנַגַּע יְהוָה
    he_translit: "va-tuqach ha-ishah … va-yenaga YHWH"
    en: "the take-verb's triad on one woman: PASSIVE (va-tuqach — first NARRATIVE passive take, qal-passive wayyiqtol, NO agent written; the form-class's speech-perfect ancestor is 2:23's luqocha, the woman 'TAKEN from man'), CONFESSION (va-eqach — the hidden agent steps forward in first person), IMPERATIVE (qach — the verb handed back as command); around it the letter strips and restores her: 'the woman' through 12:14-15, name AND title (saray eshet avram) returned inside God's cause-clause at 12:17 — the span's ONLY divine act, WORDLESS (no divine speech verse exists; the moral speech is Pharaoh's mah-zot asita — the garden's question-form [3:13, 4:10] in its first human mouth, and its next tokens are the other wife-sister kings 20:9/26:10); NEGA debuts as the plague on Pharaoh's house — frozen lev_13's own import ('nega (Gen 12:17)' — quoted): the affliction-law's word is born in an abduction case"
  - id: EXPORT_egypt_pattern_field
    he: וַיֵּרֶד … וַיְשַׁלְּחוּ … וַיַּעַל
    he_translit: "va-yered … va-yeshalchu … (13:1) va-yaal"
    en: "the descent-field: yarad token 3 (gen_25's frozen career line quoted and LANDED — two divine descents, then Abram's); raav ('famine') born here, cited as 'the FIRST' by 26:1, crowding Yosef's Egypt after; kaved ('heavy') born on the famine, its first five tokens all famines; gur ('sojourn') born on the way down; the payment enriches through the eved-word gen_23 filed as curse-born ('the word that will carry Egypt... born in the Torah's first human curse-speech' — quoted, token 5 = Egyptian payment); shalach-piel token 8 sends the family out on the GARDEN-EXPULSION stem (3:23 — same verb, same stem: expelled from a garden after a taking, expelled from Egypt after a taking); the va-yered/va-yaal (12:10/13:1) inclusio frames the unit, ascent out of span; the whole descend-plague-despoil-expel sequence is the chain's Egypt-pattern file (maaseh-avot ['deeds of the fathers']) — NAMED-ONLY, prose: the machine records eleven events and no typology"

