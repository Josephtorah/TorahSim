      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(vayimale_khapo, fistful_sync)"
        en: >
          THE FISTFUL SYNC AND THE TWO OFFERINGS [claim LV09-06]. 'He
          filled his palm' synced to Lev 2:2 by the milui-milui verbal
          analogy — a pebble, a salt grain, or a crumb of frankincense in
          the fist DISQUALIFIES here as there; and 'beside the morning
          burnt offering' teaches TWO meal offerings that day, one with
          the olah and one on its own.
        cites: ["Sifra, Shemini, Mechilta d'Miluim 2 11", "Sifra, Shemini, Mechilta d'Miluim 2 12"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(the_run_teaches_the_spec, the_fork_over_whether_an_hour_legislates)"
        en: >
          THE RUN TEACHES THE SPEC — THE PALM, THE POINTER, THE PREPOSITION,
          THE BLESSING, AND THE FORK OVER WHETHER AN HOUR LEGISLATES [claim
          LV09-11]. The tradition reads this chapter in the direction
          opposite to the compile's: not the run graded against the spec,
          but the spec completed FROM the run. 'And he filled his PALM from
          it' (9:17 — the phrase a hapax; 'his palm' at five Torah seats,
          this and the leper's four) is R. Zeira's source that every
          unmarked palm is the RIGHT hand, because Leviticus 14:15 alone
          writes 'the left palm' (Menachot 9b) — so Mishnah Menachot 1:2's
          left-hand fistful is invalid by a token of the run, and the meal-
          offering engine's cell that had cited the sheet without a
          derivation now fetches one from this verse; Rava's hand-hand
          analogy beside it (Menachot 10a). 'And he did it AS PRESCRIBED'
          (9:16 — twelve Torah seats, two in Leviticus) is read as 'as the
          law of the FREEWILL burnt offering', teaching that the OBLIGATORY
          burnt offering requires hand-laying (Menachot 93b = Beitzah 20a,
          inside Beit Hillel's arm of Beitzah 2:4) — the pointer into
          Leviticus 1 giving Leviticus 1 a column. 'The lobe FROM the liver'
          (9:10) resolves Leviticus 3:4's 'the lobe ON the liver' — from the
          liver onto the lobe (Nedavah Section 14 8): a preposition supplied
          by the run. The eighth day's meal offering is put into the
          frankincense column by an inclusion on Leviticus 2:1 (Menachot
          59a; Mishnah Menachot 5:3), and the Sifra's fill-with-fill analogy
          (11) carries the crumb rule both ways; 'beside the morning burnt
          offering' yields TWO meal offerings that day (12). The blessing's
          law is read off 9:22 four times over: its posture, lifted palms,
          by verbal analogy from 'so shall you bless' (Sotah 38a); its
          timing, in the service, from 'and came down from doing' (Sotah
          38b); its place in the prayer, after the thanksgiving, from the
          verse's sequence (Megillah 18a); the high priest's hands, R.
          Yehuda's proof (Sotah 7:6) — with 'his hand' written singular and
          read plural, and the Sifra's transposed verse (29) and the sealed
          blessing opened at Numbers 6:24 (30). And the direction itself is
          a recorded fork: Rav — wherever Scripture repeated 'meal offering'
          it is indispensable, and 9:17's fistful is such a repetition (so
          the fistful and the frankincense hold each other back, Mishnah
          Menachot 3:5); Shmuel — GENERATIONS ARE NOT LEARNED FROM THE HOUR
          (Menachot 19b), the one-time act of the eighth day does not
          legislate. The stack of the wave is reconciled the same way,
          7:30's 'the fat on the breast' and 9:20's 'the fats on the
          breasts' assigned to two moments of one act, the bringing and the
          handing to the priest who smokes (Menachot 62a). Onkelos writes
          the pointer as 'as is fitting' (9:16) and the wave as 'lifted a
          lifting' (9:21). Registered as move M-22 in the catalog.
        cites: ["Sifra, Shemini, Mechilta d'Miluim 2 10", "Sifra, Shemini, Mechilta d'Miluim 2 11", "Sifra, Shemini, Mechilta d'Miluim 2 12", "Sifra, Shemini, Mechilta d'Miluim 2 17", "Sifra, Shemini, Mechilta d'Miluim 2 29", "Sifra, Shemini, Mechilta d'Miluim 2 30", "Sifra, Vayikra Dibbura DeNedavah, Section 14 8", "Menachot 9b:17", "Menachot 10a:6", "Menachot 19b:2", "Menachot 19b:3", "Menachot 19b:4", "Menachot 93b:3", "Beitzah 20a:5", "Menachot 59a:11", "Menachot 62a:1", "Menachot 62a:4", "Menachot 62a:5", "Sotah 38a:6", "Sotah 38b:7", "Megillah 18a:3", "Mishnah Menachot 1:2", "Mishnah Menachot 3:5", "Mishnah Menachot 5:3", "Mishnah Beitzah 2:4", "Mishnah Sotah 7:6", "Onkelos Lev 9:16", "Onkelos Lev 9:21"]
