      he_translit: "r'shyt bkvry 'dmtk tby' byt yhvh 'lhyk"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: לא תבשל גדי בחלב אמו
      he_translit: "l' tbshl gdy bchlb 'mv"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(kid_in_milk_clause, the_translation_is_the_verdict)"
        en: >
          THE KID-SENTENCE IS A COMPRESSED STATUTE AND THE RECEIVED
          TRANSLATION PRINTS ITS CONCLUSION [claim EX23-08]. Why THREE
          tokens across the Torah - SEVEN recorded answers (three covenants;
          beast, wild animal, fowl; eating, benefit, cooking; the species-
          triples; R. Akiva's three exclusions; R. Yose ha-Gelili's fowl-
          without-mother's-milk); the EATING ban is derived up the pesach-
          sinew-carcass ladder and the BENEFIT ban up the orlah-chametz-
          vineyard ladder (with Rebbi's sell-not-cook); the KID is named
          because its mother's milk is the abundant ordinary case; cooking-
          of-two-permitted-things is this law's unique architecture. And
          Onkelos renders the verse 'YOU SHALL NOT EAT MEAT IN MILK' - the
          entire chain's conclusion as the verse's own received text.
          Bikkurim's head-clause carries its bring-but-not-read classes, and
          the sanctuary-house pointing. [folded shape: priced law]
        cites: ["Mekhilta on Exod 23:19", "Onkelos Exod 23:19", "Mekhilta on Exod 23:18", "Onkelos Exod 23:18"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(kid_in_milk_clause, bikkurim_exam_legs_f018)"
        en: >
          THREE FIRSTFRUITS LEGS THE EXAM SURFACED, SEATED UNDER THE AUTO-
          SEAT LAW [claim EX23-09]. (a) NOT BEFORE SHAVUOT: the men of Mount
          Tzevoim brought early and were REFUSED, on our 23:16's own words -
          'the harvest feast, the FIRSTFRUITS of your labors' (Mishnah
          Bikkurim 1:3; Challah 4:10 the same case). (b) RESPONSIBILITY
          UNTIL THE TEMPLE MOUNT: the bring-verb of 23:19 read as liability-
          until-delivery (Mishnah Bikkurim 1:9). (c) THE GROWER-CLASSES
          DELTA, carried dual-track: the Mekhilta re-includes sharecroppers
          and seizers as bring-but-not-read; Mishnah Bikkurim 1:2 excludes
          them from bringing at all ('until all growth is from YOUR land') -
          two seats, one clause, both recorded. Finding F-018. [folded
          shape: recorded dispute]
        cites: ["Mishnah Bikkurim 1:3", "Mishnah Bikkurim 1:9", "Mishnah Bikkurim 1:2", "Mekhilta on Exod 23:19"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(kid_in_milk_clause, vocalization_authority_file)"
        en: >
          THE VOCALIZATION-AUTHORITY SUGYA RUNS ON THIS CLAUSE [claim
          EX23-12]. The round-20 ink block opens Sanhedrin 4a-4b and
          finds the tradition's own version of the project's front-end
          question argued AT THIS VERSE: is the READ form or the
          WRITTEN skeleton the mother of the law — Rav Acha bar
          Yaakov's challenge riding בַּחֲלֵב אִמּוֹ ("in its mother's
          MILK"), readable as "in its mother's FAT," and everyone
          reading MILK. THE SCOPE LAW the sugya lands on: the dispute
          lives ONLY where the written skeleton differs from the read
          form (the booth-walls count, the blood-quarter, the totafot
          spellings — EX13-15's own cluster cited inside); where
          letters are identical and only vowels differ, ALL follow
          the read form — matching the front-end measurement (the
          vowels rule nowhere alone; RESEARCH_LOG 2026-09-03). THE
          SEAL: the kid-law itself is moved OFF the vowels — Rav Acha
          son of Rav Ika: the Torah forbade the WAY OF COOKING (the
          cook-verb, not the vowel, carries the ban). The
          counter-exemplar recorded: shall-see/shall-be-seen (23:17)
          letter-identical yet expounded both ways (the two-whole-eyes
          law — the M-16 revocalization family; its festival law
          block 17's). THE META-RULES seated beside: a verbal analogy
          may not be reasoned fresh (Shabbat 97a:1 — the received-only
          license for middah II), and R. Yonatan's first-mention rule
          (a first mention serves the plain sense and is not counted —
          the courts block's own read, doubling here). Auto-seat law,
          F-073.
        cites: ["Sanhedrin 4a:12", "Sanhedrin 4a:13", "Sanhedrin 4a:14", "Sanhedrin 4a:15", "Sanhedrin 4b:1", "Sanhedrin 4b:2", "Sanhedrin 4b:12", "Sanhedrin 4b:13", "Sanhedrin 4b:14", "Sanhedrin 4b:15", "Sanhedrin 4b:16", "Shabbat 97a:1", "Sanhedrin 3b:3"]
        confidence: witnessed
    comment: >
      Top split head mark L=etnachta (major mid-verse rest); R head mark noted in tree. maps_to this verse only.
    confidence: hypothesis
    source: "[HE-WRITTEN][HE-STRUCT]"

