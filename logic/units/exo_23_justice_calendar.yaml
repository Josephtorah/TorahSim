      he_translit: "vl' t'nh 'l rb lntt 'chry rbym lhtt"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(majority_clause, asymmetric_majority_and_the_duty_to_speak)"
        en: >
          MAJORITY RULE IS INSTALLED ASYMMETRICALLY [claim EX23-02]. 'You
          are not with them for evil but you ARE with them for good': twelve
          acquitting against eleven - acquitted; conviction needs a margin
          of TWO ('execute by witnesses, execute by tilters: as witnesses
          are two, the tilters are two' - thirteen against ten convicts,
          twelve against eleven does not); the judge who says 'I do not
          know' tilts the bench toward acquittal only. Onkelos EXPANDS the
          crux into the rulings themselves: 'do not refrain from TEACHING
          what you see about the judgment; AFTER THE MANY THE JUDGMENT IS
          COMPLETED' - the duty to speak your view and the majority
          principle rendered as the verse. [folded shape: priced law]
        cites: ["Mekhilta on Exod 23:2", "Onkelos Exod 23:2"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(majority_clause, courtroom_conduct_file)"
        en: >
          THE COURTROOM CONDUCT FILE [claim EX23-10]. The round-13
          Talmud-first block lands the justice cluster's derivation layer
          on 23:1-8: THE ODD-COURT LAW — 'to incline after a multitude'
          read as MAKE YOURSELF A COURT THAT CAN INCLINE (R. Eliezer son
          of R. Yosei HaGelili, Sanhedrin 3b:6), every bench's +1 riding
          it, with R. Yoshiya's recorded scope dissent (capital only; and
          even he takes monetary MAJORITY a fortiori from capital,
          3b:11-13). AL RIV READ AL RAV — 'do not answer in a cause'
          heard as 'do not answer over the master' (23:2): the king sits
          on no court (Sanhedrin 18b:9) and capital opinions open FROM
          THE SIDE (36a:14) — the seated side-first rule's own
          derivation. THE DISTANCING CLUSTER (23:7, Shevuot 30b:13-14):
          the judge no advocate for his own rulings, no ignoramus student
          at the bench, no joining a known robber in judgment or
          testimony. THE BENCH TABLE'S OWN DISPUTES: lashes in three
          against R. Yishmael's twenty-three (the wicked-wicked verbal
          analogy, Sanhedrin 10a:11); the killed-by beasts — R. Akiva's
          twenty-three against R. Eliezer's whoever-kills-first-merits
          (2a:10); the ox at Sinai judged at twenty-three from the
          boundary verse's 'whether animal or man' (15b:6 — a standing
          rule drawn from a time-bound law, the dilemma named). THE OX'S
          ONE PROTECTION: 'you shall not incline the judgment of your
          POOR' (23:6) — your poor, not the ox: of the ten capital
          protections the stoned ox keeps only the twenty-three (36b:2-3).
          AND THE SELF-RELATIVE SPLIT: a person is his own relative and
          cannot render himself wicked — the self-condemning half of a
          testimony is void, the half against the other stands (Rava,
          9b:8 + 25a:9, two seats one principle), with the false
          witness's lashes needing their own derivation because 20:13's
          speech-ban involves no act (10a:10). Anticipations recorded:
          EX23-02 already held the margin arithmetic, EX23-04 the return
          asymmetry, EX23-01 the ex-parte warnings. Finding F-049,
          auto-seated per the standing law.
        cites: ["Sanhedrin 3b:6", "Sanhedrin 18b:9", "Sanhedrin 36a:14", "Shevuot 30b:13", "Sanhedrin 10a:11", "Sanhedrin 15b:6", "Sanhedrin 36b:3", "Sanhedrin 9b:8"]
        confidence: witnessed
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(the_twenty_three_built_from_for_evil, the_courts_compiled_on_their_hapaxes)"
        en: >
          THE TWENTY-THREE BUILT FROM 'FOR EVIL' — THE COURTS COMPILED ON
          THEIR HAPAXES, THE ENEMY'S LOAD, THE ACQUITTED NEVER RETRIED
          [claim EX23-16]. Exodus 23:1-9 compiled cold inside
          cold_run_ordinances.py: 'a false report' a hapax, 'wicked' twice
          in Exodus (23:1 and 23:7 — the chapter's own pair), the Mekhilta's
          three warnings, 'a witness of violence' at two seats (this and
          Deuteronomy 19:16's scheming witness) with the robbers
          disqualified and Sanhedrin 3:3's list carrying the usurer of
          22:24; 'after the many', 'for evil', and 'to tilt' each once in
          the Bible, and Mishnah Sanhedrin 1:6 building the court of twenty-
          three with this verse as the arithmetic's last term — not for evil
          as for good, acquittal by one and conviction by two, no even
          court, one added (the Mekhilta: twelve against eleven acquits,
          thirteen against ten convicts, a margin of one does not);
          Sanhedrin 4:1's one-and-two, 4:2's beginning from the side, 3:7's
          dissenter bound and silent, Onkelos's 'teach what you see'; 'you
          shall not glorify' at two seats (this and Leviticus 19:15) with
          each verse taking a referent and the holiness engine's equal-
          treatment cell by call. The enemy: 'you shall meet' at two seats,
          the four readings of the enemy (the idolater, the relapsed
          convert, the transgressor, R. Natan's son after a quarrel) against
          Sanhedrin 3:5's three-day clock; 'straying' as outside the
          boundary with Joseph's straying the witness; the doubled 'return'
          and 'unload' read as the repeated duty (Bava Metzia 2:9, 2:10),
          'lying under its burden' a hapax, 'with him' exempting the idle
          owner, the measure a load it can bear, the ris as data, the
          father's word not obeyed, Onkelos's grudge released with the load,
          Bava Kamma 5:7's 'ox or donkey' as the common case. The judgment:
          'your needy' a hapax and the wicked-and-worthy pair, 'from a false
          matter' a hapax, 'the innocent and the righteous' a hapax read as
          the retrial asymmetry (reversed for merit, never for liability —
          Sanhedrin 4:1; Onkelos 'one who went out acquitted'), no execution
          without witnesses; the bribe with 'the open-eyed' a hapax, Peah
          8:9 quoting the verse and the holiness engine's bribe cell by
          call, bribery absolute; 'the soul of the stranger' a hapax closing
          the span on 22:20's verse, the Mekhilta carrying 23:9 at 22:20.
          Effects: majority_decides, unloading_owed, bribe_barred,
          false_report_barred.
        cites: ["Mekhilta on Exod 23:1", "Mekhilta on Exod 23:2", "Mekhilta on Exod 23:3", "Mekhilta on Exod 23:4", "Mekhilta on Exod 23:5", "Mekhilta on Exod 23:6-8", "Onkelos Exod 23:2", "Onkelos Exod 23:5", "Onkelos Exod 23:7", "Mishnah Sanhedrin 1:6", "Mishnah Sanhedrin 3:3", "Mishnah Sanhedrin 3:5", "Mishnah Sanhedrin 3:7", "Mishnah Sanhedrin 4:1", "Mishnah Sanhedrin 4:2", "Mishnah Bava Metzia 2:5", "Mishnah Bava Metzia 2:6", "Mishnah Bava Metzia 2:7", "Mishnah Bava Metzia 2:9", "Mishnah Bava Metzia 2:10", "Mishnah Bava Kamma 5:7", "Mishnah Shevuot 4:1", "Mishnah Peah 8:9", "Mishnah Eduyot 5:7", "Mishnah Shabbat 1:4"]
