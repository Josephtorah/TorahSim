    he_translit: "l' tzbch 'l chmtz dm zbchy … vl' ylyn chlb chgy 'd bqr"
    en: "[EN-AID] From top split: LEFT «לא תזבח על חמץ דם זבחי» / RIGHT «ולא ילין חלב חגי עד בקר». Derive claim from Hebrew arms, not English alone. Exod 23:18."
    tree_left:
      he: לא תזבח על חמץ דם זבחי
      he_translit: "l' tzbch 'l chmtz dm zbchy"
      en: "Left arm of top binary split [EN-AID]"
    tree_right:
      he: ולא ילין חלב חגי עד בקר
      he_translit: "vl' ylyn chlb chgy 'd bqr"
      en: "Right arm of top binary split [EN-AID]"
    operators:
      - op: WITNESS_READ
        expr_en: "WITNESS-READ(feast_clauses, the_feast_offerings_fences)"
        en: >
          THE FEAST OFFERING'S FENCES [claim EX23-14]. The round-24
          festivals block seats the verse's two clauses. CHAG IS AN
          OFFERING: if the wilderness feast were eating and
          drinking, whence "the FAT of My feast"? — a banquet has
          no altar-fat (Chagigah 10b:4, the "fat at feast-time"
          pushback recorded at 10b:5). THE LEAVEN BESIDE: לא תשחט
          על חמץ — "over leaven," not "YOUR leaven": ANYONE'S bars
          the slaughter, bounded by the not-remain link to the
          offering's own standing parties, not one at the world's
          end (R. Ami, Pesachim 63b:10-11). THE EXTENSION FORK on
          the doubled זבחי (this verse + 34:25): R. Yehuda — "the
          offering UNIQUE to Me," the daily offering joins the ban;
          R. Shimon — read "My offerings," the fourteenth's cases
          (64a:5-6). THE OVERNIGHT WINDOW: Rav Kahana's
          contradiction ("until morning it may not remain — all
          night it MAY" against Leviticus 6:5's complete-by-day)
          resolved by himself: the night is the salvage window for
          what was LEFT OVER (59b:6-7). AND THE FIRST MORNING: the
          fifteenth's chagigah parts disqualify overnight — "not
          remain until morning" with ראשית ("the FIRST," 23:19)
          JUXTAPOSED lends the ordinal: the FIRST morning (Rav
          Kahana, 71a:12; Rav Yosef's objection carried, 71a:13).
          EX34-04's Onkelos arm — "the fats not overnight EXCEPT
          off the altar" — held the window's shape since
          derivation. Auto-seat law, F-088.
        cites: ["Chagigah 10b:4", "Chagigah 10b:5", "Pesachim 63b:10", "Pesachim 63b:11", "Pesachim 64a:5", "Pesachim 64a:6", "Pesachim 59b:6", "Pesachim 59b:7", "Pesachim 71a:12", "Pesachim 71a:13"]
        confidence: witnessed
    comment: >
      Top split head mark L=etnachta (major mid-verse rest); R head mark noted in tree. maps_to this verse only.
    confidence: hypothesis
    source: "[HE-WRITTEN][HE-STRUCT]"

  - id: STEP_Ex_23_19
    order: 19
    ref: "Exod.23.19"
    op: ETNACHTA_SPLIT
    he: ראשית בכורי אדמתך תביא בית יהוה אלהיך … לא תבשל גדי בחלב אמו
    he_translit: "r'shyt bkvry 'dmtk tby' byt yhvh 'lhyk … l' tbshl gdy bchlb 'mv"
    en: "[EN-AID] From top split: LEFT «ראשית בכורי אדמתך תביא בית יהוה אלהיך» / RIGHT «לא תבשל גדי בחלב אמו». Derive claim from Hebrew arms, not English alone. Exod 23:19."
