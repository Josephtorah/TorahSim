        en: >
          THE POOR GIFTS ON FOUR NOUNS AND ONE VERB [claim LV19A-09].
          Compiled cold against Mishnah Peah read whole under the union rule
          (69 rows; 186 of 186 cells across the half-chapter on the first
          graded run, no Talmud opened), the corner tractate turned out to
          run on the ink's own inventory: four gift-nouns at 19:9-10 (the
          corner, the gleanings, the small clusters, the fallen grapes), one
          leave-verb, one recipient pair ('to the poor and the convert'),
          and the four reaping-tokens of 19:9 that the Ramah counted
          (L19-14). 'When YOU reap' exempts what robbers reaped, ants
          nibbled, wind or beast broke, and the gentile's own reaping before
          conversion (Chapter 1 6; Peah 2:7, 4:6); the duty's moment is the
          reaping itself, so a crop consecrated standing and redeemed as
          sheaves is exempt (Peah 4:7); 'your field' per field and per owner
          gives the dividers, the kind-and-floor identity, and the brothers
          who divided (Chapter 1 11, Chapter 2; Peah 2-3); 'you shall leave
          them' gives the scramble with the trellis and palm carved by
          danger (Chapter 3 5-6; Peah 4:1-2); the gleanings run on the four-
          position grid and the doubt runs to the poor (Chapter 2 5, 3 7;
          Peah 4:10-11); the small cluster and the fallen grape are defined
          by shoulder-and-drip and by the cutting (Chapter 3 2-3; Peah
          7:3-4). The corner's QUANTITY is a parameter the ink leaves open —
          Peah 1:1 says it has no measure — and the sixtieth is the scribes'
          floor self-labeled 'though they said' (1:2); the poor's threshold
          (two hundred zuz, 8:8) and the count threshold (two ears, three
          not, 6:5) are the data channel. The five-predicate classifier
          (Chapter 1 7; Peah 1:4) grades grain in and vegetables and figs
          out, and Niddah 6:6's implication (the corner implies the tithes)
          is its three shared predicates. A census of the Emor copy: Lev
          23:22 repeats 19:9-10 with the vineyard clauses absent — the grain
          gifts restated at the festivals, the vine gifts written once. The
          forgotten sheaf and the olive are Deut 24:19-20's and were routed.
          Filed and auto-seated under the auto-seat rider (sitting L4a of
          THE COMPILE DEBT, 2026-09-06 — the Lev 19:1-18 compile,
          cold_run_holiness.py 186 of 186 on the first graded run).
        cites: ["Mishnah Peah 1:1", "Mishnah Peah 1:2", "Mishnah Peah 1:4", "Mishnah Peah 2:7", "Mishnah Peah 4:1", "Mishnah Peah 4:6", "Mishnah Peah 4:7", "Mishnah Peah 4:10", "Mishnah Peah 4:11", "Mishnah Peah 6:5", "Mishnah Peah 7:4", "Mishnah Peah 8:8", "Mishnah Niddah 6:6", "Sifra, Kedoshim, Chapter 1 6", "Sifra, Kedoshim, Chapter 1 7", "Sifra, Kedoshim, Chapter 1 9", "Sifra, Kedoshim, Chapter 1 11", "Sifra, Kedoshim, Chapter 2 5", "Sifra, Kedoshim, Chapter 3 2", "Sifra, Kedoshim, Chapter 3 3", "Sifra, Kedoshim, Chapter 3 5", "Sifra, Kedoshim, Chapter 3 7"]
