      gap; the fraction class named), every quotation cut by consonants (no
      cut miss; the lint 0). Seated as claims DV01A-01..05:
      the frame: these are the words moses spoke to all israel beyond the jordan — in the wilderness, in the arabah opposite suph, between paran, tophel, laban, hazeroth and di-zahab — eleven days from horeb to kadesh-barnea; in the fortieth year, the eleventh month, the first of the month, according to all the lord commanded him, after smiting sihon and og, moses undertook to explain this torah; horeb: the lord our god spoke to us at horeb — you have dwelt long enough at this mountain; turn and journey to the hill country of the amorites and all its neighbors, the arabah, the hill, the lowland, the negeb, the coast, the land of the canaanite and lebanon, to the great river euphrates; see, i have set the land before you — go in and possess the land sworn to abraham, isaac and jacob and their seed; i cannot bear you alone: the lord has multiplied you as the stars of heaven — may he add a thousand times and bless you as he spoke; how can i bear alone your trouble, your burden and your strife? give yourselves wise and understanding and known men for your tribes and i will set them as your heads; the officers appointed: you answered that the thing was good, and i took the heads of your tribes, wise and known men, and made them heads over you — captains of thousands and of hundreds and of fifties and of tens, and officers for your tribes; the judges charged: hear between your brothers and judge righteously between a man and his brother and his stranger; recognize no faces in judgment, hear small and great alike, fear no man, for the judgment is god's; the hard matter bring to me — and i charged you all the things you should do. The compile (the speech's
      retellings against Numbers as the tape's own memory; the officers'
      table; the judges' charge; the two islands of the Sifrei; the register
      gate's four waiting seats) follows in its own sitting
      (World/step9/DEUTERONOMY_WALK.md).
