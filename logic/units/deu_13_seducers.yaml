you hear in one of your cities which the lord your god gives you to dwell there, saying: men, sons of belial, have gone out from your midst and have drawn away the inhabitants of their city, saying, let us go and serve other gods which you have not known — then you shall inquire and search and ask diligently, and behold, if it is true, the thing certain, that this abomination was done in your midst: smite, you shall smite the inhabitants of that city with the edge of the sword, devoting it and all that is in it and its cattle with the edge of the sword; the whole offering, the heap and the mercy: and all its spoil you shall gather into the midst of its street, and burn with fire the city and all its spoil wholly to the lord your god; and it shall be a heap forever, it shall not be built again; and nothing of the devoted thing shall cleave to your hand, that the lord may turn from the fierceness of his anger and give you mercy, and have mercy on you and multiply you, as he swore to your fathers; the footer: when you hearken to the voice of the lord your god, to keep all his commandments which i command you today, to do the right in the eyes of the lord your god.
