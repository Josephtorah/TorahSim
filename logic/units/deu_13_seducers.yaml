        en: >
          THE INCITER: WHEN YOUR BROTHER, THE SON OF YOUR MOTHER, OR YOUR SON
          OR YOUR DAUGHTER OR THE WIFE OF YOUR BOSOM OR YOUR FRIEND WHO IS AS
          YOUR OWN SOUL ENTICES YOU IN SECRET, SAYING, LET US GO AND SERVE
          OTHER GODS WHICH YOU HAVE NOT KNOWN, YOU NOR YOUR FATHERS, OF THE
          GODS OF THE PEOPLES ROUND ABOUT YOU, NEAR TO YOU OR FAR FROM YOU,
          FROM ONE END OF THE EARTH TO THE OTHER — YOU SHALL NOT CONSENT TO
          HIM NOR HEARKEN TO HIM, NOR SHALL YOUR EYE PITY HIM, NOR SHALL YOU
          SPARE NOR CONCEAL HIM; BUT KILL, YOU SHALL KILL HIM, YOUR HAND SHALL
          BE ON HIM FIRST TO PUT HIM TO DEATH AND THE HAND OF ALL THE PEOPLE
          AFTERWARD, AND YOU SHALL STONE HIM WITH STONES THAT HE DIE, FOR HE
          SOUGHT TO THRUST YOU FROM THE LORD YOUR GOD WHO BROUGHT YOU OUT OF
          THE LAND OF EGYPT, OUT OF THE HOUSE OF BONDAGE; AND ALL ISRAEL SHALL
          HEAR AND FEAR AND SHALL NOT DO AGAIN SUCH AN EVIL THING AS THIS IN
          YOUR MIDST [claim DV13-03]. THE INCITER: WHEN YOUR BROTHER, THE SON
          OF YOUR MOTHER, OR YOUR SON OR YOUR DAUGHTER OR THE WIFE OF YOUR
          BOSOM OR YOUR FRIEND WHO IS AS YOUR OWN SOUL ENTICES YOU IN SECRET,
          SAYING, LET US GO AND SERVE OTHER GODS WHICH YOU HAVE NOT KNOWN, YOU
          NOR YOUR FATHERS, OF THE GODS OF THE PEOPLES ROUND ABOUT YOU, NEAR
          TO YOU OR FAR FROM YOU, FROM ONE END OF THE EARTH TO THE OTHER — YOU
          SHALL NOT CONSENT TO HIM NOR HEARKEN TO HIM, NOR SHALL YOUR EYE PITY
          HIM, NOR SHALL YOU SPARE NOR CONCEAL HIM; BUT KILL, YOU SHALL KILL
          HIM, YOUR HAND SHALL BE ON HIM FIRST TO PUT HIM TO DEATH AND THE
          HAND OF ALL THE PEOPLE AFTERWARD, AND YOU SHALL STONE HIM WITH
          STONES THAT HE DIE, FOR HE SOUGHT TO THRUST YOU FROM THE LORD YOUR
          GOD WHO BROUGHT YOU OUT OF THE LAND OF EGYPT, OUT OF THE HOUSE OF
          BONDAGE; AND ALL ISRAEL SHALL HEAR AND FEAR AND SHALL NOT DO AGAIN
          SUCH AN EVIL THING AS THIS IN YOUR MIDST. 'ENTICE' THE TORAH'S ONE
          TOKEN — eighteen in the Bible (Jezebel's 1 Kings 21:25 and Saul's 1
          Samuel 26:19 the shelf's two — 87:1-2's dispute of the sense, error
          against provocation); 'your brother the son of your mother', 'the
          wife of your bosom' (28:54's 'of his bosom') and 'your friend who is
          as your own soul' ONE each ('as your own soul' 13:7, 23:25 and
          Jonathan's 1 Samuel 18:1, 3); 'in secret' four in the book (the
          curses' word at 27:15, 24); 'of the gods of the peoples round about
          you' 6:14's clause SPELLED DEFECTIVE here (credited); 'from one end
          of the earth to the other' 13:8, 28:64 (the exile), Jeremiah 25:33;
          THE FIVE PROHIBITIONS OF 13:9 — 'consent' the book's seven, 'your
          eye shall not pity' the book's five (7:16 defective, credited),
          'spare' the Torah's two (Exodus 2:6 Pharaoh's daughter) and Saul's
          order not to spare Amalek with the chapter's word (1 Samuel 15:3),
          'conceal' ONE — five negations in one verse; 'KILL, YOU SHALL KILL
          HIM' ONE, the infinitive absolute; THE HAND FIRST — 17:7's 'the hand
          of the witnesses shall be on him first' the twin (seven tokens in
          order), 'and the hand of all the people' 13:10 and 17:7, 'afterward'
          the Torah's two seats both this clause; 'AND YOU SHALL STONE HIM
          WITH STONES THAT HE DIE' ONE — TWO VERBS OF STONING in the Torah:
          Deuteronomy's at 13:11, 17:5, 22:21, 22:24 against Leviticus's and
          Numbers' at Molech's giver, the necromancer, the blasphemer and the
          wood-gatherer (credited by name from four ledgers), 21:21 alone
          holding both; 13:11 against 5:6's preamble six tokens in order
          (credited) and 8:14 seven; 'AND ALL ISRAEL SHALL HEAR AND FEAR' —
          the formula's four seats (17:13, 19:20, 21:21), 13:12 THE FIRST and
          the one with the paragogic nun; 'such an evil thing' 13:12 and
          19:20; Israel's ONE token in the chapter; THE ROOT OF ADDING at
          13:12 'they shall not do again'. THE SHELF: THE INCITER'S KIN AN
          INCLUSION TABLE — the brother by the father, the mother's son, the
          son and the daughter of any kind, the betrothed and the married, the
          convert, and THE FATHER found in 'as your own soul' (87:4-11 — the
          one kinsman the verse does not name, in its last clause); fathers
          and sons who do not testify for one another yet are charged with
          inciting one another (87:3 — 24:16; the English's 'Ezek.24:16' a
          slip, asserted); their words in secret, Torah's in public (87:12 —
          Proverbs 7:9, 1:20); Israel's disgrace, abandoning what the fathers
          handed down (87:13 — R. Yose the Galilean); the near gods teach the
          far, the far the sun and the moon (88:1-2 — THE HEADLESS PISKA,
          folded in on its consonants); THE FIVE PROHIBITIONS EACH AGAINST A
          STANDING DUTY — the love of the neighbor (89:1 — Leviticus 19:18),
          the enemy's ass (89:2 — Exodus 23:5), the neighbor's blood (89:3 —
          Leviticus 19:16, the Hebrew's citation; the English cites 13:9,
          asserted), the defense barred and the silence barred (89:4-5); THE
          COURT'S RULE INVERTED — convicted, not brought back to acquit;
          acquitted, brought back to convict (89:6-7 — the doubled verb's two
          halves; Mishnah Sanhedrin 4:1 at 11b); the hand first the enticed's
          own commandment, any man's after (89:8); THE STONES AND THE STONE —
          Leviticus 20:27's singular and the chapter's plural one rite, dead
          by the second if not the first (90:1 — credited); the analogy of
          'thrusting' run back to the prophet (90:2); the exodus enough (90:3
          — 86:4 again); ALL ISRAEL HEARS — kept until the festival (R. Akiva)
          against no delay of judgment in court (R. Judah): a PARAMETER of the
          timing (91:1-2 — Mishnah Sanhedrin 11:4; Tosefta 11:7); THE FIFTEEN
          UTTERANCES — five acts by three persons from 'not like the thing,
          not like the evil, not like this' (91:3); the eight honors of an
          idol NOT capital, by 'this' (91:4 — Mishnah Sanhedrin 7:6); 117:3's
          analogy from 'Belial' at 15:9 naming the chapter's seducers
          idolatry. THE REGISTER: singular throughout but 13:8's 'round about
          you (pl.)'; 'saying' the seducer's again (13:7); the second person's
          prohibitions and the third's (the eye); no imperative — the doubled
          'kill' an infinitive absolute; the participle 'who brought out'
          twice. Onkelos: 'the wife of your COVENANT' for the bosom (ONE), 'he
          COUNSELS you' for entices (ONE), 'the errors of the peoples' at 13:7
          and 13:8, 'accept' at 13:9, 'THE FEAR OF THE LORD' supplied at 13:11
          ('to thrust you from the fear of the LORD'), 'shall be killed', the
          Aramaic stoning verb (five rows in the book); the English's brackets
          'idols of other nations'.
