# =============================================================================
# ORAL PROVENANCE REGISTER v1 — chain-of-transmission status per work
# =============================================================================
# PROPOSED 2026-07-30 at owner order ("we should probably only rely on schools
# or rabbis within the chain of transmission ... yes build it").
# STATUS: APPROVED by owner 2026-07-30 ("approve the register policy and start reading") — governs triage.
# Hand-authored judgment table (Pre-Code rule): code may MATCH against it,
# never extend it. Matching: ordered prefix rules, FIRST match wins.
# Era/attribution notes follow both traditional reception and standard
# scholarship; disagreements are recorded, not hidden. Not binding law.

meta:
  version: v1
  date: 2026-07-30
  status: approved
  approved: 2026-07-30 (owner)
  match_semantics: "ordered prefix rules; first match wins; longer/specific rules listed before shorter"
  chain_en: >
    shalshelet ha-mesorah ("chain of transmission"): Moshe -> Yehoshua ->
    Elders -> Prophets -> Men of the Great Assembly -> Tannaim -> Amoraim ->
    Savoraim -> Geonim -> Rishonim -> Acharonim (Avot 1:1; Rambam, intro to
    Mishneh Torah).

statuses:
  chain_primary: "Tannaitic/Amoraic literature and the received Targum — the Oral Torah proper; may ground MATERIAL findings"
  chain_compilation: "chain-sage content in late redaction or with attribution caveats — corroboration/enrichment tier"
  chain_anthology: "Rishonim-era digests/anthologies — locators; authority resolves to the primary they quote"
  chain_geonic: "Geonic-era works — in chain; authority per genre"
  halakhic_application: "Rishonim/Acharonim/contemporary halakhah citing the verse for law/liturgy — context notes, not exegetical authority here"
  targum_composite_late: "late/misattributed targumim printed within the tradition — translation observations only"
  outside_chain_academic: "modern academic works or manuscripts never transmitted by the community — observation only, never authority"

policy_proposed:
  material_findings: [chain_primary]
  corroboration_enrichment: [chain_compilation, chain_geonic]
  locator_resolve_to_primary: [chain_anthology]
  context_notes_only: [halakhic_application]
  observation_only: [targum_composite_late, outside_chain_academic]

