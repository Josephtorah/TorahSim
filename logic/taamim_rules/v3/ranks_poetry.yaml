# Poetry ta'amim ranks — parser version v3 (hypothesis seed)
# System: the Three (sifrei emet) — Psalms, Proverbs, Job body
# Lower rank number = stronger disjunctive break.
# DO NOT use for the 21 prose books. DO NOT silently copy prose ranks.
#
# Sources (secondary): Wickes poetical tradition summaries; Gesenius §15;
# Crowther/Richter/Breuer overviews; Unicode Hebrew cantillation block.
# Confidence: hypothesis — freeze only via golden tests + version bump.

version: v3
system: poetry
comment: >
  Seed poetry ranks for experiment goldens (Prov duals, Ps 1:6, Job 3.x).
  Critical differences from prose: dehi is DISJUNCTIVE; ole is major DISJUNCTIVE;
  zinor DISJUNCTIVE; silluq sole emperor at verse end; etnachta still major mid-divider.

marks:
