# word_gloss_overrides.yaml — authored corrections to the SNAPSHOT DB's
# per-word gloss column, used by gloss_db.py for the display layer (the
# py renderings and any future renderer). Display-only: never touches
# frozen YAMLs or machine truth.
#
#   by_gloss:    raw DB gloss -> replacement, EXACT match (wins first)
#   replace:     ordered [from, to] substring fixes applied otherwise
#   by_ref:      "Book.Ch.Vs:idx" -> replacement (context homographs; wins last)
#   by_skeleton: bare consonantal token -> English (for span tokens whose
#                spelling never matches a DB row — plene forms, rare names)

by_gloss:
  "?": ""
  "to-?": "to"
  "in-?": "in"
  "from-?": "from"
  "and-?": "and-I"           # both span stations are ve-anokhi ("and I")
  "what-known?": "why?"
  "where?-hence-how?": "how?"
  "what-place?": "where?"
  "hinder": "other"
  "scan": "look"
  "fore": "east-wind"
