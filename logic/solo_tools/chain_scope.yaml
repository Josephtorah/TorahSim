# CHAIN SCOPE RULINGS — machine-readable form of the owner's scope law.
# Owner 2026-08-10: "Only use oral torah in the chain of transmission."
# Read by chain_scan.py (the inversion scanner) and oral_coverage.py
# (the freeze-blocking gate). Classification of every linked listing:
#   READABLE     — source work present in export_texts -> MUST be read
#   TANAKH-VERSE — a Bible cross-reference -> resolved via the Tanakh DB
#   OUT          — matches a ruled_out entry below (ruling named)
#   UNRULED      — matches nothing -> surfaced to owner, BLOCKS the gate
# (law: absences surfaced by name, never silently skipped).
# NO entry may be added/removed here without an explicit owner ruling.

