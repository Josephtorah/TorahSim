# KINDS VOCABULARY — the text's own type system (le-minah, "after its
# kind", days 3/5/6). Owner's insight 2026-08-24: produce is the data
# category; the kinds are the types its values come from. Types are data;
# events reference kind ids. Seeded from the creation week + the curse;
# grows as books are folded. English gloss REQUIRED on every entry.
version: 0
kinds:
  - id: deshe
    en: grass / tender sprout
    source: Gen.1.11
  - id: esev_mazria_zera
    en: herb yielding seed
    source: Gen.1.11
  - id: etz_pri
    en: fruit tree (the commanded kind — tree that IS fruit)
    source: Gen.1.11
  - id: etz_oseh_pri
    en: tree making fruit (the delivered kind — the day-3 spec delta;
      dispute on the deviation carried, never decided)
    source: Gen.1.12
  - id: kotz
    en: thorn (enters the produce slot at the curse; new-or-redirected
      kind — the tradition's question, carried)
    source: Gen.3.18
  - id: dardar
    en: thistle (same status as thorn)
    source: Gen.3.18
  - id: sheretz_nefesh_chaya
    en: swarming living creature (of the waters)
    source: Gen.1.20
  - id: of_kanaf
    en: winged fowl
    source: Gen.1.21
  - id: taninim
    en: the great sea-creatures
    source: Gen.1.21
  - id: behemah
    en: cattle / domestic beast
    source: Gen.1.24
  - id: chayat_ha_aretz
    en: wild beast of the earth
    source: Gen.1.24
  - id: remes
    en: creeping thing
    source: Gen.1.24
  - id: adam_kind
    en: the human (in the divine image)
