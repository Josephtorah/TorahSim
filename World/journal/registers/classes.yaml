# NODE CLASSES + STORY CLASSES — record classes as DATA (disposability
# principle: Exodus adds/merges classes by editing this table, not code).
# node_classes label nodes in the tree; story_classes is the collector's
# list from HOW_THE_WORLD_GETS_BUILT.md (18 evidenced classes) kept here
# as the fold's checklist.
version: 0
node_classes:
  - {id: root,      en: root container (the heavens; the earth)}
  - {id: domain,    en: created domain (firmament, seas, land)}
  - {id: container, en: sub-container (garden, city, ark)}
  - {id: river,     en: river (the Eden hydrology)}
  - {id: well,      en: well (water access point)}
  - {id: place,     en: known geography — the map layer (presupposed)}
  - {id: person,    en: person record}
  - {id: people,    en: nation / family record (the nations table)}
  - {id: guard,     en: boundary guard (cherubim, the turning sword)}
  - {id: object,    en: made object (coats of skins, the awl...)}
  - {id: divine,    en: divine (from the entity registry's own kind field)}
  - {id: creature,  en: created creature (the by-its-kind inhabitants)}
  - {id: plant,     en: plant (grass, trees — including Eden's two)}
  - {id: entity,    en: UNCLASSIFIED — the honest bucket; shrinks as we learn}
