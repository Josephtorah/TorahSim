# THE DAEMON DISPOSITIONS — read by daemon_census.py, THE DAEMON-EDGE GATE that runs after the dependency gate
# before every cold sweep (2026-09-07, D9-ii of THE DAEMON CAMPAIGN).
#
# daemons:    every `def law_*(event, world)` in World/step9 declares its file, the runner it wraps, and its
#             WATCHES — {event kind: [effects written]} — which must EQUAL the parse of its body (a daemon edited
#             without its declaration fails the gate; the file may never under- or overstate the code). Every
#             kind must be in event_vocabulary.yaml, every effect in effect_vocabulary.yaml, and a daemon may
#             never call .submit( — THE FENCE: it consumes events and writes the ledger, it never emits an event.
# functions:  every compiled function that writes the world (a top-level def naming a registered effect; the
#             module itself for a table-shaped runner), one disposition each:
#               WRAPPED  by: a declared daemon whose tape replays the span — verified by a shared effect
#                        (function level, or module level for a table-shaped runner): the wrap's live check
#               OWED     why names a wrap-worklist line of COMPILE_DEBT.md before "|" — the generated worklist
#               NONE     why says why no daemon is owed (reserved for the wrap sittings to declare)
# unfired:    a kind some daemon watches and NO tape submits — declared with a why until a tape fires it
# unconsumed: a kind some tape submits and NO daemon watches — declared with a why until a daemon takes it
# The registry's aliases_in_code (one act under two names, one name over two acts) are not dispositioned here:
# the gate prints them as OPEN ALIASES until the wrap that unifies them removes the entry from the registry.
daemons:
  # ---- THE LOOP step 3 INSTALLATION (2026-09-09; THE_LOOP.md "Step 3 INSTALLATION — the design", decisions D1-D6): every daemon carries
  # ---- given_at (the verse where the law is spoken) and installed_by (boot | pending with a why | an installing act of
  # ---- installation_parameters.yaml) — the gate refuses a daemon without both. THE TENT DAEMON (D4), the library's sixth, declared first:
  law_tent:
    file: world_engine.py
    wraps: the library — THE TENT DAEMON (the institutions' installer; the custody and output branches join at Numbers' opening block)
    given_at: Exod 18:25
    installed_by: boot
    watches:
      judges_appointed: [in_force]          # the court in session (Exod 18:25-26)
      covenant_blood_thrown: [in_force]     # the covenant upon all these words (Exod 24:8)
      erected: [in_force]                   # the tent stands (Exod 40:17)
      called_from_the_tent: [in_force]      # the tent's first speech — the detail pass (Lev 1:1)
      milluim_blood_sprinkled: [in_force]   # the priesthood consummated (Lev 8:30)
      entered_the_land: [in_force]          # the land entered (Lev 25:2; Exod 23:23) — the exam scenes' case form, never on the three books' tape
      # ---- THE TENT sitting 1 (2026-09-09; THE_TENT.md section 1): the blasphemer's halt and output — declared BEFORE the code
      placed_in_custody: [in_custody, declaration_owed]   # the halt (Lev 24:12): the person in the guard, the docket's declaration owed (covered_by read off the ledger)
      sentence_declared: [rule_installed, stoned]       # the output (Lev 24:13-14): the generations' rule installed (case_output's running setting), the docket closed, the instance's verdict where the code has not decided
      stoned_as_commanded: []                            # the execution (Lev 24:23): the history's act — the verdict already on the ledger, nothing written
      # ---- THE TENT sitting 2 (2026-09-09; THE_TENT.md section 2): the unclean men's halt and output — a STANDING case; declared BEFORE the code
      stood_to_hear: [waits_for_the_word, declaration_owed]   # the halt (Num 9:8): no guard — the persons wait for the word (a body entry), the docket's declaration owed (covered_by read off the ledger AND the pending timers)
      statute_declared: [rule_installed, second_passover_due, holding_owed]   # the output (Num 9:9-14): the statute installed (case_output's running setting), the docket and the wait closed, the instance's verdict where the code had not decided   # THE TENT sitting 4: the SECOND SEAT (Num 27:6-11) — the verdict table keyed by the installed law: holding_owed on the daughters where the code had not decided
      # ---- THE TENT sitting 4 (2026-09-09; THE_TENT.md section 4): the daughters' halt (THE THIRD FORM) and the second output (RELAYED) — declared BEFORE the code
      judgment_brought_near: [declaration_owed]   # the halt's third form (Num 27:5): the judgment carried in by Moses — no guard, no wait: the docket's declaration alone, covered_by read off the persons' ledger, the uncertainty THE SCOPE
      command_relayed: [rule_installed, marries_within_tribe]   # the second output on the same case (Num 36:5-9), relayed by Moses 'by the mouth of the LORD': rule_installed naming THE CELL law_zelophehad:tribe_transfer; no docket to close; the verdict where the code had not decided
