      incense_burned: [incense_continual]
      tamid_offered: [accepted, tamid_owed]
      hands_feet_washed: [hands_feet_sanctified]   # W6: UNIFIED — the erection's laver washing renamed from 'washed' (Lev 8:6's immersion keeps that name)
      work_finished: [work_completed, inspected_as_commanded]
      glory_filled: [presence_dwells, glory_appeared]
      could_not_enter: [barred_from_it]
      called_from_the_tent: [meeting_appointed]
      cloud_lifted: [camp_moves_by_the_cloud]
      # ---- W6 THE SANCTUARY'S REMAINDER (D9-iii, 2026-09-07): declared BEFORE the code — law_erection EXTENDED to the craftsmen's call (31:1-11) and the donation's run (35:4-29)
      craftsman_called: [appointed_by_name, spirit_filled]
