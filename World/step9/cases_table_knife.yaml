  exodus_anchor: {unit: gen_40 + gen_65, ref: Gen.24.14 + 42.36,
    claims: [G40-36, G65-36]}
  cases:
  - id: Ch_nachash
    input: {query: divination_paradigm}
    expected: {verdict: eliezer_test_defines_ban}
    class: A
  - id: Ch_chazakah
    input: {query: three_time_chazakah}
    expected: {verdict: established_three_times}
    class: A

- module: robbery_and_oath
  tractate: Chullin
  oracle: Chullin 89a:3-5, 60b:11-13
  exodus_anchor: {unit: gen_30 + gen_37, ref: Gen.14.24 + 21.23,
    claims: [G30-32, G37-31]}
  cases:
  - id: Ch_robbery
    input: {query: consumed_robbery}
    expected: {verdict: unrestorable_even_by_righteous}
    class: A
  - id: Ch_oathbar
    input: {query: standing_oath_bar}
    expected: {verdict: conquest_routed_around_oath}
    class: A
