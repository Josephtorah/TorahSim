# THE LEAVEN MACHINE (round 12 — the first of the 18 Exodus
# Talmud-first exam blocks, 2026-09-04; owner: "Yes go" on the
# compaction-#41 order). Membership: the block's 25 LAW rows credited
# to EXOD_TALMUD_TRIAGE_LEDGER.md, re-opened with 108 fresh segments.
# Read-source record: logic/oral_triage/exodus_block_leaven_2026-09-04.md.
# Provenance: talmud_source + exodus_anchor (mishnah added where a
# Mishnah row stands above the sugya) — the Noahide precedent.

- module: leaven_deadline
  tractate: Pesachim
  oracle: Pesachim 4b:8-5b:1 (the deadline sugya); Mishnah Pesachim 1:4
  exodus_anchor: {unit: exo_12_passover_and_exodus, ref: Exod.12.15+18,
    claims: [EX12-03, EX12-19]}
  cases:
  - id: P4b_removal_day
    input: {query: removal_day}
    expected: {verdict: fourteenth_from_midday}
    class: A
  - id: P5a_night15_scope
    input: {query: removal_night_scope, moment: night_of_fifteenth}
    expected: {verdict: bound}
    class: A
  - id: P5a_night14_scope
    input: {query: removal_night_scope, moment: night_of_fourteenth}
    expected: {verdict: not_yet_bound}
    class: A
  - id: P4b_hour_fence
    input: {query: eating_hour_fence}
    expected:
      verdict: [eat_through_five, eat_through_four]
    class: A

