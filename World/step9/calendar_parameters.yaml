# O9 OPEN-5 (2026-09-08; CLOCK.md 12e): THE DAY SLOTS — the ink's own day-words in the three books (censused by script over the
# Tanakh DB) in the ORDER the calendar day runs them from Gen 1:5 (evening then morning: the day begins at evening). The Calendar
# reads them for slot_rank and crosses_day; the stitcher stamps an event's `slot` from the word at its first verse (re-verified
# by the sequence runner); nothing in the engine counts hours — the hours are the rows above. The `words` are the verse's own
# forms (points and cantillation stripped); `phrases` are two-word patterns, all words present.
day_slots:
  - name: evening
    words: [בערב]
    en: "in the evening (בערב) — the calendar day's first slot; 14 seats"
    bound: "the row day_boundary (Gen 1:5; Chullin 83a:15)"
  - name: night
    words: [בלילה, הלילה]
    en: "in the night / the night (בלילה, הלילה) — 12 + 16 seats"
    bound: "the row night_start (Berakhot 2a:1: the stars) to the dawn's column (2a:3-4)"
  - name: midnight
    phrases: [[בחצי, הלילה]]
    en: "at midnight (בחצי הלילה) — one seat, Exod 12:29"
  - name: dawn
    words: [השחר]
    en: "the dawn (השחר) — 3 seats: Gen 19:15, 32:25, 32:27"
    bound: "the dawn's column (Berakhot 2a:3-4)"
  - name: morning
    words: [בבקר, ובבקר]
    phrases: [[ויזרח, השמש], [יצא, השמש]]
    en: "in the morning (בבקר, ובבקר) — 32 + 2 seats; the sun's rising (Gen 19:23, 32:32)"
  - name: noon
    words: [בצהרים]
    en: "at noon (בצהרים) — 2 seats: Gen 43:16, 43:25"
  - name: between_the_evenings
    phrases: [[בין, הערבים]]
    en: "between the evenings (בין הערבים) — 6 seats"
    bound: "the row between_the_evenings_from (Pesachim 58a:3, 58a:5)"
  - name: sunset
    phrases: [[לבוא, השמש], [כבוא, השמש], [בא, השמש], [באה, השמש]]
    en: "the sun setting / set (Gen 15:12, 15:17, 28:11; Exod 17:12) — the day's last slot"
