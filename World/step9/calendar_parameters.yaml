# calendar_parameters.yaml — THE THIRD REGISTRY (THE CLOCK SITTING, 2026-09-07; consensus point E, round two's
# point 2). One row per calendar PARAMETER, each with its channel (ink / received / rounding / modeled / OPEN),
# its source on the local shelf (resolved by script at the sitting), and — under the link review law — its
# teacher. Read by world_engine.Calendar ALONE (the code/data law: the mechanism is ink, the quantities are
# data). `settings:` lists the tradition's recorded alternatives where two stand; `value:` is the setting a
# tape runs, named. `exercised_by:` names the worlds whose tapes run the row; an empty list is UNEXERCISED
# and printed as such by clock_probes.py (the zero-report law — a row no tape runs is visible).
# The specification: ARCHITECTURE/THE_CLOCK.md (the design thread's); the implementation record: CLOCK.md.

parameters:
  day_boundary:
    value: evening
    channel: ink
    source: "Gen 1:5, 8, 13, 19, 23, 31 — 'and there was evening and there was morning': the day begins at evening. Chullin 83a:15 (the Mishnah): 'one day' said of it-and-its-young (Lev 22:28) — the day follows the night (היום הולך אחר הלילה); ben Zoma derived it from 'one day' at creation (Gen 1:5)"
    teacher: "Chullin 83a:15"
    open: "OPEN-5 (O9, 2026-09-08; CLOCK.md 12e): the Temple's day is the row temple_day_boundary; 'until the evening' timers run to the next day boundary (day + 1); a timer's opt-in `boundary: morning` orders its fire after the evening-boundary fires of the same day"
    exercised_by: [the day-grain worlds' 'until the evening' timers]
  month_one:
    value: 1
    channel: ink
    source: "Exod 12:2 — 'this month is for you the head of months; it is the first for you of the months of the year'"
    teacher: null
    exercised_by: [count]
  month_length:
    value: {days: 29, hours: 12, parts: 793}
    channel: received
    source: "Rosh Hashanah 25a:10 — Rabban Gamliel: 'thus I have received from my father's father's house: the renewal of the moon is not less than twenty-nine days and a half and two-thirds of an hour and seventy-three parts' (the hour in 1,080 parts)"
    teacher: "Rosh Hashanah 25a:10"
    exercised_by: [count]
  month_rounding:
    value: alternate_30_29
    channel: rounding
    source: "the half day of Rosh Hashanah 25a:10 rounded to whole days at the day grain: thirty and twenty-nine alternating, the first month thirty"
    teacher: "Rosh Hashanah 25a:10 (the constant); the rounding is the day grain's, labeled"
    open: "OPEN-6 — the two-thirds of an hour and seventy-three parts accumulate about one day in thirty-three months; settled on the tape by the court's declaration (Mishnah Rosh Hashanah 3:1, 'sanctified') where the text records one; between records the alternation runs"
    exercised_by: [count]
  intercalated_month:
    value: {position: after_month_12, length: 30}
    channel: received
    source: "Sanhedrin 12b:8 — 'the year is intercalated only in Adar' (the twelfth month); its length thirty at the day grain (the rounding channel)"
    teacher: "Sanhedrin 12b:8"
    exercised_by: [count]
  new_years:
    value: {kings_and_festivals: 1, animal_tithe: 6, years_sabbaticals_jubilees_planting: 7, trees: 11}
    channel: received
    source: "Mishnah Rosh Hashanah 1:1 — four new years: the first of the first month for kings and festivals; the first of the sixth for the animal tithe; the first of the seventh for years, sabbaticals, jubilees, planting and vegetables; the first of the eleventh for trees"
    teacher: "Mishnah Rosh Hashanah 1:1"
    settings: {animal_tithe_r_eleazar_r_shimon: 7, trees_school_of_hillel: "the fifteenth of the eleventh month"}
    exercised_by: [count]
  intercalation_grounds:
    value: [spring_grain, tree_fruit, season]
    channel: received
    source: "Sanhedrin 11b:5 — 'the year is intercalated on three grounds: the spring grain, the fruit of the trees, and the season; on two of them they intercalate, on one of them alone they do not'"
    teacher: "Sanhedrin 11b:5"
    open: "OPEN-2 — the court's grain and fruit observations are not on the tape; the SEASON ground alone is modeled (Sanhedrin 13a:1 on Exod 34:22 'the festival of ingathering at the turn of the year'), labeled modeled in every fraction, never counted as ink"
    exercised_by: [count]
  intercalation_threshold_days:
    value: 16
    channel: received
    source: "Sanhedrin 13a:4 — 'the year is intercalated only if the season falls short by most of the month; and how much is most of the month? sixteen days. Rabbi Yehuda says: two parts of the month; and how much is two parts of the month? twenty days'"
    teacher: "Sanhedrin 13a:4"
    settings: {sages: 16, r_yehuda: 20}
    exercised_by: [count]
  solar_year_days:
    value: 365.25
    channel: received
    source: "Eruvin 56a:10 (Samuel's table, 56a:8-9) — 'there is not between one season and the next but ninety-one days and seven and a half hours; and a season draws from its fellow no more than half an hour' (אין בין תקופה לתקופה אלא תשעים ואחד יום ושבע שעות ומחצה): four seasons = 365 days and six hours. O9 (2026-09-08; CLOCK.md 12d): FOUND — the clock sitting's search had run the unpointed phrase against the pointed text (the Babylonian file is unpointed, but the search must strip points to be safe); the value unmoved, the channel received"
    teacher: "Eruvin 56a:10"
    open: "OPEN-2 — the season's LENGTH is received; the season's DATE at the epoch (equinox_offset_days) stays modeled: 56a:8-9 give the hours of the day each season falls at, not the epoch's date"
    exercised_by: [count]
  equinox_offset_days:
    value: 0
    channel: modeled
    source: "the autumn equinox's position at the epoch is not on the tape; zero aligns it with the first day of the seventh month of count-year 1 — a modeled alignment, labeled"
    teacher: null
    open: "OPEN-2"
    exercised_by: [count]
  regnal_rounding:
    value: one_day_in_a_year_counts_as_a_year
    channel: received
    source: "Rosh Hashanah 2b:1 — 'the first of the first month is the new year for kings, and one day in a year counts as a year'"
    teacher: "Rosh Hashanah 2b:1"
    exercised_by: []
  count_start_offset_years:
    value: 0
    channel: received
    source: "Arakhin 12b:5 — 'seventeen jubilees Israel counted from when they entered the land until they went out, and you cannot say that they counted from the moment they entered'; 13a:7-8 — seven years of conquest and seven of division, from Caleb's ages (Joshua 14:7, 14:10)"
    teacher: "Arakhin 12b:5, 13a:7-8"
    settings: {rows_frame: 0, historical: 14}
    open: "OPEN-1 — the recorded rows the year-grain scenes replay are stated by count-year ('the seventh year', 'the fiftieth'), so the scenes run the rows' own frame (0); a historical tape runs 14"
    exercised_by: [count]
  fiftieth_in_cycle:
    value: not_counted
    channel: received
    source: "Rosh Hashanah 9a:1 — the Sages: 'you count the fiftieth year and you do not count the fifty-first year, to exclude Rabbi Yehuda who said the fiftieth year counts for both'; Arakhin 12b:4"
    teacher: "Rosh Hashanah 9a:1; Arakhin 12b:4"
    settings: {sages: not_counted, r_yehuda: counts_for_both}
    exercised_by: []
  jubilee_sanctified_from:
    value: {month: 7, day: 1}
    channel: received
    source: "Rosh Hashanah 8b:12 — 'the fiftieth year you sanctify, and you do not sanctify the fifty-first year'; the year's status from the new year of the seventh month"
    teacher: "Rosh Hashanah 8b:12"
    exercised_by: [count]
  jubilee_horn_day:
    value: {month: 7, day: 10}
    channel: ink
    source: "Lev 25:9 — 'in the seventh month, on the tenth of the month, on the Day of Atonement you shall pass the horn'; Rosh Hashanah 8b:8"
    teacher: null
    exercised_by: [count]
  sabbatical_years:
    value: 7
    channel: ink
    source: "Lev 25:4 — 'in the seventh year a sabbath of rest shall be to the land'"
    teacher: null
    exercised_by: [count]
  cycle_years:
    value: 49
    channel: ink
    source: "Lev 25:8 — 'seven sabbaths of years, seven times seven years... forty-nine years'"
    teacher: null
    exercised_by: [count]
  jubilee_year:
    value: 50
    channel: ink
    source: "Lev 25:10-11 — 'you shall sanctify the fiftieth year... a jubilee it is, the fiftieth year'"
    teacher: null
    exercised_by: [count]
  # THE SEQUENTIAL RUN (2026-09-07; SEQUENTIAL_RUN.md section 2): the life era's reading of the ink's year idiom
  life_year_reading:
    value: completed
    channel: ink
    source: "'in the Nth year of X's life' (Gen 7:11) read as the calendar year in which X's completed age is N — the ink's own witnesses agree: Gen 7:6 'Noah was a son of six hundred years and the flood came', 9:28-29 'three hundred and fifty years after the flood... all his days nine hundred and fifty'; 'a son of N years' is N completed throughout (Gen 16:16 + 17:25 = 17:1: 86 + 13 = 99). THE LIFE-YEAR TURNS AT THE NEW YEAR, not at a birthday: Gen 7:11 -> 8:13 -> 8:14 — the 601st year's 'first month, first day' follows the 600th year's 'second month, seventeenth' by ten and a half months, and 8:14's 'second month, twenty-seventh' closes a year and ten days: the age is the calendar years' difference (ink). The day a birth falls within its year is MODELED at the year's first day (Rosh Hashanah 10b:10, Rabbi Eliezer: 'in Tishrei the patriarchs were born' — the received row the model follows; labeled)"
    teacher: null
    settings: {completed: "the Nth year = the year of age N (Gen 7:6, 8:13, 9:28-29)", ordinal: "the Nth year = the year of age N-1 (the strict ordinal wording of 7:11)"}
    open: "OPEN-8 — the two readings differ by one year at Gen 7:11; the tape runs 'completed', the ordinal setting's dates printed beside (checkpoint C2). The tradition's anno-mundi count (Seder Olam, not on the local shelf) runs ONE YEAR LOWER than this machine's creation-year throughout — it counts Adam's creation year as year 0; printed as a remark, never a checkpoint"
    exercised_by: [creation]
  # O1 THE SMALL FIXES (2026-09-07; SEQUENTIAL_RUN.md section 12 d): the births' days where the shelf gives them
  isaac_birth_date:
    placement: refines
    value: {month: 1, day: 15}
    channel: received
    source: "Rosh Hashanah 10b:10 (Rabbi Eliezer) AND 11a:2 (Rabbi Yehoshua) — both arms: 'on Passover Isaac was born' (בפסח נולד יצחק); 11a:13 the derivation from Gen 18:14 'at the appointed time I will return to you' (למועד אשוב אליך — the annunciation at the festival, the birth at Passover). The month is the CALENDAR'S OWN first (Nisan — Exod 12:2 'the first month', the ink's numbering, right in a leap year too: the creation era's ORDINAL seventh from Tishrei is Adar II in a thirteen-month year); the day is the feast's, Lev 23:6 / Exod 12:18 'on the fifteenth day' (ink)"
    teacher: "Rosh Hashanah 11a:13"
    exercised_by: [sequence]
  patriarch_birth_month:
    placement: refines
    value: 7
    channel: received
    source: "Rosh Hashanah 10b:10 — Rabbi Eliezer: 'in Tishrei the patriarchs were born' (בתשרי נולדו אבות); 11a:7 his derivation from 1 Kings 8:2 'in the month of the mighty ones' (the month in which the mighty ones of the world were born). The month is the calendar's own SEVENTH (Tishrei — Lev 23:24's numbering); the DAY within the month is MODELED at the first (labeled); applied to Abraham, Jacob and Esau (Isaac has his own row); every other birth stays modeled at the year's first day"
    teacher: "Rosh Hashanah 11a:7"
    settings: {r_eliezer: 7, r_yehoshua: 1}
    open: "Rabbi Yehoshua's arm — 'in Nisan the patriarchs were born' (11a:2; 11a:9 from 1 Kings 6:1's 'month of Ziv', the month in which the radiant ones of the world were born): the setting 1 (Nisan), UNEXERCISED"
    exercised_by: [sequence]
  second_tablets_given:
    placement: places
    value: {month: 7, day: 10}
    channel: received
    source: "Taanit 30b:8 — 'Yom Kippur, because it has pardon and forgiveness, the day on which the last tablets were given' (יום שניתנו בו לוחות האחרונות); Bava Batra 121a:6 the same row (לוחות אחרונות). The month and day are the exodus era's (Nisan the first): the tenth of the seventh month, Lev 23:27 (ink). THE ASCENT'S DAY = this day − 40: Exod 34:28 'forty days and forty nights' (ink) — the timer's own arithmetic, the same shape as Lev 8:2 = the erection − 7"
    teacher: "Taanit 30b:8; Bava Batra 121a:6"
    open: "the tradition's own date of the second ascent (the first of Elul — Seder Olam, Pirkei deRabbi Eliezer) is NOT on the local Babylonian shelf (searched: 'the new moon of Elul', no row); the machine's computed date of the ascent is printed as a remark, never a checkpoint. The intercession's forty days between the breaking's morrow (Exod 32:30, ink) and this ascent are Deuteronomy's (9:18) — owed to that book"
    exercised_by: [sequence, erection]
  rain_dates:   # THE DEUTERONOMY WALK 9b (2026-09-20): 'the rain of your land in its season, the early rain and the late rain' (Deut 11:14) — THE SEASON NAMED BY THE SHELF, never a constant; no timer, no clock walk
    era: exodus
    idiom: the_year_of_the_rains
    value:
      mention_from: "the last festival day of Sukkot — the eighth day of assembly (R. Yehoshua; Mishnah Ta'anit 1:1-2 through Ta'anit 2a:1-3; R. Eliezer from the first festival day)"
      mention_to: "the first festival day of Passover (Ta'anit 2a:3 — R. Yehuda: the last prayer leader of the eighth day mentions, the first of Passover's first day does not)"
      request_from_land: "the seventh of Marcheshvan (Rabban Gamliel — the halakha (the ruling), Ta'anit 10a:11-12: fifteen days after the feast, for the last pilgrim to reach the Euphrates; the first tanna the third)"
      request_from_diaspora: "sixty days into the season, the sixtieth day counted with the after (Chananya — the halakha (the ruling), Ta'anit 10a:12, 10a:15)"
      early_rain: "Marcheshvan — the third, the seventh and the seventeenth its three dates (Ta'anit 6a:3, 6a:5, 6a:7 — 'in its due time'; for a blessing, not for washing away)"
      late_rain: "Nisan (Ta'anit 6a:5, 6a:7 — after Nisan a curse's sign)"
      fasts_individuals: "the seventeenth of Marcheshvan without rain — three fasts, Monday, Thursday and Monday (Mishnah Ta'anit 1:4 through 10a:16-19)"
      fasts_community: "the New Moon of Kislev without rain — three fasts decreed by the court (Mishnah Ta'anit 1:5 through 10a:16)"
    boundary: "the mention in the resurrection blessing from the feast's last day to Passover's first; the request in the years' blessing from the seventh of Marcheshvan (the sixtieth day abroad) — both indispensable (Berakhot 33a:29: omitted, one returns to the beginning)"
    channel: received
    source: "Deut 11:14 'the rain of your land in its season, the early rain and the late rain' — the rain asked in the service of the heart (11:13's 'serve Him with all your heart' is prayer, 11:14's rain follows it — Ta'anit 2a:11); Mishnah Ta'anit 1:1-5 through the Gemara (the export lacks the Mishnah's own file); Berakhot 33a:11 the liturgy's two seats"
    teacher: "Ta'anit 2a:1-3, 2a:11, 6a:3-7, 10a:11-16; Berakhot 33a:11, 33a:29"
    exercised_by: [blessing_and_curse]
  gerizim_ebal_place:   # THE DEUTERONOMY WALK 9b (2026-09-20): 'beyond the Jordan, behind the way of the sunset, in the land of the Canaanite who dwells in the Arabah, opposite Gilgal, beside the terebinths of Moreh' (Deut 11:30) — THREE ARMS on the shelf; the tape unmoved (the ceremony's run Joshua 8:30-35 outside the Torah)
    era: exodus
    idiom: the_place_of_the_blessing_and_the_curse
    value:
      r_yehuda: "Shechem — the terebinths of Moreh by the verbal analogy with Genesis 12:6 (Sotah 32a:10, 33b:4-5; Mishnah Sotah 7:5; the Sifrei 56:3); the Samaritans' addition 'Shechem' conceded and refuted by the analogy they do not use (33b:6)"
      r_elazar: "two mounds by the Jordan, opposite Gilgal — 27:4's 'when you have passed over … on Mount Ebal' the same day; 'in the Arabah' not Shechem's mountains; Shechem the Hivites', not 'the Canaanite's' (Sotah 33b:7-9)"
      r_eliezer_ben_yaakov: "a ROUTE, not a place — 'the way' a road, 'that dwell' settled areas, 'the Arabah' the plain: the verse shows the way the second time as the pillar of cloud did the first (Sotah 33b:10)"
    boundary: "three arms; the decision (7) of the design stands — recorded, not resolved; the DATA row of the compile"
    channel: received
    source: "Deut 11:29-30; 27:4, 27:12-13; Joshua 8:30-35; Genesis 12:6 (journeyed 'the place of Shechem' on the tape); Mishnah Sotah 7:5; Tosefta Sotah 8:6; Babylonian Talmud Sotah 32a:10, 33b:4-10, 36b:4-5"
    teacher: "Sotah 33b:4-10"
    exercised_by: [blessing_and_curse]
  the_rite_of_slaughter:   # THE DEUTERONOMY WALK 10b (2026-09-21): 'you shall slaughter of your herd and of your flock … AS I HAVE COMMANDED YOU' (Deut 12:21) — THE RECEIPT WITHOUT THE NAME, ITS REFERENT THE ORAL LAW: the written text holds no rite (the code/data separation law's own case) — a parameter the cell reads as DATA; no timer, no clock walk
    era: exodus
    idiom: the_rite_of_slaughter
    value:
      the_signs: "the gullet and the windpipe — the majority of ONE sign for a bird and of TWO for an animal (Mishnah Chullin 2:1 the value; Rabbi on 12:21's 'as I have commanded you': 'Moses was commanded on the gullet and the windpipe' — Chullin 28a:5; 85b:16, 86a:3; the Sifrei 75:15)"
      the_bird: "a parameter of its own — the bird's slaughter by Torah law (Rabbi, from 12:21) or by the scribes (R. Elazar HaKappar, from 12:22's comparison 'as the gazelle and the hart are eaten' — Chullin 28a:4); WHICH SIGN — either one, or the gullet (28a:6; the pinching refutes Rav Adda, 28a:13)"
      the_uncertainty: "any uncertainty in slaughter, invalid (Chullin 28a:8); the interruption and the deficiency rules (28a:11-12)"
      the_agent: "everyone, always, with anything that cuts — no fear of the appearance of worship on a roof or a ship (Mishnah Chullin 1:1-2 through Chullin 17a:16)"
      the_wild_and_the_bird: "the comparison that teaches and is taught (the Sifrei 75:15) — the wild animal's slaughter as the domestic's; the bird's disputed"
    boundary: "the rite is ORAL — 'as I have commanded you' points at no written verse (the finder's fourth shape: no Name, no callee on the tape — Exodus 23:15's 'as I commanded you' the one kin with a WRITTEN callee, calendar.matzah); the cell reads the parameter as data and asserts no rite from the ink"
    channel: received
    source: "Deut 12:21 (the receipt without the Name), 12:22 (the comparison); Mishnah Chullin 1:1-2, 2:1; Babylonian Talmud Chullin 17a:16, 28a:4-13, 85b:16, 86a:3; the Sifrei on Deuteronomy 75:15"
    teacher: "Chullin 28a:5"
    exercised_by: [place_name]
  the_wilderness_flesh:   # THE DEUTERONOMY WALK 10b (2026-09-21): 'only, with all the desire of your soul you may slaughter and eat flesh' (Deut 12:15), 'when the LORD your God enlarges your border … you may eat flesh' (12:20) — THE RELEASE SAID IN NEW WORDS, A LAW CHANGED BY A PLACE: two arms and a third state on the shelf; the tape unmoved (the release CONDITIONAL on the entry — the entry the run's)
    era: exodus
    idiom: the_flesh_of_desire
    value:
      r_yishmael: "the flesh of desire FORBIDDEN in the wilderness — eaten only as an offering at the tent's door (Leviticus 17:3-5); RELEASED at the entry ('when the LORD enlarges your border … you may eat flesh', 12:20) — Chullin 16b:14-15; THE DISTANCE ITS GROUND: near the Tabernacle they ate from God's table, 'when the place is too far' (12:21) the release's reason (16b:17; the Sifrei 75:3)"
      r_akiva: "the flesh of desire NEVER forbidden — the wilderness permitted the STABBED flesh (no rite); the entry requires the RITE ('you shall slaughter … as I have commanded you', 12:21) — Chullin 17a:2-4 ('the flesh of stabbing never permitted' after the entry; the Sifrei 75:4)"
      the_exile: "the release PERSISTS — 'one may always slaughter' (Chullin 16b:16; 17a:3): A THIRD STATE, the exile's — the flesh of desire permitted with the rite where the place is unreachable"
    boundary: "two arms and a third state; recorded, not resolved — the DATA row of the compile; 12:22's wild animal outside the ban either way (17a:10); 12:15's 'the unclean and the clean' the redeemed consecrated's release beside it (Bekhorot 15b:9-12)"
    channel: received
    source: "Deut 12:15, 12:20-22; Leviticus 17:3-5 (sanctions.outside by CALL — the tent-door rule); Numbers 11:4 (the craving's kin); Mishnah Chullin 1:1; Babylonian Talmud Chullin 16b:14-17a:10; the Sifrei on Deuteronomy 75:3-4"
    teacher: "Chullin 16b:14-17a:4"
    exercised_by: [place_name]
  # O5 THE MOADIM RE-TYPE (2026-09-07; CLOCK.md section 10): the appointed times as CALENDAR KEYS from Lev 23's own dates —
  # keyed by the convocation names the moadim scene submits, so an event's `day` value is the key; the Calendar reads them
  # beside its six standing keys, and a scene walks to a festival by clock.next(key), never by month arithmetic of its own
  festival_dates:
    value:
      passover: {month: 1, day: 14}
      passover_1: {month: 1, day: 15}
      passover_7: {from: passover_1, plus: 6}
      passover_sheni: {month: 2, day: 14}   # THE TENT sitting 2 (2026-09-09): Num 9:11 'in the second month, on the fourteenth day, between the evenings they shall keep it' — the second Passover's date, the case-born law's due
      atzeret: {from: omer, plus: 49}
      rosh_hashanah: {month: 7, day: 1}
      yom_kippur: {month: 7, day: 10}
      sukkot_1: {month: 7, day: 15}
      shemini: {from: sukkot_1, plus: 7}
      sabbath: {key: week}
    channel: ink
    source: "Lev 23:5 'in the first month, on the fourteenth of the month, between the evenings, a Passover to the LORD' (passover); 23:6 'on the fifteenth day of this month the feast of unleavened bread' with 23:7 'on the first day a holy convocation' (passover_1); 23:8 'on the seventh day a holy convocation' — the seventh of 23:6's seven days (passover_7 = passover_1 + 6); 23:15-16 'from the morrow of the Sabbath... seven complete weeks... until the morrow of the seventh Sabbath you shall count FIFTY days' — the omer day counted first, the fiftieth sanctified (atzeret = omer + 49; the omer's own day is the row omer_day); 23:24 'in the seventh month, on the first of the month' (rosh_hashanah); 23:27 'on the tenth of this seventh month' (yom_kippur); 23:34 'on the fifteenth day of this seventh month' (sukkot_1); 23:36 'on the eighth day a holy convocation... an assembly' (shemini = sukkot_1 + 7); 23:3 'six days shall work be done and on the seventh day a Sabbath of solemn rest' (sabbath = the Calendar's week). The months in the calendar's own numbering — Exod 12:2 'this month is for you the head of months' (Nisan the first); Num 9:11 'in the second month, on the fourteenth day, between the evenings' (passover_sheni — THE TENT sitting 2, 2026-09-09)"
    teacher: null
    exercised_by: [moadim, pesach_sheni]   # THE TENT sitting 2 (2026-09-09): the second Passover's due through the Calendar (passover_sheni)
  omer_day:
    value: {month: 1, day: 16}
    channel: received
    source: "Lev 23:11 'on the morrow of the SABBATH the priest shall wave it' (ממחרת השבת) READ as the morrow of the FESTIVAL — the sixteenth of the first month: Sifra Emor Chapter 12 (the four routes); Menachot 65a-66a (the Sages against the Boethusians); the runner's morrow_reading cell graded on Mishnah Chagigah 2:4 (Atzeret can fall beside the Sabbath — so the morrow is the festival's)"
    teacher: "Sifra Emor Chapter 12; Menachot 65a-66a"
    settings: {sages: {month: 1, day: 16}, boethusians: "the Sunday after the Sabbath of the festival week — the refused reading (Menachot 65a), UNEXERCISED"}
    exercised_by: [moadim]

