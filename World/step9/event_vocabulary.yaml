    en: "a warning refused — the entry gate 'and if you do not listen to Me and do not do all these commandments' and the four escalations 'and if with these you do not listen to Me, I will add to chastise you seven for your sins', 'and if you walk with Me in hostility and are not willing to listen to Me', 'and if by these you are not chastised for Me, and walk with Me in hostility', 'and if with this you do not listen to Me, and walk with Me in hostility': THE CASCADE — the five gates computed from the 'and if' tokens, the sevenfold multiplier read at the four seven-tokens, every sanction block preceded by its warning, the fifth block's desolation and scattering (the good measure and the harsh measure)"
