  house_sold:
    en: "a house sold — 'and a man, when he sells a dwelling house in a walled city, its redemption shall be until the end of the year of its sale', 'and if it is not redeemed until a full year is complete, the house in the city that has a wall shall stand in perpetuity to its buyer for his generations, it shall not go out in the jubilee', 'and the houses of the villages that have no wall around shall be reckoned as the field of the land, it shall have redemption and in the jubilee it shall go out', 'and the cities of the Levites, the houses of the cities of their holding, the Levites shall have a perpetual redemption', 'and the field of the pasture of their cities shall not be sold, for it is a perpetual holding for them': the four house classes by their own clauses — the walled city's one-year redemption as a TIMER then perpetuity (Hillel's deposit in the chamber), the village as the field, the Levite's perpetual redemption, the pasture unsellable"
    he: "וְאִישׁ כִּי יִמְכֹּר בֵּית מוֹשַׁב עִיר חוֹמָה וְהָיְתָה גְּאֻלָּתוֹ עַד תֹּם שְׁנַת מִמְכָּרוֹ (and a man, when he sells a dwelling house in a walled city, its redemption shall be until the end of the year of its sale — Lev 25:29); וְאִם לֹא יִגָּאֵל עַד מְלֹאת לוֹ שָׁנָה תְמִימָה וְקָם הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לא חֹמָה לַצְּמִיתֻת לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו לֹא יֵצֵא בַּיֹּבֵל (and if it is not redeemed until a full year is complete, the house in the city that has a wall shall stand in perpetuity to its buyer for his generations, it shall not go out in the jubilee — Lev 25:30); וּבָתֵּי הַחֲצֵרִים אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב גְּאֻלָּה תִּהְיֶה לּוֹ וּבַיֹּבֵל יֵצֵא (and the houses of the villages that have no wall around shall be reckoned as the field of the land, it shall have redemption and in the jubilee it shall go out — Lev 25:31); וְעָרֵי הַלְוִיִּם בָּתֵּי עָרֵי אֲחֻזָּתָם גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם (and the cities of the Levites, the houses of the cities of their holding, the Levites shall have a perpetual redemption — Lev 25:32); וּשְׂדֵה מִגְרַשׁ עָרֵיהֶם לֹא יִמָּכֵר כִּי אֲחֻזַּת עוֹלָם הוּא לָהֶם (and the field of the pasture of their cities shall not be sold, for it is a perpetual holding for them — Lev 25:34)"
    form: case
    witness: ["Lev 25:29 | ואיש כי ימכר בית מושב עיר חומה והיתה גאלתו עד תם שנת ממכרו", "Lev 25:30 | ואם לא יגאל עד מלאת לו שנה תמימה וקם הבית אשר בעיר אשר לא חמה לצמיתת לקנה אתו לדרתיו לא יצא ביבל", "Lev 25:31 | ובתי החצרים אשר אין להם חמה סביב על שדה הארץ יחשב גאלה תהיה לו וביבל יצא", "Lev 25:32 | וערי הלוים בתי ערי אחזתם גאלת עולם תהיה ללוים", "Lev 25:34 | ושדה מגרש עריהם לא ימכר כי אחזת עולם הוא להם"]
