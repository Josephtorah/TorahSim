    en: "Moses interceded — 'and Moses beseeched the face of the LORD his God' and 'and now, if You will forgive their sin — and if not, blot me, I pray, from Your book which You have written': the decree restrained by prayer — 'let Me alone' revealing that prayer holds it (Berakhot 32a:16), the vow-annulment law applied to the decree — 'vayechal' here, 'he shall not profane his word' there (Berakhot 32a:19, Rava), the oath by His name endures (32a:24), 'and the LORD relented of the evil' (32:14); the confession specifying the sin — 'this people has sinned a great sin, and they made themselves gods of gold' (Yoma 86b:14, R. Yehuda b. Bava); the three books opened from 'blot me / from Your book / which You wrote' (Rosh Hashanah 16b:14); the individual rule — 'whoever has sinned against Me, HIM I will blot' (32:33), substitution refused"
