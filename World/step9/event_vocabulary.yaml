    en: "a field of the holding consecrated — 'and if a man sanctifies to the LORD of the field of his holding, the valuation shall be by its seed, a homer of barley seed at fifty shekels of silver', 'and if after the jubilee he sanctifies his field, the priest shall reckon to him the money by the years remaining until the jubilee year, and it shall be deducted from the valuation', 'and the field in its going out in the jubilee shall be holy to the LORD as a devoted field, to the priest shall be its holding', 'in the jubilee year the field shall return to him from whom he bought it': the fifty per homer deducted by the years to a sela and a pundion, the fifth on the sanctifier's and the heir's redemption, the field's going out as an ENTITLEMENT (a timer to the fiftieth whose value is the route — to the priests, to him from whom he bought it, to his father, to all his brother priests, from the hand of another) RELEASED on the proclamation's arms (O6, 2026-09-07: Lev 27:21/27:24 by reference to the jubilee's verdict, Arakhin 29a:17 the exile's reach, Mishnah Arakhin 7:3-5 the rows, 7:4's three arms at the going out)"
