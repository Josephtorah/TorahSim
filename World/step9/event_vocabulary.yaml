# THE EVENT-TYPE REGISTRY — read by events_layer.py (2026-09-07, D9-i: THE DAEMON CAMPAIGN's seeding sitting).
# The daemon campaign's first registry, in the effects registry's own harvest shape: every EVENT TYPE the
# simulator's tape may carry, harvested from what was already written — the twelve daemons' consumed kinds
# and the seven scene tapes' submitted kinds (World/step9/*.py, censused by script), joined by verse address
# to the corpus world's 557 narrative events (corpus_world.sqlite, the frozen units' own EVENT operators).
# Each type carries: en (the English), he (the ink's own words at the witness, pointed, with English beside),
# form (act / speech / statute / case — see below), witness (verse + consonantal run, MACHINE-VERIFIED by
# events_layer.py against the Tanakh DB), ink (every address the tape cites), corpus (the frozen unit and the
# narrative tape's own label at that address where it logged one), tape (who submits it, who consumes it and
# writes what), fields (the event's parameters beyond kind/subject/case_source), and aliases_in_code where the
# seeding found one act under two names or one name over two acts.
#
# THE FENCE (method law 6, stated for events): an event is an ACT THE TEXT RECORDS — a deed, an utterance, the
# narrator's own law sentence — or a recorded case replayed as a labeled test scene; nothing here is produced by
# a daemon. A daemon CONSUMES events and WRITES the ledger; it never emits an event. Cascades run through ledger
# state. The log's OTHER record classes (WRITE, TIMER-SET, TIMER-FIRE, TIMER-CANCEL, ATOMIC-BLOCK) are not
# events and take no type from this file: a timer's firing is its own record class.
# THE FORMS: act = a deed the run records (the narrative verb, usually the wayyiqtol — the "and he did" form);
#   speech = a command, blessing, oath, sentence or plea the text records as UTTERED (the utterance is the event;
#   the obligation it creates is the daemon's write); statute = the narrator's own law sentence inside the story;
#   case = the law's own case token (the "when"/"if" clause) — a recorded Mishnah case replayed as a test scene
#   names the clause it instantiates, so the witness is the clause, not a narrative.
# THE RULE FOR NEW TYPES (the gate D9-ii enforces): a daemon may watch only a type registered here; a type enters
#   with its witnesses (ink verified; corpus; tape) — never designed, always harvested. The corpus tape's own labels
#   (the narrative_verbs section) are enumerated for the join and become event types only when promoted here.
# THE LINK FIELD (THE LINK REVIEW LAW, owner-ruled 2026-09-07; sitting LR1): a type whose witnesses sit in MORE
#   THAN ONE CHAPTER is a link the machine's shape made — one type over two seats — and carries `link:`:
#   reference (the seats name one institution; the lint verifies a shared CONTENT LEMMA between the seats),
#   transfer (a rule moved on a shared word or a topic — `taught_by:` names the teacher, else the lint refuses),
#   hypothesis (an untaught transfer, kept and labeled), UNCLASSIFIED (asked, unanswered — the LR2 worklist).
#   A multi-seat type without the field fails the lint. The rule: a person does not derive a verbal analogy on
#   his own (Pesachim 66a:12, Niddah 19b:12; logic/MIDDOT.md under I2).
# Model layer; read-only over the corpus; touches no unit. Append as TEXT (a mapping; never a list).
