    he: "וְכִי תִמְכְּרוּ מִמְכָּר לַעֲמִיתֶךָ אוֹ קָנֹה מִיַּד עֲמִיתֶךָ אַל תּוֹנוּ אִישׁ אֶת אָחִיו (and when you sell a sale to your fellow or buy from your fellow's hand, do not wrong one another — Lev 25:14); בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל תִּקְנֶה מֵאֵת עֲמִיתֶךָ בְּמִסְפַּר שְׁנֵי תְבוּאֹת יִמְכָּר לָךְ (by the number of years after the jubilee you shall buy from your fellow, by the number of harvest years he shall sell to you — Lev 25:15); כִּי יָמוּךְ אָחִיךָ וּמָכַר מֵאֲחֻזָּתוֹ וּבָא גֹאֲלוֹ הַקָּרֹב אֵלָיו וְגָאַל אֵת מִמְכַּר אָחִיו (when your brother grows poor and sells of his holding, his redeemer who is near to him shall come and redeem his brother's sale — Lev 25:25); וְחִשַּׁב אֶת שְׁנֵי מִמְכָּרוֹ וְהֵשִׁיב אֶת הָעֹדֵף לָאִישׁ אֲשֶׁר מָכַר לוֹ וְשָׁב לַאֲחֻזָּתוֹ (and he shall reckon the years of its sale and return the surplus to the man to whom he sold it, and return to his holding — Lev 25:27); וְאִם לֹא מָצְאָה יָדוֹ דֵּי הָשִׁיב לוֹ וְהָיָה מִמְכָּרוֹ בְּיַד הַקֹּנֶה אֹתוֹ עַד שְׁנַת הַיּוֹבֵל וְיָצָא בַּיֹּבֵל וְשָׁב לַאֲחֻזָּתוֹ (and if his hand has not found enough to return to him, his sale shall be in the hand of its buyer until the jubilee year, and it shall go out in the jubilee and he shall return to his holding — Lev 25:28)"
