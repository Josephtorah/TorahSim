  terumah_eaten:
    en: "the holy food eaten — 'and no stranger shall eat a holy thing, a priest's tenant or a hired man shall not eat a holy thing', 'and a priest, when he acquires a soul, the purchase of his money, he may eat of it, and one born in his house, they may eat of his bread', 'and a priest's daughter, when she becomes a stranger man's, she shall not eat of the heave offering of the holy things', 'and a priest's daughter, when she is a widow or divorced and has no seed and returns to her father's house as in her youth, of her father's bread she may eat', 'and a man, when he eats a holy thing in error, he shall add its fifth to it and give the holy thing to the priest': the feeders' file (the money's purchase and the house-born eat, the daughter to a stranger barred, the returned daughter fed, the last living feeder decides), the fifth on the erring eater and the principal alone on the deliberate, the thief's double, the workers' fifth"
    he: "וְכָל זָר לֹא יֹאכַל קֹדֶשׁ תּוֹשַׁב כֹּהֵן וְשָׂכִיר לֹא יֹאכַל קֹדֶשׁ (and no stranger shall eat a holy thing, a priest's tenant or a hired man shall not eat a holy thing — Lev 22:10); וְכֹהֵן כִּי יִקְנֶה נֶפֶשׁ קִנְיַן כַּסְפּוֹ הוּא יֹאכַל בּוֹ וִילִיד בֵּיתוֹ הֵם יֹאכְלוּ בְלַחְמוֹ (and a priest, when he acquires a soul, the purchase of his money, he may eat of it, and one born in his house, they may eat of his bread — Lev 22:11); וּבַת כֹּהֵן כִּי תִהְיֶה לְאִישׁ זָר הִוא בִּתְרוּמַת הַקֳּדָשִׁים לֹא תֹאכֵל (and a priest's daughter, when she becomes a stranger man's, she shall not eat of the heave offering of the holy things — Lev 22:12); וּבַת כֹּהֵן כִּי תִהְיֶה אַלְמָנָה וּגְרוּשָׁה וְזֶרַע אֵין לָהּ וְשָׁבָה אֶל בֵּית אָבִיהָ כִּנְעוּרֶיהָ מִלֶּחֶם אָבִיהָ תֹּאכֵל (and a priest's daughter, when she is a widow or divorced and has no seed and returns to her father's house as in her youth, of her father's bread she may eat — Lev 22:13); וְאִישׁ כִּי יֹאכַל קֹדֶשׁ בִּשְׁגָגָה וְיָסַף חֲמִשִׁיתוֹ עָלָיו וְנָתַן לַכֹּהֵן אֶת הַקֹּדֶשׁ (and a man, when he eats a holy thing in error, he shall add its fifth to it and give the holy thing to the priest — Lev 22:14)"
    form: case
    witness: ["Lev 22:10 | וכל זר לא יאכל קדש תושב כהן ושכיר לא יאכל קדש", "Lev 22:11 | וכהן כי יקנה נפש קנין כספו הוא יאכל בו ויליד ביתו הם יאכלו בלחמו", "Lev 22:12 | ובת כהן כי תהיה לאיש זר הוא בתרומת הקדשים לא תאכל", "Lev 22:13 | ובת כהן כי תהיה אלמנה וגרושה וזרע אין לה ושבה אל בית אביה כנעוריה מלחם אביה תאכל", "Lev 22:14 | ואיש כי יאכל קדש בשגגה ויסף חמשיתו עליו ונתן לכהן את הקדש"]
