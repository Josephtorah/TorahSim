    he: "אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמִן הַגֵּר בְּיִשְׂרָאֵל אֲשֶׁר יַקְרִיב קָרְבָּנוֹ לְכָל נִדְרֵיהֶם וּלְכָל נִדְבוֹתָם (a man, a man of the house of Israel and of the stranger in Israel who brings his offering for all their vows and for all their freewill offerings — Lev 22:18); לִרְצֹנְכֶם תָּמִים זָכָר בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים (to your acceptance, whole, male, of the herd, of the sheep, and of the goats — Lev 22:19); כֹּל אֲשֶׁר בּוֹ מוּם לֹא תַקְרִיבוּ כִּי לֹא לְרָצוֹן יִהְיֶה לָכֶם (anything in which is a blemish you shall not bring, for it shall not be to acceptance for you — Lev 22:20); וְאִישׁ כִּי יַקְרִיב זֶבַח שְׁלָמִים לַיהוָה לְפַלֵּא נֶדֶר אוֹ לִנְדָבָה (and a man, when he brings a peace offering to the LORD to fulfil a vow or for a freewill offering — Lev 22:21); עַוֶּרֶת אוֹ שָׁבוּר אוֹ חָרוּץ אוֹ יַבֶּלֶת אוֹ גָרָב אוֹ יַלֶּפֶת לֹא תַקְרִיבוּ אֵלֶּה לַיהוָה (blind or broken or split or having a wart or scabbed or lichened, you shall not bring these to the LORD — Lev 22:22); וּמָעוּךְ וְכָתוּת וְנָתוּק וְכָרוּת לֹא תַקְרִיבוּ לַיהוָה (and the crushed and the pressed and the torn and the cut you shall not bring to the LORD — Lev 22:24); וּמִיַּד בֶּן נֵכָר לֹא תַקְרִיבוּ אֶת לֶחֶם אֱלֹהֵיכֶם (and from the hand of a foreigner you shall not bring the bread of your God — Lev 22:25); וְכִי תִזְבְּחוּ זֶבַח תּוֹדָה לַיהוָה לִרְצֹנְכֶם תִּזְבָּחוּ (and when you slaughter a thanksgiving offering to the LORD, to your acceptance you shall slaughter it — Lev 22:29)"
