  priest_impure_approached_holy:
    en: "an impure priest approaches or eats the holy things — 'any man who approaches, of all your seed, to the holy things which the children of Israel sanctify to the LORD, with his impurity upon him, that soul shall be cut off from before Me', 'a man, a man of the seed of Aaron who is leprous or has a discharge shall not eat of the holy things until he is pure', 'the soul that touches it shall be impure until evening, and shall not eat of the holy things unless he has bathed his flesh in water', 'and the sun sets and he is pure, and afterward he may eat of the holy things': the karet on the deliberate impure approach, the death by Heaven on the deliberate impure eating of terumah, the two gates (sunset gates terumah, the atonement offering gates the holy), the whole body immersed not limb by limb, the leper and the zav until pure by call to the clocks engine"
    he: "כָּל אִישׁ אֲשֶׁר יִקְרַב מִכָּל זַרְעֲכֶם אֶל הַקֳּדָשִׁים אֲשֶׁר יַקְדִּישׁוּ בְנֵי יִשְׂרָאֵל לַיהוָה וְטֻמְאָתוֹ עָלָיו וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִלְּפָנַי (any man who approaches, of all your seed, to the holy things which the children of Israel sanctify to the LORD, with his impurity upon him, that soul shall be cut off from before Me — Lev 22:3); אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן וְהוּא צָרוּעַ אוֹ זָב בַּקֳּדָשִׁים לֹא יֹאכַל עַד אֲשֶׁר יִטְהָר (a man, a man of the seed of Aaron who is leprous or has a discharge shall not eat of the holy things until he is pure — Lev 22:4); נֶפֶשׁ אֲשֶׁר תִּגַּע בּוֹ וְטָמְאָה עַד הָעָרֶב וְלֹא יֹאכַל מִן הַקֳּדָשִׁים כִּי אִם רָחַץ בְּשָׂרוֹ בַּמָּיִם (the soul that touches it shall be impure until evening, and shall not eat of the holy things unless he has bathed his flesh in water — Lev 22:6); וּבָא הַשֶּׁמֶשׁ וְטָהֵר וְאַחַר יֹאכַל מִן הַקֳּדָשִׁים (and the sun sets and he is pure, and afterward he may eat of the holy things — Lev 22:7)"
