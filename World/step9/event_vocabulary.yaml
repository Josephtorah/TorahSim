    he: "אִישׁ מִזַּרְעֲךָ לְדֹרֹתָם אֲשֶׁר יִהְיֶה בוֹ מוּם לֹא יִקְרַב לְהַקְרִיב לֶחֶם אֱלֹהָיו (a man of your seed for their generations in whom is a blemish shall not approach to offer the bread of his God — Lev 21:17); כִּי כָל אִישׁ אֲשֶׁר בּוֹ מוּם לֹא יִקְרָב (for any man in whom is a blemish shall not approach — Lev 21:18); כָּל אִישׁ אֲשֶׁר בּוֹ מוּם מִזֶּרַע אַהֲרֹן הַכֹּהֵן לֹא יִגַּשׁ לְהַקְרִיב אֶת אִשֵּׁי יְהוָה (any man in whom is a blemish of the seed of Aaron the priest shall not draw near to offer the fire offerings of the LORD — Lev 21:21); לֶחֶם אֱלֹהָיו מִקָּדְשֵׁי הַקֳּדָשִׁים וּמִן הַקֳּדָשִׁים יֹאכֵל (the bread of his God, of the most holy and of the holy, he may eat — Lev 21:22); אַךְ אֶל הַפָּרֹכֶת לֹא יָבֹא וְאֶל הַמִּזְבֵּחַ לֹא יִגַּשׁ כִּי מוּם בּוֹ (only to the veil he shall not come and to the altar he shall not draw near, for a blemish is in him — Lev 21:23)"
