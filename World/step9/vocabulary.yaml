# THE CASE-INPUT REGISTRY — the tradition's own vocabulary, discovered not
# designed. Every dimension and value was introduced by a source actually
# read (EXAM_LEDGER.md); nothing here was invented. Hebrew is QUOTED from
# the introducing row's own ink where it stands there (accents stripped),
# always with English beside it. Growth is APPEND-ONLY with provenance:
# a case cannot be stated in vocabulary no source ever defined.
#
# MULTI-ATTESTATION (2026-08-31, for the 24-book horizon): when a later
# book re-introduces an existing value, the value is NOT duplicated — the
# new source is appended to its also_attested list. First introducer stays
# first forever; the list is the value's growing witness roster.

- dimension: person
  kind: choice
  introduced_by: Mishnah Yevamot 6:6
  values:
  - value: man
    he: אָדָם
    gloss: a person/man — the Mishnah's subject of the duty ('a man may not neglect...')
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
  - value: woman
    he: אִשָּׁה
    gloss: woman
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
- dimension: event
  kind: choice
  introduced_by: Mishnah Yoma 8:7
  values:
  - value: rockslide_burial
    he: מַפֹּלֶת
    gloss: a collapse/rockslide ('one upon whom a rockslide fell')
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
- dimension: day
  kind: choice
  introduced_by: Mishnah Yoma 8:7 (context; the Shabbat term explicit at Yoma 85a)
  values:
  - value: shabbat
    he: שַׁבָּת
    gloss: Shabbat
    introduced_by: Mishnah Yoma 8:7 via Yoma 85a — the desecration question is the
      row's frame
    also_attested: []
- dimension: uncertain
  kind: multi_choice
  introduced_by: Mishnah Yoma 8:7 — סָפֵק (safek, 'doubt') three times in one row
  values:
  - value: victim_present
    he: סָפֵק הוּא שָׁם סָפֵק אֵינוֹ שָׁם
    gloss: doubt he is there, doubt he is not
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
  - value: victim_alive
    he: סָפֵק חַי סָפֵק מֵת
    gloss: doubt alive, doubt dead
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
  - value: victim_jewish
    he: סָפֵק נָכְרִי סָפֵק יִשְׂרָאֵל
    gloss: doubt gentile, doubt Jew
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
- dimension: found
  kind: choice
  introduced_by: Mishnah Yoma 8:7
  values:
  - value: alive_mid_clearing
    he: מְצָאוּהוּ חַי
    gloss: they found him alive
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
  - value: dead_mid_clearing
    he: וְאִם מֵת
    gloss: and if dead
    introduced_by: Mishnah Yoma 8:7
    also_attested: []
- dimension: children
  kind: list
  introduced_by: Mishnah Yevamot 6:6
  values:
  - value: male
    he: זָכָר
    gloss: male
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
  - value: female
    he: נְקֵבָה
    gloss: female
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
- dimension: married_years
  kind: integer
  introduced_by: Mishnah Yevamot 6:6 — עֶשֶׂר שָׁנִים (eser shanim, 'ten years')
- dimension: births
  kind: integer
  introduced_by: Mishnah Yevamot 6:6 — וְלֹא יָלְדָה ('and she did not give birth')
- dimension: miscarriage_at_year
  kind: integer
  introduced_by: Mishnah Yevamot 6:6 — הִפִּילָה ('she miscarried'), the restart
    clause
- dimension: query
  kind: choice
  introduced_by: Mishnah Eduyot 2:10
  values:
  - value: duration_of_judgment
    he: מִשְׁפַּט
    gloss: the judgment of — the row's repeated frame
    introduced_by: Mishnah Eduyot 2:10
    also_attested: []
- dimension: subject
  kind: choice
  introduced_by: Mishnah Eduyot 2:10
  values:
  - value: generation_of_the_flood
    he: דּוֹר הַמַּבּוּל
    gloss: the generation of the flood
    introduced_by: Mishnah Eduyot 2:10
    also_attested: []
  - value: the_wicked_in_gehinom
    he: רְשָׁעִים בְּגֵיהִנֹּם
    gloss: the wicked in Gehinnom
    introduced_by: Mishnah Eduyot 2:10
    also_attested: []
