# THE CASE-INPUT REGISTRY — the tradition's own vocabulary, discovered not
# designed. Every dimension and value was introduced by a source actually
# read (EXAM_LEDGER.md); nothing here was invented. Hebrew is QUOTED from
# the introducing row's own ink where it stands there (accents stripped),
# always with English beside it. Growth is APPEND-ONLY with provenance:
# a case cannot be stated in vocabulary no source ever defined.
#
# MULTI-ATTESTATION (2026-08-31, for the 24-book horizon): when a later
# book re-introduces an existing value, the value is NOT duplicated — the
# new source is appended to its also_attested list. First introducer stays
# first forever; the list is the value's growing witness roster.

- dimension: person
  kind: choice
  introduced_by: Mishnah Yevamot 6:6
  values:
  - value: man
    he: אָדָם
    gloss: a person/man — the Mishnah's subject of the duty ('a man may not neglect...')
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
  - value: woman
    he: אִשָּׁה
    gloss: woman
    introduced_by: Mishnah Yevamot 6:6
    also_attested: []
