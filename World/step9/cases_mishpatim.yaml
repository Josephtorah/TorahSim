# THE MISHPATIM EXAM — the first parashah-rhythm Step 9 round (owner:
# "run step 9 on mishpatim"), same day the parashah was derived.
# Membership: the 59 bare Mishnah rows citing Exod 22:1-24:18 (252
# Mishnah-category rows enumerated; commentary layers outside scope);
# chapter 21's rows already face the proven exo21 machine. Read-source
# record: logic/oral_triage/mishpatim_exam_mishnah_2026-09-01.md.
# Method: THE_STEPS Step 9 — exam first, classify, findings queued (and
# under the 2026-09-01 auto-seat law, F-017..F-020 seated same sitting),
# compile, re-run. THE HEADLINE, third repetition: the morning's Mekhilta
# reading IS the case shelf — same tannaim, same tables, read hours apart.
# Provenance shape: mishnah + mekhilta_spine + exodus_anchor (the spine
# read the same sitting the statutes were derived).

- module: four_avot_damages
  tractate: Bava Kamma
  oracle: Mishnah Bava Kamma 1:1 + 2:2 + 5:7 + 6:2; Mishnah Gittin 5:1
  exodus_anchor: {unit: exo_22_property_social, ref: Exod.22.4-5,
    claims: [EX22-02, EX22-03, EX22-08]}
  cases:
  - id: BK_1_1_census
    input: {query: damage_category_census}
    expected: {verdict: four_fathers}
    class: B
  - id: BK_meitav
    input: {query: assessment_land}
    expected: {verdict: best_land}
    class: B
  - id: BK_5_7_species
    input: {query: species_scope, animal: beast}
    expected: {verdict: same_as_ox, basis: dibber ba-hoveh — the named
        method of EX22-08}
    class: B
  - id: BK_2_2_public
    input: {query: damage_liability, eaten: suited_produce,
      damage_domain: public}
    expected: {verdict: exempt_pays_benefit}
    class: B
  - id: BK_2_2_victim
    input: {query: damage_liability, eaten: suited_produce,
      damage_domain: victims}
    expected: {verdict: full_payment}
    class: B

