    input: {query: theft_payment, thief_from: thief}
    expected: {verdict: exempt_double}
    class: B
  - id: THEFT_self_admission
    input: {query: theft_payment, proof: self_admission}
    expected: {verdict: principal_only, basis: asher yarshi'un — whom
        the JUDGES convict, not the self-convicter (EX22-09 leg d)}
    class: B
  - id: DEPOSIT_false_oath
    input: {query: deposit_plea, plea: stolen, proof: witnesses_after_oath}
    expected: {verdict: double}
    class: B
  - id: DEPOSIT_own_confession
    input: {query: deposit_plea, plea: stolen,
      proof: self_admission_after_oath}
    expected: {verdict: principal_fifth_guilt_offering}
    class: B

