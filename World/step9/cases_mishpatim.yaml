    claims: [EX22-03]}
  cases:
  - id: BK_6_4_incompetent
    input: {query: fire_agency, via: incompetent}
    expected: {verdict: exempt_human_liable_heaven}
    class: B
  - id: BK_6_4_wind
    input: {query: fire_agency, via: wind}
    expected: {verdict: all_exempt}
    class: B
  - id: BK_6_4_distance
    input: {query: fire_distance}
    expected: {verdict: dispute_four_ways, basis: the Mekhilta's own
        tannaim table — beit-kor / sixteen / fifty / by-the-blaze}
    class: B
  - id: BK_6_5_vessels
    input: {query: fire_scope, contents: hidden_vessels}
    expected: {verdict: dispute_two_ways, basis: R. Yehudah contents vs
        the sages grain-only — the sages' side is the Mekhilta's
        open-things rule}
