# THE EFFECT VOCABULARY — the registry of state changes a verdict may write
# Opened 2026-09-03 by the owner's order ("start with the harvest") under THE
# EFFECTS LAW (owner-ruled same day: every compiled function coded every time
# for effects; verdicts write the LEDGER, never the EVENT STREAM).
#
# DISCOVERED, NEVER DESIGNED — the case-vocabulary discipline: an effect may
# be used by a compiled function only if it is registered here, and it may be
# registered only with the source that introduced it. Three witness layers per
# entry: (1) INK — the verb in the verse, Hebrew with English inline, verse
# addresses machine-verified against elijah_docket/tanakh.sqlite (probes
# self-tested, zero-report law); (2) CORPUS — frozen units whose prose already
# speaks the effect; (3) EXAM — where the graded specs/cold functions already
# emit the word. Model-layer typing (ledger_op) is freely rewritable; the
# witnessed layers are evidence.
#
# ledger_op values (model layer): debit (money owed), status (a persistent
# flag flips), timer (a clock obligation starts/ends), transfer (a thing
# changes hands), body (a bodily penalty enters the court docket),
# heaven (an entry on Heaven's docket clears or opens), block (a
# disqualification stands).
#
# Harvest note, honest: purity effects ("impure until evening") are ABSENT
# from the corpus today — Leviticus 11-15 not yet derived; the probe was
# self-tested and the absence is real. The registry grows when those chapters
# arrive.

effects:
  pays:
    en: pays — a money debt opens against the liable party
    he: "יְשַׁלֵּם (he shall pay), the doubling שַׁלֵּם יְשַׁלֵּם (pay he shall pay)"
    ledger_op: debit
    ink: "Exod 21:34, 21:36, 21:37, 22:2, 22:3, 22:4, 22:5, 22:6, 22:8; Lev 5:16"
    corpus: "exo_21_the_ordinances (16 attestations in prose), exo_22_property_social"
    exam: "cold_run_guardians.py, cold_run_mishpatim.py ('pays' 7), cases_mishpatim.yaml"

  restores:
