effects:
  impure_until_evening:
    en: "impure until the evening — the timed status flag on the person or vessel, cleared at sunset (with immersion where written)"
    he: וְטָמֵא עַד־הָעֶרֶב (and he shall be impure until the evening — Lev 11:24, the clause's own ink)
    ledger_op: status
    ink: "Lev 11:24-40 — the clause machine-verified at 8 verses of the chapter (11:24, 25, 27, 28, 31, 32, 39, 40)"
    corpus: "lev_11_carcass_swarm_close (LV11B-01/05/12 — the touch/carry lattice and the twilight split); lev_11_animals prose"
    exam: "the Shemini derivation's carcass rows; the twilight split (pure for the profane by day, terumah from dark)"
  dispatched_to_wilderness:
    en: "dispatched to the wilderness — the transfer entry: the ledger's iniquities loaded on the bearer and carried to a cut-off land, outside every camp"
    he: "וְנָשָׂא הַשָּׂעִיר עָלָיו אֶת־כָּל־עֲוֺנֹתָם אֶל־אֶרֶץ גְּזֵרָה (and the goat shall bear upon it all their iniquities to a cut-off land — Lev 16:22; Onkelos renders it a land NOT INHABITED)"
    ledger_op: transfer
    ink: "Lev 16:21-22 — the loading (venatan otam al rosh hasair) and the carrying (venasa) verbs; the three Azazel seats 16:8/10/26 machine-verified"
    corpus: "lev_16_yk_goat_statute (LV16B-01/02 — the confession liturgy and the dispatch geography)"
    exam: "cold_run_yoma.py (the dispatch cell); Mishnah Yoma 6:2-6:8; Shevuot 1:6 (the goat's universal remainder)"
  suspends:
    en: "suspends — the offense held open pending knowledge: no atonement entry closes, no offering is owed yet; the tradition's own verb tolah"
    he: "תּוֹלֶה עַד שֶׁיִּוָּדַע לוֹ (suspends until it becomes known to him — Sifra, Acharei Mot, Chapter 5 1; the word of Mishnah Shevuot 1:2)"
    ledger_op: status
    ink: "the parameter slot the bare ink leaves at Lev 16:16's from-the-impurities clause — the knowledge states are the recorded layer's contribution, labeled"
    corpus: "lev_16_yk_goat_statute (LV16B-07 — the atonement routing table)"
    exam: "cold_run_yoma.py (the start-only cell); Mishnah Shevuot 1:2-1:6 as the answer sheet"
  bears_sin:
    en: "bears his sin — the debt opens on the divine ledger, not a court docket: no earthly executor is named in the clause"
    he: וְנָשָׂא חֶטְאוֹ (and he shall bear his sin — Lev 24:15; Onkelos וִיקַבֵּל חוֹבֵיהּ, he shall receive his sin)
    ledger_op: status
    ink: "the exact bears-sin pair machine-scanned adjacent: Lev 24:15 + Num 18:22 (the wider bear-iniquity family beside it, e.g. Lev 10:17's bear-the-congregation's-iniquity)"
    corpus: "lev_10_nadav_avihu (the eaten-chatat's bear-the-iniquity prose at Lev 10:17)"
    exam: "cold_run_lev24.py (the curse gate's no-Name channel); RESEARCH_LOG.md Case 2 (Num 9:13 — 'his sin he shall bear' on the passover defaulter)"
  isolated_outside_camp:
    en: "isolated outside the camp — the decreed leper's status composite: garments rent, hair loosed, lip covered, the doubled warning cry, dwelling ALONE beyond the three camps"
    he: בָּדָד יֵשֵׁב מִחוּץ לַמַּחֲנֶה מוֹשָׁבוֹ (alone shall he dwell; outside the camp is his dwelling — Lev 13:46)
    ledger_op: status
    ink: "Lev 13:45-46 — the protocol's own verbs (rent, loosed, covered, calls, dwells alone)"
    corpus: "lev_13_head_isolation (LV13C-06 — the decreed leper with Onkelos's doubled warning cry)"
    exam: "cold_run_negaim.py; Mishnah Megillah 1:7 (the loosing/rending delta row, round 43)"
  burned_in_fire:
    en: "burned in fire — the malignant garment's destruction, with the benefit ban riding it"
    he: בָּאֵשׁ תִּשָּׂרֵף (in fire shall it be burned — Lev 13:52)
    ledger_op: destroy
    ink: "Lev 13:52, 13:55, 13:57 — the garment track's own verb, three seats"
    corpus: "lev_13_garment (LV13D-03 the benefit ban; LV13D-04 standing-burns)"
    exam: "cold_run_negaim.py (the garment/person asymmetry cell)"
  demolished:
    en: "demolished — the returning house torn down: stones, timbers, and all its dust out of the city"
    he: וְנָתַץ אֶת הַבַּיִת (and he shall demolish the house — Lev 14:45)
    ledger_op: destroy
    ink: "Lev 14:45 — the house track's own verb"
    corpus: "lev_14_house_nega (LV14B-06 — the ten-houses transition table)"
    exam: "cold_run_negaim.py (the ten-houses run); Mishnah Negaim 12:7 (round 43)"
  pays:
    en: pays — a money debt opens against the liable party
    he: יְשַׁלֵּם (he shall pay), the doubling שַׁלֵּם יְשַׁלֵּם (pay he shall pay)
    ledger_op: debit
    ink: Exod 21:34, 21:36, 21:37, 22:2, 22:3, 22:4, 22:5, 22:6, 22:8; Lev 5:16
    corpus: exo_21_the_ordinances (16 attestations in prose), exo_22_property_social
    exam: cold_run_guardians.py, cold_run_mishpatim.py ('pays' 7), cases_mishpatim.yaml
  restores:
    en: restores — the principal itself returns to its owner
    he: יָשִׁיב (he shall restore), הָשֵׁב תְּשִׁיבֶנּוּ (return you shall return it); וְהֵשִׁיב (and
      he shall return)
    ledger_op: transfer
    ink: Exod 21:34, 22:25, 23:4; Lev 5:23
    corpus: exo_21_the_ordinances, exo_23_justice_calendar, lev_05_asham_graded
    exam: cases_mishpatim.yaml restitution rows
  adds_fifth:
    en: adds the fifth — the principal plus its recorded surcharge
    he: וַחֲמִשִׁתָיו יֹסֵף עָלָיו (and its fifths he shall add upon it)
    ledger_op: debit
    ink: Lev 5:16 (the sacrilege), Lev 5:24 (the deposit)
    corpus: lev_05_asham_graded, lev_05_shevuot_deposit (the recursive fifth)
    exam: cold_run_vayikra5.py ('fifth' 30)
  pays_double:
    en: pays double — the theft multiple, two for one
    he: שְׁנַיִם יְשַׁלֵּם (two he shall pay)
    ledger_op: debit
    ink: Exod 22:3, 22:6, 22:8
    corpus: exo_22_property_social (the multiples cluster)
    exam: cold_run_mishpatim.py theft multiples 4/4
  pays_four_five:
    en: pays fourfold or fivefold — the slaughtered-or-sold multiple
    he: חֲמִשָּׁה בָקָר... וְאַרְבַּע צֹאן (five oxen... and four sheep)
    ledger_op: debit
    ink: Exod 21:37
    corpus: exo_21_the_ordinances
    exam: cold_run_mishpatim.py
  fined_by_assessment:
    en: fined as the court assesses — the amount is a computed parameter
    he: עָנוֹשׁ יֵעָנֵשׁ... וְנָתַן בִּפְלִלִים (fined he shall be fined... and give by the judges)
    ledger_op: debit
    ink: Exod 21:22
    corpus: exo_21_the_ordinances (the striving-men clause)
    exam: cases_mishpatim.yaml
  gives_fixed_sum:
    en: gives a fixed sum — the ink states the number (thirty shekels; the lost-time payment)
    he: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים יִתֵּן (thirty shekels of silver he shall give); שִׁבְתּוֹ יִתֵּן
      (his idleness he shall give)
    ledger_op: debit
    ink: Exod 21:32 (the slave's thirty), 21:19 (sitting-idle), 21:4 context, 22:6, 22:9
    corpus: exo_21_the_ordinances (the five injury payments)
    exam: cold_run_mishpatim.py injury payments
  ransom_imposed:
    en: ransom — a life-debt redeemed in money when the court imposes it
    he: אִם כֹּפֶר יוּשַׁת עָלָיו (if a ransom is placed upon him)
    ledger_op: debit
    ink: Exod 21:30
    corpus: exo_21_the_ordinances (14 attestations)
    exam: cold_run_mishpatim.py ('ransom' 5)
  goes_free:
    en: goes free — the slave's status ends; a person-status flip
    he: יֵצֵא לַחָפְשִׁי (he shall go out to freedom); חִנָּם (for nothing — no payment rides the exit)
    ledger_op: status
    ink: Exod 21:2, 21:26, 21:27 (לחפשי); 21:2, 21:11 (חנם)
    corpus: exo_21_the_ordinances (13 attestations — the release list)
    exam: cold_run_mishpatim.py slave-release list ('free' 14)
  released:
    en: released by the master's hand — the sending itself
    he: לַחָפְשִׁי יְשַׁלְּחֶנּוּ (to freedom he shall send him)
    ledger_op: status
    ink: Exod 21:26, 21:27 (the tooth and the eye)
    corpus: exo_21_the_ordinances
    exam: cold_run_mishpatim.py
  sold_for_theft:
    en: sold — the insolvent thief enters servitude; status flip with a term timer
    he: וְנִמְכַּר בִּגְנֵבָתוֹ (and he is sold for his theft)
    ledger_op: status
    ink: Exod 22:2
    corpus: exo_22_property_social; the woman excluded (Sotah 23b:12, triage LAW row)
    exam: cases_mishpatim.yaml
  term_clock:
    en: the term runs — six years of service, freedom fires in the seventh; the simulator's first timer
    he: שֵׁשׁ שָׁנִים יַעֲבֹד וּבַשְּׁבִעִת יֵצֵא (six years he shall serve and in the seventh he goes
      out)
    ledger_op: timer
    ink: Exod 21:2
    corpus: exo_21_the_ordinances (the slave clock; whole-years law Niddah 47b-48a, triage LAW rows)
    exam: cold_run_mishpatim.py release list
  oath_imposed:
    en: the oath of the LORD — an oath obligation opens and, sworn, closes the claim without payment
    he: שְׁבֻעַת יְהוָה תִּהְיֶה בֵּין שְׁנֵיהֶם... וְלֹא יְשַׁלֵּם (the oath of the LORD shall be between
      the two of them... and he shall not pay)
    ledger_op: status
    ink: Exod 22:10
    corpus: exo_22_property_social (the guardians)
    exam: cold_run_guardians.py ('oath' 42) — the 12/12 matrix's swear column
  exempt:
    en: exempt — no entry opens; the ledger stays clean
    he: נָקִי (clear) — the owner of the goring tam ox
    ledger_op: status
    ink: Exod 21:28
    corpus: 77 prose attestations across the corpus; exo_21 the naki cluster (Pesachim 22b, triage CREDIT
      rows)
    exam: 'cases specs (''{verdict: exempt}'' the most common expectation); cold functions (''exempt''
      28)'
  put_to_death:
    en: put to death — the court docket opens a capital entry (mode per the compiled law)
    he: מוֹת יוּמָת (die he shall die)
    ledger_op: body
    ink: Exod 21:12, 21:15, 21:16, 21:17, 22:18 (יומת also 21:29 the owner clause)
    corpus: exo_21_the_ordinances (18 death-penalty attestations)
    exam: cases_mishpatim.yaml capital rows
  stoned:
    en: stoned — the death mode named in ink; for the ox, the beast's own docket entry
    he: סָקוֹל יִסָּקֵל (stoned he shall be stoned)
    ledger_op: body
    ink: Exod 21:28, 21:29, 21:32
    corpus: exo_21_the_ordinances (the goring-ox state machine, 20 attestations)
    exam: cold_run_mishpatim.py ox machine ('stoned')
  avenged:
    en: avenged — the slave-killer's penalty, the tradition reading the sword in the verb
    he: נָקֹם יִנָּקֵם (avenged he shall be avenged)
    ledger_op: body
    ink: Exod 21:20
    corpus: exo_21_the_ordinances; the sword derivation Sanhedrin 52b:13 (triage LAW row)
    exam: —
  destroyed:
    en: utterly destroyed — the idolatrous sacrificer's ban
    he: יָחֳרָם (he shall be destroyed)
    ledger_op: body
    ink: Exod 22:19
    corpus: exo_22_property_social
    exam: cases_noahide.yaml idolatry rows
  lashes:
    en: liable to lashes — the flogging entry on the court docket
    he: אַרְבָּעִים יַכֶּנּוּ (forty he shall strike him — Deut 25:3, the count's own ink)
    ledger_op: body
    ink: 'Deut 25:2-3 (the corpus''s law seat: deu_25_courts_yibbum)'
    corpus: deu_25_courts_yibbum; 6 prose attestations
    exam: 'cases specs (''{verdict: lashes_forty}'' 3 rows)'
  flees_to_refuge:
    en: flees to the appointed place — a location-status flip protecting the unintentional killer
    he: וְשַׂמְתִּי לְךָ מָקוֹם אֲשֶׁר יָנוּס שָׁמָּה (I will appoint you a place where he shall flee)
    ledger_op: status
    ink: Exod 21:13
    corpus: exo_21_the_ordinances; the wilderness-refuge row Zevachim 117a:5 (triage LAW)
    exam: —
  substitution:
    en: in-place-of — the talion table's operator, carried as money per the compiled law
    he: 'תַּחַת (in place of): עַיִן תַּחַת עַיִן (eye in place of eye)'
    ledger_op: debit
    ink: Exod 21:23, 21:24, 21:25, 21:26, 21:27, 21:36, 21:37 (also 21:20, 23:5 in other senses); Lev 24:18, 24:20 — the call site, where Onkelos renders every תַּחַת as חֲלַף (in exchange for)
    corpus: exo_21_the_ordinances — talion-as-money runs on Lev 24:21-22 (the measured compile dependency)
    exam: cold_run_mishpatim.py talion cells; cold_run_lev24.py (the exporting span — the first inter-span call)
  redeem_or_break:
    en: redeem with a lamb, or break the neck — the donkey's fork, both arms effects
    he: תִּפְדֶה בְשֶׂה וְאִם לֹא תִפְדֶּה וַעֲרַפְתּוֹ (redeem with a lamb; and if you do not redeem,
      break its neck)
    ledger_op: transfer
    ink: Exod 13:13, 34:20
    corpus: exo_13_consecration_and_pillars; the seh parameters Yoma 49b:7 (triage LAW)
    exam: —
  atoned_forgiven:
    en: the priest atones and the offerer is forgiven — Heaven's docket entry closes
    he: וְכִפֶּר עָלָיו הַכֹּהֵן... וְנִסְלַח לוֹ (and the priest shall make atonement for him... and
      he shall be forgiven)
    ledger_op: heaven
    ink: Lev 4:20, 4:26, 4:31, 4:35, 5:10, 5:13, 5:16, 5:18, 5:26 (וכפר also 5:6)
    corpus: lev_04_inadvertence_case_tree, lev_05_asham_graded, lev_05_shevuot_deposit
    exam: cold_run_vayikra5.py 27/27 (the graded-offering routes end here)
  accepted:
    en: accepted for him — the offering's acceptance state
    he: וְנִרְצָה לוֹ לְכַפֵּר עָלָיו (and it shall be accepted for him to atone for him)
    ledger_op: heaven
    ink: Lev 1:4
    corpus: lev_01_olah_cattle_procedure (the leaning and acceptance)
    exam: cases_vayikra.yaml acceptance rows
  disqualified:
    en: disqualified — the offering or rite is void; a block entry, no state advances
    he: —(the exam shelf's word; the ink states each ground in place)
    ledger_op: block
    ink: grounds in place per unit (e.g. Exod 12:6 before-midday, Pesachim 61a)
    corpus: lev_01/lev_02 validity claims; 36 valid/invalid prose attestations
    exam: 'cases specs (''{verdict: invalid}'' / ''disqualified'' rows)'
  forewarned:
    en: the ox turns forewarned — the recidivism status flip that re-routes every later verdict
    he: וְאִם שׁוֹר נַגָּח הוּא מִתְּמֹל שִׁלְשֹׁם וְהוּעַד בִּבְעָלָיו (and if it was a goring ox from
      yesterday and before, and warning was given to its owner)
    ledger_op: status
    ink: Exod 21:29, 21:36
    corpus: exo_21_the_ordinances (the goring-ox state machine — the corpus's first explicit status flip)
    exam: cold_run_mishpatim.py ox state machine
  jubilee_release:
    en: the jubilee frees — a world-clock timer that overrides even the pierced slave's "forever"
    he: וּקְרָאתֶם דְּרוֹר בָּאָרֶץ (and you shall proclaim liberty in the land); יוֹבֵל הִוא (it is a
      jubilee); וְשַׁבְתֶּם אִישׁ אֶל אֲחֻזָּתוֹ (and you shall return, each man to his holding)
    ledger_op: timer
    ink: Lev 25:10 (machine-verified; the probe already fired inside cold_run_mishpatim.py's slave-release
      function)
    corpus: the slave-release import cell [Kiddushin 15a:19 — written even for the pierced 'forever']
      — the cross-module interrupt of the code-structures catalog
    exam: cold_run_mishpatim.py F1 FREE-AT-JUBILEE cell
  karet_cut_off:
    en: cut off — the gravest entry on Heaven's docket, written by Heaven's own hand, no court acts
    he: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל (and that soul shall be cut off from Israel)
    ledger_op: heaven
    ink: Exod 12:15, 12:19 (machine-verified; the leaven-eater's clause both times)
    corpus: exo_12_passover_and_exodus; the karet class at Mishnah Keritot 1:1 (leaven on Passover in
      the list)
    exam: the Vayikra ladder's karet triggers (cases_vayikra.yaml)
  purge_deadline:
    en: the removal deadline — leaven must be gone by the appointed hour; a timer against the person
    he: אַךְ בַּיּוֹם הָרִאשׁוֹן תַּשְׁבִּיתוּ שְּׂאֹר מִבָּתֵּיכֶם (yet on the FIRST day you shall remove
      leaven from your houses)
    ledger_op: timer
    ink: Exod 12:15 (תשביתו machine-verified)
    corpus: exo_12_passover_and_exodus; the harishon-means-the-fourteenth read (Pesachim 5a:6, triage
      LAW row) + the midday line (Pesachim 5a:16)
    exam: the leaven-machine block of the Exodus triage map (block 1)
  burn_remainder:
    en: burn what remains — the leftover leaves the world by fire; a duty on the object's holder
    he: וְהַנֹּתָר מִמֶּנּוּ עַד בֹּקֶר בָּאֵשׁ תִּשְׂרֹפוּ (and that which remains of it until morning
      you shall burn with fire)
    ledger_op: transfer
    ink: Exod 12:10 (תשרפו machine-verified)
    corpus: exo_12_passover_and_exodus; the positive-after-negative cluster (Pesachim 83b-84a, triage
      rows)
    exam: cases from the backfill's leaven/leftover rows
  barred_from_it:
    en: barred — a person class may not eat of it; a block on the eater, not the offering
    he: כָּל בֶּן נֵכָר לֹא יֹאכַל בּוֹ (no stranger shall eat of it); וְכָל עָרֵל לֹא יֹאכַל בּוֹ (and
      no uncircumcised one shall eat of it)
    ledger_op: block
    ink: Exod 12:43, 12:45, 12:48 (יאכל machine-verified at 10 sites in the span)
    corpus: exo_12_passover_and_exodus (the access filter)
    exam: Mishnah Pesachim 5:3's invalid-for-the-uncircumcised row
  registered_to_lamb:
    en: registered — the eater joins a lamb's count; the group status the eating rides on
    he: אִישׁ לְפִי אָכְלוֹ תָּכֹסּוּ עַל הַשֶּׂה (each man according to his eating shall you make your
      count for the lamb)
    ledger_op: status
    ink: Exod 12:4 (תכסו machine-verified)
    corpus: exo_12_passover_and_exodus; the registration/withdrawal cluster (Pesachim 89a, triage rows)
    exam: Mishnah Pesachim 8:3 (withdraw until slaughtered); Zevachim 5:8 (only its registrants)
  eating_window:
    en: the eating window — open at nightfall, shut by the law's own clock; a timer on the meal
    he: וְאָכְלוּ אֶת הַבָּשָׂר בַּלַּיְלָה הַזֶּה (and they shall eat the flesh on THIS night)
    ledger_op: timer
    ink: Exod 12:8 (בלילה machine-verified; the dated windows at 12:2, 12:3, 12:6, 12:18)
    corpus: exo_12_passover_and_exodus; the midnight dispute (Pesachim 120b:5-7, triage rows)
    exam: Mishnah Zevachim 5:8 (only at night, only until midnight)
  consecrated_firstborn:
    en: consecrated — the firstborn belongs to the Lord from the womb; a status written at birth
    he: קַדֶּשׁ לִי כָל בְּכוֹר פֶּטֶר כָּל רֶחֶם (sanctify to Me every firstborn, opener of every womb)
    ledger_op: status
    ink: Exod 13:2 (קדש machine-verified); the keeping-words לְמִשְׁמֶרֶת 12:6, וּשְׁמַרְתֶּם 12:17/24/25
      verified beside it
    corpus: exo_13_consecration_and_pillars; the caesarean carve-out (Niddah 40a:14, triage LAW row)
    exam: the firstborn rows of the backfill exam
  land_release:
    en: the land released — the seventh-year timer on a LAND entity; the produce goes ownerless to the
      poor
    he: וְהַשְּׁבִיעִת תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ (but the seventh you shall release it and let it
      lie)
    ledger_op: timer
