      neither judgment nor spirit}
    dispute: null
    class: A-adjacent — G15-10 holds verdict AND derivation
  - id: SAN_10_3_b
    input: {query: share_in_world_to_come, subject: generation_of_the_dispersion}
    expected: {verdict: no_share, basis: the scattering doubled — this world
      and the next}
    dispute: null
    class: C for the verdict → F-010
  - id: SAN_10_3_c
    input: {query: share_in_world_to_come, subject: men_of_sodom}
