# THE GENESIS SWEEP — every remaining Mishnah row citing Genesis (48 rows,
# the pilot's three excluded), owner's word 2026-08-31: "I want to run all
# of the remaining Mishnah Talmud references for gen" → "Go".
# Method: THE_STEPS Step 9 (exam first, classify A/B/C, findings queued,
# compile, re-run). The full 48-row verdict table is GEN_SWEEP_LEDGER.md;
# this file holds the CASE-ROW modules (input→output law) in exam form.
# Hebrew quoted from the shelf's own ink (Data/mishnah_*_he.json), always
# with English beside it.

- module: sciatic_nerve
  tractate: Chullin
  oracle: Mishnah Chullin 7:1 + 7:6
  genesis_anchor:
    unit: gen_55_two_camps_wrestled_name
    ref: Gen.32.33
    claim: G55-31
    holds: the first food prohibition seated on a narrative wound — scope
      disputed (one side vs both, each side its own tradition), outer
      extensions technically permitted but self-prohibited (Rav Huna),
      recorded as self-stringency rather than law
  talmud_bridge:
    source: the Mishnah itself quotes Gen 32:33 at 7:6 — עַל כֵּן לֹא יֹאכְלוּ
      בְנֵי יִשְׂרָאֵל אֶת גִּיד הַנָּשֶׁה ('therefore the children of Israel eat
      not the sinew of the thigh-vein'); Chullin 89b-103a develops scope
    walks_to: Gen 32:33
    note: Genesis's ONLY narrator-voice food law — the one Mishnah module
      whose anchor verse is itself statute ink in our derived span
  cases:
  - id: CHUL_7_1_a
    input: {animal: beast, thigh: right}
    expected: {verdict: forbidden, basis: applies to beast and wild animal,
      right thigh and left}
    dispute: the gemara records the one-side-vs-both dispute — HELD at G55-31
    class: B
  - id: CHUL_7_1_b
    input: {animal: bird}
    expected: {verdict: permitted, basis: אֵינוֹ נוֹהֵג בְּעוֹף מִפְּנֵי שֶׁאֵין לוֹ
      כָף — 'does not apply to a bird, for it has no spoon (of the thigh)'}
    dispute: null
    class: B
  - id: CHUL_7_1_c
    input: {animal: fetus}
    expected: {verdict: dispute, basis: first opinion applies it to the
      fetus; R. Yehudah says it does not apply}
    dispute: first opinion vs R. Yehudah
    class: B
  - id: CHUL_7_1_d
    input: {part: sinew_fat}
    expected: {verdict: permitted, basis: וְחֶלְבּוֹ מֻתָּר — 'its fat is
      permitted'; Israel's self-stringency recorded as such}
    dispute: null
    class: A-adjacent — G55-31 holds exactly this leg (technically
      permitted, self-prohibited)
  - id: CHUL_7_6_a
    input: {animal: impure_species}
    expected: {verdict: dispute, basis: R. Yehudah — applies, for it was
      forbidden from the sons of Jacob while impure animals were still
      permitted them; sages — בְּסִינַי נֶאֱמַר אֶלָּא שֶׁנִּכְתַּב בִּמְקוֹמוֹ ('it
      was said at SINAI, but written in its place')}
    dispute: R. Yehudah vs sages — a dispute about the LAW'S OWN PROVENANCE
      (patriarchal era vs Sinai), the machine's provenance-dispute pattern
    class: C — gen_55 does not hold the Sinai-provenance dispute → F-011

- module: day_boundary
  tractate: Chullin
  oracle: Mishnah Chullin 5:5
  genesis_anchor:
    unit: gen_01_creation_boot
    ref: Gen.1.5
    claim: the unit's own operator order — וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם אֶחָד
      ('and there was EVENING and there was MORNING, one day') — evening
      precedes morning in the ink the machine executes
    holds: the day-unit's boundary structure, night first
  talmud_bridge:
    source: the Mishnah itself is the bridge — Ben Zoma's gezerah shavah
      (verbal analogy, middah I2), יוֹם אֶחָד ↔ יוֹם אֶחָד
    walks_to: Gen 1:5
    note: נֶאֱמַר בְּמַעֲשֵׂה בְרֵאשִׁית יוֹם אֶחָד — 'ONE DAY is said in the work
      of creation... as there the day follows the night, so here the day
      follows the night'
  anchor_pending: 'Leviticus 22:28 — the it-and-its-young law this boundary
    serves; Leviticus 22 not yet derived. See FRONTIER.md.'
  cases:
  - id: CHUL_5_5_a
    input: {mother_slaughtered: night, offspring_slaughtered: following_day}
    expected: {verdict: same_day_violation, basis: the day follows the
      night — night plus its following daytime are ONE day}
    dispute: null
    class: B
  - id: CHUL_5_5_b
    input: {mother_slaughtered: day, offspring_slaughtered: following_night}
    expected: {verdict: different_days_permitted, basis: nightfall closed
      the day — the following night belongs to the NEXT day}
    dispute: null
    class: B

- module: seas_as_mikveh
  tractate: Mikvaot
  oracle: Mishnah Mikvaot 5:4 (verbatim duplicate = Mishnah Parah 8:8)
  genesis_anchor:
    unit: gen_03_double_build
    ref: Gen.1.10
    claim: held as the NAME operator only — no claim → F-007
    holds: וּלְמִקְוֵה הַמַּיִם קָרָא יַמִּים — 'and the GATHERING (mikveh) of the
      waters He called SEAS' — the naming operator whose very noun is the
      ritual-pool term
  talmud_bridge:
    source: the Mishnah itself quotes Gen 1:10 in R. Meir's name
    walks_to: Gen 1:10
    note: the law is a three-way tannaitic dispute riding on whether the
      naming speaks of ALL seas or explains the plural
  cases:
  - id: MIKV_5_4_a
    input: {water_body: sea, use: ritual_immersion}
    expected:
      verdict: dispute — three labeled positions
      basis: 'R. Meir: all seas are as a mikveh, from our verse; R. Yehudah:
        only the Great Sea (the plural marks many kinds within it);
        R. Yosei: seas purify as flowing streams, yet are invalid for
        zavim, metzoraim, and sanctifying purification-waters'
    dispute: R. Meir vs R. Yehudah vs R. Yosei
    class: C for the law (naming held as op, dispute unheld) → F-007

- module: forgiveness_after_injury
  tractate: Bava Kamma
  oracle: Mishnah Bava Kamma 8:7
  genesis_anchor:
    unit: gen_36_gerar_dream_prophet
    ref: Gen.20.7 + Gen.20.17
    claim: held as operator prose (THE_PROPHET_AND_THE_RETURN_COMMAND;
      THE_PRAYER_AND_THE_HEALING) — the LAW unheld → F-008
    holds: the return command ('restore the man's wife, for he is a
      prophet and will pray for you') and the prayer-and-healing event
  talmud_bridge:
    source: the Mishnah itself quotes both verses
    walks_to: Gen 20:7, Gen 20:17
    note: payment does not atone until forgiveness is SOUGHT (from the
      restore command); the wronged must not be cruel in withholding it
      (from Abraham praying for his own wronger)
  cases:
  - id: BK_8_7_a
    input: {injurer_paid: 'yes', asked_forgiveness: 'no'}
    expected: {verdict: not_forgiven, basis: אֵין נִמְחָל לוֹ עַד שֶׁיְּבַקֵּשׁ
      מִמֶּנּוּ — 'he is not forgiven until he asks of him'}
    dispute: null
    class: C for the law → F-008
  - id: BK_8_7_b
    input: {victim_asked: 'yes', victim_withholds: 'yes'}
    expected: {verdict: withholder_is_cruel, basis: שֶׁלֹּא יְהֵא הַמּוֹחֵל
      אַכְזָרִי — 'the forgiver must not be cruel' — Abraham prayed for
      Abimelech}
    dispute: null
    class: C for the law → F-008

