  talmud_bridge:
    source: the Mishnah's own rows; R. Yishmael's count within it
    walks_to: Gen 21:12; Genesis 17's covenant-word tokens
    note: גְּדוֹלָה מִילָה שֶׁנִּכְרְתוּ עָלֶיהָ שְׁלֹשׁ עֶשְׂרֵה בְרִיתוֹת — 'great is
      circumcision, for THIRTEEN covenants were cut over it' — VERIFIED
      against Genesis 17's ink, exactly 13 covenant-word tokens
      (vv. 2,4,7×2,9,10,11,13×2,14,19×2,21)
  cases:
  - id: NED_3_11_a
    input: {vow: no_benefit_from_sons_of_noah, counterparty: israelite}
    expected: {verdict: permitted, basis: מֻתָּר בְּיִשְׂרָאֵל — Israel left the
      sons-of-Noah category through Abraham}
    dispute: null
    class: B
  - id: NED_3_11_b
    input: {vow: no_benefit_from_seed_of_abraham, counterparty: descendant_of_ishmael_or_esau}
    expected: {verdict: permitted, basis: כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע — 'in
      Isaac shall seed be called to you' — partitive, G37-25}
    dispute: null
    class: B
  - id: NED_3_11_c
    input: {query: covenants_over_circumcision}
    expected: {verdict: thirteen, basis: R. Yishmael's count — COMPUTED from
      the machine's own Genesis 17 ink at run time}
    dispute: null
    class: C as claim (count verified, unheld on gen_33) → F-009

