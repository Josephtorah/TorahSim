- module: circumcision_third_day
  tractate: Shabbat
  oracle: Mishnah Shabbat 19:3 (+ 9:3, same Genesis leg)
  genesis_anchor:
    unit: gen_57_deceit_at_the_gate
    ref: Gen.34.25
    claim: G57-23 — the full case-shelf cluster held ('bathing the
      circumcised child on the sabbath... Shmuel's ruling — BECAUSE OF
      DANGER, OUR VERSE IS THE MEASURE of the third day's peril')
    holds: the third-day-pain measure and the sabbath-bathing discussion
  talmud_bridge:
    source: the Mishnah quotes Gen 34:25 itself — וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
      בִּהְיוֹתָם כֹּאֲבִים ('on the third day, when they were in pain')
    walks_to: Gen 34:25
    note: structural contrast with the pilot's life_override — doubt of
      LIFE overrides Shabbat (Yoma), doubt of OBLIGATION does not
      (safek/androgynos here); the two modules compose
  cases:
  - id: SHAB_19_3_a
    input: {day: shabbat, child_state: third_day_after_circumcision, act: bathing}
    expected: {verdict: permitted, basis: danger — the third day's peril
      measured by our verse (R. Elazar b. Azariah; Shmuel)}
    dispute: null
    class: B
  - id: SHAB_19_3_b
    input: {day: shabbat, child_state: safek_or_androgynos, act: circumcision}
    expected: {verdict: no_override, basis: doubt and the androgynos do not
      override Shabbat}
    dispute: R. Yehudah permits the androgynos
    class: B (the contrast structure; the safek rule itself imports —
