# register_dispositions.yaml — THE REGISTER GATE's dispositions (2026-09-11; THE_LOOP.md "THE REGISTER GATE — the design"). Every
# non-green seat of the four censuses (counts / receipts / footers / registers) with its class AS THE GATE COMPUTES IT and a why typed
# from the reading of the print. The gate verifies the class (a lie fails), refuses a declaration on a seat the world has since paid
# (stale), and fails an undeclared seat under --strict. GREEN needs no line: counts ROW / LEDGER / MEASURE-ONLY, receipts CLOSE, footers
# DAEMONS, registers ROWS. When a runner pays a seat, DELETE its line here (the gate will say STALE until it is gone).
