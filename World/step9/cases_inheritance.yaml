# INHERITANCE, DEEDS, AND SURETY (round 34 — Genesis exam block 5
# of 12, 2026-09-04). Land and deeds, the inheritance canon, the
# surety root, the estate doctrines, the kahal file.
# Read-source: logic/oral_triage/genesis_block_inheritance_2026-09-04.md.

- module: land_and_deeds
  tractate: Bava Batra
  oracle: Bava Batra 56a:8-9, 69b:1; Bekhorot 50a:7-9; Bava Batra 100a:7 (standing)
  exodus_anchor: {unit: gen_39 + gen_31 + gen_29, ref: Gen.23.16-17 + 15.18 + 13.17,
    claims: [G39-35, G31-21, G29-18]}
  cases:
  - id: BB_landlist
    input: {query: covenant_land_exclusion}
    expected: {verdict: three_nations_outside_tithe}
    class: A
  - id: BB_boundary
    input: {query: deed_boundary_source}
    expected: {verdict: border_clause_from_machpelah}
    class: A
  - id: BB_walking
    input: {query: walking_acquisition}
    expected: {verdict: walking_acquires_r_eliezer}
    class: A
  - id: Bk_ephron
    input: {query: ephron_currency_exception}
    expected: {verdict: centenaria_despite_plain}
    class: A

- module: inheritance_canon
  tractate: Bava Batra
  oracle: Bava Batra 110b:8-10, 113a:3-5, 123a:9-11, 143b:5-7
  exodus_anchor: {unit: gen_65 + gen_71 + gen_69, ref: Gen.42.13 + 48.5 + 46.23,
    claims: [G65-34, G71-29, G69-30]}
  cases:
  - id: BB_brothers
    input: {query: paternal_brotherhood}
    expected: {verdict: father_not_mother}
    class: A
  - id: BB_cleave
    input: {query: cleave_word_inheritance}
    expected: {verdict: doubled_cleave_token}
    class: A
  - id: BB_double
    input: {query: tribal_double_portion}
    expected: {verdict: like_reuben_and_simeon}
    class: A
  - id: BB_bnei
    input: {query: bnei_canon}
    expected: {verdict: one_child_written_plural}
    class: A

- module: surety_root
  tractate: Bava Batra
  oracle: Bava Batra 173b:8-11
  exodus_anchor: {unit: gen_66 + gen_65, ref: Gen.43.9 + 42.37,
    claims: [G66-35, G65-34]}
  cases:
  - id: BB_surety
    input: {query: guarantor_source}
    expected: {verdict: judah_pledge_root}
    class: A
  - id: BB_kabblan
    input: {query: unconditional_guarantor}
    expected: {verdict: reuben_pledge_type}
    class: A

- module: estate_doctrines
  tractate: Sanhedrin
  oracle: Sanhedrin 91a:7-9, 91a:15-17
  exodus_anchor: {unit: gen_23 + gen_42, ref: Gen.9.25 + 25.5-6,
    claims: [G23-16, G42-29]}
  cases:
  - id: Sa_slave
    input: {query: slave_property_doctrine}
    expected: {verdict: master_owns_acquisitions}
    class: A
  - id: Sa_gifts
    input: {query: lifetime_gift_deeds}
    expected: {verdict: deeds_settle_inheritance}
    class: A

- module: kahal_file
  tractate: Horayot
  oracle: Horayot 5b:14-16, 6b:1-3
  exodus_anchor: {unit: gen_71_crossed_hands, ref: Gen.48.4-6,
    claims: [G71-29]}
  cases:
  - id: Ho_kahal
    input: {query: kahal_definition}
    expected: {verdict: single_tribe_is_kahal}
    class: A
  - id: Ho_levi
    input: {query: levi_kahal_exclusion}
    expected: {verdict: holding_defines_kahal}
    class: A
