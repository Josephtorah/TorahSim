# THE COURTS' GENESIS LAYER (round 35 — Genesis exam block 6 of
# 12, 2026-09-04). Judicial authority, the death-court files,
# speech that binds, the annulment precedent, the form credits.
# Read-source: logic/oral_triage/genesis_block_courts_2026-09-04.md.

- module: judicial_authority
  tractate: Sanhedrin
  oracle: Sanhedrin 5a:5-7
  exodus_anchor: {unit: gen_72_testament_twelve, ref: Gen.49.10,
    claims: [G72-35]}
  cases:
  - id: Sa_scepter
    input: {query: scepter_license}
    expected: {verdict: exilarch_judging_license}
    class: A

- module: death_court_files
  tractate: Makkot
  oracle: Makkot 9a:9-11; Ketubot 30a:5-7; Sanhedrin 46b:20-22
  exodus_anchor: {unit: gen_36 + gen_65 + gen_39, ref: Gen.20.6 + 42.38 + 23.2,
    claims: [G36-21, G65-35, G39-36]}
  cases:
  - id: Ma_heaven
    input: {query: heaven_jurisdiction_token}
    expected: {verdict: heavens_hand_by_to_me}
    class: A
  - id: Ke_ason
    input: {query: ason_analogy}
    expected: {verdict: heaven_ason_exempts_too}
    class: A
  - id: Sa_eulogy
    input: {query: eulogy_subject_question}
    expected: {verdict: first_proof_deflected}
    class: A

- module: speech_binding
  tractate: Makkot
  oracle: Makkot 11b:1-2; Moed Katan 18a:3-5
  exodus_anchor: {unit: gen_66 + gen_38, ref: Gen.43.9 + 22.5,
    claims: [G66-36, G38-40]}
  cases:
  - id: Ma_ban
    input: {query: conditional_ban_release}
    expected: {verdict: binds_absent_release}
    class: A
  - id: MK_lips
    input: {query: lips_covenant}
    expected: {verdict: speech_shapes_outcome}
    class: A

- module: annulment_precedent
  tractate: Avodah Zarah
  oracle: Avodah Zarah 53b:12-13
  exodus_anchor: {unit: gen_25_babel, ref: Gen.11.1-9,
    claims: [G25-17]}
  cases:
  - id: AZ_nimrod
    input: {query: idol_annulment_precedent}
    expected: {verdict: peacetime_abandonment_annuls}
    class: A

- module: form_credits
  tractate: Sanhedrin
  oracle: Sanhedrin 29a:33-34; 37b:12; Kiddushin 61b:9 (all standing)
  exodus_anchor: {unit: gen_10 + gen_12, ref: Gen.3.3 + 4.7 + 4.14-16,
    claims: [G12-15, G12-19]}
  cases:
  - id: Sa_adds
    input: {query: adds_subtracts_rule}
    expected: {verdict: eden_seat_of_the_rule}
    class: A
  - id: Sa_exile
    input: {query: exile_half_atonement}
    expected: {verdict: half_remitted_by_ink_delta}
    class: A
  - id: Ki_tenai
    input: {query: doubled_condition_form}
    expected: {verdict: r_meir_doubled_condition}
    class: A
