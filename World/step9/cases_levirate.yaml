# LEVIRATE, SEED, AND UNIONS (round 33 — Genesis exam block 4 of
# 12, 2026-09-04). The name-means-inheritance analogy, the Er/Onan
# file, the procreation three-way, the 17:7 credits, the beard rule.
# Read-source: logic/oral_triage/genesis_block_levirate_2026-09-04.md.

- module: levirate_name
  tractate: Yevamot
  oracle: Yevamot 24a:5-7
  exodus_anchor: {unit: gen_71_crossed_hands, ref: Gen.48.6,
    claims: [G71-28]}
  cases:
  - id: Ye_name
    input: {query: levirate_name_meaning}
    expected: {verdict: inheritance_by_name_analogy}
    class: A

- module: er_onan_file
  tractate: Yevamot
  oracle: Yevamot 34b:2-5
  exodus_anchor: {unit: gen_61_yehuda_tamar, ref: Gen.38.9-10,
    claims: [G61-18]}
  cases:
  - id: Ye_onan
    input: {query: onan_act_source}
    expected: {verdict: destroyed_on_ground}
    class: A
  - id: Ye_er
    input: {query: er_act_source}
    expected: {verdict: same_death_inference}
    class: A

- module: procreation_neglect
  tractate: Yevamot
  oracle: Yevamot 63b:15-18
  exodus_anchor: {unit: gen_21_blessing_blood_law, ref: Gen.9.6-7,
    claims: [G21-18]}
  cases:
  - id: Ye_neglect
    input: {query: procreation_neglect_grade}
    expected: {verdict: [sheds_blood, diminishes_image, both_grades]}
    class: A

- module: seed_distinction
  tractate: Yevamot
  oracle: Yevamot 42a:6; Yevamot 100b:9 (standing seats)
  exodus_anchor: {unit: gen_33_shaddai_covenant_flesh, ref: Gen.17.7,
    claims: [G33-27]}
  cases:
  - id: Ye_wait
    input: {query: remarriage_wait}
    expected: {verdict: three_month_distinction}
    class: A
  - id: Ye_union
    input: {query: union_ban}
    expected: {verdict: gentile_slave_excluded}
    class: A

- module: identity_evidence
  tractate: Yevamot
  oracle: Yevamot 88a:12-14
  exodus_anchor: {unit: gen_65_first_descent, ref: Gen.42.8,
    claims: [G65-33]}
  cases:
  - id: Ye_beard
    input: {query: beard_recognition}
    expected: {verdict: beard_signature_rule}
    class: A
