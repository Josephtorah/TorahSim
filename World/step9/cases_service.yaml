# THE SERVICE ORDER (round 28 — the seventeenth Exodus
# Talmud-first exam block, 2026-09-04; owner: "one more"). The
# lamp, the morning order, the laver, the corners, the money and
# the compounds — the sanctuary family closes.
# Read-source: logic/oral_triage/exodus_block_service_2026-09-04.md.

- module: lamp_service
  tractate: Yoma
  oracle: Shabbat 21a:8-10; Yoma 45b:6-8; Pesachim 59a:1-4; Zevachim 11b:29-31
  exodus_anchor: {unit: exo_27_altar_court, ref: Exod.27.20-21,
    claims: [EX27-10]}
  cases:
  - id: Sh_flame
    input: {query: self_ascending_flame}
    expected: {verdict: temple_wick_oil_bar}
    class: A
  - id: Yo_fire_source
    input: {query: perpetual_fire_source}
    expected: {verdict: outer_altar_head}
    class: A
  - id: Pe_quota
    input: {query: lamp_oil_quota}
    expected: {verdict: measure_for_the_night}
    class: A
  - id: Pe_last
    input: {query: lamps_last}
    expected: {verdict: only_overnight_service}
    class: A

- module: morning_order
  tractate: Yoma
  oracle: Yoma 14b:8-9, 62b:10-13; Pesachim 59a:2, 59a:8-10
  exodus_anchor: {unit: exo_29_investiture + exo_30_incense_shekel, ref: Exod.29.38-39 + 30.7-8,
    claims: [EX29-15, EX30-11]}
  cases:
  - id: Pe_incense_first
    input: {query: incense_first}
    expected: {verdict: doubled_morning_precedes}
    class: A
  - id: Yo_tend_burn
    input: {query: tend_burn_order}
    expected: {verdict: [tend_then_burn, burn_then_tend]}
    class: A
  - id: Yo_lambs_equal
    input: {query: daily_lambs_equality}
    expected: {verdict: equal_for_mitzvah_valid_unequal}
    class: A
  - id: Yo_lambs_sun
    input: {query: lambs_sun_position}
    expected: {verdict: opposite_the_day}
    class: A

- module: laver_machine
