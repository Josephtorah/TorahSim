# BETROTHAL AND THE HOUSE (round 32 — Genesis exam block 3 of 12,
# 2026-09-04). The money machine from Ephron's field, the bride's
# year, the household standing rules, and the times.
# Read-source: logic/oral_triage/genesis_block_betrothal_2026-09-04.md.

- module: betrothal_money
  tractate: Kiddushin
  oracle: Kiddushin 2a:3-5, 4b:3-4, 11b:4-6
  exodus_anchor: {unit: gen_39_machpelah_purchase, ref: Gen.23.13 + 25.10,
    claims: [G39-34]}
  cases:
  - id: Ki_source
    input: {query: money_betrothal_source}
    expected: {verdict: kichah_kichah_ephron}
    class: A
  - id: Ki_acquisition
    input: {query: taking_as_acquisition}
    expected: {verdict: field_abraham_acquired}
    class: A
  - id: Ki_floor
    input: {query: betrothal_amount_floor}
    expected: {verdict: peruta_medium_not_amount}
    class: A
  - id: Ki_grades
    input: {query: silver_grades}
    expected: {verdict: fixed_tyrian_rabbinic_provincial}
    class: A

- module: bride_year
  tractate: Ketubot
  oracle: Ketubot 57b:1-4
  exodus_anchor: {unit: gen_41_retelling_release_meeting, ref: Gen.24.55 (with 24.16 at gen_40),
    claims: [G41-35]}
  cases:
  - id: Ke_days
    input: {query: bride_preparation_days}
    expected: {verdict: year_from_redemption_days}
    class: A
  - id: Ye_maiden
    input: {query: maiden_virgin_definition}
    expected: {verdict: naarah_by_rebekah}
    class: A

- module: household_standing
  tractate: Ketubot
  oracle: Ketubot 61a:2-4, 67b:1-3
  exodus_anchor: {unit: gen_36_gerar_dream_prophet + gen_09, ref: Gen.20.3 + 3.20 + 2.18,
    claims: [G36-20, G09-20]}
  cases:
  - id: Ke_rises
    input: {query: rises_not_descends}
    expected: {verdict: rises_with_husband}
    class: A
  - id: Ke_orphan
    input: {query: orphan_groom_order}
    expected: {verdict: house_bed_then_wife}
    class: A

- module: marriage_times
  tractate: Taanit
  oracle: Taanit 11a:3-5; Yoma 77a:13-14
  exodus_anchor: {unit: gen_64_pharaoh_dreams_rise + gen_54, ref: Gen.41.50 + 31.50,
    claims: [G64-35, G54-42]}
  cases:
  - id: Ta_famine
    input: {query: famine_relations_ban}
    expected: {verdict: forbidden_childless_excepted}
    class: A
  - id: Yo_innuy
    input: {query: marital_affliction_token}
    expected: {verdict: deprivation_is_affliction}
    class: A
