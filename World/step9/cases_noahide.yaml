    expected: {verdict: forbidden, basis: 'באשתו — "to HIS wife," not the
      neighbor''s (58a:8)'}
    dispute: null
    class: B
  - id: NOA_REL_animal
    input: {query: relation_permitted, partner: animal}
    expected: {verdict: forbidden, basis: 'והיו לבשר אחד — those who can
      become one flesh; beast and wild animal excluded (58a:8)'}
    dispute: null
    class: B
  - id: NOA_REL_fathers_relative
    input: {query: relation_permitted, partner: fathers_side}
    expected: {verdict: dispute_two_ways, basis: 'R. Eliezer: the
      father''s sister banned; R. Akiva: the father''s wife banned —
      each token of 2:24 assigned disputed referents'}
    dispute: recorded — HELD dual-track at G09-19
    class: B
  - id: NOA_REL_maternal_sister
    input: {query: relation_permitted, partner: maternal_sister}
    expected: {verdict: forbidden, basis: 'pressed from Gen 20:12 — "my
      father''s daughter, NOT my mother''s" (58b:5); the proof DEFLECTED
      at 58b:6 (she was his brother''s daughter), the law standing on the
