    input: {query: food_permitted, era: adam, food: meat}
    expected: {verdict: forbidden, basis: 'Gen 1:29 — the herb grant
      only; "to you and to every beast" (59b:13)'}
    dispute: null
    class: B
  - id: MEAT_noach
    input: {query: food_permitted, era: noach, food: meat}
    expected: {verdict: permitted, basis: 'כירק עשב נתתי לכם את כל — "as
      the green herb I have given you everything" (Gen 9:3)'}
    dispute: null
    class: B
  - id: MEAT_limb
    input: {query: food_permitted, era: noach, food: limb_from_living}
