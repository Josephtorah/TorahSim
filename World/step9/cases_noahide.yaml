- module: meat_timeline
  tractate: Sanhedrin
  oracle: Babylonian Talmud Sanhedrin 59b:13-21 (the two-era grant) +
    57a:4-5 + 59a:6-9 (the carve-outs)
  genesis_anchor:
    unit: gen_21_blessing_blood_law
    ref: Gen.9.3-4
    claim: G21-08
    holds: the TWO-ERA ARCHITECTURE stated (one declaration replaces
      another), R. Levi's robbery-in-the-simile with its recorded
      dispute; G21-09 — the grant DRIVING the limb ban (Adam unwarned
      because ungranted), and the baraita's two-way split (the limb, and
      the blood of a living animal); the Adam-era vegetarian grant and
      dominion-as-labor seated at gen_06 (rev 2, Sanhedrin 59b read at
      its primary)
  talmud_source:
    source: 'Rav Yehudah citing Rav (59b:13): אדם הראשון לא הותר לו בשר
      לאכילה — "the first man was not permitted meat," Gen 1:29 read as
      herbs-to-you-and-the-beasts, not beasts-to-you; the sons of Noach
      permitted at Gen 9:3; the limb carved out by אך ("but," Gen 9:4)'
    walks_to: Gen 1:29-30 against Gen 9:3-4
    note: 'swarming creatures excluded from the limb ban two ways — אך
      (59b:14) or Rav Huna: דמו, whose blood is distinct from its flesh
      (59b:15); the dominion objections (fish 59b:17, fowl 59b:19,
      serpent 59b:21) all resolved as LABOR'
