    note: 'Rav Nachman bar Yitzchak (57a:12): אזהרה שלהן זו היא מיתתן —
      THEIR PROHIBITION IS THEIR DEATH-LIABILITY; the principle the
      Sabbath row (58b:25) reuses'
  cases:
  - id: NOA_EXEC_bloodshed
    input: {query: noahide_executed_for, law: bloodshed}
    expected: {verdict: executed, basis: 'explicit at Gen 9:6 — every
      rung of the ladder agrees'}
