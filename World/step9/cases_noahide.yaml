# THE NOAHIDE BLOCK — the flagship exam round of the 958-passage Talmud
# triage (owner's word 2026-09-01: "open the noahide block").
# Membership: the Sanhedrin 56a-59b sugya's 36 Genesis-tagged rows
# (R-122..R-157) + the pursuer pair (R-159/R-160) + the Noahide-offering
# trio (R-016/R-017/R-018) + the court-of-Shem row (R-015) + the
# circumcision-agent pair (R-013/R-014) = 44 rows, all read at the triage;
# 40 neighbor segments opened today (logic/oral_triage/
# noahide_exam_reading_2026-09-01.md).
# Method: THE_STEPS Step 9 — exam first, classify A/B/C, findings queued
# (F-012..F-016), compile, re-run. Unlike the Mishnah rounds these rules
# are TALMUD-ONLY LAW: no Mishnah row above them; provenance says
# talmud_source, and the "bridge" column inverts — the Talmud is not
# walking a Mishnah back to the verse, it IS the ruling body, and Genesis
# is its stated derivation. Hebrew quoted from the shelf's own ink,
# always with English beside it.

- module: noahide_seven_laws
  tractate: Sanhedrin
  oracle: Babylonian Talmud Sanhedrin 56a:24 (the baraita) + 56b:4-8 (the
    derivation) + 56b:23 (the count-for-Adam dispute) + 57a:1-7 (the
    school of Menashe's alternate system)
  genesis_anchor:
    unit: gen_08_toledot_garden_first_rule
    ref: Gen.2.16
    claim: G08-28
    holds: R. Yochanan's word-by-word derivation off the 2:16
      declare-operator (the unit's crown), the Pesikta DeRav Kahana
      accretion ladder (six to Adam, the limb added for Noach), and the
      count-for-Adam dispute (R. Yehudah idolatry only; R. Yehudah ben
      Beteira adds blasphemy; some add courts)
  talmud_source:
    source: תנו רבנן שבע מצות נצטוו בני נח — 'Our rabbis taught, seven
      commandments were the sons of Noach commanded' (Sanhedrin 56a:24) —
      courts, blasphemy, idolatry, forbidden relations, bloodshed,
      robbery, limb from the living
    walks_to: Gen 2:16 word by word (56b:4-7), bloodshed doubly at Gen
      9:6 (56b:6)
    note: 'THE TOKEN-ASSIGNMENT DISPUTE (F-012): the mainline assigns ויצו
      ("and He commanded") = courts (via Gen 18:19) and אלהים ("God") =
      idolatry; R. Yitzchak TEACHES THE INVERSION (56b:8) — ויצו =
      idolatry, אלהים = courts. G08-28 carries the inversion-side
      assignment (its Bereshit Rabbah 16:6 source), one-track.'
  cases:
  - id: NOA_7_census
    input: {query: noahide_laws_census}
    expected: {verdict: seven_laws, basis: 'courts, blasphemy, idolatry,
      forbidden relations, bloodshed, robbery, limb from the living —
      the baraita of Sanhedrin 56a:24'}
    dispute: 'the school of Menashe (57a:1-7) runs a variant seven:
      castration and mixed kinds IN (Gen 9:7, 6:20), courts and blasphemy
      OUT, with the flood indictment (Gen 6:11-12) as its derivation
      spine — both lists returned, labeled'
    class: B
  - id: NOA_7_adam_count
    input: {query: laws_commanded_to_adam}
    expected: {verdict: dispute_three_ways, basis: 'the full derivation
      hangs all on Gen 2:16; R. Yehudah — idolatry ONLY; R. Yehudah ben
      Beteira — also blasphemy; some — also courts (56b:23)'}
    dispute: recorded three ways — HELD at G08-28
    class: B
  - id: NOA_7_token_map
    input: {query: which_token_yields, token: vayetzav}
    expected: {verdict: dispute_two_ways, basis: 'ויצו ("and He
      commanded") = courts (mainline, via Gen 18:19 "he will command his
      children"); = idolatry (R. Yitzchak''s inversion, 56b:8)'}
    dispute: 'F-012 — G08-28 holds one track (the inversion side); the
      mainline assignment unheld'
    class: B_partial
  - id: NOA_7_robbery_leg
    input: {query: which_token_yields, token: every_tree}
    expected: {verdict: robbery_ban, basis: 'מכל עץ הגן ("of every tree
      of the garden") — yours and not stolen (56b:7); and the school of
      Menashe from Gen 9:3 "as the GREEN HERB" — R. Levi: like ownerless
      field growth, not like a tended garden (57a:4)'}
    dispute: null — both routes recorded, second HELD at G21-08
    class: B

