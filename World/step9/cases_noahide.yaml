  - id: SINAI_framework
    input: {query: who_is_bound, said_to_noahides: 'yes',
      repeated_at_sinai: 'yes'}
    expected: {verdict: both_bound, basis: 'the framework — said to both
      (59a:11)'}
    dispute: null
    class: C — F-015
  - id: SINAI_not_repeated
    input: {query: who_is_bound, said_to_noahides: 'yes',
      repeated_at_sinai: 'no'}
    expected: {verdict: israel_only, basis: 'said to the sons of Noach
      and not repeated — to Israel and not to them; the sugya''s worked
      example is circumcision (59b:1)'}
    dispute: null
    class: C — F-015
  - id: SINAI_sinew
    input: {query: who_is_bound, commandment: sciatic_nerve}
    expected: {verdict: israel_only_reverse_instance, basis: 'said to
      Israel (the sons of Jacob) and not the sons of Noach — "and we have
      only the sinew, per R. Yehudah" (59a:12)'}
    dispute: the effective-date dispute — HELD at G55-35
    class: B
  - id: SINAI_circumcision_scope
    input: {query: who_is_bound, commandment: circumcision}
    expected: {verdict: abraham_line_only, basis: 'two resolutions — the
