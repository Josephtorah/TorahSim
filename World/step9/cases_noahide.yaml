- module: repeated_at_sinai
  tractate: Sanhedrin
  oracle: Babylonian Talmud Sanhedrin 59a:10-12 (the framework) +
    59b:1-12 (its test cases)
  genesis_anchor:
    unit: gen_55_two_camps_wrestled_name
    ref: Gen.32.33
    claim: G55-35
    holds: the sinew INSTANCE — R. Yehudah's given-to-the-sons-of-Jacob
      framework against the sages' said-at-Sinai-written-in-place; the
      one commandment on the not-repeated-and-Israel's side of the table
  talmud_source:
    source: 'R. Yose son of R. Chanina (59a:11): כל מצוה שנאמרה לבני נח
      ונשנית בסיני לזה ולזה נאמרה — "every commandment said to the sons
      of Noach and REPEATED at Sinai was said to both"; not repeated —
      to Israel and not the sons of Noach; and the table''s one reverse
      instance is our sinew (59a:12, per R. Yehudah)'
    walks_to: 'instances on our ink: circumcision Gen 17:9-14, procreation
      Gen 9:7, the sinew Gen 32:33, the line-scope at Gen 21:12'
    note: 'F-015 — the FRAMEWORK RULE is held nowhere as a rule; and two
      circumcision-scope legs are unheld on gen_33: the
      restriction (59b:9 — אתה וזרעך, "YOU and your seed," no one else)
      and the Keturah inclusion (59b:12 — את בריתי הפר, "My covenant he
      has BROKEN," Gen 17:14)'
