  talmud_source:
    source: 'the count ladder of the school of Rav: Rav Yosef — executed
      for THREE (relations, bloodshed, blasphemy — the גש"ר mnemonic);
      Rav Sheshet — FOUR (idolatry joins); Rav Huna and all the students
      of Rav — ALL SEVEN'
