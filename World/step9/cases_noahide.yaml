- module: noahide_procedure
  tractate: Sanhedrin
  oracle: Babylonian Talmud Sanhedrin 57b:2 (the aggadah-book baraita) +
    57b:3-5 (Gen 9:5 word by word) + 57b:6 (strangulation reading) +
    57b:9 (the woman-killer resolution)
  genesis_anchor:
    unit: gen_21_blessing_blood_law
    ref: Gen.9.5-6
    claim: G21-11
    holds: conviction on ONE witness, before ONE judge, NO forewarning,
      agent-liability, fetus ('the man within a man'), execution mode
      from the verb, the source-vs-mode dispute — the whole procedure
      read word by word; the no-forewarning SECOND leg at G36-14
      (Gen 20:7, 'know that you shall surely die' said unwarned)
  talmud_source:
    source: 'בן נח נהרג בדיין א'' ובעד אחד שלא בהתראה מפי איש ולא מפי אשה
      ואפילו קרוב — "a Noahide is executed by one judge, on one witness,
      without forewarning, by a man''s testimony and not a woman''s, even
      a relative''s" (57b:2); by R. Yishmael — even for a fetus'
    walks_to: 'Gen 9:5 word by word (57b:4): "from the hand of every
      beast" — even unwarned; "I will require it... from the hand of the
      man" — even one witness; "from the hand of a MAN" — not a woman''s
      testimony; "his brother" — even a relative; and Gen 9:6 באדם ("in
      the man") for the fetus'
    note: 'F-013 — the witness-GENDER and relative-witness legs and the
      woman-killer resolution (57b:9 — "WHOEVER sheds," so a woman who
      kills IS liable) are not in G21-11''s text; queued, never fixed
      inline'
  cases:
  - id: NOA_PROC_bench
    input: {query: conviction_stands, judges: '1', witnesses: '1',
      forewarned: 'no'}
    expected: {verdict: conviction_stands, basis: 'one judge (9:5 "I will
      require it" — singular), one witness, no forewarning — each from
      its own word'}
    dispute: null
    class: B
  - id: NOA_PROC_witness_woman
    input: {query: conviction_stands, witnesses: '1',
      witness_is: woman}
    expected: {verdict: testimony_not_accepted, basis: 'מיד איש ("from
      the hand of a man") — and not from a woman''s mouth (57b:2/4)'}
    dispute: null
    class: C_partial — F-013
  - id: NOA_PROC_witness_relative
    input: {query: conviction_stands, witnesses: '1',
      witness_is: relative}
    expected: {verdict: conviction_stands, basis: 'אחיו ("his brother") —
      even a relative (57b:4)'}
    dispute: null
    class: C_partial — F-013
  - id: NOA_PROC_woman_killer
    input: {query: noahide_executed_for, law: bloodshed,
      killer: woman}
    expected: {verdict: executed, basis: 'שופך דם האדם — "WHOEVER sheds
      the blood of man," in any case (Rav Yehudah''s resolution, 57b:9)'}
    dispute: null
    class: C_partial — F-013
  - id: NOA_PROC_fetus
    input: {query: noahide_executed_for, law: bloodshed, victim: fetus}
    expected: {verdict: dispute_two_ways, basis: 'R. Yishmael: liable —
      באדם ("the man IN a man") is the embryo (57b:5); the school of
      Menashe routes באדם to execution mode (strangulation — blood kept
      in the body, 57b:6)'}
    dispute: recorded — HELD at G21-11 (both the fetus reading and the
      strangler)
    class: B

- module: noahide_relations
  tractate: Sanhedrin
  oracle: Babylonian Talmud Sanhedrin 58a:7-8 (Gen 2:24 dissected) +
    57b:10 (the adulteress) + 58b:14 (the manner of cleaving) + 58b:5-6
    (the sister proof and its deflection)
  genesis_anchor:
    unit: gen_09_helper_woman_first_speech
    ref: Gen.2.24
    claim: G09-19
    holds: the span's law crown — cleave excludes a male, his-wife
      excludes the neighbor's, one-flesh excludes the animal; the gender
      scope settled from the tail clause (the adulteress liable); the
      manner of cleaving actionable; the R. Eliezer / R. Akiva referent
      dispute dual-track
  talmud_source:
    source: 'the baraita on על כן יעזב איש את אביו ואת אמו ("therefore a
      man leaves his father and his mother"): R. Eliezer — his father =
      the father''s SISTER, his mother = the mother''s sister; R. Akiva —
      his father = the father''s WIFE, his mother = his mother literally'
    walks_to: Gen 2:24 clause by clause; the sister question presses
      Gen 20:12 and is DEFLECTED (58b:6 — 'she was his brother''s
      daughter')
    note: 'F-016 — the maternal-sister ban itself and our 20:12''s role
      as an attempted-and-deflected proof are unheld on gen_36'
