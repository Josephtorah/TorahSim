# THE ALTAR BEFORE SINAI (round 38 — Genesis exam block 9 of 12,
# 2026-09-04). The pre-Sinai offering machine: Noah's altar, Abel's
# fats, the binding's vessel, the tunic, the strip, the priesthood.
# Read-source: logic/oral_triage/genesis_block_altar_2026-09-04.md.

- module: temple_geography_gen
  tractate: Zevachim
  oracle: Zevachim 53b:7-9
  exodus_anchor: {unit: gen_72_testament_twelve, ref: Gen.49.27,
    claims: [G72-36]}
  cases:
  - id: Ze_strip
    input: {query: strip_of_benjamin}
    expected: {verdict: altar_in_the_torn_ones_portion}
    class: A

- module: atonement_map
  tractate: Zevachim
  oracle: Zevachim 88b:5-7
  exodus_anchor: {unit: gen_60_dreamer_sold, ref: Gen.37.31,
    claims: [G60-23]}
  cases:
  - id: Ze_tunic
    input: {query: tunic_atonement}
    expected: {verdict: bloodshed_by_the_dipped_tunic}
    class: A

- module: olah_protocol
  tractate: Zevachim
  oracle: Zevachim 97b:8-10
  exodus_anchor: {unit: gen_38_moriah_binding_oath, ref: Gen.22.10 + 22.13,
    claims: [G38-42]}
  cases:
  - id: Ze_vessel
    input: {query: offering_vessel_source}
    expected: {verdict: knife_proves_vessel_duty}
    class: A

- module: noah_altar
  tractate: Zevachim
  oracle: Zevachim 108b:14-16, 115b:17-18, 116a:10-15
  exodus_anchor: {unit: gen_20_exit_altar + gen_17 + gen_12, ref: Gen.8.20 + 7.16 + 4.4,
    claims: [G20-20, G17-19, G12-23]}
  cases:
  - id: Ze_outside
    input: {query: outside_slaughter_source}
    expected: {verdict: liability_at_the_offering_up}
    class: A
  - id: Ze_species
    input: {query: private_altar_species}
    expected: {verdict: all_clean_species_fit}
    class: A
  - id: Ze_came
    input: {query: self_presenting_animals}
    expected: {verdict: came_of_themselves}
    class: A
  - id: Ze_peace
    input: {query: noahide_peace_offerings}
    expected: {verdict: [peace_offered_by_fats, burnt_only]}
    class: A

- module: priesthood_transfer
  tractate: Nedarim
  oracle: Nedarim 32b:5-8
  exodus_anchor: {unit: gen_30_war_of_kings, ref: Gen.14.18,
    claims: [G30-33]}
  cases:
  - id: Ne_transfer
    input: {query: priesthood_transfer}
    expected: {verdict: from_shem_to_abraham}
    class: A
  - id: Ne_seed
    input: {query: priest_seed_excluded}
    expected: {verdict: he_and_not_his_seed}
    class: A
