edges:
  # ---- the vestments (Exod 28; 39) — sitting E3, 2026-09-06: the token census REQUIRED no edge (the span names no offering type;
  # its Exod 30 tokens at 39:38-39 — the anointing oil, the incense, the laver — point at a home not yet in `spans`, so the edge is
  # declared OWED voluntarily, as E2's was); the live calls the compile makes are declared below as CALL ----
  - {from: vestments, to: sanctuary_build, disposition: CALL, link: reference, carries: inventory,
     why: "the delivery manifest 39:33-41 hands Moses every vessel of E2's spec — 39:35 'the ark, its STAVES, and the cover' (SB.ark staves: never removed, even in the hand-off), 39:36 the table and the bread (SB.table continually), 39:37 the lampstand's lamps (SB.menorah lamps), 39:40 the court's hangings (SB.court hangings) — the run's inventory fetched from the spec's engine by live call"}
  - {from: vestments, to: priesthood, disposition: CALL, link: reference, carries: verdict,
     why: "Lev 21:10's two clauses ('on whose head the anointing oil was poured' AND 'who was consecrated to wear the garments') — the many-garmented high priest (PR.family nezer), the rending's geometry beside 28:32's 'not torn' (PR.family hair_rend), and the manifest's 'lamps of the arrangement' at 39:37 (PR.lamp_table arrangement) — the garments' law seat in Leviticus by live call"}
  - {from: vestments, to: ordinances, disposition: CALL, link: transfer, taught_by: "Mekhilta d'Rabbi Yishmael on Exod 20:23 [20:26] 1 (R. Yishmael: 'has it not already been said, make them linen breeches? — what then does that-your-nakedness-not-be-uncovered teach: no wide stride, heel beside toe')", carries: verdict,
     why: "28:42 'linen breeches to cover the flesh of NAKEDNESS' answers 20:26's 'that your NAKEDNESS not be uncovered on it' — the altar's reason clause (ORD.altar nakedness: the ramp's reason) and the garment's on one root, by live call"}
  - {from: vestments, to: yoma, disposition: CALL, link: reference, carries: procedure,
     why: "Lev 16:4's four linen garments (the sheet's white set) and 16:23's stripping (relocated after 16:25) — the Day engine's own program counter fetched by live call (YOMA.service_order) for the gold-and-white alternation of Mishnah Yoma 3 and 7"}
  - {from: vestments, to: incense_shekel, disposition: REVERSE, link: reference, carries: inventory,
     why: "CLOSED at sitting E4 (2026-09-06): cold_run_incense_shekel.py now exists and CALLS this runner (VS.order_by_name / VS.investiture for the dressing order of Exod 29:5-9 against Lev 8:7-13) — a call back would cycle, so the edge is live the other way; the delivery manifest 39:38-39 hands Moses 'the golden altar, the anointing oil, the incense of spices... the laver and its base' — E4's four institutions named as inventory; the home runner cold_run_incense_shekel.py does not exist yet)"}
  # ---- the sanctuary spec and its construction run (Exod 25-27; 35:30-38:31) — sitting E2, 2026-09-06 ----
  - {from: sanctuary_build, to: lev24, disposition: FALSE, link: none,
     why: "eleven 'under' tokens (25:35 the knob UNDER two branches; 26:19, 21, 25 two sockets UNDER a board; 26:33 the veil UNDER the clasps; 27:5 the net UNDER the altar's ledge; 36:24, 26, 30; 37:21; 38:4 the same at the run) — the spatial preposition, never the talion formula"}
  - {from: sanctuary_build, to: offerings, disposition: CALL, link: reference, carries: place,
     why: "38:1 'the altar of the BURNT OFFERING' — the run names the altar by its use, the spec (27:1-8) never does: the altar's blood geography by live call (OFF.dispatch olah:herd 'two that are four' below the red line; the peace offering's the same); 25:37's 'he shall cause its lamps to ASCEND' and 27:20's 'to cause a lamp to ascend' are the verb, homographs of the noun"}
  - {from: sanctuary_build, to: tzav, disposition: CALL, link: transfer, taught_by: "Midrash Tanchuma, Terumah 11 1-5 (Moses' objection: a wooden altar plated bronze under 'a perpetual fire shall burn on the altar', Lev 6:6)", carries: verdict,
     why: "25:7's 'stones of SETTING' (אבני מלאים) is a homograph of the installation offerings; the live call is the altar's PERPETUAL FIRE — Tanchuma Terumah 11's engineering objection at 27:1-2 (a wooden altar plated bronze under a fire that never goes out, Lev 6:6) answered by TZ.altar_machine(retention, extinguish)"}
  - {from: sanctuary_build, to: chatat, disposition: CALL, link: transfer, taught_by: "Zevachim 53a:9 (Rav Acha bar Rav Katina: 'the net to the half of the altar' — the Torah gave a partition between the upper and the lower bloods); Zevachim 10b:31 (the red line); Mishnah Middot 3:1", carries: place,
     why: "27:5 'the net to the HALF of the altar' — the red line dividing the upper bloods (the sin offering's horns, CH.blood commoner -> outer_altar_horns) from the lower (the burnt offering's 'around'); voluntary, not required by the token census"}
  - {from: sanctuary_build, to: priesthood, disposition: CALL, link: reference, carries: verdict,
     why: "27:20-21's lamp (= Lev 24:2-4 token for token) and 25:30's bread before Me continually (= Lev 24:5-9) — one function at two seats: the lamp and the table's LAW compiled at the priesthood runner (L5), fetched here at the spec's seat (PR.lamp_table); voluntary"}
  - {from: sanctuary_build, to: ordinances, disposition: CALL, link: transfer, taught_by: "Mekhilta d'Rabbi Yishmael on Exod 20:21 [20:24] 1-2 (the altar of earth's readings — R. Yishmael: not built on arches; R. Yose: slaughter on its top); Sanhedrin 16b:4 ('so shall you make' — for the generations to come)", carries: verdict,
     why: "27:8 'hollow of boards' meets 20:24 'an altar of EARTH' (the hollow altar filled with earth), 27:1's altar meets 20:25-26's hewn-stone ban and the ramp (ORD.altar earth_altar / hewn / steps / ramp / stones_source — Middot 3:3-4 compiled at E1); 25:9 'so shall you make' meets the courts' seventy-one; voluntary"}
  - {from: sanctuary_build, to: incense_shekel, disposition: REVERSE, link: reference, carries: procedure,
     why: "CLOSED at sitting E4 (2026-09-06): cold_run_incense_shekel.py now exists and CALLS this runner (SB.altar horns/base, SB.veil veil_at, SB.ark, SB.court) for the incense altar's placement and the bronze altar's members — a call back would cycle: REVERSE; the run builds what E4's spec commands — 37:25-28 the incense altar (30:1-10), 37:29 the anointing oil and incense (30:22-38), 38:8 the laver (30:17-21), 38:24-26 the half-shekel census silver (30:11-16); the spec's own 25:6 names the anointing oil and the incense among the materials; the home runner cold_run_incense_shekel.py does not exist yet — the vocabulary extended at E2 so the gate REQUIRES these edges the day it does"}
  # ---- THE INVESTITURE SPEC, THE INCENSE ALTAR, THE SHEKEL, THE LAVER, THE OIL AND THE INCENSE, THE SABBATH (Exod 29; 30; 31:12-17; 35:1-3) —
  # sitting E4, 2026-09-06: the span declared with a STUB in place, `--emit` run, twelve edges and one pointer surfaced BEFORE a cell —
  # five outbound (chatat, minchah, offerings, tzav, pesach) and seven INBOUND from every runner whose ink names the four Exod 30
  # tokens (incense / laver / shekel / anointing oil) the gate has homed here since E2 — the batch the E2/E3 tails predicted.
  # The design: this runner is a LEAF CALLER (it imports every home it names and fetches what those engines computed); each inbound
  # edge is therefore REVERSE — the home already calls this runner, a call back would cycle at load. ----
  - {from: incense_shekel, to: chatat, disposition: CALL, link: reference, carries: procedure,
     why: "29:14 'it is a SIN OFFERING' (the installation bull: horns by the finger, the base, the fats, burned outside the camp — the bull's OUTER-horn blood at 29:12 against Lev 4:7's INNER horns), 29:36 'a bull of sin offering each day... you shall purge the altar', 30:10 'from the blood of the sin offering of atonements once a year' — CH.blood / CH.carcass / CH.burn_site / CH.karet_census by live call"}
  - {from: incense_shekel, to: minchah, disposition: CALL, link: reference, carries: procedure,
     why: "29:41 'like the MEAL OFFERING of the morning and its libation' (the tamid's tenth of flour in a quarter-hin of beaten oil) and 30:9 'no burnt offering, MEAL OFFERING, or libation on it' — MIN.oil_grade / MIN.leaven / MIN.salt / MIN.adjuncts by live call (the installation basket's unleavened forms 29:2 are Lev 2:4's cakes and wafers)"}
  - {from: incense_shekel, to: offerings, disposition: CALL, link: reference, carries: procedure,
     why: "29:18 'it is a BURNT OFFERING' (the first ram whole on the altar), 29:25 'on the burnt offering', 29:28 'from their PEACE OFFERINGS' (the breast and thigh as the standing due), 29:42 'a continual burnt offering', 30:28 'the altar of the burnt offering' — OFF.dispatch(olah:flock / shelamim) and OFF.fat_inventory by live call; the census also matched 30:8's 'when Aaron RAISES the lamps' (ובהעלת) as an olah-token — a homograph of the lamp-raising verb, named here"}
  - {from: incense_shekel, to: tzav, disposition: CALL, link: reference, carries: procedure,
     why: "29:22-34 'the ram of INSTALLATION' (מלאים) at five seats — the RUN of this spec is Lev 8, compiled in the Tzav engine: TZ.installation (atomicity, commit_point, confinement, leftover) and TZ.dues_machine(breast_thigh) by live call — the spec/run pair ACROSS BOOKS"}
  - {from: incense_shekel, to: pesach, disposition: FALSE, link: none,
     why: "29:23 'from the basket of the UNLEAVENED BREAD' (המצות) — the installation basket's three bread forms (29:2: unleavened loaves, cakes mixed with oil, wafers anointed with oil — Lev 2:4's forms; Lev 8:2, 8:26, 8:31 the run's basket), not the feast of unleavened bread the token is homed to; their no-leaven rule is the meal-offering engine's (Lev 2:11), CALLED above"}
  - {from: chatat, to: incense_shekel, disposition: REVERSE, link: reference, carries: place,
     why: "Lev 4:7 'the horns of the altar of the incense of spices before the LORD in the tent of meeting' — the inner altar's SPEC is 30:1-10 (its place before the veil, 30:6); the incense engine CALLS the chatat engine for the anointed priest's blood protocol (CH.blood anointed), so this edge is live the other way; 30:10's once-a-year atonement is the Day's, not Lev 4's"}
  - {from: mishpatim, to: incense_shekel, disposition: REVERSE, link: transfer, taught_by: "Midrash Tanchuma, Ki Tisa 11 3 (R. Yehuda bar Simon: 'from the goring ox it was learned — thirty shekels', Exod 21:32)", carries: value,
     why: "Exod 21:32 'THIRTY SHEKELS of silver' — the slave tariff in the unit 30:13 defines (twenty gerah the shekel of the sanctuary); the incense engine CALLS the mishpatim engine's lemma probe (MP.has_lemma / MP.words at 21:32) to reproduce Midrash Tanchuma Ki Tisa 10's pricing of the calf's ransom FROM the goring ox's slave tariff — the derivation runs from 21:32 into 30:12, so the edge is live the other way"}
  - {from: priesthood, to: incense_shekel, disposition: REVERSE, link: reference, carries: verdict,
     why: "Lev 21:10, 21:12 'on whose head the ANOINTING OIL was poured', 'the crown of the anointing oil of his God is on him' — the oil's SPEC is 30:22-33 (poured on Aaron's head at 29:7); the incense engine CALLS PR.family(nezer) for the many-garmented high priest when the oil ceased, so the edge is live the other way"}
  - {from: tzav, to: incense_shekel, disposition: REVERSE, link: reference, carries: procedure,
     why: "Lev 7:35 'the anointing-portion of Aaron', Lev 8:2, 8:10-12, 8:30 the ANOINTING OIL poured and sprinkled, 8:11 the LAVER anointed — the run of THIS spec (29:7, 29:21 the oil; 30:18-21 the laver; 30:26-29 the anointing list); the incense engine CALLS TZ.installation for the run's atomicity, commit, confinement and leftover, so the edge is live the other way"}
  - {from: vayikra5, to: incense_shekel, disposition: REVERSE, link: reference, carries: value,
     why: "Lev 5:15 'by your valuation in silver SHEKELS by the shekel of the sanctuary' — the guilt ram priced in the unit 30:13 defines; the incense engine CALLS V5.pointers(asham_procedure) for the ram's own procedure and reads the plural's minimum (two shekels — Mishnah Zevachim 10:5, Keritot 5:2's two selas), so the edge is live the other way"}
  - {from: yoma, to: incense_shekel, disposition: REVERSE, link: reference, carries: procedure,
     why: "Lev 16:12-13 'coals... his fistfuls of fine INCENSE of spices... the cloud of the incense' — the Day's incense is 30:34-38's recipe beaten 'fine' (30:36) and 'fine of the fine' (Yoma 45a); the incense engine CALLS YOMA.service_order for the 16:12-13 step and the 16:18-19 inner-altar atonement that 30:10's 'once a year' names, so the edge is live the other way"}
  - {from: yovel, to: incense_shekel, disposition: REVERSE, link: reference, carries: value,
     why: "Lev 27:3-7, 27:16 the valuations 'by the shekel of the sanctuary', 27:25 'twenty gerah shall be the shekel' — the definition of 30:13 restated at its second seat; the incense engine CALLS YV.field_valuation()['shekel'] to read the twenty back from the yovel engine, so the edge is live the other way"}
  # ---- THE ERECTION AND THE COVENANT REPEATS (Exod 24; 31:1-11, 18; 32; 33; 34; 35:4-29; 40) — sitting E5, 2026-09-06: the span
  # declared with a STUB in place; the census surfaced TEN required edges and ELEVEN pointers before a cell existed. Five of the
  # ten are HOMOGRAPHS named here (the sin, not the sin offering; 'under the mountain'; 'My passing'; 'the iniquity of FATHERS';
  # the stones of SETTING); the true edges are the offerings at 24:5 and 32:6, the Passover's three tokens at 34:18-25, the first
  # fruits at 34:22/26, the tamid's meal offering at 40:29, and the four Exod 30 institutions the erection runs. The runner is a
  # LEAF CALLER like E4's (it imports every home it names). The two spec/run pairs E2 left undeclared (31:1-11 against 35:30-35,
  # 25:1-9 against 35:4-29) are declared here and compiled by call into the sanctuary engine. ----
  - {from: erection, to: chatat, disposition: FALSE, link: none,
     why: "32:30 'perhaps I shall atone for your SIN', 32:32 'if You will bear their SIN', 32:34 'I will visit their SIN upon them' (חטאתם / חטאתכם) — the noun 'sin', not the sin offering; no chatat is brought for the calf in the span (the calf's atonement is the ransom-less intercession, Berakhot 32a); the sin-offering engine is not imported"}
  - {from: erection, to: incense_shekel, disposition: CALL, link: reference, carries: procedure,
     why: "31:8-11 and 35:15-16, 35:28 name the incense altar, the altar of burnt offering, the laver, the anointing oil and the incense in the work-list and the donation call; 40:7/40:11/40:30 the LAVER placed and washed from, 40:9-15 the ANOINTING OIL's run commanded, 40:27 the first INCENSE burned, 40:29 the tamid — the spec of every one is E4's span: IS.laver(run/two_loci/between), IS.incense_altar(first_incense/burner), IS.oil(run_exod40/run_lev8/seven_anointed), IS.tamid(initiations/olat_tamid/two_lambs), IS.persons(washing) by live call"}
  - {from: erection, to: lev24, disposition: FALSE, link: none,
     why: "24:4 'an altar UNDER the mountain', 32:19 'and broke them UNDER the mountain' (תחת ההר) — the preposition, not the talion formula; the phrase at Deut 4:11 too"}
  - {from: erection, to: minchah, disposition: VIA, link: reference, via: incense_shekel,
     why: "40:29 'and he offered on it the burnt offering and the MEAL OFFERING' — the tamid's tenth in a quarter-hin of beaten oil (29:40-41), reached through the incense-shekel engine's tamid cells, which call the meal-offering engine (IS.tamid measures/beaten_oil/salt_by_call)"}
  - {from: erection, to: mishpatim, disposition: FALSE, link: none,
     why: "33:22 'when My glory PASSES BY' (בעבר כבדי) — the verb 'pass', not the Hebrew slave; the token's shape (עברי 'Hebrew') is the homograph the census cannot tell apart"}
  - {from: erection, to: moadim, disposition: CALL, link: transfer, taught_by: "Menachot 84b:4 ('the first fruits of the wheat harvest', Exod 34:22 — the two loaves of Lev 23:17 precede the first fruits)", carries: procedure,
     why: "34:22 'the feast of weeks, the FIRST FRUITS of the wheat harvest' — Lev 23:17's two loaves of wheat (Menachot 84b:4), MO.two_loaves() by live call; 34:26 'the first of the FIRST FRUITS of your land' — the calendar engine's first_fruits, which the moadim engine already links (MO.two_loaves()['first_fruits_link'])"}
  - {from: erection, to: offerings, disposition: CALL, link: reference, carries: procedure,
     why: "24:5 'they offered BURNT OFFERINGS and slaughtered PEACE OFFERINGS to the LORD, bulls' — OFF.dispatch(olah:herd) and OFF.dispatch(shelamim) by live call (the covenant's altar, the youths as firstborn: Zevachim 14:4's era by call into the eighth-day engine); 32:6 'they offered burnt offerings and brought peace offerings' — the calf's feast in the SAME two nouns, the negative run; 31:9, 35:16, 40:6, 40:10 'the altar of the burnt offering' and 40:29 'the burnt offering' — the tamid by IS; the census also matched 'ascend' at 24:1, 24:12, 33:1 (עלה 'go up' — the mountain), homographs of the burnt-offering noun, named here"}
  - {from: erection, to: pesach, disposition: CALL, link: reference, carries: procedure,
     why: "34:18 'the feast of UNLEAVENED BREAD you shall keep... as I commanded you' — the second seat of 23:15 (the pointer CALL below): PS.leaven_machine(window_bounds/purge_deadline) by live call through the calendar engine's matzah cell and directly; 34:19-20 'every FIRSTBORN... the firstling of a donkey... every firstborn of your sons' — the second seat of 13:12-13: PS.firstborn(donkey/human) by live call; 34:25 'the sacrifice of the feast of the PASSOVER shall not remain until morning' — PS.paschal_procedure(leftover) by live call"}
  - {from: erection, to: sanctions, disposition: FALSE, link: none,
     why: "34:7 'visiting the iniquity of FATHERS on children' (אבות) — the fathers, not the ghost-masters (ovot) the token census homes to the sanctions engine; the sanctions engine is not imported"}
  - {from: erection, to: tzav, disposition: CALL, link: transfer, taught_by: "Shabbat 87b:6 (the first of Nisan 'took ten crowns' — the erection's day is the installation's eighth)", carries: window,
     why: "35:9, 35:27 'stones of SETTING' (אבני מלאים) — the filling-stones of the ephod and breastplate, a homograph of the installation ram (miluim) the census homes to the Tzav engine; the edge is nonetheless LIVE: the erection day is the installation's eighth — TZ.installation(confinement) fetches the seven-day timer whose release (23 Adar plus seven = 1 Nisan, D8's dating) is the day of 40:17, and the scene replays it through the engine's installation daemon"}
