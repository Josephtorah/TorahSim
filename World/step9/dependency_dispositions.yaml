  - {from: moadim, to: offerings, disposition: CALL, carries: procedure, why: "23:12's lamb, 23:18's burnt offerings, 23:19's goat and the two lambs — dispatch(olah:flock / outer_chatat / communal_shelamim_and_asham)"}
