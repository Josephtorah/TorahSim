  - {from: erection, to: calendar, disposition: CALL, link: reference, carries: procedure,
     why: "34:18-26 is the SECOND SEAT of Exod 23:12-19 (and 13:12-13): the calendar engine's matzah, weekly_rest, pilgrimage, offering_windows, first_fruits, kid_in_milk cells fetched by live call and graded again at the repeat — the same functions called twice, the deltas between the seats the runner's own cells"}
  - {from: erection, to: sanctuary_build, disposition: CALL, link: reference, carries: inventory,
     why: "40:17-33 is the RUN of the placements and USE clauses the making's run dropped (SB.A_DROPPED, twenty-four verses, fetched by call and matched against Exod 40 here): the staves, the testimony, the cover, the bread, the lamps, the veil, the table north and the lampstand south; 25:1-9 against 35:4-29 (the donation's spec and run) and 31:1-11 against 35:30-35 (the craftsmen's) by SB.offering cells; SB.ark/table/menorah/veil/court/altar/build by live call"}
  - {from: erection, to: vestments, disposition: CALL, link: reference, carries: count,
     why: "40:12-15 commands the dressing whose run is Lev 8:7-13 (VS.investiture(lev8_order/exod29_order) by call); the erection's SEVEN stamps 'as the LORD commanded Moses' (40:19-32) against the vestments' run's seven (39:1-31) — VS.completion(ken_asu/kekhol/stamp_without_moses) by live call; the delivery manifest's Exod 30 line (VS.completion(e4_line))"}
  - {from: erection, to: shemini_day, disposition: CALL, link: transfer, taught_by: "Shabbat 87b:6 (the ten crowns); Mishnah Zevachim 14:4 ('when the tabernacle was erected')", carries: status,
     why: "40:17's date is the eighth day's (SD.day(date) = first_of_nisan) and its crowns (SD.fire(ten_crowns/crowns_in_this_chapter)); the eras switch at the erection (SD.eras(switch): the high places banned, the service by priests — Mishnah Zevachim 14:4's 'when the tabernacle was erected' is 40:17); Lev 9:17's 'besides the morning burnt offering' points at 40:29's tamid (SD.order(altar_inaugurated_by/tadir_first)); the youths of 24:5 are that table's firstborn"}
  - {from: erection, to: ordinances, disposition: CALL, link: reference, carries: verdict,
     why: "34:12/34:15 'lest you cut a covenant with the inhabitant' — 23:32's ban fetched (ORD.land(no_covenant/not_dwell)); 34:13 'their altars you shall break down, their pillars shatter, their asherim cut down' — 23:24's demolition by call (ORD.land(break_pillars/no_bow)); 34:14 the bow and 32:8 'they bowed and sacrificed' — the service architecture of 22:19 (ORD.capital(service_architecture/idolater_row/only_to_the_LORD)); 34:19-20's donkey — ORD.firstling(donkey_by_call)"}
  - {from: erection, to: priesthood, disposition: CALL, link: reference, carries: procedure,
     why: "40:23 'he arranged on it an arrangement of bread' and 40:25 'he raised the lamps' — the table's and the lamps' law seat is Lev 24:1-9 (PR.lamp_table(arrangement/loaves/western_lamp/evening_to_morning/sabbath_exchange) by live call); 40:3's 'screen ON the ark with the veil' is the tradition's dictionary entry for 'on' = 'beside' at Lev 24:7 (Menachot 62a)"}
