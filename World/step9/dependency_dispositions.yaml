# THE DEPENDENCY DISPOSITIONS — read by dependency_census.py, the gate that runs
# before every cold sweep (2026-09-06, the dependency-debt sitting).
#
# spans:    every cold_run_<name>.py declares the verses it compiles, as
#           [book, chapter, first, last] rows. An undeclared runner fails the gate.
# edges:    every runner -> home edge the TYPE CENSUS requires (a verse in the
#           runner's span naming an offering type or institution whose home is
#           another runner) carries a disposition:
#             CALL       a live import edge exists (verified against the source)
#             OWED       the callee is not compiled yet — why names a COMPILE_DEBT.md line (text before "|")
#             REVERSE    the home already calls THIS runner (verified); a call back would cycle
#             VIA        the type's procedure is reached through a runner this one calls (`via`, verified)
#             PARAMETER  the ink points to a quantity or datum, not a procedure
#             FALSE      a homograph (the token is not the type) — why says which
#           and may carry an UNGATED `carries:` (value / count / procedure / status /
#           window / place / inventory / verdict) naming what crosses the edge — the
#           two-thread consensus of 2026-09-06; the cell's provenance tag stays where
#           the honest fractions count an import.
# pointers: every explicit cross-reference form (as prescribed / as-when before
#           a procedure verb / the comparative kaf on an offering noun / one law)
#           at its verse carries: CALL (+ target runner, verified live) / OWED /
#           INTERNAL / RUN_CITATION / PARAMETER / FALSE, with a why.
# link:     THE LINK REVIEW LAW (owner-ruled 2026-09-07; sitting LR1 — the reception rule, logic/MIDDOT.md
#           under I2: a person does not derive a verbal analogy on his own, Pesachim 66a:12, Niddah 19b:12).
#           EVERY edge and pointer answers THE TWO QUESTIONS in a field:
#             reference     the ink names an institution and the edge calls its definition — licensed by ink
#             transfer      a rule moves between contexts on a shared word or a topic — needs a TEACHER:
#                           `taught_by:` names a sugya, a Sifra/Sifrei/Mekhilta passage, or a catalogued
#                           move (M-nn) WITH its exemplar named; the gate refuses a transfer without one
#             hypothesis    a transfer no teacher taught — kept, labeled, never counted as compiled (class H)
#             none          only with FALSE (a homograph has no link), or with a CALL from a runner whose declared
#                           span is EMPTY (the sequential run's REGISTRATION edges — O4, 2026-09-07)
#             UNCLASSIFIED  the question asked and not yet answered — the LR2 worklist (`--links` prints it)
#           A new entry without `link:` FAILS the gate ("we need to keep up with these").
# The file may never understate the code: a live import edge dispositioned as
# anything but CALL fails the gate — and, RULE 9 (O4 THE EDGE FILING, 2026-09-07), EVERY live import edge
# has its own entry here, required by the token census or not: a live edge with no entry fails; a REVERSE
# entry on the callee's side files the callee's edge, never the caller's call; every CALL entry must be live.
# The gate reads a live edge from `alias.name(`, from the registration tuple `('cold_run_x', 'fn')`, and from the
# daemon reference `alias.law_x` in a laws list (the yovel fork's exile daemon).
