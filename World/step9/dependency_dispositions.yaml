  guardians:   [[Exod, 22, 6, 14]]
  calendar:    [[Exod, 23, 10, 19]]
  offerings:   [[Lev, 1, 1, 13], [Lev, 3, 1, 17]]
  minchah:     [[Lev, 1, 14, 17], [Lev, 2, 1, 16]]
  chatat:      [[Lev, 4, 1, 35], [Lev, 10, 8, 20]]
  vayikra5:    [[Lev, 5, 1, 26]]
  tzav:        [[Lev, 6, 1, 23], [Lev, 7, 1, 38], [Lev, 8, 1, 36]]
  shemini:     [[Lev, 11, 1, 47]]
  clocks:      [[Lev, 12, 1, 8], [Lev, 15, 1, 33]]
  negaim:      [[Lev, 13, 1, 59], [Lev, 14, 33, 57]]
  metzora:     [[Lev, 14, 1, 32]]
